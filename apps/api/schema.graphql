A ticker one screener picked and the regime gate held back: that screener's PAUSED row, whose `reasons` say why
"""
type PausedIdea {
  instrumentId: String!
  instrument: Instrument
  result: ScreenResult!
}

"""
One session of a screener's pick history: how many tickers its latest run of the session picked and how many the regime gate held back (`paused`); both null when it has no run for the session, and `notRun` says why (NOT_RUN)
"""
type PickCount {
  session: Date!
  picked: Int
  paused: Int
