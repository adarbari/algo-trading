  before: [IndicatorBefore!]!
  leadTime: String!
  falseAlarms: String!
  links: [IndicatorLink!]!
  feature: String!
  value: JSON
  unknown: Unknown
  format: FeatureFormat
  status: IndicatorStatus!
  changed: Boolean
  range: IndicatorRange!
  threshold: Float
  direction: RiskDirection
  how: [TextPart!]!
  sources: [IndicatorSource!]!
