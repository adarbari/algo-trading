"""Reads for the web app, each for one session (ADR 0036)"""
type Query {
  """
  Who this request is for: the signed-in registry user, their role and workspaces (ADR 0040; not session data)
  """
  viewer: Viewer!

  """The session `date` resolves to; null: nothing stored"""
  session(
    """
    the session to read (default: the latest with bars); every value below is for exactly this date
    """
    date: Date = null
  ): Session

  """
  The instrument `key` (an instrument id or a ticker) names in the session's reference snapshot; null: no such instrument
  """
  instrument(
    key: String!

    """
    the session to read (default: the latest with bars); every value below is for exactly this date
    """
    date: Date = null
  ): Instrument

  """
  Instruments x `columns` (catalogue fields, in order) for the session: the universe, or the instruments `keys` (ids or tickers) name in that order; filtered (security type, sector, liquidity class, leveraged, optionable: case-insensitive; `q`: the symbol or name contains it), sorted by `sort` (`symbol` or a catalogue field, `-` prefix: descending, missing values last) and paged (`page` from 1, `size` rows). Null: nothing stored
  """
  table(
    columns: [FeatureName!]!
    keys: [String!] = null
    securityType: String = null
    sector: String = null
    liquidityClass: String = null
    leveraged: Boolean = null
    optionable: Boolean = null
    q: String = null
    sort: String = null
    page: Int! = 1
    size: Int! = 100

    """
    the session to read (default: the latest with bars); every value below is for exactly this date
    """
    date: Date = null
  ): FeatureTable

  """
  The events ahead of a set of names over the next `days` calendar days, one entry per day (ADR 0050): the names `instrumentIds` give (a screen's results, a list) plus, with `scope`, the site's scope list config/site/events/scope.toml only (no tier A / B names); the names' own and reference earnings on their rows, macro releases and market-structure days once. Null: nothing stored
  """
  eventCalendar(
    instrumentIds: [String!]!
    scope: Boolean! = false
    days: Int! = 90

    """
    the session to read (default: the latest with bars); every value below is for exactly this date
    """
    date: Date = null
  ): EventCalendar

  """
  The tickers the user's screeners picked in the session, ranked by their screener priority then score (the first `limit`); a screener with no run for the session is listed NOT_RUN. Null: nothing stored
  """
  ideas(
    limit: Int! = 50

    """
    the session to read (default: the latest with bars); every value below is for exactly this date
    """
    date: Date = null
  ): Ideas

  """
  The US market for the session: the market-entity features by catalogue name (ADR 0047). Null: nothing stored
  """
  market(
    """
    the session to read (default: the latest with bars); every value below is for exactly this date
    """
    date: Date = null
  ): Market

  """
  The market regime for the session as weather (Clear, Clouds building, Storm, Severe storm), with its scores, indicator cards and sizing rule; UNKNOWN with its reason when not computed for the session (ADR 0047). Null: nothing stored
  """
  regime(
    """
    the session to read (default: the latest with bars); every value below is for exactly this date
    """
    date: Date = null
  ): MarketRegime

  """
  Every rule screen the user sees (their own config, else the site preset), by id; each with its run for the session
  """
  screeners(
    """
    the session to read (default: the latest with bars); every value below is for exactly this date
    """
    date: Date = null
  ): [Screener!]!

  """
  The rule screen `id` as the user sees it (their own config, else the site preset), with its run for the session; null: no such screener, or nothing stored
  """
  screener(
    id: String!

    """
    the session to read (default: the latest with bars); every value below is for exactly this date
    """
    date: Date = null
  ): Screener

  """
  The user's saved view of the table `scope` (`screener:<id>`: a screener's results; the default view, or the one called `name`); null: a scope of no known kind, a screener the user does not see, or nothing stored yet
  """
  view(scope: String!, name: String = null): TableView

  """
  The caller's feature catalogue (the site's fields plus their own expression features), in catalogue order
  """
  catalogue: [FeatureInfo!]!

  """
  The catalogue field `name` across instruments for the session; a name outside the caller's catalogue is an UNKNOWN_FEATURE error. Null: nothing stored
  """
  distribution(
    name: FeatureName!

    """
    the session to read (default: the latest with bars); every value below is for exactly this date
    """
    date: Date = null
  ): FeatureDistribution

  """
  What the Guide holds, in its order (ADR 0051): sections with entry counts, field theme groups, intents, situations, playbooks by family, regime indicators and episodes (not session data)
  """
  guideIndex: GuideIndex

  """
  The Guide page of the catalogue field `name` (ADR 0051): its info and guide entry, related fields, the playbooks that use it and the situations that fool it; a name outside the caller's catalogue is an UNKNOWN_FEATURE error
  """
  guideField(name: FeatureName!): GuideField

  """
  The Guide page of the site playbook `id` (ADR 0051): its prose, the preset's latest version and criteria, related playbooks and the situations that fool its fields; null: no site rule-screen preset of that id
  """
  guidePlaybook(id: String!): GuidePlaybookDetail

  """
  The Guide page of the situation `slug` (ADR 0051): its signs and what to do, the fields it fools and the site playbooks reading them; null: no such situation
  """
  guideSituation(slug: String!): GuideSituationDetail

  """
  The Guide page of the regime indicator `key` (ADR 0051): its card's explanation without a session value, how it is computed, the field it reads and its reading list; null: no such card
  """
  guideIndicator(key: String!): GuideIndicatorDetail

  """
  The Guide page of the reference episode `slug` (its key, ADR 0051): the episode as its config holds it and the indicators whose before-line is about it; null: no such episode
  """
  guideEpisode(slug: String!): GuideEpisodeDetail

  """
  The glossary term `id` (ADR 0051): its entry, the body linked and the terms it refers to; null: no such term
  """
