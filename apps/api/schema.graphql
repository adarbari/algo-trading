A rule screen as the user sees it (their own config, else the site preset): `owner` is whose runs are its; `criteria` and `displayColumns` the current config's; `latestRun` its run for the session, else `notRun` says why (NOT_RUN); `pickHistory` its picked count per session over a window ending at the session
"""
type Screener {
