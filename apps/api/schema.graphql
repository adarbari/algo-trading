A screener's record over one edge's frozen period, from the edge's canonical run (the latest site run whose split is the edge's `frozenFrom`); never an exploratory run. `runLabel` names the run; `runId`, the range, `splitFrom` and `knowledgeTs` disclose it; `afterSession`: the run committed after the request's session. `notRun` says why there is none (NOT_RUN); null: it has one
