"""
One item of a run: `key` (a ticker, an instrument id, a step, a check), its status `code` (STALE_DATA) and `status` as recorded, with its detail after a colon
"""
type RunItem {
  key: String!
  code: String!
  status: String!
}

"""
One step of a nightly run: `counts` its result counts as recorded; `origin` the earlier attempt of the session that already did a reused step (null: it ran in this attempt) and `originDurationS` how long the step took there (null: that attempt's record is gone); `startedAt` when the step itself began (a reused step: in the attempt that did it; null: it never started; an estimate for a run from before it was recorded); `needs` the steps it waits for and `rerunsAfter` those whose success re-runs it, as the attempt defined them (needs null: a run from before they were recorded)
