  """
  The history of `names` (stored market fields only: `market.<group>@v<N>.<column>`; a `feature.*` name is a BAD_REQUEST, it would be computed for thousands of sessions) over the exchange sessions of `start..end` (`end` is cut to the session's date), each session from its own partition: one with no stored row is a gap, never carried forward. Numbers come as at most `points` points (2 to 5000); flags and labels as `segments`
  """
  history(names: [String!]!, start: Date!, end: Date!, points: Int! = 600): [SeriesHistory!]!
}

"""
