The verdict's basis (`variant` at `horizon` sessions) in each market regime, least to most severe. The harness stores a regime over the whole run, so a regime's in_sample and out_of_sample figures are not_stored. `state`: measured, not_stored (a run from before the regime rows, or none) or oos_hidden (a copy's out-of-sample result is withheld, and the regime rows hold it)
"""
type EdgeRegimes {
  state: String!
  variant: String
  horizon: Int
  rows: [RegimeRow!]!
}

"""
The sections of an edge's result, each about the verdict's own run and basis. Select only the sections the page shows: each is read on its own. `date` of the query resolves the session only for the live stroke and the live bar (ADR 0036): the backtest part is read by run
"""
type EdgeResult {
  id: String!

  """The run and basis every section reads"""
  basis: ResultBasis!

  """The evidence curve with the live stroke"""
  curve: EdgeCurve!

  """The drawdown and the volatility of the windows"""
  drawdown: EdgeDrawdown!

  """The lift from each year's start forward"""
  rollingStarts: EdgeRollingStarts!

  """The calendar months of the curve (the heat map)"""
  monthly: EdgeMonthly!

  """
  The decay of the edge's number, the paper's figure then the in-sample, out-of-sample and live bars of the verdict's basis; null: the verdict has no basis
  """
  decay: EdgeDecay

  """
  How the verdict's basis holds up under trading costs (ADR 0064): the win rate, lift and mean excess return at each round-trip cost the harness measured, the break-even cost and the decile spread. `state` says why there is none (not_a_cost_outcome: the outcome is not a return)
  """
  costs: EdgeCosts!

  """
  How much money the basis's picks can take (ADR 0064): the median 20-day dollar volume of the counted picks and how many trade below the site's floor, per period
  """
  capacity: EdgeCapacity!

  """
  The verdict's basis in each market regime: win rate, base rate, lift and trades per regime, whole run only (the split's two sides are not stored)
  """
  regimes: EdgeRegimes!

  """
  The verdict's screen at every holding period: in-sample, out-of-sample and whole-history lift with trades, the basis marked, and the date each out-of-sample count is expected to reach the verdict's bar
  """
  horizons: EdgeHorizons!
}

