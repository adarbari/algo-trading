When a holding period's out-of-sample count reaches the `needed` trades: `state` (projected, not_stored, beyond_projection, unprojectable, oos_hidden, reached), `have` and `remaining` trades and, when projected, `expectedBy` (the exit of the trade that completes the count) at `fillRatio` of the decision sessions measured. An estimate
