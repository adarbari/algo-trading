"""
`macroRisk` (slow, weekly), `marketStress` (fast, daily) and `fragility` (context only: it never changes the label); `macroEarly` and `macroConfirming`, the macro score's two tiers (`macroRisk` is the higher; either at or above its threshold makes macro risk high)
