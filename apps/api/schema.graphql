"""Reads for the web app, each for one session (ADR 0036)"""
type Query {
  """
  Who this request is for: the signed-in registry user, their role and workspaces (ADR 0040; not session data)
  """
  viewer: Viewer!

  """The session `date` resolves to; null: nothing stored"""
  session(
    """
    the session to read (default: the latest with bars); every value below is for exactly this date
    """
    date: Date = null
  ): Session

  """
  The instrument `key` (an instrument id or a ticker) names in the session's reference snapshot; null: no such instrument
  """
  instrument(
    key: String!

    """
    the session to read (default: the latest with bars); every value below is for exactly this date
    """
    date: Date = null
  ): Instrument

  """
  Instruments x `columns` (catalogue fields, in order) for the session: the universe, or the instruments `keys` (ids or tickers) name in that order; filtered (security type, sector, liquidity class, leveraged, optionable: case-insensitive; `q`: the symbol or name contains it), sorted by `sort` (`symbol` or a catalogue field, `-` prefix: descending, missing values last) and paged (`page` from 1, `size` rows). Null: nothing stored
  """
  table(
    columns: [FeatureName!]!
    keys: [String!] = null
    securityType: String = null
    sector: String = null
    liquidityClass: String = null
    leveraged: Boolean = null
    optionable: Boolean = null
    q: String = null
    sort: String = null
    page: Int! = 1
    size: Int! = 100

    """
    the session to read (default: the latest with bars); every value below is for exactly this date
    """
    date: Date = null
  ): FeatureTable

  """
  The events ahead of a set of names over the next `days` calendar days, one entry per day (ADR 0050): the names `instrumentIds` give (a screen's results, a list) plus, with `scope`, the site's scope list config/site/events/scope.toml only (no tier A / B names); the names' own and reference earnings on their rows, macro releases and market-structure days once. Null: nothing stored
  """
  eventCalendar(
    instrumentIds: [String!]!
    scope: Boolean! = false
    days: Int! = 90

    """
    the session to read (default: the latest with bars); every value below is for exactly this date
    """
    date: Date = null
  ): EventCalendar

  """
  The tickers the user's screeners picked in the session, ranked by their screener priority then score (the first `limit`); a screener with no run for the session is listed NOT_RUN. Null: nothing stored
  """
  ideas(
    limit: Int! = 50

    """
    the session to read (default: the latest with bars); every value below is for exactly this date
    """
    date: Date = null
  ): Ideas

  """
  The US market for the session: the market-entity features by catalogue name (ADR 0047). Null: nothing stored
  """
  market(
    """
    the session to read (default: the latest with bars); every value below is for exactly this date
    """
    date: Date = null
  ): Market

  """
  The market regime for the session as weather (Clear, Clouds building, Storm, Severe storm), with its scores, indicator cards and sizing rule; UNKNOWN with its reason when not computed for the session (ADR 0047). Null: nothing stored
  """
  regime(
    """
    the session to read (default: the latest with bars); every value below is for exactly this date
    """
    date: Date = null
  ): MarketRegime

  """
  Every rule screen the user sees (their own config, else the site preset), by id; each with its run for the session
  """
  screeners(
    """
    the session to read (default: the latest with bars); every value below is for exactly this date
    """
    date: Date = null
  ): [Screener!]!

  """
  The rule screen `id` as the user sees it (their own config, else the site preset), with its run for the session; null: no such screener, or nothing stored
  """
  screener(
    id: String!

    """
    the session to read (default: the latest with bars); every value below is for exactly this date
    """
    date: Date = null
  ): Screener

  """
  The user's saved view of the table `scope` (`screener:<id>`: a screener's results; the default view, or the one called `name`); null: a scope of no known kind, a screener the user does not see, or nothing stored yet
  """
  view(scope: String!, name: String = null): TableView

  """
  The caller's feature catalogue (the site's fields plus their own expression features), in catalogue order
  """
  catalogue: [FeatureInfo!]!

  """
  The catalogue field `name` across instruments for the session; a name outside the caller's catalogue is an UNKNOWN_FEATURE error. Null: nothing stored
  """
  distribution(
    name: FeatureName!

    """
    the session to read (default: the latest with bars); every value below is for exactly this date
    """
    date: Date = null
  ): FeatureDistribution

  """
  What the Guide holds, in its order (ADR 0051): sections with entry counts, field theme groups, intents, situations, playbooks by family, regime indicators and episodes (not session data)
  """
  guideIndex: GuideIndex

  """
  The Guide page of the catalogue field `name` (ADR 0051): its info and guide entry, related fields, the playbooks that use it and the situations that fool it; a name outside the caller's catalogue is an UNKNOWN_FEATURE error
  """
  guideField(name: FeatureName!): GuideField

  """
  The Guide page of the site playbook `id` (ADR 0051): its prose, the preset's latest version and criteria, related playbooks and the situations that fool its fields; null: no site rule-screen preset of that id
  """
  guidePlaybook(id: String!): GuidePlaybookDetail

  """
  The Guide page of the situation `slug` (ADR 0051): its signs and what to do, the fields it fools and the site playbooks reading them; null: no such situation
  """
  guideSituation(slug: String!): GuideSituationDetail

  """
  The Guide page of the regime indicator `key` (ADR 0051): its card's explanation without a session value, how it is computed, the field it reads and its reading list; null: no such card
  """
  guideIndicator(key: String!): GuideIndicatorDetail

  """
  The Guide page of the reference episode `slug` (its key, ADR 0051): the episode as its config holds it and the indicators whose before-line is about it; null: no such episode
  """
  guideEpisode(slug: String!): GuideEpisodeDetail

  """
  The glossary term `id` (ADR 0051): its entry, the body linked and the terms it refers to; null: no such term
  """
  guideTerm(id: String!): GuideTerm

  """
  The Start here page `id` (ADR 0051): its entry, the sections linked and the Guide entries it links to; null: no such page
  """
  guideStartPage(id: String!): GuideStartPage

  """
  Many Guide entries in one read (ADR 0051): the regime indicators, episodes, glossary terms and Start here pages named by `refs` (at most 100), so a page's help buttons cost one request; a ref with no entry is left out
  """
  guideEntries(refs: [GuideRef!]!): GuideEntries

  """
  Search every Guide entry for `q` (ADR 0051): at most `limit` results per kind, grouped by kind, ranked exact name, then name or title, then intent or theme, then prose (case-insensitive); not session data
  """
  guideSearch(q: String!, limit: Int! = 5): GuideSearch

  """
  Every strategy and screener config the user sees: site presets, then their own (`kind`: only `strategy` or `screener`)
  """
  configs(kind: String = null): [Config!]!

  """
  Every saved backtest run of the strategy configs the user sees, newest first
  """
  backtests: [Backtest!]!

  """
  Every edge the user sees (ADR 0053), by id: status, thesis, the screeners that implement it and its evaluation runs; not session data
  """
  edges: [Edge!]!

  """The edge `id`; null: the user has no such edge"""
  edge(id: String!): Edge

  """
  The edge `id` as one whole TOML document (extends resolved, the user's state left out): what an admin lands in config/site/edges/ by pull request to publish it site-wide (the site's config changes only by PR); null: no such edge. `user`: whose copy (an admin may publish any user's; default: their own)
  """
  publishedEdgeDocument(id: String!, user: String = null): String

  """
  Every committed evaluation run of the edge `edgeId` the user sees (theirs, then the site's), newest first; empty: no such edge or no run. Read by run, as the run left it (never by session)
  """
  edgeRuns(edgeId: String!): [EdgeRun!]!

  """The saved backtest run `runId`; null: no such backtest run"""
  backtest(runId: String!): BacktestDetail

  """
  The user's own rule screens: finalised ones and draft-only ones (status DRAFT), by id
  """
  myScreens: [ScreenListing!]!

  """
  The user's screen `screenerId` (or the site preset of that id they have not copied yet): draft, versions, preset pin, working copy. Null: no such screen
  """
  screenDetail(screenerId: String!): ScreenDetail

  """The finalised versions of the user's screen `screenerId`, oldest first"""
  screenVersions(screenerId: String!): [ScreenVersion!]!

  """The `limit` most recent nightly session runs, newest first"""
  nightlyRuns(limit: Int! = 10): [NightlyRun!]!

  """
  The run record `runId` (any job): items summarised, failures grouped by reason; null: no such run
  """
  run(runId: String!): RunDetail

  """
  Every item of the run `runId` with its status, by key; null: no such run
  """
  runItems(runId: String!): [RunItem!]

  """
  The session's data-quality checks (NOT_RUN when it has no data-quality run); null: nothing stored
  """
  quality(
    """
    the session to read (default: the latest with bars); every value below is for exactly this date
    """
    date: Date = null
  ): QualityReport

  """
  The session's live verification vs IBKR (NO_PARTITION when it did not run for the session); null: nothing stored
  """
  verification(
    """
    the session to read (default: the latest with bars); every value below is for exactly this date
    """
    date: Date = null
  ): Verification

  """
  Ingestion completeness: every dataset x the last `sessions` exchange sessions ending at the session; null: nothing stored
  """
  completeness(
    sessions: Int! = 10

    """
    the session to read (default: the latest with bars); every value below is for exactly this date
    """
    date: Date = null
  ): Completeness

  """
  One completeness cell, `dataset` on the session `date`, with the reasons behind it; null: a dataset the grid does not list
  """
  ingestionCell(dataset: String!, date: Date!): CellDetail

  """
  Listings marked for FIGI review (the universe build's list on or before the session, else its reference snapshot); null: nothing stored
  """
  figiReview(
    """
    the session to read (default: the latest with bars); every value below is for exactly this date
    """
    date: Date = null
  ): ReviewList

  """
  Active ETFs in the session's reference snapshot whose leverage the rules could not classify; null: nothing stored
  """
  leverageReview(
    """
    the session to read (default: the latest with bars); every value below is for exactly this date
    """
    date: Date = null
  ): ReviewList

  """
  What the text model spent: tokens and cost against the budget, by model, use case and user, a 30-day series and the `recent` latest calls (newest first). A date range ending today, not one session (ADR 0058)
  """
  llmUsage(recent: Int! = 50): LlmUsage

  """
  The `limit` most recent edge evaluation runs of any status, newest first: every edge the user sees, for the site and every declared user
  """
  harnessRuns(limit: Int! = 50): [HarnessRun!]!

  """The edge evaluation run `runId`, with its rows; null: no such run"""
  harnessRun(runId: String!): HarnessRun
}

"""
One NBER recession as the session knew it: `start` / `end` are the first days of its peak and trough months; `end` is null while the committee had not yet dated its end, and the announcement dates are null where none was published or it is not past
