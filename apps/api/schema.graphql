  edgeDesk(
    """
    the session to read (default: the latest with bars); every value below is for exactly this date
    """
    date: Date = null
  ): EdgeDesk

  """
  The paper record of the edge `id` as the session knew it, the owner's: the site's for a site edge (the same for every follower), the user's for their own edge. The live record against the backtest's usual range, the trades and, for a trial, the forward test; null: no such edge or nothing stored
  """
  edgePaper(
    id: String!

    """
    the session to read (default: the latest with bars); every value below is for exactly this date
    """
    date: Date = null
  ): EdgePaper

  """
  The trades of the verdict's basis of the edge `edgeId` (the screen and holding period its verdict rests on: never chosen here), one `page` (from 1) for `period`, sorted by the server (`descending`); `LIVE` reads the paper record as the session knew it. A per-name value under a licence the viewer lacks is Unknown(LICENCE); a copy's out-of-sample trades are withheld; null: no such edge
  """
  edgeTrades(
    edgeId: String!
    period: TradePeriod! = ALL
    page: Int! = 1
    sort: TradeSort! = DECISION
    descending: Boolean! = false

    """
    the session to read (default: the latest with bars); every value below is for exactly this date
    """
    date: Date = null
  ): EdgeTradePage

  """
  The variant grid of the edge `edgeId`: every screen and holding period its official run tried, the verdict's basis marked official and every other out-of-sample figure flagged as not the pre-chosen test; null: no such edge
  """
  edgeVariants(edgeId: String!): EdgeVariants

  """
  The sections of the result of the edge `id` (the evidence curve, drawdown, rolling starts, monthly map and decay), each about the verdict's own run and basis and read only when selected. `date` resolves the session of the live stroke and bar only; null: the user has no such edge
  """
  edgeResult(
    id: String!

    """
    the session to read (default: the latest with bars); every value below is for exactly this date
    """
    date: Date = null
  ): EdgeResult

  """The edge `id`; null: the user has no such edge"""
  edge(id: String!): Edge

  """
  The edge `id` as one whole TOML document (extends resolved, the user's state left out): what an admin lands in config/site/edges/ by pull request to publish it site-wide (the site's config changes only by PR); null: no such edge. `user`: whose copy (an admin may publish any user's; default: their own)
  """
  publishedEdgeDocument(id: String!, user: String = null): String

  """
  Every committed evaluation run of the edge `edgeId` the user sees (theirs, then the site's), newest first; empty: no such edge or no run. Read by run, as the run left it (never by session)
  """
  edgeRuns(edgeId: String!): [EdgeRun!]!

  """The saved backtest run `runId`; null: no such backtest run"""
  backtest(runId: String!): BacktestDetail

  """
  The user's own rule screens: finalised ones and draft-only ones (status DRAFT), by id
  """
  myScreens: [ScreenListing!]!

  """
  The features the viewer's own Describe-it drafts listed as missing over the last year, one per feature, most recently asked first: their own history only, for every role (never another user's asks, counts or spans). A date range, not one session
  """
  myFeatureRequests: [MyFeatureRequest!]!

  """
  The user's screen `screenerId` (or the site preset of that id they have not copied yet): draft, versions, preset pin, working copy. Null: no such screen
  """
  screenDetail(screenerId: String!): ScreenDetail

  """The finalised versions of the user's screen `screenerId`, oldest first"""
  screenVersions(screenerId: String!): [ScreenVersion!]!

  """The `limit` most recent nightly session runs, newest first"""
  nightlyRuns(limit: Int! = 10): [NightlyRun!]!

  """
  The run record `runId` (any job): items summarised, failures grouped by reason; null: no such run
  """
  run(runId: String!): RunDetail

  """
  Every item of the run `runId` with its status, by key; null: no such run
  """
  runItems(runId: String!): [RunItem!]

  """
  The session's data-quality checks (NOT_RUN when it has no data-quality run); null: nothing stored
  """
  quality(
    """
    the session to read (default: the latest with bars); every value below is for exactly this date
    """
    date: Date = null
  ): QualityReport

  """
  The session's live verification vs IBKR (NO_PARTITION when it did not run for the session); null: nothing stored
  """
  verification(
    """
    the session to read (default: the latest with bars); every value below is for exactly this date
    """
    date: Date = null
  ): Verification

  """
  Ingestion completeness: every dataset x the last `sessions` exchange sessions ending at the session; null: nothing stored
  """
  completeness(
    sessions: Int! = 10

    """
    the session to read (default: the latest with bars); every value below is for exactly this date
    """
    date: Date = null
  ): Completeness

  """
  One completeness cell, `dataset` on the session `date`, with the reasons behind it; null: a dataset the grid does not list
  """
  ingestionCell(dataset: String!, date: Date!): CellDetail

  """
  Option-chain coverage of the session (OK share of the optionable underlyings, by status and tier, the chronically stale names, drift); null: the session has no chains run
  """
  chainCoverage(
    """
    the session to read (default: the latest with bars); every value below is for exactly this date
    """
    date: Date = null
  ): ChainCoverage

  """
  Listings marked for FIGI review (the universe build's list on or before the session, else its reference snapshot); null: nothing stored
  """
  figiReview(
    """
    the session to read (default: the latest with bars); every value below is for exactly this date
    """
    date: Date = null
  ): ReviewList

  """
  Active ETFs in the session's reference snapshot whose leverage the rules could not classify; null: nothing stored
  """
  leverageReview(
    """
    the session to read (default: the latest with bars); every value below is for exactly this date
    """
    date: Date = null
  ): ReviewList

  """
  What the text model spent: tokens and cost against the budget, by model, use case and user, a 30-day series and the `recent` latest calls (newest first). A date range ending today, not one session (ADR 0058)
  """
  llmUsage(recent: Int! = 50): LlmUsage

  """
  The features traders asked for that the catalogue lacks, ranked (decayed distinct users x feasibility), over the last year up to today: a date range, not one session. Counts only, never a user or a span (ADR 0066)
  """
  featureRequests: FeatureRequestList

  """
  The formulas traders accepted in Describe it, grouped by fingerprint, over the last year up to today: a date range, not one session. Most users first; each says the site feature it duplicates and the backlog item it exactly matches. Counts only, never a user (ADR 0066)
  """
  acceptedFormulas: AcceptedFormulaList

  """
  The `limit` most recent edge evaluation runs of any status, newest first: every edge the user sees, for the site and every declared user
  """
  harnessRuns(limit: Int! = 50): [HarnessRun!]!

  """The edge evaluation run `runId`, with its rows; null: no such run"""
  harnessRun(runId: String!): HarnessRun
}

"""
One bar of the picture: the win rates `start` to `end` and the `chance` (0 to 1) the live win rate falls there if the backtest's held
"""
type RangeBin {
  start: Float!
  end: Float!
  chance: Float!
}

"""
One NBER recession as the session knew it: `start` / `end` are the first days of its peak and trough months; `end` is null while the committee had not yet dated its end, and the announcement dates are null where none was published or it is not past
"""
