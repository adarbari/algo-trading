  """
  catalogue: [FeatureInfo!]!

  """
  The catalogue field `name` across instruments for the session; a name outside the caller's catalogue is an UNKNOWN_FEATURE error. Null: nothing stored
  """
  distribution(
    name: FeatureName!

    """
    the session to read (default: the latest with bars); every value below is for exactly this date
    """
    date: Date = null
  ): FeatureDistribution

  """
  What the Guide holds, in its order (ADR 0051): sections with entry counts, field theme groups, intents, situations, screeners by family, regime indicators and episodes (not session data)
  """
  guideIndex: GuideIndex

  """
