  """
  edges(ids: [String!] = null): [Edge!]!

  """
  The Edges list: the edges the user sees whose id, name or thesis contains `q` (any case) and that pass `filters` (the surface `edges` of `filterSet`: the old views are the filters `mine`, `followed` and the status `rejected`), by id, with the counts of the filter bar (ADR 0082). A session is read for the live state; null: nothing stored
