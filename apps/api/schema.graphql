"""
What would change the verdict: `criterion` (the first test not passed; `level`: the verdict it gates) in `sentence`. `projections` every count of trades still short (Promising's and Works's), `nextClose` the exit of the next trade to close (the first stored exit after the run) and, for a count, `atTarget` the verdict once it is met. For a count of trades (`trades`, `works_trades`) `have` of `needed` and `remaining` to come, and `projectionState`: projected (`expectedBy`: the exit of the trade that completes the count, at `fillRatio` of the decision sessions measured), beyond_projection (the count needs more sessions than the run stored), not_stored (an older run), unprojectable (an event schedule), oos_hidden. An estimate, never an input to the verdict. Null for the other tests: a t statistic is not projected
"""
type EdgeOutlook {
  criterion: String!
  level: String!
  sentence: String!
  have: Int
  needed: Int
  remaining: Int
  projectionState: String
  expectedBy: Date
  fillRatio: Float
  cadenceSessions: Int
  projections: [CountProjection!]!
  nextClose: Date
  atTarget: AtTarget
}

