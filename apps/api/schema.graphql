}

"""
The run and the basis every section of the result reads: the verdict's own (the declared screen and holding period, else the best in-sample, fixed before the out-of-sample period was read). `variant` and `horizonSessions` are null with no basis (`unknown` says why); `splitFrom` where the run's out-of-sample side starts; `oosHidden` a copy's out-of-sample result is withheld
"""
