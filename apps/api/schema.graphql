  """
  What is coming for it as of the session (ADR 0050): the events of the next `days` calendar days (own and a fund's reference earnings, macro releases, market-structure days), its 8-Ks of the last `months`, the 7-90 day expiry ladder and a leveraged fund's reference, with the parts not known for the session
  """
  eventStudy(days: Int! = 90, months: Int! = 24): InstrumentEvents

  """The option chain stored for the session (null: none stored for it)"""
  chain: OptionChain

  """
  An ETF's `top` largest holdings as of the issuer's date the session sees (null: not an ETF)
  """
  holdings(top: Int! = 10): Holdings

  """Daily bars of `start..end` (`end` null: the session's date), adjusted"""
  prices(start: Date!, end: Date = null, adjustment: Adjustment! = SPLITS): PriceSeries!

  """
  `names` (catalogue features with a history: not instrument.*) per stored session of `start..end` (`end` null: the session's date)
  """
  series(names: [FeatureName!]!, start: Date!, end: Date = null): FeatureSeries!

  """
  The user's screeners that picked it in the session (each one's run for exactly the session), by screener id; empty: none did, or none ran
  """
  screenerHits: [ScreenerHit!]!
}

"""
What is coming for the instrument as of the session: the events of the next `days` days (oldest first), the 8-Ks of the last `months` (newest first), the expiry ladder, a leveraged fund's reference (null: not one, or not known: see `gaps`) and the parts not known for the session. Event rows are those known on or before the session (ADR 0050); catalogue values and the chain exactly the session's (ADR 0036)
"""
type InstrumentEvents {
  instrumentId: String!
  session: Date!
  days: Int!
  months: Int!
  ahead: [AheadEvent!]!
  filings: [Filing!]!
  ladder: [LadderRung!]!
  reference: FundReference
  gaps: [EventGap!]!
}

"""
The `JSON` scalar type represents JSON values as specified by [ECMA-404](https://ecma-international.org/wp-content/uploads/ECMA-404_2nd_edition_december_2017.pdf).
