}

"""
A market (`marketId` `MKT:US`) for the session. Per-session values (breadth, trend, the regime's inputs) are market catalogue features: `features(names)`
"""
type Market {
  session: Date!
  marketId: String!

  """
  The values of `names` (market catalogue fields: `market.<group>@v<N>.<column>`, or a `feature.<name>` over them; in the order asked) for the session; a name outside the market's catalogue is an UNKNOWN_FEATURE error
  """
