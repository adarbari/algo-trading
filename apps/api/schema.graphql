"""
An edge document (ADR 0053): status, thesis, the screeners and baselines that implement it, its `frozenFrom` (null: no frozen period) and the run it cites; `status` is the one status (a site edge's the site's, the user's own edge's theirs, with `statusSince` and `statusReason` for a rejection or retirement); `followed` / `followedSince`: the user bookmarked a site edge; the permanent `labels` the server decided and `oosRevealed`; `mine`: the document is the user's own (a copy or a new edge), `extends` the edge it is a copy of, `replaces` the edge a candidate would replace, `oosHidden` its out-of-sample result is withheld; `state`, `since` and `stateReason` are deprecated (the old state words, derived) until the web speaks status
"""
type Edge {
  id: String!
  name: String!
  status: String!
  thesis: String!
  mechanism: String!
  persistence: String!
  schedule: String!
  horizons: [Int!]!
  screeners: [String!]!
  baselines: [String!]!
  variants: [String!]!
  frozenFrom: Date
  evidence: EdgeEvidence
  rejectionReason: String!
  sources: [EdgeSource!]!
  definition: EdgeDefinition!
  followed: Boolean!
  followedSince: Date
  statusSince: Date
  statusReason: String!
  state: String! @deprecated(reason: "Use status and followed: researching, or following when bookmarked")
  since: Date @deprecated(reason: "Use followedSince or statusSince")
  stateReason: String! @deprecated(reason: "Use statusReason")
  labels: [String!]!
  oosRevealed: Boolean!
  oosHidden: Boolean!
  mine: Boolean!
  extends: String
  replaces: String
  settings: EdgeSettings

  """
  The latest committed site run whose split is `frozenFrom`; null: none (see `canonicalNotRun`). An exploratory or older split is never shown here
  """
  canonicalRun: EdgeRun

  """Why it has no canonical run (NOT_RUN); null: it has one"""
  canonicalNotRun: Unknown

  """
  Every committed run of the edge the user sees (theirs, then the site's), newest first, exploratory ones flagged
  """
  runs: [EdgeRun!]!

  """
  The most variants any run of the edge recorded as tried (the multiple-testing disclosure the builder shows); 0: none. Reads this edge's run records only
  """
  variantsTried: Int!

  """
  The verdict on the official result (a site edge: the canonical run; the user's own edge: their latest run, judged on in-sample figures while `oosHidden`): Works, Promising, Not working, Not enough data or Waiting on data, with the reason, the figures it rests on and its criteria (ED8)
  """
  verdict: EdgeVerdict!

  """
  The headline of `verdict` (label, result, trades, lift, basis) for a list: always equal to those fields of `verdict`, read without the pieces a list never shows
  """
  summary: EdgeSummary!

  """
  The user's own edge against the edge it extends and its baselines, in-sample only while `oosHidden`; null for a site edge
  """
  compare: EdgeCompare
}

