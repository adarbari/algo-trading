"""
One page of a run's rows matching the filters, in the sort order (`total`: every page). `rows[i][j]` is the catalogue column `columns[j]` for `results[i]`, null exactly when `unknown[i][j]` says why (`reasons[i][j]`: its NullReason when EXPLAINED; `kinds[i][j]`: its public kind, how a cell is drawn). `unavailable`: what the tables the search and sort read have nothing for the session leave out
"""
type ScreenResultPage {
  runId: String!
  sort: String!
  total: Int!
  page: Int!
  size: Int!
  columns: [FeatureInfo!]!
  results: [ScreenResult!]!
  rows: [[JSON]!]!
  unknown: [[UnknownCode]!]!
  reasons: [[NullReason]!]!
  kinds: [[UnavailableKind]!]!
  unavailable: [Unavailable!]!

  """The words of each kind `kinds` uses: how a cell's kind reads"""
