}

"""
One calendar year of the verdict's basis; `period`: in_sample, out_of_sample or both (the split falls inside the year); `liftPts`: win rate minus base rate, in points
"""
type VerdictYear {
  year: String!
  period: String!
  winRate: Float
  baseRate: Float
  liftPts: Float
  decileSpread: Float
  trades: Int
}

"""
The session's live verification vs IBKR (verification/ibkr): `counts` rows per status (PASS / WARN / FAIL / NA), `byCheck` most failures first, `failing` FAIL then WARN rows (at most 50: instrument_id, symbol, check, status, ours, theirs, diff, tolerance, note), largest diff first; `unknown` NO_PARTITION when it did not run for the session
"""
type Verification {
  session: Date!
  runIds: [String!]!
  instruments: Int!
  counts: JSON!
  byCheck: [CheckCounts!]!
  failing: [JSON!]!
  unknown: Unknown
}

"""
The user this request is for: the registry user the token maps to, their `role` (admin or trader) and the `workspaces` (trader, admin) the role opens; the web's role gate reads it, the server enforces it
"""
type Viewer {
  id: String!
  name: String!
  role: String!
  workspaces: [String!]!
}
