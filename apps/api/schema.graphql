"""
A listed expiry 7 to 90 days out: the events it spans (dated on or before it: an after-close report on the expiry date is inside it) and whether it is `clear` (it spans none but market-structure days); `marked` the last clear rung (the longest expiry still clear of earnings and macro events; none when no rung is clear)
"""
