  user: String!
  draft: JSON
  draftError: String
  versions: [Int!]!
  latest: Int
  preset: PresetPin
  error: String
  working: JSON
}

"""
A group of criteria (ADR 0071): its `kind` (`all`, `any` or `none`), its `members` (criterion and group ids, in funnel order) and its `parent` group (null: a gate). In a result, `outcome` is the group's PASS / NEAR / FAIL / MISSING for the instrument and `decidedBy` the member that decided it; both are null in a screen's definition
"""
type ScreenGroup {
  id: String!
  kind: String!
  members: [String!]!
  parent: String
  outcome: String
