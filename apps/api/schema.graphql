How far the curve fell and how much it moves: the `points` below its high, its deepest `episodes`, the deepest drop of each side of the split (`maxInSample`, `maxOutOfSample`: positive; the out-of-sample side from its own first window) and the annualised volatility of the windows of each side (null: fewer than two windows). Measured on the per-window curve, so it understates a dip inside a window. `state`: measured, not_a_return (the outcome has no return to fall) or not_stored (no series: `unknown` says why)
