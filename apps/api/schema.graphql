  """
  Who the run picked, read from the run's rows alone (cheap: no criterion values); `size` ids at most, in rank order
  """
  pickIds(size: Int! = 100): PickIds!

  """
  Its rows as a review table: `decisions` (none: all; any case), `change` (`new` / `dropped`) and `q` (the symbol or name contains it) filtered, sorted by `sort` (`rank`, `score`, `symbol`, `decision`, `change`, `criterion:<id>`, `column:<name>` or a catalogue name; `-` prefix: descending; missing values last; default: rank) and paged (`page` from 1, `size` rows), with the catalogue `columns` for the page's rows
  """
  results(decisions: [String!] = null, change: String = null, q: String = null, sort: String = null, columns: [FeatureName!] = null, page: Int! = 1, size: Int! = 100): ScreenResultPage!
}

"""
One market field over a window. A number: `points` (oldest first), one bucket of `bucketSessions` consecutive sessions yielding its minimum and its maximum at their own sessions; a null `value` is a gap that breaks the line; `segments` is empty. A flag or a label: `segments`, `points` empty, `bucketSessions` 1
