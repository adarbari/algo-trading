One indicator card with its value for the session: the plain-language text first, the technical name and `value` behind it. `value` is null exactly when `unknown` says why (format it with `format`); `status` is the indicator's own verdict and `changed` whether it differs from 5 sessions earlier (null: not stored; the verdict's field is `verdictFeature`). `pace`: slow (macro) or fast (market). `range` is the meter's display range and `threshold` the site's primary threshold (both in the value's stored unit; null: no rule in code), `direction` the side that is the risk; `how` the calculation as linked parts; `sources` where the value comes from. `range` and `threshold` format with `format`; when `format` is null (NOT_IN_CATALOGUE) the web falls back to NUMBER
