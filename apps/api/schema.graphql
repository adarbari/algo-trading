  regime(
    """
    the session to read (default: the latest with bars); every value below is for exactly this date
    """
    date: Date = null
  ): MarketRegime

  """
  Every rule screen the user sees (their own config, else the site preset), by id; each with its run for the session
  """
  screeners(
    """
    the session to read (default: the latest with bars); every value below is for exactly this date
    """
    date: Date = null
  ): [Screener!]!

  """
  The Screeners list: the screeners the user sees whose id, name or description contains `q` (any case) and that pass `filters` (the surface `screeners` of `filterSet`), by id, with the counts of the filter bar (ADR 0082)
  """
  screenerList(
    filters: [FilterInput!] = null
    q: String = null

    """
    the session to read (default: the latest with bars); every value below is for exactly this date
    """
    date: Date = null
  ): ScreenerList

  """
  The rule screen `id` as the user sees it (their own config, else the site preset), with its run for the session; null: no such screener, or nothing stored
  """
  screener(
    id: String!

    """
    the session to read (default: the latest with bars); every value below is for exactly this date
    """
    date: Date = null
  ): Screener

  """
  The user's saved view of the table `scope` (`screener:<id>`: a screener's results; the default view, or the one called `name`); null: a scope of no known kind, a screener the user does not see, or nothing stored yet
  """
  view(scope: String!, name: String = null): TableView

  """
  The filters of `surface` (ideas, screener_results, universe) for the caller: the ones they may use with their options and bins, and the ones a data licence withholds (ADR 0082). Not found: no such surface
