The sizing rule in force for the caller: new positions are sized at `multiplier` of the normal size while the regime is `label` (null: the regime is UNKNOWN). `enabled`: the gate is on (off: sizes are 100% and nothing pauses); `multipliers` per label (the site's `[regime]`), `unknownMultiplier` for a label not stored, and `screeners`: each of the caller's screeners with the labels it pauses in
