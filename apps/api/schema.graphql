  oosTrades: Int
  winRate: Float
  baseRate: Float
  liftPts: Float
  lift: Float
  decileSpread: Float
  decileT: Float
  sharpe: Float
  deflatedSharpe: Float
  pbo: Float
  criteria: [VerdictCriterion!]!
  years: [VerdictYear!]!
  trials: Int
  deciles: [Float]!
  robustness: Robustness
  columns: [VerdictColumn!]!
