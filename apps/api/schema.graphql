  """
  The Guide page of the site edge `id` (ADR 0051), from its document alone: thesis, the other side of the trade, why it lasts, the published figure with a planning haircut, how it is tested and built, what fools it, sources and related edges; a user's own edge is never served; null: no such site edge
  """
  guideEdge(id: String!): GuideEdgeEntry

  """
