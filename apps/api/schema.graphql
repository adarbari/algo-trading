  indicators: [RegimeIndicator!]!
  sizing: RegimeSizing!
  unknownReason: Unknown

  """
  The regime label of every exchange session of `start..end` (`end` on or before the session's date), consecutive equal labels merged into bands, oldest first; a session with no stored label is an UNKNOWN band
  """
  bands(start: Date!, end: Date!): [RegimeBand!]!

  """
  The reference drawdowns the session knows (those whose trough has come), oldest first
  """
