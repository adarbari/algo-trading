"""
The figure the literature reports for the edge: `measure` (mean_excess, decile_spread or lift_pts) equal to `value` over `horizonSessions`, from `source` over `sample` years (null: not stated); `leg`: what the figure is of (long_short or long)
"""
type EdgePublished {
