  feasibility: String!
  span: String
  askedBeforeToday: Boolean!
}

"""
The newest session after the one served that is still processing, failing (ADR 0062) or complete but not yet published (`PUBLISHING`, ADR 0077): its `date`, its `state`, and for a failure the public `kind` only (never the step or its cause: ADR 0056)
"""
type NewerSession {
  date: Date!
  state: NewerState!
