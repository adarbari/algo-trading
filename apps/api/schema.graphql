"""
A criterion of a screen, in funnel order: the field it judges, its `mode` and its rule as the config states it: the operator `op` and the threshold `value` in the field's stored unit (a number, a string or boolean, a list for `in` / `between`; null: the operator takes none); `group` is the id of the group it sits in (null: a gate, ADR 0071)
"""
type ScreenCriterion {
  id: String!
  field: String!
  mode: String!
  op: String!
  value: JSON
  group: String
}

"""
A screen of the user (or a preset not copied yet): the `draft` and why it would not finalise (`draftError`), its `versions`, the `preset` it is pinned to, why the latest version does not resolve (`error`) and `working`, the rule keys the Builder edits
"""
