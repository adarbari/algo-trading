"""Reads for the web app, each for one session (ADR 0036)"""
type Query {
  """
  Who this request is for: the signed-in registry user, their role and workspaces (ADR 0040; not session data)
  """
  viewer: Viewer!

  """The session `date` resolves to; null: nothing stored"""
  session(
    """
    the session to read (default: the latest with bars); every value below is for exactly this date
    """
    date: Date = null
  ): Session

  """
  The instrument `key` (an instrument id or a ticker) names in the session's reference snapshot; null: no such instrument
  """
  instrument(
    key: String!

    """
    the session to read (default: the latest with bars); every value below is for exactly this date
    """
    date: Date = null
  ): Instrument

  """
  Instruments x `columns` (catalogue fields, in order) for the session: the universe, or the instruments `keys` (ids or tickers) name in that order; filtered (security type, sector, liquidity class, leveraged, optionable: case-insensitive; `q`: the symbol or name contains it), sorted by `sort` (`symbol` or a catalogue field, `-` prefix: descending, missing values last) and paged (`page` from 1, `size` rows). Null: nothing stored
  """
  table(
    columns: [FeatureName!]!
    keys: [String!] = null
    securityType: String = null
    sector: String = null
    liquidityClass: String = null
    leveraged: Boolean = null
    optionable: Boolean = null
    q: String = null
    sort: String = null
    page: Int! = 1
    size: Int! = 100

    """
    the session to read (default: the latest with bars); every value below is for exactly this date
    """
    date: Date = null
  ): FeatureTable

  """
  The tickers the user's screeners picked in the session, ranked by their screener priority then score (the first `limit`); a screener with no run for the session is listed NOT_RUN. Null: nothing stored
  """
  ideas(
    limit: Int! = 50

    """
    the session to read (default: the latest with bars); every value below is for exactly this date
    """
    date: Date = null
  ): Ideas

  """
  The US market for the session: the market-entity features by catalogue name (ADR 0047). Null: nothing stored
  """
  market(
    """
    the session to read (default: the latest with bars); every value below is for exactly this date
    """
    date: Date = null
  ): Market

  """
  The market regime for the session as weather (Clear, Clouds building, Storm, Severe storm), with its scores, indicator cards and sizing rule; UNKNOWN with its reason when not computed for the session (ADR 0047). Null: nothing stored
  """
  regime(
    """
    the session to read (default: the latest with bars); every value below is for exactly this date
    """
    date: Date = null
  ): MarketRegime

  """
  Every rule screen the user sees (their own config, else the site preset), by id; each with its run for the session
  """
  screeners(
    """
    the session to read (default: the latest with bars); every value below is for exactly this date
    """
    date: Date = null
  ): [Screener!]!

  """
  The rule screen `id` as the user sees it (their own config, else the site preset), with its run for the session; null: no such screener, or nothing stored
  """
  screener(
    id: String!

    """
    the session to read (default: the latest with bars); every value below is for exactly this date
    """
    date: Date = null
  ): Screener

  """
  The user's saved view of the table `scope` (`screener:<id>`: a screener's results; the default view, or the one called `name`); null: a scope of no known kind, a screener the user does not see, or nothing stored yet
  """
  view(scope: String!, name: String = null): TableView

  """
  The caller's feature catalogue (the site's fields plus their own expression features), in catalogue order
  """
  catalogue: [FeatureInfo!]!

  """
  The catalogue field `name` across instruments for the session; a name outside the caller's catalogue is an UNKNOWN_FEATURE error. Null: nothing stored
  """
  distribution(
    name: FeatureName!

    """
    the session to read (default: the latest with bars); every value below is for exactly this date
    """
    date: Date = null
  ): FeatureDistribution

  """
  Every strategy and screener config the user sees: site presets, then their own (`kind`: only `strategy` or `screener`)
  """
  configs(kind: String = null): [Config!]!

  """
  Every saved backtest run of the strategy configs the user sees, newest first
  """
  backtests: [Backtest!]!

  """The saved backtest run `runId`; null: no such backtest run"""
  backtest(runId: String!): BacktestDetail

  """
  The user's own rule screens: finalised ones and draft-only ones (status DRAFT), by id
  """
  myScreens: [ScreenListing!]!

  """
  The user's screen `screenerId` (or the site preset of that id they have not copied yet): draft, versions, preset pin, working copy. Null: no such screen
  """
  screenDetail(screenerId: String!): ScreenDetail

  """The finalised versions of the user's screen `screenerId`, oldest first"""
  screenVersions(screenerId: String!): [ScreenVersion!]!

  """The `limit` most recent nightly session runs, newest first"""
  nightlyRuns(limit: Int! = 10): [NightlyRun!]!

  """
  The run record `runId` (any job): items summarised, failures grouped by reason; null: no such run
  """
  run(runId: String!): RunDetail

  """
  Every item of the run `runId` with its status, by key; null: no such run
  """
  runItems(runId: String!): [RunItem!]

  """
  The session's data-quality checks (NOT_RUN when it has no data-quality run); null: nothing stored
  """
  quality(
    """
    the session to read (default: the latest with bars); every value below is for exactly this date
    """
    date: Date = null
  ): QualityReport

  """
  The session's live verification vs IBKR (NO_PARTITION when it did not run for the session); null: nothing stored
  """
  verification(
    """
    the session to read (default: the latest with bars); every value below is for exactly this date
    """
    date: Date = null
  ): Verification

  """
  Ingestion completeness: every dataset x the last `sessions` exchange sessions ending at the session; null: nothing stored
  """
  completeness(
    sessions: Int! = 10

    """
    the session to read (default: the latest with bars); every value below is for exactly this date
    """
    date: Date = null
  ): Completeness

  """
  One completeness cell, `dataset` on the session `date`, with the reasons behind it; null: a dataset the grid does not list
  """
  ingestionCell(dataset: String!, date: Date!): CellDetail

  """
  Listings marked for FIGI review (the universe build's list on or before the session, else its reference snapshot); null: nothing stored
  """
  figiReview(
    """
    the session to read (default: the latest with bars); every value below is for exactly this date
    """
    date: Date = null
  ): ReviewList

  """
  Active ETFs in the session's reference snapshot whose leverage the rules could not classify; null: nothing stored
  """
  leverageReview(
    """
    the session to read (default: the latest with bars); every value below is for exactly this date
    """
    date: Date = null
  ): ReviewList
}

"""
One NBER recession as the session knew it: `start` / `end` are the first days of its peak and trough months; `end` is null while the committee had not yet dated its end, and the announcement dates are null where none was published or it is not past
"""
type Recession {
  start: Date!
  end: Date
  announcedStart: Date
  announcedEnd: Date
}

"""
Consecutive sessions `start..end` (the first and last of the run) with the same regime label; UNKNOWN where none is stored
"""
type RegimeBand {
  start: Date!
  end: Date!
  label: RegimeLabel!
}

"""
One indicator card with its value for the session: the plain-language text first, the technical name and `value` behind it. `value` is null exactly when `unknown` says why (format it with `format`); `status` is the indicator's own verdict and `changed` whether it differs from 5 sessions earlier (null: not stored). `pace`: slow (macro) or fast (market)
"""
type RegimeIndicator {
  key: String!
  pace: String!
  plainName: String!
  technicalName: String!
  oneLiner: String!
  whyItMatters: String!
  whatOnMeans: String!
  before: [IndicatorBefore!]!
  leadTime: String!
  falseAlarms: String!
  links: [IndicatorLink!]!
  feature: String!
  value: JSON
  unknown: Unknown
  format: FeatureFormat
  status: IndicatorStatus!
  changed: Boolean
}

"""The regime; UNKNOWN when it is not stored"""
enum RegimeLabel {
  CALM
  CAUTION
  STRESS
  CRISIS
  UNKNOWN
}

"""A 0-100 score; `value` is null exactly when `unknown` says why"""
type RegimeScore {
  value: Float
  unknown: Unknown
}

"""
`macroRisk` (slow, weekly), `marketStress` (fast, daily) and `fragility` (context only: it never changes the label)
"""
type RegimeScores {
  macroRisk: RegimeScore!
  marketStress: RegimeScore!
  fragility: RegimeScore!
}

"""
The sizing rule in force for the caller: new positions are sized at `multiplier` of the normal size while the regime is `label` (null: the regime is UNKNOWN). `enabled`: the gate is on (off: sizes are 100% and nothing pauses); `multipliers` per label (the site's `[regime]`), `unknownMultiplier` for a label not stored, and `screeners`: each of the caller's screeners with the labels it pauses in
"""
type RegimeSizing {
  label: RegimeLabel!
  multiplier: Float
  enabled: Boolean!
  multipliers: [LabelSize!]!
  unknownMultiplier: Float!
  screeners: [ScreenerGate!]!
}

"""One of the screen's display columns for the instrument"""
type ResultColumn {
  name: String!
  value: JSON
}

"""
Rows to review: `session` the snapshot or run they come from (null: nothing stored), `source` a run id or the reference table, `items` one row each
"""
type ReviewList {
  session: Date
  source: String!
  items: [JSON!]!
}

"""
One run record: `job` (daily_bars, option_chains, nightly, screen-...), `itemsByStatus` status code -> count (most common first), `failures` largest group first, `stats` as recorded (counts, audit, errors)
"""
type RunDetail {
  runId: String!
  job: String!
  session: Date!
  status: String!
  startedAt: DateTime!
  finishedAt: DateTime
  durationS: Float
  itemsTotal: Int!
  itemsByStatus: JSON!
  failures: [FailureGroup!]!
  stats: JSON!
}

"""
One item of a run: `key` (a ticker, an instrument id, a step, a check), its status `code` (STALE_DATA) and `status` as recorded, with its detail after a colon
"""
type RunItem {
  key: String!
  code: String!
  status: String!
}

"""One step of a nightly run: `counts` its result counts as recorded"""
type RunStep {
  name: String!
  status: String!
  durationS: Float
  reason: String
  error: String
  counts: JSON!
}

"""A display column of a screen: its name and catalogue field"""
type ScreenColumn {
  name: String!
  field: String!
}

"""A criterion of a screen, in funnel order: the field it judges"""
type ScreenCriterion {
  id: String!
  field: String!
  mode: String!
}

"""
A screen of the user (or a preset not copied yet): the `draft` and why it would not finalise (`draftError`), its `versions`, the `preset` it is pinned to, the latest version resolved (`hash`, `layers`, `resolved`, `error`) and `working`, the rule keys the Builder edits
"""
type ScreenDetail {
  screenerId: String!
  user: String!
  draft: JSON
  draftError: String
  versions: [Int!]!
  latest: Int
  preset: PresetPin
  hash: String
  layers: [String!]!
  resolved: JSON
  error: String
  working: JSON
}

"""
One of the user's screens: `status` FINAL (has a finalised version) or DRAFT (a draft only); `presetId` the site preset it extends
"""
type ScreenListing {
  screenerId: String!
  status: String!
  latest: Int
  hasDraft: Boolean!
  presetId: String
}

"""
One instrument's row of a screener's run; `instrument` is null when the session's reference snapshot does not have it. `change`: `new` (picked now, not by the previous run) or `dropped` (the reverse); null when the same or not compared (Ideas); `previousDecision`: the previous run's. `regime` / `sizeMultiplier`: the session's regime label and the size the gate applied, as the run stamped them (null: gate off, regime unknown, or a run before the stamp); a PAUSED row says why first in `reasons`
"""
type ScreenResult {
  runId: String!
  configId: String!
  instrumentId: String!
  instrument: Instrument
  rank: Int!
  decision: String!
  score: Float
  tieBreak: Float
  reasons: String!
  flags: [String!]!
  criteria: [CriterionResult!]!
  columns: [ResultColumn!]!
  change: String
  previousDecision: String
  regime: String
  sizeMultiplier: Float
}

"""
One page of a run's rows matching the filters, in the sort order (`total`: every page). `rows[i][j]` is the catalogue column `columns[j]` for `results[i]`, null exactly when `unknown[i][j]` says why (`reasons[i][j]`: its NullReason when EXPLAINED). `missing`: tables the search and sort read with nothing for the session
"""
type ScreenResultPage {
  runId: String!
  sort: String!
  total: Int!
  page: Int!
  size: Int!
  columns: [FeatureInfo!]!
  results: [ScreenResult!]!
  rows: [[JSON]!]!
  unknown: [[UnknownCode]!]!
  reasons: [[NullReason]!]!
  missing: [String!]!
}

"""A finalised (immutable) version of a screen and its document"""
type ScreenVersion {
  version: Int!
  document: JSON!
}

"""
A rule screen as the user sees it (their own config, else the site preset): `owner` is whose runs are its; `criteria` and `displayColumns` the current config's; `latestRun` its run for the session, else `notRun` says why (NOT_RUN)
"""
type Screener {
  id: String!
  owner: String!
  scope: String!
  name: String!
  version: Int
  hash: String!
  criteria: [ScreenCriterion!]!
  displayColumns: [ScreenColumn!]!

  """Its run for the session; null: not run for it (see `notRun`)"""
  latestRun: ScreenerRun

  """Why it has no run for the session (NOT_RUN); null: it has one"""
  notRun: Unknown
}

"""
One of the caller's screeners and the labels its picks are PAUSED in, calmest first, as the config layers resolve it for them; `enabled`: its `[regime]` gate is on (off, nothing is paused)
"""
type ScreenerGate {
  screenerId: String!
  name: String!
  enabled: Boolean!
  pauseIn: [RegimeLabel!]!
}

"""
A screener that picked the instrument in the session (its run for exactly the session), and its result for it
"""
type ScreenerHit {
  screener: Screener!
  result: ScreenResult!
}

"""
A screener's run for the session: whose, which version ran, its run record's status and `audit` (coverage, the selection's audit), and every decision with its count over the whole run (`picked`: the tickers it picked, `paused`: the picks the regime gate held back, never counted as picked; `regime`: the label the run stamped, null when the gate was off or the label unknown)
"""
type ScreenerRun {
  runId: String!
  configId: String!
  owner: String!
  session: Date!
  status: String
  knowledgeTs: DateTime!
  configVersion: Int
  decisions: [DecisionCount!]!
  picked: Int!
  paused: Int!
  regime: String
  audit: JSON!

  """
  The session of the previous run it is compared with; null: none (nothing is new or dropped)
  """
  previousSession: Date

  """
  How many tickers are `new` / `dropped` since the previous run, over the whole run; empty: no previous run
  """
  changes: [ChangeCount!]!

  """
  Its rows as a review table: `decisions` (none: all; any case), `change` (`new` / `dropped`) and `q` (the symbol or name contains it) filtered, sorted by `sort` (`rank`, `score`, `symbol`, `decision`, `change`, `criterion:<id>`, `column:<name>` or a catalogue name; `-` prefix: descending; missing values last; default: rank) and paged (`page` from 1, `size` rows), with the catalogue `columns` for the page's rows
  """
  results(decisions: [String!] = null, change: String = null, q: String = null, sort: String = null, columns: [FeatureName!] = null, page: Int! = 1, size: Int! = 100): ScreenResultPage!
}

"""
One market field over a window. A number: `points` (oldest first), one bucket of `bucketSessions` consecutive sessions yielding its minimum and its maximum at their own sessions; a null `value` is a gap that breaks the line; `segments` is empty. A flag or a label: `segments`, `points` empty, `bucketSessions` 1
"""
type SeriesHistory {
  name: String!
  bucketSessions: Int!
  points: [HistoryPoint!]!
  segments: [HistorySegment!]!
}

"""One session's values, in the order of `FeatureSeries.names`"""
type SeriesPoint {
  session: Date!
  values: [JSON]!
}

"""
The session a read serves: every value in the response is for `date` (ADR 0036). `missing` lists the nightly tables with no partition for it; identity is read from the reference snapshot `referenceSnapshot` (`preSnapshot`: one taken later).
"""
type Session {
  date: Date!
  requested: Date
  isLatest: Boolean!
  latestWithBars: Date
  referenceSnapshot: Date
  preSnapshot: Boolean!
  present: [String!]!
  missing: [String!]!
}

"""
A user's saved view of a table (`scope`: `screener:<id>`); `saved` false: nothing saved, the page applies its defaults
"""
type TableView {
  scope: String!
  name: String
  saved: Boolean!
  columns: [String!]!
  sort: String
  decisions: [String!]!
  names: [String!]!
}

"""
A value not known for the session: why, and where it looked; `reason` is set exactly when `code` is EXPLAINED
"""
type Unknown {
  code: UnknownCode!
  detail: String!
  reason: NullReason
}

"""Why a value is UNKNOWN for the session"""
enum UnknownCode {
  NO_PARTITION
  NO_ROW
  NULL
  NOT_IN_CATALOGUE
  LICENCE
  NOT_RUN
  PRE_SNAPSHOT
  NOT_APPLICABLE
  ILLIQUID
  EXPLAINED
}

"""
The session's live verification vs IBKR (verification/ibkr): `counts` rows per status (PASS / WARN / FAIL / NA), `byCheck` most failures first, `failing` FAIL then WARN rows (at most 50: instrument_id, symbol, check, status, ours, theirs, diff, tolerance, note), largest diff first; `unknown` NO_PARTITION when it did not run for the session
"""
type Verification {
  session: Date!
  runIds: [String!]!
  instruments: Int!
  counts: JSON!
  byCheck: [CheckCounts!]!
  failing: [JSON!]!
  unknown: Unknown
}

"""
The user this request is for: the registry user the token maps to, their `role` (admin or trader) and the `workspaces` (trader, admin) the role opens; the web's role gate reads it, the server enforces it
"""
type Viewer {
  id: String!
  name: String!
  role: String!
  workspaces: [String!]!
}
