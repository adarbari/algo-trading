"""How bars are adjusted for corporate actions"""
enum Adjustment {
  SPLITS
  NONE
  TOTAL_RETURN
}

"""
A saved backtest run: `status` complete, partial or failed; `start` / `end` its first and last session; `metrics` (sharpe, cagr, max drawdown, ...)
"""
type Backtest {
  runId: String!
  configId: String!
  user: String!
  status: String!
  start: String
  end: Date!
  startedAt: DateTime!
  finishedAt: DateTime
  metrics: JSON!
}

"""
A saved run with its config hash, selection audit, `data` (as_of, data_versions, reference_snapshot, survivorship_bias), rebalance evaluations, equity curve and fills
"""
type BacktestDetail {
  summary: Backtest!
  configHash: String
  selection: JSON!
  data: JSON!
  rebalances: [JSON!]!
  equity: [EquityPoint!]!
  fills: [Fill!]!
}

"""One equal-width histogram bin, `lo` to `hi`"""
type Bin {
  lo: Float!
  hi: Float!
  count: Int!
}

"""A value of a non-numeric feature and how many instruments have it"""
type Category {
  value: String!
  count: Int!
}

"""
A config the user sees: `scope` site (a preset) or the user's id; `kind` strategy or screener (null when it does not resolve); `selection` the named selection or inline; `error` why it does not resolve
"""
type Config {
  configId: String!
  scope: String!
  kind: String
  impl: String
  selection: String
  hash: String
  error: String
}

"""
What one criterion judged: the value (null: missing), PASS / NEAR / FAIL / MISSING and, for a near miss or a fail, how far from passing
"""
type CriterionResult {
  id: String!
  field: String!
  mode: String!
  outcome: String!
  value: JSON
  distance: Float
}

"""Date (isoformat)"""
scalar Date

"""Date with time (isoformat)"""
scalar DateTime

"""How many rows of a run got one decision"""
type DecisionCount {
  decision: String!
  count: Int!
}

"""The portfolio after one bar: equity and gross exposure"""
type EquityPoint {
  ts: String!
  equity: Float
  grossExposure: Float
}

"""
A stored event: `table` events/<kind>, `date` the event date (UTC), `values` the row's other columns
"""
type Event {
  instrumentId: String!
  table: String!
  kind: String!
  date: Date!
  ts: DateTime!
  values: JSON!
}

"""
A catalogue feature across instruments for `session`: `count` instruments with a row (a value or a stored null), `nulls` stored nulls; `quantiles` and 20-bin `histogram` for a number, `categories` (the most frequent values) otherwise; `unknown`: why nothing is counted (not stored for the session)
"""
type FeatureDistribution {
  name: String!
  session: Date!
  info: FeatureInfo!
  count: Int!
  nulls: Int!
  quantiles: [Quantile!]!
  histogram: [Bin!]!
  categories: [Category!]!
  unknown: Unknown
}

"""How a client shows a feature's value"""
enum FeatureFormat {
  PERCENT
  CURRENCY
  COMPACT
  NUMBER
  DATE
  FLAG
  CATEGORY
  TEXT
}

"""One catalogue field: what it is and how to show it"""
type FeatureInfo {
  name: String!
  kind: String!
  source: String!
  dtype: String!
  format: FeatureFormat!
  description: String!
  nullMeaning: String!
  version: Int
  group: String
  key: String
  inputs: [String!]!
  unit: String
  range: [Float]
  categories: [String!]!
  scope: String!
  owner: String
  licence: String!
}

"""
A catalogue field: instrument.<column>, rollup.<group>@v<N>.<column> or feature.<name> (docs/data/features.md)
"""
scalar FeatureName

"""Catalogue features per stored session of `start..end`"""
type FeatureSeries {
  instrumentId: String!
  names: [String!]!
  start: Date!
  end: Date!
  points: [SeriesPoint!]!
}

"""
Instruments x catalogue features for one session, one page of the rows matching the filters in the sort order (`total`: every page). `rows[i][j]` is the value of `columns[j]` for `instruments[i]`, null exactly when `unknown[i][j]` says why. `missing`: tables the filters and sort read with nothing for the session (no row passes a filter on them); the nightly tables missing for it are `session.missing`
"""
type FeatureTable {
  session: Session!
  universeSnapshot: Date
  preSnapshot: Boolean!
  columns: [FeatureInfo!]!
  instruments: [Instrument!]!
  rows: [[JSON]!]!
  unknown: [[UnknownCode]!]!
  sort: String
  total: Int!
  page: Int!
  size: Int!
  missing: [String!]!
}

"""
A catalogue field's value for one instrument and the session: `value` is null exactly when `unknown` says why; format it with `info.format`
"""
type FeatureValue {
  name: String!
  value: JSON
  unknown: Unknown
  info: FeatureInfo!
}

"""One simulated fill"""
type Fill {
  ts: String!
  instrumentId: String!
  side: String!
  quantity: Float
  price: Float
  commission: Float
  multiplier: Float
}

"""
One line of the fund: `symbol` the issuer's ticker, `weight` a fraction (negative: short); `instrument` when it is in the universe
"""
type Holding {
  rank: Int!
  name: String!
  symbol: String
  instrumentId: String
  weight: Float!
  assetClass: String

  """
  The universe instrument the line is, for the session (null: not in the universe)
  """
  instrument: Instrument
}

"""
An ETF's largest holdings as of the issuer's date `asOf` (null: none stored yet); `total` positions in the issuer's file, `source` who read it
"""
type Holdings {
  fundId: String!
  asOf: Date
  source: String
  total: Int!
  items: [Holding!]!
}

"""A ticker some screener picked: its picks, best screener first"""
type Idea {
  rank: Int!
  instrumentId: String!
  instrument: Instrument
  picks: [ScreenResult!]!
}

"""
One of the user's screeners on the Ideas page: its run for the session (else `notRun`: NOT_RUN), how many tickers it picked and its best picks, over the run
"""
type IdeaScreener {
  screener: Screener!
  run: ScreenerRun
  notRun: Unknown
  picked: Int!
  top: [ScreenResult!]!
}

"""
The ideas for the session: `screeners` in the user's priority order (then the rest by id), `items` the first `limit` of `total` picked tickers
"""
type Ideas {
  session: Date!
  priority: [String!]!
  screeners: [IdeaScreener!]!
  total: Int!
  items: [Idea!]!
}

"""
An instrument as the session's reference snapshot has it. Per-session values (prices, earnings dates, flags, ...) are catalogue features: `features(names)`
"""
type Instrument {
  instrumentId: String!
  symbol: String!
  name: String!
  securityType: String
  assetClass: String!
  exchange: String
  isEtf: Boolean!
  description: String
  referenceSnapshot: Date!

  """
  The values of `names` (catalogue fields, in the order asked) for the session; a name outside the caller's catalogue is an UNKNOWN_FEATURE error
  """
  features(names: [FeatureName!]!): [FeatureValue!]!

  """
  Stored events (earnings, dividends, splits, reference changes) with their event date in `start..end` (null: unbounded), oldest first
  """
  events(start: Date = null, end: Date = null): [Event!]!

  """The option chain stored for the session (null: none stored for it)"""
  chain: OptionChain

  """
  An ETF's `top` largest holdings as of the issuer's date the session sees (null: not an ETF)
  """
  holdings(top: Int! = 10): Holdings

  """Daily bars of `start..end` (`end` null: the session's date), adjusted"""
  prices(start: Date!, end: Date = null, adjustment: Adjustment! = SPLITS): PriceSeries!

  """
  `names` (catalogue features with a history: not instrument.*) per stored session of `start..end` (`end` null: the session's date)
  """
  series(names: [FeatureName!]!, start: Date!, end: Date = null): FeatureSeries!
}

"""
The `JSON` scalar type represents JSON values as specified by [ECMA-404](https://ecma-international.org/wp-content/uploads/ECMA-404_2nd_edition_december_2017.pdf).
"""
scalar JSON @specifiedBy(url: "https://ecma-international.org/wp-content/uploads/ECMA-404_2nd_edition_december_2017.pdf")

"""
An underlying's option chain as stored for the session (Cboe, delayed): `status` the chain run's
"""
type OptionChain {
  underlyingId: String!
  session: Date!
  status: String
  expiries: [OptionExpiry!]!
  strikes: [Float!]!

  """The quotes of `expiry`, by strike then right (empty: not listed)"""
  quotes(expiry: Date!): [OptionQuote!]!
}

"""A listed expiry and its calendar days from the session"""
type OptionExpiry {
  date: Date!
  days: Int!
}

"""
One contract's stored quote; IV (a decimal) and Greeks as the feed computes them
"""
type OptionQuote {
  instrumentId: String!
  expiry: Date!
  right: String!
  strike: Float!
  bid: Float
  ask: Float
  last: Float
  volume: Float
  openInterest: Float
  iv: Float
  delta: Float
  gamma: Float
  theta: Float
  vega: Float
  rho: Float
}

"""
The site preset a screen extends: `pinned` the version it extends (null: not copied yet), `current` the preset's version now
"""
type PresetPin {
  presetId: String!
  pinned: Int
  current: Int
  rebaseAvailable: Boolean!
}

"""One session's daily bar, adjusted"""
type PriceBar {
  session: Date!
  open: Float!
  high: Float!
  low: Float!
  close: Float!
  volume: Float!
  vwap: Float
}

"""Daily bars of `start..end`, oldest first"""
type PriceSeries {
  instrumentId: String!
  adjustment: Adjustment!
  start: Date!
  end: Date!
  bars: [PriceBar!]!
}

"""A quantile of the values: `q` 0.5 is the median"""
type Quantile {
  q: Float!
  value: Float!
}

"""Reads for the web app, each for one session (ADR 0036)"""
type Query {
  """The session `date` resolves to; null: nothing stored"""
  session(
    """
    the session to read (default: the latest with bars); every value below is for exactly this date
    """
    date: Date = null
  ): Session

  """
  The instrument `key` (an instrument id or a ticker) names in the session's reference snapshot; null: no such instrument
  """
  instrument(
    key: String!

    """
    the session to read (default: the latest with bars); every value below is for exactly this date
    """
    date: Date = null
  ): Instrument

  """
  Instruments x `columns` (catalogue fields, in order) for the session: the universe, or the instruments `keys` (ids or tickers) name in that order; filtered (security type, sector, liquidity class, leveraged, optionable: case-insensitive; `q`: the symbol or name contains it), sorted by `sort` (`symbol` or a catalogue field, `-` prefix: descending, missing values last) and paged (`page` from 1, `size` rows). Null: nothing stored
  """
  table(
    columns: [FeatureName!]!
    keys: [String!] = null
    securityType: String = null
    sector: String = null
    liquidityClass: String = null
    leveraged: Boolean = null
    optionable: Boolean = null
    q: String = null
    sort: String = null
    page: Int! = 1
    size: Int! = 100

    """
    the session to read (default: the latest with bars); every value below is for exactly this date
    """
    date: Date = null
  ): FeatureTable

  """
  The tickers the user's screeners picked in the session, ranked by their screener priority then score (the first `limit`); a screener with no run for the session is listed NOT_RUN. Null: nothing stored
  """
  ideas(
    limit: Int! = 50

    """
    the session to read (default: the latest with bars); every value below is for exactly this date
    """
    date: Date = null
  ): Ideas

  """
  Every rule screen the user sees (their own config, else the site preset), by id; each with its run for the session
  """
  screeners(
    """
    the session to read (default: the latest with bars); every value below is for exactly this date
    """
    date: Date = null
  ): [Screener!]!

  """
  The user's saved view of the screener `scope`'s results (the default view, or the one called `name`); null: a screener the user does not see, or nothing stored yet
  """
  view(scope: String!, name: String = null): TableView

  """
  The caller's feature catalogue (the site's fields plus their own expression features), in catalogue order
  """
  catalogue: [FeatureInfo!]!

  """
  The catalogue field `name` across instruments for the session; a name outside the caller's catalogue is an UNKNOWN_FEATURE error. Null: nothing stored
  """
  distribution(
    name: FeatureName!

    """
    the session to read (default: the latest with bars); every value below is for exactly this date
    """
    date: Date = null
  ): FeatureDistribution

  """
  Every strategy and screener config the user sees: site presets, then their own (`kind`: only `strategy` or `screener`)
  """
  configs(kind: String = null): [Config!]!

  """
  Every saved backtest run of the strategy configs the user sees, newest first
  """
  backtests: [Backtest!]!

  """The saved backtest run `runId`; null: no such backtest run"""
  backtest(runId: String!): BacktestDetail

  """
  The user's own rule screens: finalised ones and draft-only ones (status DRAFT), by id
  """
  myScreens: [ScreenListing!]!

  """
  The user's screen `screenerId` (or the site preset of that id they have not copied yet): draft, versions, preset pin, working copy. Null: no such screen
  """
  screenDetail(screenerId: String!): ScreenDetail

  """The finalised versions of the user's screen `screenerId`, oldest first"""
  screenVersions(screenerId: String!): [ScreenVersion!]!
}

"""One of the screen's display columns for the instrument"""
type ResultColumn {
  name: String!
  value: JSON
}

"""
A screen of the user (or a preset not copied yet): the `draft` and why it would not finalise (`draftError`), its `versions`, the `preset` it is pinned to, the latest version resolved (`hash`, `layers`, `resolved`, `error`) and `working`, the rule keys the Builder edits
"""
type ScreenDetail {
  screenerId: String!
  user: String!
  draft: JSON
  draftError: String
  versions: [Int!]!
  latest: Int
  preset: PresetPin
  hash: String
  layers: [String!]!
  resolved: JSON
  error: String
  working: JSON
}

"""
One of the user's screens: `status` FINAL (has a finalised version) or DRAFT (a draft only); `presetId` the site preset it extends
"""
type ScreenListing {
  screenerId: String!
  status: String!
  latest: Int
  hasDraft: Boolean!
  presetId: String
}

"""
One instrument's row of a screener's run; `instrument` is null when the session's reference snapshot does not have it
"""
type ScreenResult {
  runId: String!
  configId: String!
  instrumentId: String!
  instrument: Instrument
  rank: Int!
  decision: String!
  score: Float
  tieBreak: Float
  reasons: String!
  flags: [String!]!
  criteria: [CriterionResult!]!
  columns: [ResultColumn!]!
}

"""A finalised (immutable) version of a screen and its document"""
type ScreenVersion {
  version: Int!
  document: JSON!
}

"""
A rule screen as the user sees it (their own config, else the site preset): `owner` is whose runs are its; `latestRun` its run for the session, else `notRun` says why (NOT_RUN)
"""
type Screener {
  id: String!
  owner: String!
  scope: String!
  name: String!
  version: Int
  hash: String!

  """Its run for the session; null: not run for it (see `notRun`)"""
  latestRun: ScreenerRun

  """Why it has no run for the session (NOT_RUN); null: it has one"""
  notRun: Unknown
}

"""
A screener's run for the session: whose, which version ran, its run record's status, and every decision with its count over the whole run (`picked`: the tickers it picked)
"""
type ScreenerRun {
  runId: String!
  configId: String!
  owner: String!
  session: Date!
  status: String
  knowledgeTs: DateTime!
  configVersion: Int
  decisions: [DecisionCount!]!
  picked: Int!
}

"""One session's values, in the order of `FeatureSeries.names`"""
type SeriesPoint {
  session: Date!
  values: [JSON]!
}

"""
The session a read serves: every value in the response is for `date` (ADR 0036). `missing` lists the nightly tables with no partition for it; identity is read from the reference snapshot `referenceSnapshot` (`preSnapshot`: one taken later).
"""
type Session {
  date: Date!
  requested: Date
  isLatest: Boolean!
  latestWithBars: Date
  referenceSnapshot: Date
  preSnapshot: Boolean!
  present: [String!]!
  missing: [String!]!
}

"""
A user's saved view of a table (`scope`: a screener id); `saved` false: nothing saved, the page applies its defaults
"""
type TableView {
  scope: String!
  name: String
  saved: Boolean!
  columns: [String!]!
  sort: String
  decisions: [String!]!
  names: [String!]!
}

"""A value not known for the session: why, and where it looked"""
type Unknown {
  code: UnknownCode!
  detail: String!
}

"""Why a value is UNKNOWN for the session"""
enum UnknownCode {
  NO_PARTITION
  NO_ROW
  NULL
  NOT_IN_CATALOGUE
  LICENCE
  NOT_RUN
  PRE_SNAPSHOT
}
