  status: String!
  latest: Int
  hasDraft: Boolean!
  presetId: String
}

"""
One instrument's row of a screener's run; `instrument` is null when the session's reference snapshot does not have it. `change`: `new` (picked now, not by the previous run) or `dropped` (the reverse); null when the same or not compared (Ideas); `previousDecision`: the previous run's. `regime` / `sizeMultiplier`: the session's regime label and the size the gate applied, as the run stamped them (null: gate off, regime unknown, or a run before the stamp); a PAUSED row says why first in `reasons`
"""
type ScreenResult {
  runId: String!
  configId: String!
  instrumentId: String!
  instrument: Instrument
  rank: Int
  decision: String!
  score: Float
  tieBreak: Float
  reasons: String!
  flags: [String!]!
  criteria: [CriterionResult!]!
  columns: [ResultColumn!]!
  change: String
  previousDecision: String
  regime: String
  sizeMultiplier: Float
  groups: [ScreenGroup!]!

  """
  Each edge that lists the screener and whether it counts this row (empty: none does); filled on `ScreenerRun.results` only
  """
  countsToward: [PickEdge!]!
}

"""
One page of a run's rows matching the filters, in the sort order (`total`: every page). `rows[i][j]` is the catalogue column `columns[j]` for `results[i]`, null exactly when `unknown[i][j]` says why (`reasons[i][j]`: its NullReason when EXPLAINED; `kinds[i][j]`: its public kind, how a cell is drawn). `unavailable`: what the tables the search and sort read have nothing for the session leave out
"""
type ScreenResultPage {
  runId: String!
  sort: String!
  total: Int!
  page: Int!
  size: Int!
  columns: [FeatureInfo!]!
  results: [ScreenResult!]!
  rows: [[JSON]!]!
  unknown: [[UnknownCode]!]!
  reasons: [[NullReason]!]!
  kinds: [[UnavailableKind]!]!
  unavailable: [Unavailable!]!
  facets: FilterFacets

  """The words of each kind `kinds` uses: how a cell's kind reads"""
  kindTexts: [KindText!]!
}

"""A finalised (immutable) version of a screen and its document"""
type ScreenVersion {
  version: Int!
  document: JSON!
}

"""
A rule screen as the user sees it (their own config, else the site preset): `owner` is whose runs are its; `criteria`, `groups` and `displayColumns` the current config's; `description` the one line saying what it finds (null: not written; not part of `hash`); `latestRun` its run for the session, else `notRun` says why (NOT_RUN); `pickHistory` its picked count per session over a window ending at the session
"""
type Screener {
  id: String!
  owner: String!
  scope: String!
  name: String!
  version: Int
  hash: String!
  criteria: [ScreenCriterion!]!
  displayColumns: [ScreenColumn!]!
  groups: [ScreenGroup!]!
  description: String

  """Its run for the session; null: not run for it (see `notRun`)"""
  latestRun: ScreenerRun

  """Why it has no run for the session (NOT_RUN); null: it has one"""
  notRun: Unknown

  """
  Its record over the frozen period of each edge that lists it, by edge id, from that edge's canonical run (never an exploratory run); an edge without one has an entry whose `notRun` says why; empty: no edge lists it
  """
  trackRecords: [TrackRecord!]!

  """
  Its picked count for each of the last `sessions` (default 30, at most 90) exchange sessions ending at the session, oldest first, one entry per session: a session it did not run in has `picked` null and `notRun` says why (never an older run); a session with several runs counts the latest; each entry is what `latestRun` says at that session
  """
  pickHistory(sessions: Int! = 30): [PickCount!]!
}

"""
One of the caller's screeners and the labels its picks are PAUSED in, calmest first, as the config layers resolve it for them; `enabled`: its `[regime]` gate is on (off, nothing is paused)
"""
type ScreenerGate {
  screenerId: String!
  name: String!
  enabled: Boolean!
  pauseIn: [RegimeLabel!]!
}

"""
A screener that picked the instrument in the session (its run for exactly the session), and its result for it
"""
type ScreenerHit {
  screener: Screener!
  result: ScreenResult!
}

"""
The screeners the user sees that pass the search `q` (id, name or description) and the `filters` (the surface `screeners` of `filterSet`), by id: `total` counts them, `facets` the counts of the filter bar over the search's matches (`facets.total` before the filters). A screener with no run has no `runStatus` / `picked`: it never passes a filter on them
"""
type ScreenerList {
  total: Int!
  items: [Screener!]!
  facets: FilterFacets!
}

"""
A screener's run for the session: whose, which version ran, its run record's status and `audit` (coverage, the selection's audit), and every decision with its count over the whole run (`picked`: the tickers it picked, `paused`: the picks the regime gate held back, never counted as picked; `regime`: the label the run stamped, null when the gate was off or the label unknown); `coverage`: the run record's own coverage (COMPLETE, PARTIAL; null: not recorded); `unavailable`: what the tables that had no rows when it ran leave out, not the session's as read now
"""
type ScreenerRun {
  runId: String!
  configId: String!
  owner: String!
  session: Date!
  status: String
  knowledgeTs: DateTime!
  configVersion: Int
  decisions: [DecisionCount!]!
  picked: Int!
  paused: Int!
  regime: String
  coverage: String
  unavailable: [Unavailable!]!

  """
  The run record's audit (coverage, the selection's audit); without the tables the run went without unless the caller is an admin
  """
  audit: JSON!

  """
  The session of the previous run it is compared with; null: none (nothing is new or dropped)
  """
  previousSession: Date

  """
  How many tickers are `new` / `dropped` since the previous run, over the whole run; empty: no previous run
  """
  changes: [ChangeCount!]!

  """
  Who the run picked, read from the run's rows alone (cheap: no criterion values); `size` ids at most, in rank order
  """
  pickIds(size: Int! = 100): PickIds!

  """
  Its rows as a review table: `filters` (the surface `screener_results` of `filterSet`) and `q` (the symbol or name contains it) filtered, `decisions` and `change` (deprecated: the `decision` and `change` filters; `new` / `dropped`) likewise, over the whole run, with the counts in `facets` (ADR 0082), sorted by `sort` (`rank`, `score`, `symbol`, `decision`, `change`, `criterion:<id>`, `column:<name>` or a catalogue name; `-` prefix: descending; missing values last; default: rank) and paged (`page` from 1, `size` rows), with the catalogue `columns` for the page's rows
  """
  results(decisions: [String!] = null, change: String = null, q: String = null, sort: String = null, columns: [FeatureName!] = null, page: Int! = 1, size: Int! = 100, filters: [FilterInput!] = null): ScreenResultPage!
}

"""
One market field over a window. A number: `points` (oldest first), one bucket of `bucketSessions` consecutive sessions yielding its minimum and its maximum at their own sessions; a null `value` is a gap that breaks the line; `segments` is empty. A flag or a label: `segments`, `points` empty, `bucketSessions` 1. `unavailable` is set when the viewer's data licence does not cover the field: no values at all, kind LICENCE
"""
type SeriesHistory {
  name: String!
  bucketSessions: Int!
  points: [HistoryPoint!]!
  segments: [HistorySegment!]!
  unavailable: [Unavailable!]!
}

"""One session's values, in the order of `FeatureSeries.names`"""
type SeriesPoint {
  session: Date!
  values: [JSON]!
}

"""
The session a read serves: every value in the response is for `date` (ADR 0036). `unavailable` says what the nightly tables with no partition for it leave out; identity is read from the reference snapshot `referenceSnapshot` (`preSnapshot`: one taken later). A read with no date serves the session of the current serving release (ADR 0077), else the latest whose nightly workflow is complete (ADR 0062): `newer` is the later session still processing, failing or waiting to be published (null: none, or a date was asked for), `complete` whether `date`'s workflow is complete (false on a store with none complete yet: the latest bars are served unconfirmed).
"""
type Session {
  date: Date!
  requested: Date
  isLatest: Boolean!
  latestWithBars: Date
  referenceSnapshot: Date
  preSnapshot: Boolean!
  unavailable: [Unavailable!]!
  complete: Boolean!
  newer: NewerSession

  """
  How complete this session's data is (prices, option chains, fundamentals) and how many of the viewer's screeners it touches: for every viewer, from run records alone; a dataset with no record is UNKNOWN, never 0%
  """
  dataStatus: DataStatus!
}

"""A fast (market) or slow (macro) indicator, or the screener gate (GATE)"""
enum SignalKind {
  FAST
  SLOW
  GATE
}

"""
How a signal did: LED (ON up to the trough), LATE (first ON only after it), NEVER_FIRED (every stored verdict false) or UNKNOWN (no verdict stored up to the trough)
"""
enum SignalState {
  LED
  LATE
  NEVER_FIRED
  UNKNOWN
}

"""
One signal around one episode; `state` says how it did. `flaggedDay` / `clearedDay`: exchange sessions from the episode's peak (negative: before it, the signal led); `flaggedDayFromTrough`: from its trough (positive for LATE, where `flaggedDay` is the first ON session after the trough). `flaggedDay` is the first session of the first ON run overlapping the window before the trough; `clearedDay` the first later session it was not ON, null while it is still ON at the session or at the trough plus the clear horizon. `firstKnownDay`: set when the stored verdicts start after the window's start (sessions from the peak), so `flaggedDay` is not the true start of a run already ON then. `unknownReason` is set exactly when `state` is UNKNOWN (never `neverFired` then; also when too few sessions have a verdict to say it never fired). `verdictSessions` of `windowSessions` (window start to the trough) have a stored verdict
"""
type SignalTiming {
  indicator: String!
  kind: SignalKind!
  state: SignalState!
  flaggedDay: Int
  clearedDay: Int
  firstKnownDay: Int
  neverFired: Boolean!
  unknownReason: Unknown
  flaggedDayFromTrough: Int
  verdictSessions: Int!
  windowSessions: Int!
}

"""
One period (all, in_sample, out_of_sample) of a slice: its `state` (measured, not_stored, oos_hidden) and, when measured, the `winRate` and `baseRate` (fractions), `liftPts` (win rate less base rate, in points), `trades` (independent sessions) and `thin` (fewer trades than the verdict needs out of sample)
"""
type SliceFigure {
  period: String!
  state: String!
  winRate: Float
  baseRate: Float
  liftPts: Float
  trades: Int
  thin: Boolean!
}

"""
A user's saved view of a table (`scope`: `screener:<id>`); `saved` false: nothing saved, the page applies its defaults
"""
type TableView {
  scope: String!
  name: String
  saved: Boolean!
  columns: [String!]!
  sort: String
  decisions: [String!]!
  names: [String!]!
  narrowColumns: [String!]!
  filters: String!
}

"""A run of a sentence: plain text, or a term linked to `url`"""
type TextPart {
  text: String!
  url: String
}

"""
One of a screener's first picks: who it is, its `position` in the screener's run and the `score` the run stored for it (null: none stored)
"""
type TopPick {
  instrumentId: String!
  instrument: Instrument
  position: Int!
  score: Float
}

"""
The frozen slice at one horizon: hit rate against the base rate, the lift, the independent `sessions` (trades) behind them and the `picks` counted; `liftPts`: win rate minus base rate, in points
"""
type TrackHorizon {
  horizonSessions: Int!
  hitRate: Float
  baseRate: Float
  lift: Float
  sessions: Int
  picks: Int
  liftPts: Float
}

"""
A screener's record over one edge's frozen period, from the edge's canonical run (the latest site run whose split is the edge's `frozenFrom`); never an exploratory run. `runLabel` names the run; `runId`, the range, `splitFrom` and `knowledgeTs` disclose it; `afterSession`: the run committed after the request's session. `notRun` says why there is none (NOT_RUN); null: it has one
"""
type TrackRecord {
  screenerId: String!
  edgeId: String!
  edgeName: String!
  notRun: Unknown
  runId: String
  runLabel: String
  rangeFrom: Date
  rangeTo: Date
  splitFrom: Date
  knowledgeTs: DateTime
  horizons: [TrackHorizon!]!
  afterSession: Boolean!
}

"""A per-name yes / no, as `TradeNumber`"""
type TradeFlag {
  value: Boolean
  unknown: Unknown
}

"""
A per-name number: `value` (null: not stored, never 0) or, when the viewer may not read it, `unknown` (LICENCE: a personal-licence source)
"""
type TradeNumber {
  value: Float
  unknown: Unknown
}

"""
Which trades: IN_SAMPLE and OUT_OF_SAMPLE sides of the backtest, ALL of the backtest, or LIVE (the paper record)
"""
enum TradePeriod {
  IN_SAMPLE
  OUT_OF_SAMPLE
  LIVE
  ALL
}

"""The column a page of trades is sorted by"""
enum TradeSort {
  DECISION
  EXIT
  INSTRUMENT
  RANK
  STATUS
  VALUE
  SCORE
  DRAWDOWN
  ADV
  SYMBOL
}

"""
A per-name text (a ticker, a company name): `value`, or why it is not known (`unknown`: the name is not in the reference snapshot); never the instrument id
"""
type TradeText {
  value: String
  unknown: Unknown
}

"""
Features a page cannot show, and why in public words: `kind`, the Guide glossary term `guideTerm` that explains it, `kindText` the kind in generic words. `cause` is the chain behind it: admins only (null for anyone else)
"""
type Unavailable {
  kind: UnavailableKind!
  features: [String!]!
  guideTerm: String!

  """The kind in generic words: never a table, vendor or step"""
  kindText: String!

  """
  The chain behind it, source to features; null unless the caller is an admin
  """
  cause: Cause
}

"""Why a gap is there, in public words"""
enum UnavailableKind {
  SYSTEM
  NOT_STORED
  NOT_APPLICABLE
  ILLIQUID
  LICENCE
  NOT_COVERED
  NOT_RUN
}

"""
The curve's distance below its running high at `exit`: `depth` is 0 or negative
"""
type UnderwaterPoint {
  exit: Date!
  depth: Float!
}

"""
A value not known for the session: `code` and, in public words, `kind` (with its Guide term `guideTerm`, `kindText` in generic words); `reason` is set exactly when `code` is EXPLAINED. `cause` is the chain behind it, source to table: admins only (null for anyone else)
"""
type Unknown {
  code: UnknownCode!
  reason: NullReason
  kind: UnavailableKind!
  guideTerm: String!

  """The kind in generic words: never a table, vendor or step"""
  kindText: String!

  """
  The chain behind it, source to table; null unless the caller is an admin
  """
  cause: Cause
}

"""Why a value is UNKNOWN for the session"""
enum UnknownCode {
  NO_PARTITION
  NO_ROW
  NULL
  NOT_IN_CATALOGUE
  LICENCE
  NOT_RUN
  PRE_SNAPSHOT
  NOT_APPLICABLE
  ILLIQUID
  NOT_COVERED
  EXPLAINED
  PRUNED
  NOT_STORED
  NOT_RECORDING
}

"""
The 30 days by `by` (model, use_case, user, cost_basis, outcome), most spent first
"""
type UsageBreakdown {
  by: String!
  rows: [UsageSlice!]!
}

"""
`[budget]` of llm.toml (a cap null: not set); `error` the words of an unreadable file
"""
type UsageBudget {
  dailyUsd: Float
  monthlyUsd: Float
  over: String
  reportedCallUsd: Float
  error: String
}

"""
One stored attempt; `unknownFields` names the values stored null (tokens a provider did not report, a cost not known), `unknown` says why. A failed or rejected call (Admin only, like the whole read) also carries `stage` (provider: the attempt raised; answer: the provider answered and the caller refused it), `error`, the prompt sent (`sentence`, clipped), the raw `answer` (clipped) and `promptChars`. `cacheReadTokens` / `cacheWriteTokens` (null: not reported) are the cached prompt beside `inputTokens` (the regular input); `totalInputTokens` the whole input (null when not known: a Claude Code login call recorded before the cache was stored); `callId` ties the attempts of one call, `promptVersion` and `callStage` (first, repair, escalate) are the caller's tags
"""
type UsageCall {
  ts: DateTime!
  provider: String!
  model: String!
  useCase: String!
  user: String
  inputTokens: Int
  outputTokens: Int
  latencyS: Float
  costUsd: Float
  costBasis: String!
  outcome: String!
  fellBackFrom: String
  runId: String!
  error: String
  stage: String
  sentence: String
  answer: String
  promptChars: Int
  cacheReadTokens: Int
  cacheWriteTokens: Int
  totalInputTokens: Int
  callId: String
  promptVersion: String
  callStage: String
  unknownFields: [String!]!
  unknown: Unknown
}

"""
A budget cap: `kind` daily or monthly, `limitUsd` null when none is set, `usedShare` spent / limit (above 1: over the cap), null without a cap
"""
type UsageCap {
  kind: String!
  limitUsd: Float
  usedShare: Float
}

"""One day of the 30-day series (a day with no calls: zero calls)"""
type UsageDay {
  day: Date!
  tally: UsageTally!
}

"""
Attempts of the 30 days and how they ended; a rate is null with no attempts
"""
type UsageReliability {
  attempts: Int!
  ok: Int!
  fellBack: Int!
  failed: Int!
  skippedBudget: Int!
  rejected: Int!
  fallbackRate: Float
  failureRate: Float
}

"""
One group of a breakdown (`key` null: stored null; `provider` set for the model breakdown); `costShare` its share of the 30 days' spend, null when none was spent
"""
type UsageSlice {
  key: String
  provider: String
  tally: UsageTally!
  costShare: Float
}

"""
The calls of a slice: tokens summed over the calls that reported them (`callsWithoutTokens` the others; `unknown` set when none did), `spentUsd` what counts against the budget = `billedUsd` (priced) + `reportedUsd` (the notional seat cost of a Claude Code login, not a bill) + `boundUsd` (an upper bound charged for an unknown cost). `inputTokens` is the regular (uncached) input; the whole input is `inputTokens` + `cacheReadTokens` + `cacheWriteTokens`, summed as `totalInputTokens` over the calls whose whole input is known (`callsWithoutTotalInput` the others: a Claude Code login call recorded before the cache was stored)
"""
type UsageTally {
  calls: Int!
  inputTokens: Int!
  outputTokens: Int!
  cacheReadTokens: Int!
  cacheWriteTokens: Int!
  totalInputTokens: Int!
  callsWithoutTotalInput: Int!
  callsWithoutTokens: Int!
  spentUsd: Float!
  billedUsd: Float!
  reportedUsd: Float!
  boundUsd: Float!
  freeCalls: Int!
  unknown: Unknown
}

"""
`key` today, 7d, 30d or month over `start`..`end`; `cap` null for a window with no cap of its own (7d, 30d)
"""
type UsageWindow {
  key: String!
  start: Date!
  end: Date!
  tally: UsageTally!
  cap: UsageCap
}

"""
How many instruments pass one use of the field guide's entry (`intent`, in the guide's order), as the hard rule it states (a soft use's tolerance is not counted): `count` of the values counted and `bins` the passing count of each histogram bin (empty for a non-numeric feature)
"""
type UsePass {
  intent: String!
  count: Int!
  bins: [Int!]!
}

"""How a range shows its stored value"""
enum ValueUnit {
  PERCENT
}

"""
One period's figures of one variant: `winRate`, `baseRate`, `liftPts` (win rate minus base rate, in points), `decileSpread` and the independent `trades` behind them (null: not stored)
"""
type VariantFigures {
  winRate: Float
  baseRate: Float
  liftPts: Float
  decileSpread: Float
  trades: Int
}

"""
The basis's figures over one `period` (in_sample, out_of_sample or all); `liftPts`: win rate minus base rate, in points; `thin`: the out-of-sample column has fewer trades than the verdict needs; `referenceRate` (the risk-neutral rate of a win) and `touchRate` (picks whose strike was touched) only an expires-out-of-the-money outcome has. A figure not stored is null
"""
type VerdictColumn {
  period: String!
  winRate: Float
  baseRate: Float
  liftPts: Float
  trades: Int
  decileSpread: Float
  decileT: Float
  sharpe: Float
  deflatedSharpe: Float
  pbo: Float
  thin: Boolean!
  referenceRate: Float
  touchRate: Float
  picksT: Float
}

"""
One test of the verdict: the `value` measured, the `threshold` it must reach and its `status` (pass, fail, not_measured, not_applicable: nothing to test, as decoys that are not declared; it counts neither for nor against the level); `level`: the verdict it gates (promising, works)
"""
type VerdictCriterion {
  id: String!
  label: String!
  value: String!
  threshold: String!
  status: String!
  level: String!
}

"""
One calendar year of the verdict's basis, or the part of it on one side of the split (`partial`: a year the split falls in is two rows, in-sample then out-of-sample); `label` names the row ("2026 Jan-Mar") and it spans `fromDate` to `toDate`; `period`: in_sample, out_of_sample or both (an older run's year the split falls inside); `liftPts`: win rate minus base rate, in points
"""
type VerdictYear {
  year: String!
  period: String!
  label: String!
  fromDate: Date!
  toDate: Date!
  partial: Boolean!
  winRate: Float
  baseRate: Float
  liftPts: Float
  decileSpread: Float
  trades: Int
}

"""
The session's live verification vs IBKR (verification/ibkr): `counts` rows per status (PASS / WARN / FAIL / NA), `byCheck` most failures first, `failing` FAIL then WARN rows (at most 50: instrument_id, symbol, check, status, ours, theirs, diff, tolerance, note), largest diff first; `unknown` NO_PARTITION when it did not run for the session
"""
type Verification {
  session: Date!
  runIds: [String!]!
  instruments: Int!
  counts: JSON!
  byCheck: [CheckCounts!]!
  failing: [JSON!]!
  unknown: Unknown
}

"""
The user this request is for: the registry user the token maps to, their `role` (admin or trader) and the `workspaces` (trader, admin) the role opens; the web's role gate reads it, the server enforces it
"""
type Viewer {
  id: String!
  name: String!
  role: String!
  workspaces: [String!]!
}

enum WindowUnit {
  DAYS
  SESSIONS
}

"""
A filter the viewer is not offered (a field under a data licence they do not hold, `unavailable.kind` LICENCE) and is refused if they send it
"""
type WithheldFilter {
  id: String!
  label: String!
  group: FilterGroup!
  unavailable: Unavailable!
}

"""A window filter's amount and unit: within `amount` days or sessions"""
input Within {
  amount: Float!
  unit: WindowUnit!
}
