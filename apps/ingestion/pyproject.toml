[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

# The ingestion app: the only writer of market and feature data (ADR 0005).
# Vendor SDKs, when needed, are declared here and nowhere else.
[project]
name = "algotrade-ingestion"
version = "0.1.0"
description = "Data ingestion app: sources, nightly pipeline, golden datasets"
requires-python = ">=3.12"
dependencies = [
    "algotrade",
    "openpyxl>=3.1",
]

[project.scripts]
algotrade-ingest = "algotrade_ingestion.cli:main"

[tool.uv.sources]
algotrade = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["algotrade_ingestion"]
