[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

# The ingestion app: the only writer of market and feature data (ADR 0005). Vendor adapters
# and their SDKs live in the algotrade-sources package (libs/sources, ADR 0027).
[project]
name = "algotrade-ingestion"
version = "0.1.0"
description = "Data ingestion app: tasks, nightly pipeline, golden datasets"
requires-python = ">=3.12"
dependencies = [
    "algotrade",
    "algotrade-sources",
]

[project.scripts]
algotrade-ingest = "algotrade_ingestion.cli.main:main"

[tool.uv.sources]
algotrade = { workspace = true }
algotrade-sources = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["algotrade_ingestion"]
