[[table]]
name = "results/rule_screen"
owner = "src/algotrade/storage/tables/result_writer.py"
also_written_by = ["apps/ingestion/algotrade_ingestion/tasks/screens/screen_values_recluster.py"]
note = "every rule screen's rows (ADR 0029), framed by services/screening/rule_results.py, written by services/screening/run.py; files sorted by instrument_id in 8,192-row row groups (TableSpec.cluster_by, storage.md), older ones until screen-values-recluster (which then trims and sweeps the old file once its grace has passed)"

[[table]]
name = "results/rule_screen_values"
owner = "src/algotrade/storage/tables/result_writer.py"
also_written_by = ["apps/ingestion/algotrade_ingestion/tasks/screens/screen_values_recluster.py"]
note = "every rule screen's per-criterion values (ADR 0029), published with results/rule_screen; group rows (mode = group, field = the kind, value_str = the deciding member) and a nullable group_id (the parent) on member rows (ADR 0071); readers skip group rows beside display columns (is_criterion_row); files sorted by instrument_id in 8,192-row row groups (TableSpec.cluster_by, storage.md), older ones until screen-values-recluster (which then trims and sweeps the old file once its grace has passed); licence columns unchanged"

[[table]]
name = "results/screen_runs"
owner = "src/algotrade/storage/tables/result_writer.py"
also_written_by = ["apps/ingestion/algotrade_ingestion/tasks/screens/screen_runs_backfill.py"]
note = "ScreenRun (ADR 0077 amendment (c)): one row per run of a rule screen, framed by services/screening/rule_results.py from the run's summary and the previous run (found by services/screening/previous.py), written by services/screening/run.py in the run's one publish with results/rule_screen (ADR 0022) for the nightly screen and the API's on-request run; new_picks / dropped are frozen at write against previous_run_id (null: no earlier run), both versions kept; decision counts as parallel arrays; a reader takes the newest knowledge_ts per (user, config); runs before this table have no row and are recomputed on read until the backfill"

[[table]]
name = "results/screen_picks"
owner = "src/algotrade/storage/tables/result_writer.py"
also_written_by = ["apps/ingestion/algotrade_ingestion/tasks/screens/screen_runs_backfill.py"]
note = "ScreenPick (ADR 0077 amendment (c)): the picked and PAUSED rows of results/rule_screen (same columns, equal), one file per run, sorted by instrument_id, published with it by the same framer; holds no field value (those stay in results/rule_screen_values under their licence); read by the run_id taken from results/screen_runs (read_run), never as a group's newest file (a run with no picks writes none)"

[[table]]
name = "results/edge_eval"
owner = "src/algotrade/storage/tables/result_writer.py"
per_session = false
note = "the edge harness's rows per (edge, variant, horizon, slice) (ADR 0053), framed and written by services/evaluation/cross_section/results.py; slice_kind cost rows (a return outcome, ADR 0064) and the pick_adv_* capacity columns"

[[table]]
name = "results/edge_series"
owner = "src/algotrade/storage/tables/result_writer.py"
per_session = false
note = "the edge harness's per-session series (ADR 0064): one row per (main edge variant, screener or baseline, horizon, measured block of decision sessions) with its calendar exit session, before_split, status, counts and oriented means; run-scoped like results/edge_eval (partition = the range end, read by run_id); framed only by services/evaluation/cross_section/detail/, written inside the run's one publish block, read through services/read/evaluation/runs.py (load_run_series)"

[[table]]
name = "results/edge_legs"
owner = "src/algotrade/storage/tables/result_writer.py"
per_session = false
note = "the edge harness's stored legs (ADR 0063): per decision session, each screener's statistic, the partitions the session read and the outcome partition it joined; session_date = the decision session, runs merge per key; framed, written and read only by services/evaluation/cross_section/legs/ (a fitness test)"

[[table]]
name = "results/edge_trades"
owner = "src/algotrade/storage/tables/result_writer.py"
per_session = false
note = "the edge trade ledger (ADR 0064): one row per pick of the main edge variant's implementation screeners at every horizon, excluded picks with a public reason; partition = the run's range end, runs merge per key, read by run_id; framed only by services/evaluation/cross_section/detail/ from the run's v2 legs and written in the run's one publish, read only by services/read/evaluation/runs.py; kept 45 days but for the canonical, latest and cited runs (the purge-raw task, runs.ledger_keep)"

[[table]]
name = "results/edge_verdict"
owner = "src/algotrade/storage/tables/result_writer.py"
also_written_by = ["apps/ingestion/algotrade_ingestion/tasks/edges/verdicts.py"]
per_session = false
note = "the stored headline of a site edge's verdict (ADR 0053 amendment 2026-10-22): one row per (edge, judged run, fingerprint) with the label, one-line result, basis, trades and lift of the canonical run, no haircut; partition = the judged run's range end, runs merge per key, knowledge_ts = the write instant; framed only by services/evaluation/cross_section/detail/verdict.py from the one judge and written in the edge-eval run's publish (and by the edge-verdicts task), read only by services/read/evaluation/verdict/stored.py, which uses a row only when its fingerprint matches and judges live otherwise; ML never writes it"

[[table]]
name = "results/edge_picks"
owner = "apps/ingestion/algotrade_ingestion/tasks/edges/picks.py"
note = "what each site edge took at a session (ADR 0081): one row per (user, edge, screener) in the partition of the decision session, status picked / not_decision_day / unjudged / skipped with pick_ids (place 1 first) by the harness's one pick rule (picks.long_picks); framed by services/evaluation/edge_picks/, published by the edge-picks task (resumable: stored keys are skipped), read only by services/read/evaluation/pick_edges.py for the served session (a session or an edge with no row is not_stored, never an older partition); derived, a re-run rebuilds it"

[[table]]
name = "results/edge_paper"
owner = "src/algotrade/storage/tables/result_writer.py"
per_session = false
note = "the forward paper record (ADR 0053 amendment 2026-10-10): one row per (record owner, edge, signal session, name) the nightly edge-signals job made for an edge open for recording (a site edge from candidate to live, a user's own from live: ADR 0064 amendment 2026-10-24, loading.records_paper), user_id being the RECORD owner (site for a site edge, else the user whose edge it is; a follower never writes one), settled by rewriting its own row (runs merge per key), with excess_return and the name's raw return (return, the stored fwd_return; null for an option P&L and before the column) and the licence recorded at the signal (a reader hides a name by it); framed and written by services/evaluation/forward/results.py, read through data/paper"

[[table]]
name = "results/winners_study"
