# Stored tables (ADR 0019): the registry of every table the system stores and its one producing
# owner. Responsibilities (who owns which kind of work) are in architecture/*_ownership.toml.
# Read by tests/architecture/test_ownership.py, test_rollups.py, test_task_registry.py and
# src/algotrade/services/read/session.py.

# Every stored table has exactly one producing owner (tests/architecture/test_ownership.py),
# and every ingestion task in tasks/framework/registry.py declares exactly the tables its module produces.
# `also_written_by` lists today's extra writers: each is restructure work, not precedent.
# `per_session = false` marks a table under a session-grain prefix that is not written every
# session (an evaluation run on request): the read model never lists it as missing for a session.

