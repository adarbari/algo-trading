owner = ["src/algotrade/quant/rates.py"]
section = "docs/adr/0021-option-pricing-conventions.md#rates"
detect = [{ call = "log1p" }, { call = "interp" }]

# --------------------------------------------------------------------------- rollups

[[responsibility]]
id = "rollup-computation"
description = "Compute feature groups (rollups): the FeatureGroup declaration (inputs + lookback, params from rollups.toml, declared features), asking algotrade.data for inputs by table name, point in time per session, backfills; groups are pure compute modules (a materialised expression feature is a one-feature group built by the FeatureSet), stored only by the rollups task"
owner = [
    "src/algotrade/features/framework/*",
    "src/algotrade/features/registry.py",
    "src/algotrade/features/rollups/*",
    "src/algotrade/features/expressions/feature_set.py",
    "apps/ingestion/algotrade_ingestion/tasks/derived/rollups.py",
]
section = "docs/data/layers.md#rollups-as-built"
detect = [{ call = "compute_sessions" }, { call = "compute_one" }, { call = "FeatureGroup" }]

[[responsibility]]
id = "feature-metadata"
description = "Feature definitions and their catalogue: each stored column is a Feature (kind, dtype, unit, description, null meaning, range, categories, inputs) declared in its group, each expression feature one built from its site definition; the registry and the FeatureSet index them and catalogue.py renders docs/data/features.md (ADR 0023)"
owner = [
    "src/algotrade/features/framework/feature.py",
    "src/algotrade/features/rollups/*",
    "src/algotrade/features/expressions/definitions.py",
    "src/algotrade/features/registry.py",
    "src/algotrade/features/catalogue.py",
]
section = "docs/adr/0023-feature-store.md#decision"
detect = [{ call = "Feature" }, { string = "docs/data/features.md" }]

[[responsibility]]
id = "feature-expressions"
description = "The expression language for features: lexing, parsing, type checking and vectorised evaluation of a formula over feature columns (null semantics, Kleene logic); never Python eval"
owner = ["src/algotrade/features/expressions/*"]
section = "docs/adr/0023-feature-store.md#step-3-expression-features-virtual-by-default"
detect = [
    { call = "parse_formula" },
    { call = "check_formula" },
    { call = "evaluate_formula" },
    { call = "eval" },
    { call = "exec" },
]

[[responsibility]]
id = "feature-definitions"
description = "Expression feature definitions: config/site/features/*.toml and config/users/<id>/features/*.toml typed by the one settings loader, then resolved against the catalogue (names, params, dependency graph, cycles, dtype and categories, no user feature shadowing a site one) into Features; the site FeatureSet (code groups + expressions + materialised groups) is built once per config store, a user's (site + their virtual features) by FeatureSet.with_user"
owner = [
    "src/algotrade/config/site/settings.py",
    "src/algotrade/features/expressions/definitions.py",
    "src/algotrade/features/expressions/feature_set.py",
    "src/algotrade/features/site.py",
]
section = "docs/adr/0023-feature-store.md#step-3-expression-features-virtual-by-default"
detect = [
    { call = "load_features" },
    { call = "load_user_features" },
    { call = "feature_definitions" },
    { call = "build_expressions" },
    { call = "FeatureSet" },
]

[[responsibility]]
id = "virtual-feature-reads"
description = "Read expression features on read (selections, FeatureView, series): load only the stored columns their formulas need (data.rollups.feature_rows, column-pruned) and evaluate them through the FeatureSet"
owner = ["src/algotrade/services/features.py", "src/algotrade/data/rollups.py"]
section = "docs/adr/0023-feature-store.md#step-3-expression-features-virtual-by-default"
detect = [{ call = "feature_rows" }]

[[responsibility]]
id = "feature-retirement"
description = "Delete a superseded feature group's stored tables (all runs) after checking its replacement covers the same sessions; dry-run reports sizes. Backends implement TableStore.drop / size; only the retire-features command calls drop"
owner = [
    "apps/ingestion/algotrade_ingestion/tasks/maintenance/retire_features.py",
    "src/algotrade/storage/backends/*",
    "src/algotrade/storage/tables/interfaces.py",
    "src/algotrade/storage/tables/writers.py",
]
section = "docs/adr/0023-feature-store.md#step-3-expression-features-virtual-by-default"
detect = [{ attr = "tables.drop" }, { call = "drop_table" }]

[[responsibility]]
id = "feature-input-loading"
description = "What a feature group reads, by table name: each input table's point-in-time read for features (from its data owner), slicing per session and lookback, other groups' stored rows with this run's rows winning; features never read storage or a domain reader"
owner = ["src/algotrade/data/feature_inputs.py"]
allowed = [
    # ADR 0024: the API shows stored group rows (a feature's series, a distribution); a
    # display read, never a feature input
    "src/algotrade/services/explore/features.py",
    "src/algotrade/services/explore/instruments.py",
]
section = "docs/adr/0023-feature-store.md#step-2-inputs-through-data"
detect = [
    { call = "session_bars" },
    { call = "stored_events" },
    { call = "events_by_event_date" },
    { call = "share_facts" },
    { call = "curve_as_rows" },
    { call = "rollup_rows" },
]

# --------------------------------------------------------------------------- the ingest loop

[[responsibility]]
id = "run-records"
description = "Create run ids and run records and decide COMPLETE / PARTIAL for a run: one-shot use cases (screens, backtests) call storage.runs.start_run + RunRecord.finish; ingestion uses IngestRun; jobs use services/jobs"
owner = [
    "src/algotrade/storage/runs.py",
    "src/algotrade/services/jobs/*",
    "apps/ingestion/algotrade_ingestion/tasks/framework/run.py",
]
section = "docs/adr/0019-ownership-and-boundaries.md#the-ingest-loop-is-written-once"
detect = [{ call = "RunRecord" }, { call = "new_run_id" }, { attr = "RunStatus.PARTIAL" }]

[[responsibility]]
id = "raw-persistence"
description = "Save vendor payloads as received to the raw store before parsing"
owner = ["src/algotrade/storage/backends/*", "apps/ingestion/algotrade_ingestion/tasks/framework/run.py"]
section = "docs/adr/0019-ownership-and-boundaries.md#the-ingest-loop-is-written-once"
detect = [{ call = "raw.put" }]

[[responsibility]]
id = "row-stamping"
description = "Add the point-in-time columns (session_date, knowledge_ts, source, run_id) to stored rows"
owner = ["apps/ingestion/algotrade_ingestion/tasks/framework/run.py"]
section = "docs/adr/0019-ownership-and-boundaries.md#the-ingest-loop-is-written-once"
detect = [{ call = "stamp" }]

[[responsibility]]
id = "id-resolution"
description = "Turn vendor tickers into instrument ids (ADR 0018); build EQ: ids only through the id rule"
owner = [
    "src/algotrade/core/model/instruments.py",
    "src/algotrade/data/resolver.py",
    "apps/ingestion/algotrade_ingestion/tasks/reference/instrument_ids.py",
    "apps/ingestion/algotrade_ingestion/tasks/framework/run.py",
]
section = "docs/adr/0019-ownership-and-boundaries.md#the-ingest-loop-is-written-once"
detect = [{ call = "with_ids" }, { call = "equity_id" }, { string_prefix = "EQ:" }]

[[responsibility]]
id = "ingestion-step-dispatch"
description = "Decide which ingestion steps run, in what order, with which defaults (CLI, nightly): tasks are declared once in the registry; nightly is an ordered list of isolated task steps"
owner = [
    "apps/ingestion/algotrade_ingestion/tasks/framework/registry.py",
    "apps/ingestion/algotrade_ingestion/workflows/*",
]
section = "docs/adr/0019-ownership-and-boundaries.md#r5-everything-runs-through-the-job-runner"
detect = [
    { call_regex = "(^|\\.)(ingest_[a-z_]+|build_universe|import_universe|run_quality|compute_option_liquidity|load_golden|run_migrate_ids)$" },
]

[[responsibility]]
id = "ingestion-report"
description = "The nightly summary report (statistics per step, failed items grouped by reason with examples, failed checks, hints) and notifications: the desktop alert and the daily summary email over SMTP"
owner = [
    "apps/ingestion/algotrade_ingestion/workflows/nightly/records.py",
    "apps/ingestion/algotrade_ingestion/workflows/nightly/report.py",
    "apps/ingestion/algotrade_ingestion/workflows/nightly/render.py",
    "apps/ingestion/algotrade_ingestion/workflows/nightly/timing.py",
    "apps/ingestion/algotrade_ingestion/workflows/nightly/notify.py",
]
section = "docs/architecture.md#nightly-summary-email"
detect = [
    { import = "smtplib" },
    { import = "email" },
    { call = "build_report" },
    { string = "osascript" },
]

[[responsibility]]
id = "refresh-scheduling"
description = "Which keys (CIKs) an incremental reference task refetches on a session: new first, then each once per refresh_days on its own slot day (crc32 of the key), so refreshes spread over the window"
owner = ["apps/ingestion/algotrade_ingestion/tasks/reference/refresh.py"]
section = "docs/data/vendors.md#refreshes-spread-over-the-window"
detect = [{ call = "crc32" }, { call = "slot_day" }]

# --------------------------------------------------------------------------- vendors

[[responsibility]]
id = "vendor-http"
description = "HTTP transport to vendors, auth headers, polite retries and backoff"
owner = ["libs/sources/algotrade_sources/framework/http.py"]
section = "docs/adr/0019-ownership-and-boundaries.md#r3-tasks-get-sources-from-the-registry"
detect = [
    { import = "urllib.request" },
    { import = "urllib.error" },
    { import = "http.client" },
    { import = "requests" },
    { import = "httpx" },
    { import = "aiohttp" },
]

[[responsibility]]
id = "rate-limiting"
description = "Pace requests to a vendor: one limiter per key, shared across threads and processes (file lock under var/run/limits)"
owner = ["libs/sources/algotrade_sources/framework/limiter.py"]
allowed = ["libs/sources/algotrade_sources/framework/http.py"]  # retry backoff waits (Retry-After), not pacing
section = "docs/adr/0019-ownership-and-boundaries.md#r3-tasks-get-sources-from-the-registry"
detect = [{ call = "MinInterval" }, { attr = "time.sleep" }]

[[responsibility]]
id = "source-construction"
description = "Build vendor sources (transport, credentials, pacing, retries) from config/site/sources.toml, and fixture sources (the golden CSVs) from a directory: each source declared once in sources/framework/registry.py; vendor specifics stay in sources/"
owner = ["libs/sources/algotrade_sources/framework/registry.py"]
allowed = [
    "libs/sources/algotrade_sources/*",  # vendor modules import their own helpers (http, base, sec_sic)
    "src/algotrade/features/rollups/corporate/dividends.py",  # the dividends@v1 rollup's name, not a source (ADR 0021 IV30)
]
section = "docs/adr/0019-ownership-and-boundaries.md#r3-tasks-get-sources-from-the-registry"
detect = [
    { import = "algotrade_sources", except = ["algotrade_sources.framework.base", "algotrade_sources.framework.registry", "algotrade_sources.framework.session_thread"] },
    { string = "nasdaqlisted" },
    { string = "otherlisted" },
    { string = "dividends" },
]

[[responsibility]]
id = "session-sources"
description = "Session-based sources (a stateful connection to a local gateway, e.g. IB Gateway): the SessionSource protocol (probe / open / close) and its one lifecycle (base.opened, always closed), built unconnected by the source registry (SessionSpec, SessionInputs) with their shared limiters"
owner = [
    "libs/sources/algotrade_sources/framework/base.py",
    "libs/sources/algotrade_sources/framework/registry.py",
    "libs/sources/algotrade_sources/framework/session_thread.py",  # an app's long-lived session (ADR 0028)
]
allowed = ["libs/sources/algotrade_sources/vendors/ibkr/gateway.py"]  # its TCP probe of the gateway port
section = "docs/adr/0026-live-verification-ibkr.md#session-sources"
detect = [{ call = "SessionSpec" }, { call = "SessionInputs" }, { import = "socket" }]

[[responsibility]]
id = "broker-read-only"
description = "The only code that talks to a broker API (ib_async), READ-ONLY market data: the IbkrMarketData facade guards the IB object (market-data calls only) and never sends an order, account or position request; tests/libs/sources/vendors/ibkr/test_read_only_guard.py fails on any order / account API reference anywhere"
owner = ["libs/sources/algotrade_sources/vendors/ibkr/gateway.py"]
section = "docs/adr/0026-live-verification-ibkr.md#read-only-by-construction"
detect = [{ import = "ib_async" }, { import = "ib_insync" }, { import = "ibapi" }]

[[responsibility]]
id = "live-verification"
description = "Compare a session's stored values with an independent live source (IBKR): the sample, the checks and their tolerances (verification.toml), the verification/ibkr table; the quality check `verification` grades it and the nightly email reports it"
owner = ["apps/ingestion/algotrade_ingestion/tasks/verification/*"]
allowed = [
    "src/algotrade/storage/tables/schemas.py",  # declares the table
    "apps/ingestion/algotrade_ingestion/tasks/maintenance/quality.py",  # grades the session's rows
    "src/algotrade/services/explore/ingestion.py",  # shows them read-only (/admin/verification/ibkr)
]
section = "docs/adr/0026-live-verification-ibkr.md#the-verify-task"
detect = [{ string = "verification/ibkr" }, { call = "compare_bars" }, { call = "Grader" }]

[[responsibility]]
id = "ibkr-enrichment"
description = "IBKR as an enrichment source, read-only (ADR 0028): conids of the optionable universe (instruments/ibkr_contracts) and IB's implied / historical vol per underlying (volatility/ibkr_iv30: history backfill + nightly snapshot), each read through algotrade.data; features derived from them carry licence = personal"
owner = [
    "apps/ingestion/algotrade_ingestion/tasks/reference/ibkr_contracts.py",
    "apps/ingestion/algotrade_ingestion/tasks/market/ibkr_iv.py",
    "src/algotrade/data/volatility.py",
]
allowed = [
    "src/algotrade/storage/tables/schemas.py",  # declares the tables
    "src/algotrade/data/reference.py",  # the conid snapshot read (one snapshot rule)
    "src/algotrade/features/rollups/options/ibkr_iv.py",  # names its input; read through data.feature_inputs
]
section = "docs/adr/0028-ibkr-enrichment-source.md#decision"
detect = [{ string = "instruments/ibkr_contracts" }, { string = "volatility/ibkr_iv30" }]

[[responsibility]]
id = "live-option-quotes"
description = "The API's live option quotes, read-only (ADR 0028): IBKR quotes for an underlying's expiry through the facade on the API's own client id and session thread, a 60 s cache, the stored delayed chain + a status as the fallback, and the API's one write: the answers recorded in the background to live/option_quotes (only through LiveWriter, atomic per run); read back through data.chains"
owner = [
    "src/algotrade/services/live/*",
    "apps/api/algotrade_api/live.py",
    "src/algotrade/storage/tables/live_writer.py",
]
allowed = [
    "src/algotrade/storage/tables/schemas.py",  # declares the table
    "src/algotrade/data/chains.py",  # the read of the recorded quotes (live_option_quotes)
]
section = "docs/adr/0028-ibkr-enrichment-source.md#live-option-quotes-in-the-api"
detect = [{ string = "live/option_quotes" }, { call = "LiveWriter" }, { call = "SessionThread" }]

[[responsibility]]
id = "secrets-env"
description = "Read environment variables and the local .env: credentials, the data URL, the config directory, the default user (callers receive values as parameters)"
owner = ["src/algotrade/config/env.py"]
section = "docs/adr/0019-ownership-and-boundaries.md#settings-and-environment"
detect = [{ attr = "os.environ" }, { call = "getenv" }, { call = "putenv" }]

# --------------------------------------------------------------------------- storage

[[responsibility]]
id = "parquet-io"
description = "Physical file formats and paths (Parquet today, DuckDB later)"
owner = ["src/algotrade/storage/backends/*"]
section = "docs/adr/0019-ownership-and-boundaries.md#r2-storage-is-generic"
detect = [
    { import = "pyarrow" },
    { import = "duckdb" },
    { call = "read_parquet" },
    { call = "to_parquet" },
]

[[responsibility]]
id = "run-selection"
description = "Which runs of a partition a read at as_of sees, per the table's run mode (TableSpec.runs): snapshot = the latest run; merge (events) = the union from the latest restating run on, the latest run's row per table key"
owner = ["src/algotrade/storage/backends/run_selection.py"]
allowed = [
    "src/algotrade/storage/backends/local.py",  # applies the selection to its _runs.json index
