# --------------------------------------------------------------------------- pending contracts
# Import-linter contracts that cannot hold until a restructure PR lands. Add each to
# pyproject.toml in the PR named here (and delete it from this list).

[[pending_contract]]
name = "R1: only algotrade.data reads market data (consumers never import storage.readers)"
source_modules = ["algotrade.services", "algotrade.engines", "algotrade_backtest", "algotrade_ingestion"]
forbidden_modules = ["algotrade.storage.readers"]
enabled_by_pr = 2

[[pending_contract]]
name = "R2: storage is generic (no domain read helpers: readers move to algotrade.data)"
source_modules = ["algotrade.storage"]
forbidden_modules = ["algotrade.core.fields", "algotrade.core.feature_view"]
enabled_by_pr = 2

[[pending_contract]]
name = "R3: ingestion tasks never import vendor modules (sources come from the registry)"
source_modules = ["algotrade_ingestion.tasks"]
forbidden_modules = [
    "algotrade_ingestion.sources.cboe",
    "algotrade_ingestion.sources.massive",
    "algotrade_ingestion.sources.nasdaq_earnings",
    "algotrade_ingestion.sources.nasdaq_trader",
    "algotrade_ingestion.sources.sec_edgar",
    "algotrade_ingestion.sources.spy_holdings",
]
enabled_by_pr = 4

[[pending_contract]]
name = "R4: vendor sources never import storage (standard frames carry their own schema)"
source_modules = ["algotrade_ingestion.sources"]
forbidden_modules = ["algotrade.storage"]
enabled_by_pr = 6

[[pending_contract]]
name = "R5: apps never build a job runner (they submit through services.jobs)"
source_modules = ["algotrade_ingestion.cli", "algotrade_ingestion.commands", "algotrade_backtest"]
forbidden_modules = ["algotrade.services.jobs.runner"]
enabled_by_pr = 5
