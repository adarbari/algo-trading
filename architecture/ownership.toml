section = "docs/adr/0019-ownership-and-boundaries.md#settings-and-environment"
detect = [{ attr = "os.environ" }, { call = "getenv" }, { call = "putenv" }]

# --------------------------------------------------------------------------- storage

[[responsibility]]
id = "parquet-io"
description = "Physical file formats and paths (Parquet today, DuckDB later)"
owner = ["src/algotrade/storage/backends/*"]
section = "docs/adr/0019-ownership-and-boundaries.md#r2-storage-is-generic"
detect = [
    { import = "pyarrow" },
    { import = "duckdb" },
    { call = "read_parquet" },
    { call = "to_parquet" },
]

[[responsibility]]
id = "run-selection"
description = "Which runs of a partition a read at as_of sees, per the table's run mode (TableSpec.runs): snapshot = the latest run; merge (events) = the union from the latest restating run on, the latest run's row per table key"
owner = ["src/algotrade/storage/backends/run_selection.py"]
allowed = [
    "src/algotrade/storage/backends/local.py",  # applies the selection to its _runs.json index
    "src/algotrade/storage/backends/local_index.py",  # parses _runs.json entries into RunEntry
    "src/algotrade/storage/backends/memory.py",  # applies the selection to its in-memory runs
]
section = "docs/adr/0007-point-in-time-data.md#how-runs-combine"
detect = [{ call = "select_runs" }, { call = "merge_rows" }, { call = "RunEntry" }]

[[responsibility]]
id = "run-publish"
description = "Atomic publication of a run's table writes (ADR 0022): pending writes, one commit for every table at once (or abort), commit sequence for readers, crash recovery; driven by IngestRun for ingestion and ResultWriter.publishing for services"
owner = [
    "src/algotrade/storage/backends/*",
    "src/algotrade/storage/tables/writers.py",
    "src/algotrade/storage/tables/result_writer.py",
    "apps/ingestion/algotrade_ingestion/tasks/framework/run.py",
]
section = "docs/adr/0022-atomic-run-publication.md#decision"
detect = [{ call = "commit_run" }, { call = "abort_run" }, { call = "recover_runs" }]

[[responsibility]]
id = "locking"
description = "Exclusive locks across threads and processes (flock): named store locks and the partition run-index lock (storage); the one-writer ingest run lock (services/jobs)"
owner = ["src/algotrade/storage/locks.py", "src/algotrade/services/jobs/exclusive.py"]
allowed = ["libs/sources/algotrade_sources/framework/limiter.py"]  # sources never import storage (R4): the limiter flocks its own state file
section = "docs/adr/0019-ownership-and-boundaries.md#r2-storage-is-generic"
detect = [{ import = "fcntl" }, { call = "flock" }]

# --------------------------------------------------------------------------- settings, time, jobs

[[responsibility]]
id = "site-settings"
description = "Load and type L3 site settings (config/site/*.toml: sources, universe + overrides, nightly, defaults, users with roles per ADR 0040, the field guide per ADR 0041): one loader, frozen dataclasses; the store only reads files"
owner = [
    "src/algotrade/config/site/settings.py",
    "src/algotrade/config/site/users.py",
    "src/algotrade/config/site/nightly.py",
    "src/algotrade/config/site/field_guide.py",
    "src/algotrade/storage/configs/store.py",
    "src/algotrade/storage/configs/files.py",
]
section = "docs/adr/0019-ownership-and-boundaries.md#settings-and-environment"
detect = [
    { call = "load", arg = "settings" },
    { call = "load", arg = "defaults" },
    { call = "overrides" },
]

[[responsibility]]
id = "session-calendar"
description = "Which day is a trading session, in exchange time (weekends, holidays, early closes); the last closed session"
owner = ["src/algotrade/core/time/calendar.py"]
allowed = ["src/algotrade/core/time/clock.py"]  # business_days: a plain weekday grid for synthetic golden data (no holidays by design)
section = "docs/adr/0019-ownership-and-boundaries.md#r5-everything-runs-through-the-job-runner"
detect = [
    { call = "ZoneInfo", arg = "America/New_York" },
    { call = "weekday" },
    { call = "busday_offset" },
]

[[responsibility]]
id = "job-execution"
description = "Execute long-running work: threads, locks, recovery, idempotency; apps run jobs through services.jobs.run_job, fan-out through services.jobs.as_completed"
owner = ["src/algotrade/services/jobs/*"]
allowed = [
    "libs/sources/algotrade_sources/framework/session_thread.py",  # a gateway session's own thread (its socket + event loop), not work (ADR 0028)
    "src/algotrade/services/live/recorder.py",  # the API's background writer of live quotes: one thread draining a queue, not a job (ADR 0028)
]
section = "docs/adr/0019-ownership-and-boundaries.md#r5-everything-runs-through-the-job-runner"
detect = [
    { call = "LocalJobRunner" },
    { call = "ThreadPoolExecutor" },
    { call = "ProcessPoolExecutor" },
    { call = "threading.Thread" },
]

[[responsibility]]
id = "selection-rebalancing"
description = "Re-evaluate a backtest's selection over time (rebalance_selection): which sessions + the audit of each change (engines/selection/schedule.py), point-in-time evaluation through services.selection.select and one price load for the union (services/backtests/rebalance.py), the tradable set per bar and exits on removal (engines/backtest/universe.py, used by the engine loop)"
owner = [
    "src/algotrade/engines/selection/schedule.py",
    "src/algotrade/services/backtests/rebalance.py",
    "src/algotrade/engines/backtest/universe.py",
    "src/algotrade/engines/backtest/engine.py",
]
section = "docs/configuration.md#rebalancing-selections"
detect = [
    { call = "rebalance_sessions" },
    { call = "DynamicUniverse" },
]

[[responsibility]]
id = "three-valued-predicate"
description = "Evaluate Rule / Group predicates over named fields with three-valued (Kleene) logic: missing, NaN or wrong-typed values are UNKNOWN, never a pass; shared by selections and rule screens"
owner = ["src/algotrade/core/model/predicates.py"]
allowed = [
    "src/algotrade/engines/selection/evaluate.py",  # the selection's per-rule funnel audit evaluates each top-level child
    "src/algotrade/strategies/screeners/rules/*",  # rule screens evaluate criteria, tiers and flags with it
]
section = "docs/configuration.md#selections"
detect = [{ call = "evaluate_rule" }, { call = "evaluate_group" }]

[[responsibility]]
id = "screen-spec"
description = "Parse and validate a rule screen (ADR 0029): criteria with HARD / SOFT (tolerance band) / SCORE modes, tiers, flags, classify, columns, tie-break; fail closed against the field catalogue; the pure ScreenSpec values"
owner = ["src/algotrade/config/strategy/screen_spec.py", "src/algotrade/core/model/screen_spec.py"]
section = "docs/screeners/rules.md#criteria"
detect = [{ call = "parse_screen_spec" }, { call = "Criterion" }, { call = "Tolerance" }]

[[responsibility]]
id = "config-authoring"
description = "Write L4 user configs (ADR 0029): a rule screen's draft, finalise into an immutable v<N> (validated fail closed), copy a site preset pinned to its version and rebase, delete a screen (archive its folder), the schedule switch, named user expression features; for a user the site registry declares (the API passes the registry as a predicate to `author`; no I/O of its own); the ConfigWriter (atomic, user-scoped files) behind the ConfigStore protocol (which reads drafts and versions back: the read model, services/read/screens/documents.py)"
owner = ["src/algotrade/services/authoring/*", "src/algotrade/storage/configs/writer.py"]
section = "docs/adr/0029-rule-screener.md#versioned-configs"
detect = [{ call = "add_version" }, { call = "save_features" }]

[[responsibility]]
id = "rule-screen-evaluation"
description = "Evaluate a rule screen (ADR 0029): each criterion's outcome, distance and penalty (HARD / SOFT tolerance band / SCORE), the row decision incl. SKIPPED, the distance score, rank and tie-break, tiers / flags / classify / columns, and the run summary (passed, skipped by reason, narrow misses)"
owner = ["src/algotrade/strategies/screeners/rules/*"]
section = "docs/screeners/rules.md#decision"
detect = [{ call = "evaluate_screen" }, { call = "evaluate_criterion" }, { call = "summarise" }]

[[responsibility]]
id = "screen-execution"
description = "Run a configured screen (select, screen, audit, write results); nightly submits `screen` jobs (workflows/nightly/screens.py)"
owner = [
    "src/algotrade/services/screening/run.py",
    "src/algotrade/services/screening/rule_results.py",  # a rule screen's result frames
    "src/algotrade/services/jobs/handlers.py",
]
section = "docs/adr/0019-ownership-and-boundaries.md#r5-everything-runs-through-the-job-runner"
detect = [{ call = "run_screener" }]

# --------------------------------------------------------------------------- api (ADR 0024)

[[responsibility]]
id = "http-api"
description = "Serve HTTP: FastAPI routers (one per area: writes, job polling, health, live quotes, preview POSTs), response schemas, CORS, error mapping and the ASGI server; routes call one library function each (page reads are GraphQL: graphql-schema)"
owner = ["apps/api/algotrade_api/*"]
section = "docs/adr/0024-api.md#http-layer"
detect = [{ import = "fastapi" }, { import = "starlette" }, { import = "uvicorn" }]

[[responsibility]]
id = "web-on-api-origin"
description = "Serve the built web app on the API's origin (ADR 0044): the files of ALGOTRADE_WEB_DIST, the SPA fallback to index.html, confinement to the build directory, cache headers; create_app mounts it last so every API route keeps precedence"
owner = ["apps/api/algotrade_api/web.py"]
section = "docs/adr/0044-hosting-from-the-owners-mac.md#decision"
detect = [
    { call = "FileResponse" },
    { import = "starlette.staticfiles" },
    { import = "fastapi.staticfiles" },
]

[[responsibility]]
id = "launchd-agents"
description = "Generate the macOS launchd agents that run the apps on the owner's Mac, written and never installed (the owner runs launchctl): the nightly (ingestion ops/schedule.py) and the API kept serving behind Tailscale Funnel (api ops/schedule.py, ADR 0044)"
owner = [
    "apps/ingestion/algotrade_ingestion/ops/schedule.py",
    "apps/api/algotrade_api/ops/schedule.py",
]
section = "docs/adr/0044-hosting-from-the-owners-mac.md#decision"
detect = [{ import = "plistlib" }]

[[responsibility]]
id = "api-authentication"
description = "Resolve the caller of an API request (ADR 0040): the Authenticator seam, Supabase access tokens verified offline (JWKS cached by kid and refreshed on an unknown kid, or the legacy HS256 secret; iss, aud, exp), the token's email mapped to a registry user (401 no or bad token, 403 no registry user), and ALGOTRADE_AUTH=off on loopback only; REST deps and the GraphQL context call it, nothing else reads the Authorization header or decodes a token"
owner = ["apps/api/algotrade_api/auth/*"]
section = "docs/adr/0040-identity-and-roles.md#decision"
detect = [
    { import = "jwt" },
    { import = "fastapi.security" },
    { string = "authorization" },
    { call = "get_unverified_header" },
]

[[responsibility]]
id = "run-item-summary"
description = "Summarise a run record's per-item statuses: status codes, which are fine, failed items grouped by a normalised reason (the nightly report and the API share it)"
owner = ["src/algotrade/services/run_items.py"]
section = "docs/api/read-model.md#the-domain-objects"
detect = [{ string = "<date>" }, { string = "<url>" }]

# --------------------------------------------------------------------------- the read model (ADR 0036-0038)
# Built over read-model PRs 2-10b (docs/api/read-model.md "Migration plan"); services/explore,
# the legacy page reads, was deleted in PR 10b. A new rule is added with the code it guards
# (never parked in known_violations.toml).

[[responsibility]]
id = "session-resolution"
description = "Which partition a read sees (ADR 0036): resolve one Session (requested, else the latest with bars) and read session-grain tables for exactly that date, UNKNOWN otherwise; snapshot tables through data.reference.snapshot with the snapshot date disclosed. services/read/session.py resolves (resolve_session, the table grains); services/read/context.py calls it once per request (open_context) and reads session partitions (partition); nothing else may (services/explore, which picked its own partition by six rules, the bug ADR 0036 fixes, was deleted in read-model PR 10b)"
owner = [
    "src/algotrade/services/read/session.py",
    "src/algotrade/services/read/context.py",
]
allowed = [
    "src/algotrade/data/reference.py",  # the snapshot-grain primitive (snapshot-selection, ADR 0007's one rule)
    "src/algotrade/services/ondemand/screens.py",  # a write: an on-request run targets the latest session (ADR 0033), outside read strictness (ADR 0036 decision 5)
]
section = "docs/api/read-model.md#session-resolution"
detect = [
    { call = "partition_for" },
    { call = "latest_session" },
    { call = "latest_date" },
    { call = "rollup_row" },
    { call = "resolve_session" },
]

[[responsibility]]
id = "domain-read-model"
description = "Domain read objects and their loaders (ADR 0037): every read a page shows is a frozen dataclass built by one load_<object>(ctx, ...) in services/read/<area>/, for ctx.session only; per-instrument values by catalogue name (ADR 0038), never a table path. A fact a page needs is stored, not computed on read: chain_expiries (the nearest expiry, stored as rollup.nearest_expiry@v1 since read-model PR 3) is called only by data/ and the producing feature group (read-model PR 5 deleted its last read-time caller, explore ideas/ranking.py)"
owner = ["src/algotrade/services/read/*"]
allowed = [
    "src/algotrade/data/*",  # the generic table reads (R1)
    "src/algotrade/features/*",  # feature groups name their own tables
    "src/algotrade/core/model/fields.py",  # ROLLUP_TABLE_PREFIX: catalogue names -> tables, in one place
    "src/algotrade/storage/tables/schemas.py",  # declares the rollups/instrument/* and rollups/market/* table families
    "src/algotrade/strategies/screeners/*",  # a screener declares the feature table it reads through core.views (engine input, not a display read)
    "apps/ingestion/*",  # producers and the verification checks name the tables they write or compare
]
section = "docs/api/read-model.md#the-domain-objects"
detect = [{ string_prefix = "rollups/instrument/" }, { string_prefix = "rollups/market/" }, { call = "chain_expiries" }]

[[responsibility]]
id = "scalar-coercion"
description = "Turn a stored scalar (numpy, pandas, NaN, NaT, dates) into a JSON-safe value, one way for reads and runs (ADR 0037): services/read/values.py to_scalar; services/views.py imports it back as to_value for runs. Callers of the one coercion are allowed; re-implementations are not: a private _float / _text / _num helper is one (read-model PR 8), except where it parses a vendor payload, formats text or does arithmetic rather than coerce a stored value for display (the allowed entries below say which)"
owner = ["src/algotrade/services/read/values.py"]
allowed = [
    "src/algotrade/services/read/*",  # the loaders call the one coercion for every value they return (docs/api/read-model.md "Values and UNKNOWN")
    "src/algotrade/services/views.py",  # re-exports to_scalar as to_value (runs) and coerces the FeatureView through it
    "src/algotrade/services/preview/*",  # the Builder's dry runs show values through the one coercion, as the nightly run stores them
    "src/algotrade/services/screening/exports.py",  # run exports serialise through the same coercion, so runs and reads agree
    "src/algotrade/services/selection.py",  # the selection's field values, same coercion
    "src/algotrade/services/screening/rule_results.py",  # the rule-screen writer types value_num through the one coercion (_num calls to_value)
    "src/algotrade/storage/configs/writer.py",  # _float formats a TOML float literal (text out, not a stored value in)
    "src/algotrade/features/rollups/options/option_liquidity.py",  # _num is the rollup's arithmetic rule (no open interest / volume counts as 0), not display coercion
    "libs/sources/algotrade_sources/vendors/*",  # vendor payload parsers (_float / _text read a vendor's JSON, XML or CSV, never a stored value)
    "apps/ingestion/algotrade_ingestion/workflows/nightly/*",  # the nightly email renderer and its timing lines format run-record stats as text
]
section = "docs/api/read-model.md#values-and-unknown"
detect = [{ call = "to_value" }, { call = "to_scalar" }, { call_regex = "^_(float|text|num)$" }]

[[responsibility]]
id = "graphql-schema"
description = "The GraphQL read layer (ADR 0037): the Strawberry schema at POST /graphql, scalars (FeatureName, Date, JSON), error codes, limits, request context, dataloaders and the thin types over services.read; the committed snapshot apps/api/schema.graphql (from read-model PR 4)"
owner = ["apps/api/algotrade_api/graphql/*"]
section = "docs/api/read-model.md#graphql-conventions"
detect = [{ import = "strawberry" }]

[[responsibility]]
id = "ideas-ranking"
description = "The Ideas list (ADR 0029): one row per ticker over the user's rule screens' runs for exactly the session (ADR 0036: a screener with no run for it is NOT_RUN, no lookback), listing each screener that picked it, ranked by the user's screener priority (preferences.toml ideas.priority), then score, tie-break and instrument id; per-screener picked counts and best picks over the whole run; never recomputes a screen (read-model PR 5)"
owner = ["src/algotrade/services/read/screens/ideas.py"]
allowed = ["apps/api/algotrade_api/graphql/*"]  # Query.ideas serves it (one loader call per resolver)
section = "docs/adr/0029-rule-screener.md#owner-decisions-2026-10-03"
detect = [{ call = "load_ideas" }]

[[responsibility]]
id = "screen-drafting"
description = "A rule screen drafted from a sentence (ADR 0041): the TextModel protocol, the prompt over the caller's catalogue (name, type, unit, description, category values), the phrasebook and the field guide (config/site/field_guide/*.toml: how to read a field, the criterion per intent, caveats, situations; no market data, results or credentials), strict parsing of the model's JSON, invented fields and rejected criteria dropped with a reason, the rest validated with resolve_rule_draft; the one OpenAI-compatible adapter (built by the source registry, the key only in a header) and the API's wiring of it from llm.toml; a draft the Builder loads, never a write, never a run"
owner = [
    "src/algotrade/services/drafting/*",
    "libs/sources/algotrade_sources/llm/*",
    "apps/api/algotrade_api/drafting.py",
]
allowed = [
    "libs/sources/algotrade_sources/framework/registry.py",  # builds the adapter, as every vendor client (source-construction)
    "apps/api/algotrade_api/routes/drafting/*",  # the thin route calls the one use case
]
section = "docs/adr/0041-natural-language-screener-drafts.md#decision"
detect = [{ call = "draft_screen" }, { call = "ChatCompletions" }, { call = "build_text_model" }, { string = "chat/completions" }]

[[responsibility]]
id = "screen-preview"
description = "The Builder's dry runs (ADR 0029), over the request's ReadContext: an unsaved rule-screen draft resolved for a user and evaluated by the nightly evaluate_screen on the context's session (summary, funnel, coverage, top rows; the field frame cached per session, fields, user features and visible_seq), and a formula type checked and sampled on that session; never writes; REST POSTs by design"
owner = ["src/algotrade/services/preview/*"]
section = "docs/adr/0029-rule-screener.md#preview--nightly"
detect = [{ call = "field_frame" }]

# Stored tables: architecture/tables.toml (one producing owner each).
