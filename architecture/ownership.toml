section = "docs/configuration.md#rebalancing-selections"
detect = [
    { call = "rebalance_sessions" },
    { call = "DynamicUniverse" },
]

[[responsibility]]
id = "three-valued-predicate"
description = "Evaluate Rule / Group predicates over named fields with three-valued (Kleene) logic: missing, NaN or wrong-typed values are UNKNOWN, never a pass; shared by selections and rule screens"
owner = ["src/algotrade/core/model/predicates.py"]
allowed = [
    "src/algotrade/engines/selection/evaluate.py",  # the selection's per-rule funnel audit evaluates each top-level child
    "src/algotrade/strategies/screeners/rules/*",  # rule screens evaluate criteria, tiers and flags with it
]
section = "docs/configuration.md#selections"
detect = [{ call = "evaluate_rule" }, { call = "evaluate_group" }]

[[responsibility]]
id = "screen-spec"
description = "Parse and validate a rule screen (ADR 0029): criteria with HARD / SOFT (tolerance band) / SCORE modes, tiers, flags, classify, columns, tie-break; fail closed against the field catalogue; the pure ScreenSpec values"
owner = ["src/algotrade/config/strategy/screen_spec.py", "src/algotrade/core/model/screen_spec.py"]
section = "docs/screeners/rules.md#criteria"
detect = [{ call = "parse_screen_spec" }, { call = "Criterion" }, { call = "Tolerance" }]

[[responsibility]]
id = "config-authoring"
description = "Write L4 user configs (ADR 0029): a rule screen's draft, finalise into an immutable v<N> (validated fail closed), copy a site preset pinned to its version and rebase, the schedule switch, named user expression features; the ConfigWriter (atomic, user-scoped files) behind the ConfigStore protocol"
owner = ["src/algotrade/services/authoring/*", "src/algotrade/storage/configs/writer.py"]
section = "docs/adr/0029-rule-screener.md#versioned-configs"
detect = [{ call = "add_version" }, { call = "save_features" }]

[[responsibility]]
id = "rule-screen-evaluation"
description = "Evaluate a rule screen (ADR 0029): each criterion's outcome, distance and penalty (HARD / SOFT tolerance band / SCORE), the row decision incl. SKIPPED, the distance score, rank and tie-break, tiers / flags / classify / columns, and the run summary (passed, skipped by reason, narrow misses)"
owner = ["src/algotrade/strategies/screeners/rules/*"]
section = "docs/screeners/rules.md#decision"
detect = [{ call = "evaluate_screen" }, { call = "evaluate_criterion" }, { call = "summarise" }]

[[responsibility]]
id = "screen-execution"
description = "Run a configured screen (select, screen, audit, write results); nightly submits `screen` jobs (workflows/nightly/screens.py)"
owner = [
    "src/algotrade/services/screening/run.py",
    "src/algotrade/services/screening/rule_results.py",  # a rule screen's result frames
    "src/algotrade/services/jobs/handlers.py",
]
section = "docs/adr/0019-ownership-and-boundaries.md#r5-everything-runs-through-the-job-runner"
detect = [{ call = "run_screener" }]

# --------------------------------------------------------------------------- api (ADR 0024)

[[responsibility]]
id = "http-api"
description = "Serve HTTP: FastAPI routers (one per area), response schemas, CORS, error mapping and the ASGI server; routes call one services.explore query each"
owner = ["apps/api/algotrade_api/*"]
section = "docs/adr/0024-api.md#http-layer"
detect = [{ import = "fastapi" }, { import = "starlette" }, { import = "uvicorn" }]

[[responsibility]]
id = "run-item-summary"
description = "Summarise a run record's per-item statuses: status codes, which are fine, failed items grouped by a normalised reason (the nightly report and the API share it)"
owner = ["src/algotrade/services/run_items.py"]
section = "docs/adr/0024-api.md#explore-queries"
detect = [{ string = "<date>" }, { string = "<url>" }]

[[responsibility]]
id = "explore-queries"
description = "Read-only queries apps display (runs, universe, instruments, chains, features, screens, backtests, configs): which session a ?date= sees, pages, JSON-safe rows"
owner = ["src/algotrade/services/explore/*"]
section = "docs/adr/0024-api.md#explore-queries"
detect = [{ call = "paginate" }, { call = "partition_for" }]

[[responsibility]]
id = "ideas-ranking"
description = "The Ideas list (ADR 0029): one row per ticker over every rule screen's latest stored run, listing each screener that picked it, ranked by the user's screener priority (preferences.toml ideas.priority), then score, tie-break and instrument id; never recomputes a screen"
owner = ["src/algotrade/services/explore/ideas/ranking.py"]
section = "docs/adr/0029-rule-screener.md#owner-decisions-2026-10-03"
detect = [{ call = "top_ideas" }]

[[responsibility]]
id = "screen-preview"
description = "The Builder's dry runs (ADR 0029): an unsaved rule-screen draft resolved for a user and evaluated by the nightly evaluate_screen on the latest closed session (summary, funnel, coverage, top rows; the field frame cached per session, fields, user features and visible_seq), and a formula type checked and sampled; never writes"
owner = ["src/algotrade/services/explore/preview/*"]
section = "docs/adr/0029-rule-screener.md#preview--nightly"
detect = [{ call = "field_frame" }, { call = "preview_session" }]

