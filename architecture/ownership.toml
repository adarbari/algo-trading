# Superseded group tables (price_stats@v1, dividends@v1, fundamentals@v1, iv_history@v1,
# liquidity_class@v1; ADR 0023 step 3) have no producer: they stay readable until
# `algotrade-ingest retire-features` (tasks/maintenance/retire_features.py) deletes them.
# Every table may additionally be rewritten by the one-off id migration (ADR 0018):
# apps/ingestion/algotrade_ingestion/tasks/maintenance/migrate_ids.py (an admin command, not a producer).
