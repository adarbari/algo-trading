# Ownership registry (ADR 0019): every responsibility has exactly ONE owner.
#
# Before writing code that does X, find X here and extend its owner; never re-implement it.
# A new responsibility needs an entry + owner in the same PR (.claude/skills/add-responsibility).
#
#   owner         module globs that own it (fnmatch; `*` crosses directories)
#   target_owner  (optional) where it is moving; hits there are allowed too, so a PR can move
#                 code without touching this file first.
#   allowed       other modules that may legitimately match a detect rule (rare; say why)
#   detect        AST patterns that signal "this module is doing that work":
#                   call = "name"          a call to name / x.name (arg = "lit": with that literal)
#                   call_regex = "re"      a call whose dotted callee matches the regex
#                   attr = "a.b"           an attribute expression ending in a.b (read or call)
#                   import = "mod"         importing mod or a submodule (except = [prefixes])
#                   string / string_prefix a string literal (docstrings ignored)
#
# scripts/check_ownership.py reports hits outside owner/target_owner/allowed. The ratchet
# (architecture/known_violations.toml) is EMPTY: any hit fails CI.
# An exception needs an ADR, and then belongs in `allowed` (with the reason), never the ratchet.

doc = "docs/adr/0019-ownership-and-boundaries.md"

# --------------------------------------------------------------------------- reading data

[[responsibility]]
id = "snapshot-selection"
description = "Pick the snapshot a reader sees: the latest partition on or before a date, else the earliest (pre_snapshot)"
owner = ["src/algotrade/data/reference.py"]
section = "docs/adr/0019-ownership-and-boundaries.md#r1-only-data-reads-market-data"
detect = [{ call = "latest_date" }]

[[responsibility]]
id = "market-data-reads"
description = "Domain reads of market data (reference, InstrumentView, universe, bars + adjustments, events, chains, rates, IBKR vols) for consumers"
owner = ["src/algotrade/data/*"]
allowed = ["src/algotrade/storage/*"]  # the generic reader itself lives in storage
section = "docs/adr/0019-ownership-and-boundaries.md#r1-only-data-reads-market-data"
detect = [{ import = "algotrade.storage.tables.readers" }]

[[responsibility]]
id = "rates-reads"
description = "Which Treasury curve a date sees (latest on or before, earliest flagged) and rates for a time to expiry: consumers call data.rates.curve, never read rates/treasury themselves"
owner = ["src/algotrade/data/rates.py"]
allowed = [
    "src/algotrade/storage/tables/schemas.py",  # declares the table
    "apps/ingestion/algotrade_ingestion/tasks/market/rates.py",  # its one producer
    "apps/ingestion/algotrade_ingestion/tasks/framework/registry.py",  # declares the task's tables
    "libs/sources/algotrade_sources/vendors/treasury/*",  # the vendor's frame key
    "src/algotrade/features/rollups/options/iv30.py",  # names its input; the framework reads it through data.rates (ADR 0021 IV30)
]
section = "docs/adr/0021-option-pricing-conventions.md#rates"
detect = [{ string = "rates/treasury" }]

# --------------------------------------------------------------------------- quant (pure numerics)

[[responsibility]]
id = "option-pricing"
description = "European option prices and Greeks (Black-Scholes-Merton, continuous q and r) and the normal CDF they use"
owner = ["src/algotrade/quant/black_scholes.py"]
section = "docs/adr/0021-option-pricing-conventions.md#model"
detect = [{ import = "scipy.stats" }, { call = "erfc" }, { call = "erf" }]

[[responsibility]]
id = "implied-vol"
description = "Invert option prices to implied volatility, with a failure code per element"
owner = ["src/algotrade/quant/implied_vol.py"]
section = "docs/adr/0021-option-pricing-conventions.md#implied-volatility"
detect = [{ import = "scipy.optimize" }, { call_regex = "(^|\\.)(brentq|newton|bisect|fsolve)$" }]

[[responsibility]]
id = "realized-vol"
description = "Realised volatility estimators over rolling windows (close-to-close, Parkinson, Garman-Klass, Yang-Zhang), annualised"
owner = ["src/algotrade/quant/realized_vol.py"]
section = "docs/adr/0021-option-pricing-conventions.md#realised-volatility"
detect = [{ call = "sliding_window_view" }]

[[responsibility]]
id = "rate-conventions"
description = "Treasury par yield -> continuous rate, tenor labels -> days, yield-curve interpolation"
owner = ["src/algotrade/quant/rates.py"]
section = "docs/adr/0021-option-pricing-conventions.md#rates"
detect = [{ call = "log1p" }, { call = "interp" }]

[[responsibility]]
id = "quant-covariance"
description = "Cross-asset stress from a rolling covariance of a returns panel: Kritzman-Li turbulence (Mahalanobis distance, eigen pseudo-inverse), the absorption ratio and its standardised shift (eigenvalues only)"
owner = ["src/algotrade/quant/covariance.py"]
section = "docs/architecture.md#8-code-layout-enforced"
detect = [{ call_regex = "(^|\\.)linalg\\.(eigh|eigvalsh|eig|eigvals|pinv|svd|inv)$" }, { call = "cov" }]

[[responsibility]]
id = "quant-turning-points"
description = "Bull and bear market dating of a level series (Pagan-Sossounov after Bry-Boschan, the Lunde-Timmermann threshold filter) into phases over array indices, and the running drawdown"
owner = ["src/algotrade/quant/turning_points.py"]
section = "docs/architecture.md#8-code-layout-enforced"
detect = [{ call_regex = "(^|\\.)(find_peaks|argrelextrema|argrelmax|argrelmin)$" }]

# --------------------------------------------------------------------------- rollups

[[responsibility]]
id = "rollup-computation"
description = "Compute feature groups (rollups): the FeatureGroup declaration (inputs + lookback, params from rollups.toml, declared features, the entity one row describes: instrument, or market with one MKT:US row checked by the runner, ADR 0047), asking algotrade.data for inputs by table name, point in time per session, backfills; groups are pure compute modules (a materialised expression feature is a one-feature group built by the FeatureSet), stored only by the rollups task (compute_rollups, per entity)"
owner = [
    "src/algotrade/features/framework/*",
    "src/algotrade/features/registry.py",
    "src/algotrade/features/rollups/*",
    "src/algotrade/features/expressions/feature_set.py",
    "apps/ingestion/algotrade_ingestion/tasks/derived/rollups.py",
]
section = "docs/data/layers.md#rollups-as-built"
detect = [{ call = "compute_sessions" }, { call = "compute_one" }, { call = "FeatureGroup" }]

[[responsibility]]
id = "feature-metadata"
description = "Feature definitions and their catalogue: each stored column is a Feature (kind, dtype, unit, description, null meaning, range, categories, inputs) declared in its group, each expression feature one built from its site definition; the registry and the FeatureSet index them and catalogue.py renders docs/data/features.md (ADR 0023); guide.py renders docs/data/field-guide.md from the site field guide (ADR 0041)"
owner = [
    "src/algotrade/features/framework/feature.py",
    "src/algotrade/features/rollups/*",
    "src/algotrade/features/expressions/definitions.py",
    "src/algotrade/features/registry.py",
    "src/algotrade/features/catalogue.py",
    "src/algotrade/features/guide.py",  # renders docs/data/field-guide.md from the site field guide (ADR 0041)
]
section = "docs/adr/0023-feature-store.md#decision"
detect = [{ call = "Feature" }, { string = "docs/data/features.md" }]

[[responsibility]]
id = "feature-expressions"
description = "The expression language for features: lexing, parsing, type checking and vectorised evaluation of a formula over feature columns (null semantics, Kleene logic); never Python eval"
owner = ["src/algotrade/features/expressions/*"]
section = "docs/adr/0023-feature-store.md#step-3-expression-features-virtual-by-default"
detect = [
    { call = "parse_formula" },
    { call = "check_formula" },
    { call = "evaluate_formula" },
    { call = "eval" },
    { call = "exec" },
]

[[responsibility]]
id = "feature-definitions"
description = "Expression feature definitions: config/site/features/*.toml and config/users/<id>/features/*.toml typed by the one settings loader, then resolved against the catalogue (names, params, dependency graph, cycles, dtype and categories, no user feature shadowing a site one) into Features; the site FeatureSet (code groups + expressions + materialised groups) is built once per config store, a user's (site + their virtual features) by FeatureSet.with_user"
owner = [
    "src/algotrade/config/site/settings.py",
    "src/algotrade/features/expressions/definitions.py",
    "src/algotrade/features/expressions/feature_set.py",
    "src/algotrade/features/site.py",
]
section = "docs/adr/0023-feature-store.md#step-3-expression-features-virtual-by-default"
detect = [
    { call = "load_features" },
    { call = "load_user_features" },
    { call = "feature_definitions" },
    { call = "build_expressions" },
    { call = "FeatureSet" },
]

[[responsibility]]
id = "virtual-feature-reads"
description = "Read expression features on read (selections, FeatureView, series): load only the stored columns their formulas need (data.rollups.feature_rows, column-pruned) and evaluate them through the FeatureSet"
owner = ["src/algotrade/services/features.py", "src/algotrade/data/rollups.py"]
section = "docs/adr/0023-feature-store.md#step-3-expression-features-virtual-by-default"
detect = [{ call = "feature_rows" }]

[[responsibility]]
id = "feature-retirement"
description = "Delete a superseded feature group's stored tables (all runs) after checking its replacement covers the same sessions; dry-run reports sizes. Backends implement TableStore.drop / size; only the retire-features command calls drop"
owner = [
    "apps/ingestion/algotrade_ingestion/tasks/maintenance/retire_features.py",
    "src/algotrade/storage/backends/*",
    "src/algotrade/storage/tables/interfaces.py",
    "src/algotrade/storage/tables/writers.py",
]
section = "docs/adr/0023-feature-store.md#step-3-expression-features-virtual-by-default"
detect = [{ attr = "tables.drop" }, { call = "drop_table" }]

[[responsibility]]
id = "feature-input-loading"
description = "What a feature group reads, by table name: each input table's point-in-time read for features (from its data owner), slicing per session and lookback, other groups' stored rows (rollups/instrument/ and rollups/market/) with this run's rows winning, the session's universe snapshot (the population; none before the first) and the symbol -> id map of its reference snapshot (instruments/symbol_ids, a lookup only; ADR 0047); features never read storage or a domain reader"
owner = ["src/algotrade/data/feature_inputs.py"]
allowed = [
    # ADR 0024 / 0037: the API shows stored group rows (a feature's series in the read
    # model's FeatureSeries); a display read, never a feature input
    "src/algotrade/services/read/instruments/series.py",
]
section = "docs/adr/0023-feature-store.md#step-2-inputs-through-data"
detect = [
    { call = "session_bars" },
    { call = "stored_events" },
    { call = "events_by_event_date" },
    { call = "share_facts" },
    { call = "curve_as_rows" },
    { call = "rollup_rows" },
    { call = "symbol_ids" },
]

# --------------------------------------------------------------------------- the ingest loop

[[responsibility]]
id = "run-records"
description = "Create run ids and run records and decide COMPLETE / PARTIAL for a run: one-shot use cases (screens, backtests) call storage.runs.start_run + RunRecord.finish; ingestion uses IngestRun; jobs use services/jobs"
owner = [
    "src/algotrade/storage/runs.py",
    "src/algotrade/services/jobs/*",
    "apps/ingestion/algotrade_ingestion/tasks/framework/run.py",
]
section = "docs/adr/0019-ownership-and-boundaries.md#the-ingest-loop-is-written-once"
detect = [{ call = "RunRecord" }, { call = "new_run_id" }, { attr = "RunStatus.PARTIAL" }]

[[responsibility]]
id = "raw-persistence"
description = "Save vendor payloads as received to the raw store before parsing"
owner = ["src/algotrade/storage/backends/*", "apps/ingestion/algotrade_ingestion/tasks/framework/run.py"]
section = "docs/adr/0019-ownership-and-boundaries.md#the-ingest-loop-is-written-once"
detect = [{ call = "raw.put" }]

[[responsibility]]
id = "row-stamping"
description = "Add the point-in-time columns (session_date, knowledge_ts, source, run_id) to stored rows"
owner = ["apps/ingestion/algotrade_ingestion/tasks/framework/run.py"]
section = "docs/adr/0019-ownership-and-boundaries.md#the-ingest-loop-is-written-once"
detect = [{ call = "stamp" }]

[[responsibility]]
id = "id-resolution"
description = "Turn vendor tickers into instrument ids (ADR 0018); build EQ: ids only through the id rule, and the non-tradable MKT: market ids only through core.model.instruments.market_id (ADR 0047)"
owner = [
    "src/algotrade/core/model/instruments.py",
    "src/algotrade/data/resolver.py",
    "apps/ingestion/algotrade_ingestion/tasks/reference/instrument_ids.py",
    "apps/ingestion/algotrade_ingestion/tasks/framework/run.py",
]
section = "docs/adr/0019-ownership-and-boundaries.md#the-ingest-loop-is-written-once"
detect = [{ call = "with_ids" }, { call = "equity_id" }, { string_prefix = "EQ:" }, { string_prefix = "MKT:" }]

[[responsibility]]
id = "ingestion-step-dispatch"
description = "Decide which ingestion steps run, in what order, with which defaults (CLI, nightly): tasks are declared once in the registry; nightly is an ordered list of isolated task steps"
owner = [
    "apps/ingestion/algotrade_ingestion/tasks/framework/registry.py",
    "apps/ingestion/algotrade_ingestion/workflows/*",
]
section = "docs/adr/0019-ownership-and-boundaries.md#r5-everything-runs-through-the-job-runner"
detect = [
    { call_regex = "(^|\\.)(ingest_[a-z_]+|build_universe|import_universe|run_quality|compute_option_liquidity|load_golden|run_migrate_ids)$" },
]

[[responsibility]]
id = "instrument-tiers"
description = "Which underlyings are core (S&P 500, [cboe] priority_symbols, latest liquidity_class HIGH) and which are rest: the one tier rule, recorded in chains/status.tier at fetch time and graded by the chain acceptance check (ADR 0043)"
owner = ["apps/ingestion/algotrade_ingestion/tasks/market/tiers.py"]
section = "docs/adr/0019-ownership-and-boundaries.md#guardrails"
allowed = [
    "apps/ingestion/algotrade_ingestion/tasks/market/option_chains.py",  # the chain run loads the tiers it records and orders by
    "apps/ingestion/algotrade_ingestion/tasks/maintenance/coverage.py",  # grades coverage per tier
]
detect = [{ call = "Tiers" }, { call = "load_tiers" }]

[[responsibility]]
id = "feature-applicability"
description = "Whether a feature applies to an instrument (Feature.applies_to over the reference snapshot's optionable and security_type facts and the company snapshot's SIC): the one decision behind the read layer's NOT_APPLICABLE and the nightly coverage check (ADRs 0042, 0045); and the declared explanations of a null (null_status with illiquid_statuses / explained_statuses, the closed NullReason) behind ILLIQUID and EXPLAINED (ADR 0046)"
owner = ["src/algotrade/features/framework/feature.py"]
allowed = [
    "src/algotrade/services/read/instruments/features.py",  # NOT_APPLICABLE / ILLIQUID / EXPLAINED on a read
    "apps/ingestion/algotrade_ingestion/tasks/maintenance/coverage.py",  # which names a feature is expected for
]
section = "docs/adr/0042-not-applicable-and-illiquid-values.md#decision"
detect = [{ call = "not_applicable" }]

[[responsibility]]
id = "coverage-acceptance"
description = "Per key feature and tier, the share of the instruments it applies to (Feature.applies_to) that have a value for the session, graded against [quality.coverage.*] (minimum per tier, day-over-day drop, WARN or FAIL): the acceptance check of the rollups step and a quality check (ADR 0043)"
owner = ["apps/ingestion/algotrade_ingestion/tasks/maintenance/coverage.py"]
allowed = ["apps/ingestion/algotrade_ingestion/tasks/maintenance/quality.py"]  # run_quality runs it with the other checks
section = "docs/adr/0043-waiting-on-publication-tiered-and-coverage-acceptance.md#later-prs-under-this-adr-not-in-this-change"
detect = [{ call = "check_coverage" }]

[[responsibility]]
id = "ingestion-report"
description = "The nightly summary report (statistics per step, failed items grouped by reason with examples, failed checks, hints), run timing with the arrival record (each attempt stores when bars / chains data appeared; p50 / p90 over bracketed sessions, timing.py, ADR 0043) and notifications: the desktop alert and the daily summary email over SMTP"
owner = [
    "apps/ingestion/algotrade_ingestion/workflows/nightly/records.py",
    "apps/ingestion/algotrade_ingestion/workflows/nightly/report.py",
    "apps/ingestion/algotrade_ingestion/workflows/nightly/render.py",
    "apps/ingestion/algotrade_ingestion/workflows/nightly/timing.py",
    "apps/ingestion/algotrade_ingestion/workflows/nightly/notify.py",
]
section = "docs/architecture.md#nightly-summary-email"
detect = [
    { import = "smtplib" },
    { import = "email" },
    { call = "build_report" },
    { string = "osascript" },
]

[[responsibility]]
id = "refresh-scheduling"
description = "Which keys (CIKs, instrument ids) an incremental reference or profile task refetches on a session: new first, then each once per refresh_days on its own slot day (crc32 of the key), so refreshes spread over the window"
owner = ["apps/ingestion/algotrade_ingestion/tasks/framework/refresh.py"]
section = "docs/data/vendors.md#refreshes-spread-over-the-window"
detect = [{ call = "crc32" }, { call = "slot_day" }]

