# Ownership registry (ADR 0019): every responsibility has exactly ONE owner.
#
# Before writing code that does X, find X here and extend its owner; never re-implement it.
# A new responsibility needs an entry + owner in the same PR (.claude/skills/add-responsibility).
#
#   owner         module globs that own it (fnmatch; `*` crosses directories)
#   target_owner  (optional) where it is moving; hits there are allowed too, so a PR can move
#                 code without touching this file first. None today: the restructure is done.
#   allowed       other modules that may legitimately match a detect rule (rare; say why)
#   detect        AST patterns that signal "this module is doing that work":
#                   call = "name"          a call to name / x.name (arg = "lit": with that literal)
#                   call_regex = "re"      a call whose dotted callee matches the regex
#                   attr = "a.b"           an attribute expression ending in a.b (read or call)
#                   import = "mod"         importing mod or a submodule (except = [prefixes])
#                   string / string_prefix a string literal (docstrings ignored)
#
# scripts/check_ownership.py reports hits outside owner/target_owner/allowed. The ratchet
# (architecture/known_violations.toml) is EMPTY since restructure PR 6: any hit fails CI.
# An exception needs an ADR, and then belongs in `allowed` (with the reason), never the ratchet.

doc = "docs/adr/0019-ownership-and-boundaries.md"

# --------------------------------------------------------------------------- reading data

[[responsibility]]
id = "snapshot-selection"
description = "Pick the snapshot a reader sees: the latest partition on or before a date, else the earliest (pre_snapshot)"
owner = ["src/algotrade/data/reference.py"]
section = "docs/adr/0019-ownership-and-boundaries.md#r1-only-data-reads-market-data"
detect = [{ call = "latest_date" }]

[[responsibility]]
id = "market-data-reads"
description = "Domain reads of market data (reference, InstrumentView, universe, bars + adjustments, events, chains) for consumers"
owner = ["src/algotrade/data/*"]
allowed = ["src/algotrade/storage/*"]  # the generic reader itself lives in storage
section = "docs/adr/0019-ownership-and-boundaries.md#r1-only-data-reads-market-data"
detect = [{ import = "algotrade.storage.tables.readers" }]

# --------------------------------------------------------------------------- the ingest loop

[[responsibility]]
id = "run-records"
description = "Create run ids and run records and decide COMPLETE / PARTIAL for a run: one-shot use cases (screens, backtests) call storage.runs.start_run + RunRecord.finish; ingestion uses IngestRun; jobs use services/jobs"
owner = [
    "src/algotrade/storage/runs.py",
    "src/algotrade/services/jobs/*",
    "apps/ingestion/algotrade_ingestion/tasks/framework/run.py",
]
section = "docs/adr/0019-ownership-and-boundaries.md#the-ingest-loop-is-written-once"
detect = [{ call = "RunRecord" }, { call = "new_run_id" }, { attr = "RunStatus.PARTIAL" }]

[[responsibility]]
id = "raw-persistence"
description = "Save vendor payloads as received to the raw store before parsing"
owner = ["src/algotrade/storage/backends/*", "apps/ingestion/algotrade_ingestion/tasks/framework/run.py"]
section = "docs/adr/0019-ownership-and-boundaries.md#the-ingest-loop-is-written-once"
detect = [{ call = "raw.put" }]

[[responsibility]]
id = "row-stamping"
description = "Add the point-in-time columns (session_date, knowledge_ts, source, run_id) to stored rows"
owner = ["apps/ingestion/algotrade_ingestion/tasks/framework/run.py"]
section = "docs/adr/0019-ownership-and-boundaries.md#the-ingest-loop-is-written-once"
detect = [{ call = "stamp" }]

[[responsibility]]
id = "id-resolution"
description = "Turn vendor tickers into instrument ids (ADR 0018); build EQ: ids only through the id rule"
owner = [
    "src/algotrade/core/model/instruments.py",
    "src/algotrade/data/resolver.py",
    "apps/ingestion/algotrade_ingestion/tasks/reference/instrument_ids.py",
    "apps/ingestion/algotrade_ingestion/tasks/framework/run.py",
]
section = "docs/adr/0019-ownership-and-boundaries.md#the-ingest-loop-is-written-once"
detect = [{ call = "with_ids" }, { call = "equity_id" }, { string_prefix = "EQ:" }]

[[responsibility]]
id = "ingestion-step-dispatch"
description = "Decide which ingestion steps run, in what order, with which defaults (CLI, nightly): tasks are declared once in the registry; nightly is an ordered list of isolated task steps"
owner = [
    "apps/ingestion/algotrade_ingestion/tasks/framework/registry.py",
    "apps/ingestion/algotrade_ingestion/workflows/*",
]
section = "docs/adr/0019-ownership-and-boundaries.md#r5-everything-runs-through-the-job-runner"
detect = [
    { call_regex = "(^|\\.)(ingest_[a-z_]+|build_universe|import_universe|run_quality|compute_option_liquidity|load_golden|run_migrate_ids)$" },
]

# --------------------------------------------------------------------------- vendors

[[responsibility]]
id = "vendor-http"
description = "HTTP transport to vendors, auth headers, polite retries and backoff"
owner = ["apps/ingestion/algotrade_ingestion/sources/framework/http.py"]
section = "docs/adr/0019-ownership-and-boundaries.md#r3-tasks-get-sources-from-the-registry"
detect = [
    { import = "urllib.request" },
    { import = "urllib.error" },
    { import = "http.client" },
    { import = "requests" },
    { import = "httpx" },
    { import = "aiohttp" },
]

[[responsibility]]
id = "rate-limiting"
description = "Pace requests to a vendor: one limiter per key, shared across threads and processes (file lock under var/run/limits)"
owner = ["apps/ingestion/algotrade_ingestion/sources/framework/limiter.py"]
allowed = ["apps/ingestion/algotrade_ingestion/sources/framework/http.py"]  # retry backoff waits (Retry-After), not pacing
section = "docs/adr/0019-ownership-and-boundaries.md#r3-tasks-get-sources-from-the-registry"
detect = [{ call = "MinInterval" }, { attr = "time.sleep" }]

[[responsibility]]
id = "source-construction"
description = "Build vendor sources (transport, credentials, pacing, retries) from config/site/sources.toml, and fixture sources (the golden CSVs) from a directory: each source declared once in sources/framework/registry.py; vendor specifics stay in sources/"
owner = ["apps/ingestion/algotrade_ingestion/sources/framework/registry.py"]
allowed = ["apps/ingestion/algotrade_ingestion/sources/*"]  # vendor modules import their own helpers (http, base, sec_sic)
section = "docs/adr/0019-ownership-and-boundaries.md#r3-tasks-get-sources-from-the-registry"
detect = [
    { import = "algotrade_ingestion.sources", except = ["algotrade_ingestion.sources.framework.base", "algotrade_ingestion.sources.framework.registry"] },
    { string = "nasdaqlisted" },
    { string = "otherlisted" },
    { string = "dividends" },
]

[[responsibility]]
id = "secrets-env"
description = "Read environment variables and the local .env: credentials, the data URL, the config directory, the default user (callers receive values as parameters)"
owner = ["src/algotrade/config/env.py"]
section = "docs/adr/0019-ownership-and-boundaries.md#settings-and-environment"
detect = [{ attr = "os.environ" }, { call = "getenv" }, { call = "putenv" }]

# --------------------------------------------------------------------------- storage

[[responsibility]]
id = "parquet-io"
description = "Physical file formats and paths (Parquet today, DuckDB later)"
owner = ["src/algotrade/storage/backends/*"]
section = "docs/adr/0019-ownership-and-boundaries.md#r2-storage-is-generic"
detect = [
    { import = "pyarrow" },
    { import = "duckdb" },
    { call = "read_parquet" },
    { call = "to_parquet" },
]

[[responsibility]]
id = "locking"
description = "Exclusive locks across threads and processes (flock): named store locks and the partition run-index lock (storage); the one-writer ingest run lock (services/jobs)"
owner = ["src/algotrade/storage/locks.py", "src/algotrade/services/jobs/exclusive.py"]
allowed = ["apps/ingestion/algotrade_ingestion/sources/framework/limiter.py"]  # sources never import storage (R4): the limiter flocks its own state file
section = "docs/adr/0019-ownership-and-boundaries.md#r2-storage-is-generic"
detect = [{ import = "fcntl" }, { call = "flock" }]

# --------------------------------------------------------------------------- settings, time, jobs

[[responsibility]]
id = "site-settings"
description = "Load and type L3 site settings (config/site/*.toml: sources, universe + overrides, nightly, defaults): one loader, frozen dataclasses; the store only reads files"
owner = [
    "src/algotrade/config/site/settings.py",
    "src/algotrade/storage/configs/store.py",
    "src/algotrade/storage/configs/files.py",
]
section = "docs/adr/0019-ownership-and-boundaries.md#settings-and-environment"
detect = [
    { call = "load", arg = "settings" },
    { call = "load", arg = "defaults" },
    { call = "overrides" },
]

[[responsibility]]
id = "session-calendar"
description = "Which day is a trading session, in exchange time (weekends, holidays, early closes); the last closed session"
owner = ["src/algotrade/core/time/calendar.py"]
allowed = ["src/algotrade/core/time/clock.py"]  # business_days: a plain weekday grid for synthetic golden data (no holidays by design)
section = "docs/adr/0019-ownership-and-boundaries.md#r5-everything-runs-through-the-job-runner"
detect = [
    { call = "ZoneInfo", arg = "America/New_York" },
    { call = "weekday" },
    { call = "busday_offset" },
]

[[responsibility]]
id = "job-execution"
description = "Execute long-running work: threads, locks, recovery, idempotency; apps run jobs through services.jobs.run_job, fan-out through services.jobs.as_completed"
owner = ["src/algotrade/services/jobs/*"]
section = "docs/adr/0019-ownership-and-boundaries.md#r5-everything-runs-through-the-job-runner"
detect = [
    { call = "LocalJobRunner" },
    { call = "ThreadPoolExecutor" },
    { call = "ProcessPoolExecutor" },
    { call = "threading.Thread" },
]

[[responsibility]]
id = "screen-execution"
description = "Run a configured screen (select, screen, audit, write results); nightly submits `screen` jobs (workflows/nightly/screens.py)"
owner = ["src/algotrade/services/screening/run.py", "src/algotrade/services/jobs/handlers.py"]
section = "docs/adr/0019-ownership-and-boundaries.md#r5-everything-runs-through-the-job-runner"
detect = [{ call = "run_screener" }]

# --------------------------------------------------------------------------- stored tables
