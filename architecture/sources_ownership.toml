# Ownership registry (ADR 0019), sources: the vendor sources package (algotrade_sources, ADR 0027).
# Every responsibility has exactly ONE owner. The registry is every architecture/*_ownership.toml
# but web_ownership.toml, one file per layer: an entry lives in the file whose `scope` holds its
# first owner (the longest prefix wins), sorted by id. Fields and detect rules: the docstring of
# scripts/check_ownership.py. Before writing code that does X, find X
# (`grep <keyword> architecture/*ownership.toml`) and extend its owner; a new responsibility
# needs an entry + owner in the same PR (.claude/skills/add-responsibility).

scope = ["libs/sources/"]

[[responsibility]]
id = "broker-read-only"
description = "The only code that talks to a broker API (ib_async), READ-ONLY market data: the IbkrMarketData facade guards the IB object (market-data calls only) and never sends an order, account or position request; tests/libs/sources/vendors/ibkr/test_read_only_guard.py fails on any order / account API reference anywhere"
owner = ["libs/sources/algotrade_sources/vendors/ibkr/gateway.py"]
section = "docs/adr/0026-live-verification-ibkr.md#read-only-by-construction"
detect = [{ import = "ib_async" }, { import = "ib_insync" }, { import = "ibapi" }]

[[responsibility]]
id = "economic-series-sources"
description = "Fetch and normalise economic series into one shape (SERIES_COLUMNS): FRED / ALFRED observations with every vintage, FRED release dates (the calendar of a release, ADR 0050), and published dated files (Stooq, Fed EBP, OFR FSI, Shiller) through named parsers; the registry builds them, the macro task stores them (ADR 0048)"
owner = [
    "libs/sources/algotrade_sources/vendors/fred/*",
    "libs/sources/algotrade_sources/vendors/published/*",
    "libs/sources/algotrade_sources/framework/series.py",
]
allowed = ["libs/sources/algotrade_sources/framework/registry.py"]  # builds both sources, their key and error test
section = "docs/adr/0048-macro-series-with-vintages.md#decision"
detect = [{ string = "series/observations" }, { string = "realtime_start" }]

[[responsibility]]
id = "rate-limiting"
description = "Pace requests to a vendor: one limiter per key, shared across threads and processes (file lock under var/run/limits)"
owner = ["libs/sources/algotrade_sources/framework/limiter.py"]
allowed = ["libs/sources/algotrade_sources/framework/http.py"]  # retry backoff waits (Retry-After), not pacing
section = "docs/adr/0019-ownership-and-boundaries.md#r3-tasks-get-sources-from-the-registry"
detect = [{ call = "MinInterval" }, { attr = "time.sleep" }]

[[responsibility]]
id = "session-sources"
description = "Session-based sources (a stateful connection to a local gateway, e.g. IB Gateway): the SessionSource protocol (probe / open / close) and its one lifecycle (base.opened, always closed), built unconnected by the source registry (SessionSpec, SessionInputs) with their shared limiters"
owner = [
    "libs/sources/algotrade_sources/framework/base.py",
    "libs/sources/algotrade_sources/framework/registry.py",
    "libs/sources/algotrade_sources/framework/session_thread.py",  # an app's long-lived session (ADR 0028)
]
allowed = ["libs/sources/algotrade_sources/vendors/ibkr/gateway.py"]  # its TCP probe of the gateway port
section = "docs/adr/0026-live-verification-ibkr.md#session-sources"
detect = [{ call = "SessionSpec" }, { call = "SessionInputs" }, { import = "socket" }]

[[responsibility]]
id = "source-construction"
description = "Build vendor sources (transport, credentials, pacing, retries) from config/site/sources.toml, and fixture sources (the golden CSVs) from a directory: each source declared once in sources/framework/registry.py; vendor specifics stay in sources/"
owner = ["libs/sources/algotrade_sources/framework/registry.py"]
allowed = [
    "libs/sources/algotrade_sources/*",  # vendor modules import their own helpers (http, base, sec_sic)
    "src/algotrade/features/rollups/corporate/dividends.py",  # the dividends@v1 rollup's name, not a source (ADR 0021 IV30)
]
section = "docs/adr/0019-ownership-and-boundaries.md#r3-tasks-get-sources-from-the-registry"
detect = [
    { import = "algotrade_sources", except = ["algotrade_sources.framework.base", "algotrade_sources.framework.holdings", "algotrade_sources.framework.registry", "algotrade_sources.framework.series", "algotrade_sources.framework.session_thread"] },
    { string = "nasdaqlisted" },
    { string = "otherlisted" },
    { string = "dividends" },
]

[[responsibility]]
id = "vendor-http"
description = "HTTP transport to vendors, auth headers, polite retries and backoff"
owner = ["libs/sources/algotrade_sources/framework/http.py"]
allowed = ["apps/api/algotrade_api/ops/build.py"]  # not a vendor: a GET of our own API's /health on loopback (ADR 0044, amendment 2026-10-07)
section = "docs/adr/0019-ownership-and-boundaries.md#r3-tasks-get-sources-from-the-registry"
detect = [
    { import = "urllib.request" },
    { import = "urllib.error" },
    { import = "http.client" },
    { import = "requests" },
    { import = "httpx" },
    { import = "aiohttp" },
]
