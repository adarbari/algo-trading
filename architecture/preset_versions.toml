# Site rule-screen preset versions are immutable (ADR 0029): a user screen pinned to
# `extends = "<id>@<N>"` must always compute the same thing. Every
# config/site/presets/screeners/<id>/v<N>.toml is listed here with the sha256 of its bytes;
# tests/architecture/test_structure.py fails if a listed file changes or disappears, or a
# version file is not listed. To change a preset, add v<N+1>.toml and its line here.
# Format: "<id>/v<N>.toml" = "<sha256>"

[versions]
"vrp_scanner/v1.toml" = "9985ddc31bd67c653639b7040a535bfd89019e49e005503a8570af13badf81f6"
