# Directory layout registry (ADR 0020), continued: the config/ and docs/ folders
# ([[config_dir]], [[docs_dir]]).
# The rules, the field meanings and the shared settings are in architecture/layout.toml; the
# readers merge every architecture/layout*.toml (scripts/layout_report.py read_layout).

# --------------------------------------------------------------------------- config (config/)
# Every config/site/*.toml is loaded by the one settings loader (config/site/settings.py;
# tests/architecture/test_layout_buckets.py) and every key in it is read by code
# (tests/architecture/test_ownership.py::test_every_site_setting_key_is_read_by_code).

[[config_dir]]
path = "config"
purpose = "configuration by layer: site/ (L3, reviewed via PR) and users/ (L4, local); no files of its own"

[[config_dir]]
path = "config/site"
purpose = "L3 site settings: one <name>.toml per settings group, each loaded by config/site/settings.py"

[[config_dir]]
path = "config/site/field_guide"
purpose = "L3 field guide: how to read each catalogue field, the criterion per intent, caveats, and the situations (loaded by config/site/settings.py load_field_guide through the config store, one level of subfolders; ADR 0041 amended). One folder per theme group of config/site/guide/sections.toml (tradeable, chart, options, company), no file beside them. A file is <stem>.toml plus <stem>-2.toml, cut at an entry so each stays under 900 lines (the 1000-line cap with room to add); a stem is unique across the folders (the config store names a file by its stem) and the files load in stem order, so <stem>-2 follows <stem> and the order of fields and situations is the order of reading; a theme can span files, and the situations sit in tradeable/instrument-2.toml"

[[config_dir]]
path = "config/site/field_guide/tradeable"
purpose = "L3 field guide files of the theme group Who is tradeable (instrument gates); each <stem>.toml with its <stem>-2.toml, under 900 lines each"

[[config_dir]]
path = "config/site/field_guide/chart"
purpose = "L3 field guide files of the theme group The chart (momentum and trend, price levels, volume and liquidity, volatility); each <stem>.toml with its <stem>-2.toml, under 900 lines each"

[[config_dir]]
path = "config/site/field_guide/options"
purpose = "L3 field guide files of the theme group Options (implied volatility, option chain and short strikes, put wing, walls and expiries); each <stem>.toml with its <stem>-2.toml, under 900 lines each"

[[config_dir]]
path = "config/site/field_guide/company"
purpose = "L3 field guide files of the theme group The company and its calendar (events, fundamentals, statements, analyst); each <stem>.toml with its <stem>-2.toml, under 900 lines each"

[[config_dir]]
path = "config/site/features"
purpose = "L3 expression features, one <theme>.toml per theme in the subfolder of its kind (loaded by config/site/settings.py load_features through the config store, one level of subfolders; a theme name is unique across them; ADR 0023 step 3); the 12-file cap applies per subfolder; scores/ (ED7: edge_scores.toml, written by fit-edge-scorer, ADR 0053) is added with its first file"

[[config_dir]]
path = "config/site/features/technical"
purpose = "expression features of the chart: bands.toml (bands, channels, z-scores, regression trend), price.toml (price statistics, relative strength), swing.toml (swing levels, candles, momentum), volume.toml (volume dry-ups, accumulation), allocation.toml (the credit spread against its trend, Keller's momentum score)"

[[config_dir]]
path = "config/site/features/options"
purpose = "expression features of options and volatility: earnings.toml (events against expiries), positioning.toml (skew, flow, term structure), volatility.toml (IV against HV, IV rank), vrp.toml (the VRP scanner), wings.toml (the covered-call wing)"

[[config_dir]]
path = "config/site/features/company"
purpose = "expression features of the company and its tradability: fundamentals.toml (ratios over fundamentals and dividends), liquidity.toml (the liquidity class)"

[[config_dir]]
path = "config/site/features/market"
purpose = "expression features of the market entity: regime.toml (the context signals of the market regime, ADR 0047)"

[[config_dir]]
path = "config/site/edges"
purpose = "edge documents (ADR 0053): one folder per edge id, no files of its own (the folder keeps the 8-file cap from the flat list of ids)"

[[config_dir]]
path = "config/site/edges/*"
purpose = "one edge's edge.toml: thesis, mechanism, persistence, outcome, schedule, universe, the screeners that implement it, status, family and the quality-bar answers (typed by src/algotrade/config/edges; ADR 0053); rendered to docs/edges.md by make features-doc"

[[config_dir]]
path = "config/site/filters"
purpose = "filter definitions, one <surface>.toml per table, list or feed (ADR 0082): the surface's [[column]]s and its [[filter]]s (id, label, group, kind, field, options, bins, window_unit, guide), typed by src/algotrade/config/filters/definitions.py; ideas.toml, screener_results.toml, universe.toml, screeners.toml, edges.toml and edge_trades.toml are the Ideas list's, a screener's results table's, the Explore table's, the Screeners list's, the Edges list's and an edge's trade ledger's"

[[config_dir]]
path = "config/site/ranking"
purpose = "ranking parameters, one <name>.toml per ranked list: ideas.toml, the Ideas ranking rule (site_top 5, user_top 20, user_weight 3; owner decision 2026-10-22), typed by src/algotrade/config/ranking/ideas.py, read by services/ideas/rule.py"

[[config_dir]]
path = "config/site/series"
purpose = "macro series by source family, one <family>.toml of [[series]] tables per family: cboe.toml (Cboe's static index files); read together with macro.toml by load_macro (ADR 0048), split out because macro.toml is at the 1000-line cap"

[[config_dir]]
path = "config/site/studies"
purpose = "research-study settings, one <name>.toml per study: winners.toml, the ED6 winners study's outcome window, grid, winner and control definitions, discovery thresholds and gate (typed by src/algotrade/config/edges/winners.py; ADR 0053 amendment 2026-10-09)"

[[config_dir]]
path = "config/site/events"
purpose = "event-sensitivity track settings: the scope list of names the event study runs for and the registry of macro releases it calendars and the links.toml of each release's agency page (ADR 0050)"

[[config_dir]]
path = "config/site/guide"
purpose = "the Guide's own sources (ADR 0051): sections.toml (the sections, field theme groups, the screener families in order each with its purpose and intro, the Screeners page's lead), start.toml (the numbered Start here pages, [[page]]); the glossary in glossary/, the edge mechanism pages in mechanisms/, the researched-not-built ideas in ideas/ and the screener prose in screeners/"

[[config_dir]]
path = "config/site/guide/glossary"
purpose = "the Guide's glossary (ADR 0051), one <theme>.toml per theme (the 400-line aim per file; the day, the rule grammar, a screen's result, why a value is not available, edges, the evidence behind a verdict, the text model's cost, Describe it's review panel, the shared filter bar's words): the app's own words, [[term]] each (loaded by config/site/guide/glossary.py in file-name order; fitness tests: ids and terms unique across the files)"

[[config_dir]]
path = "config/site/guide/glossary/edges"
purpose = "the Guide's glossary of the edges (ADR 0051, ADR 0064), one <theme>.toml per theme: the edge page, its evidence and curve, the live record, the outlook and haircut, the ledger and variants, cost and capacity, where the result worked (loaded after the glossary folder; kind guide_glossary_edges)"

[[config_dir]]
path = "config/site/guide/mechanisms"
purpose = "the Guide's edge mechanism pages (ADR 0051, ADR 0064), one <id>.toml per MECHANISM_KINDS value of config/edges/document.py (nine files, the 12-file cap): title, question, an examples line, the short hero, how it works, why it survives, what the research found, real versus decoy, what not to read into it, see-also glossary terms, optional stat tiles and the verified sources (loaded by config/site/guide/mechanisms.py; kind guide_mechanisms; fitness tests: exactly one file per mechanism kind)"

[[config_dir]]
path = "config/site/guide/ideas"
purpose = "the Guide's \"Researched, not built\" ideas (ADR 0051), one <family>.toml per family page of docs/edge-ideas/ (nine files: A cross_sectional to I frontier): every catalogue idea that is not a site edge, [[idea]] each with its id (the catalogue heading's), plain title, mechanism_kind, and either filed_as (the site edge it became under another name) or the catalogue's verdict, feasibility and one sentence on why it is not built (loaded by config/site/guide/ideas.py, kind guide_ideas; fitness tests: the headings and the ids agree, an unfiled id is not a site edge, so building one moves it to filed_as)"

[[config_dir]]
path = "config/site/guide/screeners"
purpose = "the Guide's screener prose (ADR 0051), one subfolder per screener family of config/site/guide/sections.toml (the 12-file cap per folder), one <id>.toml per site rule-screen preset in its family's folder: one line of what it asks, summary, what a hit looks like, what it does not check, the caveats before acting (each text cites a source with [^n]), related screeners, [[sources]] with title, https url and note, and what each criterion asks (loaded by config/site/guide/screeners.py, one level of subfolders; fitness tests: one per preset, in its family's folder, asks match the latest version)"

[[config_dir]]
path = "config/site/guide/screeners/trend"
purpose = "the Guide's screeners of the trend families (trend continuation, pullback, 12-1 momentum, size, the decoys): one <id>.toml per preset the family lists in sections.toml"

[[config_dir]]
path = "config/site/guide/screeners/factors"
purpose = "the Guide's screeners of the factor family (the 12-1 momentum variants, industry momentum, low beta, low volatility): one <id>.toml per preset the family lists in sections.toml"

[[config_dir]]
path = "config/site/guide/screeners/breakouts"
purpose = "the Guide's screeners of the breakout family (range breakout, breakout, failed breakout): one <id>.toml per preset the family lists in sections.toml"

[[config_dir]]
path = "config/site/guide/screeners/reversals"
purpose = "the Guide's screeners of the reversal family (support reversal, oversold reversal, exhaustion, residual and sector reversal): one <id>.toml per preset the family lists in sections.toml"

[[config_dir]]
path = "config/site/guide/screeners/income"
purpose = "the Guide's screeners of the option income family (VRP scanner): one <id>.toml per preset the family lists in sections.toml"

[[config_dir]]
path = "config/site/guide/screeners/options_signals"
purpose = "the Guide's screeners of the option-implied signals family (call-put IV spread, smirk, IV change, option-to-stock volume, lottery attention): one <id>.toml per preset the family lists in sections.toml"

[[config_dir]]
path = "config/site/guide/screeners/allocation"
purpose = "the Guide's screeners of the ETF allocation family (a priced ETF, credit spread against its trend, bond duration by curve and trend, cheap countries by CAPE, currency carry): one <id>.toml per preset the family lists in sections.toml"

[[config_dir]]
path = "config/site/guide/screeners/cross_section"
purpose = "the Guide's screeners of the cross-section rank family (volume shock, dividend month, composite mispricing): one <id>.toml per preset the family lists in sections.toml"

[[config_dir]]
path = "config/site/guide/screeners/events"
purpose = "the Guide's screeners of the earnings events family (post-earnings drift, earnings announcement premium, earnings-date advances, pre-earnings run-up, earnings gaps on volume, reversals into a report): one <id>.toml per preset the family lists in sections.toml"

[[config_dir]]
path = "config/site/guide/screeners/filings"
purpose = "the Guide's screeners of the filings and index changes family (adverse 8-K items, late filers, tender offers, S&P 500 deletions): one <id>.toml per preset the family lists in sections.toml"

[[config_dir]]
path = "config/site/guide/screeners/fundamentals"
purpose = "the Guide's screeners of the quality and value family (cash-based operating profitability, composite value, quality minus junk, net share issuance, asset growth, distress, BDC price to NAV): one <id>.toml per preset the family lists in sections.toml"

[[config_dir]]
path = "config/site/regime"
purpose = "regime track reference data: the crash episodes, the NBER recession chronology and the plain-language indicator cards (ADR 0047)"

[[config_dir]]
path = "config/site/presets"
purpose = "site presets by kind (no files of its own)"

[[config_dir]]
path = "config/site/presets/selections"
purpose = "named selection presets (typed Selection documents) strategies and screeners reuse"

[[config_dir]]
path = "config/site/presets/strategies"
purpose = "strategy and screener presets: kind, impl, params, selection, schedule"

[[config_dir]]
path = "config/site/presets/screeners"
purpose = "rule-screen presets (ADR 0029): one folder per preset id, no files of its own"

[[config_dir]]
path = "config/site/presets/screeners/*"
purpose = "one rule-screen preset's immutable versions v<N>.toml (sha256-locked in architecture/preset_versions.toml)"

[[config_dir]]
path = "config/site/overrides"
purpose = "curated CSV overrides read by the settings loader (e.g. leveraged_etfs.csv)"

[[config_dir]]
path = "config/users"
purpose = "L4 user configs, one folder per user (git-ignored local state: not checked)"
local = true

# --------------------------------------------------------------------------- docs (docs/)

[[docs_dir]]
path = "docs"
purpose = "cross-cutting docs: architecture, roadmap, configuration, testing, hosting, trading pitfalls"

[[docs_dir]]
path = "docs/api"
purpose = "the API's read contract: the read model, GraphQL conventions, what stays REST, the read-model migration plan"

[[docs_dir]]
path = "docs/adr"
purpose = "architecture decision records: numbered, append-only (never moved or renumbered)"
kind = "log"

[[docs_dir]]
path = "docs/data"
purpose = "data specs: layers, storage, instruments, vendors, nightly footprint, feature catalogue and field guide (both generated), options positioning, swing levels"

[[docs_dir]]
path = "docs/data/field-guide"
purpose = "the field guide, generated pages in one folder per theme group (make features-doc from config/site/field_guide/; the index is docs/data/field-guide.md)"

[[docs_dir]]
path = "docs/data/field-guide/tradeable"
purpose = "generated field guide pages of the theme group Who is tradeable (instrument gates), one per theme, a long theme in parts (<theme>-2.md; at most 900 lines each)"

[[docs_dir]]
path = "docs/data/field-guide/chart"
purpose = "generated field guide pages of the theme group The chart (momentum and trend, price levels, volume and liquidity, volatility), one per theme, a long theme in parts (<theme>-2.md; at most 900 lines each)"

[[docs_dir]]
path = "docs/data/field-guide/options"
purpose = "generated field guide pages of the theme group Options (implied volatility, option chain and short strikes, put wing, walls and expiries), one per theme, a long theme in parts (<theme>-2.md; at most 900 lines each)"

[[docs_dir]]
path = "docs/data/field-guide/company"
purpose = "generated field guide pages of the theme group The company and its calendar (events, fundamentals, statements, analyst), one per theme, a long theme in parts (<theme>-2.md; at most 900 lines each)"

[[docs_dir]]
path = "docs/screeners"
purpose = "one page per screener, and the screener index"

[[docs_dir]]
path = "docs/perf"
purpose = "measured performance: baselines (generated by scripts/perf/, e.g. the per-API latency table) and the findings and plans measured from them (e.g. the API memory root cause), and the page-latency bar with how to read its history"

[[docs_dir]]
path = "docs/ui"
purpose = "the web UI: frontend architecture (layers, rules) and the design system"

[[docs_dir]]
path = "docs/decisions"
purpose = "the decision log: product-direction and policy decisions, by the owner or by a Fable agent on their behalf, append-only, log.md plus dated archives log-*.md (.claude/skills/review-and-release)"
kind = "log"

[[docs_dir]]
path = "docs/edges"
purpose = "the generated edge pages, one per family (a.md .. i.md, other.md for an edge with no family); rendered by make features-doc from config/site/edges/, indexed by docs/edges.md"

[[docs_dir]]
path = "docs/edge-ideas"
purpose = "the edge idea catalogue: researched hypotheses not yet filed as edge documents, one page per family with evidence, data needs and a verdict, and the index ranking them (docs/edges-plan.md quality bar; an idea becomes config/site/edges/<id>/edge.toml when it is picked up)"

[[docs_dir]]
path = "docs/edge-evidence"
purpose = "hand-written inputs to the edge evidence rules: the per-setup research table (paper, sample period, rule, match, variants, independent out-of-sample decisions) behind the post-publication basis of the ADR 0065 amendment 2026-10-25"

[[docs_dir]]
path = "docs/drafting"
purpose = "the text-model drafting ('Describe it') plans and specs (ADR 0041)"
