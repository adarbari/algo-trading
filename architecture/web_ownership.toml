# Web ownership registry (ADR 0019, ADR 0025): the web app's responsibilities, each with ONE
# owner, split from ownership.toml by kind (that file holds the Python responsibilities and the
# stored tables). Before writing web code that does X, find X here and extend its owner.
#
# ADR 0025. TypeScript has no AST detect rules here: each web responsibility names the lint
# rule or check that keeps it inside its owner (`enforced_by`); tests/architecture/
# test_ownership.py checks the owners exist and the cited sections resolve.

[[web_responsibility]]
id = "web-styling"
description = "Styling decisions and raw HTML/SVG elements: CSS (Modules), class names, inline styles, colours, sizes"
owner = ["apps/web/design-system/**"]
section = "docs/adr/0025-frontend-architecture.md#rule-3-component-only-ui"
enforced_by = ["eslint no-restricted-syntax + no-restricted-imports (apps/web/lint-rules/restrictions.js)", "stylelint (apps/web/stylelint.config.js)", "tests/architecture/test_layout_web.py (stylesheets only in the design system)"]

[[web_responsibility]]
id = "web-tokens"
description = "Design tokens (colour, type, space, shape, motion, density, z-index) and the generated tokens.css"
owner = ["apps/web/design-system/tokens/*"]
section = "docs/adr/0025-frontend-architecture.md#rule-3-component-only-ui"
enforced_by = ["stylelint declaration-strict-value / color-no-hex / unit-disallowed-list", "npm run generated:check (tokens.css is fresh)"]

[[web_responsibility]]
id = "web-value-format"
description = "How a displayed value reads: number, percent, compact currency, date, signed delta with its up / down tone, missing values"
owner = ["apps/web/design-system/format/*"]
section = "docs/ui/design-system.md#value-formatting"
enforced_by = ["eslint boundaries (apps/web/lint-rules/layers.js: only components and the package entry import design-system/format)", "review: data components and screens format through formatValue from @algotrade/ui"]

[[web_responsibility]]
id = "web-charting"
description = "Drawing time-series charts with the chart library (lightweight-charts): series, markers, panes, crosshair, theming"
owner = ["apps/web/design-system/components/Chart/*"]
section = "docs/ui/design-system.md#charts-design-system-pr-4"
enforced_by = ["eslint no-restricted-imports: lightweight-charts only in design-system/components/Chart (apps/web/lint-rules/restrictions.js)"]

[[web_responsibility]]
id = "web-overlays"
description = "Overlay positioning, focus trapping / return and dismissal (Floating UI): Tooltip, Popover, Dialog, Drawer"
owner = ["apps/web/design-system/components/**"]
section = "docs/ui/design-system.md#overlays-design-system-pr-4"
enforced_by = ["eslint no-restricted-imports: @floating-ui/react banned in src/ (apps/web/lint-rules/restrictions.js)"]

[[web_responsibility]]
id = "web-http"
description = "Talking HTTP to the API: the typed client, fetch, errors, query keys, the generated schema"
owner = ["apps/web/src/shared/api/**"]
section = "docs/adr/0025-frontend-architecture.md#rule-4-only-sharedapi-talks-http"
enforced_by = ["eslint no-restricted-globals / no-restricted-syntax / no-restricted-imports (apps/web/lint-rules/restrictions.js)", "npm run generated:check (schema matches the OpenAPI document)"]

[[web_responsibility]]
id = "web-session"
description = "The browser's Supabase session: password sign-in and sign-out, the access token sent as the bearer on every request, a 401 ending the session (ADR 0040)"
owner = ["apps/web/src/shared/api/auth.ts"]
section = "docs/adr/0040-identity-and-roles.md#decision"
enforced_by = ["eslint no-restricted-imports: @supabase/supabase-js only in src/shared/api (apps/web/lint-rules/restrictions.js)"]

[[web_responsibility]]
id = "web-data-access"
description = "Server state: TanStack Query hooks over shared/api"
owner = ["apps/web/src/entities/**", "apps/web/src/features/**", "apps/web/src/app/providers/*"]
section = "docs/adr/0025-frontend-architecture.md#rule-4-only-sharedapi-talks-http"
enforced_by = ["eslint no-restricted-imports: @tanstack/react-query banned in pages, widgets and shared/lib|config"]

[[web_responsibility]]
id = "web-routing"
description = "URLs, route tree, route params, redirects, layout routes"
owner = ["apps/web/src/app/**"]
section = "docs/adr/0025-frontend-architecture.md#workspaces-and-routes"
enforced_by = ["eslint no-restricted-imports: @tanstack/react-router only in src/app"]

[[web_responsibility]]
id = "web-workspace-access"
description = "Who may enter a workspace (TRADER, ADMIN): the role-gating seam, reading the viewer's registry workspaces (ADR 0040)"
owner = ["apps/web/src/app/workspaces/guard.ts"]
section = "docs/adr/0025-frontend-architecture.md#workspaces-and-routes"
enforced_by = ["review: every workspace layout route calls workspaceGuard in beforeLoad"]

[[web_responsibility]]
id = "web-env"
description = "Build-time configuration (Vite env, VITE_*)"
owner = ["apps/web/src/shared/config/*"]
section = "docs/adr/0025-frontend-architecture.md#layers-and-folders"
enforced_by = ["review (import.meta.env is read only in shared/config)"]

[[web_responsibility]]
id = "guide-help-drawer"
description = "Showing a Guide entry in place: the InfoButton and HelpDrawer for an entry reference { kind, id }, and the field help button in table headers; no page passes text to a drawer (ADR 0051)"
owner = ["apps/web/src/features/guide-help/**"]
section = "docs/adr/0051-guide-explain-once-show-in-place.md#decision"
enforced_by = ["eslint no-restricted-imports: HelpDrawer, HelpLead, HelpSection only in src/features/guide-help (apps/web/lint-rules/restrictions.js)"]

[[web_responsibility]]
id = "web-container-width"
description = "Measuring a component's own width against a breakpoint token when its tree (not only its CSS) changes on a phone (useNarrow; ADR 0052)"
owner = ["apps/web/design-system/responsive/*"]
section = "docs/adr/0052-one-ui-for-phones-and-desktops.md#decision"
enforced_by = ["eslint no-restricted-globals / no-restricted-syntax (apps/web/lint-rules/restrictions.js: no matchMedia / ResizeObserver in src)", "review: a tree that changes by width calls useNarrow from @algotrade/ui internals only (the hook is not exported to src)"]

[[web_responsibility]]
id = "web-gap-causes"
description = "Showing why something is not available: a gap (Unknown, Unavailable) by its public kind with the Guide term, and the cause chain the server sent an admin; no other code reads a gap's cause or an Unknown's code (ADR 0056)"
owner = ["apps/web/src/entities/availability/**"]
section = "docs/adr/0056-role-scoped-causes.md#decision"
enforced_by = ["eslint [ADR 0025 rule 11] (apps/web/lint-rules/availability.js)", "tests/apps/api/graphql/test_causes.py (the server withholds the cause from a trader)"]
