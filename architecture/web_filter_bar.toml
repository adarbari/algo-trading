"src/pages/admin-llm-usage/ui/CallsSection.tsx" = "list beside its detail over UsageCallsPanel; admin usage log, not yet on the bar"
"src/pages/admin-screener-runs/ui/AdminScreenerRunsPage.tsx" = "the filter bar is in ScreenerRunList, which this page renders beside its detail"
