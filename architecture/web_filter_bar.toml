# Every table, list or feed renders the shared filter bar (ADR 0082; docs/ui/filtering.md;
# .claude/skills/add-ui-component step 7). A "data surface" is a file under apps/web/src that
# renders DataTable, ExpandableTable, FeatureTable or MasterDetail.
#
# Checked by tests/architecture/test_layout_web.py::test_data_surfaces_use_the_filter_bar. A
# surface passes when its file renders SurfaceFilterBar or FilterBar, or is listed below with
# a reason. [ADR 0025 rule 12]
#
#   [migrating]  surfaces that WILL get the bar. Shrink-only: the PR that puts the bar on a
#                surface deletes its line (the test fails on a line whose file now has the
#                bar, naming this file). Never add a line: build the surface on the bar.
#   [exempt]     surfaces that stay without it, each with its reason (a fixed handful of
#                rows, a drill-down of one thing, a detail panel). A new line needs an
#                owner-visible reason in the PR; a table of many rows is never exempt.
#
# A path that no longer renders a data surface fails too (delete the line).

[migrating]
"src/pages/trader-explore/ui/OtherTabs.tsx" = "migrating: Explore tabs onto the bar (ADR 0082, session filter-web-results-explore)"
"src/widgets/edge-list/ui/EdgeList.tsx" = "migrating: Edges list onto the bar (ADR 0082, session filter-web-lists)"
"src/widgets/edge-trades/ui/EdgeTrades.tsx" = "migrating: edge trades onto the bar (ADR 0082, session filter-web-lists)"
"src/widgets/feature-table/ui/ScreenerResults.tsx" = "migrating: screener results onto the bar (ADR 0082, session filter-web-results-explore)"
"src/widgets/feature-table/ui/TableFrame.tsx" = "migrating: the shared table frame of screener results and Explore (ADR 0082, session filter-web-results-explore)"
"src/widgets/screener-list/ui/ScreenerList.tsx" = "migrating: screener list onto the bar (ADR 0082, session filter-web-lists)"

[exempt]
"src/entities/run/ui/RunRecordDrawer.tsx" = "detail drawer: the steps of one run, fixed rows"
