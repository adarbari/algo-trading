]
section = "docs/data/vendors.md#closed-end-fund-navs-nasdaq-mfqs-xtickerx-on-tiingo-edge-build-d5"
detect = [{ call = "map_funds" }, { call = "nav_symbol" }, { call = "parse_nav_tickers" }]

[[responsibility]]
id = "ibkr-enrichment"
description = "IBKR as an enrichment source, read-only (ADR 0028): conids of the optionable universe (instruments/ibkr_contracts) IB's implied / historical vol per underlying (volatility/ibkr_iv30: history backfill + nightly snapshot) and the nightly futures curve snapshots (rates/futures_curve), each read through algotrade.data; features derived from them carry licence = personal"
