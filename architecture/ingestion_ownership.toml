[[responsibility]]
id = "ingest-disk-floor"
description = "Refuse to start the nightly when the data volume has less free space than [resources] min_free_gb of config/site/nightly.toml (default 15 GB), with one message naming the numbers and the setting, before the run starts; make doctor warns against the same value (ADR 0044: the Mac also serves the site)"
