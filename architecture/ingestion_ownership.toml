[[responsibility]]
id = "ingestion-step-dispatch"
description = "Decide which ingestion steps run, in what order, with which defaults (CLI, nightly, post-session): tasks are declared once in the registry; nightly is an ordered list of isolated task steps; the post-session workflow (ADR 0070) holds the steps that do not decide a session (descriptions, verify, edge-eval), runs for the last nightly-done session once, and decides when the weekly edge audit is due"
owner = [
    "apps/ingestion/algotrade_ingestion/tasks/framework/registry.py",
    "apps/ingestion/algotrade_ingestion/tasks/framework/entries_*.py",  # the registry's run wrappers, split by domain
    "apps/ingestion/algotrade_ingestion/workflows/*",
]
section = "docs/adr/0019-ownership-and-boundaries.md#r5-everything-runs-through-the-job-runner"
detect = [
    { call_regex = "(^|\\.)(ingest_[a-z_]+|build_universe|import_universe|run_quality|compute_option_liquidity|load_golden|run_migrate_ids)$" },
]

[[responsibility]]
id = "insider-transaction-ingestion"
description = "Store SEC Form 4 / 4/A insider transactions in events/insider_transaction, a row per transaction line and reporting owner (EB D6, tasks/events/insider.py + insider_rows.py): the history from the quarterly Insider Transactions Data Sets (sec_form345_bulk) with each filing's acceptance time from its issuer's submissions JSON (sec_filings, joined by accession; a line without one is counted, never guessed), the nightly from EDGAR's daily form index and each new filing's XML (sec_form4_xml); the id as of the filing date from the listing history (data.listings.resolvers); known_from the acceptance_session of SEC's acceptance time (the first session whose close is after it), and for a line stored before and fetched again with different content no earlier than the session after the fetch (insider_rows.py); read back only through algotrade.data.insiders"
owner = [
    "apps/ingestion/algotrade_ingestion/tasks/events/insider.py",
    "apps/ingestion/algotrade_ingestion/tasks/events/insider_rows.py",
]
allowed = [
    "apps/ingestion/algotrade_ingestion/tasks/framework/registry.py",  # declares the task's table
    "src/algotrade/storage/tables/schemas/events.py",  # declares the table
    "src/algotrade/data/insiders/reading.py",  # the one reader: known_from <= session, latest version, amendments applied
    "src/algotrade/features/rollups/events/insider_buys.py",  # names its input; read through data.feature_inputs (buyer_histories), computes only (EB E6)
