# Ownership registry (ADR 0019), ingestion: the ingestion app.
# Every responsibility has exactly ONE owner. The registry is every architecture/*_ownership.toml
# but web_ownership.toml, one file per layer: an entry lives in the file whose `scope` holds its
# first owner (the longest prefix wins), sorted by id. Fields and detect rules: the docstring of
# scripts/check_ownership.py. Before writing code that does X, find X
# (`grep <keyword> architecture/*ownership.toml`) and extend its owner; a new responsibility
# needs an entry + owner in the same PR (.claude/skills/add-responsibility).

scope = ["apps/ingestion/"]

[[responsibility]]
id = "analyst-access-probe"
description = "Store which analyst endpoints each free vendor key may call (analyst/vendor_access): one probe request per FMP and Finnhub endpoint through the probe sources, one row per (vendor, endpoint), a vendor with no key skipped, FMP calls counted against [fmp] daily_budget (budget.py); run by hand, in no workflow (ADR 0068)"
owner = [
    "apps/ingestion/algotrade_ingestion/tasks/analyst/budget.py",
    "apps/ingestion/algotrade_ingestion/tasks/analyst/probe.py",
]
allowed = [
    "apps/ingestion/algotrade_ingestion/tasks/analyst/snapshot.py",  # counts its FMP calls the same way, and reads the verdicts
    "apps/ingestion/algotrade_ingestion/tasks/framework/registry.py",  # declares the task
    "src/algotrade/storage/tables/schemas/events.py",  # declares the table's schema
]
section = "docs/adr/0068-analyst-data-vendors.md#decision"
detect = [{ string = "analyst/vendor_access" }, { call = "fmp_calls_today" }]

[[responsibility]]
id = "analyst-estimate-snapshots"
description = "Append tonight's FMP (annual estimates, price-target consensus, grades consensus) and Finnhub (recommendation trend) analyst data of a rotating slice of names to our own point-in-time history (analyst/estimate_snapshots): ts = fetch instant, knowledge_ts = publish instant, never a vendor date, never replacing an earlier session's rows; the rotation reads back the run records' items; FMP within [fmp] daily_budget; a nightly optional step (ADR 0068); Yahoo (owner-only licence) is asked of every name it has answered on a refresh cadence (14 days, 45 for a name FMP answers), and the one-off analyst-backfill asks the whole stock population (population.py: COMMON_STOCK and ADR) a resumable batch a run, quiet until the nightly is complete and stopped by the first 429 (ADR 0080 amendment 2026-10-23b); which names Yahoo is asked tonight is the pure yahoo_schedule.py: a rolling baseline by stable slot, event pulls around a report date, one nightly ceiling, the answer fingerprint and the 429 cool-off (amendment 2026-10-23c)"
owner = [
    "apps/ingestion/algotrade_ingestion/tasks/analyst/snapshot.py",
    "apps/ingestion/algotrade_ingestion/tasks/analyst/backfill.py",
    "apps/ingestion/algotrade_ingestion/tasks/analyst/population.py",
    "apps/ingestion/algotrade_ingestion/tasks/analyst/yahoo_schedule.py",
]
allowed = [
    "apps/ingestion/algotrade_ingestion/tasks/framework/registry.py",  # declares the task
    "src/algotrade/storage/tables/schemas/events.py",  # declares the table's schema
    "src/algotrade/data/analyst/reading.py",  # the one read of the table (analyst-snapshot-reading)
    "src/algotrade/features/rollups/consensus/analyst_status.py",  # names the feature input table its groups read
]
section = "docs/adr/0068-analyst-data-vendors.md#decision"
detect = [{ string = "analyst/estimate_snapshots" }]

[[responsibility]]
id = "bad-bar-detection"
description = "Decide which stored daily bars cannot be right (a close below the floor, high / low / close out of order, an unexplained jump cutting a series, the trusted segment being the one with the most Massive bars) and write them to events/bar_flag with a reason; raw bars are never edited (ADR 0061)"
owner = ["apps/ingestion/algotrade_ingestion/tasks/maintenance/bar_quality.py"]
section = "docs/adr/0061-bad-bar-flags.md#decision"
detect = [{ call = "bad_bars" }]

[[responsibility]]
id = "compact-runs-job"
description = "The compact-runs job (ADR 0078 decisions 4 and 5, amendment 2026-10-20): walks one allow-listed merge table's partitions (nightly.toml [compaction] tables, no history copy: a fitness test) oldest first with W spawn worker processes (no lock in a worker; the parent holds the ingest-tree lock and probes the ingest lock before each dispatch and sweep unless --beside-ingest), at background priority, a free-space floor plus one partition of scratch per worker and a per-partition time slice, calls StoreWriter.compact_runs, sweeps each swapped partition with sweep_orphans 30 s + 1 s after its swap, as the run goes; resumable, --dry-run reports files, bytes and the saving and writes nothing; publishes no table"
owner = [
    "apps/ingestion/algotrade_ingestion/tasks/maintenance/compaction/task.py",
    "apps/ingestion/algotrade_ingestion/tasks/maintenance/compaction/pool.py",
    "apps/ingestion/algotrade_ingestion/tasks/maintenance/compaction/sweep.py",
    "apps/ingestion/algotrade_ingestion/tasks/maintenance/compaction/report.py",
]
allowed = [
    "apps/ingestion/algotrade_ingestion/tasks/framework/entries_ops.py",  # the registry entry
]
section = "docs/adr/0078-outcomes-run-compaction.md#decision"
detect = [{ call = "RollingSweep" }]

[[responsibility]]
id = "coverage-acceptance"
description = "Per key feature and tier, the share of the instruments it applies to (Feature.applies_to) that have a value for the session, graded against [quality.coverage.*] (minimum per tier, day-over-day drop, WARN or FAIL): the acceptance check of the rollups step and a quality check (ADR 0043); for the fundamentals share count also the breakdown of values known against rows stored by security type, with the causes of an operating company's gap (known_breakdown), saved in the check's data"
owner = ["apps/ingestion/algotrade_ingestion/tasks/maintenance/coverage.py"]
allowed = ["apps/ingestion/algotrade_ingestion/tasks/maintenance/quality.py"]  # run_quality runs it with the other checks
section = "docs/adr/0043-waiting-on-publication-tiered-and-coverage-acceptance.md#later-prs-under-this-adr-not-in-this-change"
detect = [{ call = "check_coverage" }]

[[responsibility]]
id = "delisted-tickers-ingestion"
description = "Store Massive's inactive (delisted) tickers in instruments/delisted_tickers (ADR 0087): one full snapshot per session from MassiveTickers' inactive list (cursor-paged, 12.5 s a request on the free tier), a pull under [quality] min_delisted_tickers rows FAILED before any write, the vendor's last trading day as end_date (identity, never a feature) and every other field of the record kept (market, locale, currency_name, last_updated_utc), in no workflow; the listing-history task merges it"
owner = ["apps/ingestion/algotrade_ingestion/tasks/listings/delisted_tickers.py"]
allowed = [
    "apps/ingestion/algotrade_ingestion/tasks/framework/entries_reference.py",  # the registry entry's runner calls the task
]
section = "docs/adr/0087-survivorship-free-listing-history.md#decision"
detect = [{ call = "ingest_delisted_tickers" }]

[[responsibility]]
id = "edge-picks"
description = "Store what every site edge took at a session in results/edge_picks (ADR 0081): per site edge and screener it lists, the picks the harness's one rule gave (services/evaluation/edge_picks/night.py over picks.long_picks, the edge's universe, schedule and top_k) or why none (not_decision_day, unjudged, skipped), one publish per run, resumable by the stored keys, an optional nightly step after the screens with its acceptance check; decides nothing itself (the rule is the harness's)"
owner = ["apps/ingestion/algotrade_ingestion/tasks/edges/picks.py"]
allowed = [
    "apps/ingestion/algotrade_ingestion/tasks/framework/registry.py",  # declares the task's tables
    "apps/ingestion/algotrade_ingestion/tasks/framework/entries_ops.py",  # the task's entry
    "apps/ingestion/algotrade_ingestion/workflows/nightly/nightly.py",  # the step's acceptance check
]
section = "docs/adr/0081-stored-edge-picks.md#decision"
detect = [{ call = "store_picks" }]

[[responsibility]]
id = "edge-verdicts"
description = "Store the headline of every site edge's canonical run in results/edge_verdict (ADR 0053 amendment 2026-10-22), the backfill of runs stored before the table and the re-judge after the judge's code, verdict.toml or an edge document changed, in one task: per site edge, the canonical run (never a user's edge, a hidden copy or an exploratory run) judged from its committed rows through the one framer the edge-eval publish uses (services/evaluation/cross_section/detail/verdict.py), skipped when a row under the current fingerprint exists (idempotent, resumable by the store), every new row in one publish under the task's run id and the write instant as knowledge_ts, one edge's failure counted and never stopping the rest, stored rows checked against the live judge on request (--verify); ``--expect-same-headlines`` compares each canonical run's current row with its newest row under an earlier fingerprint (every EdgeSummary field) and fails, writing nothing, on any difference (the deploy of a judge change, ADR 0088 design 2.6); owner-run once after deploy, then the post-session workflow's last step; never judges anything itself (ADR 0053 decision 8)"
owner = ["apps/ingestion/algotrade_ingestion/tasks/edges/*"]
allowed = [
    "apps/ingestion/algotrade_ingestion/tasks/framework/registry.py",  # declares the task's tables
    "apps/ingestion/algotrade_ingestion/tasks/framework/entries_ops.py",  # the task's entry
]
section = "docs/adr/0053-edges-hypotheses-outcomes-and-one-harness.md#amendment-2026-10-22-the-stored-verdict-headline"
detect = [{ call = "rejudge_edges" }]

[[responsibility]]
id = "etf-holdings"
description = "What each ETF holds (ADR 0035): the etf-holdings task reads the issuers' daily files and SEC N-PORT through HoldingsSource adapters (first issuer that lists a fund wins), ranks and trims each fund's lines, links tickers to instruments through SymbolResolver and writes holdings/etf; consumers read it only through data.funds.holdings (latest rows per fund) and the read model's Holdings behind Instrument.holdings (services/read/instruments/holdings.py)"
owner = [
    "apps/ingestion/algotrade_ingestion/tasks/market/etf_holdings.py",
    "src/algotrade/data/funds/holdings.py",
]
allowed = [
    "src/algotrade/storage/tables/schemas/reference.py",  # declares the table
    "apps/ingestion/algotrade_ingestion/tasks/framework/registry.py",  # declares the task's tables
    "src/algotrade/features/rollups/reference/fund_reference.py",  # names its input; read through data.feature_inputs (ADR 0050)
]
section = "docs/adr/0035-etf-holdings.md#decision"
detect = [{ string = "holdings/etf" }]

[[responsibility]]
id = "feature-retirement"
description = "Delete a superseded feature group's stored tables (all runs) after checking its replacement covers the same sessions; dry-run reports sizes. Backends implement TableStore.drop / size; only the retire-features command calls drop"
owner = [
    "apps/ingestion/algotrade_ingestion/tasks/maintenance/retire_features.py",
    "src/algotrade/storage/backends/*",
    "src/algotrade/storage/tables/interfaces.py",
    "src/algotrade/storage/tables/writers.py",
]
section = "docs/adr/0023-feature-store.md#step-3-expression-features-virtual-by-default"
detect = [{ attr = "tables.drop" }, { call = "drop_table" }]

[[responsibility]]
id = "filing-ingestion"
description = "Store the SEC event filings (8-K and 8-K/A with items, NT 10-K / NT 10-Q, SC TO-I / SC TO-T, Form 25 / 25-NSE, 424B4, Form 10 10-12B) of every operating company in the universe (the session's universe snapshot without ETFs / ETNs) in events/filing (ADR 0050, tasks/events/filings.py): the names' CIKs from the company details as of the session; the backfill is one SEC submissions request per CIK (plus the older pages when --since precedes the recent block; a CIK an earlier run of the current form set (FORMS_TAG) read from --since or earlier is skipped, stored rows never count, --limit caps a run), the nightly reads EDGAR's daily form index for each weekday since the latest stored filing day and asks only the CIKs that filed (an unpublished day is read again, a stale one fails, a failing day stops the walk); each row with its acceptance instant, items and known_from (the first session whose close is after the acceptance: a filing after the close, on a weekend or a holiday counts from the next session; ADR 0050 amendment 2026-10-18); and the Item 2.02 results releases as events/earnings rows with source sec_8k (earnings_date the acceptance date in New York, time pre_market / intraday / after_hours by the acceptance clock, reported true, known_from the acceptance session). The per-quarter precedence between those rows and the calendar's belongs to the earnings rollup, not the writer"
owner = ["apps/ingestion/algotrade_ingestion/tasks/events/filings.py"]
allowed = [
    "apps/ingestion/algotrade_ingestion/tasks/events/ipo_lockups.py",  # reads its 424B4 rows to report the search gap
    "apps/ingestion/algotrade_ingestion/tasks/framework/registry.py",  # declares the task's tables
    "apps/ingestion/algotrade_ingestion/tasks/maintenance/quality.py",  # grades the run (filings_fetched)
    "src/algotrade/storage/tables/schemas/events.py",  # declares the table
    "src/algotrade/data/feature_inputs.py",  # the feature input read of events/filing (stored_events, known_from <= session), as for events/earnings
    "src/algotrade/features/rollups/events/filing_activity.py",  # reads events/filing as a feature input (known_from <= session); computes only, never writes
    "src/algotrade/features/rollups/corporate/earnings.py",  # the one reader that must tell the 8-K rows apart (v1 reads the calendar rows only; rollups import no storage, so the source name is spelled there)
    "apps/ingestion/algotrade_ingestion/tasks/market/earnings.py",  # the carry-forward never copies the 8-K rows
    "src/algotrade/services/read/events/filings.py",  # the filings read of InstrumentEvents (known_from <= session), a display read
    "src/algotrade/data/feature_inputs.py",  # the events/filing input of filing_events@v1: the acceptance session recomputed from ts (EB H4)
    "src/algotrade/features/rollups/events/filing_events.py",  # the group that reads it: sessions since each kind of filing became known
]
section = "docs/adr/0050-event-sensitivity.md#decision"
detect = [{ string = "events/filing" }, { string = "sec_8k" }]

[[responsibility]]
id = "filing-text-ingestion"
description = "Store the Item sections of every 10-K / 10-K/A / 10-Q / 10-Q/A of the universe's operating companies in events/filing_text (edge build D10, tasks/events/filing_text.py): a CIK's periodic filings listed from the sec_filings source, one document request each, a filing already stored at the current parser version with its wanted items skipped, a CIK read OK for a covering window by an earlier run of the same tag (parser version + items) skipped, --limit CIKs a backfill run; known_from is the acceptance session for a filing's first extraction, max(acceptance session, the session after the exchange date of the run's clock: the FETCH, never --to) for a later row that changes or adds a text, the stored stamp for an identical one; a CIK whose listing or document fails is a failed item (never an empty answer) and the nightly increment reads only the CIKs due a report. The similarity features over the texts are track E, not this task"
owner = ["apps/ingestion/algotrade_ingestion/tasks/events/filing_text.py"]
allowed = [
    "apps/ingestion/algotrade_ingestion/tasks/framework/registry.py",  # declares the task's table
    "apps/ingestion/algotrade_ingestion/tasks/framework/entries_market.py",  # its entry
    "src/algotrade/storage/tables/schemas/events.py",  # declares the table
]
section = "docs/data/vendors.md#10-k--10-q-item-sections-sec-edgar-edge-build-d10"
detect = [{ call = "text_rows" }, { call = "complete_filings" }]

[[responsibility]]
id = "finra-short-ingestion"
description = "Store FINRA short interest (events/short_interest, one partition per settlement date) and Reg SHO daily short-sale volume (events/short_volume, one per trade date) for the universe's names (tasks/shorting/): one source request per date not stored yet, tickers resolved through the session's reference (unknown ones dropped and counted), a nightly window of recent dates and a resumable --from backfill, an unpublished date NO_DATA; a stored short-interest date is never refetched, so the first-seen value is the point-in-time one. Both tables are no_ml (architecture/tables.toml): no learned scorer reads them (EB D9)"
owner = ["apps/ingestion/algotrade_ingestion/tasks/shorting/*"]
allowed = [
    "apps/ingestion/algotrade_ingestion/tasks/framework/registry.py",  # declares the tasks' tables
    "src/algotrade/storage/tables/schemas/events.py",  # declares the tables
    "libs/sources/algotrade_sources/vendors/finra/short_interest.py",  # the source's frame key
    "libs/sources/algotrade_sources/vendors/finra/short_volume.py",  # the source's frame key
    "src/algotrade/data/feature_inputs.py",  # the events/short_interest input of short_interest@v1: rows by known_from (publication), read_events
    "src/algotrade/features/rollups/events/short_interest.py",  # the group that reads it: the latest report public by the session (EB E6); computes only, never writes
]
section = "docs/edge-ideas/build-plan.md#3-finra-short-interest-bi-monthly-and-daily-short-sale-volume"
detect = [{ string = "events/short_interest" }, { string = "events/short_volume" }]

[[responsibility]]
id = "forward-outcomes"
description = "Compute and store forward outcomes (ADR 0053 decision 3): for each window a session closes (S = T - h exchange sessions, horizons and benchmarks from the open edge documents plus the 20-session SPY default), every name in the universe at S with a bar at S measured from S's close to T's on bars split-adjusted as of T (return, excess over the benchmark, max favourable and adverse excursion, realised volatility; DELISTED by the reference snapshot's delisting date or the listing history's last trading day on or before T, else a reason; before the first universe snapshot the names are the listing history's alive on S; horizons above 252 sessions only in a backfill), one run per window end into outcomes/instrument/forward_returns@v2 (a window needing a flagged bar is UNMEASURED, reason BAD_BAR, ADR 0061), and its acceptance check; and the factor-neutral sibling (ADR 0053 amendment, EB H11): the residual-returns task writes, per name and window, the return minus the factor_betas@v1 loadings (read from the session before S) times the ETF factor returns of the window into outcomes/instrument/residual_returns@v1 (UNMEASURED with a reason where the factor ETFs or the betas do not cover it, never market-only, never zero); read back only through algotrade.data.outcomes, importable only from services/evaluation"
owner = [
    "apps/ingestion/algotrade_ingestion/tasks/derived/outcomes.py",
    "apps/ingestion/algotrade_ingestion/tasks/derived/outcome_paths.py",
    "apps/ingestion/algotrade_ingestion/tasks/derived/residual_paths.py",
    "apps/ingestion/algotrade_ingestion/tasks/derived/residual_returns.py",
    "src/algotrade/data/outcomes/*",
]
allowed = [
    "src/algotrade/storage/tables/schemas/outcomes.py",  # declares the outcomes tables' one schema
    "src/algotrade/services/evaluation/cross_section/harness.py",  # the reader of outcomes (ADR 0053)
    "src/algotrade/services/evaluation/cross_section/measuring.py",  # the harness's measuring of legs reads the outcome rows (ADR 0053)
    "src/algotrade/services/evaluation/training/frame.py",  # the other: the labels of a fit (ED7)
    "src/algotrade/services/evaluation/discovery/labels.py",  # the third: the winners of the ED6 study (ADR 0053 amendment)
    "src/algotrade/services/evaluation/forward/settle.py",  # the fourth: closes a followed edge's paper trades (ADR 0053 amendment 2026-10-09)
]
section = "docs/adr/0053-edges-hypotheses-outcomes-and-one-harness.md#decision"
detect = [{ string_prefix = "outcomes/instrument/" }, { call = "window_rows" }, { call = "read_outcomes" }]

[[responsibility]]
id = "fund-nav-symbol-mapping"
description = "Which NAV series a closed-end fund has (edge build D5): the funds are the reference's CEF rows (and stocks named Closed End Fund), nav_symbol writes Nasdaq MFQS's X<ticker>X, and map_funds keeps a fund only when Tiingo's NMFQS listing (parse_nav_tickers) holds that symbol, under the FUND's own instrument_id (a NAV symbol is never an instrument and no id is built from it, ADR 0018); the rest are listed as unmapped"
