[[responsibility]]
id = "ingestion-report"
description = "The nightly summary report (statistics per step, failed items grouped by reason with examples, failed checks, the option-chain coverage section and its drift WARN in the summary, the post-session section read from the session's post-session run record (ADR 0070), hints), run timing with the arrival record (each attempt stores when bars / chains data appeared; p50 / p90 over bracketed sessions, timing.py, ADR 0043) and notifications: the desktop alert and the daily summary email over SMTP"
