# REST GET allow-list (ADR 0037; docs/api/read-model.md "What stays REST"). SHRINK-ONLY.
#
# Page reads move to GraphQL (POST /graphql) over the read model; REST keeps writes, job
# polling, health, live quotes, the preview POSTs, files and (until read-model PR 10) admin.
# Every GET route the API serves must be listed here, and the list may only get shorter:
#
#   - tests/architecture/api/test_rest_allowlist.py::test_rest_get_routes_are_allowlisted fails on a GET
#     route not listed here, and on an entry no route serves any more (remove it);
#   - test_rest_allowlist_only_shrinks fails when the number of entries differs from
#     `max_get_routes`: after removing entries run `make rest-allowlist-update` (it lowers the
#     count and refuses to raise it).
#
# A new read for a page is a GraphQL field (.claude/skills/add-graphql-field), never a new GET
# here. A new GET that is not a page read (a file download, a job's status) needs an ADR
# amendment of ADR 0037 and an entry with `keep` and its reason.
#
#   method     always "GET" (writes are REST by rule and are not listed)
#   path       the route path as FastAPI declares it
#   keep       true: stays REST by design (health, job polling, live quotes); false: retires
#   retire_in  the read-model PR that moves it to GraphQL and removes this entry

max_get_routes = 16

# ---------------------------------------------------------------------------- stays REST

[[route]]
method = "GET"
path = "/health"
keep = true
reason = "liveness probe for scripts and make doctor"

[[route]]
method = "GET"
path = "/screens/{config_id}/run/{job_id}"
keep = true
reason = "job polling for POST /screens/{config_id}/run (ADR 0033): transport plumbing, kept with its POST"

[[route]]
method = "GET"
path = "/chains/{underlying_id}/live"
keep = true
reason = "live quotes (ADR 0028): latency-bound, records to live/*, bypasses the session model on purpose"

# ---------------------------------------------------------------------------- PR 8: screener results, preview, views

[[route]]
method = "GET"
path = "/screens"
keep = false
retire_in = "PR 8"

[[route]]
method = "GET"
path = "/screens/{config_id}/results"
keep = false
retire_in = "PR 8"

[[route]]
method = "GET"
path = "/screens/{config_id}/table"
keep = false
retire_in = "PR 8"

[[route]]
method = "GET"
path = "/preferences/screeners/{screener_id}/view"
keep = false
retire_in = "PR 8"

