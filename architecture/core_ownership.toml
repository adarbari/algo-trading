# Ownership registry (ADR 0019), core: the domain model, time and the configuration layers
# (core/, config/).
# Every responsibility has exactly ONE owner. The registry is every architecture/*_ownership.toml
# but web_ownership.toml, one file per layer: an entry lives in the file whose `scope` holds its
# first owner (the longest prefix wins), sorted by id. Fields and detect rules: the docstring of
# scripts/check_ownership.py. Before writing code that does X, find X
# (`grep <keyword> architecture/*ownership.toml`) and extend its owner; a new responsibility
# needs an entry + owner in the same PR (.claude/skills/add-responsibility).

scope = ["src/algotrade/core/", "src/algotrade/config/"]

[[responsibility]]
id = "edge-documents"
description = "Load and validate edge documents (ADR 0053 decision 1): config/site/edges/<id>.toml with a user's config/users/<id>/edges/ layered over it (ADR 0015), typed into frozen Edge dataclasses fail closed (outcome, schedule and event class, universe, status, the nine quality-bar answers), screeners, baselines and a named universe checked against the presets that exist, the user's evaluation split (EvaluationSettings, ED5a), and docs/edges.md rendered from them; consumers call load_edges, never read the kind themselves"
owner = ["src/algotrade/config/edges/*"]
section = "docs/adr/0053-edges-hypotheses-outcomes-and-one-harness.md#decision"
detect = [{ call = "load", arg = "edges" }, { call = "names", arg = "edges" }, { call = "parse_edge" }]

[[responsibility]]
id = "feature-definitions"
description = "Expression feature definitions: config/site/features/*/*.toml and config/users/<id>/features/*.toml typed by the one settings loader, then resolved against the catalogue (names, params, dependency graph, cycles, dtype and categories, no user feature shadowing a site one) into Features; the site FeatureSet (code groups + expressions + materialised groups) is built once per config store, a user's (site + their virtual features) by FeatureSet.with_user"
owner = [
    "src/algotrade/config/site/settings.py",
    "src/algotrade/config/site/features/*",
    "src/algotrade/features/expressions/definitions.py",
    "src/algotrade/features/expressions/feature_set.py",
    "src/algotrade/features/site.py",
]
section = "docs/adr/0023-feature-store.md#step-3-expression-features-virtual-by-default"
detect = [
    { call = "load_features" },
    { call = "load_user_features" },
    { call = "feature_definitions" },
    { call = "build_expressions" },
    { call = "FeatureSet" },
]

[[responsibility]]
id = "id-resolution"
description = "Turn vendor tickers into instrument ids (ADR 0018); build EQ: ids only through the id rule, and the non-tradable MKT: market ids only through core.model.instruments.market_id (ADR 0047)"
owner = [
    "src/algotrade/core/model/instruments.py",
    "src/algotrade/data/resolver.py",
    "apps/ingestion/algotrade_ingestion/tasks/reference/instrument_ids.py",
    "apps/ingestion/algotrade_ingestion/tasks/framework/run.py",
]
section = "docs/adr/0019-ownership-and-boundaries.md#the-ingest-loop-is-written-once"
detect = [{ call = "with_ids" }, { call = "equity_id" }, { string_prefix = "EQ:" }, { string_prefix = "MKT:" }, { string_prefix = "IDX:" }, { string_prefix = "MACRO:" }]

[[responsibility]]
id = "screen-spec"
description = "Parse and validate a rule screen (ADR 0029): criteria with HARD / SOFT (tolerance band) / SCORE modes, tiers, flags, classify, columns, tie-break; fail closed against the field catalogue; the pure ScreenSpec values"
owner = ["src/algotrade/config/strategy/screen_spec.py", "src/algotrade/core/model/screen_spec.py"]
section = "docs/screeners/rules.md#criteria"
detect = [{ call = "parse_screen_spec" }, { call = "Criterion" }, { call = "Tolerance" }]

[[responsibility]]
id = "secrets-env"
description = "Read environment variables and the local .env: credentials, the data URL, the config directory, the default user (callers receive values as parameters)"
owner = ["src/algotrade/config/env.py"]
section = "docs/adr/0019-ownership-and-boundaries.md#settings-and-environment"
detect = [{ attr = "os.environ" }, { call = "getenv" }, { call = "putenv" }]

[[responsibility]]
id = "session-calendar"
description = "Which day is a trading session, in exchange time (weekends, holidays, early closes); the last closed session; the market-structure days by rule (the monthly option expiry, a month's last session, the Russell reconstitution), moved to the session before a closed day"
owner = ["src/algotrade/core/time/calendar.py"]
allowed = ["src/algotrade/core/time/clock.py"]  # business_days: a plain weekday grid for synthetic golden data (no holidays by design)
section = "docs/adr/0019-ownership-and-boundaries.md#r5-everything-runs-through-the-job-runner"
detect = [
    { call = "ZoneInfo", arg = "America/New_York" },
    { call = "weekday" },
    { call = "busday_offset" },
]

[[responsibility]]
id = "site-settings"
description = "Load and type L3 site settings (config/site/*.toml: sources, universe + overrides, nightly, defaults, users with roles per ADR 0040, the field guide per ADR 0041, the regime cards and episodes per ADR 0047, the event-sensitivity scope list per ADR 0050, the Guide's sections, theme groups, playbook families, playbook prose, glossary and Start here pages per ADR 0051): one loader, frozen dataclasses; the store only reads files"
owner = [
    "src/algotrade/config/site/settings.py",
    "src/algotrade/config/site/users.py",
    "src/algotrade/config/site/nightly.py",
    "src/algotrade/config/site/field_guide.py",
    "src/algotrade/config/site/regime/*",
    "src/algotrade/config/site/guide/*",
    "src/algotrade/config/site/events/*",
    "src/algotrade/config/site/features/*",
    "src/algotrade/storage/configs/store.py",
    "src/algotrade/storage/configs/files.py",
]
section = "docs/adr/0019-ownership-and-boundaries.md#settings-and-environment"
detect = [
    { call = "load", arg = "settings" },
    { call = "load", arg = "defaults" },
    { call = "overrides" },
]

[[responsibility]]
id = "three-valued-predicate"
description = "Evaluate Rule / Group predicates over named fields with three-valued (Kleene) logic: missing, NaN or wrong-typed values are UNKNOWN, never a pass; shared by selections and rule screens"
owner = ["src/algotrade/core/model/predicates.py"]
allowed = [
    "src/algotrade/engines/selection/evaluate.py",  # the selection's per-rule funnel audit evaluates each top-level child
    "src/algotrade/strategies/screeners/rules/*",  # rule screens evaluate criteria, tiers and flags with it
]
section = "docs/configuration.md#selections"
detect = [{ call = "evaluate_rule" }, { call = "evaluate_group" }]
