[[dir]]
path = "apps/ingestion/algotrade_ingestion/workflows"
purpose = "workflows: ordered, isolated runs of registry tasks (no modules of its own)"

[[dir]]
path = "apps/ingestion/algotrade_ingestion/workflows/nightly"
purpose = "the nightly workflow: sessions, steps, screens, notifications"

# --------------------------------------------------------------------------- shared helpers

[[shared]]
module = "apps/ingestion/algotrade_ingestion/tasks/reference/instrument_ids.py"
reason = "the ingestion id rule (ADR 0018, `id-resolution`): golden and migrate-ids reuse it"
