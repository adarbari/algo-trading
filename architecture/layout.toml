# Directory layout registry (ADR 0020): every directory that may hold Python code, with what
# it holds. One folder = one kind of thing. Enforced by tests/architecture/test_layout.py:
#
#   - every module under src/ and apps/ lives in a directory declared here (a new folder or a
#     stray file fails: declare the folder here with its purpose, in the same PR);
#   - at most `max_modules` modules (excluding __init__.py) per directory; split by kind
#     instead. There are no exceptions (a fitness test keeps `[[exception]]` absent);
#   - every package has an __init__.py whose docstring says what the folder holds;
#   - `kind = "vendor"`: one folder per vendor. It contributes at least one source to the
#     source registry, and nothing outside the folder imports it except the registry;
#   - `kind = "task-domain"`: registered tasks (tasks/framework/registry.py) or private
#     helpers. A module is imported only within its own domain folder or by the task
#     registry, unless it is listed in `[[shared]]` with the reason.
#
#   path     a directory relative to the repo root; `*` matches one path segment
#   purpose  one line: what belongs in it
#   kind     optional: "vendor" or "task-domain" (rules above)
#   contracts optional: import-linter contract names (pyproject.toml) enforcing the folder rule
#
# Adding a folder or moving a responsibility: .claude/skills/add-responsibility.

doc = "docs/adr/0020-directory-layout.md"
max_modules = 10
source_registry = "apps/ingestion/algotrade_ingestion/sources/framework/registry.py"
task_registry = "apps/ingestion/algotrade_ingestion/tasks/framework/registry.py"

# --------------------------------------------------------------------------- library (src/)
# One folder = one kind of thing (Layout PR B). `contracts` name the import-linter contracts
# (pyproject.toml) that enforce a folder's rule; the layout test checks they exist.

[[dir]]
path = "src/algotrade"
purpose = "the shared library package root (no modules of its own)"

[[dir]]
path = "src/algotrade/core"
purpose = "pure domain code, split by kind (curated exports in __init__ only)"
contracts = ["Core is dependency-free domain code (no pandas, no I/O)"]

[[dir]]
path = "src/algotrade/core/*"
purpose = "a pure core kind: no I/O, no pandas or pyarrow, no other algotrade package"
contracts = ["Layout: core subpackages are pure (no pandas, pyarrow, storage or config) at every path"]

[[dir]]
path = "src/algotrade/core/model"
purpose = "domain value objects: types, instruments, option contracts, field names, ids, errors"
contracts = ["Layout: core model and time are the base of core (they never import views or validation)"]

[[dir]]
path = "src/algotrade/core/time"
purpose = "the exchange session calendar and UTC clock helpers; never compute weekdays elsewhere"
contracts = ["Layout: core model and time are the base of core (they never import views or validation)"]

[[dir]]
path = "src/algotrade/core/views"
purpose = "the strategy-facing read API: MarketView, FeatureView, PriceSeries"
contracts = ["Strategies and screeners are pure: they only see core and quant"]

[[dir]]
path = "src/algotrade/core/validation"
purpose = "pure sanity checks on domain values (OHLCV bar rules)"

[[dir]]
path = "src/algotrade/config"
purpose = "configuration, split by kind; env.py (the one environment reader) and user.py (L4 users)"
contracts = ["Configs are pure: no storage I/O"]

[[dir]]
path = "src/algotrade/config/site"
purpose = "L3 site settings: config/site/*.toml into frozen, validated dataclasses (one loader)"
contracts = ["Layout: site settings never import strategy configs (resolve layers site defaults in)"]

[[dir]]
path = "src/algotrade/config/strategy"
purpose = "strategy / screener configs and selections: schema, layer resolution, field catalog"

[[dir]]
path = "src/algotrade/storage"
purpose = "generic data contract, split by kind; runs, locks and the backend factory"
contracts = ["R2: storage is generic (no domain read helpers: readers move to algotrade.data)"]

[[dir]]
path = "src/algotrade/storage/tables"
purpose = "market and result tables: schemas, store protocols, reader / writer facades"
contracts = [
    "Only the ingestion app writes market and feature data (ADR 0005)",
    "R1: only algotrade.data reads market data (consumers never import storage readers)",
    "Layout: market tables never import config documents",
]

[[dir]]
path = "src/algotrade/storage/backends"
purpose = "table backends (local Parquet, memory): the only code that knows physical layout"
contracts = ["Parquet / Arrow I/O lives only in storage backends"]

[[dir]]
path = "src/algotrade/storage/configs"
purpose = "config documents only: the ConfigStore protocol and its file / memory stores"
contracts = [
    "Layout: config documents and market tables stay separate (storage.configs never imports them)",
]

[[dir]]
path = "src/algotrade/quant"
purpose = "pure numerics (numpy only): option pricing and Greeks, implied vol, realised vol, rate conventions"
contracts = ["Layout: quant is pure numeric code (numpy only: no pandas, pyarrow, storage, data, config or services)"]

[[dir]]
path = "src/algotrade/data"
purpose = "the domain read API: the only way consumers read market data (R1)"

[[dir]]
path = "src/algotrade/features"
purpose = "versioned rollups: the framework, the definitions and their registry (registry.py)"

[[dir]]
path = "src/algotrade/features/framework"
purpose = "the rollup framework: declaration, column typing, input loading (through data), per-session runner"
contracts = ["The rollup framework reads market data only through algotrade.data (never storage)"]

[[dir]]
path = "src/algotrade/features/rollups"
purpose = "rollup definitions: one module per rollup, a pure compute + its ROLLUP declaration"
contracts = ["Rollup definitions are pure: core, quant, numpy and pandas only (no storage, data, config or services)"]

[[dir]]
path = "src/algotrade/analytics"
purpose = "performance metrics and report formatting"

[[dir]]
path = "src/algotrade/strategies"
purpose = "pure decision logic, split into trading strategies and screeners"
contracts = ["Strategies and screeners are pure: they only see core and quant"]

[[dir]]
path = "src/algotrade/strategies/trading"
purpose = "backtest strategies and their registry"

[[dir]]
path = "src/algotrade/strategies/screeners"
purpose = "screeners: pure point-in-time filters, and their registry"

[[dir]]
path = "src/algotrade/engines"
purpose = "engines that run strategies or screeners over data views"
contracts = ["Engines are independent of each other"]

[[dir]]
path = "src/algotrade/engines/backtest"
purpose = "the event-driven backtest engine: bar loop, risk, sizing, simulated broker, portfolio"

[[dir]]
path = "src/algotrade/engines/screening"
purpose = "the screening engine: run a screener and audit its coverage"

[[dir]]
path = "src/algotrade/engines/selection"
purpose = "the selection engine: evaluate a Selection with a per-rule audit"

[[dir]]
path = "src/algotrade/services"
purpose = "use cases (the backend's interface for apps); shared helpers: configs, datasets, selection, views"

[[dir]]
path = "src/algotrade/services/backtests"
purpose = "use case: run a configured backtest, record its run and results"
contracts = ["Layout: use-case packages are independent (backtests, screening)"]

[[dir]]
path = "src/algotrade/services/screening"
purpose = "use case: run a screener over the universe, record the run, export its rows"
contracts = ["Layout: use-case packages are independent (backtests, screening)"]

[[dir]]
path = "src/algotrade/services/evaluation"
purpose = "use case: evaluate every strategy on every golden dataset against the baseline"

[[dir]]
path = "src/algotrade/services/jobs"
purpose = "long-running work as jobs: runner, models, handlers, exclusive runs"
contracts = ["The job runner is generic: it knows no use case, engine or market-data reader"]

# --------------------------------------------------------------------------- backtest app

[[dir]]
path = "apps/backtest/algotrade_backtest"
purpose = "the backtest app: algotrade-backtest CLI and its command bodies"

# --------------------------------------------------------------------------- ingestion app

[[dir]]
path = "apps/ingestion/algotrade_ingestion"
purpose = "the ingestion app package root (only __main__)"

[[dir]]
path = "apps/ingestion/algotrade_ingestion/cli"
purpose = "algotrade-ingest: argument parsing (main) and command bodies (commands)"

[[dir]]
path = "apps/ingestion/algotrade_ingestion/ops"
purpose = "operating the app on a host: scheduling the nightly run"

[[dir]]
path = "apps/ingestion/algotrade_ingestion/sources"
purpose = "sources: framework, vendors and fixtures (no modules of its own)"

[[dir]]
path = "apps/ingestion/algotrade_ingestion/sources/framework"
purpose = "non-vendor source machinery: protocols, HTTP, pacing, the source registry"

[[dir]]
path = "apps/ingestion/algotrade_ingestion/sources/vendors"
