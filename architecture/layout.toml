# Directory layout registry (ADR 0020): every directory that may hold code, tests, config or
# docs, with what it holds. One folder = one kind of thing. Where a new kind of code goes:
# the "Where does this go" table in CLAUDE.md (Directory layout). If nothing fits, add a new
# folder for the new kind and declare it here; never park code in a neighbouring folder.
# Enforced by tests/architecture/test_layout.py (src/, libs/, apps/, module names) and
# tests/architecture/test_layout_buckets.py (tests/, config/, docs/):
#
#   - every module under src/, libs/ and apps/ lives in a directory declared here (a new folder or a
#     stray file fails: declare the folder here with its purpose, in the same PR);
#   - at most `max_modules` modules (excluding __init__.py; in tests/ also conftest.py) per
#     directory, src/, libs/, apps/ and tests/ alike; split by kind instead. There are no exceptions
#     (a fitness test keeps `[[exception]]` absent). `make layout` lists directories at
#     `warn_modules` or more, so a split is planned before it is forced;
#   - no module is named for a grab bag (`[banned_module_names]`): name it for what it does;
#   - every package has an __init__.py whose docstring says what the folder holds;
#   - `kind = "vendor"`: one folder per vendor. It contributes at least one source to the
#     source registry, and nothing outside the folder imports it except the registry;
#   - `kind = "task-domain"`: registered tasks (tasks/framework/registry.py) or private
#     helpers. A module is imported only within its own domain folder or by the task
#     registry, unless it is listed in `[[shared]]` with the reason;
#   - tests mirror their source (`[[test_mirror]]`): every directory under a mirror root is a
#     declared source directory that exists; every other test directory is a `[[test_dir]]`;
#   - config/ and docs/ folders are declared (`[[config_dir]]`, `[[docs_dir]]`) and hold at
#     most `max_files` files each (`kind = "log"`: an append-only numbered log, not capped);
#   - every apps/web folder is a `[[web_dir]]` in architecture/web_layout.toml (ADR 0025;
#     enforced by tests/architecture/test_layout_web.py).
#   path     a directory relative to the repo root; `*` matches one path segment
#   purpose  one line: what belongs in it
#   kind     optional: "vendor" or "task-domain" (rules above)
#   contracts optional: import-linter contract names (pyproject.toml) enforcing the folder rule
#   holds    [[test_dir]] only: "tests" (default), "folders" (no modules of its own) or "data"
#            (recorded files, no Python)
#
# Split by kind, one file each (the readers merge every architecture/layout*.toml): this file
# (the settings and src/), layout_apps.toml (apps/, libs/, [[shared]]), layout_tests.toml
# (tests/) and layout_docs_config.toml (config/, docs/).
# Adding a folder or moving a responsibility: .claude/skills/add-responsibility.

doc = "docs/adr/0020-directory-layout.md"
max_modules = 10
warn_modules = 8   # make layout: "approaching the limit, plan the split by kind"
max_files = 12     # per config/ and docs/ folder
source_registry = "libs/sources/algotrade_sources/framework/registry.py"
task_registry = "apps/ingestion/algotrade_ingestion/tasks/framework/registry.py"
task_entries = "apps/ingestion/algotrade_ingestion/tasks/framework/entries_*.py"  # the registry's run wrappers: may import task domains

[banned_module_names]
reason = "a grab-bag name hides unrelated code and invites more: name the module for what it does (pricing.py, not utils.py); a bucket of test builders is the tests/helpers/ folder, its modules named for what they build"
names = ["utils", "util", "helpers", "common", "misc", "stuff", "tools", "lib", "shared"]

