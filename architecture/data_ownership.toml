# Ownership registry (ADR 0019), data: reading market data and storing it (data/, storage/).
# Every responsibility has exactly ONE owner. The registry is every architecture/*_ownership.toml
# but web_ownership.toml, one file per layer: an entry lives in the file whose `scope` holds its
# first owner (the longest prefix wins), sorted by id. Fields and detect rules: the docstring of
# scripts/check_ownership.py. Before writing code that does X, find X
# (`grep <keyword> architecture/*ownership.toml`) and extend its owner; a new responsibility
# needs an entry + owner in the same PR (.claude/skills/add-responsibility).
# Stored tables are in architecture/tables.toml (one producing owner each).

scope = ["src/algotrade/data/", "src/algotrade/storage/"]

[[responsibility]]
id = "background-recording"
description = "Write what the API records in the background without ever blocking a request: the one queued batch writer (bounded queue, a daemon thread draining batches, drop and log when full or a write fails, unique run id per batch, flush and close) that the live-quote recorder (ADR 0028) and the text-model usage recorder (ADR 0058) are subclasses of"
owner = ["src/algotrade/storage/recording.py"]
section = "docs/adr/0058-llm-usage-log-prices-and-budget.md#the-write"
detect = [{ call = "task_done" }, { call = "put_nowait" }]

[[responsibility]]
id = "feature-input-loading"
description = "What a feature group reads, by table name: each input table's point-in-time read for features (from its data owner), slicing per session and lookback, other groups' stored rows (rollups/instrument/ and rollups/market/) with this run's rows winning, the session's universe snapshot (the population; none before the first) and the symbol -> id map of its reference snapshot (instruments/symbol_ids, a lookup only; ADR 0047), the sector and industry of the company snapshot on or before the session (instruments/company; none before the first), the leveraged and inverse funds' latest holdings (holdings/etf, ADR 0050), bars narrowed to the ids of a group's tickers (Input.symbols); features never read storage or a domain reader"
owner = ["src/algotrade/data/feature_inputs.py"]
allowed = [
    # ADR 0024 / 0037: the API shows stored group rows (a feature's series in the read
    # model's FeatureSeries); a display read, never a feature input
    "src/algotrade/services/read/instruments/series.py",
    # ADR 0053 amendment: forward outcomes read each window's bars split-adjusted as of its end
    # session, the one per-session-window bar read rollups use; reused, not re-implemented
    "apps/ingestion/algotrade_ingestion/tasks/derived/outcomes.py",
    # ADR 0053, amendment "Report containment (diagnostic)": reads the real report date, never a pick input
    "src/algotrade/services/evaluation/cross_section/report_containment.py",
]
section = "docs/adr/0023-feature-store.md#step-2-inputs-through-data"
detect = [
    { call = "session_bars" },
    { call = "stored_events" },
    { call = "events_by_event_date" },
    { call = "share_facts" },
    { call = "curve_as_rows" },
    { call = "rollup_rows" },
    { call = "symbol_ids" },
]

[[responsibility]]
id = "historical-identity"
description = "The names and identity fields of a session before the first reference snapshot (ADR 0053 amendment 2026-10-09, ED6): universe_asof's listings alive on the session (the delisted too) in place of the earliest snapshot's names, a name alive in today's snapshot keeping today's row (optionable, security_type: a disclosed lookahead tilt), a delisted one counted as a common stock with its optionable decided by the universe's own close and adv_usd_20d floors (a universe without them is a ConfigurationError, never a number of our own); the edge harness and the training frame only (historical=True), the run's caveat (rule, sessions, names by path) persisted in its run record and shown in its report"
owner = ["src/algotrade/data/listings/identity.py", "src/algotrade/services/evaluation/cross_section/historical.py"]
allowed = ["src/algotrade/services/evaluation/cross_section/picks.py", "src/algotrade/services/features.py"]  # the callers: the harness reads, field_view substitutes
section = "docs/adr/0053-edges-hypotheses-outcomes-and-one-harness.md#amendment-2026-10-09-historical-eligibility-before-the-first-snapshot"
detect = [{ call = "historical_reference" }, { call = "require_liquidity_rule" }]

[[responsibility]]
id = "history-copy"
description = "The derived, read-optimised history copy of a table's resolved rows (one Parquet file per year under tables/<table>/_history/, a manifest of the source partitions' index signatures): built by TableStore.build_history (ingestion calls it, ADR 0005), served by read_range only for as_of None and no own_run while every requested partition still has the signature recorded at the build, else the partitions; no other code builds or reads these files"
owner = ["src/algotrade/storage/backends/history.py"]
allowed = [
    "src/algotrade/storage/backends/local.py",  # serves read_range from it, exposes build_history
    "src/algotrade/storage/backends/memory.py",  # build_history is a no-op there: no copy
    "src/algotrade/storage/tables/interfaces.py",  # declares build_history on TableStore
]
section = "docs/adr/0060-history-copy.md#decision"
detect = [{ call = "build_history" }, { call = "HistoryCopy" }]

[[responsibility]]
id = "locking"
description = "Exclusive locks across threads and processes (flock): named store locks and the partition run-index lock (storage); the one-writer ingest run lock (services/jobs)"
owner = ["src/algotrade/storage/locks.py", "src/algotrade/services/jobs/exclusive.py"]
allowed = ["libs/sources/algotrade_sources/framework/limiter.py"]  # sources never import storage (R4): the limiter flocks its own state file
section = "docs/adr/0019-ownership-and-boundaries.md#r2-storage-is-generic"
detect = [{ import = "fcntl" }, { call = "flock" }]

[[responsibility]]
id = "macro-series-reads"
description = "Read macro series and index levels (macro/series, ADR 0048) point in time by vintage: each observation's latest vintage on or before a session (data.macro.series) and the pit = lag vintage rule (data.macro.vintages); consumers and feature groups read the table only through data.macro and data.feature_inputs"
owner = ["src/algotrade/data/macro/*"]
allowed = [
    "src/algotrade/storage/tables/schemas.py",  # declares the table
    "src/algotrade/features/rollups/market/macro.py",  # names its input; read through data.feature_inputs (ADR 0048)
]
section = "docs/adr/0048-macro-series-with-vintages.md#decision"
detect = [{ string = "macro/series" }]

[[responsibility]]
id = "market-data-reads"
description = "Domain reads of market data (reference, InstrumentView, universe, bars + adjustments, events, chains, rates, IBKR vols) for consumers"
owner = ["src/algotrade/data/*"]
allowed = ["src/algotrade/storage/*"]  # the generic reader itself lives in storage
section = "docs/adr/0019-ownership-and-boundaries.md#r1-only-data-reads-market-data"
detect = [{ import = "algotrade.storage.tables.readers" }]

[[responsibility]]
id = "parquet-io"
description = "Physical file formats and paths (Parquet today, DuckDB later)"
owner = ["src/algotrade/storage/backends/*"]
section = "docs/adr/0019-ownership-and-boundaries.md#r2-storage-is-generic"
detect = [
    { import = "pyarrow" },
    { import = "duckdb" },
    { call = "read_parquet" },
    { call = "to_parquet" },
]

[[responsibility]]
id = "rates-reads"
description = "Which Treasury curve a date sees (latest on or before, earliest flagged) and rates for a time to expiry: consumers call data.rates.curve, never read rates/treasury themselves"
owner = ["src/algotrade/data/rates.py"]
allowed = [
    "src/algotrade/storage/tables/schemas.py",  # declares the table
    "apps/ingestion/algotrade_ingestion/tasks/market/rates.py",  # its one producer
    "apps/ingestion/algotrade_ingestion/tasks/framework/registry.py",  # declares the task's tables
    "libs/sources/algotrade_sources/vendors/treasury/*",  # the vendor's frame key
    "src/algotrade/features/rollups/options/iv30.py",  # names its input; the framework reads it through data.rates (ADR 0021 IV30)
    "src/algotrade/features/rollups/market/macro.py",  # names its input (the recent curve); read through data.rates (ADR 0048)
]
section = "docs/adr/0021-option-pricing-conventions.md#rates"
detect = [{ string = "rates/treasury" }]

[[responsibility]]
id = "raw-persistence"
description = "Save vendor payloads as received to the raw store before parsing"
owner = ["src/algotrade/storage/backends/*", "apps/ingestion/algotrade_ingestion/tasks/framework/run.py"]
section = "docs/adr/0019-ownership-and-boundaries.md#the-ingest-loop-is-written-once"
detect = [{ call = "raw.put" }]

[[responsibility]]
id = "run-publish"
description = "Atomic publication of a run's table writes (ADR 0022): pending writes, one commit for every table at once (or abort), commit sequence for readers, crash recovery; driven by IngestRun for ingestion and ResultWriter.publishing for services"
owner = [
    "src/algotrade/storage/backends/*",
    "src/algotrade/storage/tables/writers.py",
    "src/algotrade/storage/tables/result_writer.py",
    "apps/ingestion/algotrade_ingestion/tasks/framework/run.py",
]
section = "docs/adr/0022-atomic-run-publication.md#decision"
detect = [{ call = "commit_run" }, { call = "abort_run" }, { call = "recover_runs" }]

[[responsibility]]
id = "run-records"
description = "Create run ids and run records and decide COMPLETE / PARTIAL for a run: one-shot use cases (screens, backtests) call storage.runs.start_run + RunRecord.finish; ingestion uses IngestRun; jobs use services/jobs"
owner = [
    "src/algotrade/storage/runs.py",
    "src/algotrade/services/jobs/*",
    "apps/ingestion/algotrade_ingestion/tasks/framework/run.py",
]
section = "docs/adr/0019-ownership-and-boundaries.md#the-ingest-loop-is-written-once"
detect = [{ call = "RunRecord" }, { call = "new_run_id" }, { attr = "RunStatus.PARTIAL" }]

[[responsibility]]
id = "run-selection"
description = "Which runs of a partition a read at as_of sees, per the table's run mode (TableSpec.runs): snapshot = the latest run; merge (events) = the union from the latest restating run on, the latest run's row per table key"
owner = ["src/algotrade/storage/backends/run_selection.py"]
allowed = [
    "src/algotrade/storage/backends/local.py",  # applies the selection to its _runs.json index
    "src/algotrade/storage/backends/local_index.py",  # parses _runs.json entries into RunEntry
    "src/algotrade/storage/backends/memory.py",  # applies the selection to its in-memory runs
]
section = "docs/adr/0007-point-in-time-data.md#how-runs-combine"
detect = [{ call = "select_runs" }, { call = "merge_rows" }, { call = "RunEntry" }]

[[responsibility]]
id = "snapshot-selection"
description = "Pick the snapshot a reader sees: the latest partition on or before a date, else the earliest (pre_snapshot)"
owner = ["src/algotrade/data/reference.py"]
section = "docs/adr/0019-ownership-and-boundaries.md#r1-only-data-reads-market-data"
detect = [{ call = "latest_date" }]
