# Ownership registry (ADR 0019), read: the read model and the graph that serves it (ADRs 0036-0038).
# Every responsibility has exactly ONE owner. The registry is every architecture/*_ownership.toml
# but web_ownership.toml, one file per layer: an entry lives in the file whose `scope` holds its
# first owner (the longest prefix wins), sorted by id. Fields and detect rules: the docstring of
# scripts/check_ownership.py. Before writing code that does X, find X
# (`grep <keyword> architecture/*ownership.toml`) and extend its owner; a new responsibility
# needs an entry + owner in the same PR (.claude/skills/add-responsibility).
# Built over read-model PRs 2-10b (docs/api/read-model.md "Migration plan"); services/explore,
# the legacy page reads, was deleted in PR 10b. A new rule is added with the code it guards
# (never parked in known_violations.toml).

scope = ["src/algotrade/services/read/", "apps/api/algotrade_api/graphql/"]

[[responsibility]]
id = "availability-causes"
description = "Why a fact is not available, and who may know (ADR 0056, services/read/availability/): the public UnavailableKind and Unavailable (a kind, the catalogue features it hides, the Guide glossary term of the kind) and the admin-only Cause chain (source -> step -> table -> features); explain(ctx, leaf) expands a leaf from stored facts only (feature -> group table -> inputs; table -> the nightly step that wrote it, from the run record's recorded step tables). Every read-model construction site builds the leaf it knows; a trader is served the kind and the feature names, never a table, vendor, step or error text (GraphQL AdminCause, REST redact)"
owner = ["src/algotrade/services/read/availability/*"]
allowed = [
    "src/algotrade/services/read/*",  # every construction site of an Unknown builds its leaf with table_cause / feature_cause / run_cause
    "apps/api/algotrade_api/*",  # the serving layer calls explain behind AdminCause and redact
]
section = "docs/adr/0056-role-scoped-causes.md#decision"
detect = [{ call = "explain" }, { call = "unavailable_tables" }]

[[responsibility]]
id = "current-release-resolution"
description = "Which serving release a request follows (ADR 0077 decision 5, 23): CURRENT read once, its hash and format checked, the store's destructive epoch compared with the one the release was built at; the release's id, session and pinned sequence, or None for the live path"
owner = ["src/algotrade/services/read/serving/current.py"]
allowed = [
    "apps/api/algotrade_api/main.py",  # the API's release reads
]
section = "docs/adr/0077-serving-release.md#decision"
detect = [{ call = "resolve_current" }, { call = "releases_at" }]

[[responsibility]]
id = "data-status-read"
description = "How complete the served session's data is, for every viewer (ADR 0062 amendment 2026-10-23, services/read/availability/data_status.py): DataStatus with per-dataset shares (Prices from the rollups step's coverage_price_stats.close cells, Options chains from run_items.chain_coverage, Fundamentals from its coverage_fundamentals.shares_outstanding cells), read from run records alone for exactly ctx.session.date, a dataset with no record UNKNOWN with a NOT_RUN gap and never 0%; the grade of option chains (share_status: COMPLETE at 98%, PARTIAL, MISSING, shared with the admin completeness grid) and of the coverage datasets (the rule's own verdict per tier); the DataState decided on the server from Session.complete, Session.newer and the datasets; and how many of the viewer's screeners (no run, a PARTIAL run, a run without a required table) it touches. The cause behind an UNKNOWN is the admin-only Unavailable.cause (ADR 0056)"
owner = ["src/algotrade/services/read/availability/data_status.py"]
allowed = [
    "src/algotrade/services/read/ops/ingestion.py",  # the admin completeness grid grades its cells with share_status
    "apps/api/algotrade_api/graphql/*",  # Session.dataStatus serves it
]
section = "docs/adr/0062-reads-serve-the-last-complete-session.md#amendment-2026-10-23-the-data-status-every-viewer-reads"
detect = [{ call = "load_data_status" }, { call = "share_status" }]

[[responsibility]]
id = "domain-read-model"
description = "Domain read objects and their loaders (ADR 0037): every read a page shows is a frozen dataclass built by one load_<object>(ctx, ...) in services/read/<area>/, for ctx.session only; per-instrument values by catalogue name (ADR 0038), never a table path. the market regime (ADR 0047: MarketRegime with its indicator cards, label bands, reference episodes and NBER recessions, and per episode the signal timing: when each indicator and the screener gate flagged and cleared from each session's own stored verdict over a ranged window ending at the session, services/read/regime/) and the market entity (services/read/market/: its values by catalogue name and the bucketed history of its stored fields), read from the market-entity feature groups by catalogue name. The edge evaluation reads (ADR 0053, services/read/evaluation/): Edge (the documents with their status), EdgeRun / EdgeRow (committed runs of results/edge_eval read BY RUN, never by session: the run's own partition, runId, range, split, knowledgeTs and asOf disclosed; the canonical run is the latest site run at the edge's frozen_from) and a screener's TrackRecord (the canonical run's frozen slice only, never an exploratory run); which edges a pick counts toward (pick_edges.py, `ScreenResult.countsToward`: read from the picks each site edge stored for the served session (results/edge_picks, ADR 0081: its universe, schedule and cut already applied by the harness's rule; not_stored when none, never an older night), decided on the server, no outcome read); and a user's own edges (versions.py, ADR 0053 amendment 2026-10-09: Edge.state / mine / extends / labels, the verdict and comparison of a copy's latest run against the edge it extends and its baselines, and the layered document an admin publishes as TOML; a copy's out-of-sample result is withheld server side until the user shows it: its run serves in-sample rows only, its verdict is judged on those and says so). The text-model usage read (ADR 0058, services/read/ops/usage.py: LlmUsage over usage/llm_calls by a date range ending at the exchange date, the one read besides outcomes that is not one session; session-free). The Admin harness runs read (ADR 0053, services/read/ops/harness_runs.py: HarnessRun, every edge evaluation run record of any status with its trial-log figures, session-free, and one run's own rows through the evaluation read). The event reads (ADR 0050, services/read/events/): InstrumentEvents (the events ahead: own and a fund's reference earnings by catalogue name, the macro releases known by the session, the market-structure days from the exchange calendar; the 8-K filings; the expiry ladder over the session's chain with its spans and clear state; the fund reference by catalogue name) and the cross-name EventCalendar (its scope list through services.events). A fact a page needs is stored, not computed on read: chain_expiries (the nearest expiry, stored as rollup.nearest_expiry@v1 since read-model PR 3) is called only by data/ and the producing feature group (read-model PR 5 deleted its last read-time caller, explore ideas/ranking.py). A screen's boolean groups (ADR 0071: ScreenGroup on Screener.groups and, with the instrument's outcome and deciding member, on ScreenResult.groups; ScreenCriterion.group and CriterionResult.group name the parent; group rows of results/rule_screen_values never read as criteria; a group over a field the viewer's licences do not cover is MISSING to them). A screener's pick history (services/read/screens/pick_history.py: `Screener.pickHistory`, the picked / paused count of each of its last N sessions, entry d equal to latestRun at d, a ranged read ending at the session, one entry per exchange session, NOT_RUN where it did not run; the request's session from latestRun, an earlier one from its run record's decisions found in one pass over the run store, never from result rows)"
owner = ["src/algotrade/services/read/*"]
allowed = [
    "src/algotrade/data/*",  # the generic table reads (R1)
    "src/algotrade/features/*",  # feature groups name their own tables
    "src/algotrade/core/model/fields.py",  # ROLLUP_TABLE_PREFIX: catalogue names -> tables, in one place
    "src/algotrade/storage/tables/schemas/registry.py",  # declares the rollups/instrument/* and rollups/market/* table families
    "src/algotrade/strategies/screeners/*",  # a screener declares the feature table it reads through core.views (engine input, not a display read)
    "apps/ingestion/*",  # producers and the verification checks name the tables they write or compare
]
section = "docs/api/read-model.md#the-domain-objects"
detect = [{ string_prefix = "rollups/instrument/" }, { string_prefix = "rollups/market/" }, { call = "chain_expiries" }]

[[responsibility]]
id = "edge-evidence-read"
description = "The sections of an edge's result page beside its verdict (ADR 0064, 0065), every one about the verdict's own run and basis (the official run: a site edge's canonical run, a user's own edge's latest; the basis fixed by the verdict rule before the out-of-sample period is read, never re-chosen by a section) and read only through the run reader (a hidden copy's out-of-sample rows are withheld there): the basis's per-session series valued in the outcome's unit (a window known at its exit session; a window with no number is a gap, never zero), the evidence curve with its gaps and the live stroke from the stored paper trades (anchored on the backtest's cumulative value, settled trades as the session knew them), the drawdown, its deepest episodes and the volatility of the windows, the rolling starts, the monthly map, the decay with its live bar, the cost sensitivity and capacity of the basis, and where it worked (by regime and by holding period, with the date each out-of-sample count is expected); the table a lost input lost is the admin's cause only (ADR 0056); the browser derives none of it"
owner = ["src/algotrade/services/read/edge_evidence/*", "src/algotrade/services/read/edge_ledger/*"]
section = "docs/adr/0064-edge-evidence-series-and-trade-ledger.md#decision"
allowed = ["apps/api/algotrade_api/graphql/*"]  # Query.edgeResult serves it
detect = [{ call = "official_basis" }, { call = "load_basis_series" }, { call = "load_curve" }, { call = "load_drawdown" }, { call = "load_rolling_starts" }, { call = "load_monthly" }]

[[responsibility]]
id = "edge-verdict"
description = "An edge's verdict (ED8, ADR 0053): Works, Promising, Not working, Not enough data or Waiting on data from its official result (the canonical run's stored rows: one basis, the declared screen and holding period, else the best in-sample, fixed before the frozen period is read (ADR 0065), one deterministic rule, the one-line reason, the criteria with value, threshold and pass / fail / not measured, the year-by-year rows, the outlook: the first test not passed and the trades missing, ADR 0064; the decay of the published figure and the haircut Sharpe ratio), its thresholds typed from config/site/verdict.toml; the statistics are the stored rows', never recomputed, and the browser derives nothing of it; its headline is stored per run in results/edge_verdict under a fingerprint of everything the judge read (ADR 0053 amendment 2026-10-22): a stored row is used only when the fingerprint matches, else the verdict is judged live, own edges and copies always live, and verdicts are read by run, not by session (ADR 0036)"
owner = [
    "src/algotrade/services/read/evaluation/verdict/rule.py",  # the rule; model.py, criteria.py, level.py and basis.py are its parts
    "src/algotrade/services/read/evaluation/verdict/basis.py",
    "src/algotrade/services/read/evaluation/verdict/criteria.py",
    "src/algotrade/services/read/evaluation/verdict/level.py",
    "src/algotrade/services/read/evaluation/verdict/model.py",
    "src/algotrade/services/read/evaluation/verdict/fingerprint.py",  # the digest of everything the judge reads (the judge call, settings, source, JUDGE_VERSION): the guard of a stored headline
    "src/algotrade/services/read/evaluation/verdict/stored.py",  # the stored headline read only on a fingerprint match, else the live judge (own edges and copies always live)
    "src/algotrade/services/read/evaluation/versions.py",  # the same rule over a user's own edge's latest run (in-sample only while its out-of-sample is hidden)
    "src/algotrade/config/edges/verdict.py",
]
section = "docs/adr/0053-edges-hypotheses-outcomes-and-one-harness.md#decision"
allowed = [
    "apps/api/algotrade_api/graphql/*",  # Edge.verdict serves it
    "src/algotrade/services/evaluation/cross_section/detail/verdict.py",  # the one framer of the stored headline: the same load_verdict and judge_call as the reader, so the row equals the live answer (ADR 0053 amendment 2026-10-22)
    "src/algotrade/services/authoring/edges.py",  # reads the one threshold it needs (forward_sessions) from the site's verdict.toml; the rule stays here
    "src/algotrade/services/evaluation/cross_section/harness.py",  # reads the count thresholds only, to size the projected exits (ADR 0064 decision 7); the rule stays here
    "src/algotrade/services/read/edge_evidence/capacity.py",  # reads the site's capacity floor (ADR 0064 decision 5); the rule stays here
    "src/algotrade/services/read/edge_desk/*",  # the live record's band thresholds (live_min_sessions, live_low, live_high) and the forward test's forward_sessions
    "src/algotrade/services/evaluation/cross_section/harness.py",  # reads only the site's cost grid ([edge_costs] levels_bps) and capacity floor (ADR 0064): every leg counts its hits at each level, the statistics apply the floor
    "src/algotrade/services/read/edge_evidence/*",  # the result sections read the verdict's own run, basis and decay (ADR 0064, 0065)
]
detect = [{ call = "load_edge_verdict" }, { call = "load_verdict" }, { call = "judge_call" }]

[[responsibility]]
id = "event-source-link"
description = "Where an event's own source page is, built server-side so the web app receives a ready URL and never assembles one (the Explore chart's event list, owner decision 2026-10-22): an 8-K or 8-K/A to its sec.gov filing index from the stored cik and accession (events/filing; a cik or accession that is not the plain digits SEC writes gives none), a report stored from an 8-K Item 2.02 release (source sec_8k) to the index of the same company's Item 2.02 filing accepted at that instant (never another filing of the day; a Nasdaq-calendar-only report and an upcoming one have none), a macro release key to the agency page of config/site/events/links.toml; every other kind (dividends, splits) none; no new stored column"
owner = ["src/algotrade/services/read/events/links.py"]
allowed = [
    "src/algotrade/config/site/events/links.py",  # the typed loader of the agency pages, called only by the event reads
    "src/algotrade/services/read/events/ahead.py",  # a macro release's agency page
    "src/algotrade/services/read/events/filings.py",  # a filing's index; the Item 2.02 filings a report finds its page in
    "src/algotrade/services/read/events/stored.py",  # a report stored from an 8-K
]
section = "docs/adr/0050-event-sensitivity.md#decision"
detect = [{ call = "source_link" }, { call = "filing_url" }, { call = "load_event_links" }]

[[responsibility]]
id = "filter-pass"
description = "The one filtering pass of every table, list and feed (ADR 0082 decision 2-3, services/read/filtering/): a surface's definitions (config/site/filters, config/filters) resolved against the catalogue and the viewer's licences (a filter on a field the viewer's licences do not cover is not offered and is refused if sent, before any count: ADR 0069), the truth of each active filter on each row through core.model.predicates (the operator from the kind; UNKNOWN never passes; a min of 0 admits no null; a switched-off or empty input is in no mask), and from that one pass matched, removes(f) (rows passing every other active filter minus matched), option counts by count then value, fixed-edge bins and the unknown count; the definitions as a viewer is served them (filterSet: options, withheld filters as Unavailable) and the hash of the filters a paging cursor carries; pure and deterministic; Ideas adopts it (ADR 0082 PR 4), screener results and the universe table follow"
owner = ["src/algotrade/services/read/filtering/*"]
allowed = [
    "src/algotrade/services/read/screens/ideas.py",  # the loader adopts the pass (ADR 0082)
    "apps/api/algotrade_api/graphql/types/query.py",  # filterSet: one loader call
]
section = "docs/adr/0082-shared-filter-bar.md#decision"
detect = [{ call = "compute_facets" }, { call = "evaluate_filters" }, { call = "resolve_definitions" }, { call = "load_served_filters" }, { call = "filter_hash" }]

[[responsibility]]
id = "graphql-schema"
description = "The GraphQL read layer (ADR 0037): the Strawberry schema at POST /graphql, scalars (FeatureName, Date, JSON), error codes, limits, request context, dataloaders, the read pool's admission control (503 + Retry-After past the queue), the response cache (an allow-list of operations over published tables; ADR 0056: keyed on role, and user unless shared) and the thin types over services.read; the committed snapshot apps/api/schema.graphql (from read-model PR 4)"
owner = ["apps/api/algotrade_api/graphql/*"]
section = "docs/api/read-model.md#graphql-conventions"
detect = [{ import = "strawberry" }]

[[responsibility]]
id = "guide-edges-read"
description = "The Guide's Edges section as read objects (ADR 0051), from the site's edge documents alone through load_edges as the site user (a user's draft never appears), session-free and with no harness result: the site edges with the tags derived from the document (asset class, side, holding band, plain trigger text, the screeners among an edge's screeners and the edges a screener implements), the one edge page (thesis, the other side, why it lasts, the published figure with its planning haircut, how it is tested as facts with glossary terms, how it is built, what fools it, sources, related edges), the mechanism page (the mechanism prose with its edges as rows and its ideas not built, ideas.py: not_built / ideas_of) and the section's index (mechanism cards, filters with counts, edges set aside); never the session, a store, evaluation or an outcome (tests/architecture/guide/test_edges_session_free.py)"
owner = ["src/algotrade/services/read/guide/edges/*"]
allowed = [
    "src/algotrade/services/read/guide/*",  # the Guide's index, screener page, batched entries and search read the edges through the section's loaders
    "apps/api/algotrade_api/graphql/*",  # Query.guideEdgeIndex / guideMechanism / guideEdge serve them (one loader call per resolver)
]
section = "docs/ui/guide.md#edges"
detect = [{ call = "site_edges" }, { call = "edges_of_screener" }, { call = "load_guide_edge" }, { call = "load_guide_mechanism" }, { call = "load_guide_edge_index" }]

[[responsibility]]
id = "guide-read"
description = "The Guide's read objects: the index of every entry kind, the field page with what the server derives for it (related fields from the guide entry's text and the formula's inputs, the site screeners that use the field with each rule as text, the situations that fool it), the situation page (by slug; the screeners whose fields it fools), the regime indicator page (a card's explanation without a session value) and episode page (by key; the cards whose before-line means it, one rule: before_episode), the glossary term and Start here pages (written.py; links titled from the one list of Guide entries), the one Guide search (search.py: every entry kind, ranked exact name, name or title, intent or theme, prose; grouped by kind; computed per request, no stored index), and Guide prose split at the catalogue names it mentions (the browser parses no text, ADR 0038), ADR 0051; session-free, over the site configs and the caller's catalogue"
owner = ["src/algotrade/services/read/guide/*"]
section = "docs/ui/guide.md#5-the-rule-and-its-checks"
detect = [{ call = "load_guide_sections" }, { call = "load_guide_screeners" }, { call = "link_prose" }, { call = "guide_entries" }]

[[responsibility]]
id = "guide-screeners-read"
description = "The Guide's Screeners section as read objects (ADR 0051), session-free, over the site rule-screen presets resolved as the site user and their prose files: the site screeners in Guide order with the rule of a criterion as text (site_screeners.py: site_screeners, rule_text), one screener's page (screener.py: prose with its source markers as segments, the sources with their https urls, criteria, related, the situations that fool its fields, the edges using it), the section's lead page (index.py: what a screener is, how it differs from an edge, a card per family with its count) and one family's page (category.py: its purpose and intro, its screeners as rows with what each asks and the edges that use it); the edge links come from guide-edges-read"
owner = ["src/algotrade/services/read/guide/screeners/*"]
allowed = [
    "src/algotrade/services/read/guide/*",  # the Guide's index, field and situation pages, batched entries, search and the edges read the site screeners through site_screeners
    "apps/api/algotrade_api/graphql/*",  # Query.guideScreener / guideScreenerIndex / guideScreenerCategory serve them (one loader call per resolver)
]
section = "docs/ui/guide.md#screeners-three-levels"
detect = [{ call = "site_screeners" }, { call = "rule_text" }, { call = "load_guide_screener" }, { call = "load_guide_screener_index" }, { call = "load_guide_screener_category" }]

[[responsibility]]
id = "ideas-list"
description = "The Ideas list (ADR 0029): the viewer's screener pool built from the rule screens' runs for exactly the session (ADR 0036: a screener with no run for it is NOT_RUN, no lookback; a run withheld by a licence is WITHHELD and contributes nothing), ranked by the pure rule of services/ideas (ideas-ranking), each idea served with its best pick (values, regime, size multiplier, metrics, watch-outs, facts) and picked_by; per-screener picked counts and first picks; never recomputes a screen (read-model PR 5); ideas.priority is retired from PR B (the loader reads it until then)"
owner = ["src/algotrade/services/read/screens/ideas.py"]
allowed = ["apps/api/algotrade_api/graphql/*"]  # Query.ideas serves it (one loader call per resolver)
section = "docs/adr/0029-rule-screener.md#owner-decisions-2026-10-03"
detect = [{ call = "load_ideas" }]

[[responsibility]]
id = "release-reads"
description = "Which operations the API answers from the current serving release and how (ADR 0077 decision 23): the listed shared operations (architecture/release_shared_ops.toml, RELEASE_SHARED_OPERATIONS), one decision per request (the verified current release, the kill switch serving.release_reads), reads pinned at the release's sequence with its session as the default, the response key (release id, role, document, variables, licences), and the fallback to the live path (no release, an unsupported format, a hash or epoch mismatch, a lost pin) whose answer is never kept"
owner = ["apps/api/algotrade_api/graphql/context.py"]
allowed = [
    "apps/api/algotrade_api/graphql/schema.py",  # the router asks, keys and falls back
    "apps/api/algotrade_api/main.py",  # wires the release store and the kill switch
]
section = "docs/adr/0077-serving-release.md#decision"
detect = [{ call = "ReleaseReads" }]

[[responsibility]]
id = "scalar-coercion"
description = "Turn a stored scalar (numpy, pandas, NaN, NaT, dates) into a JSON-safe value, one way for reads and runs (ADR 0037): services/read/values.py to_scalar; services/views.py imports it back as to_value for runs. Callers of the one coercion are allowed; re-implementations are not: a private _float / _text / _num helper is one (read-model PR 8), except where it parses a vendor payload, formats text or does arithmetic rather than coerce a stored value for display (the allowed entries below say which)"
owner = ["src/algotrade/services/read/values.py"]
allowed = [
    "src/algotrade/services/read/*",  # the loaders call the one coercion for every value they return (docs/api/read-model.md "Values and UNKNOWN")
    "src/algotrade/services/views.py",  # re-exports to_scalar as to_value (runs) and coerces the FeatureView through it
    "src/algotrade/services/preview/*",  # the Builder's dry runs show values through the one coercion, as the nightly run stores them
    "src/algotrade/services/screening/exports.py",  # run exports serialise through the same coercion, so runs and reads agree
    "src/algotrade/services/selection.py",  # the selection's field values, same coercion
    "src/algotrade/services/screening/rule_results.py",  # the rule-screen writer types value_num through the one coercion (_num calls to_value)
    "src/algotrade/services/screening/regime.py",  # the session's market values for the regime gate (ADR 0049), same coercion as the FeatureView
    "src/algotrade/services/backtests/market.py",  # a backtest's market feature values (ADR 0049), same coercion as screen runs
    "src/algotrade/storage/configs/toml_text.py",  # _float formats a TOML float literal (text out, not a stored value in)
    "src/algotrade/features/rollups/options/option_liquidity.py",  # _num is the rollup's arithmetic rule (no open interest / volume counts as 0), not display coercion
    "libs/sources/algotrade_sources/vendors/*",  # vendor payload parsers (_float / _text read a vendor's JSON, XML or CSV, never a stored value)
    "apps/ingestion/algotrade_ingestion/workflows/nightly/*",  # the nightly email renderer and its timing lines format run-record stats as text
]
section = "docs/api/read-model.md#values-and-unknown"
detect = [{ call = "to_value" }, { call = "to_scalar" }, { call_regex = "^_(float|text|num)$" }]

[[responsibility]]
id = "session-resolution"
description = "Which partition a read sees (ADR 0036): resolve one Session (requested, else the latest whose nightly workflow is complete, ADR 0062, disclosing the newer incomplete one; none complete: the latest with bars) and read session-grain tables for exactly that date, UNKNOWN otherwise; snapshot tables through data.reference.snapshot with the snapshot date disclosed. services/read/session.py resolves (resolve_session, default_session, the table grains); services/read/context.py calls it once per request (open_context) and reads session partitions (partition); nothing else may (services/explore, which picked its own partition by six rules, the bug ADR 0036 fixes, was deleted in read-model PR 10b)"
owner = [
    "src/algotrade/services/read/session.py",
    "src/algotrade/services/read/context.py",
]
allowed = [
    "src/algotrade/data/reference.py",  # the snapshot-grain primitive (snapshot-selection, ADR 0007's one rule)
    "src/algotrade/services/serving/build.py",  # resolves the default session through the pinned reader: the release's session record (ADR 0077)
    "src/algotrade/services/ondemand/screens.py",  # a write: an on-request run targets the default session, default_session (ADR 0033, 0062), outside read strictness (ADR 0036 decision 5)
]
section = "docs/api/read-model.md#session-resolution"
detect = [
    { call = "partition_for" },
    { call = "latest_session" },
    { call = "latest_date" },
    { call = "rollup_row" },
    { call = "resolve_session" },
]
