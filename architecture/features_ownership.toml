# Ownership registry (ADR 0019), features: the feature store's computation (features/).
# Every responsibility has exactly ONE owner. The registry is every architecture/*_ownership.toml
# but web_ownership.toml, one file per layer: an entry lives in the file whose `scope` holds its
# first owner (the longest prefix wins), sorted by id. Fields and detect rules: the docstring of
# scripts/check_ownership.py. Before writing code that does X, find X
# (`grep <keyword> architecture/*ownership.toml`) and extend its owner; a new responsibility
# needs an entry + owner in the same PR (.claude/skills/add-responsibility).

scope = ["src/algotrade/features/"]

[[responsibility]]
id = "edge-market-triggers"
description = "The market-level triggers an on_market:<trigger> edge times by (ADR 0075): the VIX spike (market_triggers@v1: the first session with the latest fresh VIX at least 30 and VIX / VIX3M above 1 after 21 quiet sessions, known from the session after its close, null when the reading is stale, never 'no spike') and its placement for the time-series harness (the trigger sessions read one at a time from the stored market row, windows that never overlap, the out-of-window base around them); the outcomes are read by time_series/harness.py alone"
owner = [
    "src/algotrade/features/rollups/market/triggers.py",
    "src/algotrade/services/evaluation/time_series/triggers.py",
]
allowed = [
    "src/algotrade/services/evaluation/time_series/evaluate.py",  # the caller: places the periods of an on_market edge
]
section = "docs/adr/0075-market-triggers-lockup-reverse-split-and-two-windows.md#decision"
detect = [{ call = "trigger_periods" }, { call = "trigger_row" }, { call = "vix_stale" }]

[[responsibility]]
id = "feature-applicability"
description = "Whether a feature applies to an instrument (Feature.applies_to over the reference snapshot's optionable and security_type facts and the company snapshot's SIC): the one decision behind the read layer's NOT_APPLICABLE and the nightly coverage check (ADRs 0042, 0045); and the declared explanations of a null (null_status with illiquid_statuses / uncovered_statuses / explained_statuses, the closed NullReason) behind ILLIQUID, NOT_COVERED (ADR 0072) and EXPLAINED (ADR 0046)"
owner = ["src/algotrade/features/framework/feature.py"]
allowed = [
    "src/algotrade/services/read/instruments/features.py",  # NOT_APPLICABLE / ILLIQUID / NOT_COVERED / EXPLAINED on a read
    "apps/ingestion/algotrade_ingestion/tasks/maintenance/coverage.py",  # which names a feature is expected for
]
section = "docs/adr/0042-not-applicable-and-illiquid-values.md#decision"
detect = [{ call = "not_applicable" }]

[[responsibility]]
id = "feature-expressions"
description = "The expression language for features: lexing, parsing, type checking and vectorised evaluation of a formula over feature columns (null semantics, Kleene logic); the formula fingerprint (fingerprint.py: params bound, constants folded, commutative operands sorted, hashed, so a duplicate feature is found, ADR 0023); never Python eval"
owner = ["src/algotrade/features/expressions/*"]
section = "docs/adr/0023-feature-store.md#step-3-expression-features-virtual-by-default"
detect = [
    { call = "parse_formula" },
    { call = "check_formula" },
    { call = "evaluate_formula" },
    { call = "eval" },
    { call = "exec" },
]

[[responsibility]]
id = "feature-metadata"
description = "Feature definitions and their catalogue: each stored column is a Feature (kind, dtype, unit, description, null meaning, range, categories, inputs) declared in its group, each expression feature one built from its site definition; the registry and the FeatureSet index them and catalogue.py renders docs/data/features.md (ADR 0023); guide.py renders docs/data/field-guide.md and the per-group theme pages, a long theme split into parts, from the site field guide (ADR 0041)"
owner = [
    "src/algotrade/features/framework/feature.py",
    "src/algotrade/features/rollups/*",
    "src/algotrade/features/expressions/definitions.py",
    "src/algotrade/features/registry.py",
    "src/algotrade/features/catalogue.py",
    "src/algotrade/features/guide.py",  # renders docs/data/field-guide.md and the per-group theme pages from the site field guide (ADR 0041)
]
section = "docs/adr/0023-feature-store.md#decision"
detect = [{ call = "Feature" }, { string = "docs/data/features.md" }]

[[responsibility]]
id = "rollup-computation"
description = "Compute feature groups (rollups): the FeatureGroup declaration (inputs + lookback, params from rollups.toml, declared features, the entity one row describes: instrument, or market with one MKT:US row checked by the runner, ADR 0047; optional: its source may be absent for a session, ADR 0055), asking algotrade.data for inputs by table name, point in time per session, backfills; groups are pure compute modules (a materialised expression feature is a one-feature group built by the FeatureSet), stored only by the rollups task (instrument groups) and the market-rollups task (market groups), both through compute_rollups per entity. The earnings report window (the E-1 to E+1 excess return, pre-event ADV and volume ratio) is computed once, in earnings_reaction@v1 (corporate/); EV2's event_reaction@v1 must read that group, never recompute the window. The earnings surprise (the reported EPS against the calendar's consensus forecast, computed from the two numbers, never the vendor's value, which is used only to detect a lost sign) is computed once, in earnings_surprise@v1, and the revision of the next report's forecast across the nightly snapshots (same fiscal quarter, carried-forward rows not observations) once, in earnings_revisions@v1 (both in consensus/); the analyst estimates (FY1 / FY2 from the fiscal year end of the last annual report known) and price targets of our own FMP snapshots once each, in analyst_estimates@v1 and analyst_targets@v1 (consensus/), the analysts' strong buy to strong sell counts, mean rating and its 90-day change of our own Finnhub snapshots once in analyst_ratings@v1, and the revisions of the FY1 consensus (same fiscal year end, from the newest snapshot's day) once in analyst_revisions@v1 (both in consensus/); their population and status rules (OK, STALE, NOT_COVERED, NOT_FETCHED; per vendor) and the window of an earlier snapshot once in consensus/analyst_status.py"
owner = [
    "src/algotrade/features/framework/*",
    "src/algotrade/features/registry.py",
    "src/algotrade/features/rollups/*",
    "src/algotrade/features/expressions/feature_set.py",
    "apps/ingestion/algotrade_ingestion/tasks/derived/rollups.py",
    "apps/ingestion/algotrade_ingestion/tasks/derived/market_rollups.py",  # the market entity's task
]
section = "docs/data/layers.md#rollups-as-built"
detect = [{ call = "compute_sessions" }, { call = "compute_one" }, { call = "FeatureGroup" }]

[[responsibility]]
id = "statement-ttm"
description = "The trailing-twelve-month arithmetic over one concept's reported periods: the discrete quarter (a reported three-month fact, else the difference of two year-to-date facts of one fiscal year and one tag, never across tags), the TTM (four consecutive quarters, else the fiscal year), the latest quarter and its year-ago value. Written once in rollups/statements/ttm.py; financials@v3, income_statement@v2, cash_flow@v2 and growth_history@v2 (its trailing_ago, the TTM three and five years back) import it (balance_sheet@v2 reads instants, which have no TTM: statements/instants.py), no group re-implements it"
owner = [
    "src/algotrade/features/rollups/statements/ttm.py",
    "src/algotrade/features/rollups/corporate/financials.py",
    "src/algotrade/features/rollups/statements/income_statement.py",
    "src/algotrade/features/rollups/statements/cash_flow.py",
    "src/algotrade/features/rollups/statements/growth_history.py",
]
section = "docs/data/layers.md#rollups-as-built"
detect = [{ call = "discrete_quarters" }, { call = "latest_quarter" }]
