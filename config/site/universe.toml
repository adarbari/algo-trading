# L3 site setting: universe COVERAGE (what we ingest), not a filter. Strategies narrow it with
# selections (config/site/presets/selections, config/users/<id>/selections).
# Read by `algotrade-ingest universe-build` (and the nightly job when source = "nasdaq_trader").

# "nasdaq_trader": build nightly from the Nasdaq Trader symbol directory + SPY holdings.
# "csv_import":    keep the monthly master CSVs (`algotrade-ingest universe --stocks ...`).
source = "nasdaq_trader"

# Security types the universe covers. instruments/reference keeps every listed type.
# CEF (closed-end funds, vendor type FUND) joined on 2026-10-18 (ADR 0013 amendment): NAV-priced
# funds, not ETFs; their universe asset_class is "ETF" (a fund, never a stock population member).
security_types = ["COMMON_STOCK", "ADR", "ETF", "CEF"]
exclude_test_issues = true

# Always / never cover these symbols (ACT style, e.g. BRK.B).
include_symbols = []
exclude_symbols = []

# Leverage of an ETF (docs/data/instruments.md "Flagging leveraged and inverse ETFs"), in order:
#   1. a curated row in overrides/leveraged_etfs.csv            -> leverage_source "override"
#   2. the leverage the name states (leverage_conventions, then
#      leverage_patterns; sign from a minus or inverse_markers)  -> "name_parsed"
#   3. no leverage_markers left once leverage_exclusions phrases
#      are blanked out                                          -> unleveraged, "name_rule"
#   4. anything else                                            -> UNKNOWN, "needs_review"
#      (listed in the review file; curate it in the overrides file)
# Every pattern is a regular expression matched case-insensitively against the name.

# Words that make an ETF a leverage / inverse candidate. An ETF without any is unleveraged.
leverage_markers = ['\b-?\d(\.\d)?x\b', '\bultra', '\bbull\b', '\bbear\b', '\binverse\b',
                    '\bshort\b', '\bleveraged\b', '\bdaily\b']

# Fund-family conventions with a fixed leverage; first match wins (UltraPro Short before UltraPro).
leverage_conventions = [
    { pattern = '^(ProShares\s+)?UltraPro\s+Short\b', leverage = -3 },  # UltraPro Short Dow30
    { pattern = '^(ProShares\s+)?UltraPro\b', leverage = 3 },            # ProShares UltraPro QQQ
    { pattern = '^ProShares\s+UltraShort\b', leverage = -2 },            # ProShares UltraShort Gold
    { pattern = '^ProShares\s+Ultra\b', leverage = 2 },                  # ProShares Ultra Silver
    { pattern = '^ProShares\s+Short\b', leverage = -1 },                 # ProShares Short Dow30
]

# A stated multiple: the named group `n` is the number, next to a direction word or "Daily".
leverage_patterns = [
    '(?<![\w.])(?P<n>-?\d(?:\.\d+)?)x\s+(long|short|bull|bear|inverse|leveraged|daily|target)\b',  # "2X Short", "3x Leveraged", "2x Daily"
    '\b(long|short|bull|bear|inverse|leveraged|daily|target)\s+(?<![\w.])(?P<n>-?\d(?:\.\d+)?)x\b',  # "Bull 3X", "Daily 2X", "Daily Target 2X"
    '^(?<![\w.])(?P<n>-?\d(?:\.\d+)?)x\s',  # "2x Bitcoin ETF"
    '(?<![\w.])(?P<n>-?\d(?:\.\d+)?)x\s+ET[FN]s?$',  # "Volatility Shares Trust XRP 2X ETF"
    '(?<![\w.])(?P<n>-?\d(?:\.\d+)?)\s+(inverse\s+)?leveraged\b',  # "-3 Inverse Leveraged ETNs"
]
# A parsed multiple is negative when the name (exclusion phrases blanked) has one of these.
inverse_markers = ['\bshort\b', '\bbear\b', '\binverse\b']

# Phrases that use a marker word without meaning leverage (bond maturities, buffers, option
# income, long/short equity). A name with a marker left after blanking them still needs review,
# e.g. "Inverse VIX Short-Term Futures ETNs" or "YieldMax Short TSLA Option Income Strategy".
leverage_exclusions = [
    '\b(ultra[- ]?)?short[- ](term|duration|maturity|horizon)\b',
    '\bultra[- ]?short\s+(bond|income|treasury|t-bill|muni\w*|fixed|government|investment|tax)',
    '\bshort\s+(muni\w*|high yield muni|bond|treasury)',
    '\b(ultra\s+)?buffer\b',
    '\b(daily\s+)?putwrite\b',
    '\b(ultra\s+)?option income\b',
    '\bcovered call\b',
    '\bpremium income\b',
    '\bdaily income\b',
    '\blong[/ -]short\b',
    '\bleveraged loans?\b',
    '\bultra dividend\b',
    '\bultra[- ]small\b',
]

# ETF category (docs/data/instruments.md "Flagging specialised ETFs"; ADR 0076): the paper behind
# the thematic_etf_launch_fade edge (Ben-David, Franzoni, Kim and Moussawi, RFS 2023) calls an ETF
# "specialised" when it invests in a sector or in sectors tied by a theme, so both `sector` and
# `thematic` are flagged and kept apart. Each ETF gets one etf_category, in order:
#   1. a curated row in overrides/thematic_etfs.csv (symbol, category, theme, notes)  -> "override"
#   2. a leveraged or inverse fund (is_leveraged / is_inverse)                          -> excluded
#   3. an `exclusions` phrase (bond, spot commodity, option income, allocation, ...)    -> excluded
#   4. a `themes` phrase and no `broad` phrase                                          -> thematic
#   5. a `sector` phrase and no `broad` phrase                                          -> sector
#   6. a `broad` phrase and nothing else                                                -> broad
#   7. a theme or sector phrase next to a broad one, or no phrase at all                -> UNKNOWN
#      (`needs_review` / `unclassified`: listed in the review file, curated in the overrides)
# etf_theme is the group (`themes`), the sector, or the exclusion kind. Phrases are regular
# expressions matched case-insensitively against the name; the first matching group names the theme.
# Words of a broad-market, style, factor or generally active fund: with no theme or sector
# phrase the fund is `broad` (the paper's broad-index and smart-beta groups).
[etf_category]
broad = ['total (stock )?market', 's&p ?(500|400|600|1500)', 'russell (1000|2000|3000|midcap)', 'nasdaq[- ]100', '\bdow jones (industrial|u\.?s\.? )', '\bmsci (eafe|acwi|world|emerging|all)', '\binternational\b', '\bdeveloped (markets?|ex)', '\bemerging markets?\b', '\b(large|mid|small|micro|all)[- ]?cap\b', '\bcore\b', '\bbroad\b', 'equal[- ]weight', '\bvalue\b', '\bgrowth\b', '\bmomentum\b', '\bquality\b', '(low|min(imum)?)[- ]?volatility', '\bdividend', '\bbuyback', 'multi-?factor', 'profitab', '\bfundamental\b', '\bdefensive\b', '\bhigh beta\b', '\bmoat\b', 'aristocrat', 'cash cows', 'free cash flow', '\bactive(ly)?\b', '\bconcentrated\b', 'focused (equity|growth|value)', 'opportunit', 'best ideas', 'capital appreciation', '\bstyle\b', '\bworld\b', '\bglobal (equity|stock)', '\bu\.?s\.? (equity|stock|large|small|mid)']

# Phrase groups: `name` is the group (a theme, a sector or an exclusion kind); the first group with
# a matching phrase names etf_theme.
[[etf_category.exclusions]]
name = "bond"
phrases = ['\bbonds?\b', 'treasur', 'fixed income', '\bmuni', '\bcredit\b', 'high yield', 'floating rate', '\bduration\b', 'mortgage', '\bt-bill', '\btips\b', 'corporate debt', 'aggregate', 'investment grade', 'senior loan', '\bloans?\b', 'money market', 'ultra[- ]short income', 'preferred (stock|securities|income)', 'convertible']
[[etf_category.exclusions]]
name = "commodity_fx"
phrases = ['\b(gold|silver|platinum|palladium|copper|oil|crude|natural gas|gasoline|wheat|corn|soybean|sugar|coffee|cocoa|cotton)\s+(trust|fund|shares|bullion|futures|index fund|etf)\b', 'bullion', 'commodit', 'currency', '\bdollar\b', '\b(euro|yen|yuan|pound|franc)\b(?!.*equit)', 'bitcoin(?!.*(miners?|mining|strategy|industry))', '\bether\b', '\bethereum\b', '\bsolana\b', '\bxrp\b', '\bvix\b', 'volatility futures', 'carbon credit']
[[etf_category.exclusions]]
name = "option_income"
phrases = ['covered call', '\bbuffer', 'defined outcome', 'premium income', 'buy-?write', 'put ?write', '\bcollar\b', 'hedged equity', 'option income', '\byieldmax\b', 'autocall', 'income strategy', '\bfloor\b', 'barrier', '\bstructured\b', 'enhanced income']
[[etf_category.exclusions]]
name = "allocation"
phrases = ['target (date|risk|retirement)', '\b20[2-7]\d\b', '\bbalanced\b', 'allocation', 'multi-?asset', 'risk parity', 'managed futures', '\btrend\b', 'long[/ -]short', 'market neutral', 'merger arb', 'tactical', 'fund of funds', 'hedge fund', 'global macro', '\bmacro\b']

# Theme groups: a story that ties several industries (the paper's "thematic"). The first group
# with a matching phrase names etf_theme. Order: specific groups before general ones.
[[etf_category.themes]]
name = "clean_energy"
phrases = ['clean ?(energy|tech)', 'solar', '\bwind\b', 'lithium', 'batter', 'uranium', 'nuclear', 'hydrogen', 'fuel cell', 'renewable', 'climate', 'decarbon', 'net zero', 'energy transition', '\bwater\b', '\bgrid\b', 'smart (grid|energy)', 'electrification', 'low carbon', 'carbon (transition|reduction)']
[[etf_category.themes]]
name = "natural_resources"
phrases = ['critical minerals?', 'rare earth', 'copper', '(gold|silver|metals?|uranium|copper|lithium|steel|coal) (miners?|mining|producers?)', '\bminers?\b', '\bmining\b', '\bmidstream\b', '\bmlp\b', '\bshipping\b', '\btankers?\b', 'agribusiness', 'timber', 'natural resources', 'global x (silver|gold|copper|uranium)', 'junior (gold|silver)']
