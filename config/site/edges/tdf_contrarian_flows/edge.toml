# Edge document (ADR 0053, ADR 0075; the quality bar: docs/edges-plan.md), typed in
# src/algotrade/config/edges/document.py. Blocked 2026-10-18 (EB H14, batch X). Idea page:
# docs/edge-ideas/frontier.md (tdf_contrarian_flows).
id = "tdf_contrarian_flows"
name = "Target-date fund contrarian flows"
thesis = "After a month of large market moves, stocks held heavily by target-date funds reverse, because the funds rebalance back to fixed glide-path weights."
mechanism = """Target-date funds hold trillions of dollars at fixed equity weights and rebalance mechanically,
selling after a rise and buying after a fall; the stocks they own in volume absorb the flow and show
stronger reversal after large market months (Parker, Schoar and Sun 2023)."""
persistence = """Default retirement plans (auto-enrolment) keep the funds growing and their glide paths are
fixed by rule; the paper is recent with no independent replication on file, so persistence is a claim to
test."""
family = "I"
schedule = "month_end"
top_k = "all"
status = "blocked"
mechanism_kind = "forced_flows"
rejection_reason = """Three things are missing. (1) The signal: the paper's flow is each fund's rebalance, which needs target-date
ownership per stock or per fund, and none is stored; target-date funds are mutual funds, not ETFs, so no share-count
or flow figure of theirs reaches etf_flows@v1, which covers iShares funds only. (2) A stand-in cannot be disclosed
honestly: index weight (the page's proxy) is the same for every holder of the index, so a screen on it is the
size effect, not the target-date flow. (3) The trigger: the page's timing is a large market month, and ADR 0075
(decision 5) keeps this edge blocked until an on_market:large_market_month trigger exists, which is not built (the
market-trigger vocabulary has vix_spike only). The year-turn window the batch brief named is not the source's
timing (the flow follows the month's market move, 5 to 20 sessions after each month end). Unblock: a stored target-date
ownership or flow series, or a decided proxy; and the large_market_month trigger with its field in
market_triggers@v1."""
notes = """Idea page: docs/edge-ideas/frontier.md (tdf_contrarian_flows). The index-level form (a contrarian position
in SPY after a month of plus or minus 5 percent) is a different, time-series claim and would be its own document on
the trigger above."""

[universe.where]
all = [
  { field = "instrument.security_type", op = "eq", value = "COMMON_STOCK" },
  { field = "instrument.status", op = "eq", value = "ACTIVE" },
]

[outcome]
kind = "excess_return"
horizon_sessions = [5, 20]
benchmark = "SPY"
start_offset_sessions = 1

[[sources]]
title = "Parker, J., Schoar, A. and Sun, Y., Retail Financial Innovation and Stock Market Dynamics: The Case of Target Date Funds, Journal of Finance, 2023"
