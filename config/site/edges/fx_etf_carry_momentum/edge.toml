# Edge document (ADR 0053, ADR 0074; the quality bar: docs/edges-plan.md), typed in
# src/algotrade/config/edges/document.py. Idea page: docs/edge-ideas/structural-niches.md (fx_etf_carry_momentum).
# An allocation edge (EB E5): a weighted book of ETFs against a blended benchmark of its own list.
id = "fx_etf_carry_momentum"
name = "Currency ETF momentum"
family = "H"
thesis = "Currency ETFs that rose most over the past year keep rising, so holding the three strongest beats an equal mix of the five major currencies."
mechanism = """Currency momentum comes from slow-moving capital flows and central-bank reaction functions rather
than profit maximisation (Menkhoff, Sarno, Schmeling and Schrimpf 2012)."""
persistence = """The effect has been weak since 2010 in G10 (near-zero rate dispersion) and the funds cost 0.4
percent a year and track poorly; persistence is a claim to test."""
schedule = "month_end"
top_k = 3
screeners = [
  "trend_positive_6m", "trend_positive_12m",
]
base = "benchmark"
oos_class = "trend"
status = "candidate"
frozen_from = 2026-04-01
notes = """VERDICTS ARE UNMEASURED until the screens are run and evaluated. LIMITS: this is the MOMENTUM leg
only. The carry leg of the source (sort on the forward discount) needs foreign short-rate series
that are not stored: not built, and the document does not claim carry. The universe is the five
major-currency funds and UUP, the dollar, so a falling foreign mix can be held as the dollar; the
benchmark is an equal mix of the five foreign funds. The top three by raw return where above 0 are
held at a third each, an unfilled slot is cash at the bill yield. The funds hold deposits, whose
interest is in the fund's price only as a drag for the dollar fund; no distributions in the stored
return; cost_bps 10 a round trip assumed. The ensemble of 6 and 12 months is ONE trial. verdict.toml
[oos_haircut] trend = 0.45 prints the in-sample Sharpe ratio, what it becomes after the haircut and
the out-of-sample one beside the result, as display only."""

[ensemble]
variants = ["trend_positive_6m", "trend_positive_12m"]

[universe.where]
all = [
  { field = "instrument.symbol", op = "in", value = ["FXE", "FXY", "FXB", "FXA", "FXC", "UUP"] },
]

[outcome]
kind = "portfolio_return"
horizon_sessions = [21]
benchmark = "mix:FXE=0.2,FXY=0.2,FXB=0.2,FXA=0.2,FXC=0.2"
start_offset_sessions = 1
cost_bps = 10
weighting = "equal"

[quality_bar]
outcome = """The three-fund book's return over the 21 sessions from the close after each month end, less an equal
mix of the five foreign-currency funds, net of cost on the weight change. Price only: the stored
forward return is close to close and carries no dividend or distribution, so the book and the
benchmark both miss their yield and cash earns the Treasury bill."""
trigger_timing = """Trailing returns are read at the month-end close D; the book is held from the next session's close S
for 21 sessions. Nothing after D enters a pick."""
replication = """Menkhoff, Sarno, Schmeling and Schrimpf (2012): sort currencies on the 1 to 12 month return, long
the top and short the bottom, monthly. Here: six ETFs, top three by 6 and 12 month raw return where
above 0, long only."""
expected_size = """Carry has worked for forty years with crashes and weakly since 2010; the momentum figures are not
verified here. An ETF wrapper's 0.4 percent cost is large against a 2 to 4 percent carry."""
capacity_costs = """Capacity is limited by FXF and FXC volume, not by the large funds; about 8 switches a year; cost_bps
10 assumed."""
failure_modes = """A dollar regime dominates all six series, and six funds leave few independent choices. Retire if the
frozen-period picks-series t is under 2."""
decoys = """Dollar beta and risk-on equity beta; the benchmark excludes the dollar fund on purpose (a held UUP
is a bet against the foreign mix)."""

[[sources]]
title = "Menkhoff, L., Sarno, L., Schmeling, M. and Schrimpf, A., Currency momentum strategies, Journal of Financial Economics, 2012"

[[sources]]
title = "Menkhoff, L., Sarno, L., Schmeling, M. and Schrimpf, A., Carry trades and global foreign exchange volatility, Journal of Finance, 2012"
