# Edge document (ADR 0053; the quality bar: docs/edges-plan.md), typed in
# src/algotrade/config/edges/document.py. Idea page: docs/edge-ideas/calendar-flows.md
# (short_squeeze_days_to_cover). Screener: short_squeeze_dtc (EB E6; short_interest@v1).
id = "short_squeeze_days_to_cover"
name = "Crowded shorts by days to cover"
family = "D"
thesis = "Stocks with a large short position relative to their volume underperform the market over the next month, an avoid list for long-only buyers, with the squeeze as its tail risk."
mechanism = """Short sellers are informed but constrained by borrow cost and recall risk, and a high
days to cover means a crowded position that takes many sessions to unwind (Hong, Li, Ni,
Scheinkman and Yan 2015; Boehmer, Huszar and Jordan 2010)."""
persistence = """Borrow and recall constraints are structural, and the short side is where
arbitrageurs refuse to go because a squeeze is unbounded (the 2021 meme squeezes); but the
reported premium has weakened since publication in aggregate studies (not verified), so
persistence is a claim to test."""
schedule = "month_end"
top_k = 30
base = "universe"
screeners = ["short_squeeze_dtc"]
baselines = ["momentum_12_1", "size_small"]
status = "candidate"
frozen_from = 2026-04-01
notes = """The outcome is the SHORT on the 30 names with the highest days to cover among the
eligible names, common stocks above 5 dollars trading 5M dollars a day (side = short, net of the site's borrow assumption): the source's low-minus-high
sort read as an avoid list; the harness does not pay a borrow fee a real short may face for
crowded names, which can be far above the default, and an individual cannot usually short them.
Rule screen only, no learned scorer: the FINRA terms bar machine learning over the data (the
table is no_ml), and the screener asks 5 percent of the shares outstanding short and 3 days of
volume to cover. The figures are FINRA's: short interest at a settlement date, public about ten
days later. known_from is the session after the 7th business day after the settlement date (the
publication schedule), never the settlement date, so each month-end decision reads the latest
report public by then (the one settled mid-month, or the earlier month-end one); the figure is
about two weeks to six weeks old when read. FINRA revises a report; the store keeps the first-seen
value, which is the point-in-time one. Short interest is read as a share of the shares outstanding
of all classes, not the float. The published 1.2 percent a month of Hong et al. is a low-minus-high
spread and is from memory in the idea page, so no [published] figure. The history is FINRA's from
2017-12-29 (the API's first partition) and outcomes need the D0 Tiingo backfill (due 2026-11-09):
verdicts are UNMEASURED until then. Month-end start sessions spaced at least 20 sessions apart."""

[universe.where]
all = [
  { field = "instrument.security_type", op = "eq", value = "COMMON_STOCK" },
  { field = "instrument.status", op = "eq", value = "ACTIVE" },
  { field = "rollup.price_stats@v2.close", op = "gt", value = 5 },
  { field = "rollup.price_stats@v2.adv_usd_20d", op = "gte", value = 5_000_000 },
]

[outcome]
kind = "excess_return"
horizon_sessions = [20]
benchmark = "SPY"
start_offset_sessions = 1
cost_bps = 10
side = "short"

[quality_bar]
outcome = """The short's value: minus the excess return over SPY for the 20 sessions after the entry
close (the session after a month-end decision), less 10 bps a round trip and the assumed borrow
cost."""
trigger_timing = """The latest short-interest report public by the decision session D (a month end) is
read: a report counts from known_from, the session after the 7th business day after its settlement
date, never from the settlement date; the entry session is S = D + 1 (start_offset_sessions = 1).
The figure describes the settlement date, which is about two weeks before it became public."""
replication = """The source's rule: sort on days to cover, long low and short high (Hong et al. 2015); here
the 30 highest of the eligible stocks with at least 5 percent of the shares short and 3 days
to cover, as the short. The long leg (low days to cover) is not filed."""
expected_size = """About 1.2 percent a month for the low-minus-high spread, 1988-2012 (Hong et al. 2015;
the idea page marks the figure as from memory, not verified); post-publication weakening is not
verified. The short side here is half the spread at most, and costly to hold."""
capacity_costs = """An individual cannot usually short the names with the heaviest short interest: borrow is
costly or unavailable, and a recall or a squeeze is unbounded. The edge is an avoid list for long-only
buyers more than a trade; the outcome deducts 10 bps a round trip and the assumed borrow."""
failure_modes = """A squeeze (the 2021 meme names) loses a short several times over in a month; the
borrow fee is understated for crowded names; the figure is weeks old. Retire if the frozen-period
short value is not above zero after borrow, or the high days-to-cover names do not do worse than the
buy-and-hold mean of the eligible names."""
decoys = """Lottery and high-volatility stocks, retail attention and momentum (heavily shorted names are
often past losers): the size and 12-1 momentum baselines on the same sessions."""

[[sources]]
title = "Hong, H., Li, W., Ni, S., Scheinkman, J. and Yan, P., Days to Cover and Stock Returns, NBER working paper 21166, 2015"
url = "https://www.nber.org/papers/w21166"

[[sources]]
title = "Boehmer, E., Huszar, Z. and Jordan, B., The good news in short interest, Journal of Financial Economics, 2010"

[[sources]]
title = "Rapach, D., Ringgenberg, M. and Zhou, G., Short interest and aggregate stock returns, Journal of Financial Economics, 2016"
