# Edge document (ADR 0053; the quality bar: docs/edges-plan.md), typed in
# src/algotrade/config/edges/document.py. Screener: target_upside_high (new, EB E3b; analyst_targets@v1,
# personal licence). Idea page: docs/edge-ideas/events.md (target_price_implied_return). Same pattern as
# etf_flow_pressure: the history starts after frozen_from, so the verdict accrues over months.
id = "target_price_implied_return"
name = "Analyst target-price implied return"
family = "B"
thesis = "Stocks whose analysts' average price target sits furthest above the price outperform the market over the next one to three months."
mechanism = """Target prices carry analysts' valuation work, and investors focus on the rating label rather than the
target; the implied return is a target over the price less 1, and netting it within the industry removes the
sector's optimism bias (Da and Schaumburg 2011; Brav and Lehavy 2003)."""
persistence = """The raw implied return is dominated by optimism bias, and beaten-down names show a high one (a value and
reversal bet), so the signal needs normalising; the post-2010 evidence is thin and the decay result known is for
recommendations, not targets. Persistence is a claim to test."""
schedule = "month_end"
top_k = 10
base = "universe"
screeners = ["target_upside_high"]
baselines = ["momentum_12_1", "size_small"]
status = "candidate"
mechanism_kind = "slow_to_update"
frozen_from = 2026-04-01
notes = """No exploration period exists: our own nightly snapshots of the analyst consensus targets (analyst_targets, EB D2) start on
2026-10-19 at the earliest, after frozen_from, and a target carries no date of its own, so the first measurable month end is
the one after that day. Every measurable session is frozen-period data and the verdict accrues over months: the bar's 40 independent
months is about three and a half years away and the harness reports the count beside every number. Licence: the targets are a
personal-licence feed (ADRs 0068 and 0069), so this edge's rows are for the owner's own use. The universe holds only names with a
target (feature.target_upside present; the free vendor key covers few names), so every base name is scored (the roadmap's measurement of 2026-10-16: the free vendor key covers 15 of 104 scope names; a covered base of about 20 would make 20 picks the whole base and the lift about 0, so top_k is 10; nothing in the harness enforces it, but the lift is expected to be reliable only with a base of at least 2 x top_k, 20 names) and the variants are ranked;
the base is the covered names. Proxies, each stated: the source demeans the implied return within the industry, here the RAW
upside (no industry demeaning: the optimism bias of a sector enters the ranking, and an industry-relative version is a follow-up
once a sector map is joined to the score); one snapshot's consensus target, not a revision (Brav and Lehavy's target
changes need the history, a follow-up); a target is the vendor's current figure the day it was asked, so a stale target of a
covered name is not distinguished beyond targets_status. The outcome is the long on the 10 highest upside; the variant
lowest_upside_short is the short on the 10 lowest among liquid names (owner decision O2, 2026-10-17), net of cost and the
assumed borrow; long_short is diagnostic only. A session before the data exists has an empty eligible set and is recorded as no_picks, not as measured. Month-end start sessions at least 20 sessions apart."""

[universe.where]
all = [
  { field = "instrument.security_type", op = "eq", value = "COMMON_STOCK" },
  { field = "instrument.status", op = "eq", value = "ACTIVE" },
  { field = "rollup.price_stats@v2.close", op = "gt", value = 5 },
  { field = "rollup.price_stats@v2.adv_usd_20d", op = "gte", value = 5_000_000 },
  { field = "feature.target_upside", op = "gte", value = -1 },
]

[outcome]
kind = "excess_return"
horizon_sessions = [20, 60]
benchmark = "SPY"
start_offset_sessions = 1
cost_bps = 10

[[variants]]
id = "lowest_upside_short"
[variants.outcome]
side = "short"

[[variants]]
id = "long_short"
[variants.outcome]
side = "long_short"

[quality_bar]
outcome = """Excess return over SPY over 20 and 60 sessions after the entry close (the session after a month-end decision),
net of 10 bps a round trip: a long hold of the 10 covered stocks whose average analyst target sits furthest above the close."""
trigger_timing = """A target is read from our own snapshot as the session sees it (counting from the session that stored it, never from the
vendor's date, which a target does not have); the upside is read at D (a month end) against D's close, and the entry session
is S = D + 1 (start_offset_sessions = 1)."""
replication = """Da and Schaumburg: the consensus target over the price less 1, demeaned within the industry, quintile sorts rebalanced
monthly, long the top and short the bottom. Here: the raw upside (no industry demeaning), the 10 highest among the covered liquid
stocks, held 20 and 60 sessions. The paper's spread (about 1 to 2 percent a month) is from memory in the idea page, so nothing is
filed under [published]."""
expected_size = """About 1 to 2 percent a month for the quintile spread (Da and Schaumburg 2011, from memory, not verified); no post-2010
replication is on file, and the raw version without the industry adjustment is expected to be weaker. With history from
2026-10-19 no measurement exists yet."""
capacity_costs = """Covered stocks above $5M a day, long only, capacity of tens of thousands of dollars a name; monthly turnover is moderate.
The 10 bps round trip is the assumption; the short variant pays the site's assumed borrow."""
failure_modes = """The highest upside is mostly beaten-down names (a value and long-term reversal bet), a sector with chronic optimism
dominates the list, and a stale target is the vendor's old figure. Retire if the frozen-period excess return of the picks is not
above the base rate of every covered name."""
decoys = """Long-term reversal and value (beaten-down names have high upside), 12-1 momentum (the opposite sign: losers have the high
upside), size, and the optimism of a sector: the size and momentum baselines on the same sessions."""

[[sources]]
title = "Da, Z. and Schaumburg, E., Relative Valuation and Analyst Target Price Forecasts, Journal of Financial Markets, 2011"

[[sources]]
title = "Brav, A. and Lehavy, R., An Empirical Analysis of Analysts' Target Prices: Short-term Informativeness and Long-term Dynamics, Journal of Finance, 2003"
