# Edge document (ADR 0053; the quality bar: docs/edges-plan.md), typed in
# src/algotrade/config/edges/document.py. The screener comes with ED4b.
id = "small_cap_earnings_drift"
name = "Small-cap post-earnings drift"
thesis = "Small Nasdaq-listed stocks keep drifting for weeks in the direction of their earnings-day reaction."
mechanism = """Investors underreact to earnings news, most in small names that few analysts cover
and where arbitrage is expensive (Bernard and Thomas 1989; Chordia et al. 2009)."""
persistence = """Limits to arbitrage: the drift survives where spreads, short-sale costs and low
capacity keep institutions out; it has faded in large caps but not in the smallest names
(Martineau 2022)."""
schedule = "on_event:earnings"
top_k = "all"
screeners = []
status = "candidate"
notes = """Surprise = the reaction-session excess return over SPY (Brandt et al. 2008), from
events/earnings read by known_from. The $2B cap is the owner's open decision (ADR 0053); the
harness reports by cap bucket either way."""

[universe.where]
all = [
  { field = "instrument.security_type", op = "eq", value = "COMMON_STOCK" },
  { field = "instrument.exchange", op = "eq", value = "NASDAQ" },
  { field = "instrument.status", op = "eq", value = "ACTIVE" },
  { field = "feature.market_cap", op = "lt", value = 2_000_000_000 },
]

[outcome]
kind = "excess_return"
horizon_sessions = [20, 60]
benchmark = "SPY"
cost_bps = 20

[quality_bar]
outcome = """Excess return over SPY over 20 and 60 sessions after the reaction session, net of
20 bps a round trip (the PRD's proposal, ADR 0053 open decisions): drift is held for weeks."""
trigger_timing = """A report is known from its events/earnings known_from session; the reaction
session is the first one after the release (an after-close report reacts the next day); we act
on the session after the reaction, so S is the reaction session (the class's anchor) and the
window starts at its close, after the return the surprise is measured on."""
replication = """The source's rule first: rank by the announcement-period return (Brandt,
Kishore, Santa-Clara and Venkatachalam 2008) and hold the top bucket; the screener is ED4b."""
expected_size = """The drift is largest in the smallest names and has decayed in large caps since
the 1990s (Martineau 2022). Bars start 2024-10-03 (2018 for the event scope names, ADR 0050):
about eight reports per name, thousands of events, but clustered in about eight reporting
seasons, so independent sessions are the binding count."""
capacity_costs = """Small caps trade with wide spreads and thin volume: the outcome deducts 20 bps
(an assumption) and the harness reports by cap bucket; an individual can trade the liquid end."""
failure_modes = """Fat tails (takeovers, dilution, delisting) and a wrong report time that puts
the reaction on the wrong session. Retire if the frozen-period excess return of the top bucket is
not above the base rate of every eligible name after costs."""
decoys = """Short-term momentum (a big move continues for any reason) and the small-cap
illiquidity premium: the 12-1 momentum and size baselines on the same sessions."""

[[sources]]
title = "Bernard, V. and Thomas, J., Post-Earnings-Announcement Drift: Delayed Price Response or Risk Premium?, Journal of Accounting Research, 1989"

[[sources]]
title = "Brandt, M., Kishore, R., Santa-Clara, P. and Venkatachalam, M., Earnings Announcements are Full of Surprises, working paper, 2008"

[[sources]]
title = "Chordia, T., Goyal, A., Sadka, G., Sadka, R. and Shivakumar, L., Liquidity and the Post-Earnings-Announcement Drift, Financial Analysts Journal, 2009"

[[sources]]
title = "Martineau, C., Rest in Peace Post-Earnings Announcement Drift, Critical Finance Review, 2022"
