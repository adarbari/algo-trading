# Edge document (ADR 0053, ADR 0074; the quality bar: docs/edges-plan.md), typed in
# src/algotrade/config/edges/document.py. Idea page: docs/edge-ideas/cross-sectional.md (factor_momentum).
# An allocation edge (EB E5): a weighted book of ETFs against a blended benchmark of its own list.
id = "factor_momentum"
name = "Factor ETF momentum"
family = "A"
thesis = "Factors that did well over the past year keep doing well next month, so holding the two best-trending factor funds beats an equal mix of all five."
mechanism = """Factor premia are time-varying and persistent (mispricing that corrects slowly, flows into factor
products); stock momentum is largely the sum of this factor autocorrelation (Ehsani and Linnainmaa
2022)."""
persistence = """Factor timing is rarely done and the effect sits at a one to twelve month horizon that benchmark-
relative managers cannot use; 2023's abrupt flip hurt it, so persistence is a claim to test."""
schedule = "month_end"
top_k = 2
screeners = [
  "trend_positive_6m", "trend_positive_12m",
]
base = "benchmark"
oos_class = "trend"
status = "candidate"
mechanism_kind = "cross_market_trends"
frozen_from = 2026-04-01
notes = """VERDICTS ARE UNMEASURED until the screens are run and evaluated. PROXY: the source builds long-short
factor return series for about 20 factors and goes long a factor whose past year is up. This edge
uses five long-only ETFs as stand-ins (MTUM momentum, QUAL quality, VLUE value, USMV minimum
volatility, IWM size), each the factor's tilt plus the market, so the market is in every leg and the
factor momentum is mixed with plain trend; the series with a market-neutral factor return is a data-
construction follow-up. The funds start in 2013, so earlier sessions are not measured (a missing
benchmark constituent leaves the session out with its reason). The book holds the top two by raw
return where above 0 at half each, an unfilled slot cash at the bill yield, against an equal-weight
five; no distributions; cost_bps 10 a round trip assumed. The ensemble of 6 and 12 months is ONE
trial. The decoy is the page's: momentum applied to ETFs. verdict.toml [oos_haircut] trend = 0.45
prints the in-sample Sharpe ratio, what it becomes after the haircut and the out-of-sample one
beside the result, as display only."""

[ensemble]
variants = ["trend_positive_6m", "trend_positive_12m"]

[universe.where]
all = [
  { field = "instrument.symbol", op = "in", value = ["MTUM", "QUAL", "VLUE", "USMV", "IWM"] },
]

[outcome]
kind = "portfolio_return"
horizon_sessions = [21]
benchmark = "mix:MTUM=0.2,QUAL=0.2,VLUE=0.2,USMV=0.2,IWM=0.2"
start_offset_sessions = 1
cost_bps = 10
weighting = "equal"

[quality_bar]
outcome = """The two-fund book's return over the 21 sessions from the close after each month end, less an equal
mix of the five funds, net of cost on the weight change; an unfilled slot is cash. Price only: the
stored forward return is close to close and carries no dividend or distribution, so the book and the
benchmark both miss their yield and cash earns the Treasury bill."""
trigger_timing = """Trailing returns are read at the month-end close D; the book is held from the next session's close S
for 21 sessions. Nothing after D enters a pick."""
replication = """Ehsani and Linnainmaa (2022): each month, go long a factor whose past 12-month return is above 0,
else short, about 20 factors. Gupta and Kelly (2019) scale by the past 1 or 12 month return. Here:
five long-only factor ETFs, top two with positive returns."""
expected_size = """Ehsani and Linnainmaa: a factor earns 6 basis points a month after a losing year and 51 after a
winning one (1963 to 2019); Gupta and Kelly report time-series factor momentum Sharpe near 0.8 to
1.0 (approximate). A long-only five-fund book keeps a fraction."""
capacity_costs = """High capacity in five liquid funds; about 8 switches a year; cost_bps 10 assumed; fund fees differ
and are inside the price."""
failure_modes = """A short life of the funds (from 2013) gives about 150 months at most and few independent factor
flips. Retire if the frozen-period picks-series t is under 2."""
decoys = """Sector and stock momentum applied to ETFs and the market beta inside every factor fund; the equal
five-fund benchmark removes the market, not the factors' trends."""

[[sources]]
title = "Ehsani, S. and Linnainmaa, J., Factor Momentum and the Momentum Factor, Journal of Finance, 2022"
url = "https://www.nber.org/papers/w25551"

[[sources]]
title = "Gupta, T. and Kelly, B., Factor Momentum Everywhere, Journal of Portfolio Management, 2019"

[[sources]]
title = "Gupta, T. and Kelly, B. (2019), Factor Momentum Everywhere, Journal of Portfolio Management (AQR page)"
url = "https://www.aqr.com/Insights/Research/Working-Paper/Factor-Momentum-Everywhere"

[[sources]]
title = "Asness, C., Frazzini, A., Israel, R. and Moskowitz, T. (2014), Fact, Fiction and Momentum Investing, Journal of Portfolio Management (AQR page)"
url = "https://www.aqr.com/Insights/Research/Journal-Article/Fact-Fiction-and-Momentum-Investing"

[[sources]]
title = "Moskowitz, T. and Grinblatt, M. (1999), Do Industries Explain Momentum?, Journal of Finance"
url = "https://ideas.repec.org/a/bla/jfinan/v54y1999i4p1249-1290.html"
