# Edge document (ADR 0053, ADR 0075; the quality bar: docs/edges-plan.md), typed in
# src/algotrade/config/edges/document.py. Screener: ipo_lockup_ahead (unblocked by #716, which
# added ipo_lockup to ANNOUNCED_AHEAD). Idea pages: docs/edge-ideas/events.md (ipo_lockup_expiry) and structural-niches.md
# (ipo_lockup_expiry_pressure).
id = "ipo_lockup_expiry"
name = "IPO lock-up expiry (avoid list)"
thesis = "Stocks fall into and on the expiry of their IPO lock-up as insiders and venture funds become free to sell, so they belong on an avoid list until after it."
mechanism = """The expiry is a known, dated supply shock: venture funds must distribute, and the market under-reacts
because the date is in the prospectus but no one is paid to sell ahead; shorting a fresh IPO is dear and
the borrow scarce, so the price cannot adjust fully before the date (Field and Hanka 2001)."""
persistence = """The dates are public and the effect is small per event (about -1% to -3% on the page, from
memory and not verified), so after the borrow of a fresh issue the short is marginal and the avoidance is
free; buyout-backed issuers show the opposite sign in one thesis. Persistence after 2010 is a claim to
test."""
family = "B"
schedule = "on_event:ipo_lockup"
top_k = 20
base = "universe"
screeners = ["ipo_lockup_ahead"]
baselines = ["size_small"]
status = "candidate"
mechanism_kind = "forced_flows"
frozen_from = 2026-04-01
notes = """Short side on liquid names only (owner decisions O1 and O2, 2026-10-17): a short result on a liquid
name may be a verdict basis; the outcome is minus the excess return over SPY less cost and an assumed borrow
of 2000 bps a year (borrow_bps_annual, a LOWER BOUND: a fresh issue is often hard or impossible to borrow, and no
borrow data is stored). The idea's own form is an avoid list (do not buy a new issue into its expiry); the harness
tests it as the short side, the same claim stated so that a negative drift is a pass. The event is the
lock-up expiry read from ipo_lockups@v1 (ADR 0075): the class is announced ahead, so the entry session S is 10
sessions before the expiry (start_offset_sessions = -10) and the decision session D is 11 sessions before it
(sessions_to_lockup_expiry = 11 at D); the group is read at D with only prospectuses known by D, and the CIK is
mapped to an instrument as of D, so nothing after D enters. Horizons 10 (to the expiry) and 12 (two sessions
past it, the page's -10 to +2 window): two trials, one screener. Every eligible name is the base and the picks
are the lock-ups of the window (base universe, picks event), so the lift reads the picks against all liquid
stocks. The score is the dollar volume, which every eligible name has, so the harness's score coverage is full and
no universe gate on a sparse score is needed (a test pins the rank direction). The event count is the limit:
the lock-up dates come from prospectus text extracted by the text-model seam, so coverage is partial, liquid
IPOs are few, and the independent count is small; early_release and standard terms (on_event:ipo_lockup:<terms>)
are not split here. Venture-backed issuers, where the effect sits, are not flagged in the store, and the long
re-entry after the expiry (the page rates it weak) is not filed. The frozen period starts 2026-04-01, so only
an expiry from then on fills a frozen slice. No [published] figure: the page's numbers are from memory and not
verified."""

[universe.where]
all = [
  { field = "instrument.security_type", op = "eq", value = "COMMON_STOCK" },
  { field = "instrument.status", op = "eq", value = "ACTIVE" },
  { field = "rollup.price_stats@v2.adv_usd_20d", op = "gte", value = 5_000_000 },
]

[outcome]
kind = "excess_return"
horizon_sessions = [10, 12]
benchmark = "SPY"
start_offset_sessions = -10
side = "short"
borrow_bps_annual = 2000
cost_bps = 20

[quality_bar]
outcome = """Minus the excess return over SPY over 10 and 12 sessions after the entry close (10 sessions before the
lock-up expiry), net of 20 bps a round trip and an assumed borrow of 2000 bps a year."""
trigger_timing = """The expiry date is stated in the prospectus and is known ahead (the class is announced ahead,
ADR 0075). The entry session S is the expiry session minus 10 (start_offset_sessions = -10) and the decision
session D is S - 1, 11 sessions before the expiry. The names are read at D from ipo_lockups@v1
(sessions_to_lockup_expiry = 11), built from prospectuses known by D, with the CIK mapped to an instrument through
the company snapshot as of D."""
replication = """The source's rule first: the abnormal return around the expiry, larger for venture-backed issuers
(Field and Hanka 2001). Here ipo_lockup_ahead v1 takes the liquid common stocks whose lock-up expires within 11
sessions and the harness shorts the 20 most liquid for 10 and 12 sessions."""
expected_size = """Field and Hanka (2001): about -1.5 percent over the 3 days around the expiry, about -3 percent for
venture-backed issuers, with volume up about 40 percent; the page marks the figures as from memory and not verified,
so no published figure is set. Liquid lock-ups are few; independent expiries are the binding count."""
capacity_costs = """A fresh issue is shorted at a dear or impossible borrow; the outcome deducts 20 bps and an assumed
2000 bps a year, a LOWER BOUND on the borrow. The usable form for an individual is the avoid list: do not buy a new
issue into its expiry, which costs nothing."""
failure_modes = """The expiry is priced in because the date is public; buyout-backed issuers show the opposite sign;
an early-release term moves the real date before the stated one. Retire if the frozen-period short return of the
picks is not above the base rate of every eligible name."""
decoys = """IPO long-run underperformance (the slow decline of a new issue, not the expiry), momentum and size: the
size baseline."""

[[sources]]
title = "Field, L. and Hanka, G., The Expiration of IPO Share Lockups, Journal of Finance, 2001"

[[sources]]
title = "Aalto University thesis (2003-2022 lock-up expiries: negative abnormal returns and higher volume, buyout-backed issuers positive)"
url = "https://aaltodoc.aalto.fi/items/05aae052-991d-4947-8363-6b2a5df9fb89"

[[sources]]
title = "Erasmus University thesis (1990-2022 lock-up expiries: a negative cumulative abnormal return only for venture-backed issuers)"
url = "https://thesis.eur.nl/pub/67687/572140.pdf"
