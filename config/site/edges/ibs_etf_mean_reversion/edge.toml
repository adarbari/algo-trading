# Edge document (ADR 0053, ADR 0074; the quality bar: docs/edges-plan.md), typed in
# src/algotrade/config/edges/document.py. Idea page: docs/edge-ideas/statarb-technical.md (ibs_etf_mean_reversion).
# An allocation edge (EB E5): a weighted book of ETFs against a blended benchmark of its own list.
id = "ibs_etf_mean_reversion"
name = "Index ETF weak-close reversal"
family = "G"
thesis = "An index ETF that closes near the low of its day rises the day after next on average, so a book holding it only after such a close earns more on the days it is invested."
mechanism = """End-of-day order imbalance (market-on-close flow, hedging, futures-cash arbitrage) overshoots into
the close and reverses overnight; it is index level, so there is no stock-specific information to
lose (Pagonidis 2013)."""
persistence = """The effect is a few basis points a trade held one day, which rules out capacity-seeking funds, and
it is partly the overnight premium in disguise; it faded after about 2011, so persistence is a claim
to test."""
schedule = "every_session"
top_k = 2
screeners = ["etf_low_ibs"]
base = "benchmark"
status = "candidate"
mechanism_kind = "liquidity_provision"
asset_class = "etfs"
frozen_from = 2026-04-01
notes = """DOCUMENTED-LIMIT VARIANT: the source day is not measurable (see trigger_timing). VERDICTS ARE UNMEASURED until the screen is run over the stored history and evaluated; the stored
daily bars give internal bar strength as rollup.trend_stats@v2.close_range_pos, so no new feature is
built. LIMITS: (1) the source's list is about twenty index ETFs; two (SPY, QQQ) are used so the
equal-weight benchmark is exact (IWM and the sector funds are left out). (2) The benchmark is the
two funds held always, so a book that holds them about a fifth of the sessions and cash otherwise
trails by the drift of the market it skips: the value is a TIMING comparison, and a negative mean is
expected from the cash days alone. The harness has no cash benchmark; the right test is the mean per
invested session against the same days of the benchmark, which the weights recorded in the run allow
and the verdict does not read: the read of the result needs that care (flagged for review). (3) One-
session holds, a fund held at half when only one passes, the other half cash; cost_bps 4 a round
trip assumed; the source's long-short version is not built. The idea is a timing overlay for other
edges' entries, weak alone."""

[universe.where]
all = [
  { field = "instrument.symbol", op = "in", value = ["SPY", "QQQ"] },
]

[outcome]
kind = "portfolio_return"
horizon_sessions = [1]
benchmark = "mix:SPY=0.5,QQQ=0.5"
start_offset_sessions = 1
cost_bps = 4
weighting = "equal"

[quality_bar]
outcome = """The book's return over the one session from the close after each decision session, less half SPY and
half QQQ over the same session, net of the cost on the weight change; a session with no weak close
is cash at the bill yield. Price only: the stored forward return is close to close and carries no
dividend or distribution, so the book and the benchmark both miss their yield and cash earns the
Treasury bill."""
trigger_timing = """The internal bar strength is read at the close of D from that day's own high, low and close; the
book is held from the next session's close S (start_offset_sessions = 1, the least the harness allows)
for one session. It therefore tests the SECOND-day return after a weak close, from close(D+1) to
close(D+2). The source's day, close(D) to close(D+1), is not measurable. Nothing after D enters a pick."""
replication = """Pagonidis (2013): buy at the close when the internal bar strength is under 0.2 (or the lowest
quintile) and exit at the next close (the day the harness cannot measure), over about twenty equity index ETFs since 1993; the low-IBS
days dominated total returns (from memory, not re-verified). Here: SPY and QQQ, under 0.2."""
expected_size = """Strong before 2010; practitioner follow-ups report a diminished but positive SPY and QQQ effect
through the 2010s and a weak one since 2020 (memory). A few basis points a trade."""
capacity_costs = """Unlimited capacity in two funds with near-zero spread cost; about 50 trades a year; cost_bps 4 a
round trip assumed against a few basis points of edge."""
failure_modes = """The edge is of the order of the cost and the overnight premium; it shares fate with RSI(2) and the
short-term index reversal cluster. The always-held benchmark makes the cash days negative by construction, so a rule of retiring when
the picks-series t is under 2 would fire whatever the timing does: read the invested-session figures
in the run record, not the verdict."""
decoys = """The overnight (close to open) premium and the VIX regime; the benchmark mix and the invested-session
comparison in the run record are the nulls."""

[[sources]]
title = "Pagonidis, A., The IBS Effect: Mean Reversion in Equity ETFs, SSRN, 2013"

[[sources]]
title = "Connors, L. and Alvarez, C., Short Term Trading Strategies That Work, TradingMarkets, 2009"

