# Edge document (ADR 0053, ADR 0073, ADR 0075; the quality bar: docs/edges-plan.md), typed in
# src/algotrade/config/edges/document.py. Idea page: docs/edge-ideas/trend-macro.md
# (vix_mean_reversion_entry). A time-series edge on a market trigger: no screener, SPY is the universe.
id = "vix_mean_reversion_entry"
name = "Buying SPY after a VIX spike"
family = "E"
thesis = "SPY earns more over the 63 sessions after a VIX spike with an inverted term structure than over the same number of sessions at other times."
mechanism = """A volatility spike is forced de-risking (volatility-targeting funds, dealers' gamma, margin
calls) that overshoots, and the price of insurance is then at its widest; buyers of equity risk are
paid for providing liquidity while the sellers follow rules (Johnson 2017 on the VIX term structure;
Cheng 2019 on the VIX premium). The equity-timing form is a practitioner rule, not an academic result."""
persistence = """The selling is rule-driven at exactly the moment a discretionary investor is afraid to
buy, and the distribution is bimodal (2008 and 2020 kept falling), which keeps capital away. The
practitioner tables behind the rule are not verified and their events are few and clustered, so
persistence is a claim to test."""
schedule = "on_market:vix_spike"
top_k = "all"
screeners = []
base = "out_of_window"
status = "candidate"
mechanism_kind = "liquidity_provision"
asset_class = "etfs"
frozen_from = 2026-04-01
notes = """VERDICTS ARE UNMEASURED until the D0 Tiingo outcomes backfill (due 2026-11-09) gives SPY its
outcome history. The trigger is the market_triggers@v1 spike (ADR 0075): the first session with a VIX
close of at least 30 and VIX / VIX3M above 1 after at least 21 sessions without one, both from the
macro table (FRED VIXCLS and VXVCLS, personal use only, so the edge's evidence is personal-licence).
The decision session D is the session the reading was first known (the day after its close, the series'
release lag) and the entry session S = D + 1; the fixed thresholds are the feature's, a change is a
version bump. The value of a window is SPY's raw return over the 63 sessions from S's close, compared
with SPY's own non-overlapping 63-session stretches outside every window (ADR 0073); a trigger within 63
sessions of the last counted one is skipped, so windows never overlap. The source's 21 to 63 session
range is cut to one horizon, 63, because the page says the next month is worse and months three to
twelve are better; one instrument and one horizon are one trial (deflated Sharpe ratio). Counts: the
spike is rare (the page puts independent spikes since 1990 at about 25) and the stored outcome history
reaches 2018, so a handful of windows fall in the range, far under the 40 independent sessions the bar
asks (MIN_INDEPENDENT_SESSIONS): the document cannot reach evidenced, and every figure is shown with its
count. A stretch near the range's end can change when the range is extended, because the base avoids
triggers that are known only later (ADR 0075). No cost is deducted from a timed position (ADR 0073).
Not tested: the page's hit-rate tables (not verified), a VIX-only trigger without the inversion, and any
exit rule. No [published] figure: the page's 65 to 75 percent hit rate at three months is from
practitioner tables it marks as not verified."""

[universe.where]
all = [
  { field = "instrument.symbol", op = "in", value = ["SPY"] },
]

[outcome]
kind = "excess_return"
horizon_sessions = [63]
benchmark = "none"
start_offset_sessions = 1

[quality_bar]
outcome = """SPY's raw return (benchmark none) over the 63 sessions after a VIX spike, from the entry close
(the session after the day the spike was first known), against its own return over the same number of
sessions outside every window; no cost is deducted from a timed position (ADR 0073)."""
trigger_timing = """The spike is read at the decision session D from market_triggers@v1
(sessions_since_vix_spike = 0): a VIX close of at least 30 with VIX / VIX3M above 1 after 21 quiet
sessions, known from the session after its date (the series' one-day release lag, no revisions). The
entry session S = D + 1 (start_offset_sessions = 1). A stale VIX or VIX3M reading (more than 3 sessions
old) is UNKNOWN, never 'no spike'. No fact after D places a window."""
replication = """The practitioner rule: buy SPY when VIX is above 30 and VIX / VIX3M above 1 and hold 21 to
63 sessions (the page's Cboe and SentimentTrader tables). Here the same trigger is the one in
market_triggers@v1 and SPY is held 63 sessions, compared with its own other stretches; no exit rule and
no cash leg are tested."""
expected_size = """The page quotes hit rates of 65 to 75 percent at three months for VIX above 30 entries
since 1990, not verified and over 20 to 30 clustered events, and gives no return figure, so none is set.
The range here holds a handful of independent spikes: a t statistic cannot separate a few percentage
points over 63 sessions from the market's own drift."""
capacity_costs = """Unlimited capacity in one index fund, a few round trips a decade, a cost of 1 to 2 bps a
side; long only and unlevered. Nothing is deducted in this version. The risk is the drawdown after entry:
2008 and 2020 kept falling for weeks."""
failure_modes = """The spike sits at the start of a long bear market (2008), so a fixed-horizon entry loses;
the events are too few and clustered for any t statistic; the effect is the mean reversion of equity
returns after any large drawdown. Retire if the frozen-period in-window minus out-of-window mean is not
above zero, or the Welch t over the independent windows stays under 2."""
decoys = """Mean reversion after any 10 percent drawdown, and the volatility-managed portfolios result
(Moreira and Muir 2017) that says to hold less when volatility is high: the two agree only because they
differ in horizon (next month against months three to twelve). Overlaps the vrp_short_premium edge, which
sells puts on the same spikes. Test against the 'any 63-session window' null, which the 1,000 random draws
of the harness are."""

[[sources]]
title = "Johnson, T., Risk premia and the VIX term structure, Journal of Financial and Quantitative Analysis, 2017"

[[sources]]
title = "Cheng, I.-H., The VIX premium, Review of Financial Studies, 2019"

[[sources]]
title = "Moreira, A. and Muir, T., Volatility-managed portfolios, Journal of Finance, 2017"
