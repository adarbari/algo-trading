# Edge document (ADR 0053; the quality bar: docs/edges-plan.md), typed in
# src/algotrade/config/edges/document.py. Screeners: ivol_avoid (new, EB E3b) and lottery_max
# (shared with c31_lottery_options_short). Idea page: docs/edge-ideas/cross-sectional.md
# (idiosyncratic_volatility_and_max). A filter overlay in the plan: the avoid list of speculative stocks.
id = "idiosyncratic_volatility_and_max"
name = "High idiosyncratic volatility and lottery stocks, avoid list"
family = "A"
thesis = "Stocks with the highest idiosyncratic volatility, or an extreme best day last month, underperform the market over the next month, so they are the names to drop from a long list."
mechanism = """Retail demand for lottery-like payoffs bids up volatile, skewed stocks, and short-sale
constraints with limits to arbitrage keep the overpricing in place: in these names idiosyncratic risk
is the arbitrage risk itself (Ang, Hodrick, Xing and Zhang 2006; Bali, Cakici and Whitelaw 2011;
Stambaugh, Yu and Yuan 2015)."""
persistence = """Short-sale constraints and the retail taste for lottery tickets are structural, and the
effect lived on after publication (Alpha Architect 2020), but it concentrates in microcaps and hard-to-short
names and is weak in value-weighted large caps (Hou, Xue and Zhang); the low-risk theme is
mostly a long-leg effect in the later replications. Persistence is a claim to test."""
schedule = "month_end"
top_k = 30
base = "universe"
screeners = ["ivol_avoid", "lottery_max"]
baselines = ["momentum_12_1", "size_small"]
status = "candidate"
mechanism_kind = "lottery_demand"
frozen_from = 2026-04-01
notes = """Two screeners, one trial each, both ranked with the jumpiest name LAST so the harness's
short leg (the worst scores) takes them first: ivol_avoid on rollup.factor_betas@v1.ivol_252d (the
four-factor residual volatility over 252 sessions) and lottery_max on rollup.max_return@v1.max_ret_21d
(the best one-day return of the last 21 sessions; the screener is shared with c31_lottery_options_short,
whose own question is the covered-call use). Proxies, each stated: Ang and co-authors measure idiosyncratic
volatility over the prior month against the three Fama-French factors, here the 252-session four-factor
residual (the stored measure, H6), a slower number; Bali and co-authors sort deciles, the harness
takes the 30 worst of the eligible names; the paper's stock universe includes microcaps, this universe
floors price at $5 and dollar volume at $5M a day. The outcome is the SHORT on those 30 (side = short,
owner decision O2, 2026-10-17: a liquid short may be a verdict basis), outcome minus the excess return over SPY less 10 bps
and the site's assumed borrow, which is far below the real borrow of the names the effect lives in;
the variant long_short (diagnostic only) reads the spread against the least volatile names. The
plan files this as a filter overlay: the use is dropping these names from a long list, which the
short result prices. The universe holds only names that carry both scores (ivol_252d above 0 and max_ret_21d
stored), so every base name is scored and the short leg is ranked. No [published] figure: the AHXZ
spread (about 1 percent a month) is from memory in the idea page, and the one verified MAX figure
sits on c31_lottery_options_short, where its screener is the one measured. Month-end start sessions
spaced at least 20 sessions apart."""

[universe.where]
all = [
  { field = "instrument.security_type", op = "eq", value = "COMMON_STOCK" },
  { field = "instrument.status", op = "eq", value = "ACTIVE" },
  { field = "rollup.price_stats@v2.close", op = "gt", value = 5 },
  { field = "rollup.price_stats@v2.adv_usd_20d", op = "gte", value = 5_000_000 },
  { field = "rollup.factor_betas@v1.ivol_252d", op = "gt", value = 0 },
  { field = "rollup.max_return@v1.max_ret_21d", op = "gt", value = -1 },
]

[outcome]
kind = "excess_return"
horizon_sessions = [20]
benchmark = "SPY"
start_offset_sessions = 1
side = "short"
cost_bps = 10

[[variants]]
id = "long_short"
[variants.outcome]
side = "long_short"

[quality_bar]
outcome = """Minus the excess return over SPY for the 20 sessions after the entry close (the session
after a month-end decision), less 10 bps a round trip and the assumed borrow: a short position in the
30 names with the highest idiosyncratic volatility (ivol_avoid) or the highest MAX (lottery_max)."""
trigger_timing = """ivol_252d and max_ret_21d are computed from the closes through the decision session D (a
month end, nightly rollups); the entry session is S = D + 1 (start_offset_sessions = 1) and the window
runs from S's close; the screen is read at D, the outcome at S."""
replication = """Ang, Hodrick, Xing and Zhang: the standard deviation of the prior month's three-factor residuals,
quintile sorts, one-month hold; Bali, Cakici and Whitelaw: the largest daily return of the prior month,
decile sorts, one-month hold, long low and short high. Here: the 30 highest of the eligible stocks on the
stored 252-session four-factor residual volatility, and on the stored 21-session MAX, as the short."""
expected_size = """About 1.06 percent a month for the top-minus-bottom quintile of value-weighted idiosyncratic
volatility, 1963-2000 (Ang and co-authors, approximate, from memory) and more than 1 percent a month for
low-minus-high MAX, 1962-2005 (Bali and co-authors, the paper's abstract); both concentrate in small and illiquid
names and are weak in large liquid ones, so expect much less here; the stored history
gives about a year of month-ends, under the 40 the bar asks, and the harness reports the count."""
capacity_costs = """Liquid names at the $5M a day floor trade at a few basis points; the 10 bps round trip is the
assumption and the borrow is the site's default. The effect lives where shorting is costly or impossible,
so an individual's gain is the avoid list: not owning these names, which costs nothing."""
failure_modes = """Squeezes (the 2021 meme names) and the premium living only in microcaps: the liquid short may
show nothing. The two screeners overlap heavily (a jumpy name has both), so they are one result read twice.
Retire if the frozen-period short value is not above zero after borrow, or the picks do not do worse than the
buy-and-hold mean of every eligible name."""
decoys = """Size, price level, distress, illiquidity and low beta (one small-cap cluster), short-term reversal and
12-1 momentum (lottery names are often last month's winners): the size and momentum baselines on the same
sessions, and the site's decoy battery, whose ivol_high and max_ret_high rank the same fields the other
way."""

