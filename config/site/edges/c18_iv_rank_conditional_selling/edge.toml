# Edge document (ADR 0053; the quality bar: docs/edges-plan.md), typed in
# src/algotrade/config/edges/document.py. Screener: iv_rank_high (EB E4). A conditioning variable for
# vrp_short_premium. Idea page: docs/edge-ideas/options-volatility.md (c18_iv_rank_conditional_selling).
id = "c18_iv_rank_conditional_selling"
name = "Premium selling when implied volatility is high for the name"
thesis = "Selling at-the-money straddles only on names whose implied volatility rank is at least 0.5 earns more than selling on every liquid name."
mechanism = """Implied volatility mean-reverts, so a high rank for the name's own year means it is
more likely to fall than a low one; practitioners treat "sell when IV rank is above 50" as doctrine
(tastylive)."""
persistence = """The conditional edge over unconditional selling is probably small: high rank clusters in
crashes and before earnings, when realised volatility is highest too, and no peer-reviewed study
shows that IV rank adds anything beyond implied minus realised volatility (not verified). It is
free and widely taught, which is the case against it."""
family = "C"
schedule = "every_session"
universe = "liquid_optionable_floored"
top_k = "all"
screeners = ["iv_rank_high"]
baselines = ["vrp_iv_hv", "vrp_cross_section"]
status = "candidate"
mechanism_kind = "paid_for_risk"
frozen_from = 2026-04-01
notes = """The P&L is a model, not a quote (basis model; ADR 0053 amendment 2026-10-17, EB H8). No
historical option chains are stored (owner decision O3), so the position is one at-the-money
straddle priced by Black-Scholes (r = q = 0) from the IBKR IV30 read at D, held to the horizon's
close, as a fraction of the entry close, short; it assumes constant volatility, no skew, and no spread, hedge or
margin beyond cost_bps (35 bps). The practitioner position is a 45-day 16-delta strangle managed at 50%
of the credit or 21 days; a straddle held to the horizon is a proxy for it, and the delta-hedged
variant is a second reading of the same volatility. IV30 prices 15, 21 and 31 sessions (the parser's range is 10
to 42). The real-chain P&L (H13) accrues from 2026-10-02 and will replace the model; IBKR's IV30
history (personal licence) is 502 sessions. Every picked name qualifies, so the base is every liquid
optionable name (the default for a plain schedule): the lift reads whether the rank gate beats selling
on all of them, which is the edge's whole claim. feature.iv_rank is IBKR's 252-session rank where
IBKR has one and ours otherwise (iv_rank_source says which); a new rank needs 60 sessions."""

[outcome]
kind = "option_model_pnl"
structure = "atm_straddle_short"
iv_field = "rollup.ibkr_iv@v1.iv30_ibkr"
horizon_sessions = [15, 21, 31]
benchmark = "none"
start_offset_sessions = 1
cost_bps = 35

[[variants]]
id = "delta_hedged"
[variants.outcome]
structure = "delta_hedged_atm_short"

[quality_bar]
outcome = """The model P&L of one short at-the-money straddle held 15, 21 or 31 sessions from the entry
close, as a fraction of the entry price, net of 35 bps. The mean P&L of the names with a rank of at
least 0.5 is read against the mean of every liquid optionable name: the same position without the gate."""
trigger_timing = """IV30 and its 252-session rank are stored after the close of the decision session D, so
the first fill is the next session's close: S = D + 1 (start_offset_sessions = 1). The rank and the
straddle's implied volatility are read at D, the outcome at S."""
replication = """The practitioner rule: IV rank = (IV - 1-year low) / (1-year high - 1-year low); sell a 45-day
16-delta strangle when it exceeds 50 and manage at 50% of the credit or 21 days (tastylive,
practitioner, no published return). Here iv_rank_high v1 passes the liquid optionable names with a rank
of at least 0.5 and the harness holds all of them short as straddles."""
expected_size = """No peer-reviewed figure. Practitioner backtests (tastylive, ORATS, Spintwig) report a
modest Sharpe improvement and larger drawdowns in high-rank periods, not verified here. 502 IV30
sessions give about 24 independent 21-session windows, under the 40 the bar asks: the edge waits for a
verdict."""
capacity_costs = """Single-name option spreads of 5 to 10% of premium, which the 35 bps cost approximates;
undefined risk needs margin. An individual sells a few positions, far below the open interest of names
trading $50M a day. The flat cost is a fraction of the stock price, not of the premium: it is about 5% of an
at-the-money straddle's premium only at 30% implied volatility, so it flatters high-implied-volatility
picks, whose premium and spread are larger (at 60% the same 35 bps is about 2.5% of premium)."""
failure_modes = """High rank clusters in crashes: the sale is short volatility into a spike, so the mean P&L and
the drawdown decide, not the hit rate. Retire if the frozen-period mean P&L of the gated names is
not above the mean of every liquid optionable name, or the gate does not beat vrp_iv_hv on the same
sessions."""
decoys = """High rank before earnings (a known event) and after a shock (the year's range reset by one spike):
compare with vrp_iv_hv and vrp_cross_section, the premium over realised volatility, which has the
academic evidence; the practitioner expects the premium measure to dominate the rank."""

[[sources]]
title = "tastylive research on IV rank for premium selling (practitioner, not peer reviewed)"

[[sources]]
title = "Goyal, A. and Saretto, A., Cross-section of option returns and volatility, Journal of Financial Economics, 2009"
