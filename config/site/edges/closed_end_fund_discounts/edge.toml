# Edge document (ADR 0053; the quality bar: docs/edges-plan.md), typed in
# src/algotrade/config/edges/document.py. Filed blocked 2026-10-18 (EB E4); a candidate since closed-end
# funds joined the covered universe (ADR 0013 amendment, same day). Screener: cef_discount_zscore over
# cef_nav@v1 (cef_discount_to_nav, cef_discount_zscore). Idea page:
# docs/edge-ideas/calendar-flows.md (closed_end_fund_discounts).
id = "closed_end_fund_discounts"
name = "Closed-end fund discount reversion"
thesis = "Closed-end funds trading at an unusually wide discount to their own net asset value, against their own history, outperform the market as the discount narrows."
mechanism = """Retail-held and without creation or redemption, closed-end funds trade on sentiment, not on
the value of their assets (Lee, Shleifer and Thaler 1991); activists such as Saba and Bulldog force
tender offers and open-endings that roughly halve the discount (Bradley, Brav, Goldstein and Jiang
2010)."""
persistence = """A small, retail, illiquid market that institutions avoid, with capacity of about $1M to $10M
for the strategy; part of the discount is a fair cash-flow drag (fees, leverage, payout policy), so
the discount does not close fully and is not arbitraged away. No systematic 2015 to 2024 study was
found; 2024 press reports funds buying wide discounts."""
family = "D"
schedule = "month_end"
top_k = 10
screeners = ["cef_discount_zscore"]
baselines = ["size_small"]
status = "candidate"
mechanism_kind = "value_gaps"
frozen_from = 2026-04-01
notes = """THE UNIVERSE IS SURVIVORS ONLY BEFORE 2026-10-02. Closed-end funds joined the covered universe on 2026-10-18
(ADR 0013 amendment) and the universe snapshot has them only from then; before it the harness builds the
population from the listing history, where a delisted fund reads as an ETF (the vendor listing types 291 of the
funds as ETF; about 37 live funds listed as Stock on NYSE are missing too, 293 of 330 CEF ids have outcomes at 2026-09-30, and sessions 2026-10-02 to 2026-10-17 have no CEF universe or outcome rows until backfilled) and the rule security_type eq CEF keeps only the survivors, so a fund that was liquidated, merged
or open-ended after a wide discount is missing from the earlier sessions: the history carries the today_flag tilt
(ADR 0053 amendment, historical.py) and flatters a discount strategy. The NAV is known from the next session
(known_from), and the discount pairs it with the close of its own date; around a split the NAV is put in the
close's split terms in cef_nav@v1, so a reverse split is no false discount. The base is every fund of the
universe with a score (cef_discount_zscore gated in the universe: a fund with no NAV, a stale one or under 120
discounts has none, and the harness reads a base under 80% scored as too thin), the picks are the screener's 10
widest. Long only, as the source's short leg is unnecessary for an individual (the page). Tested
against SPY, which is a mismatch for a bond or municipal fund (a benchmark by fund category is a follow-up);
a leveraged fund's discount also carries rate and credit beta. Proxies, each stated: the source's relative
discount is a sort on the discount against its history, here the 252-session z-score (cef_nav@v1); the
NAV is the issuer's own, struck after the close and known from the next session (known_from), so the discount pairs the NAV
with the close of the NAV's own date, one session old at the decision; the BDC half is out (their NAV is quarterly, from 10-Q
filings). Fund edges are keyed by instrument_id (ADR 0018), never by hand-listed tickers. The activism half
(13D filings by fund) is cef_activist_target_prediction, not filed here."""

[universe.where]
all = [
  { field = "instrument.security_type", op = "eq", value = "CEF" },
  { field = "instrument.status", op = "eq", value = "ACTIVE" },
  { field = "rollup.price_stats@v2.close", op = "gt", value = 3 },
  { field = "rollup.price_stats@v2.adv_usd_20d", op = "gte", value = 500_000 },
  { field = "rollup.cef_nav@v1.cef_discount_zscore", op = "gte", value = -20 },  # the z-score is bounded near -(n-1)/sqrt(n), about -15.8 at n=252; -20 never drops a pick
]

[outcome]
kind = "excess_return"
horizon_sessions = [60, 125, 250]
benchmark = "SPY"
start_offset_sessions = 1
cost_bps = 50

[quality_bar]
outcome = """Excess return over SPY over 60, 125 and 250 sessions after the entry close, net of 50 bps a
round trip: a long hold in the funds with the widest discount against their own year."""
trigger_timing = """The NAV is struck after the close of its date and known from the next session
(events/fund_nav known_from); the discount pairs it with the close of its own date. The rank is read at D
(the last session of the month) from the latest NAV known by D, at most five sessions old, and the entry
session is S = D + 1 (start_offset_sessions = 1)."""
replication = """The source's rule: sort funds on the discount relative to its history, long the widest
quintile and short the narrowest, 18.2% a year and Sharpe 1.9 over 1998-2011 (Patro, Piccotti and Wu; a two-group long-short
figure, not filed under [published]). Here the long side only: the 10 funds with the lowest discount
z-score over 252 sessions."""
expected_size = """18.2% a year for the long-short quintile spread in-sample (Patro et al., via Quantpedia,
not verified in the paper); activism cuts discounts to about half (Bradley et al. 2010). Funds with a mapped
NAV number about 273, so a decile is under 30 names; 40 independent month-ends need over three years of
history, which the NAV series (to 2004) and the stored bars (from 2010) supply."""
capacity_costs = """Spreads of 0.3 to 1% on small funds; capacity $20k to $100k a fund, hundreds of funds. The
filter keeps funds trading $500k a day and the cost is 50 bps a round trip."""
failure_modes = """A discount that is fair (a fund that cut its payout or lost its manager) never closes; a
rate rise hits levered bond funds across the board; a stale NAV makes a discount that is not there.
Retire if the frozen-period excess return of the picks is not above the mean of every eligible fund."""
decoys = """Leverage (most funds are about 30% levered: rate and credit beta), the payout-rate trap (the
next edge, cef_distribution_trap), duration of the bond and municipal funds, and small-size tilt:
the size baseline; compare funds of one category in a follow-up."""

[[sources]]
title = "Lee, C., Shleifer, A. and Thaler, R., Investor Sentiment and the Closed-End Fund Puzzle, Journal of Finance, 1991"
url = "https://www.nber.org/papers/w3465"

[[sources]]
title = "Bradley, M., Brav, A., Goldstein, I. and Jiang, W., Activist Arbitrage: A Study of Open-Ending Attempts of Closed-End Funds, Journal of Financial Economics, 2010"
