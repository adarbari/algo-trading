# Edge document (ADR 0053; the quality bar: docs/edges-plan.md), typed in
# src/algotrade/config/edges/document.py. Idea family C (docs/edge-ideas/options-volatility.md,
# c31). A filter overlay in the plan (covered-call selection): the avoid list of lottery-like
# stocks, judged on the stock's own return with the short outcome.
id = "c31_lottery_options_short"
name = "Lottery stocks, avoid list"
family = "C"
thesis = "Stocks with an extreme best day last month are lottery-like and overpriced, so they underperform, and their calls are the ones to sell, never to buy."
mechanism = """Retail demand for skewness overprices lottery-like stocks and their out-of-the-money
calls, and limits to arbitrage keep dealers from correcting it (Bali, Cakici and Whitelaw 2011;
Boyer and Vorkink 2014)."""
persistence = """Short-sale constraints and retail's lottery preference are structural, and retail
call buying has grown since 2020; but the premium sits where shorting is costly, and the squeeze
tail (GME, AMC) is the risk that keeps arbitrageurs out."""
schedule = "month_end"
universe = "liquid_common_stocks"
top_k = 30
screeners = ["lottery_max"]
baselines = ["momentum_12_1", "size_small"]
status = "candidate"
frozen_from = 2026-04-01
notes = """The source is Boyer and Vorkink's sort on ex-ante option skewness, and its short-call P&L
needs the option model outcome (H8) and chains from 2026-10-02 only. What is filed here is the
lottery measure of Bali, Cakici and Whitelaw, MAX (max_ret_21d, the best one-day return of the last
21 sessions, from bars: history back to 2010 once the rollup is backfilled), as the lottery score
the brief names: the outcome is the short on the 30 highest-MAX names (rank last) among those with
enough dollar volume to short, net of the site's borrow assumption: the stock-side avoid list that
a covered-call selection would use. The plan marks the idea covered-call only: naked short calls
on meme stocks are the most dangerous trade in the catalogue, and nothing here models them. The
published figure below is the MAX paper's, 1962-2005 (the paper's low-minus-high decile spread
exceeds 1% a month): it is the proxy's own number, not Boyer and Vorkink's, whose magnitude is not
verified. Month-end start sessions spaced at least 20 sessions apart."""

[outcome]
kind = "excess_return"
horizon_sessions = [20]
benchmark = "SPY"
start_offset_sessions = 1
cost_bps = 10
side = "short"

[quality_bar]
outcome = """The short's value: minus the excess return over SPY for the 20 sessions after the
entry close (the session after a month-end decision), less 10 bps a round trip and the assumed
borrow cost."""
trigger_timing = """max_ret_21d is computed from the closes through the decision session D (a month
end); the entry session is S = D + 1 (start_offset_sessions = 1)."""
replication = """Bali, Cakici and Whitelaw: the largest daily return of the prior month, decile
sorts, one-month hold, long low and short high; here the 30 highest of the liquid common stocks
(lottery_max ranks the highest last) as the short, a stock-side proxy for Boyer and Vorkink's
high-skewness sort, which is by option skewness."""
expected_size = """More than 1% a month for the low-minus-high MAX decile spread, 1962-2005 (Bali,
Cakici and Whitelaw 2011); the effect concentrates in small names and is weak in large liquid
stocks (Hou, Xue and Zhang), so expect much less in this universe."""
capacity_costs = """An individual cannot short the microcaps where the effect is: the short is held
only above the capacity floor and net of the assumed borrow. The covered-call use sells calls on
names one already holds; the naked version is not modelled."""
failure_modes = """Squeezes, and the premium living only in microcaps. Retire if the frozen-period
short value is not above zero after borrow, or the high-MAX names do not do worse than the
buy-and-hold mean of the eligible names."""
decoys = """Size, price level, distress, low volatility and idiosyncratic volatility (one
cluster), short-term reversal: the size and 12-1 momentum baselines on the same sessions; the
retail_options_lottery_attention edge reads the same names by option volume."""

[[sources]]
title = "Bali, T., Cakici, N. and Whitelaw, R., Maxing Out: Stocks as Lotteries and the Cross-Section of Expected Returns, Journal of Financial Economics, 2011"
url = "https://www.nber.org/papers/w14804"

[[sources]]
title = "Boyer, B. and Vorkink, K., Stock Options as Lotteries, Journal of Finance, 2014"

# The literature's figure (ADR 0064): Bali, Cakici and Whitelaw's low-minus-high MAX decile spread,
# more than 1% a month (a lower bound, from the paper's abstract), 1962-2005, before costs; it is
# of the MAX proxy, not of Boyer and Vorkink's option-skewness sort.
[published]
measure = "decile_spread"
value = 0.01
horizon_sessions = 20
sample = 44
source = 0
