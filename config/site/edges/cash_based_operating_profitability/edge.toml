# Edge document (ADR 0053; the quality bar: docs/edges-plan.md), typed in
# src/algotrade/config/edges/document.py. Catalogue: docs/edge-ideas/ (edge build E2).
id = "cash_based_operating_profitability"
name = "Cash-based operating profitability"
family = "A"
thesis = "Stocks that earn the most cash operating profit on their assets keep outperforming the market over the following months."
mechanism = """Investors extrapolate reported earnings; the accrual part of earnings mean-reverts, and the cash part is durable. Removing accruals from profitability keeps the signal of lasting cash generation and drops the part that reverses, so holders of low-profit story stocks are systematically on the wrong side (Ball, Gerakos, Linnainmaa and Nikolaev 2016)."""
persistence = """Profitability is partly a risk-like premium (profitable firms are not cheap; Fama and French adopted it as a factor in 2015) and partly a limit to arbitrage on the short side. It is well known yet the long leg, quality growth, is a comfortable trade, so there is little pressure to arbitrage it away."""
schedule = "month_end"
universe = "liquid_common_stocks"
top_k = 50
screeners = ["cash_op_profitability", "composite_value"]
baselines = ["size_small", "momentum_12_1"]
status = "candidate"
frozen_from = 2026-04-01
notes = """Month-end start sessions spaced at least 20 sessions apart. The statement groups and the rollups of this edge are stored only from the nightly that first carries them, so the stored history gives few independent sessions, under the 40 the bar asks; the harness reports the count beside every number. The frozen period starts 2026-04-01 (owner decision 2026-10-08, ADR 0053 amendment). The second screener, composite_value, is the catalogue's variant: cheap on a two-part value yield among cash-profitable names ('only useful combined with profitability'); the harness scores it beside the main one on the same sessions. cash_op_profitability is built from stored lines (EBIT less the gap between net income and operating cash flow, over total assets): the paper's line by line accrual changes and its R&D add-back are not stored, so it is a proxy, not a replication; decile sorts are the harness's, not the paper's NYSE breakpoints. long_short, where run, is diagnostic only (ADR 0053 amendment, outcome sides)."""

[outcome]
kind = "excess_return"
horizon_sessions = [20, 60]
benchmark = "SPY"
start_offset_sessions = 1
cost_bps = 10

[quality_bar]
outcome = """Excess return over SPY over the 20 and 60 sessions after the entry close (the session after a month-end decision), net of 10 bps a round trip (an assumption; the PRD's proposal for liquid names, ADR 0053 open decisions)."""

trigger_timing = """Every statement figure is read as of the session its filing's acceptance was public (statements_accepted, H2), never at its period end, so the month-end decision session D sees only filings accepted by D. The entry session is S = D + 1 (start_offset_sessions = 1): the first fill is the next session's close and the window runs from S's close; the screen is read at D, the outcome at S."""

replication = """The published rule: sort on cash-based operating profitability (operating profit less accruals, over total assets) and hold the top decile, rebalanced annually after the filings (Ball et al. 2016). Here the top 50 of the liquid common stocks, ranked on a stored-line proxy; the proxy and what it omits are in the field's description and the notes, and the source's own number is the published figure beside the result."""

expected_size = """The published long-short decile spread is 0.47% a month (value-weighted, 1963-2014, t = 3.2), a three-factor alpha of 90 bp a month for the high decile; profitability premia after publication are smaller (McLean and Pontiff 2016 put the average haircut near 58%). A few independent sessions cannot distinguish that from zero: the harness reports the t statistic and the sessions beside it."""

capacity_costs = """Large and liquid names only (price over 5 dollars, 50M dollars of 20-day volume): the signal moves slowly, turnover is low and the spread is small; the 10 bps round trip is the assumption. No short leg in the main outcome."""

failure_modes = """Profitability is a quality tilt: it lags in junk rallies and value reversals, and a growth or mega-cap tech tilt can stand in for it. Retire if the frozen-period decile spread is not above zero or the top 50 does not beat the buy-and-hold mean of the eligible names."""

decoys = """A growth and large-cap tech tilt (the size and 12-1 momentum baselines on the same sessions), gross profitability and accruals taken alone (the composite_mispricing_score components), and the quality composite (quality_minus_junk): the test is whether cash profitability adds beyond them."""

[[sources]]
title = "Ball, G., Gerakos, J., Linnainmaa, J. and Nikolaev, V., Accruals, cash flows, and operating profitability in the cross section of stock returns, Journal of Financial Economics, 2016"
url = "https://doi.org/10.1016/j.jfineco.2016.03.002"

[[sources]]
title = "Novy-Marx, R., The Other Side of Value: The Gross Profitability Premium, Journal of Financial Economics, 2013"
url = "https://www.nber.org/system/files/working_papers/w15940/w15940.pdf"

[[sources]]
title = "Chen, A. and Zimmermann, T., Open Source Cross-Sectional Asset Pricing, Critical Finance Review, 2022"
url = "https://papers.ssrn.com/abstract=3604626"

[[variants]]
id = "spread"
[variants.outcome]
side = "long_short"

# The literature's figure (ADR 0064): Ball, Gerakos, Linnainmaa and Nikolaev's high-minus-low decile, percent a month, value-weighted, NYSE breakpoints, 1963-2014, before costs (JFE Table 4A as recorded in Chen and Zimmermann's SignalDoc; t = 3.2). Their sort is annual and runs on the full cash-based measure, so read the bars as the size to expect.
[published]
measure = "decile_spread"
value = 0.0047
horizon_sessions = 20
sample = 51
source = 0
