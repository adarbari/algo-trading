# Edge document (ADR 0053; the quality bar: docs/edges-plan.md), typed in
# src/algotrade/config/edges/document.py. Blocked 2026-10-07 until ED6.
id = "russell_reconstitution"
name = "Russell reconstitution"
thesis = "Stocks moving between the Russell 1000 and 2000 at the annual reconstitution feel predictable pressure from the funds that track them."
mechanism = """Funds tracking the Russell 2000 must buy names that enter it and sell those that
leave on the reconstitution date, ranked on a known date before (Madhavan 2003; Chang, Hong and
Liskovich 2015)."""
persistence = """The assets tracking the Russell indexes keep the demand large and the date fixed;
competition shrinks it, but it was still measurable in the 2000s (Chang, Hong and Liskovich
2015)."""
schedule = "on_event:index_change"
top_k = "all"
screeners = []
status = "blocked"
plain_reason = "Too few events to judge for years, and we hold no Russell membership lists."
mechanism_kind = "forced_flows"
notes = """The schedule is a placeholder: index_change is the S&P 500 only, and the harness has
no field to read it from (a fitness test keeps an open edge off such a class). The thesis needs
its own event class, russell_reconstitution (ADR 0050 market structure), read from FTSE Russell's
add / delete lists: anchor the session after the preliminary list, known_from its publication
after the close, so a 20-session window runs from the list to the effective date (Madhavan's
window). Calendar (FTSE Russell, checked 2026-10-10): rank day the last business day of April
(May before 2023); preliminary lists after the close on the 4th Friday of May, updated weekly;
effective after the close on the 4th Friday of June (2023-06-23, 2024-06-28, 2025-06-27,
2026-06-26). Semi-annual from 2026: rank day 2026-10-30, preliminary lists 2026-11-13, effective
after the close on 2026-12-11 (first announced as the 2nd Friday of November; no standing rule
for later Decembers, so the dates come from the lists, never a calendar rule). Plan: ADR 0050
amendment and the source and licence decision (owner), the source and ingestion task, the
feature group and event field, then this schedule."""
rejection_reason = """Alive, but too few events: one a year to 2025 and two a year from 2026 give
about 16 events from 2010 and 2 more a year, under the 40 independent events the bar asks until
the mid-2030s, even with full membership history. We also hold no Russell membership
(events/index_change is the S&P 500 only), and the universe (ADR 0013) lacks the small caps
needed to rebuild the rank-day cut-off, so membership needs FTSE Russell's lists."""

[universe.where]
all = [
  { field = "instrument.security_type", op = "eq", value = "COMMON_STOCK" },
  { field = "instrument.status", op = "eq", value = "ACTIVE" },
]

[outcome]
kind = "excess_return"
horizon_sessions = [20]
benchmark = "SPY"
start_offset_sessions = 1

[quality_bar]
outcome = "Excess return over SPY over 20 sessions around the reconstitution date."
trigger_timing = "Membership is predictable from the rank day's market caps, weeks before the date."
replication = "Madhavan's additions and deletions around the rank day and reconstitution date."
expected_size = "Measurable but shrinking in the published studies (Madhavan 2003; Chang et al. 2015); one event a year."
capacity_costs = "Small caps at the 1000 / 2000 boundary; a crowded trade on one day."
failure_modes = "Front-running moves the pressure earlier each year; the semi-annual schedule from 2026 (a December reconstitution) splits the demand across two dates and may shrink each."
decoys = "Size and past returns decide membership: the size and momentum baselines."

[[sources]]
title = "Madhavan, A., The Russell Reconstitution Effect, Financial Analysts Journal, 2003"
url = "https://doi.org/10.2469/faj.v59.n4.2545"

[[sources]]
title = "Chang, Y.-C., Hong, H. and Liskovich, I., Regression Discontinuity and the Price Effects of Stock Market Indexing, Review of Financial Studies, 2015"
url = "https://doi.org/10.1093/rfs/hhu041"

[[sources]]
title = "CXO Advisory, Strategies for Exploiting Index Rebalancing?"
url = "https://www.cxoadvisory.com/miscellaneous/strategies-for-exploiting-index-rebalancing/"

# The literature's figure (ADR 0064): the June abnormal return of names at the Russell
# 1000/2000 cut-off that were added, 5% over a month, 1996-2012, before costs, small caps at the
# boundary, before the 2007 banding rule (section 5; deletions -5.4%).
[published]
measure = "mean_excess"
value = 0.05
horizon_sessions = 20
sample = 17
source = 1
leg = "long"
