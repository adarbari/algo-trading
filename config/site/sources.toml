# L3 site setting: data sources used by apps/ingestion. Credentials never go here (use .env).

raw_retention_days = 90          # raw vendor responses older than this are purged nightly
staging_retention_days = 14      # scratch left by unfinished runs (no resume after this) is purged nightly

# Each vendor section: `enabled` (off: its sources are not built and tasks needing them are
# skipped) and `min_interval_s`, the spacing between requests to that vendor, shared by every
# worker thread and every process on this machine (apps/ingestion/sources/framework/limiter.py).

[http]                           # every vendor request (sources/framework/http.py)
max_retry_s = 300                # give up on one request after retrying for this long
breaker_failures = 10            # this many 403/5xx in a row from a vendor: fail its remaining items fast
limits_dir = "var/run/limits"    # shared pacing state, one lock file per vendor (git-ignored)

[cboe]                           # option chains (delayed feed), one request per underlying
enabled = true
workers = 4
min_interval_s = 0.0             # unpaced today; the workers bound concurrency

[nasdaq_trader]                  # universe: symbol directory + listed options
enabled = true
min_interval_s = 0.0

[spy_holdings]                   # S&P 500 membership
enabled = true
min_interval_s = 0.0

[nasdaq_earnings]                # earnings calendar
enabled = true
days = 60                        # forward window stored each night
min_interval_s = 0.5             # spacing between requests

[massive]                        # daily bars, splits, dividends, identifiers (needs the API key)
enabled = true
min_interval_s = 12.5            # free tier: 5 requests/minute
corporate_actions_window = [-7, 30]   # days around the session

[sec_edgar]                      # company details (needs ALGOTRADE_SEC_CONTACT in .env)
enabled = true
min_interval_s = 0.2             # SEC fair access allows 10 requests/second; stay well below
refresh_days = 30                # refetch a company's details after this many days

[treasury]                       # daily par yield curve (risk-free rates), one request per year
enabled = true
min_interval_s = 1.0             # official site, no published limit; stay polite
lookback_days = 10               # nightly window: the last N calendar days (catches late publications)

[quality]                        # data-quality thresholds for the nightly checks
max_bar_count_drop = 0.10        # FAIL if today's bar count falls >10% vs the previous session
max_universe_change = 0.05       # FAIL on a >5% day-over-day change in coverage
min_chain_coverage = 0.95        # FAIL if fewer than 95% of optionable names returned a chain
