# L3 site setting: data sources used by apps/ingestion. Credentials never go here (use .env).

raw_retention_days = 90          # raw vendor responses older than this are purged nightly
                                 # (a vendor section may set its own raw_retention_days)
staging_retention_days = 14      # scratch left by unfinished runs (no resume after this) is purged nightly
live_retention_days = 7          # live/option_quotes (the API's recorded live quotes, ADR 0028) older
                                 # than this are purged nightly (purge-raw)

# Each vendor section: `enabled` (off: its sources are not built and tasks needing them are
# skipped), its pacing, shared by every worker thread and every process on this machine
# (libs/sources/algotrade_sources/framework/limiter.py), and optionally `raw_retention_days`, which
# overrides the global window for the raw responses of every source in that section.
# Pacing is adaptive between `min_interval_s` (the floor: the fastest we ever go) and
# `max_interval_s` (the ceiling; unset: 4 x the floor), starting each run at
# `start_interval_s` (unset: the floor). The [http] keys below say how it adapts.

[http]                           # every vendor request (sources/framework/http.py)
max_retry_s = 300                # give up on one request after retrying for this long
breaker_failures = 10            # this many 403/5xx in a row from a vendor: fail its remaining items fast
limits_dir = "var/run/limits"    # shared pacing state, one lock file per vendor (git-ignored)
backoff_factor = 1.5             # 429 (after waiting out Retry-After) or too many errors: interval x this
max_error_rate = 0.10            # errors (429, 5xx, blocks, timeouts; not "no such object") above this
error_window = 50                # share of the last N responses slow the vendor down (once per window)
speedup_after = 100              # this many responses in a row without an error ...
speedup_factor = 1.05            # ... divide the interval by this (never below the floor)

[cboe]                           # option chains (delayed feed), one request per underlying
enabled = true
workers = 2
min_interval_s = 1.05            # Cloudflare allows ~60 requests per rolling minute (measured
                                 # 2026-10-03: 1/s for 60 s all 200; 1.2/s -> 429 "error code: 1015"
                                 # at request 69, Retry-After ~47-60 s). 1.05 s = ~57/min, ~75 min
                                 # for 4.2k underlyings.
max_interval_s = 5.0             # back-off ceiling (12/min)
priority_symbols = [             # fetched first (with S&P 500 members), in this order
  "SPY", "QQQ", "IWM", "DIA", "TLT", "GLD", "SLV", "USO", "HYG", "LQD", "EEM", "EFA",
  "XLB", "XLC", "XLE", "XLF", "XLI", "XLK", "XLP", "XLRE", "XLU", "XLV", "XLY",
  "SMH", "XBI", "KRE", "XOP", "GDX", "ARKK", "UVXY", "VXX", "SVXY", "VIXY",
]

[nasdaq_trader]                  # universe: symbol directory + listed options
enabled = true
min_interval_s = 0.0

[spy_holdings]                   # S&P 500 membership
enabled = true
min_interval_s = 0.0

[nasdaq_earnings]                # earnings calendar
enabled = true
days = 60                        # forward window stored each night
lookback_days = 7                # plus the last week, which now carries the reported EPS
min_interval_s = 0.5             # spacing between requests

[massive]                        # daily bars, splits, dividends, identifiers (needs the API key)
enabled = true
min_interval_s = 12.5            # free tier: 5 requests/minute
corporate_actions_window = [-7, 30]   # days around the session

[sec_edgar]                      # company details + share counts (needs ALGOTRADE_SEC_CONTACT in .env)
enabled = true
min_interval_s = 0.2             # SEC fair access allows 10 requests/second; stay well below
raw_retention_days = 7           # submissions, company_tickers, companyfacts: ~0.5 GB a night
                                 # and never replayed past a few days (tables keep the data)
refresh_days = 30                # refetch a company's details once per this many days
facts_refresh_days = 30          # refetch a company's share counts (company facts) once per this
                                 # many days; both spread over the window by CIK

[treasury]                       # daily par yield curve (risk-free rates), one request per year
enabled = true
min_interval_s = 1.0             # official site, no published limit; stay polite
lookback_days = 10               # nightly window: the last N calendar days (catches late publications)

[ibkr]                           # IB Gateway, READ-ONLY market data: `verify`, `ibkr-contracts`, `ibkr-iv`
enabled = true                   # owner runs IB Gateway with "Read-Only API" ticked (verified 2026-10-03)
                                 # (README "Live verification"); host, port and client id come from
                                 # ALGOTRADE_IBKR_HOST / _PORT / _CLIENT_ID in .env
min_interval_s = 0.02            # every API message: IBKR allows at most 50 messages/second
historical_min_interval_s = 10.0 # every historical-data request as well (the shared `ibkr_historical`
                                 # limiter; 10 s = 60 per 10 minutes). IBKR documents 60 per 10
                                 # minutes only for bars of 30 s or less; daily bars are soft
                                 # throttled. Owner trial: 5, then 3, watching timeouts and error
                                 # 162 (an unanswered request is retried, never NO_DATA)
market_data_type = 3             # 1 live (needs a market data subscription), 3 delayed (free)
connect_timeout_s = 10           # the API handshake with the gateway
request_timeout_s = 60           # one historical-data request
stream_wait_s = 4                # how long a streamed tick (IB dividends, tick 456; IV ticks 104/106)
                                 # may take
# IBKR enrichment (ADR 0028): conids, IB's IV history, the nightly IV snapshot (`ibkr-contracts`,
# `ibkr-iv`). A backfill is ONE historical request (IV) per underlying, most liquid first, paced
# by historical_min_interval_s: ~4.2k optionable names x 10 s = ~12 h, so it is resumable and
# spread over nights (iv_backfill_per_night) or run by hand (docs/data/vendors.md, IBKR).
contracts_refresh_days = 30      # re-resolve each conid once a month (slot day by key); new names at once
contracts_batch = 25             # contracts qualified per request (each one paced as a message)
iv_batch = 50                    # IV streams open together (paper accounts have ~100 market-data lines)
iv_history_days = 730            # calendar days of IV history a backfill fetches (2 years)
iv_backfill_per_night = 100      # underlyings without IV history the nightly backfills (0: off;
                                 # 100 x 1 request x 10 s = ~17 min a night)
# The API's live option quotes (ADR 0028; GET /chains/{id}/live): read through the same facade on
# its own client id (ALGOTRADE_IBKR_API_CLIENT_ID, default ALGOTRADE_IBKR_CLIENT_ID + 1); when the
# gateway is down the API serves the stored delayed chain with a status instead.
live_cache_s = 60                # an answer is reused this long (per underlying, expiry, strikes)
live_strikes = 10                # strikes nearest the underlying asked for when none are named
live_max_strikes = 20            # most strikes one request may name (x 2 rights = contracts)
live_timeout_s = 20              # longest a request waits for IB Gateway before falling back
live_retry_s = 30                # after the gateway fails, requests fall back at once this long
raw_retention_days = 30          # raw IBKR responses (JSON) kept for replays of a verification

[quality]                        # data-quality thresholds for the nightly checks
max_bar_count_drop = 0.10        # FAIL if today's bar count falls >10% vs the previous session
max_universe_change = 0.05       # FAIL on a >5% day-over-day change in coverage
max_chain_fetch_failures = 0.05  # FAIL if over 5% of optionable names failed to fetch (FETCH_ERROR,
                                 # incl. an open circuit, or never attempted)
max_chain_stale_share = 0.20     # WARN if over 20% of chains are STALE_DATA (the feed served an
                                 # older session; screens treat those names as UNKNOWN)
max_verify_failures = 0.10       # verification vs IBKR: FAIL if over 10% of checks FAIL (any FAIL: WARN)
