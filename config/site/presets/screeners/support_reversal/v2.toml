# Support reversal: a down week stopping at a level that has held before, with the first up close
# and volume (owner's screen, 2026-10-06; docs/data/technical.md "Presets"). What it finds:
# bounces off tested support. What it does not check: why price fell (news, earnings), whether
# the level is a one-spike low (check support_touches and the chart). Scored for put selling:
# feature.put_support_cushion_atr >= 1 (the owner's "support cushion"; a miss only lowers the
# score; it needs a best put, so a name with no chain loses those points).
# v2 (owner decision 2026-10-07): the owner uses this screen for selling puts, so it also
# requires option liquidity: option volume (soft, a near miss is flagged) and a tradeable
# option execution tier A or B (hard). v1 stays pinned for user screens that extend it.
# Immutable: change it by adding v3.toml (architecture/preset_versions.toml).
# Run on request or nightly like every site screener (ADR 0033); an identification layer,
# not a trade signal.
id = "support_reversal"
kind = "screener"
impl = "rules"
version = 2
name = "Support reversal"

# ------------------------------------------------ who is screened and tradeable (the site base gates;
# no liquidity_class bundle: option liquidity is gated explicitly below, after the ADV gate)
[criteria.security_type]
field = "instrument.security_type"
op = "in"
value = ["COMMON_STOCK", "ADR", "ETF"]

[criteria.status]
field = "instrument.status"
op = "eq"
value = "ACTIVE"

[criteria.price]
field = "rollup.price_stats@v2.close"
op = "gt"
value = 5

[criteria.adv]
field = "rollup.price_stats@v2.adv_usd_20d"
op = "gte"
value = 50_000_000
mode = "soft"
tolerance = { relative = 0.2 }    # $40M-$50M is a near miss
on_miss = "LIQUIDITY_RISK"

# Option liquidity for the put seller (fields and conventions as vrp_scanner).
[criteria.option_volume]
field = "feature.option_chain_volume"
op = "gte"
value = 1_000
mode = "soft"
tolerance = { relative = 0.5 }    # 500-1,000 contracts is a near miss
on_miss = "LIQUIDITY_RISK"
label = "Option volume > 1,000 / day"

# HARD here, unlike vrp_scanner v3 (which scores it): a put seller needs a tradeable short
# strike, so a name with no execution tier A or B is rejected, not just ranked lower.
[criteria.execution]
field = "feature.option_tier"
op = "in"
value = ["A", "B"]
label = "Option execution tier A or B"

# ------------------------------------------------------------------------ the setup
[criteria.support_near]
field = "feature.dist_to_support_atr"
op = "lt"
value = 0.5

[criteria.support_touches]
field = "rollup.pivot_strength@v1.support_touches"
op = "gte"
value = 2

[criteria.ret_5d]
field = "rollup.momentum@v1.ret_5d"
op = "lt"
value = 0

[criteria.momentum_improving]
field = "rollup.trend_stats@v2.mom_accel_5d"
op = "gt"
value = 0

[criteria.up_close]
field = "rollup.trend_stats@v2.ret_1d"
op = "gt"
value = 0

[criteria.close_location]
field = "rollup.trend_stats@v2.close_range_pos"
op = "gt"
value = 0.6

[criteria.rel_volume]
field = "rollup.momentum@v1.rel_volume"
op = "gte"
value = 1

[criteria.rs_improving]
field = "rollup.relative_strength@v1.rs_spy_trend_20d"
op = "gt"
value = 0

[criteria.put_cushion]
field = "feature.put_support_cushion_atr"
op = "gte"
value = 1
mode = "score"
tolerance = 1.0

[columns]
close = "rollup.price_stats@v2.close"
dist_to_support_atr = "feature.dist_to_support_atr"
support_touches = "rollup.pivot_strength@v1.support_touches"
put_support_cushion_atr = "feature.put_support_cushion_atr"
close_range_pos = "rollup.trend_stats@v2.close_range_pos"
ret_5d = "rollup.momentum@v1.ret_5d"
ret_20d = "rollup.price_stats@v2.ret_20d"
mom_accel_5d = "rollup.trend_stats@v2.mom_accel_5d"
rel_volume = "rollup.momentum@v1.rel_volume"
atr_ratio_5_20 = "feature.atr_ratio_5_20"
rsi_14 = "rollup.momentum@v1.rsi_14"
rs_spy_63d = "rollup.relative_strength@v1.rs_spy_63d"

[rank]
tie_break = "feature.put_support_cushion_atr"
