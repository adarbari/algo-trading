# IPO lock-ups about to end (ADR 0053, ADR 0075; edge ipo_lockup_expiry): a common stock trading at
# least $5M a day whose IPO lock-up expires within the next 11 sessions: an avoid list for longs and the
# short side of the edge. The order puts the most liquid first (the lowest score is the harness's short leg,
# so the highest dollar volume is shorted first). A missing value never passes (ADR 0030). What it does not
# check: who holds the locked shares (venture funds sell, buyout owners often do not) or an early release.
# Immutable: change it by adding v2.toml (architecture/preset_versions.toml).
id = "ipo_lockup_ahead"
kind = "screener"
impl = "rules"
version = 1
name = "IPO lock-ups ending"
description = "Stocks whose IPO lock-up ends within the next 11 sessions."

# ------------------------------------------------ who is screened and tradeable
[criteria.security_type]
field = "instrument.security_type"
op = "eq"
value = "COMMON_STOCK"

[criteria.status]
field = "instrument.status"
op = "eq"
value = "ACTIVE"

[criteria.adv]
field = "rollup.price_stats@v2.adv_usd_20d"
op = "gte"
value = 5_000_000

# ------------------------------------------------------------------------ the signal
[criteria.lockup_not_over]
field = "rollup.ipo_lockups@v1.sessions_to_lockup_expiry"
op = "gte"
value = 0

[criteria.lockup_soon]
field = "rollup.ipo_lockups@v1.sessions_to_lockup_expiry"
op = "lte"
value = 11

[columns]
close = "rollup.price_stats@v2.close"
adv_usd_20d = "rollup.price_stats@v2.adv_usd_20d"
sessions_to_lockup_expiry = "rollup.ipo_lockups@v1.sessions_to_lockup_expiry"
lockup_release_terms = "rollup.ipo_lockups@v1.lockup_release_terms"

[rank]
tie_break = "rollup.price_stats@v2.adv_usd_20d"
tie_break_order = "asc"
