# 12-1 momentum winners at a pullback (ADR 0053, EB E1; a screener of edge momentum_12_1, the
# oversold_in_uptrend_pullback entry timing): a name with positive 12-1 momentum in a stacked
# uptrend (close > SMA50 > SMA200, EMA20 > EMA50 > EMA200) whose close sits 1 to 2 ATRs below its
# 20-day average (the Connors-style pullback). Ranked by 12-1 momentum. The 20-day distance is
# measured from the SMA20 (stretch_sma20_atr), the nearest stored. What it does not check: why the
# name dipped, earnings dates, market breadth. Immutable: change it by adding v2.toml.
id = "momentum_pullback_entry"
kind = "screener"
impl = "rules"
version = 1
name = "12-1 momentum winners at a pullback"
description = "Past-year winners in an uptrend that dipped slightly below their 20-day average."

# ------------------------------------------------ who is screened and tradeable (the site base gates;
# the same as momentum_12_1, so the variants compare on one universe)
[criteria.security_type]
field = "instrument.security_type"
op = "in"
value = ["COMMON_STOCK", "ADR", "ETF"]

[criteria.status]
field = "instrument.status"
op = "eq"
value = "ACTIVE"

[criteria.price]
field = "rollup.price_stats@v2.close"
op = "gt"
value = 5

[criteria.adv]
field = "rollup.price_stats@v2.adv_usd_20d"
op = "gte"
value = 50_000_000
mode = "soft"
tolerance = { relative = 0.2 }    # $40M-$50M is a near miss
on_miss = "LIQUIDITY_RISK"

# ------------------------------------------------------------------------ the signal
[criteria.mom_12_1]
field = "rollup.trend_stats@v2.mom_12_1"
op = "gt"
value = 0

[criteria.trend]
field = "feature.trend_state"
op = "eq"
value = "UPTREND"

[criteria.ema_stack]
field = "feature.ema_stack"
op = "eq"
value = "BULL"

[criteria.pulled_back]
field = "feature.stretch_sma20_atr"
op = "between"
value = [-2, -1]

[columns]
close = "rollup.price_stats@v2.close"
mom_12_1 = "rollup.trend_stats@v2.mom_12_1"
ret_252d = "rollup.trend_stats@v2.ret_252d"
adv_usd_20d = "rollup.price_stats@v2.adv_usd_20d"
stretch_sma20_atr = "feature.stretch_sma20_atr"

[rank]
tie_break = "rollup.trend_stats@v2.mom_12_1"
