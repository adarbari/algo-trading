# Net share issuance, v1 (Pontiff and Woodgate 2008): every stock with a year-over-year share
# count change, ranked by it, LOWEST first: net buyers of their own shares on top, serial issuers
# last. The measure is feature.net_issuance_pct_12m, the log change of the split-adjusted share
# count over a year. A missing value never passes (ADR 0030). The issuers (the bottom of this
# ranking) are the avoid list. What it does not check: why the count moved (an acquisition paid
# in shares looks like an issue), option dilution beyond the reported count, or price.
# Immutable: change it by adding v2.toml (architecture/preset_versions.toml).
id = "net_share_issuance"
kind = "screener"
impl = "rules"
version = 1
name = "Net share issuance (buybacks first)"
description = "Stocks ranked by change in share count, biggest buybacks first."

# ------------------------------------------------ who is screened and tradeable (the site base gates)
[criteria.security_type]
field = "instrument.security_type"
op = "in"
value = ["COMMON_STOCK", "ADR"]

[criteria.status]
field = "instrument.status"
op = "eq"
value = "ACTIVE"

[criteria.price]
field = "rollup.price_stats@v2.close"
op = "gt"
value = 5

[criteria.adv]
field = "rollup.price_stats@v2.adv_usd_20d"
op = "gte"
value = 50_000_000
mode = "soft"
tolerance = { relative = 0.2 }    # $40M-$50M is a near miss
on_miss = "LIQUIDITY_RISK"

# ------------------------------------------------------------------------ the signal
[criteria.issuance]
field = "feature.net_issuance_pct_12m"
op = "not_null"

[columns]
close = "rollup.price_stats@v2.close"
adv_usd_20d = "rollup.price_stats@v2.adv_usd_20d"
net_issuance_pct_12m = "feature.net_issuance_pct_12m"
shares_change_yoy = "feature.shares_change_yoy"
buyback_flag = "feature.buyback_flag"

[rank]
tie_break = "feature.net_issuance_pct_12m"
tie_break_order = "asc"
