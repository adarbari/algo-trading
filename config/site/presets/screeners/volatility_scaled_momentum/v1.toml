# Volatility-scaled momentum (edge momentum_12_1, a variant): the 12-1 return per unit of 60-session
# realised volatility, ranked by it (a calm 20% outranks a wild 20%). A cross-sectional stand-in:
# Barroso and Santa-Clara scale the winners-minus-losers portfolio's exposure by its own realised
# volatility over time, which a one-day ranking cannot express. Only asks that the value exists
# (a missing value never passes, ADR 0030). What it does not check: the portfolio's own volatility.
# Immutable: change it by adding v2.toml (architecture/preset_versions.toml).
id = "volatility_scaled_momentum"
kind = "screener"
impl = "rules"
version = 1
name = "Volatility-scaled momentum"
description = "Last year's winners ranked by gain per unit of recent price swing."

# ------------------------------------------------ who is screened and tradeable (the site base gates;
# the same as momentum_12_1, so the variants compare on one universe)
[criteria.security_type]
field = "instrument.security_type"
op = "in"
value = ["COMMON_STOCK", "ADR", "ETF"]

[criteria.status]
field = "instrument.status"
op = "eq"
value = "ACTIVE"

[criteria.price]
field = "rollup.price_stats@v2.close"
op = "gt"
value = 5

[criteria.adv]
field = "rollup.price_stats@v2.adv_usd_20d"
op = "gte"
value = 50_000_000
mode = "soft"
tolerance = { relative = 0.2 }    # $40M-$50M is a near miss
on_miss = "LIQUIDITY_RISK"

# ------------------------------------------------------------------------ the signal
[criteria.mom_vol_scaled]
field = "feature.mom_12_1_vol_scaled"
op = "gt"
value = -100

[columns]
close = "rollup.price_stats@v2.close"
mom_12_1_vol_scaled = "feature.mom_12_1_vol_scaled"
mom_12_1 = "rollup.trend_stats@v2.mom_12_1"
adv_usd_20d = "rollup.price_stats@v2.adv_usd_20d"

[rank]
tie_break = "feature.mom_12_1_vol_scaled"
