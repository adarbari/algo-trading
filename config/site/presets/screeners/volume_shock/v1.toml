# Volume shock: The high-volume return premium (Gervais, Kaniel and Mingelgrin 2001): stocks whose volume today is two or more
# standard deviations above their last 20 sessions, ranked by how far above. The criterion asks for
# the flag (a missing value never passes, ADR 0030). What it does not check: news (see
# volume_shock_no_news), or the direction of the day's return.
# Immutable: change it by adding v2.toml (architecture/preset_versions.toml).
id = "volume_shock"
kind = "screener"
impl = "rules"
version = 1
name = "Volume shock"
description = "Stocks trading far more shares today than in the last month."

# ------------------------------------------------ who is screened and tradeable (the site base gates;
# the same as momentum_12_1 for stocks, so the screens compare on one universe)
[criteria.security_type]
field = "instrument.security_type"
op = "in"
value = ["COMMON_STOCK", "ADR"]

[criteria.status]
field = "instrument.status"
op = "eq"
value = "ACTIVE"

[criteria.price]
field = "rollup.price_stats@v2.close"
op = "gt"
value = 5

[criteria.adv]
field = "rollup.price_stats@v2.adv_usd_20d"
op = "gte"
value = 50_000_000
mode = "soft"
tolerance = { relative = 0.2 }    # $40M-$50M is a near miss
on_miss = "LIQUIDITY_RISK"

# ------------------------------------------------------------------------ the signal
[criteria.volume_shock]
field = "feature.volume_shock"
op = "eq"
value = true

[columns]
close = "rollup.price_stats@v2.close"
volume_z_20d = "rollup.volume@v1.volume_z_20d"
ret_1d = "rollup.trend_stats@v2.ret_1d"
adv_usd_20d = "rollup.price_stats@v2.adv_usd_20d"

[rank]
tie_break = "rollup.volume@v1.volume_z_20d"
