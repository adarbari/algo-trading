# Illiquidity decoy: every tradeable common stock or ADR with an Amihud value, the most illiquid
# first: the largest mean absolute daily return per dollar traded over 63 sessions (Amihud 2002:
# illiquid stocks earned a premium). A decoy for the edge harness's battery (ADR 0053 amendment
# 2026-10-18, quality bar 9): an edge whose picks are thin names must beat this ranking on the
# same sessions. The one criterion only asks that the value exists (a missing value never
# passes, ADR 0030). What it does not check: whether the premium survives the spread you pay.
# Immutable: change it by adding v2.toml (architecture/preset_versions.toml).
id = "amihud_illiquid"
kind = "screener"
impl = "rules"
version = 1
name = "Amihud illiquidity (most illiquid first)"

# ------------------------------------------------ who is screened and tradeable (the site base gates;
# the same as size_small, so the decoys compare on one universe; stocks only: an ETF has no
# idiosyncratic risk, jumps or Amihud ratio of its own worth ranking against an operating company)
[criteria.security_type]
field = "instrument.security_type"
op = "in"
value = ["COMMON_STOCK", "ADR"]

[criteria.status]
field = "instrument.status"
op = "eq"
value = "ACTIVE"

[criteria.price]
field = "rollup.price_stats@v2.close"
op = "gt"
value = 3

[criteria.adv]
field = "rollup.price_stats@v2.adv_usd_20d"
op = "gte"
value = 2_000_000

# ------------------------------------------------------------------------ the signal
[criteria.amihud]
field = "rollup.anomaly_stats@v1.amihud_63d"
op = "gte"
value = 0

[columns]
close = "rollup.price_stats@v2.close"
amihud_63d = "rollup.anomaly_stats@v1.amihud_63d"
adv_usd_20d = "rollup.price_stats@v2.adv_usd_20d"

[rank]
tie_break = "rollup.anomaly_stats@v1.amihud_63d"
