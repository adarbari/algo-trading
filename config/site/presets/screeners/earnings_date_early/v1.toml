# Earnings-date advances (ADR 0053, EB E3; edge earnings_date_shift): a common stock trading at least
# $5M a day whose next report date is scheduled a week or more earlier than last year's (the year-ago
# report plus 364 days, the same weekday), so its schedule says the news is early and good (Johnson
# and So 2018). Ranked by the size of the advance, the largest first. A missing value never passes
# (ADR 0030). What it does not check: that the date is confirmed (the calendar only schedules),
# why the date moved (a fiscal-year change looks the same), or how old the shift is.
# Immutable: change it by adding v2.toml (architecture/preset_versions.toml).
id = "earnings_date_early"
kind = "screener"
impl = "rules"
version = 1
name = "Earnings date moved earlier"
description = "Stocks whose next earnings report is scheduled a week or more before last year's."

# ------------------------------------------------ who is screened and tradeable
[criteria.security_type]
field = "instrument.security_type"
op = "eq"
value = "COMMON_STOCK"

[criteria.status]
field = "instrument.status"
op = "eq"
value = "ACTIVE"

[criteria.price]
field = "rollup.price_stats@v2.close"
op = "gt"
value = 5

[criteria.adv]
field = "rollup.price_stats@v2.adv_usd_20d"
op = "gte"
value = 5_000_000

# ------------------------------------------------------------------------ the signal
[criteria.shift_direction]
field = "rollup.earnings_date_shift@v1.earnings_shift_direction"
op = "eq"
value = "earlier"

[columns]
close = "rollup.price_stats@v2.close"
adv_usd_20d = "rollup.price_stats@v2.adv_usd_20d"
earnings_date_shift_days = "rollup.earnings_date_shift@v1.earnings_date_shift_days"
earnings_shift_known_date = "rollup.earnings_date_shift@v1.earnings_shift_known_date"
sessions_since_earnings_shift = "rollup.earnings_date_shift@v1.sessions_since_earnings_shift"

[rank]
tie_break = "rollup.earnings_date_shift@v1.earnings_date_shift_days"
tie_break_order = "asc"
