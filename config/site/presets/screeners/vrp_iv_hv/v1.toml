# VRP on the stored history, v1: the volatility premium alone, on the VRP IV30 (feature.vrp_iv30: IBKR-only before 2026-10-02) and our HV30, over
# the sessions where both exist (~500; vrp_scanner v4 and short_premium_liquidity need option
# chains stored only from 2026-10-02, so the edge harness cannot score them yet). Same
# thresholds as vrp_scanner v4 minus the chain-dependent parts: no IV30 floor of 50% (it would
# thin the history; the spread and ratio carry the premium), no 52-week proximity, no put wing,
# no option tier. The ADR 0053 one-IV rule governs the edge's outcome, not this selection; a missing value
# never passes (ADR 0030); leveraged and inverse funds are excluded. IBKR fields are
# personal-licence (ADR 0028). Ranked by IV/HV, highest first.
# Immutable: change it by adding v2.toml (architecture/preset_versions.toml).
id = "vrp_iv_hv"
kind = "screener"
impl = "rules"
version = 1
name = "VRP (IV over HV)"

[criteria.security_type]
field = "instrument.security_type"
op = "in"
value = ["COMMON_STOCK", "ADR", "ETF"]

[criteria.status]
field = "instrument.status"
op = "eq"
value = "ACTIVE"

[criteria.optionable]
field = "instrument.optionable"
op = "eq"
value = true

[criteria.not_leveraged]
field = "instrument.is_leveraged"
op = "eq"
value = false

[criteria.not_inverse]
field = "instrument.is_inverse"
op = "eq"
value = false

[criteria.price]
field = "rollup.price_stats@v2.close"
op = "gt"
value = 5

[criteria.adv]
field = "rollup.price_stats@v2.adv_usd_20d"
op = "gte"
value = 50_000_000

[criteria.iv30]
field = "feature.vrp_iv30"    # IBKR's before chains are stored (2026-10-02), else the lower of IBKR and Cboe
op = "gt"
value = 0

[criteria.iv_hv_spread]
field = "feature.vrp_iv_hv_spread"
op = "gte"
value = 0.10

[criteria.iv_hv_ratio]
field = "feature.vrp_iv_hv_ratio"
op = "gte"
value = 1.25

[columns]
close = "rollup.price_stats@v2.close"
iv30 = "feature.vrp_iv30"
hv30 = "rollup.price_stats@v2.hv30"
iv_hv_spread = "feature.vrp_iv_hv_spread"
iv_hv_ratio = "feature.vrp_iv_hv_ratio"
adv_usd_20d = "rollup.price_stats@v2.adv_usd_20d"

[rank]
tie_break = "feature.vrp_iv_hv_ratio"
