# Call-put IV spread, rising: The rise of the call-put IV spread over 5 sessions (Lei, Wang and Yan 2020 read the spread's climb into
# earnings): every liquid optionable stock with a 5-session change, ranked by it, largest rise first.
# The criterion only asks that the value exists (a missing value never passes, ADR 0030). What it
# does not check: why the spread moved, or the volume behind it.
# Immutable: change it by adding v2.toml (architecture/preset_versions.toml).
id = "cp_iv_spread_rise"
kind = "screener"
impl = "rules"
version = 1
name = "Call-put IV spread, rising"
description = "Stocks where the call-put price gap widened most over five sessions."

# ------------------------------------------------ who is screened and tradeable (the site base gates;
# the same as momentum_12_1 for stocks, so the screens compare on one universe)
[criteria.security_type]
field = "instrument.security_type"
op = "in"
value = ["COMMON_STOCK", "ADR"]

[criteria.status]
field = "instrument.status"
op = "eq"
value = "ACTIVE"

[criteria.price]
field = "rollup.price_stats@v2.close"
op = "gt"
value = 5

[criteria.adv]
field = "rollup.price_stats@v2.adv_usd_20d"
op = "gte"
value = 50_000_000
mode = "soft"
tolerance = { relative = 0.2 }    # $40M-$50M is a near miss
on_miss = "LIQUIDITY_RISK"

# ------------------------------------------------------------------------ the signal
[criteria.cp_iv_spread_chg_5d]
field = "rollup.cp_iv_history@v1.cp_iv_spread_chg_5d"
op = "gt"
value = -10

[columns]
close = "rollup.price_stats@v2.close"
cp_iv_spread_chg_5d = "rollup.cp_iv_history@v1.cp_iv_spread_chg_5d"
cp_iv_spread = "rollup.cp_iv@v1.cp_iv_spread"
adv_usd_20d = "rollup.price_stats@v2.adv_usd_20d"

[rank]
tie_break = "rollup.cp_iv_history@v1.cp_iv_spread_chg_5d"
