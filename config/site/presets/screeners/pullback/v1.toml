# Pullback: a stacked uptrend that has pulled back to its fast average on light volume with support
# close below (owner's screen, 2026-10-06; docs/data/technical.md "Presets"). What it finds:
# orderly dips in leaders. What it does not check: earnings, market breadth, whether the dip
# is the start of a larger turn beyond the trend_state gate.
# Notes: the 50-session return is rollup price_stats ret_60d (the nearest stored); the 20 EMA
# distance is measured from the SMA20 (stretch_sma20_atr) in ATRs; "pullback volume below the
# advance" is the 5-day / 20-day volume ratio below 1 (not the advance's own volume).
# Immutable: change it by adding v2.toml (architecture/preset_versions.toml).
# Run on request or nightly like every site screener (ADR 0033); an identification layer,
# not a trade signal.
id = "pullback"
kind = "screener"
impl = "rules"
version = 1
name = "Pullback"

# ------------------------------------------------ who is screened and tradeable (the site base gates;
# no liquidity_class: it bundles option liquidity, and these are stock-chart screens)
[criteria.security_type]
field = "instrument.security_type"
op = "in"
value = ["COMMON_STOCK", "ADR", "ETF"]

[criteria.status]
field = "instrument.status"
op = "eq"
value = "ACTIVE"

[criteria.price]
field = "rollup.price_stats@v2.close"
op = "gt"
value = 5

[criteria.adv]
field = "rollup.price_stats@v2.adv_usd_20d"
op = "gte"
value = 50_000_000
mode = "soft"
tolerance = { relative = 0.2 }    # $40M-$50M is a near miss
on_miss = "LIQUIDITY_RISK"

# ------------------------------------------------------------------------ the setup
[criteria.ret_20d]
field = "rollup.price_stats@v2.ret_20d"
op = "gt"
value = 0

[criteria.ret_60d]
field = "rollup.price_stats@v2.ret_60d"
op = "gt"
value = 0

[criteria.ema_stack]
field = "feature.ema_stack"
op = "eq"
value = "BULL"

[criteria.near_ema20]
field = "feature.stretch_sma20_atr"
op = "between"
value = [-0.5, 0.5]
mode = "soft"
tolerance = 0.25
on_miss = "WATCH"

[criteria.pullback_depth]
field = "feature.pullback_atr_20d"
op = "lte"
value = 1.5

[criteria.pullback_age]
field = "rollup.trend_stats@v2.sessions_since_high_20d"
op = "lte"
value = 10

[criteria.volume_lighter]
field = "rollup.volume@v1.volume_ratio_5d_20d"
op = "lt"
value = 1

[criteria.support_near]
field = "feature.dist_to_support_atr"
op = "lte"
value = 1

[criteria.trend]
field = "feature.trend_state"
op = "eq"
value = "UPTREND"

[criteria.momentum_holds]
field = "rollup.trend_stats@v2.mom_accel_5d"
op = "gte"
value = -0.03
mode = "soft"
tolerance = 0.03
on_miss = "WATCH"

[criteria.rs_spy]
field = "rollup.relative_strength@v1.rs_spy_63d"
op = "gt"
value = 0

[columns]
close = "rollup.price_stats@v2.close"
pullback_atr_20d = "feature.pullback_atr_20d"
sessions_since_high_20d = "rollup.trend_stats@v2.sessions_since_high_20d"
stretch_sma20_atr = "feature.stretch_sma20_atr"
dist_to_support_atr = "feature.dist_to_support_atr"
volume_ratio_5d_20d = "rollup.volume@v1.volume_ratio_5d_20d"
ret_5d = "rollup.momentum@v1.ret_5d"
ret_20d = "rollup.price_stats@v2.ret_20d"
mom_accel_5d = "rollup.trend_stats@v2.mom_accel_5d"
rel_volume = "rollup.momentum@v1.rel_volume"
atr_ratio_5_20 = "feature.atr_ratio_5_20"
rsi_14 = "rollup.momentum@v1.rsi_14"
rs_spy_63d = "rollup.relative_strength@v1.rs_spy_63d"

[rank]
tie_break = "feature.pullback_atr_20d"
