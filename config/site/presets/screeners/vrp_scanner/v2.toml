# VRP scanner v2: v1 (docs/screeners/vrp-scanner.md, "Owner decisions"; rule screens:
# docs/screeners/rules.md, ADR 0029) with the option-trade follow-up: the best short put at
# the expiry nearest 45 days (rollup put_wing@v1: nearest 8-15 delta, our delta, then ROC),
# scored, never gated (owner 2026-10-04): its closeness to the 8-15 delta band, its open
# interest, volume and stored spread. The spread is judged live (the put's strike and expiry
# are columns, for the live IBKR quote during market hours). A large one-day move flag
# (rollup price_moves@v1). An identification layer, not a trade signal.
# Immutable: change it by adding v3.toml (architecture/preset_versions.toml). v1 stays as is.
# Not scheduled: run it on request (preview, a `screen` job) or schedule a user copy.
id = "vrp_scanner"
kind = "screener"
impl = "rules"
version = 2
name = "VRP"
selection = "liquid_optionable"   # the daily universe snapshot: active optionable stocks, ADRs, ETFs
classify = "feature.near_52w"     # buckets the output: HIGH, LOW, BOTH

# ---------------------------------------------------------------- core gates (HARD; funnel order)
[criteria.iv30]
field = "feature.vrp_iv30"        # lower of IBKR and Cboe IV30; missing -> SKIPPED (no IV30)
op = "gte"
value = 0.50                      # the owner may lower it to 0.40
label = "IV30 >= 50%"

[criteria.price]
field = "rollup.price_stats@v2.close"
op = "gt"
value = 5
label = "Price > $5"

[criteria.iv_hv_spread]
field = "feature.vrp_iv_hv_spread"
op = "gte"
value = 0.10
label = "IV30 - HV30 >= 10 pts"

[criteria.iv_hv_ratio]
field = "feature.vrp_iv_hv_ratio"  # plain IV30 / HV30, no HV30 floor
op = "gte"
value = 1.25
label = "IV30 / HV30 >= 1.25"

[criteria.near_52w]
field = "feature.near_52w"
op = "in"
value = ["HIGH", "LOW", "BOTH"]
label = "Within 10% of the 52W high or low"

# ----------------------------------------------- liquidity (SOFT: flag a near miss, don't reject)
[criteria.adv]
field = "rollup.price_stats@v2.adv_usd_20d"
op = "gte"
value = 50_000_000
mode = "soft"
tolerance = { relative = 0.2 }    # $40M-$50M is a near miss
on_miss = "LIQUIDITY_RISK"
label = "Stock ADV > $50M"

# ------------------------------------------------------- score only (a miss lowers the score)
# The best put (put_wing@v1). Nothing here filters: a missing value (no chain, no put in
# 0.05..0.35 delta) only costs the criterion's points.
[criteria.delta_closeness]
field = "rollup.put_wing@v1.delta_band_distance"   # 0 inside 8-15 delta
op = "lte"
value = 0
mode = "score"
tolerance = 0.20                  # linear: full points at 0, none at 0.20 (20 delta: 0.05 off)
label = "Best put near 8-15 delta"

[criteria.put_open_interest]
field = "rollup.put_wing@v1.best_put_oi"
op = "gt"
value = 1_000
mode = "score"
tolerance = { relative = 1.0 }    # linear from 0 to 1,000 contracts
label = "Best put OI > 1,000"

[criteria.put_trading_volume]
field = "rollup.put_wing@v1.best_put_volume"
op = "gt"
value = 1_000
mode = "score"
tolerance = { relative = 1.0 }
label = "Best put volume > 1,000"

[criteria.put_bid_ask]
field = "rollup.put_wing@v1.best_put_spread_pct"   # the stored quote: confirm it live
op = "lt"
value = 0.15
mode = "score"
tolerance = 0.15                  # linear from 15% to 30% of mid
label = "Best put bid/ask < 15% of mid (stored quote)"

[criteria.iv_rank]
field = "rollup.ibkr_iv@v1.iv_rank_252d_ibkr"   # IBKR's only; missing -> no points
op = "gte"
value = 0.5
mode = "score"
tolerance = 0.5
label = "IBKR IV rank >= 50%"

[criteria.execution]
field = "feature.option_tier"
op = "in"
value = ["A", "B"]
mode = "score"
label = "Option execution tier A or B"

[tiers.STRONG]
all = [
  { field = "feature.vrp_iv_hv_spread", op = "gte", value = 0.15 },
  { field = "feature.vrp_iv_hv_ratio", op = "gte", value = 1.30 },
]

[flags.large_move]
any = [{ field = "rollup.price_moves@v1.one_day_move", op = "gt", value = 0.10 }]  # HV30 unstable

[flags.leveraged_inverse]
any = [
  { field = "instrument.is_leveraged", op = "eq", value = true },
  { field = "instrument.is_inverse", op = "eq", value = true },
]

[columns]
close = "rollup.price_stats@v2.close"
iv30 = "feature.vrp_iv30"
iv30_source = "feature.vrp_iv30_source"
hv20 = "rollup.price_stats@v2.hv20"
hv30 = "rollup.price_stats@v2.hv30"
iv_hv_spread = "feature.vrp_iv_hv_spread"
iv_hv_ratio = "feature.vrp_iv_hv_ratio"
iv_rank_ibkr = "rollup.ibkr_iv@v1.iv_rank_252d_ibkr"
high_52w = "rollup.price_stats@v2.high_52w"
pct_from_high_52w = "feature.pct_from_high_52w"
low_52w = "rollup.price_stats@v2.low_52w"
pct_from_low_52w = "feature.pct_from_low_52w"
dist_52w = "feature.dist_52w"
ret_20d = "rollup.price_stats@v2.ret_20d"
ret_60d = "rollup.price_stats@v2.ret_60d"
vs_sma_20 = "feature.pct_vs_sma_20"
vs_sma_50 = "feature.pct_vs_sma_50"
vs_sma_200 = "feature.pct_vs_sma_200"
next_earnings = "rollup.earnings@v1.next_earnings_date"
days_to_earnings = "rollup.earnings@v1.days_to_earnings"
adv_usd = "rollup.price_stats@v2.adv_usd_20d"
option_volume = "feature.option_chain_volume"
one_day_move = "rollup.price_moves@v1.one_day_move"
put_strike = "rollup.put_wing@v1.best_put_strike"     # with put_expiry: the contract to quote live
put_expiry = "rollup.put_wing@v1.target_expiry"
put_dte = "rollup.put_wing@v1.target_dte"
put_delta = "rollup.put_wing@v1.best_put_delta"
put_premium = "rollup.put_wing@v1.best_put_mid"
put_roc = "rollup.put_wing@v1.best_put_roc"
put_oi = "rollup.put_wing@v1.best_put_oi"
put_volume = "rollup.put_wing@v1.best_put_volume"
put_spread_pct = "rollup.put_wing@v1.best_put_spread_pct"
put_delta_band_distance = "rollup.put_wing@v1.delta_band_distance"
put_status = "rollup.put_wing@v1.wing_status"
wing_strikes = "rollup.put_wing@v1.n_strikes"
wing_oi = "rollup.put_wing@v1.wing_oi"
wing_volume = "rollup.put_wing@v1.wing_volume"

[rank]
tie_break = "feature.vrp_iv_hv_spread"
