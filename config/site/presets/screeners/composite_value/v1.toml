# Composite value among cash-profitable names, v1: the variant of cash_op_profitability the
# catalogue calls "only useful combined with profitability". A name qualifies when its cash-based
# operating profitability is above zero and its composite value yield is above zero (the mean of
# the operating earnings yield and the free cash flow yield: feature.composite_value_yield, a
# formalisation of the multi-ratio value composite, with no book to market or growth part); the
# cheapest first. A missing value never passes (ADR 0030). What it does not check: quality beyond
# positive cash profit, momentum, size, sector (cheap names cluster in cyclical sectors).
# Immutable: change it by adding v2.toml (architecture/preset_versions.toml).
id = "composite_value"
kind = "screener"
impl = "rules"
version = 1
name = "Cheap and cash-profitable"

# ------------------------------------------------ who is screened and tradeable (the site base gates)
[criteria.security_type]
field = "instrument.security_type"
op = "in"
value = ["COMMON_STOCK", "ADR"]

[criteria.status]
field = "instrument.status"
op = "eq"
value = "ACTIVE"

[criteria.price]
field = "rollup.price_stats@v2.close"
op = "gt"
value = 5

[criteria.adv]
field = "rollup.price_stats@v2.adv_usd_20d"
op = "gte"
value = 50_000_000
mode = "soft"
tolerance = { relative = 0.2 }    # $40M-$50M is a near miss
on_miss = "LIQUIDITY_RISK"

# ------------------------------------------------------------------------ the signal
[criteria.profitable]
field = "feature.cash_op_profitability"
op = "gt"
value = 0

[criteria.cheap]
field = "feature.composite_value_yield"
op = "gt"
value = 0

[columns]
close = "rollup.price_stats@v2.close"
adv_usd_20d = "rollup.price_stats@v2.adv_usd_20d"
composite_value_yield = "feature.composite_value_yield"
ev_ebit = "feature.ev_ebit"
fcf_yield = "feature.fcf_yield"
cash_op_profitability = "feature.cash_op_profitability"

[rank]
tie_break = "feature.composite_value_yield"
tie_break_order = "desc"
