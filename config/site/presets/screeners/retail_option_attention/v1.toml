# Retail option attention in lottery names: Retail lottery-option attention, proxied: stocks with a lottery-like best day last month (MAX of at least 10%,
# a pre-declared threshold, not tuned) ranked by their option-to-stock volume ratio, the highest
# ratio first (the stocks the edge is about avoiding). The true feature, the share of option volume in
# short-dated out-of-the-money calls, is not stored; the ratio is the proxy. A missing value never
# passes (ADR 0030). What it does not check: strikes, expiries, or who trades.
# Immutable: change it by adding v2.toml (architecture/preset_versions.toml).
id = "retail_option_attention"
kind = "screener"
impl = "rules"
version = 1
name = "Retail option attention in lottery names"

# ------------------------------------------------ who is screened and tradeable (the site base gates;
# the same as momentum_12_1 for stocks, so the screens compare on one universe)
[criteria.security_type]
field = "instrument.security_type"
op = "in"
value = ["COMMON_STOCK", "ADR"]

[criteria.status]
field = "instrument.status"
op = "eq"
value = "ACTIVE"

[criteria.price]
field = "rollup.price_stats@v2.close"
op = "gt"
value = 5

[criteria.adv]
field = "rollup.price_stats@v2.adv_usd_20d"
op = "gte"
value = 50_000_000
mode = "soft"
tolerance = { relative = 0.2 }    # $40M-$50M is a near miss
on_miss = "LIQUIDITY_RISK"

# ------------------------------------------------------------------------ the signal
[criteria.max_ret_21d]
field = "rollup.max_return@v1.max_ret_21d"
op = "gte"
value = 0.10

[criteria.option_stock_volume_ratio]
field = "feature.option_stock_volume_ratio"
op = "gte"
value = 0

[columns]
close = "rollup.price_stats@v2.close"
max_ret_21d = "rollup.max_return@v1.max_ret_21d"
option_stock_volume_ratio = "feature.option_stock_volume_ratio"
adv_usd_20d = "rollup.price_stats@v2.adv_usd_20d"

[rank]
tie_break = "feature.option_stock_volume_ratio"
tie_break_order = "asc"
