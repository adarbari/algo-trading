# Short-term momentum in heavily traded stocks (ADR 0053, EB E1; edge short_term_momentum_high_turnover):
# a liquid common stock whose 20-session turnover is at least 1% of its shares a day, ranked by its
# last-month return, the winners first (Medhat and Schmeling 2022: among the most-traded names last
# month's winners continue). The 1% cut is an absolute stand-in for the paper's top turnover decile.
# A missing value never passes (ADR 0030); an ADR has no filed share count, so none passes. What it
# does not check: why the month moved (news, an index event), or the float behind the share count.
# Immutable: change it by adding v2.toml (architecture/preset_versions.toml).
id = "short_term_momentum_turnover"
kind = "screener"
impl = "rules"
version = 1
name = "Short-term momentum, heavy turnover"

# ------------------------------------------------ who is screened and tradeable
[criteria.security_type]
field = "instrument.security_type"
op = "eq"
value = "COMMON_STOCK"

[criteria.status]
field = "instrument.status"
op = "eq"
value = "ACTIVE"

[criteria.price]
field = "rollup.price_stats@v2.close"
op = "gt"
value = 5

[criteria.adv]
field = "rollup.price_stats@v2.adv_usd_20d"
op = "gte"
value = 50_000_000

# ------------------------------------------------------------------------ the signal
[criteria.turnover]
field = "feature.turnover_20d"
op = "gte"
value = 0.01

[criteria.ret_20d]
field = "rollup.price_stats@v2.ret_20d"
op = "gt"
value = -1

[columns]
close = "rollup.price_stats@v2.close"
turnover_20d = "feature.turnover_20d"
ret_20d = "rollup.price_stats@v2.ret_20d"
adv_usd_20d = "rollup.price_stats@v2.adv_usd_20d"

[rank]
tie_break = "rollup.price_stats@v2.ret_20d"
tie_break_order = "desc"
