# MAX decoy: every tradeable common stock or ADR with a MAX value, the largest one-day return of
# the last 21 sessions first (Bali, Cakici and Whitelaw 2011: lottery-like stocks earned less
# afterwards). A decoy for the edge harness's battery (ADR 0053 amendment 2026-10-18, quality bar
# 9): an edge whose picks are recent big jumpers must beat this ranking on the same sessions. The
# one criterion only asks that the value exists (a return is above -1; a missing value never
# passes, ADR 0030). What it does not check: why it jumped (earnings, a bid), trend, quality.
# Immutable: change it by adding v2.toml (architecture/preset_versions.toml).
id = "max_ret_high"
kind = "screener"
impl = "rules"
version = 1
name = "MAX return (largest jump first)"

# ------------------------------------------------ who is screened and tradeable (the site base gates;
# the same as size_small, so the decoys compare on one universe; stocks only: an ETF has no
# idiosyncratic risk, jumps or Amihud ratio of its own worth ranking against an operating company)
[criteria.security_type]
field = "instrument.security_type"
op = "in"
value = ["COMMON_STOCK", "ADR"]

[criteria.status]
field = "instrument.status"
op = "eq"
value = "ACTIVE"

[criteria.price]
field = "rollup.price_stats@v2.close"
op = "gt"
value = 3

[criteria.adv]
field = "rollup.price_stats@v2.adv_usd_20d"
op = "gte"
value = 2_000_000

# ------------------------------------------------------------------------ the signal
[criteria.max_ret]
field = "rollup.max_return@v1.max_ret_21d"
op = "gt"
value = -1

[columns]
close = "rollup.price_stats@v2.close"
max_ret_21d = "rollup.max_return@v1.max_ret_21d"
adv_usd_20d = "rollup.price_stats@v2.adv_usd_20d"

[rank]
tie_break = "rollup.max_return@v1.max_ret_21d"
