# Late filers (ADR 0053, EB E3; edge late_filer_nt_drift): a common stock trading at least $5M a day that
# filed an NT 10-K or NT 10-Q late-filing notice (Form 12b-25) in the last 20 sessions: an exclusion
# list for longs and the short side of the edge. The order puts the most liquid first (the lowest
# score is the harness's short leg, so the highest dollar volume is shorted first). A missing value
# never passes (ADR 0030). What it does not check: the reason in the notice (boilerplate and
# accounting reasons are bad news, a specific legitimate one is neutral), which is not stored.
# Immutable: change it by adding v2.toml (architecture/preset_versions.toml).
id = "nt_late_filer"
kind = "screener"
impl = "rules"
version = 1
name = "Late filers"
description = "Stocks that filed a late-report notice in the last month."

# ------------------------------------------------ who is screened and tradeable
[criteria.security_type]
field = "instrument.security_type"
op = "eq"
value = "COMMON_STOCK"

[criteria.status]
field = "instrument.status"
op = "eq"
value = "ACTIVE"

[criteria.price]
field = "rollup.price_stats@v2.close"
op = "gt"
value = 5

[criteria.adv]
field = "rollup.price_stats@v2.adv_usd_20d"
op = "gte"
value = 5_000_000

# ------------------------------------------------------------------------ the signal
[criteria.late_filing]
field = "rollup.filing_events@v1.sessions_since_late_filing"
op = "lte"
value = 20

[columns]
close = "rollup.price_stats@v2.close"
adv_usd_20d = "rollup.price_stats@v2.adv_usd_20d"
sessions_since_late_filing = "rollup.filing_events@v1.sessions_since_late_filing"
last_late_filing_date = "rollup.filing_events@v1.last_late_filing_date"

[rank]
tie_break = "rollup.price_stats@v2.adv_usd_20d"
tie_break_order = "asc"
