# Analyst target upside (ADR 0053, EB E3b; edge target_price_implied_return): a common stock
# trading at least $5M a day with an analyst consensus target (feature.target_upside: the average
# target over the close, less 1), ranked by upside, the highest first. A missing value never passes
# (ADR 0030): a name the free vendor key does not cover has none. What it does not check: the
# date of the target (it has none), the number of analysts, the industry (the paper demeans the
# upside within the industry; this is the raw figure) or the optimism bias of the sector. The
# source (FMP / Finnhub targets) is a personal-licence feed.
# Immutable: change it by adding v2.toml (architecture/preset_versions.toml).
id = "target_upside_high"
kind = "screener"
impl = "rules"
version = 1
name = "Analyst target upside (highest first)"

# ------------------------------------------------ who is screened and tradeable
[criteria.security_type]
field = "instrument.security_type"
op = "eq"
value = "COMMON_STOCK"

[criteria.status]
field = "instrument.status"
op = "eq"
value = "ACTIVE"

[criteria.price]
field = "rollup.price_stats@v2.close"
op = "gt"
value = 5

[criteria.adv]
field = "rollup.price_stats@v2.adv_usd_20d"
op = "gte"
value = 5_000_000

# ------------------------------------------------------------------------ the signal
[criteria.upside]
field = "feature.target_upside"
op = "gte"
value = -1
mode = "soft"    # the analyst data is an optional source (ADR 0055): a HARD criterion is refused
tolerance = 1.0

[columns]
close = "rollup.price_stats@v2.close"
target_upside = "feature.target_upside"
adv_usd_20d = "rollup.price_stats@v2.adv_usd_20d"

[rank]
tie_break = "feature.target_upside"
