# 12-1 momentum winners in a volatility squeeze (ADR 0053, EB E3b; edge
# volatility_contraction_expansion, the entry filter of the O'Neil / Minervini tight base): a name
# with positive 12-1 momentum in an UPTREND whose Bollinger bandwidth is in the narrowest 20% of
# its last 252 sessions. Ranked by 12-1 momentum. Contraction predicts a larger move, not its
# direction, so the trend and momentum supply the direction. The 20% cut is declared, not tuned.
# What it does not check: base depth or length (the Minervini count of contractions), volume
# dry-up, earnings dates. Immutable: change it by adding v2.toml.
id = "momentum_squeeze_entry"
kind = "screener"
impl = "rules"
version = 1
name = "12-1 momentum winners in a squeeze"
description = "Past-year winners in an uptrend whose price bands are the narrowest in a year."

# ------------------------------------------------ who is screened and tradeable (the site base gates;
# the same as momentum_12_1, so the variants compare on one universe)
[criteria.security_type]
field = "instrument.security_type"
op = "in"
value = ["COMMON_STOCK", "ADR", "ETF"]

[criteria.status]
field = "instrument.status"
op = "eq"
value = "ACTIVE"

[criteria.price]
field = "rollup.price_stats@v2.close"
op = "gt"
value = 5

[criteria.adv]
field = "rollup.price_stats@v2.adv_usd_20d"
op = "gte"
value = 50_000_000
mode = "soft"
tolerance = { relative = 0.2 }    # $40M-$50M is a near miss
on_miss = "LIQUIDITY_RISK"

# ------------------------------------------------------------------------ the signal
[criteria.mom_12_1]
field = "rollup.trend_stats@v2.mom_12_1"
op = "gt"
value = 0

[criteria.trend]
field = "feature.trend_state"
op = "eq"
value = "UPTREND"

[criteria.squeeze]
field = "rollup.bands@v2.bb_width_pctile_252d"
op = "lte"
value = 0.2

[columns]
close = "rollup.price_stats@v2.close"
mom_12_1 = "rollup.trend_stats@v2.mom_12_1"
bb_width_pctile_252d = "rollup.bands@v2.bb_width_pctile_252d"
adv_usd_20d = "rollup.price_stats@v2.adv_usd_20d"

[rank]
tie_break = "rollup.trend_stats@v2.mom_12_1"
