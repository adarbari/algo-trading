# Volume shock, no news: A volume shock with nothing identifiable behind it (a practitioner variant of Gervais, Kaniel and Mingelgrin
# 2001, no published number): no 8-K filed in the last 5 sessions and no earnings reaction window in
# them. The criterion asks for the flag; it is unknown (never a pass, ADR 0030) until the filings
# walk covers the session. What it does not check: press news, which is not stored.
# Immutable: change it by adding v2.toml (architecture/preset_versions.toml).
id = "volume_shock_no_news"
kind = "screener"
impl = "rules"
version = 1
name = "Volume shock, no news"

# ------------------------------------------------ who is screened and tradeable (the site base gates;
# the same as momentum_12_1 for stocks, so the screens compare on one universe)
[criteria.security_type]
field = "instrument.security_type"
op = "in"
value = ["COMMON_STOCK", "ADR"]

[criteria.status]
field = "instrument.status"
op = "eq"
value = "ACTIVE"

[criteria.price]
field = "rollup.price_stats@v2.close"
op = "gt"
value = 5

[criteria.adv]
field = "rollup.price_stats@v2.adv_usd_20d"
op = "gte"
value = 50_000_000
mode = "soft"
tolerance = { relative = 0.2 }    # $40M-$50M is a near miss
on_miss = "LIQUIDITY_RISK"

# ------------------------------------------------------------------------ the signal
[criteria.volume_shock_no_news]
field = "feature.volume_shock_no_news"
op = "eq"
value = true

[columns]
close = "rollup.price_stats@v2.close"
volume_z_20d = "rollup.volume@v1.volume_z_20d"
filing_count_5d = "rollup.filing_activity@v1.filing_count_5d"
adv_usd_20d = "rollup.price_stats@v2.adv_usd_20d"

[rank]
tie_break = "rollup.volume@v1.volume_z_20d"
