# Rising call IV: The change in at-the-money call implied volatility (An, Ang, Bali and Cakici 2014): every liquid optionable
# stock with a 21-session change of its call IV, ranked by it, largest rise first. The criterion only
# asks that the value exists (a missing value never passes, ADR 0030). What it does not check: the put
# side's change (the paper reads it with the opposite sign), or earnings inside the window.
# Immutable: change it by adding v2.toml (architecture/preset_versions.toml).
id = "iv_change_call"
kind = "screener"
impl = "rules"
version = 1
name = "Rising call IV"
description = "Stocks whose call option prices rose most over the last month."

# ------------------------------------------------ who is screened and tradeable (the site base gates;
# the same as momentum_12_1 for stocks, so the screens compare on one universe)
[criteria.security_type]
field = "instrument.security_type"
op = "in"
value = ["COMMON_STOCK", "ADR"]

[criteria.status]
field = "instrument.status"
op = "eq"
value = "ACTIVE"

[criteria.price]
field = "rollup.price_stats@v2.close"
op = "gt"
value = 5

[criteria.adv]
field = "rollup.price_stats@v2.adv_usd_20d"
op = "gte"
value = 50_000_000
mode = "soft"
tolerance = { relative = 0.2 }    # $40M-$50M is a near miss
on_miss = "LIQUIDITY_RISK"

# ------------------------------------------------------------------------ the signal
[criteria.atm_call_iv_chg_21d]
field = "rollup.cp_iv_history@v1.atm_call_iv_chg_21d"
op = "gt"
value = -5

[columns]
close = "rollup.price_stats@v2.close"
atm_call_iv_chg_21d = "rollup.cp_iv_history@v1.atm_call_iv_chg_21d"
atm_put_iv_chg_21d = "rollup.cp_iv_history@v1.atm_put_iv_chg_21d"
adv_usd_20d = "rollup.price_stats@v2.adv_usd_20d"

[rank]
tie_break = "rollup.cp_iv_history@v1.atm_call_iv_chg_21d"
