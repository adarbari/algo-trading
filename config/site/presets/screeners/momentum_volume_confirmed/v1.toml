# 12-1 momentum confirmed by volume (ADR 0053, EB E1; a screener of edge momentum_12_1, the
# volume_price_confirmation_obv_cmf variant): positive 12-1 momentum with net buying over the last
# 20 sessions on both measures, on-balance volume rising (obv_trend_20d above 0) and closes in the
# upper half of the day's range on volume (cmf_20d above 0). Ranked by 12-1 momentum. Lee and
# Swaminathan (2000) find low-volume winners persist longer, the opposite reading of volume; OBV and
# CMF have no academic test of their own. Immutable: change it by adding v2.toml.
id = "momentum_volume_confirmed"
kind = "screener"
impl = "rules"
version = 1
name = "12-1 momentum, volume confirms"

# ------------------------------------------------ who is screened and tradeable (the site base gates;
# the same as momentum_12_1, so the variants compare on one universe)
[criteria.security_type]
field = "instrument.security_type"
op = "in"
value = ["COMMON_STOCK", "ADR", "ETF"]

[criteria.status]
field = "instrument.status"
op = "eq"
value = "ACTIVE"

[criteria.price]
field = "rollup.price_stats@v2.close"
op = "gt"
value = 5

[criteria.adv]
field = "rollup.price_stats@v2.adv_usd_20d"
op = "gte"
value = 50_000_000
mode = "soft"
tolerance = { relative = 0.2 }    # $40M-$50M is a near miss
on_miss = "LIQUIDITY_RISK"

# ------------------------------------------------------------------------ the signal
[criteria.mom_12_1]
field = "rollup.trend_stats@v2.mom_12_1"
op = "gt"
value = 0

[criteria.obv_trend]
field = "rollup.signed_volume@v1.obv_trend_20d"
op = "gt"
value = 0

[criteria.cmf]
field = "rollup.volume@v1.cmf_20d"
op = "gt"
value = 0

[columns]
close = "rollup.price_stats@v2.close"
mom_12_1 = "rollup.trend_stats@v2.mom_12_1"
ret_252d = "rollup.trend_stats@v2.ret_252d"
adv_usd_20d = "rollup.price_stats@v2.adv_usd_20d"
obv_trend_20d = "rollup.signed_volume@v1.obv_trend_20d"
cmf_20d = "rollup.volume@v1.cmf_20d"

[rank]
tie_break = "rollup.trend_stats@v2.mom_12_1"
