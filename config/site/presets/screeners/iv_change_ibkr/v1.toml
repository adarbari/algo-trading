# Rising IBKR IV30: The 21-session change of IBKR's 30-day implied volatility, a proxy for iv_change_call with a long history
# (IBKR's IV30 blends calls and puts, so the paper's call-only sign is not guaranteed; the licence is
# personal, ADR 0028). IBKR's IV is an optional source (ADR 0055), so the
# one criterion is soft: a name without a value is a near miss that ranks last, never a hard fail
# that empties the run. The ranking is the screen, largest rise first.
# Immutable: change it by adding v2.toml (architecture/preset_versions.toml).
id = "iv_change_ibkr"
kind = "screener"
impl = "rules"
version = 1
name = "Rising IBKR IV30"

# ------------------------------------------------ who is screened and tradeable (the site base gates;
# the same as momentum_12_1 for stocks, so the screens compare on one universe)
[criteria.security_type]
field = "instrument.security_type"
op = "in"
value = ["COMMON_STOCK", "ADR"]

[criteria.status]
field = "instrument.status"
op = "eq"
value = "ACTIVE"

[criteria.price]
field = "rollup.price_stats@v2.close"
op = "gt"
value = 5

[criteria.adv]
field = "rollup.price_stats@v2.adv_usd_20d"
op = "gte"
value = 50_000_000
mode = "soft"
tolerance = { relative = 0.2 }    # $40M-$50M is a near miss
on_miss = "LIQUIDITY_RISK"

# ------------------------------------------------------------------------ the signal
[criteria.ibkr_iv_chg_21d]
field = "rollup.ibkr_iv_history@v1.ibkr_iv_chg_21d"
op = "gt"
value = -5
mode = "soft"
tolerance = 1.0

[columns]
close = "rollup.price_stats@v2.close"
ibkr_iv_chg_21d = "rollup.ibkr_iv_history@v1.ibkr_iv_chg_21d"
ibkr_iv_chg_5d = "rollup.ibkr_iv_history@v1.ibkr_iv_chg_5d"
adv_usd_20d = "rollup.price_stats@v2.adv_usd_20d"

[rank]
tie_break = "rollup.ibkr_iv_history@v1.ibkr_iv_chg_21d"
