# Idiosyncratic-volatility decoy: every tradeable common stock or ADR with a four-factor IVOL
# value, the most volatile after the market, size, momentum, value and sector are taken out
# first (Ang, Hodrick, Xing and Zhang 2006: high IVOL went with lower returns). A decoy for the
# edge harness's battery (ADR 0053 amendment 2026-10-18, quality bar 9): an edge whose picks are
# the jumpy, speculative names must beat this ranking on the same sessions. The one criterion
# only asks that the value exists (a missing IVOL never passes, ADR 0030). What it does not
# check: trend, quality, liquidity beyond the base gates.
# Immutable: change it by adding v2.toml (architecture/preset_versions.toml).
id = "ivol_high"
kind = "screener"
impl = "rules"
version = 1
name = "Idiosyncratic volatility (high first)"
description = "Stocks ranked by volatility left after market, size, momentum, value and sector effects."

# ------------------------------------------------ who is screened and tradeable (the site base gates;
# the same as size_small, so the decoys compare on one universe; stocks only: an ETF has no
# idiosyncratic risk, jumps or Amihud ratio of its own worth ranking against an operating company)
[criteria.security_type]
field = "instrument.security_type"
op = "in"
value = ["COMMON_STOCK", "ADR"]

[criteria.status]
field = "instrument.status"
op = "eq"
value = "ACTIVE"

[criteria.price]
field = "rollup.price_stats@v2.close"
op = "gt"
value = 3

[criteria.adv]
field = "rollup.price_stats@v2.adv_usd_20d"
op = "gte"
value = 2_000_000

# ------------------------------------------------------------------------ the signal
[criteria.ivol]
field = "rollup.factor_betas@v1.ivol_252d"
op = "gt"
value = 0

[columns]
close = "rollup.price_stats@v2.close"
ivol_252d = "rollup.factor_betas@v1.ivol_252d"
beta_mkt = "rollup.factor_betas@v1.beta_mkt"
factor_status = "rollup.factor_betas@v1.factor_status"
adv_usd_20d = "rollup.price_stats@v2.adv_usd_20d"

[rank]
tie_break = "rollup.factor_betas@v1.ivol_252d"
