# 12-1 momentum with an own-trend filter (ADR 0053, EB E1; a screener of edge momentum_12_1, the
# stock_time_series_momentum overlay): the momentum_12_1 ranking, but only names whose own
# trend is up (stock_tsmom_sign 1: the 252-session return above 0 and the close above the 200-day
# average). It drops winners whose last month broke their trend. Ranked by 12-1 momentum. What it
# does not check: market timing (Goyal and Jegadeesh find the time-series edge is a net long
# position), crash risk, earnings. Immutable: change it by adding v2.toml.
id = "momentum_own_trend"
kind = "screener"
impl = "rules"
version = 1
name = "12-1 momentum, own trend up"
description = "Momentum leaders with a positive year and a close above the 200-day average."

# ------------------------------------------------ who is screened and tradeable (the site base gates;
# the same as momentum_12_1, so the variants compare on one universe)
[criteria.security_type]
field = "instrument.security_type"
op = "in"
value = ["COMMON_STOCK", "ADR", "ETF"]

[criteria.status]
field = "instrument.status"
op = "eq"
value = "ACTIVE"

[criteria.price]
field = "rollup.price_stats@v2.close"
op = "gt"
value = 5

[criteria.adv]
field = "rollup.price_stats@v2.adv_usd_20d"
op = "gte"
value = 50_000_000
mode = "soft"
tolerance = { relative = 0.2 }    # $40M-$50M is a near miss
on_miss = "LIQUIDITY_RISK"

# ------------------------------------------------------------------------ the signal
[criteria.mom_12_1]
field = "rollup.trend_stats@v2.mom_12_1"
op = "gt"
value = -1

[criteria.own_trend]
field = "feature.stock_tsmom_sign"
op = "eq"
value = 1

[columns]
close = "rollup.price_stats@v2.close"
mom_12_1 = "rollup.trend_stats@v2.mom_12_1"
ret_252d = "rollup.trend_stats@v2.ret_252d"
adv_usd_20d = "rollup.price_stats@v2.adv_usd_20d"
stock_tsmom_sign = "feature.stock_tsmom_sign"

[rank]
tie_break = "rollup.trend_stats@v2.mom_12_1"
