# Residual momentum (edge momentum_12_1, a variant): every tradeable name with a market-residual 12-1
# momentum value, ranked by it. The 12-1 return net of beta times SPY's return (Blitz, Huij and
# Martens 2011 strip the market, size and value; only the market is stored, so this is the nearest
# stored rule). Only asks that the value exists (a missing value never passes, ADR 0030): the
# ranking is the screen. What it does not check: size and value residuals, residual-volatility scaling.
# Immutable: change it by adding v2.toml (architecture/preset_versions.toml).
id = "residual_momentum"
kind = "screener"
impl = "rules"
version = 1
name = "Residual momentum"
description = "Last year's winners after removing what the market itself contributed."

# ------------------------------------------------ who is screened and tradeable (the site base gates;
# the same as momentum_12_1, so the variants compare on one universe)
[criteria.security_type]
field = "instrument.security_type"
op = "in"
value = ["COMMON_STOCK", "ADR", "ETF"]

[criteria.status]
field = "instrument.status"
op = "eq"
value = "ACTIVE"

[criteria.price]
field = "rollup.price_stats@v2.close"
op = "gt"
value = 5

[criteria.adv]
field = "rollup.price_stats@v2.adv_usd_20d"
op = "gte"
value = 50_000_000
mode = "soft"
tolerance = { relative = 0.2 }    # $40M-$50M is a near miss
on_miss = "LIQUIDITY_RISK"

# ------------------------------------------------------------------------ the signal
[criteria.resid_mom_12_1]
field = "rollup.momentum_variants@v1.resid_mom_12_1"
op = "gt"
value = -5

[columns]
close = "rollup.price_stats@v2.close"
resid_mom_12_1 = "rollup.momentum_variants@v1.resid_mom_12_1"
mom_12_1 = "rollup.trend_stats@v2.mom_12_1"
adv_usd_20d = "rollup.price_stats@v2.adv_usd_20d"

[rank]
tie_break = "rollup.momentum_variants@v1.resid_mom_12_1"
