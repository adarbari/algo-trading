# Lottery stocks (MAX), highest first: The MAX lottery measure (Bali, Cakici and Whitelaw 2011) as the lottery score of Boyer and Vorkink: the best
# one-day return of the last 21 sessions, ranked from the lowest up so that the most lottery-like
# names rank last (the avoid list). The criterion only asks that the value exists (a missing value
# never passes, ADR 0030). What it does not check: the option skew the paper sorts on.
# Immutable: change it by adding v2.toml (architecture/preset_versions.toml).
id = "lottery_max"
kind = "screener"
impl = "rules"
version = 1
name = "Lottery stocks (MAX), highest first"

# ------------------------------------------------ who is screened and tradeable (the site base gates;
# the same as momentum_12_1 for stocks, so the screens compare on one universe)
[criteria.security_type]
field = "instrument.security_type"
op = "in"
value = ["COMMON_STOCK", "ADR"]

[criteria.status]
field = "instrument.status"
op = "eq"
value = "ACTIVE"

[criteria.price]
field = "rollup.price_stats@v2.close"
op = "gt"
value = 5

[criteria.adv]
field = "rollup.price_stats@v2.adv_usd_20d"
op = "gte"
value = 50_000_000
mode = "soft"
tolerance = { relative = 0.2 }    # $40M-$50M is a near miss
on_miss = "LIQUIDITY_RISK"

# ------------------------------------------------------------------------ the signal
[criteria.max_ret_21d]
field = "rollup.max_return@v1.max_ret_21d"
op = "gt"
value = -1

[columns]
close = "rollup.price_stats@v2.close"
max_ret_21d = "rollup.max_return@v1.max_ret_21d"
adv_usd_20d = "rollup.price_stats@v2.adv_usd_20d"

[rank]
tie_break = "rollup.max_return@v1.max_ret_21d"
tie_break_order = "asc"
