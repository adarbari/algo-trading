# Frog in the pan (edge momentum_12_1, a variant): momentum winners (a positive 12-1 return) whose
# path rose on many small up days, not a few jumps (information discreteness below 0; Da, Gurun
# and Warachka 2014 sort winners on it and take the continuous ones), ranked by 12-1 momentum.
# A missing value never passes (ADR 0030). What it does not check: the 6-month hold of the paper
# (the edge holds one month), jumps in the skipped month.
# Immutable: change it by adding v2.toml (architecture/preset_versions.toml).
id = "frog_in_the_pan"
kind = "screener"
impl = "rules"
version = 1
name = "Frog in the pan"

# ------------------------------------------------ who is screened and tradeable (the site base gates;
# the same as momentum_12_1, so the variants compare on one universe)
[criteria.security_type]
field = "instrument.security_type"
op = "in"
value = ["COMMON_STOCK", "ADR", "ETF"]

[criteria.status]
field = "instrument.status"
op = "eq"
value = "ACTIVE"

[criteria.price]
field = "rollup.price_stats@v2.close"
op = "gt"
value = 5

[criteria.adv]
field = "rollup.price_stats@v2.adv_usd_20d"
op = "gte"
value = 50_000_000
mode = "soft"
tolerance = { relative = 0.2 }    # $40M-$50M is a near miss
on_miss = "LIQUIDITY_RISK"

# ------------------------------------------------------------------------ the signal
[criteria.winner]
field = "rollup.trend_stats@v2.mom_12_1"
op = "gt"
value = 0

[criteria.continuous]
field = "rollup.momentum_variants@v1.fip_12_1"
op = "lt"
value = 0

[columns]
close = "rollup.price_stats@v2.close"
mom_12_1 = "rollup.trend_stats@v2.mom_12_1"
fip_12_1 = "rollup.momentum_variants@v1.fip_12_1"
adv_usd_20d = "rollup.price_stats@v2.adv_usd_20d"

[rank]
tie_break = "rollup.trend_stats@v2.mom_12_1"
