# L3 site setting: the Cboe index series stored in macro/series (ADR 0048), the same [[series]]
# tables as macro.toml (read with it by load_macro; split out because macro.toml is at the 1000-line
# cap). Static CSVs on Cboe's CDN, personal non-commercial use, no redistribution.

# Cboe's own history files (EB D3): the term-structure indices FRED does not carry (VIX itself and
# VIX3M stay FRED's above: both give the same close). One static CSV per index on Cboe's CDN,
# fetched whole, `MM/DD/YYYY` dates. The file of a session is last modified about 17:30 New York
# time that day (measured 2026-10-17), so a one-day lag errs late. The VX futures by expiry are
# `volatility/vx_futures` (the `vx-futures` task), not series.
[[series]]
key = "VIX9D"                 # Cboe 9-day VIX close (2011-)
source = "published"
kind = "index"
cadence = "daily"
release_lag_days = 1
pit = "lag"
licence = "personal"
terms = "Cboe data (https://www.cboe.com/terms/): personal non-commercial use, no redistribution"
url = "https://cdn.cboe.com/api/global/us_indices/daily_prices/VIX9D_History.csv"
date_column = "DATE"
value_column = "CLOSE"

[[series]]
key = "VIX6M"                 # Cboe 6-month VIX close (2008-)
source = "published"
kind = "index"
cadence = "daily"
release_lag_days = 1
pit = "lag"
licence = "personal"
terms = "Cboe data (https://www.cboe.com/terms/): personal non-commercial use, no redistribution"
url = "https://cdn.cboe.com/api/global/us_indices/daily_prices/VIX6M_History.csv"
date_column = "DATE"
