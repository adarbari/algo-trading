# L3 site setting: the Guide's screener for the site preset net_share_issuance (ADR 0051; docs/ui/guide.md
# "The screener page"). The prose its page shows beside the preset's latest version (a preset
# version is immutable, its prose is not); the family is config/site/guide/sections.toml's.
# Keys: summary (the hero), hit (what a hit looks like), not_checked, before_acting (caveats,
# naming catalogue fields so the server links them), related (other screeners), sources, and
# [asks]: each criterion of the latest preset version in a few plain words. Typed by
# src/algotrade/config/site/guide/screeners.py; fitness tests in
# tests/unit/config/site/guide/test_screeners.py.
id = "net_share_issuance"
version = 1  # the preset version this prose was written for
line = "Stocks ranked by change in share count, biggest buybacks first."
summary = "Ranks every tradeable stock by how much its share count changed over the past year, from the biggest net buybacks down to the heaviest issuers. Companies that shrink their share count have beaten those that issue in the research;[^1][^2] the issuers at the bottom are the avoid list. A candidate edge under test."
hit = "The name is a listed common stock or ADR closing above $5 that trades at least $50M a day, and it has a year-over-year share count change. Every such name qualifies; the order is the point, the biggest net buyer of its own shares first."
not_checked = "It does not know why the count moved: an acquisition paid in shares looks like an issue, a spin-off or a split not yet adjusted can look like either, and option dilution beyond the reported count is missed. It does not check price or quality."
before_acting = [
  "The count is the cover-page figure when the company tags it: compare feature.shares_change_yoy with rollup.fundamentals@v4.shares_source before trusting a small change.",
  "A buyback can fund itself with debt: check feature.debt_to_equity and rollup.mispricing@v1.ohlson_o before treating a shrinking count as strength.",
  "Heavy issuers are often high asset growers: rollup.mispricing@v1.asset_growth shows whether the issue was spent on assets.",
]
related = [
  { id = "asset_growth", reason = "the investment side of the same financing" },
]

[[sources]]
title = "Pontiff and Woodgate, Share Issuance and Cross-Sectional Returns (2008)"
url = "https://ideas.repec.org/a/bla/jfinan/v63y2008i2p921-945.html"
note = "Share issuance predicts returns after 1970 more strongly than size, book-to-market or momentum."

[[sources]]
title = "Fama and French, Dissecting Anomalies (2008)"
url = "https://ideas.repec.org/a/bla/jfinan/v63y2008i4p1653-1678.html"
note = "The net stock issues anomaly appears in microcap, small and big stocks alike."

[asks]
security_type = "A common stock or ADR"
status = "Still listed and trading"
price = "Closes above $5"
adv = "Trades at least $50M a day"
issuance = "Has a year-over-year share count change"
