# L3 site setting: the Guide's screener for the site preset industry_momentum (ADR 0051; docs/ui/guide.md
# "The screener page"). The prose its page shows beside the preset's latest version (a preset
# version is immutable, its prose is not); the family is config/site/guide/sections.toml's.
# Typed by src/algotrade/config/site/guide/screeners.py; fitness tests in
# tests/unit/config/site/guide/test_screeners.py.
id = "industry_momentum"
version = 1  # the preset version this prose was written for
line = "Stocks ranked by how well their sector did over the last 12 months."
summary = "Ranks every tradeable name by the 12-month return of its sector, the strongest sector first. Moskowitz and Grinblatt find industries that did well keep doing well.[^1] It is a candidate edge under test."
hit = "The name is a listed stock, ADR or ETF closing above $5 that trades at least $50M a day, whose sector maps to one of the 11 sector funds with a year of history. Every name of one sector shares its value."
not_checked = "It does not look at the name itself: every stock of a sector ranks alike, and the order within a sector is arbitrary. Eleven sectors are coarser than the industries of the paper. The harness reads the spread across all names."
before_acting = [
  "Eleven sectors move together, so a run of a few years in one sector (technology after 2010) looks like a rule: read the harness's number by year before trusting it.",
  "A sector's year can end in one month; compare rollup.momentum_variants@v1.sector_ret_252d with the sector's shorter returns.",
]
related = [
  { id = "momentum_12_1", reason = "the name's own return, not its sector's" },
]

[[sources]]
title = "Moskowitz and Grinblatt, Do Industries Explain Momentum? (1999)"
url = "https://ideas.repec.org/a/bla/jfinan/v54y1999i4p1249-1290.html"
note = "Industry momentum is strong and accounts for much of the momentum in individual stocks."

[asks]
security_type = "A common stock, ADR or ETF"
status = "Still listed and trading"
price = "Closes above $5"
adv = "Trades at least $50M a day"
sector_ret_252d = "Its sector fund has a 12-month return"
