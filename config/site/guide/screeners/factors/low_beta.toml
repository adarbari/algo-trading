# L3 site setting: the Guide's screener for the site preset low_beta (ADR 0051; docs/ui/guide.md
# "The screener page"). The prose its page shows beside the preset's latest version (a preset
# version is immutable, its prose is not); the family is config/site/guide/sections.toml's.
# Typed by src/algotrade/config/site/guide/screeners.py; fitness tests in
# tests/unit/config/site/guide/test_screeners.py.
id = "low_beta"
version = 1  # the preset version this prose was written for
line = "Stocks that move least with the market, lowest first."
summary = "Ranks every tradeable name by its beta to SPY over the last year, the lowest first. Frazzini and Pedersen find low-beta names earn more for their risk than high-beta names.[^1] It is a candidate edge under test."
hit = "The name is a listed stock, ADR or ETF closing above $5 that trades at least $50M a day, with a positive beta over the last 252 sessions. Every such name qualifies; the lowest beta ranks first."
not_checked = "It does not shrink the beta toward 1, lever the low-beta names to match market risk, or wait for a 24-month market uptrend.[^2] A low beta earns less than the market in a rising one: the claim is about return per unit of risk."
before_acting = [
  "Raw excess return over SPY is expected to be low for low-beta names in a rising market; judge the harness's number with that in mind.",
  "Low-beta names are often utilities and staples that trade like bonds: check rollup.episode_behaviour@v1.beta_252d with the sector before reading it as safety.",
]
related = [
  { id = "low_volatility", reason = "the calmest names by volatility, not beta" },
]

[[sources]]
title = "Frazzini and Pedersen, Betting Against Beta (2014)"
url = "https://research-api.cbs.dk/ws/portalfiles/portal/60082899/lasse_heje_pedersen_et_al_betting_against_beta_publishersversion.pdf"
note = "Low-beta assets earn higher returns per unit of risk than high-beta assets, which the authors link to leverage limits."

[[sources]]
title = "Novy-Marx and Velikov, Betting Against Betting Against Beta (2022)"
url = "https://mysimon.rochester.edu/novy-marx/research/BABAB.pdf"
note = "The betting-against-beta result depends on how the portfolio is built, and its return comes mostly from tilts to profitability and investment."

[asks]
security_type = "A common stock, ADR or ETF"
status = "Still listed and trading"
price = "Closes above $5"
adv = "Trades at least $50M a day"
beta_252d = "Has a positive beta to SPY over the last year"
