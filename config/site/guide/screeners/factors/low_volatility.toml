# L3 site setting: the Guide's screener for the site preset low_volatility (ADR 0051; docs/ui/guide.md
# "The screener page"). The prose its page shows beside the preset's latest version (a preset
# version is immutable, its prose is not); the family is config/site/guide/sections.toml's.
# Typed by src/algotrade/config/site/guide/screeners.py; fitness tests in
# tests/unit/config/site/guide/test_screeners.py.
id = "low_volatility"
version = 1  # the preset version this prose was written for
line = "Stocks and funds with the smallest recent price swings, calmest first."
summary = "Ranks every tradeable name by its recent realised volatility, the calmest first. Blitz and van Vliet find the calmest stocks earn about as much as the wildest with far less risk.[^1] It is a candidate edge under test."
hit = "The name is a listed stock, ADR or ETF closing above $5 that trades at least $50M a day, with a 60-session realised volatility. Every such name qualifies; the calmest ranks first."
not_checked = "It does not use the paper's three-year volatility (60 sessions is the longest window stored), nor check beta, quality or the sector. A name calm for a quarter can still be a risky one."
before_acting = [
  "A takeover target pinned near its offer is the calmest name of all: check rollup.vol_stats@v1.hv60 near zero for one large day.",
  "Low-volatility names lagged the market from 2019 to 2024; the premium is about risk, not the raw return.",
]
related = [
  { id = "low_beta", reason = "the lowest beta, not the lowest volatility" },
]

[[sources]]
title = "Blitz and van Vliet, The Volatility Effect (2007)"
url = "https://papers.ssrn.com/abstract=980865"
note = "Low-volatility stocks earned returns at least as high as high-volatility stocks over 1986 to 2006, a gap of about 12 percent a year in alpha."

[asks]
security_type = "A common stock, ADR or ETF"
status = "Still listed and trading"
price = "Closes above $5"
adv = "Trades at least $50M a day"
hv60 = "Has a 60-session realised volatility"
