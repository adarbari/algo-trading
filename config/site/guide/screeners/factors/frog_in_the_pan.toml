# L3 site setting: the Guide's screener for the site preset frog_in_the_pan (ADR 0051; docs/ui/guide.md
# "The screener page"). The prose its page shows beside the preset's latest version (a preset
# version is immutable, its prose is not); the family is config/site/guide/sections.toml's.
# Typed by src/algotrade/config/site/guide/screeners.py; fitness tests in
# tests/unit/config/site/guide/test_screeners.py.
id = "frog_in_the_pan"
version = 1  # the preset version this prose was written for
summary = "Lists the past year's winners whose rise came on many small up days, not a few big jumps, strongest first. Da, Gurun and Warachka find momentum lasts when the news arrives gradually.[^1] It is a candidate edge under test."
hit = "The name is a listed stock, ADR or ETF closing above $5 that trades at least $50M a day, has a positive 12-1 return, and an information discreteness below 0 (more up days than down days over the window). The strongest 12-1 return ranks first."
not_checked = "It does not check how the last month moved, or the paper's six-month hold (the harness holds a month). Names without a full year of daily bars are left out."
before_acting = [
  "Information discreteness, rollup.momentum_variants@v1.fip_12_1, is the share of down days minus the share of up days: a value near 0 is a thin edge over a lumpy path, so read it as a tilt, not a switch.",
  "Smooth winners are often low-volatility names: compare with the low volatility list before crediting the path.",
]
related = [
  { id = "momentum_12_1", reason = "every winner, smooth or lumpy" },
]

[[sources]]
title = "Da, Gurun and Warachka, Frog in the Pan: Continuous Information and Momentum (2014)"
url = "https://www3.nd.edu/%7Ezda/Frog.pdf"
note = "Momentum lasts longer when a stock's gain came as steady small moves than as a few large jumps."

[asks]
security_type = "A common stock, ADR or ETF"
status = "Still listed and trading"
price = "Closes above $5"
adv = "Trades at least $50M a day"
winner = "Rose over the past year, last month left out"
continuous = "Rose on many small up days, not a few jumps"
