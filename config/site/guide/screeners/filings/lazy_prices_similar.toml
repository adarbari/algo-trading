# L3 site setting: the Guide's screener for the site preset lazy_prices_similar (ADR 0051; docs/ui/guide.md
# "The screener page"). Keys as in insider_cluster_buys.toml; typed by src/algotrade/config/site/guide/screeners.py.
id = "lazy_prices_similar"
version = 1  # the preset version this prose was written for
summary = "Finds liquid stocks whose latest 10-K or 10-Q reads almost the same as the one a year earlier. Research finds that firms which rewrite their reports do worse;[^1] this is a candidate edge under test, not a proven trade."
hit = "The name is a common stock closing above $5 that trades at least $1M a day, with a 10-K or 10-Q that became public in the last 150 days and a stored report from a year earlier to compare with. The most similar text ranks first."
not_checked = "It does not read what changed, only how much. A rewrite after a deal or a restatement is news the market prices at once, and a report that repeats last year's may simply be boilerplate.[^2]"
before_acting = [
  "A name with no stored report from a year earlier, or too little text to compare, has no value and is left out; it is never read as unchanged.",
  "Stable small firms repeat their text, so the list leans to size and low volatility: read rollup.trend_stats@v2.mom_12_1 beside it.",
  "A report counts from the first session whose close follows the SEC accepting it, not from the date on its cover.",
]
related = [
  { id = "risk_factor_unchanged", reason = "the same idea on the risk-factor section only" },
  { id = "size_small", reason = "the size baseline the edge is compared with" },
]

[[sources]]
title = "Cohen, Malloy and Nguyen, Lazy Prices (2020)"
url = "https://www.nber.org/papers/w25084"
note = "Firms that change their reports little outperform those that rewrite them."

[[sources]]
title = "Brown and Tucker, Year-over-Year MD&A Modifications (2011)"
url = "https://doi.org/10.1111/j.1475-679X.2010.00396.x"
note = "Measures how much a report changes from the year before and how prices react."

[asks]
security_type = "A common stock"
status = "Still listed and trading"
price = "Closes above $5"
adv = "Trades at least $1M a day"
similarity = "Has a similarity value, the most similar first"
