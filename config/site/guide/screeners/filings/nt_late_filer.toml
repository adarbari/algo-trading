# L3 site setting: the Guide's screener for the site preset nt_late_filer (ADR 0051; docs/ui/guide.md
# "The screener page"). The prose its page shows beside the preset's latest version (a preset
# version is immutable, its prose is not); the family is config/site/guide/sections.toml's.
# Keys: summary (the hero), hit (what a hit looks like), not_checked, before_acting (caveats,
# naming catalogue fields so the server links them), related (other screeners), sources, and
# [asks]: each criterion of the latest preset version in a few plain words. Typed by
# src/algotrade/config/site/guide/screeners.py; fitness tests in
# tests/unit/config/site/guide/test_screeners.py.
id = "nt_late_filer"
version = 1  # the preset version this prose was written for
line = "Stocks that filed a late-report notice in the last month."
summary = "Finds liquid stocks that filed a late-filing notice (NT 10-K or NT 10-Q) in the last month: an exclusion list for longs and the short side of the late-filer edge.[^1] It is a candidate edge under test, not a proven trade."
hit = "The name is a common stock closing above $5 that trades at least $5M a day and filed an NT 10-K or NT 10-Q that became known within the last 20 sessions, counting from the first session after it was accepted. The most liquid ranks first."
not_checked = "It does not read the reason in the notice (a routine delay and an accounting problem look the same) or know that the report was filed since. It is the screen of the late-filer edge, which the harness is still testing."
before_acting = [
  "Most late filers are small and thin: gate on rollup.price_stats@v2.adv_usd_20d, as this screen does, and expect few liquid names.",
  "Check rollup.filing_events@v1.sessions_since_late_filing: the longer ago the notice, the more likely the report is already filed.",
  "Shorting a distressed name costs a hard borrow; for most people the use is to exclude the name from a long screen.",
]
related = [
  { id = "eight_k_adverse_items", reason = "the other filing-based avoid list" },
  { id = "size_small", reason = "the size baseline the edge is compared with" },
]

[[sources]]
title = "Dee, Hillison and Pacini, No News Is Bad News: Market Reaction to Reasons Given for Late Filing of Form 10-K (2010)"
url = "https://www.academia.edu/49701054/No_news_is_bad_news_Market_reaction_to_reasons_given_for_late_filing_of_Form_10_K"
note = "Finds firms with no substantive reason for a late 10-K lose value, while those that give one do not."

[asks]
security_type = "A common stock"
status = "Still listed and trading"
price = "Closes above $5"
adv = "Trades at least $5M a day"
late_filing = "Filed a late-filing notice in the last 20 sessions"
