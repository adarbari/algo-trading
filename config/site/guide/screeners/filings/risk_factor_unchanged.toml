# L3 site setting: the Guide's screener for the site preset risk_factor_unchanged (ADR 0051; docs/ui/guide.md
# "The screener page"). Keys as in insider_cluster_buys.toml; typed by src/algotrade/config/site/guide/screeners.py.
id = "risk_factor_unchanged"
version = 1  # the preset version this prose was written for
line = "Annual reports whose risk factors match the year before."
summary = "Finds liquid stocks whose latest 10-K lists nearly the same risk factors as the 10-K a year earlier. Research finds that firms which rewrite their risk section do worse;[^2] this is a candidate edge under test, not a proven trade."
hit = "The name is a common stock closing above $5 that trades at least $1M a day, with a 10-K that became public in the last 400 days and a stored 10-K from the year before, both with a risk section long enough to compare. The most similar section ranks first."
not_checked = "It does not read what the new risks say, only how much the section changed. Risk sections tend to grow every year, and a rewrite can be a lawyer's style choice, not news.[^1]"
before_acting = [
  "A 10-K with no stored prior year, or a risk section that is missing or short in either year, has no value and is left out.",
  "The 10-K is annual, so the value can be up to 400 days old; a 10-K counts from the first session whose close follows the SEC accepting it.",
  "Stable firms repeat their text, so the list leans to size and low volatility: read rollup.trend_stats@v2.mom_12_1 beside it.",
]
related = [
  { id = "lazy_prices_similar", reason = "the same idea on the whole report" },
  { id = "size_small", reason = "the size baseline the edge is compared with" },
]

[[sources]]
title = "Campbell and others, The information content of mandatory risk factor disclosures in corporate filings (2014)"
url = "https://doi.org/10.1007/s11142-013-9258-3"
note = "Risk-factor text is firm-specific and carries information for investors."

[[sources]]
title = "Cohen, Malloy and Nguyen, Lazy Prices (2020)"
url = "https://www.nber.org/papers/w25084"
note = "Firms that change their reports little outperform those that rewrite them."

[asks]
security_type = "A common stock"
status = "Still listed and trading"
price = "Closes above $5"
adv = "Trades at least $1M a day"
similarity = "Has a similarity value, the most similar first"
