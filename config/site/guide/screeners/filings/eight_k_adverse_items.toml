# L3 site setting: the Guide's screener for the site preset eight_k_adverse_items (ADR 0051; docs/ui/guide.md
# "The screener page"). The prose its page shows beside the preset's latest version (a preset
# version is immutable, its prose is not); the family is config/site/guide/sections.toml's.
# Keys: summary (the hero), hit (what a hit looks like), not_checked, before_acting (caveats,
# naming catalogue fields so the server links them), related (other screeners), sources, and
# [asks]: each criterion of the latest preset version in a few plain words. Typed by
# src/algotrade/config/site/guide/screeners.py; fitness tests in
# tests/unit/config/site/guide/test_screeners.py.
id = "eight_k_adverse_items"
version = 1  # the preset version this prose was written for
summary = "Finds liquid stocks that disclosed an 8-K with Item 4.02 (non-reliance on past financials), 4.01 (a change of auditor) or 5.02 (an officer or director leaving or joining) in the last month: an avoid list, and the short side of the 8-K drift edge.[^1] It is a candidate edge under test, not a proven trade."
hit = "The name is a common stock closing above $5 that trades at least $5M a day and has one of those 8-K items known within the last 20 sessions, counting from the first session after the filing was accepted. The most liquid ranks first."
not_checked = "It does not read the text: a 5.02 can be a retirement and a 4.01 a planned rotation. It does not know the reason behind a 4.02 or whether the news is already in the price. It is the screen of the adverse 8-K drift edge, which the harness is still testing."
before_acting = [
  "Only Item 4.02 is tested by the edge: read feature.eight_k_item_flag as a list to look at, not a list to short.",
  "Shorting a name that just disclosed a restatement costs a hard borrow and wide spreads; for most people the use is to avoid the name.",
  "A name with no tracked filing has no value, which is unknown, not clean: see rollup.filing_events@v1.sessions_since_8k_4_02.",
]
related = [
  { id = "nt_late_filer", reason = "the other filing-based avoid list" },
  { id = "size_small", reason = "the size baseline the edge is compared with" },
]

[[sources]]
title = "Lerman and Livnat, The New Form 8-K Disclosures (2010)"
url = "https://ideas.repec.org/a/spr/reaccs/v15y2010i4d10.1007_s11142-009-9114-7.html"
note = "Studies the 2004 expansion of Form 8-K items and finds some items are followed by return drift."

[asks]
security_type = "A common stock"
status = "Still listed and trading"
price = "Closes above $5"
adv = "Trades at least $5M a day"
adverse_item = "Disclosed an adverse 8-K item in the last 20 sessions"
