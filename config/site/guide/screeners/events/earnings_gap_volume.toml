# L3 site setting: the Guide's screener for the site preset earnings_gap_volume (ADR 0051; docs/ui/guide.md
# "The screener page"). The prose its page shows beside the preset's latest version (a preset
# version is immutable, its prose is not); the family is config/site/guide/sections.toml's.
# Keys: summary (the hero), hit (what a hit looks like), not_checked, before_acting (caveats,
# naming catalogue fields so the server links them), related (other screeners), sources, and
# [asks]: each criterion of the latest preset version in a few plain words. Typed by
# src/algotrade/config/site/guide/screeners.py; fitness tests in
# tests/unit/config/site/guide/test_screeners.py.
id = "earnings_gap_volume"
version = 1  # the preset version this prose was written for
line = "Stocks up 10% beyond the market on earnings, on three times usual volume."
summary = "Finds liquid stocks that jumped at least 10% more than the market on their latest earnings report on at least three times their usual volume, biggest jump first: the episodic pivot of growth-stock screeners, with the volume confirmation.[^2] It is a candidate edge under test, not a proven trade."
hit = "The name is a common stock closing above $5 that trades at least $5M a day, whose close after the report beat SPY's by 10% or more measured from the close before it, with the report's three sessions trading at least three times the volume of the 20 sessions before. The biggest reaction ranks first."
not_checked = "It does not know why the stock moved (earnings, guidance, a bid or an offering look the same), whether the name had gone nowhere for months, or the opening gap: only closes are stored, so you buy a session later. It is the screen of the earnings gap edge, which the harness is still testing."
before_acting = [
  "A reaction of +10% or more can already be the whole move: rollup.earnings_reaction@v1.reaction_excess_return runs to the close after the report, and you can only buy a session later.[^1]",
  "Heavy volume can come from an offering or an index change in the window: read rollup.earnings_gap_volume@v1.reaction_volume_ratio beside the price and the news.",
  "The same names without the volume rule are the earnings_gap_only screen: the edge asks whether the volume adds anything to a plain gap.",
]
related = [
  { id = "earnings_gap_only", reason = "the same screen without the volume rule" },
  { id = "pead_small_cap", reason = "the small-cap post-earnings drift screen" },
]

[[sources]]
title = "Bernard and Thomas, Post-Earnings-Announcement Drift: Delayed Price Response or Risk Premium? (1989)"
url = "https://doi.org/10.2307/2491062"
note = "Shows stocks keep moving in the direction of an earnings surprise for about 60 trading days."

[[sources]]
title = "Gervais, Kaniel and Mingelgrin, The High-Volume Return Premium (2001)"
url = "https://ideas.repec.org/a/bla/jfinan/v56y2001i3p877-919.html"
note = "Finds stocks with unusually high volume over a day or a week outperform over the next month."

[asks]
security_type = "A common stock"
status = "Still listed and trading"
price = "Closes above $5"
adv = "Trades at least $5M a day"
reaction_status = "Its last report has a complete reaction window"
reaction = "Beat SPY by 10% or more over the report"
volume = "Traded at least three times its usual volume around the report"
