# L3 site setting: the Guide's screener for the site preset pre_earnings_reversal (ADR 0051; docs/ui/guide.md
# "The screener page"). The prose its page shows beside the preset's latest version (a preset
# version is immutable, its prose is not); the family is config/site/guide/sections.toml's.
# Keys: summary (the hero), hit (what a hit looks like), not_checked, before_acting (caveats,
# naming catalogue fields so the server links them), related (other screeners), sources, and
# [asks]: each criterion of the latest preset version in a few plain words. Typed by
# src/algotrade/config/site/guide/screeners.py; fitness tests in
# tests/unit/config/site/guide/test_screeners.py.
id = "pre_earnings_reversal"
version = 1  # the preset version this prose was written for
summary = "Ranks liquid stocks by their return over the last 3 sessions, the biggest losers first. The edge applies it to names about to report: the literature finds the losers into an earnings date beat the winners over the report window.[^1]"
hit = "The name is a listed stock closing above $5 that trades at least $50M a day with a 3-session return. Every such name qualifies; the lowest return ranks first. The edge keeps only names with a report two sessions away."
not_checked = "It does not check the report date itself (the edge does), the size quintile the paper uses, or news behind the fall. It reads the 3 sessions to the decision close, one session older than the paper's entry."
before_acting = [
  "A date moved or estimated from last year can leave the name without a report in the window.",
  "A fall on news is not an inventory effect: read the filings of the last sessions.",
]
related = [
  { id = "earnings_neutral_reversal", reason = "the month's move without earnings days" },
]

[[sources]]
title = "So and Wang, News-Driven Return Reversals: Liquidity Provision Ahead of Earnings Announcements (2014)"
url = "https://ideas.repec.org/a/eee/jfinec/v114y2014i1p20-35.html"
note = "Finds short-term reversals are about six times larger in the days before earnings announcements."

[asks]
security_type = "A common stock or ADR"
status = "Still listed and trading"
price = "Closes above $5"
adv = "Trades at least $50M a day"
ret_3d = "Has a 3-session return"
