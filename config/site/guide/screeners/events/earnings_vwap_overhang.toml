# L3 site setting: the Guide's screener for the site preset earnings_vwap_overhang (ADR 0051; docs/ui/guide.md
# "The screener page"). The prose its page shows beside the preset's latest version (a preset
# version is immutable, its prose is not); the family is config/site/guide/sections.toml's.
# Keys: summary (the hero), hit (what a hit looks like), not_checked, before_acting (caveats,
# naming catalogue fields so the server links them), related (other screeners), sources, and
# [asks]: each criterion of the latest preset version in a few plain words. Typed by
# src/algotrade/config/site/guide/screeners.py; fitness tests in
# tests/unit/config/site/guide/test_screeners.py.
id = "earnings_vwap_overhang"
version = 1  # the preset version this prose was written for
summary = "Ranks liquid stocks by how far the close sits above the volume-weighted average price since the last earnings report: a proxy for holders' unrealised gain.[^1] Names most above their cost basis rank first. It is a candidate edge under test."
hit = "The name is a common stock or ADR closing above $5 that trades at least $50M a day and has an earnings-anchored VWAP. Every such name qualifies; the order is the point, largest overhang first."
not_checked = "It does not check the anchor's age (a fresh one sits near the price), the reason for the move since the report, or a retest of the average from above. The overhang of the study uses years of turnover; this one starts at the last report."
before_acting = [
  "A report a few sessions old gives an average close to the price: read rollup.anchored_vwap@v2.avwap_anchor_date before trusting the rank.",
  "Names far above the average are extended; the top of the list is also the top of momentum, so compare with momentum_12_1.",
  "The proxy window is at most 126 sessions, not the multi-year window of the study.",
]
related = [
  { id = "momentum_12_1", reason = "the signal the overhang partly explains" },
  { id = "pead_small_cap", reason = "another drift after earnings" },
]

[[sources]]
title = "Grinblatt and Han, Prospect Theory, Mental Accounting, and Momentum (2005)"
url = "https://ideas.repec.org/a/eee/jfinec/v78y2005i2p311-339.html"
note = "Argues investors hold losing stocks too long, which makes prices react slowly and looks like momentum."

[asks]
security_type = "A common stock or ADR"
status = "Still listed and trading"
price = "Closes above $5"
adv = "Trades at least $50M a day"
overhang = "Has a VWAP since the last earnings report"
