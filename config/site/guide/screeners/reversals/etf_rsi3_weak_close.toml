# L3 site setting: the Guide's screener for the site preset etf_rsi3_weak_close (ADR 0051; docs/ui/guide.md
# "The screener page"). Keys and tests as in screeners/trend/momentum_own_trend.toml.
id = "etf_rsi3_weak_close"
version = 1  # the preset version this prose was written for
summary = "Lists unleveraged ETFs that fell hard over the last three sessions and closed in the lower half of the day's range, the deepest sell-off first. It is the entry rule of a multi-day index ETF reversal under test.[^1][^2]"
hit = "An unleveraged ETF whose Cutler RSI over 3 sessions is under 10 (nearly all of the last three days' movement was down) and whose close sits no higher than halfway up the session's high-low range. The lowest RSI ranks first. A name with a gap in the last four sessions is absent."
not_checked = "It does not check the trend, the market's volatility, the volume of the day or liquidity. The edge's own list of index funds is what limits the names, and the setup's exit (leave when the 3-session RSI is back above 40) is not part of this list."
before_acting = [
  "The reversal is documented on index ETFs and faded after about 2011: read the setup's measured result, not the study's.",
  "A sharp three-day drop in a market that is still falling keeps falling: the setup's trend-filter variant shows whether a close above the 200-day average changes the result.",
  "The setup can only enter at the close after the screen, a day later than the study: part of the study's gain was the next day's move, which is not available here.",
]
related = [
  { id = "etf_low_ibs", reason = "the one-day weak-close rule of the same study, without the sell-off test" },
  { id = "oversold_reversal", reason = "a list of oversold stocks" },
]

[[sources]]
title = "Pagonidis, The IBS Effect: Mean Reversion in Equity ETFs (2013)"
url = "https://naaim.org/whitepaper/the-ibs-effect-mean-reversion-in-equity-etfs/"
note = "Reports that buying an ETF with a 3-day RSI under 10 and a weak close, and holding while it stays under 40, beat the one-day rule."

[[sources]]
title = "Connors and Alvarez, Short Term Trading Strategies That Work (2009)"
url = "https://openlibrary.org/works/OL19901979W"
note = "Backtests short-term RSI mean-reversion rules on indexes and ETFs."

[asks]
security_type = "An ETF"
status = "Still listed and trading"
not_leveraged = "Not a leveraged fund"
not_inverse = "Not an inverse fund"
rsi3 = "Fell hard over the last three sessions (3-session RSI under 10)"
ibs = "Closed in the lower half of the day's range"
