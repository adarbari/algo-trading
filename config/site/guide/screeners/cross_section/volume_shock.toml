# L3 site setting: the Guide's screener for the site preset volume_shock (ADR 0051; docs/ui/guide.md
# "The screener page"). The prose its page shows beside the preset's latest version (a preset
# version is immutable, its prose is not); the family is config/site/guide/sections.toml's.
# Keys: summary (the hero), hit (what a hit looks like), not_checked, before_acting (caveats,
# naming catalogue fields so the server links them), related (other screeners), sources, and
# [asks]: each criterion of the latest preset version in a few plain words. Typed by
# src/algotrade/config/site/guide/screeners.py; fitness tests in
# tests/unit/config/site/guide/test_screeners.py.
id = "volume_shock"
version = 1  # the preset version this prose was written for
summary = "Finds liquid stocks whose volume today is unusually high against their own last 20 sessions, the setup of the high-volume return premium: visibility from a volume shock is thought to bring buyers over the next weeks.[^1][^2]"
hit = "The name is a listed stock closing above $5 that trades at least $50M a day and whose volume today is at least two standard deviations above the mean of the 20 sessions before. The biggest shock ranks first."
not_checked = "It does not know why the volume came: an earnings report, a takeover or an index change look the same. It does not read the day's return, whose sign changes how the paper's effect behaves."
before_acting = [
  "Earnings days carry the most volume shocks; the premium is meant for shocks without a report, which volume_shock_no_news selects.",
  "A shock with an extreme return is attention buying that tends to reverse within days: compare rollup.trend_stats@v2.ret_1d.",
]
related = [
  { id = "volume_shock_no_news", reason = "the same shock with nothing to explain it" },
]

[[sources]]
title = "Gervais, Kaniel and Mingelgrin, The High-Volume Return Premium (2001)"
url = "https://ideas.repec.org/a/bla/jfinan/v56y2001i3p877-919.html"
note = "Stocks with unusually high trading volume over a day or week tend to rise over the next month."

[[sources]]
title = "Kaniel, Ozoguz and Starks, The High Volume Return Premium: Cross-Country Evidence (2012)"
url = "https://ideas.repec.org/a/eee/jfinec/v103y2012i2p255-279.html"
note = "The high-volume return premium appears in 41 countries and is not explained by risk or liquidity."

[asks]
security_type = "A common stock or ADR"
status = "Still listed and trading"
price = "Closes above $5"
adv = "Trades at least $50M a day"
volume_shock = "Volume is 2 or more standard deviations above its 20-session mean"
