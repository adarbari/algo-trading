# L3 site setting: the Guide's screener for the site preset momentum_squeeze_entry (ADR 0051; docs/ui/guide.md
# "The screener page"). The prose its page shows beside the preset's latest version (a preset
# version is immutable, its prose is not); the family is config/site/guide/sections.toml's.
# Typed by src/algotrade/config/site/guide/screeners.py; fitness tests in
# tests/unit/config/site/guide/test_screeners.py.
id = "momentum_squeeze_entry"
version = 1  # the preset version this prose was written for
line = "Past-year winners in an uptrend whose price bands are the narrowest in a year."
summary = "Finds past-year winners in an uptrend whose price bands have narrowed to the tightest fifth of their year, ranked by 12-1 momentum. It tests whether a tight base is a better entry into momentum.[^2] It is a candidate edge under test."
hit = "The name closes above $5, trades at least $50M a day, has positive 12-1 momentum, sits in an UPTREND, and its Bollinger bandwidth is in the narrowest 20% of the last 252 sessions."
not_checked = "It does not check the depth or length of the base, volume drying up or earnings dates. A squeeze says a larger move is likely, not which way.[^1]"
before_acting = [
  "A squeeze can resolve down; the uptrend and momentum supply the direction, and a trend can end: read feature.trend_state beside the band width.",
  "A quiet market narrows every name's bands: read rollup.bands@v2.bb_width_pctile_252d against the name's own year, not against other names.",
  "Few names pass at a month end, so the harness sees a short list; judge the result by its count of sessions.",
]
related = [
  { id = "momentum_pullback_entry", reason = "another entry rule for the same momentum names" },
  { id = "range_breakout", reason = "the breakout that often follows a squeeze" },
]

[[sources]]
title = "Bollinger, Bollinger on Bollinger Bands (2001)"
url = "https://books.apple.com/us/book/bollinger-on-bollinger-bands/id498453722"
note = "Defines bandwidth and the Squeeze, a narrow band that comes before a larger move."

[[sources]]
title = "Bajgrowicz and Scaillet, Technical Trading Revisited (2012)"
url = "https://ideas.repec.org/a/eee/jfinec/v106y2012i3p473-491.html"
note = "Shows the apparent profits of technical trading rules fade once data snooping and low trading costs are allowed for."

[asks]
security_type = "A common stock, ADR or ETF"
status = "Still listed and trading"
price = "Closes above $5"
adv = "Trades at least $50M a day"
mom_12_1 = "A past-year winner: positive 12-1 momentum"
trend = "In an uptrend"
squeeze = "Bands narrower than 80% of the last year"
