# L3 site setting: the Guide's screener for the site preset etf_priced (ADR 0051; docs/ui/guide.md
# "The screener page"). Keys and tests as in screeners/trend/momentum_own_trend.toml.
id = "etf_priced"
version = 1  # the preset version this prose was written for
summary = "Lists every listed ETF with a close, the highest price first. It is a pass-through for allocation edges whose signal sits in the book's outcome, not in this list."
hit = "An ETF that is listed and trading with a positive close. The rank is the price, which carries no meaning: the edge's own list of funds is what limits the names."
not_checked = "It does not test trend, leverage, inverse exposure or liquidity. The volatility-managed and short-volatility edges read their signal from a size target or a canary.[^1]"
before_acting = [
  "A pass on this list says nothing about the fund. Read the edge's page for the rule that sizes or gates the book.",
  "It allows leveraged and inverse funds on purpose, so a short-volatility fund can be held. Check the edge's list for what it names.",
  "The rank is the price and should be ignored; with one fund in the edge there is nothing to rank.",
]
related = [
  { id = "trend_positive_12m", reason = "a trend test on the same kind of fund" },
]

[[sources]]
title = "Harvey and others, The Impact of Volatility Targeting (2018)"
url = "https://scholars.duke.edu/publication/1370354"
note = "Scaling positions to a volatility target improves risk-adjusted returns for stocks and credit and cuts extreme losses across asset classes."

[asks]
security_type = "An ETF"
status = "Still listed and trading"
priced = "A positive close"
