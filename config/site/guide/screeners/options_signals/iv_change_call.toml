# L3 site setting: the Guide's screener for the site preset iv_change_call (ADR 0051; docs/ui/guide.md
# "The screener page"). The prose its page shows beside the preset's latest version (a preset
# version is immutable, its prose is not); the family is config/site/guide/sections.toml's.
# Keys: summary (the hero), hit (what a hit looks like), not_checked, before_acting (caveats,
# naming catalogue fields so the server links them), related (other screeners), sources, and
# [asks]: each criterion of the latest preset version in a few plain words. Typed by
# src/algotrade/config/site/guide/screeners.py; fitness tests in
# tests/unit/config/site/guide/test_screeners.py.
id = "iv_change_call"
version = 1  # the preset version this prose was written for
summary = "Ranks every liquid optionable stock by how much its at-the-money call implied volatility rose over the last 21 sessions. The option literature reads a rise in call IV as demand for upside that the stock has not yet priced.[^1]"
hit = "The name is a listed stock closing above $5 that trades at least $50M a day and has an at-the-money call IV now and 21 sessions ago. Every such name qualifies; the largest rise ranks first."
not_checked = "It does not read the put side (a rise in put IV is the opposite signal in the paper), and it does not exclude windows that contain an earnings report, where IV ramps for a known reason."
before_acting = [
  "Both ends need a stored chain, and chains exist from 2026-10-02 only: no name has a 21-session change before 2026-11-02.",
  "IV rises after a rally too: compare rollup.cp_iv_history@v1.atm_call_iv_chg_21d with rollup.cp_iv_history@v1.atm_put_iv_chg_21d; both rising is a volatility move, not a call-side one.",
]
related = [
  { id = "iv_change_ibkr", reason = "the same change from IBKR's blended IV30, with a longer history" },
  { id = "cp_iv_spread", reason = "the call-put spread of the same family" },
]

[[sources]]
title = "An, Ang, Bali and Cakici, The Joint Cross Section of Stocks and Options (2014)"
url = "https://www.nber.org/papers/w19590"
note = "Stocks whose call implied volatility rose over the past month earned higher returns, and those whose put implied volatility rose earned lower returns."

[asks]
security_type = "A common stock or ADR"
status = "Still listed and trading"
price = "Closes above $5"
adv = "Trades at least $50M a day"
atm_call_iv_chg_21d = "Has a 21-session change of its at-the-money call IV"
