# L3 site setting: the Guide's screener for the site preset earnings_move_rich (ADR 0051; docs/ui/guide.md
# "The screener page"). Keys and tests as in screeners/income/vrp_scanner.toml.
id = "earnings_move_rich"
version = 1  # the preset version this prose was written for
summary = "Finds S&P 500 stocks whose options price the next earnings report well above what the stock has moved on its last eight reports: the setting a seller of the report looks for.[^1]"
hit = "An S&P 500 common stock with listed options, closing above $5 on at least $50M of 20-day dollar volume, with a tradeable option execution tier of A or B. The straddle for the report is at least 1.3 times its mean report move. The richest comes first."
not_checked = "It does not check whether this report will move less than the straddle prices, the spreads at the strikes you would trade, or why the straddle is rich. A deal or a new product can make a high price right."
before_acting = [
  "The straddle also pays for the days before the report and after it: read rollup.implied_move@v1.move_dte, a farther expiry reads richer.",
  "One outlier report in the last eight inflates the average and makes the ratio read cheap, never rich: compare rollup.earnings_reaction@v2.abs_move_median_8.",
  "Check rollup.earnings_reaction@v2.abs_moves_counted: the ratio needs at least four past reports, and a name that changed is averaged with its old self.",
]
related = [
  { id = "earnings_move_cheap", reason = "the other side: a straddle priced below the name's past report moves" },
  { id = "iv_rank_high", reason = "high implied volatility, which a report inside the month lifts by itself" },
]

[[sources]]
title = "Site convention: implied against realised earnings moves"
url = "https://www.tastylive.com/concepts-strategies/expected-move"
note = "Practitioner description of the expected move; the site's ratio against past moves is its own and unproven until the harness tests it."

[asks]
security_type = "A common stock"
status = "Still listed and trading"
sp500 = "In the S&P 500"
optionable = "Has listed options"
price = "Closes above $5"
adv = "Trades at least $50M a day"
execution = "A tradeable option execution tier, A or B"
earnings_move_rich = "Options price the report at 1.3 times its past moves or more"
