# L3 site setting: the Guide's screener for the site preset iv_change_ibkr (ADR 0051; docs/ui/guide.md
# "The screener page"). The prose its page shows beside the preset's latest version (a preset
# version is immutable, its prose is not); the family is config/site/guide/sections.toml's.
# Keys: summary (the hero), hit (what a hit looks like), not_checked, before_acting (caveats,
# naming catalogue fields so the server links them), related (other screeners), sources, and
# [asks]: each criterion of the latest preset version in a few plain words. Typed by
# src/algotrade/config/site/guide/screeners.py; fitness tests in
# tests/unit/config/site/guide/test_screeners.py.
id = "iv_change_ibkr"
version = 1  # the preset version this prose was written for
summary = "Ranks every liquid optionable stock by how much IBKR's 30-day implied volatility rose over the last 21 sessions. It stands in for the call-IV change of the option literature[^1] with a history of about 500 sessions, at the cost of blending calls and puts."
hit = "The name is a listed stock closing above $5 that trades at least $50M a day and has an IBKR IV30 now and 21 sessions ago. Every such name qualifies; the largest rise ranks first."
not_checked = "It does not separate calls from puts, so a fall-driven rise in put IV ranks like a rise in call IV, and it does not exclude earnings windows. IBKR's IV is for personal use only."
before_acting = [
  "A blended IV30 rises on bad news as well as good: read it beside rollup.cp_iv_history@v1.atm_call_iv_chg_21d once chains accrue.",
  "IBKR had no IV on some days; a gap on either day leaves the name without a value, and a gap is not filled.",
]
related = [
  { id = "iv_change_call", reason = "the call-side change from our own chains" },
]

[[sources]]
title = "An, Ang, Bali and Cakici, The Joint Cross Section of Stocks and Options (2014)"
url = "https://www.nber.org/papers/w19590"
note = "Stocks whose call implied volatility rose over the past month earned higher returns, and those whose put implied volatility rose earned lower returns."

[asks]
security_type = "A common stock or ADR"
status = "Still listed and trading"
price = "Closes above $5"
adv = "Trades at least $50M a day"
ibkr_iv_chg_21d = "Has a 21-session change of IBKR's IV30"
