# L3 site setting: the Guide's screener for the site preset cp_iv_spread_rise (ADR 0051; docs/ui/guide.md
# "The screener page"). The prose its page shows beside the preset's latest version (a preset
# version is immutable, its prose is not); the family is config/site/guide/sections.toml's.
# Keys: summary (the hero), hit (what a hit looks like), not_checked, before_acting (caveats,
# naming catalogue fields so the server links them), related (other screeners), sources, and
# [asks]: each criterion of the latest preset version in a few plain words. Typed by
# src/algotrade/config/site/guide/screeners.py; fitness tests in
# tests/unit/config/site/guide/test_screeners.py.
id = "cp_iv_spread_rise"
version = 1  # the preset version this prose was written for
line = "Stocks where the call-put price gap widened most over five sessions."
summary = "Ranks every liquid optionable stock by how much its call-put implied volatility spread rose over the last 5 sessions. It is the screen of the pre-earnings call-put spread edge: a climbing spread before a report is read as informed buying in the calls.[^1]"
hit = "The name is a listed stock closing above $5 that trades at least $50M a day and has a call-put IV spread now and five sessions ago. Every such name qualifies; the largest rise ranks first."
not_checked = "It does not check the spread's level, the option volume behind the move, or whether the move is only the report approaching. The edge harness restricts it to names with a report expected, and is still testing it."
before_acting = [
  "Both ends of the change need a stored chain, and chains exist from 2026-10-02 only: a name with a gap on either day has no value.",
  "A change of a few vol points on thin quotes is noise; rollup.cp_iv@v1.cp_iv_dte shows whether the expiry rolled between the two days.",
]
related = [
  { id = "cp_iv_spread", reason = "the level of the same spread" },
]

[[sources]]
title = "Lei, Wang and Yan, Volatility Spread and Stock Market Response to Earnings Announcements (2020)"
url = "https://leiq.bus.umich.edu/papers/Lei_Wang_Yan_JBF_2020.pdf"
note = "The call-put spread climbs as an earnings report nears, and the climb goes with a larger price response to the report."

[asks]
security_type = "A common stock or ADR"
status = "Still listed and trading"
price = "Closes above $5"
adv = "Trades at least $50M a day"
cp_iv_spread_chg_5d = "Has a 5-session change of the call-put IV spread"
