# L3 site setting: the Guide's screener for the site preset option_stock_volume (ADR 0051; docs/ui/guide.md
# "The screener page"). The prose its page shows beside the preset's latest version (a preset
# version is immutable, its prose is not); the family is config/site/guide/sections.toml's.
# Keys: summary (the hero), hit (what a hit looks like), not_checked, before_acting (caveats,
# naming catalogue fields so the server links them), related (other screeners), sources, and
# [asks]: each criterion of the latest preset version in a few plain words. Typed by
# src/algotrade/config/site/guide/screeners.py; fitness tests in
# tests/unit/config/site/guide/test_screeners.py.
id = "option_stock_volume"
version = 1  # the preset version this prose was written for
line = "Stocks with few option trades compared with share trades, lowest first."
summary = "Ranks every liquid optionable stock by the option-to-stock volume ratio, the share volume its options control over the shares traded, lowest first. The literature finds a high ratio, bad news traded in options, followed by lower stock returns.[^1]"
hit = "The name is a listed stock closing above $5 that trades at least $50M a day and has option and stock volume for the session. Every such name qualifies; the lowest ratio ranks first, the highest last."
not_checked = "It does not know whether option trades open or close positions, who is buying, or whether volume is a hedge.[^2] Johnson and So found the effect mostly in the high-ratio names."
before_acting = [
  "Chain volume is stored from 2026-10-02 only, so there is no earlier history.",
  "A ratio spikes before earnings and around expirations for reasons that carry no signal; read the report date.",
  "A name whose options carry no volume that day reads null, not zero.",
]
related = [
  { id = "retail_option_attention", reason = "the same ratio among lottery-like names" },
]

[[sources]]
title = "Johnson and So, The Option to Stock Volume Ratio and Future Returns (2012)"
url = "https://ideas.repec.org/a/eee/jfinec/v106y2012i2p262-286.html"
note = "Stocks with the lowest option-to-stock volume ratio beat those with the highest by about 0.34 percent a week."

[[sources]]
title = "Ge, Lin and Pearson, Why Does the Option to Stock Volume Ratio Predict Stock Returns? (2016)"
url = "https://ideas.repec.org/a/eee/jfinec/v120y2016i3p601-622.html"
note = "Using signed option volume, it finds that opening call purchases predict returns most strongly, which it ties to option leverage."

[asks]
security_type = "A common stock or ADR"
status = "Still listed and trading"
price = "Closes above $5"
adv = "Trades at least $50M a day"
option_stock_volume_ratio = "Has an option-to-stock volume ratio"
