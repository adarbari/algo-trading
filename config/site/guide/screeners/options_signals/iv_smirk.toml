# L3 site setting: the Guide's screener for the site preset iv_smirk (ADR 0051; docs/ui/guide.md
# "The screener page"). The prose its page shows beside the preset's latest version (a preset
# version is immutable, its prose is not); the family is config/site/guide/sections.toml's.
# Keys: summary (the hero), hit (what a hit looks like), not_checked, before_acting (caveats,
# naming catalogue fields so the server links them), related (other screeners), sources, and
# [asks]: each criterion of the latest preset version in a few plain words. Typed by
# src/algotrade/config/site/guide/screeners.py; fitness tests in
# tests/unit/config/site/guide/test_screeners.py.
id = "iv_smirk"
version = 1  # the preset version this prose was written for
line = "Stocks whose protective puts cost least compared with calls, flattest first."
summary = "Ranks every liquid optionable stock by its option smirk, the implied volatility of a 5% out-of-the-money put minus that of an at-the-money call, flattest first. A steep smirk is where traders pay most for protection, and the literature finds those stocks lag.[^1]"
hit = "The name is a listed stock closing above $5 that trades at least $50M a day and has a smirk from our chain data. Every such name qualifies; the flattest smirk ranks first, the steepest last."
not_checked = "It does not check how liquid the put wing is, borrow cost (steep-smirk names are often hard to short), or earnings inside the expiry. It is a screen of the option_cp_iv_signals edge, which the harness is still testing."
before_acting = [
  "The smirk comes from chains stored since 2026-10-02 only, so its history is short.",
  "The smirk tracks the level of implied volatility: compare rollup.cp_iv@v1.atm_call_iv before reading a flat smirk as good news.",
  "A steep smirk can be a hedging demand around an event; check the report date.",
]
related = [
  { id = "cp_iv_spread", reason = "the call-put spread of the same family" },
]

[[sources]]
title = "Xing, Zhang and Zhao, What Does the Individual Option Volatility Smirk Tell Us About Future Equity Returns? (2010)"
url = "https://ideas.repec.org/a/cup/jfinqa/v45y2010i03p641-662_00.html"
note = "Stocks with the steepest option smirk lagged those with the flattest by about 11 percent a year, for at least six months."

[asks]
security_type = "A common stock or ADR"
status = "Still listed and trading"
price = "Closes above $5"
adv = "Trades at least $50M a day"
iv_smirk = "Has an option smirk"
