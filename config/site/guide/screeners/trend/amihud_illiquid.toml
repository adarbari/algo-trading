# L3 site setting: the Guide's screener for the site preset amihud_illiquid (ADR 0051; docs/ui/guide.md
# "The screener page"). A decoy of the edge harness's battery (verdict.toml [decoys], ADR 0053
# amendment 2026-10-18): a yardstick, not a trade idea. Keys as size_small.toml.
id = "amihud_illiquid"
version = 1  # the preset version this prose was written for
summary = "Ranks every tradeable stock by Amihud illiquidity, most illiquid first: the average price move per dollar traded over a quarter.[^1] It is a yardstick, not a trade idea: an edge whose picks are thinly traded names must do better than simply buying them."
hit = "The name is a listed common stock or ADR closing above $3 that trades at least $2M a day, and it has an Amihud value. Every such name qualifies; the order is the point, most illiquid first."
not_checked = "It does not check whether the illiquidity premium survives the spread you would pay, nor trend, quality or valuation. It is a decoy of the edge harness's battery, not a trade signal."
before_acting = [
  "The names it ranks first have the widest spreads: compare rollup.price_stats@v2.adv_usd_20d with the size you would trade before reading any return.",
  "One thin day with a large move raises the measure for a quarter.",
]
related = [
  { id = "size_small", reason = "another decoy every edge is compared with" },
  { id = "max_ret_high", reason = "the lottery-demand decoy" },
]

[[sources]]
title = "Amihud, Illiquidity and Stock Returns: Cross-Section and Time-Series Effects (2002)"
url = "https://archive.nyu.edu/handle/2451/27420"
note = "Defines the average price move per dollar traded and shows it is linked to higher returns for illiquid stocks."

[asks]
security_type = "A common stock or ADR"
status = "Still listed and trading"
price = "Closes above $3"
adv = "Trades at least $2M a day"
amihud = "Has an Amihud illiquidity value"
