# L3 site setting: the Guide's screener for the site preset momentum_own_trend (ADR 0051; docs/ui/guide.md
# "The screener page"). The prose its page shows beside the preset's latest version (a preset
# version is immutable, its prose is not); the family is config/site/guide/sections.toml's.
# Keys: summary (the hero), hit (what a hit looks like), not_checked, before_acting (caveats,
# naming catalogue fields so the server links them), related (other screeners), sources, and
# [asks]: each criterion of the latest preset version in a few plain words. Typed by
# src/algotrade/config/site/guide/screeners.py; fitness tests in
# tests/unit/config/site/guide/test_screeners.py.
id = "momentum_own_trend"
version = 1  # the preset version this prose was written for
line = "Momentum leaders with a positive year and a close above the 200-day average."
summary = "Ranks names by 12-1 momentum, keeping only those whose own trend is up: a positive year and a close above the 200-day average.[^1] It drops winners whose last month broke their trend. It is a filter on the momentum ranking, tested as a variant."
hit = "The name is a listed common stock, ADR or ETF closing above $5 that trades at least $50M a day, has a 12-1 momentum value, and reads 1 on the own-trend sign. Best momentum first."
not_checked = "It does not check market timing, crash risk or earnings dates. Part of any own-trend payoff is a long position after a rising market, not stock selection.[^2]"
before_acting = [
  "Most top-ranked names already read 1 in a rising market, so the filter changes the list most after a fall: compare it with momentum_12_1 on the same day.",
  "The return behind feature.stock_tsmom_sign is raw, not in excess of cash, and a flat year reads 0, which drops the name.",
  "Momentum crashes in sharp rebounds after a market fall; the own-trend filter does not remove that risk.",
]
related = [
  { id = "momentum_12_1", reason = "the ranking this filters" },
  { id = "momentum_pullback_entry", reason = "the same winners, entered on a dip" },
]

[[sources]]
title = "Moskowitz, Ooi and Pedersen, Time Series Momentum (2012)"
url = "https://papers.ssrn.com/sol3/papers.cfm?abstract_id=2089463"
note = "Finds an asset's own past return over 1 to 12 months predicts its next return across 58 futures markets."

[[sources]]
title = "Goyal and Jegadeesh, Cross-Sectional and Time-Series Tests of Return Predictability (2018)"
url = "https://ideas.repec.org/a/oup/rfinst/v31y2018i5p1784-1824..html"
note = "Compares own-trend and cross-sectional momentum and finds the gap between them comes mostly from net market exposure."

[asks]
security_type = "A common stock, ADR or ETF"
status = "Still listed and trading"
price = "Closes above $5"
adv = "Trades at least $50M a day"
mom_12_1 = "Has a 12-1 momentum value"
own_trend = "Own trend up: a positive year, above the 200-day average"
