# L3 site setting: the Guide's screener for the site preset ivol_high (ADR 0051; docs/ui/guide.md
# "The screener page"). A decoy of the edge harness's battery (verdict.toml [decoys], ADR 0053
# amendment 2026-10-18): a yardstick, not a trade idea. Keys as size_small.toml.
id = "ivol_high"
version = 1  # the preset version this prose was written for
summary = "Ranks every tradeable stock by the volatility it has left after the market, size, momentum, value and its sector are taken out, most first.[^1] It is a yardstick, not a trade idea: an edge whose picks are the jumpy, speculative names must do better than simply buying them."
hit = "The name is a listed common stock or ADR closing above $3 that trades at least $2M a day, and the four-factor regression ran for it (rollup.factor_betas@v1.factor_status is OK). Every such name qualifies; the order is the point, highest idiosyncratic volatility first."
not_checked = "It does not check trend, quality, earnings or valuation. It is a decoy of the edge harness's battery, not a trade signal."
before_acting = [
  "High idiosyncratic volatility goes with small, thin and distressed names: compare rollup.price_stats@v2.adv_usd_20d and feature.market_cap before reading a return.",
  "Windows the factor ETFs do not cover are unknown, not zero: check rollup.factor_betas@v1.factor_status.",
]
related = [
  { id = "size_small", reason = "another decoy every edge is compared with" },
  { id = "max_ret_high", reason = "the lottery-demand decoy" },
]

[[sources]]
title = "Ang, Hodrick, Xing and Zhang, The Cross-Section of Volatility and Expected Returns (2006)"
url = "https://www.nber.org/papers/w10852"
note = "Finds stocks with high volatility left over after market, size and value effects have earned very low average returns."

[asks]
security_type = "A common stock or ADR"
status = "Still listed and trading"
price = "Closes above $3"
adv = "Trades at least $2M a day"
ivol = "Has a four-factor idiosyncratic volatility"
