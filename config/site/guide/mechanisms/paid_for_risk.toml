[[sources]]
title = "Novy-Marx, R. and Velikov, M., Betting against betting against beta, Journal of Financial Economics (2022)"
url = "https://ideas.repec.org/a/eee/jfinec/v143y2022i1p80-106.html"
note = "BAB's return comes from hidden equal weighting and a profitability tilt; still positive after costs."

[[sources]]
title = "Baker, M., Bradley, B. and Wurgler, J., Benchmarks as Limits to Arbitrage: Understanding the Low-Volatility Anomaly, Financial Analysts Journal (2011)"
url = "https://ideas.repec.org/a/taf/ufajxx/v67y2011i1p40-54.html"
note = "1968-2008: $1 in low volatility grew to $59.55, in high volatility to $0.58; benchmarks block the arbitrage."

[[sources]]
title = "Santa-Clara, P. and Saretto, A., Option strategies: Good deals and margin calls, Journal of Financial Markets (2009)"
url = "https://ideas.repec.org/a/eee/finmar/v12y2009i3p391-417.html"
note = "Margin requirements cap put writing and force sellers out after losses: the seller's limit to arbitrage."
