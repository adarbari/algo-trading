# L3 site setting: the Guide's glossary (ADR 0051, docs/ui/guide.md section 3, "Glossary"): the
# app's own words and the rule grammar of docs/screeners/rules.md, written for someone who does
# not follow markets. One [[term]] each: id (its page's key), term (as the app writes it),
# short (one sentence: the help button's hover and the drawer's first line), body (a short
# paragraph; catalogue names in it are linked) and see_also (other term ids). Typed by
# src/algotrade/config/site/guide/glossary.py; fitness tests in
# tests/unit/config/site/guide/test_glossary.py (see_also resolves, catalogue names exist,
# short is one sentence, every term the spec lists is here).

# ---------------------------------------------------------------- how the app thinks about a day

[[term]]
id = "session"
term = "Session"
short = "The trading day a page is reading: every value on it is for exactly that day."
body = """
A page reads one session, by default the latest trading day with stored daily prices, and
says which one it is. Every daily value on the page is the one stored for that day. A value
the app did not compute or pull for that day is shown as UNKNOWN with the reason; it is never
filled in from an earlier day, so two numbers side by side are always about the same day. The
list of instruments and their company details come from snapshots taken from time to time:
the page uses the latest snapshot on or before the session and says which.
"""
see_also = ["unknown", "not_run", "knowledge_time"]

[[term]]
id = "knowledge_time"
term = "Knowledge time"
short = "When the app stored a fact, as opposed to the day the fact is about."
body = """
Every stored row carries the market day it describes (its session date) and its knowledge
time (knowledge_ts), the moment the app learned it. A vendor's correction is added as a new
row with a later knowledge time, never written over the old one, so a backtest records which
version of the data it read and can be repeated exactly. Dated events such as earnings
announcements carry the day they became known (known_from), and a page for a session only
uses the events known by that day.
"""
see_also = ["session", "run"]

[[term]]
id = "unknown"
term = "UNKNOWN"
short = "A value that is not known for the session, always shown with the reason why."
body = """
The app shows UNKNOWN instead of guessing. The reason says which case it is: nothing of that
kind was stored for the session, the instrument has no row that day, the value is stored
empty (the field's null meaning says what empty means for it), the field does not apply to
the instrument, or it is a personal-licence field you cannot read. UNKNOWN is about one value;
NOT_RUN is about a whole screen. In a screen, missing data never passes: a hard criterion with
no value rejects the row, a soft or score criterion with no value costs points.
"""
see_also = ["not_run", "session", "hard"]

[[term]]
id = "not_run"
term = "NOT_RUN"
short = "A screen with no run for the session: nothing was screened that day, which is not the same as a run that found nothing."
body = """
A screen's results always belong to one session. When the screen has no run for the session
the page reads, it is NOT_RUN: the app never shows an older run's picks in its place. Ideas
lists only the screens that ran for the session and names the others NOT_RUN. A run that found
nothing is different: it ran, and every row was rejected. The nightly data-quality check is
NOT_RUN the same way on a day it did not run.
"""
see_also = ["run", "unknown", "session"]

[[term]]
id = "run"
term = "Run"
short = "One execution of a job that writes results, recorded with its own id."
body = """
The nightly runs every finalised screen and every site preset screen for the session, and a
screen can also be run on request. Each result row carries its run's id and the screen's id,
version and a hash of its settings, so you can always tell which rules produced it. A Builder
preview is not a run: it evaluates the same rules on the latest session and saves nothing.
Data loads and backtests are runs too, each with its own record.
"""
see_also = ["not_run", "draft", "preset"]

[[term]]
id = "selection"
term = "Selection"
short = "Typed rules that pick which instruments a strategy or a backtest looks at."
body = """
A selection is a list of rules (a field, a comparison and a value, combined with all, any and
not) checked against the field catalogue. Missing data counts as unknown and is left out,
never passed. Rule screens have no selection: who is screened (the security type, an ACTIVE
listing, having options) is written as hard criteria like any other, so it shows in the funnel
with the rest.
"""
see_also = ["criterion", "hard", "gating_criterion"]

[[term]]
id = "draft"
term = "Draft"
short = "A screen's working copy: you can edit, save and preview it, but it is never run."
body = """
The Builder keeps your edits to a screen as its draft (Save draft). A draft is never run;
Finalize checks it (every field exists, every value fits its field) and turns it into the next
numbered version, which cannot change and runs every night from then on. A screen drafted from
a sentence (Describe it) is a draft too: the criteria the text model proposes load as unsaved
edits, and nothing is saved or run until you save and finalise.
"""
see_also = ["preset", "run", "criterion"]

[[term]]
id = "preset"
term = "Preset"
short = "A screen the site ships, reviewed and versioned with the app, that runs every night."
body = """
A preset's versions are numbered and never change: a new rule is a new version, and the
latest is the highest number. You cannot edit a preset itself; your first edit in the Builder
makes your own copy, which extends the preset at the version you started from. When the site
publishes a newer version, the Builder offers to rebase your copy onto it. Each site preset
has a playbook in the Guide.
"""
see_also = ["playbook", "draft", "run"]

[[term]]
id = "playbook"
term = "Playbook"
short = "The Guide's page for one site preset screen: the setup it looks for, what it checks and what it leaves to you."
body = """
There is one playbook per site preset, grouped by family (trend, breakouts, reversals, option
income). It says what a hit looks like and what the screen does not check, lists each
criterion in plain words with its field and rule, gives the caveats to read before acting on a
hit and the situations that fool its fields, and links to related playbooks. Open in Builder
shows the preset in the Builder, where your first edit makes your own copy.
"""
see_also = ["preset", "criterion"]

# ---------------------------------------------------------------------------- the rule grammar

[[term]]
id = "criterion"
term = "Criterion"
short = "One rule of a screen: a field, a comparison, a threshold and a mode."
body = """
A criterion compares one catalogue field with a threshold, for example the closing price
rollup.price_stats@v2.close greater than 5. Its mode says what a miss does (hard, soft or
score), a soft or score criterion may have a tolerance, and a soft one an on_miss. The
funnel shows the criteria in the order written. A criterion can be switched off without
deleting it.
"""
see_also = ["op", "mode", "tolerance", "on_miss"]

[[term]]
id = "op"
term = "op"
short = "The comparison a criterion makes, such as gte (greater than or equal to) or between."
body = """
The operators are eq (equals), ne (not equal), in and not_in (one of a list, or none of it),
gt and gte (greater than; or equal to), lt and lte (less than; or equal to), between (within
two bounds, both included), and is_null and not_null, which take no value. A tolerance works
only with the numeric comparisons gt, gte, lt, lte and between. A value that is absent, not a
number, or of the wrong type for the comparison counts as missing, and missing never passes.
"""
see_also = ["criterion", "tolerance"]

[[term]]
id = "mode"
term = "mode"
short = "What a criterion's miss does to a row: hard rejects it, soft may keep it as a near miss, score only lowers its score."
body = """
Every criterion has a mode, hard unless it says otherwise. A hard criterion must pass. A soft
one may miss by up to its tolerance and keep the row as a near miss. A score criterion never
removes a row; it only moves it down the list. Hard and soft criteria are the gating ones, the
steps of the screen's funnel.
"""
see_also = ["hard", "soft", "score_mode", "gating_criterion"]

[[term]]
id = "hard"
term = "hard"
short = "A criterion that must pass: a miss, or no value, rejects the row."
body = """
A hard criterion is strict: with the closing price required to be greater than 5, a close of
4.99 is a REJECT. A row with no value for it is rejected too, with the reason no <field>. A
hard criterion takes no tolerance, and each hard miss costs the row 100 points of score.
"""
see_also = ["mode", "reject", "soft"]

[[term]]
id = "soft"
term = "soft"
short = "A criterion that may miss by a little: within its tolerance the row stays in as a near miss."
body = """
A soft criterion needs a tolerance. A value that passes is fine; one that misses by no more
than the tolerance is a near miss and gives the row the decision its on_miss names (WATCH by
default); one that misses by more is a REJECT. A row with no value for it stays in, loses the
full near-miss penalty of 10 points, and its reasons list no <field>.
"""
see_also = ["tolerance", "on_miss", "near_miss", "mode"]

[[term]]
id = "score_mode"
term = "score (mode)"
short = "A criterion that never removes a row: a miss only lowers the row's score."
body = """
Use score for a preference rather than a requirement: names that meet it rise, the others stay
in lower down. Its tolerance is optional: a miss within it costs 0 to 10 points by how far it
missed; a miss beyond it, or without one, or no value at all, costs 10.
"""
see_also = ["score", "mode", "tolerance"]

[[term]]
id = "tolerance"
term = "tolerance"
short = "How far a value may miss a soft or score criterion's threshold and still count as a near miss."
body = """
A tolerance is either a number in the field's own unit (a tolerance of 0.02 on a threshold of
0.10 makes 0.08 to 0.10 a near miss) or relative, a share of the threshold: relative 0.2 on an
average daily dollar volume of at least $50M (rollup.price_stats@v2.adv_usd_20d) makes $40M to
$50M a near miss. It is required for soft, optional for score, not allowed for hard, and works
only with numeric comparisons.
"""
see_also = ["near_miss", "soft", "score_mode"]

[[term]]
id = "on_miss"
term = "on_miss"
short = "What a soft criterion's near miss makes the row: WATCH (the default), LIQUIDITY_RISK or EVENT_RISK."
body = """
A row can nearly miss several soft criteria; it gets the most severe of their on_miss
decisions, EVENT_RISK above LIQUIDITY_RISK above WATCH, and every reason is listed. Only soft
criteria have an on_miss: a hard miss is always a REJECT and a score miss changes only the
score.
"""
see_also = ["watch", "liquidity_risk", "event_risk", "near_miss"]

# ------------------------------------------------------------------------ reading a screen's result

[[term]]
id = "near_miss"
term = "Near miss"
short = "A value that missed a soft or score criterion's threshold by no more than its tolerance."
body = """
A near miss costs points by how close it came: 10 times the distance divided by the
tolerance, so 0 to 10. On a soft criterion it also sets the row's decision through on_miss; on
a score criterion it only lowers the score. Every run and preview lists its narrow misses: the
rows that missed only within tolerance, with each criterion, the value, the threshold and the
distance, which is where a threshold set a little too tight shows up.
"""
see_also = ["tolerance", "on_miss", "watch", "score"]

[[term]]
id = "gating_criterion"
term = "Gating criterion"
short = "A hard or soft criterion: one that can remove a row (a score criterion never does)."
body = """
The Builder's funnel shows the gating criteria in order: the universe at the top, then for
each one how many rows enter it, pass, miss narrowly, fail and have no value, and how many are
left for the next. A row with no value for a soft criterion stays in; for a hard one it is
removed.
"""
see_also = ["hard", "soft", "mode", "selection"]

[[term]]
id = "qualified"
term = "QUALIFIED"
short = "The decision of a row that met every hard and soft criterion."
body = """
A QUALIFIED row passed every gating criterion. Its score can still be below 100: score
criteria it missed, or a soft criterion with no value (listed among its reasons), cost
points.
"""
see_also = ["score", "watch", "reject"]

[[term]]
id = "watch"
term = "WATCH"
short = "The default decision of a near miss: close enough to keep an eye on, not a pass."
body = """
A row is WATCH when it passed every hard criterion and nearly missed at least one soft
criterion whose on_miss is WATCH, and no near miss gave it anything more severe. It is a name
that may qualify on a later day if the value moves a little.
"""
see_also = ["near_miss", "on_miss", "qualified"]

[[term]]
id = "liquidity_risk"
term = "LIQUIDITY_RISK"
short = "A near miss on a criterion about how much a name trades, so it may be harder to buy and sell than the screen wants."
body = """
A screen gives LIQUIDITY_RISK when a soft criterion with on_miss = LIQUIDITY_RISK nearly
misses. Every site preset uses it on the average daily dollar volume
(rollup.price_stats@v2.adv_usd_20d); one also uses it on option volume. It is more severe than
WATCH and less than EVENT_RISK: the setup is there, but check the spread and the size you can
trade.
"""
see_also = ["on_miss", "near_miss", "event_risk"]

[[term]]
id = "event_risk"
term = "EVENT_RISK"
short = "The most severe near-miss decision, meant for a criterion that keeps names away from an event such as earnings."
body = """
A screen gives EVENT_RISK when a soft criterion with on_miss = EVENT_RISK nearly misses, for
example one asking for no earnings report within the next few days. It outranks LIQUIDITY_RISK
and WATCH when a row has several near misses. No site preset uses it today; your own screens
can.
"""
see_also = ["on_miss", "near_miss", "liquidity_risk"]

[[term]]
id = "reject"
term = "REJECT"
short = "The decision of a row that failed a hard criterion, had no value for one, or missed a soft one by more than its tolerance."
body = """
Rejected rows are still scored and kept with the run, so the funnel and the narrow misses can
show why a name did not make it. Many hard misses tie at a score of 0.
"""
see_also = ["hard", "soft", "score"]

[[term]]
id = "paused"
term = "PAUSED"
short = "A pick the regime gate held back: it met the screen, but the market's regime is one the screen pauses in."
body = """
With the regime gate on, the [regime] settings (the site's defaults or your own config) list
the regimes each screen pauses in, and on a session in one of them its QUALIFIED and WATCH rows become PAUSED, with the rule that paused them as the first
reason. The VRP scanner, which sells option volatility, pauses in Storm and Severe storm. The
gate fails closed: when the regime is UNKNOWN for the session, every QUALIFIED and WATCH row
of a gated screen is paused. A paused pick stays visible with its reason (Ideas, Paused by regime), never silently
dropped. The gate is off unless the site or your settings turn it on.
"""
see_also = ["regime", "qualified", "watch"]

[[term]]
id = "regime"
term = "Regime"
short = "The market's weather for the session: Clear, Clouds building, Storm or Severe storm."
body = """
The regime comes from two scores from 0 to 100: macro risk, the warning signs in the
economy (the financial conditions index is one, though it moves fast), and market stress, the fast ones in prices. Clear (CALM) is neither high, Clouds
building (CAUTION) macro risk only, Storm (STRESS) market stress only, Severe storm (CRISIS)
both. It is UNKNOWN when either score cannot be computed, never Clear for lack of data. To
avoid flickering, the label is the most severe one of the last five sessions, so a regime is
left only after five sessions below it. It can size new positions and drive the regime gate,
both off unless turned on.
"""
see_also = ["paused", "unknown"]

[[term]]
id = "score"
term = "Score"
short = "A row's number from 0 to 100 for sorting: 100 when every threshold is met, less a penalty for each miss."
body = """
A near miss costs 0 to 10 points by how close it came, a score criterion missed beyond its
tolerance or a soft or score criterion with no value 10, and a hard miss or a soft miss beyond
tolerance 100; the score stops at 0. It is for ordering the list, not a probability. Rows sort
by score, then by the screen's tie-break field, then by instrument.
"""
see_also = ["near_miss", "score_mode", "qualified"]

# ------------------------------------------------------------- why a value is not available (ADR 0056)
# One term per public kind (`UnavailableKind`, src/algotrade/services/read/availability/cause.py;
# the fitness test tests/unit/services/read/availability/test_cause.py keeps every kind mapped).
# A trader reads the kind and the feature names; the chain behind it is for admins.

[[term]]
id = "unavailable_system"
term = "Not available: system error"
short = "The value could not be shown because something in the app's own data pipeline did not deliver it."
body = """
A source was down, a nightly step did not finish, or a stored table is missing for the session.
The value is not an empty value and not a zero: it is simply not there, and the app never fills
it from an earlier day. A screen that needs it treats it as missing data, so a hard criterion
rejects the row and a soft or score criterion costs points. It normally clears on the next
nightly run; the owner sees the exact cause.
"""
see_also = ["unknown", "session", "unavailable_not_stored"]

[[term]]
id = "unavailable_not_stored"
term = "Not available for this instrument"
short = "Nothing is stored for this instrument for the session, and nothing went wrong: the data does not exist for it."
body = """
The instrument has no row in the data behind the field for that day, or the field is stored
empty. A stock with no listed options has no option chain, a recent listing has no history,
a company that has not reported has no report date. No failure stands behind it, so waiting
does not change it. A screen treats it as missing data, like any other UNKNOWN value.
"""
see_also = ["unknown", "unavailable_not_applicable", "unavailable_system"]

[[term]]
id = "unavailable_not_applicable"
term = "Does not apply to this instrument"
short = "The field is not defined for this kind of instrument, so there is no value to show."
body = """
Some fields describe only some instruments: earnings dates exist for operating companies, not
for funds; a fund's holdings exist only for funds. The app shows the field as not applicable
and, where the data says so, the precise reason (a new listing, a blank-check company). It is a
fact about the instrument, not a gap in the data.
"""
see_also = ["unknown", "unavailable_not_stored"]

[[term]]
id = "unavailable_illiquid"
term = "Not available: too thinly traded"
short = "An option value is left out because the instrument's options are too thinly quoted to trust."
body = """
Option values such as implied volatility are computed from near-the-money quotes. When the
quotes are missing or their spread is too wide, the app shows no value rather than a number
built from noise. It is the market's state on the day, not an error, and it can change by the
next session.
"""
see_also = ["unknown", "liquidity_risk"]

[[term]]
id = "unavailable_licence"
term = "Not available under your data licence"
short = "The field comes from a personal-licence source that only its owner may read."
body = """
Some data (from the owner's brokerage connection) is licensed for personal use. Another user
sees the field as unavailable, and a formula over it inherits the same licence. It is a rule
of the data, not a fault.
"""
see_also = ["unknown"]

# ---------------------------------------------------------------- how the app judges an edge (ADR 0053)

[[term]]
id = "edge"
term = "Edge"
short = "A written reason why some stocks should do better than others, tested on the stored history."
body = """
An edge is a document: the idea in one sentence, who is forced or wrong so that the pattern
exists, why it should last once known, how a trade would be held (how long, against what, at
what cost) and the screens that implement it. The app runs each screen on every past session
using only what was known then, and compares what its picks did next with every other eligible
name. An edge earns trust only from those numbers, never from the idea alone.
"""
see_also = ["verdict", "edge_status", "edge_state", "edge_copy", "base_rate", "out_of_sample"]

[[term]]
id = "edge_status"
term = "Edge status"
short = "Where an edge stands: candidate, evidenced, live, retired, rejected or blocked."
body = """
Candidate: written and being tested; no claim yet. Evidenced: its picks beat the base rate and
the baselines out of sample, on enough trades. Live: evidenced and used to rank ideas. Retired:
it stopped working by its own retirement rule. Rejected: checked and dropped, with the reason
kept so it is not filed again. Blocked: worth testing but missing the data it needs. Only an
official result over the out-of-sample period can move an edge to evidenced.
"""
see_also = ["verdict", "edge", "out_of_sample", "exploratory"]

[[term]]
id = "edge_state"
term = "Your state about an edge"
short = "What you have decided about an edge: researching, following, rejected, retired or trial."
body = """
Researching is where every edge starts. Follow an edge when you intend to act on it; you can
retire it later, or go back to researching. Reject one you have checked and dropped, with the
reason kept so it is not filed again. Trial is a new version of an edge you follow, tested beside
the old one before it replaces it. The state is yours: it does not change the site's edge or what
other users see. The site's own status (candidate, evidenced, live) is separate.
"""
see_also = ["follow_edge", "edge_status", "edge_copy"]

[[term]]
id = "edge_copy"
term = "Site edge and your edge"
short = "A site edge is the shared document; your edge is your own copy of one, or one you wrote."
body = """
A site edge is reviewed and shared: its official result is the one everybody sees. Clone one
to make your own copy: it extends the site edge, so you change only what you want (the screens,
the picks, the holding periods, the universe) and the original stays as it is. Your copy has its
own backtests. Its out-of-sample result stays hidden until you show it or follow it, so the fair
test is not used up while you tune. An admin can publish a copy site-wide.
"""
see_also = ["edge", "show_out_of_sample", "compare_versions"]

[[term]]
id = "follow_edge"
term = "Following an edge"
short = "Following says you intend to act on the edge; the app warns when the evidence is thin."
body = """
You can follow any edge, but the app warns when its verdict is Not working or Not enough data,
and the warning stays on the edge as a permanent label (Followed against the verdict). Following
a copy shows its out-of-sample result. Retire an edge you follow when it stops working or you
stop acting on it. Following is a record of your decision, not an order: the app never trades.
"""
see_also = ["edge_state", "verdict", "show_out_of_sample", "edge_labels"]

[[term]]
id = "edge_labels"
term = "Edge labels"
short = "Permanent warnings the app puts on an edge when a choice weakens its evidence."
body = """
Followed against the verdict: you followed it while its verdict was Not working. Out-of-sample
seen while tuning: you looked at a copy's out-of-sample result and kept changing it, so that
result is no longer a fair test. Replaced without a forward test: a new version replaced the old
one before enough new sessions had passed. Split moved after viewing: the out-of-sample start
was moved after the result was seen. Labels are never removed.
"""
see_also = ["follow_edge", "out_of_sample", "show_out_of_sample"]

[[term]]
id = "show_out_of_sample"
term = "Show out-of-sample"
short = "Reveals a copy's out-of-sample result; once seen it cannot be hidden again."
body = """
The out-of-sample period is the fair test: data the edge was not tuned on. While you are still
changing a copy the app keeps that result hidden and judges the copy on the in-sample period
only. Showing it reveals the figures and the verdict on them. Do it when you are done tuning:
if you keep changing the copy afterwards, the label Out-of-sample seen while tuning is kept on
it.
"""
see_also = ["out_of_sample", "edge_labels", "edge_copy"]

[[term]]
id = "compare_versions"
term = "Compare versions"
short = "Your copy beside the edge it extends and the baselines, on the same measures."
body = """
Each row is one version tested on one screen and holding period: your copy's latest backtest,
the edge it extends (its official result) and the baselines. Read the in-sample columns to see
whether a change helped on the period you tuned on. The out-of-sample columns appear once you
show that result. A copy that beats its original in-sample but not out-of-sample was probably
fitted to the past.
"""
see_also = ["edge_copy", "show_out_of_sample", "win_rate"]

[[term]]
id = "edge_builder_idea"
term = "Edge builder: the idea"
short = "The claim the edge makes and why it should keep working."
body = """
Step 1 of the six. The name and the thesis say what the edge claims in one sentence. Why it should
last asks who is forced or systematically wrong so that the pattern exists, and why it survives
being known. List where the idea comes from: a paper with its link, or author, title and year.
Everything else the edge does is tested; this part is the reason to believe the test is more than
luck, so write it before you look at a result.
"""
see_also = ["edge", "edge_quality_bar", "edge_builder_screens"]

[[term]]
id = "edge_quality_bar"
term = "The quality bar"
short = "Nine written answers every edge gives before its numbers are read."
body = """
Who is forced or wrong, why the pattern survives being known, how the outcome is measured, when
the trigger becomes known, how a stranger could replicate it, the size to expect, capacity and
costs, how it fails, and what else could explain the result. The seven under More in step 1 are
those after the first two. An answer is a few sentences; an edge that cannot answer them is a
backtest looking for a story.
"""
see_also = ["edge", "edge_builder_idea"]

[[term]]
id = "edge_builder_screens"
term = "Edge builder: screens"
short = "The existing screens that decide which stocks qualify and in what order."
body = """
Step 2 of the six. A screen only decides which stocks qualify on a session and how they rank;
everything after that (when the edge fires, how many it takes, how it is held) belongs to the
edge. Choose one or more: each one is tested on its own as an implementation of the edge. The
record beside a screen is its win rate against the base rate on the out-of-sample period, or No
record yet. Edit in Screen Builder opens the screen and brings you back here with your draft kept.
"""
see_also = ["edge", "base_rate", "edge_builder_picks"]

[[term]]
id = "edge_builder_picks"
term = "Edge builder: picks"
short = "When the edge fires and how many of the screen's ranked stocks it takes."
body = """
Step 3 of the six. Every session or month end fires on the calendar; an event fires after that
event, such as an earnings report, for the stocks that had it. Top N takes the first N of the
screen's ranked list; all that qualify takes every stock that passes. Fewer stocks per session
means fewer trades, so a verdict takes longer to reach.
"""
see_also = ["edge_builder_screens", "edge_builder_trade", "trades"]

[[term]]
id = "edge_builder_trade"
term = "Edge builder: trade"
short = "How each pick is entered and held, what it costs and what counts as a win."
body = """
Step 4 of the six. Enter says how many sessions after the trigger the position opens (at least
one, so nothing is bought on a price that was not known yet). Each holding period is measured and
reported on its own. Costs are for a round trip in basis points (100 bps is 1%). A win is either
a return above the benchmark after costs, or simply a rise after costs.
"""
see_also = ["edge_builder_picks", "win_rate", "edge_builder_compare"]

[[term]]
id = "edge_builder_compare"
term = "Edge builder: compare against"
short = "The universe that sets the base rate and the decoys the edge must beat."
body = """
Step 5 of the six. The universe is the set of stocks a random pick could have been; its win rate
is the base rate the edge has to beat. The decoys are other screens run on the same sessions: if
a plain one does as well, the idea is not what explains the result.
"""
see_also = ["base_rate", "edge_builder_trade", "edge_builder_test"]

[[term]]
id = "edge_builder_test"
term = "Edge builder: test and run"
short = "Where the out-of-sample period starts, a summary, and the run."
body = """
Step 6 of the six. Before the date is in-sample, the period you may tune on; from it is
out-of-sample, kept aside to check. Results for the out-of-sample period stay hidden while you
change the edge. Moving the date after seeing a result is recorded as a permanent label on the
edge. Save and run backtest saves the whole edge and starts the backtest; you can leave and the
result lands on the edge's page.
"""
see_also = ["out_of_sample", "variants_tried", "show_out_of_sample"]

[[term]]
id = "edge_builder_running"
term = "Backtest running"
short = "The backtest of your edge is running; you can leave and the result will be on its page."
body = """
A backtest runs the edge on every past session using only what was known then. It can take a
while, and one backtest of yours runs at a time. When it finishes the edge's page shows your
copy beside the site edge and the decoys, in-sample; out-of-sample stays hidden until you show it.
"""
see_also = ["compare_versions", "show_out_of_sample", "official_result"]

[[term]]
id = "verdict"
term = "Verdict"
short = "What the official result says about an edge: Works, Promising, Not working, Not enough data or Waiting on data."
body = """
The verdict is judged by one fixed rule on the edge's official result, using its best screen and
holding period (the page says which). Waiting on data: there is no official result, or it could
not read what it needed. Not enough data: too few out-of-sample trades, or a figure the rule needs was
not measured. Not working: the out-of-sample win rate is not above the base rate, or the top
vs bottom decile, the deflated Sharpe ratio or the overfitting chance is poor, or it does not
beat the plain baselines. Promising: it passes all of those with enough out-of-sample trades. Works: more
trades, stricter thresholds and an out-of-sample lift above nearly all of 1,000 backtests of
random picks (95% by default; see Robustness). A result with no random-pick backtests stops at
Promising. The reason line names the first test it fails;
the details list every test with its value and its threshold.
"""
see_also = ["win_rate", "trades", "out_of_sample", "official_result"]

[[term]]
id = "official_result"
term = "Official result"
short = "The one backtest an edge is judged on: the site's latest run at its out-of-sample start."
body = """
Each edge document fixes the date its out-of-sample period starts. The official result is the
latest committed site backtest run at that date. A backtest you run with another date is
EXPLORATORY and never becomes the official result, so the verdict cannot be moved by choosing a
date after seeing the numbers.
"""
see_also = ["out_of_sample", "exploratory", "variants_tried"]

[[term]]
id = "win_rate"
term = "Win rate"
short = "The share of an edge's picks whose outcome came true."
body = """
For each past session the app takes the screen's top picks and checks the edge's outcome for
each one, for example "beat the S&P 500 over the next 20 trading days after costs" or "the
short put expired worthless". The win rate is wins divided by picks. A window that has not
closed yet is left out, never counted as a loss. On its own a win rate says little: compare it
with the base rate.
"""
see_also = ["base_rate", "lift", "trades"]

[[term]]
id = "base_rate"
term = "Base rate"
short = "How often the same outcome came true for every eligible name, picked or not."
body = """
The base rate is the win rate of doing nothing clever: every name the edge could have picked on
the same sessions, judged by the same outcome. If 55% of picks beat the market but 54% of all
names did too, the screen added almost nothing. Every win rate in the app is shown beside its
base rate for that reason.
"""
see_also = ["win_rate", "lift"]

[[term]]
id = "lift"
term = "Lift"
short = "The win rate minus the base rate, in points: how much better the picks did than the field."
body = """
A lift of +5 pts means the picks' outcome came true 5 percentage points more often than for
every eligible name; 0 means they did no better. The details also show the ratio (win rate
divided by base rate). Lift on a handful of trades is noise: read it with the number of trades
beside it, and prefer the out-of-sample lift to the whole history's.
"""
see_also = ["base_rate", "trades", "out_of_sample"]

[[term]]
id = "trades"
term = "Trades"
short = "How many non-overlapping test dates a number rests on: the real sample size."
body = """
Picks made on the same day share that day's market, so they are not independent: fifty picks
on one session are one trade, not fifty. The app spaces test sessions at least one holding
period apart (and pools overlapping events into one block) so that no two windows overlap, and
shows the count beside every number. Fewer than about 40 cannot tell a real edge from luck;
the top vs bottom decile's t statistic says the same thing in another way.
"""
see_also = ["lift", "top_vs_bottom_decile"]

[[term]]
id = "top_vs_bottom_decile"
term = "Top vs bottom decile"
short = "The return of the best-ranked tenth of names minus the worst-ranked tenth."
body = """
On each test session every eligible name is ranked by the edge's own score (for example its
12-1 momentum) and cut into ten equal groups. The spread is the average outcome of the top
group minus the bottom group. A positive spread says the ranking itself carries information,
beyond the few names a screen picks. Sessions where too few names have a score are left out of
the deciles and counted. Its t statistic says how far the spread is from luck: 2 or more is
promising, 3 or more strong. The bars show the average outcome of each group on the in-sample
period, best-ranked first: a ranking that works falls from left to right, one that does not
is flat or jagged. A bar is missing where the run stored none, never drawn as zero.
"""
see_also = ["trades", "base_rate", "robustness"]

[[term]]
id = "out_of_sample"
term = "Out-of-sample (OOS)"
short = "Recent history held back from tuning: an edge must also work there to be trusted."
body = """
While an edge is built and compared, many versions get tried, and some will fit the past by
luck. The out-of-sample period, from the date in the edge's Test line on, is kept apart: it is
reported on its own, and the verdict rests on it. The date is fixed and moves only by a
recorded decision, so the test cannot be quietly shifted.
"""
see_also = ["in_sample", "exploratory", "verdict", "variants_tried"]

[[term]]
id = "in_sample"
term = "In-sample"
short = "The older history an edge was built and tuned on: it flatters the edge."
body = """
Everything before the out-of-sample start. Many versions were tried on it, so even a good
in-sample result says little by itself; it is shown beside the out-of-sample result to see
whether the edge held up or faded.
"""
see_also = ["out_of_sample", "variants_tried"]

[[term]]
id = "exploratory"
term = "Exploratory"
short = "A backtest over an out-of-sample date you chose, not the site's."
body = """
You can run an edge's backtest with your own out-of-sample date to explore. Such numbers are
labelled EXPLORATORY: they never feed the track record shown on screeners, the verdict or an
edge's status, because a date chosen after seeing results is no longer a fair test. The site's
out-of-sample date is the one that counts.
"""
see_also = ["out_of_sample", "official_result", "edge_status"]

[[term]]
id = "variants_tried"
term = "Variants tried"
short = "Every version of an edge that was ever tested, so luck from many tries is discounted."
body = """
Each variant, setting and holding period tried on an edge is counted. The more versions tried,
the more likely the best one looks good by chance; the deflated Sharpe ratio uses the count to
discount it, and the probability of backtest overfitting estimates how often the best version
in one half of history fails in the other. A result shown without its count of variants tried
is not comparable.
"""
see_also = ["out_of_sample", "trades"]

[[term]]
id = "robustness"
term = "Robustness"
short = "How the out-of-sample lift compares with backtests of random picks: the chance it is luck."
body = """
On each out-of-sample session the screen was measured, the harness draws as many names at random
as the screen held (1,000 times, the same draws on every run of the same data) and measures each draw like the screen's
picks. The histogram is those random lifts; the marker is the edge's. Beating 95% of the draws
is what Works asks for. The count of variants tried is beside it because trying more versions
makes the best one look better than it is.
"""
see_also = ["lift", "variants_tried", "verdict", "out_of_sample"]

[[term]]
id = "harness_exclusions"
term = "What a run left out"
short = "The sessions and names a backtest run could not measure, counted so none is quietly dropped."
body = """
A run counts what it set aside instead of ignoring it. Unclosed: decision sessions whose
holding window had not finished by the run's end. Coverage: sessions with no screen run, or a
screen run that lacked an input table. Score coverage: the lowest share of eligible names that
had a score to rank; below the minimum the deciles are skipped. No entry bar: names with no
price on the session they would have been bought. A figure shown as unknown was not recorded by
the run, which is different from none.
"""
see_also = ["variants_tried", "exploratory", "trades"]

# ---------------------------------------------------------------- the text model's cost (ADR 0058)

[[term]]
id = "llm_cost_basis"
term = "Cost basis"
short = "How a text-model call's cost was worked out: priced, reported, bound, free or unknown."
body = """
Every call to the text model is logged with a cost and the way that cost was worked out.
Priced: the tokens it used times the model's price per million tokens. Reported: the notional
cost the Claude Code login says the call was worth (see notional seat cost). Bound: the cost
was not known, so the largest the call could have cost is charged instead (see bound cost).
Free: a local model or a free tier, logged at zero. Unknown: the attempt was skipped, so
nothing was asked and nothing spent. Tokens a provider did not report are shown as unknown, never
as zero.
"""
see_also = ["llm_notional_seat_cost", "llm_bound_cost", "llm_budget"]

[[term]]
id = "llm_notional_seat_cost"
term = "Notional seat cost"
short = "What a call through the owner's Claude Code login would have cost: a size reference, not a bill."
body = """
A Claude Code login is a subscription, so no call is billed on its own. The login still reports
a dollar figure for each call, and the app records it so you can see how heavy the use is. It
counts against the budget (so a runaway loop still stops) but it is shown apart from billed
cost and is not money leaving an account.
"""
see_also = ["llm_cost_basis", "llm_budget"]

[[term]]
id = "llm_bound_cost"
term = "Bound cost"
short = "The most a call could have cost, charged when the real cost is unknown."
body = """
When a paid provider answers without saying how many tokens it used, or an attempt fails (a
timeout can still bill), the app charges the upper bound it reserved before the call: the
prompt's length times the input price plus the longest answer allowed times the output price.
It errs on the high side on purpose, so an unknown never looks like free.
"""
see_also = ["llm_cost_basis", "llm_budget"]

[[term]]
id = "llm_budget"
term = "Text-model budget"
short = "The daily and monthly caps on what paid and reported text-model calls may spend."
body = """
The site sets an optional daily and monthly cap in dollars, counted by calendar day and month
in New York. Before a paid call the app reserves the most it could cost and refuses the call if
that would pass a cap, so concurrent requests cannot together overspend. When a cap is
reached, the setting decides: free models keep answering and the paid ones are skipped, or
every call is refused. With no cap set, nothing limits the spend; the page says so. Free
providers never count against it. The share of the cap used counts only what has been spent
and recorded, not calls still in flight, so it can read slightly below what the budget
enforces.
"""
see_also = ["llm_cost_basis", "llm_fallback"]

[[term]]
id = "llm_fallback"
term = "Fallback"
short = "A call answered by a later provider because an earlier one in the chain failed or was skipped."
body = """
The text model tries its providers in order. When the first is down, out of retries or skipped
for the budget, the next one answers and the call is logged as a fallback, with the provider
it fell back from. A high fallback rate means the first choice is unreliable or the budget is
tight; a high failure rate means calls are being lost, and a failed attempt of a paid provider
may still have been billed.
"""
see_also = ["llm_budget", "llm_cost_basis"]

[[term]]
id = "paper_trading"
term = "Paper trading"
short = "What an edge you follow would have bought and sold, recorded every night as it happens."
body = """
When you follow an edge, each night the app takes the picks of its screen, using only what was
known that night, and records them as paper trades: the name, the session to buy it and the
session to sell it after the edge's holding period. Nothing is ever ordered. A trade stays open
until its window has closed and the result is stored, and is then won or lost by the same win
rule as the backtest. A trade whose result could not be read is skipped with the reason; it is
never counted as a loss. The record is kept as written: editing the edge later does not change
the trades already made.
"""
see_also = ["live_record", "usual_range", "forward_test", "win_rate"]

[[term]]
id = "live_record"
term = "Live record"
short = "How the closed paper trades of a followed edge have done so far."
body = """
The live record counts the closed paper trades, the wins among them and the win rate, and sets
it against what the backtest led you to expect (the usual range). Open and skipped trades are
counted apart. With few closed trades the rate swings widely by chance, so the record is
judged only once the site's minimum number of signal sessions have closed; before that it says it is too early.
On track means the live win rate is inside the usual range; below or above means it is outside,
which is worth a look but proves nothing alone.
"""
see_also = ["paper_trading", "usual_range", "win_rate"]

[[term]]
id = "usual_range"
term = "Usual range"
short = "The spread of win rates the backtest's own win rate would give over the same number of trades."
body = """
If the backtest's win rate really held, the share of wins among a given number of trades would
still vary from one run of trades to the next, by chance alone. The usual range is the middle
80% of that variation (the 10th to the 90th percentile of a binomial distribution of wins), so
it narrows as more sessions close. The picks of one night are bets on the same market over the
same window and move together, so the range counts signal sessions, not trades: ten picks on one
night are one observation, not ten. The picture shows the whole spread, the live win rate and
the two ends of the range. A live rate outside it is unusual if the backtest was right, but
one in five honest records falls outside by chance.
"""
see_also = ["live_record", "win_rate", "paper_trading"]

[[term]]
id = "forward_test"
term = "Forward test"
short = "A new version of an edge tried on live paper trades beside the edge it would replace."
body = """
A new version of an edge is first tried on paper next to the version you follow: both record
the same nights' picks from the day the trial starts. The version can replace the old one once
the site's number of sessions have passed and its win rate is not behind. Replacing earlier is
allowed but is recorded on the edge as replaced without a forward test, because the backtest of
a version you have tuned looks better than it will do going forward.
"""
see_also = ["paper_trading", "live_record", "official_result"]

[[term]]
id = "edge_tonight"
term = "Tonight's signal"
short = "What the nightly run did for a followed edge on the session, so an empty buy list says why."
body = """
Signalled: the edge was due and its picks are listed as buys. No picks: it was due but its screen
qualified no name. Not due: its schedule does not fire on this session (an edge held for 20
sessions signals about once a month). Skipped: it was due but could not be signalled, and the
reason says why (an input table was missing, the edge is not paper traded yet); it is never an
empty record. Not run: the nightly has no finished run for the session. Missed counts due
sessions between nights that nobody signalled, kept so a gap is never silent.
"""
see_also = ["paper_trading", "live_record"]
