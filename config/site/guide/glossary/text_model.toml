# L3 site setting: the Guide glossary, the text model's cost (ADR 0051, docs/ui/guide.md section 3, "Glossary"). One [[term]]
# each: id, term, short (one sentence), body, see_also. Typed by
# src/algotrade/config/site/guide/glossary.py; fitness tests: tests/unit/config/site/guide/test_glossary.py.

# ---------------------------------------------------------------- the text model's cost (ADR 0058)

[[term]]
id = "llm_cost_basis"
term = "Cost basis"
short = "How a text-model call's cost was worked out: priced, reported, bound, free or unknown."
body = """
Every call to the text model is logged with a cost and the way that cost was worked out.
Priced: the tokens it used times the model's price per million tokens. Reported: the notional
cost the Claude Code login says the call was worth (see notional seat cost). Bound: the cost
was not known, so the largest the call could have cost is charged instead (see bound cost).
Free: a local model or a free tier, logged at zero. Unknown: the attempt was skipped, so
nothing was asked and nothing spent. Tokens a provider did not report are shown as unknown, never
as zero.
"""
see_also = ["llm_notional_seat_cost", "llm_bound_cost", "llm_budget"]

[[term]]
id = "llm_notional_seat_cost"
term = "Notional seat cost"
short = "What a call through the owner's Claude Code login would have cost: a size reference, not a bill."
body = """
A Claude Code login is a subscription, so no call is billed on its own. The login still reports
a dollar figure for each call, and the app records it so you can see how heavy the use is. It
counts against the budget (so a runaway loop still stops) but it is shown apart from billed
cost and is not money leaving an account.
"""
see_also = ["llm_cost_basis", "llm_budget"]

[[term]]
id = "llm_bound_cost"
term = "Bound cost"
short = "The most a call could have cost, charged when the real cost is unknown."
body = """
Sometimes a paid provider answers without saying how many tokens it used, or an attempt fails (a timeout can still bill). Then the app charges the upper bound it reserved before the call. That bound is the prompt's length times the input price, plus the longest answer allowed times the output price.
It errs on the high side on purpose, so an unknown never looks like free.
"""
see_also = ["llm_cost_basis", "llm_budget"]

[[term]]
id = "llm_input_tokens"
term = "Input tokens and the cache"
short = "A call's input is the regular input plus the prompt its provider's cache read or wrote."
body = """
A provider can keep the start of a long prompt in a cache and serve it again cheaply. It then reports the prompt in parts: the regular input (the part not cached), the cache read (served from the cache) and the cache write (stored for next time). The whole input of a call is the three added up, and that is what the lists and totals show. The Claude Code login can report a small regular input beside a very large cache read. The regular input alone then understates what was sent.
A part a provider did not report is shown as unknown, never as zero. A Claude Code login call recorded before the cache was stored has an unknown whole input. For the budget, a paid call counts its cache tokens at the full input price. A cached call is never counted as cheaper than an uncached one. A Claude Code login keeps the notional cost it reported.
"""
see_also = ["llm_cost_basis", "llm_budget"]

[[term]]
id = "llm_budget"
term = "Text-model budget"
short = "The daily and monthly caps on what paid and reported text-model calls may spend."
body = """
The site sets an optional daily and monthly cap in dollars, counted by calendar day and month
in New York. Before a paid call the app reserves the most it could cost and refuses the call if
that would pass a cap, so concurrent requests cannot together overspend. When a cap is
reached, the setting decides: free models keep answering and the paid ones are skipped, or
every call is refused. With no cap set, nothing limits the spend; the page says so. Free
providers never count against it. The share of the cap used counts only what has been spent
and recorded, not calls still in flight, so it can read slightly below what the budget
enforces.
"""
see_also = ["llm_cost_basis", "llm_fallback"]

[[term]]
id = "llm_fallback"
term = "Fallback"
short = "A call answered by a later provider because an earlier one in the chain failed or was skipped."
body = """
The text model tries its providers in order. When the first is down, out of retries or skipped for the budget, the next one answers. The call is logged as a fallback, with the provider it fell back from. A high fallback rate means the first choice is unreliable or the budget is tight. A high failure rate means calls are being lost. A failed attempt of a paid provider may still have been billed.
"""
see_also = ["llm_budget", "llm_cost_basis"]

[[term]]
id = "llm_rejected_answer"
term = "Rejected answer"
short = "The model answered, but the app could not use what it said, so the draft or explanation failed."
body = """
A call can succeed at the provider and still fail for the trader. The model answered, but the answer was not the JSON a screener draft needs, had no criteria list, or quoted a number the regime facts do not contain. The first row of the call stays "ok": it was answered and paid for. The app then logs a second row with the outcome "rejected", the reason, the prompt it sent and the raw answer. A rejected row has no cost of its own, so spend is never counted twice. Open the call to read the raw answer. It shows whether the model refused, explained itself in prose, or invented a field. A provider that failed is a "failed" row with its message instead: a timeout, an HTTP error, or an error the Claude Code login reported.
"""
see_also = ["llm_failure_stage", "llm_fallback", "llm_cost_basis"]

[[term]]
id = "llm_failure_stage"
term = "Failure stage"
short = "Where a text-model call failed: at the provider, or in the answer the app received."
body = """
Provider failed: the attempt itself raised, so there is no answer: the message says why (a timeout, an HTTP status, an error from the Claude Code login). The chain then tries the next provider. Answer rejected: the provider answered, the app refused the answer, and the log keeps what the model said. The prompt shown is what the app sent for that call, cut to 2,000 characters; the answer is cut to 8,000. The long system instructions are not kept, only their length. Messages never carry a key or a token.
"""
see_also = ["llm_rejected_answer", "llm_fallback"]
