# L3 site setting: the Guide glossary, edges: the sections of an edge's page and the figures table (ADR 0051, ADR 0064). One [[term]]
# each: id, term, short (one sentence), body, see_also. Typed by
# src/algotrade/config/site/guide/glossary.py; fitness tests: tests/unit/config/site/guide/test_glossary.py.

[[term]]
id = "edge_evidence_section"
term = "Evidence"
short = "The picture and the numbers that justify the verdict: the curve, the out-of-sample result and the figures of both sides of the split."
body = """
The curve comes first because it shows how the result came about, not only where it ended. Under it the strip gives the out-of-sample result in five numbers. They are the win rate, the base rate it is compared with and the lift between them. Then come the trades behind it, with the count the verdict needs, and the share of random-pick backtests it beats. The line under the strip says the same in one sentence. It adds the screen, the holding period and the number of variants tried. The Figures table puts three sets of numbers in three columns: in-sample, out-of-sample and the whole history. A number that holds on one side and not on the other is seen at once. Everything is read for the verdict's own basis, the screen and holding period fixed before the out-of-sample period was read.
"""
next = "Look first at whether the out-of-sample column agrees with the in-sample one, then at how many trades it rests on."
see_also = ["evidence_curve", "verdict_basis", "edge_figures", "out_of_sample", "base_rate", "win_rate", "variants_tried"]

[[term]]
id = "edge_figures"
term = "Figures"
short = "The verdict's numbers in three columns, in-sample, out-of-sample and all, with the out-of-sample column marked."
body = """
Each row is one figure, and each column is one side of the split the edge was frozen at. The out-of-sample column is tinted because it is the fair test: nothing was tuned on it. When its sample is thin, fewer trades than the verdict asks for, the header says n= and the trade count, and its figures swing widely on a few trades. A figure the run did not store reads as a dash, never as zero. The deflated Sharpe ratio and the chance of overfitting are measured on the whole history only, so a dash on one side is normal. The whole-history column adds the other two.
"""
next = "Trust a figure in proportion to the trades behind it: read the n= before the number."
see_also = ["win_rate", "base_rate", "lift", "trades", "sharpe_ratio", "deflated_sharpe", "overfitting_probability"]

[[term]]
id = "edge_how_sure"
term = "How sure"
short = "Whether the result could be luck: the decile staircase, the lifts of random picks, the variants tried and how the number has decayed."
body = """
Three questions about one result. Does the ranking work: the deciles show whether the best-ranked tenth did better than the worst, step by step. Could random picks do as well: the histogram puts the edge's lift among the lifts of random-pick backtests. The line under it counts the variants tried, with the deflated Sharpe ratio, the Sharpe ratio after the haircut and the chance of overfitting. Has it faded: the decay bars follow one number from the paper to the in-sample test, the out-of-sample test and the live record. A bar that says why it is empty (not given, not stored, hidden) is not a zero.
"""
next = "Read the three together: a staircase, a lift beyond most random picks, and a number that holds from stage to stage."
see_also = ["top_vs_bottom_decile", "robustness", "decay", "haircut_sharpe", "variants_tried", "sharpe_ratio", "deflated_sharpe", "live_record"]

[[term]]
id = "edge_where_worked"
term = "Where it worked"
short = "The result cut by year, market regime and holding period, with the drawdown of the evidence curve and the cost sensitivity."
body = """
An average hides when an edge worked. Year by year gives one row for each calendar year. A switch shows the in-sample years, the out-of-sample years or all of them, so a single good year is seen as one. The year the split falls in is two rows, one for each side. The regime view splits the same picks by the market regime on the decision session. The holding-period view shows the screen at each holding period, with the verdict's own marked. The drawdown view draws how far the curve fell below its previous high. It lists the deepest drops with their dates, and the deepest drop and volatility of each side. An edge that earns in one year, or that fell as far out-of-sample as it ever earned, is not the edge its average describes.
"""
next = "Look for a result that is spread over the years, and a drawdown that is no deeper out-of-sample than in-sample."
see_also = ["year_by_year", "by_regime", "by_holding_period", "cost_sensitivity", "drawdown", "partial_year", "in_sample", "out_of_sample", "evidence_curve"]

[[term]]
id = "setups_start_here"
term = "Start here"
short = "Three setups to read first: the best-evidenced ones in the library, each with its idea and verdict."
body = """
The tiles are the first three setups of the best verdict group in the library, so the first tile is the one with the strongest evidence today. Each shows the idea in one sentence and its verdict. Open one to read its rules, how it has done and when it fails. The tiles disappear while you search or filter, because a narrowed list should not be preceded by setups you did not ask for. Everything in the library is a published setup, not personal advice, and every figure on it is a backtest (hypothetical) unless it says forward paper record.
"""
next = "Open the first tile and read the page top to bottom before you look at the others."
see_also = ["verdict", "edge_definition", "setup_how_done", "setup_when_fails"]

[[term]]
id = "setup_how_done"
term = "How it has done"
short = "The setup's result out of sample, labelled backtested (hypothetical), with its curve, its years, its drawdown and its forward paper record."
body = """
The strip gives the out-of-sample result in numbers. They are the win rate, the base rate it is compared with and the lift between them. Then come the trades behind it and the share of random-pick backtests it beats. The line under the strip says which basis the numbers come from. Backtested (hypothetical) means the picks the rules would have made on past data. Forward paper record means the picks the rules made after they were published. A backtest is not a promise: it uses today's stock list, which flatters it. The curve shows how the result came about. Under it, open the year by year, the drawdown and costs, and the figures of both sides of the split. At the foot of the section is the forward paper record, or the reason there is none yet.
"""
next = "Read the trades before the percentage: a result on few trades can be luck."
see_also = ["edge_evidence_section", "out_of_sample", "base_rate", "win_rate", "live_record", "edge_where_worked", "year_by_year"]

[[term]]
id = "setup_when_fails"
term = "When it fails"
short = "How the setup did in each market regime, and at other holding periods: where its edge shrinks or disappears."
body = """
An average hides the markets in which a setup does not work. Each regime row shows the win rate, the base rate and the trades in calm, caution, stress and crisis markets, for the period you choose. A regime where the win rate is no better than the base rate is a market in which the setup has shown no edge. The disclosure under it shows the same screen held for other numbers of trading days, with the verdict's own period marked. A row on few trades is thin: read it as a direction, not a number.
"""
next = "Compare the regime the market is in now, shown in the top bar, with its row."
see_also = ["by_regime", "by_holding_period", "regime", "slice_state", "win_rate", "base_rate"]

[[term]]
id = "setup_before_you_act"
term = "Before you act"
short = "Checks that apply to any setup before relying on one of its ideas."
body = """
A setup publishes an idea and its history, not an instruction. Check the next report date of the name: a report inside the holding period changes what the history measured. The stop on the page is the setup's historical exit rule: the drawdown that most winners never passed. It is not fitted to an account, a position size or a risk limit. Those are yours to set. Every figure is backtested (hypothetical) or a forward paper record, and capital is at risk.
"""
next = "Write down your own stop and size before the first order, not after."
see_also = ["edge_definition", "setup_how_done", "setup_when_fails"]
