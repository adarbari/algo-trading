# L3 site setting: the Guide glossary, the company page's Financials panel and the words it uses (ADR 0051, docs/ui/guide.md section 3, "Glossary"). One [[term]]
# each: id, term, short (one sentence), body, see_also. Typed by
# src/algotrade/config/site/guide/glossary.py; fitness tests: tests/unit/config/site/guide/test_glossary.py.

# ---------------------------------------------------------------- the panel and its sections

[[term]]
id = "financials_panel"
term = "Financials panel"
short = "A company's reported results and the market's forecasts for it, in six sections."
body = """
The panel reads what a company has told the SEC (revenue, profit, debt, cash) and sets it beside what analysts expect and what the share price implies. Growth asks how fast sales and profit are rising. Profitability asks how much of each sales dollar is kept. Balance sheet and cash flow ask whether the company can pay its way. Valuation asks what the market charges for it. Earnings asks whether the last report beat the forecast and which way forecasts are moving. Analysts asks what the forecasts and price targets say about the coming years.

Every figure is the one known by the session's date, by the day the filing was public, so the panel never shows a report the market had not yet seen. A figure the app cannot show is marked with the reason, never filled in. Funds have no financials, and a foreign company that does not report in dollars has none here.
"""
see_also = ["financials_growth", "financials_profitability", "financials_balance_cash", "financials_valuation", "financials_earnings", "financials_analyst", "session", "unknown", "ttm"]

[[term]]
id = "financials_growth"
term = "Growth"
short = "How much a company's sales and earnings per share have risen against a year earlier."
body = """
Growth compares a figure with the same figure a year earlier. Two views sit side by side: the trailing twelve months (smooth, but a quarter old on average) and the latest quarter against the same quarter last year (fresh, but noisy). A company with sales up 12% over twelve months and 25% in the latest quarter is speeding up. One with 12% and 2% is slowing.

Growth from a small base looks large: sales rising from $10M to $20M is 100%. A one-off, such as a sale of a business, also moves earnings growth. Read a quarter's growth beside its twelve-month growth, and check feature.revenue_growth_yoy against feature.eps_growth_yoy: sales growing while earnings fall means costs are rising faster.
"""
see_also = ["financials_panel", "ttm", "net_margin"]

[[term]]
id = "financials_profitability"
term = "Profitability"
short = "How much of each dollar of sales the company keeps as profit."
body = """
Profitability divides profit by sales. The net margin is the final cut, after every cost, interest and tax. A margin of 0.10 means ten cents kept per dollar. Margins differ by industry far more than by quality: a grocer near 0.03 can be excellent and a software company near 0.03 is struggling. Compare a company with others in its sector, and with its own past.

A margin far above the company's history is usually a one-off gain, not a better business. Check the cash version too: rollup.cash_flow@v1.ocf_ttm against rollup.financials@v2.net_income_ttm shows whether the profit became cash.
"""
see_also = ["financials_panel", "net_margin", "free_cash_flow", "ttm"]

[[term]]
id = "financials_balance_cash"
term = "Balance sheet and cash flow"
short = "What the company owns and owes at the last report, and the cash its operations produced."
body = """
The balance sheet is a snapshot on one date: cash and other assets against debt and other liabilities, the difference being the owners' equity. Cash flow is a movement over twelve months: cash from operations, less cash spent on equipment and buildings. Together they say whether a company can pay its debts and fund itself.

Debt is only worrying against what the company earns or holds. A company with $5B of debt and $4B of cash is in a different position from one with $5B of debt and $100M of cash. The balance sheet is dated at the last quarter end and lags the session by weeks. Debt and liabilities are marked with their basis, because filers tag them differently.
"""
see_also = ["financials_panel", "free_cash_flow", "ttm"]

[[term]]
id = "financials_valuation"
term = "Valuation"
short = "What the market pays for a company's earnings and sales, as a ratio of price to each."
body = """
A valuation ratio divides the price by a result. The price to earnings (P/E) ratio is the price over a year's earnings per share: 20 means $20 paid for each $1 of yearly profit. The price to sales ratio is the company's total market value over a year's sales: 2 means $2 paid for each $1 of sales. A high ratio says the market expects growth, a low one says it expects little or doubts the figures.

A ratio is only comparable within a sector and at similar growth: a P/E of 12 is rich for a bank and cheap for software. P/E is blank for a company that lost money, because a negative ratio says nothing. A one-off profit makes P/E look low. Check the net margin and growth before calling a name cheap.
"""
see_also = ["financials_panel", "ttm", "net_margin", "financials_growth"]

[[term]]
id = "financials_earnings"
term = "Earnings: surprise and revisions"
short = "Whether the last report beat the forecast, and which way the forecast for the next one is moving."
body = """
Two things happen around each earnings report. After it, the surprise measures how far the reported earnings per share landed from the consensus forecast. Before the next one, revisions measure how much that forecast has moved as analysts update it.

A name that beats its forecast by 5% is ordinary: most reports beat, because forecasts are set low enough to clear. Compare a surprise with the name's own last four. A forecast that rises for weeks often means analysts are learning good news. A forecast backed by one or two analysts says little. Check the number of estimates before reading a revision.
"""
see_also = ["financials_panel", "earnings_surprise", "forecast_revision", "consensus_forecast"]

[[term]]
id = "financials_analyst"
term = "Analysts: estimates and targets"
short = "What analysts expect a company to earn and sell this year and next, and the share price they target."
body = """
This section sets the market's forecasts beside the reported results. The estimates are the analysts' average for the current fiscal year (FY1) and the year after (FY2): earnings per share, revenue and how many analysts stand behind them. The target is the share price analysts expect, with the highest and the lowest. Upside is the average target over the latest close, minus 1.

Most names have no analyst figures here. The free data source covers a minority of mostly large names, and a missing figure never means analysts expect nothing. When every figure is missing for the same reason, the section says it once. Analysts' EPS usually leaves out one-off items, so forward P/E and the P/E of reported earnings are measured differently: compare them as a rough guide. One or two analysts is an opinion, not a consensus. Check the number of analysts before trusting a forward figure.
"""
see_also = ["financials_panel", "consensus_forecast", "unavailable_not_covered", "financials_valuation", "forecast_revision"]

# ---------------------------------------------------------------- the words the panel uses

[[term]]
id = "ttm"
term = "Trailing twelve months (TTM)"
short = "The last four quarters added up, so a figure covers a full year and no season stands out."
body = """
Companies report every quarter, and a quarter on its own is seasonal: a retailer earns most of its year in the last three months. The trailing twelve months adds the latest four quarters, so each season counts once. It moves a quarter at a time, as each new report replaces the oldest quarter.

When four quarters are not available, the app uses the latest fiscal year and says so (rollup.financials@v2.ttm_basis reads ANNUAL). That figure can be up to a year old. Every TTM carries the date it ends (rollup.financials@v2.ttm_as_of). A TTM is a lagging figure: it describes the year to the last report, not today.
"""
see_also = ["financials_panel"]

[[term]]
id = "consensus_forecast"
term = "Consensus forecast"
short = "The average of the analysts' estimates of what a company will report."
body = """
Analysts who cover a company each publish an estimate of its coming earnings per share. The consensus is the average of them. It sets the bar the next report is judged against: a result above it is a beat, below it a miss. The app stores the consensus with the number of estimates behind it (rollup.earnings_revisions@v1.estimate_count).

A consensus from one or two analysts is thin and moves on a single opinion. It is also not a neutral forecast: analysts tend to guide it low, so most reports beat it. It exists only for the companies analysts cover, so a small name may have none.
"""
see_also = ["earnings_surprise", "forecast_revision", "financials_earnings"]

[[term]]
id = "earnings_surprise"
term = "Earnings surprise"
short = "How far reported earnings per share landed above or below the consensus forecast, in percent of the forecast."
body = """
The surprise is the reported result minus the forecast, divided by the size of the forecast. A name that reports $1.05 against a $1.00 forecast has a surprise of +5%. A negative surprise is a miss. The panel also shows the middle surprise of the last four reports and how many of them beat.

Most reports beat, by about 6% for the middle name, so +5% is ordinary. A surprise is blank when no forecast was stored, when the forecast is tiny (a percent of five cents is noise) or when its sign is in doubt. A surprise says how the report compared with the forecast, not how the share price reacted. Check the price move after the report for that.
"""
see_also = ["consensus_forecast", "financials_earnings", "forecast_revision"]

[[term]]
id = "forecast_revision"
term = "Forecast revision"
short = "How much the consensus forecast for the next report has moved over a week or a month, in percent."
body = """
Analysts raise or cut their estimates as news arrives. The revision compares the consensus now with the consensus a week or 30 days ago, for the same quarter, as a percent of the old figure. A revision of +3% means analysts now expect 3% more profit than they did a week ago. Most names read close to 0.

A revision is only measured for the same fiscal quarter. When the target quarter rolls forward, the comparison is blank, because a new quarter's forecast is not a change of the old one. With few estimates, one analyst's change moves it. Check the number of estimates first.
"""
see_also = ["consensus_forecast", "earnings_surprise", "financials_earnings"]

[[term]]
id = "net_margin"
term = "Net margin"
short = "The share of sales a company keeps as profit after every cost, as a fraction: 0.10 is ten cents per dollar."
body = """
The net margin is net income over revenue, both over the trailing twelve months. Below 0 is a loss, up to 0.05 is thin (retail, airlines), 0.10 and above is healthy, and 0.20 and above is a franchise such as software or payments. The margin tells how much room a company has when costs or prices move.

Margins differ by industry far more than by quality, so compare within a sector. A one-off gain or write-down moves the margin for the twelve months it sits in. The field is feature.net_margin.
"""
see_also = ["ttm", "financials_profitability"]

[[term]]
id = "free_cash_flow"
term = "Free cash flow"
short = "The cash a company's operations produced in a year, less what it spent on equipment and buildings."
body = """
Free cash flow is the cash from operations (rollup.cash_flow@v1.ocf_ttm) minus capital spending (rollup.cash_flow@v1.capex_ttm), over the trailing twelve months. It is what is left to repay debt, pay dividends, buy back shares or keep. A company with $500M of operating cash and $200M of spending has $300M free.

It is lumpier than profit: one large building programme makes a healthy company look negative for a year. A positive figure that comes only from not investing cannot last. Compare it over several years, and against rollup.financials@v2.net_income_ttm to see whether profit becomes cash.
"""
see_also = ["ttm", "financials_balance_cash"]
