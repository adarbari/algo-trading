# L3 site setting: the Guide glossary, an option setup's page (plan O1, ADR 0088, ADR 0051). One [[term]]
# each: id, term, short (one sentence), body, next, see_also. Typed by
# src/algotrade/config/site/guide/glossary.py; fitness tests: tests/unit/config/site/guide/test_glossary.py.
# The rows of "The rules" for an option setup (the declared position) and the figures of "How it has done"
# (the setup's own history on the cash it sets aside, backtested and hypothetical).

[[term]]
id = "option_rules_position"
term = "The declared position"
short = "The option position the setup's document declares: when it decides, its legs, expiry, exits and the cash set aside."
body = """
Each row is read from the setup's own document, not from a pick. The legs are the contracts the setup would open, as a rule (for example one put at 0.30 delta), not a particular strike. The strike is found on the day from that day's chain.
A row the document does not declare is left out.
"""
next = "Read the exit row before the cash set aside."
see_also = ["option_rule_leg", "option_rule_exit", "idea_cash_set_aside"]

[[term]]
id = "option_rule_decides"
term = "Decides"
short = "When the setup looks for a position: every session, or on a schedule such as each month end."
body = """
The setup runs its screener on that day and opens a position for each pick, as a backtest does. A setup that decides every session can hold several positions at once, one per pick.
"""
see_also = ["option_rule_enters"]

[[term]]
id = "option_rule_enters"
term = "Enters"
short = "How many sessions after the decision the position is opened."
body = """
The history prices the entry at that later session, so the decision never uses a price it could not have known. At the decision session means the same close.
"""
see_also = ["option_rule_decides"]

[[term]]
id = "option_rule_leg"
term = "Leg"
short = "One contract of the position, with its side, quantity, strike rule and days to expiry."
body = """
A sold leg is paid the premium and carries the obligation. A bought leg pays the premium and holds the right. The strike is a rule: a delta, at the money, or a percent out of the money. The days are the time left at entry.
A put the setup sells is a bet that the stock stays above the strike.
"""
next = "Compare the leg with the most you can lose on an idea's page."
see_also = ["option_rule_expiry", "idea_cash_set_aside"]

[[term]]
id = "option_rule_expiry"
term = "Expiry (setup rule)"
short = "How far out the setup looks for a contract, and whether it uses monthly or weekly expiries."
body = """
The setup picks the listed expiry nearest the days it declares. A monthly cycle uses the third-Friday contracts; a weekly one uses every listed Friday.
"""
see_also = ["option_rule_leg"]

[[term]]
id = "option_rule_exit"
term = "Exit"
short = "The ways the setup closes a position before expiry: a share of the credit kept, a stop, a day count or a condition."
body = """
Take a share of the credit closes the position once that much of the premium is earned. A stop at a multiple of the credit closes it once the loss reaches that multiple. Days to expiry closes it at that date whatever the price. A condition names the catalogue fields the setup checks.
The backtest applied these exits; a pick today may close sooner or later in practice.
"""
see_also = ["exit_stop_declared", "exit_hold"]

[[term]]
id = "option_rule_reports"
term = "Reports"
short = "Whether the setup skips a name that reports earnings before the contract expires."
body = """
An earnings report during the trade can move the stock sharply. A setup that skips reports never opens a position across one, in the history or today.
"""
see_also = ["option_rule_leg"]

[[term]]
id = "option_rule_case_valued"
term = "Chosen per pick"
short = "A setting the setup decides for each pick from its own data, so the page shows no single value."
body = """
The document does not give one number for it. Each pick gets its own value on the day, and the page for that pick shows it. The history used the same rule.
"""
see_also = ["option_rule_leg"]

[[term]]
id = "option_typical"
term = "Typical option trade"
short = "The middle return of the setup's past trades on the cash set aside, with the range the middle half fell in."
body = """
It is the median of the setup's stored trades at its tested horizon, as a share of the cash set aside, after the document's cost. The range is the first to the third quartile: half of the trades fell inside it.
The figures are backtested and hypothetical. They are not a promise for a pick today.
"""
next = "Read it with a bad trade."
see_also = ["option_bad_trade", "idea_cash_set_aside"]

[[term]]
id = "option_bad_trade"
term = "A bad trade"
short = "The average return of the worst 5% of the setup's past trades, on the cash set aside."
body = """
It is the mean of the worst trades, counted as served beside it, as a share of the cash set aside. A short option has a small gain most of the time and a large loss now and then, so this figure is often many times the typical one.
It is measured on past trades only. A worse trade can happen.
"""
next = "Compare it with the typical trade."
see_also = ["option_typical", "option_stress", "idea_cash_set_aside"]

[[term]]
id = "option_how_sure"
term = "How sure, costs and stress"
short = "How often the premium was kept, what the return is after trading costs, and the worst trade in each past market stress."
body = """
Each row is the setup's own history, backtested and hypothetical. Read the costs from the middle price down to the full spread: a setup that holds up at the full spread is less sensitive to fills.
"""
next = "Open each row's help for what it measures."
see_also = ["option_kept", "option_cost_mid", "option_stress"]

[[term]]
id = "option_kept"
term = "Kept the premium"
short = "How many past trades the figures rest on, and how many returned more than zero on the cash set aside."
body = """
The trades are the setup's stored trades at its tested horizon; with few of them a median or a range is noise. Kept is a count out of all trades, not a probability for the next one. A trade that returned less than zero lost part of the cash set aside, even when it kept some premium.
"""
see_also = ["option_bad_trade", "idea_cash_set_aside"]

[[term]]
id = "option_stress"
term = "Stress windows"
short = "The worst trade the setup had open during each past market stress, as a return on the cash set aside."
body = """
Each window runs from the market's peak to its trough, for example the 2020 crash. The row shows how many of the setup's trades were open in it and the worst return among them. No trade was open means the setup had none then, which says nothing about how it would have done.
A window the history does not cover shows why.
"""
see_also = ["option_bad_trade", "idea_cash_set_aside"]

[[term]]
id = "option_in_sample_only"
term = "In-sample only"
short = "Only trades from the period the setup was designed on are read, so none is a test on data it never saw."
body = """
The figures on this page are from the same history the setup was tuned on. They show what the rule did, not what it would do on new data. The setup has no unseen holdout yet.
"""
next = "Treat the figures as a description until a holdout exists."
see_also = ["option_typical"]

[[term]]
id = "option_by_year"
term = "Option setup, by year"
short = "The setup's past trades grouped by the year they were decided: how many, the typical return and how many kept the premium."
body = """
A year with few trades says little. Look for years that differ from the rest: a setup that earned in only one year relied on that year.
"""
see_also = ["option_typical", "option_kept"]

[[term]]
id = "option_ladder"
term = "Ladder"
short = "A setup that opens a new position on every session and holds each for the same number of sessions, so several overlap at once."
body = """
Each position gets an equal share of the cash set aside: the cash is split into as many slots as positions can be open together. A slot no position fills stays in cash. So the setup never borrows to hold more than its cash, and one bad day's entry is a small part of the whole.
Overlapping positions share most of their days, so they are not separate tests: the figures count them as fewer, longer samples.
"""
see_also = ["option_rule_decides", "setup_tested_again", "idea_cash_set_aside"]

[[term]]
id = "setup_tested_again"
term = "Tested again"
short = "A setup testing another setup's idea with a different rule, read beside it and never as separate proof."
body = """
Trying an idea several ways and keeping the best way makes a lucky result look real. So the more ways an idea is tried, the stronger its evidence must be, and both setups are read together.
Two such setups agreeing is one result, not two.
"""
see_also = ["deflated_sharpe", "option_ladder"]
