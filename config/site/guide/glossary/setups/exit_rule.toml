# L3 site setting: the Guide glossary, a setup's historical exit rule (ADR 0083 decision 3, ADR 0051). One [[term]]
# each: id, term, short (one sentence), body, next, see_also. Typed by
# src/algotrade/config/site/guide/glossary.py; fitness tests: tests/unit/config/site/guide/test_glossary.py.
# The three stop kinds of the exit rule's `kind`, the three bases of its `basis` and an option
# setup's other declared exits, an option's and a share setup's (services/read/evaluation/positions/exit_rule.py).

[[term]]
id = "exit_stop_history"
term = "Historical stop"
short = "The drawdown that most of the setup's winning trades never went past, taken from its own tested history."
body = """
The stop is the 80th percentile of the dip each winning trade took before it won, over the trades the setup's verdict rests on. A stop of 7% below the entry close means 80% of the winners never fell further than that, and 20% did. It is a distance measured on past trades, not a prediction for this pick. It rests on the number of winning trades shown beside it: with few, it is noise. Below the minimum a share setup shows the fallback instead and an option setup shows none. For an option setup the distance is the worst loss on the position's marks as a share of its collateral, not a fall in the share price. Don't read it as the loss a pick will stop at: a pick that falls further can still recover.
"""
next = "Compare the stop with the setup's losing trades in its ledger before relying on the distance."
see_also = ["exit_stop_fallback", "exit_hold"]

[[term]]
id = "exit_stop_fallback"
term = "Fallback stop"
short = "Two times the name's 14-day average true range, shown when the setup has too few winning trades to measure a stop."
body = """
The setup has fewer winning trades than the minimum the percentile needs, so its own history cannot set a distance. The fallback is 2 x the name's average true range over 14 sessions, in dollars per share, read at the session. It says how far this name usually moves in a day or two, nothing about the setup. A name with a quiet last month gets a tight fallback that an ordinary swing can cross. It is not from this setup's history.
"""
next = "Treat the distance as a volatility yardstick and wait for the setup to gather more winning trades."
see_also = ["exit_stop_history", "exit_hold"]

[[term]]
id = "exit_stop_declared"
term = "Declared stop"
short = "The stop the setup's own document declares, published as written because the backtest used it."
body = """
Some setups declare their own exit as part of the rule that was tested. The page shows that rule as written, so the trader sees what the backtest did rather than a distance measured afterwards. A declared stop replaces the historical one for that setup. A share setup declares it as a fall of the entry price: a stop of 0.05 is a close 5% below the entry close. An option setup declares it as a multiple of the credit. It is exactly as good as the test that used it, so check the setup's verdict and sample size.
"""
next = "Read the setup's evidence to see how often the declared stop was reached."
see_also = ["exit_stop_history", "exit_hold"]

[[term]]
id = "exit_hold"
term = "Hold"
short = "How many trading sessions the setup holds a pick, the holding period its verdict was judged on."
body = """
The hold is the horizon of the setup's verdict basis: a hold of 20 means the tested trade closed on the 20th session after entry. It counts exchange sessions, so a weekend adds nothing. An option position cannot outlive its contract, so an option setup's hold is the earlier of that horizon and the option's expiry. The statistics shown for the setup are for that holding period only. A different hold is a different test. Don't stretch it: the evidence says nothing about trades held longer.
"""
next = "Open the setup's evidence to see the results at this holding period."
see_also = ["exit_stop_history", "verdict_basis"]

[[term]]
id = "exit_basis_entry"
term = "Stop basis: entry price"
short = "The stop is a fall in the share price below the entry reference close."
body = """
A share setup's stop is a distance below the close the pick is entered from. A stop of 0.07 on this basis means the share price fell 7% below that close. It is a price level you can watch on a chart. It says nothing about an option position's loss, which depends on its legs and time to expiry.
"""
next = "Turn the fraction into a price with the reference close shown on the idea."
see_also = ["exit_stop_history", "exit_basis_credit", "exit_basis_collateral"]

[[term]]
id = "exit_basis_credit"
term = "Stop basis: credit"
short = "The stop is a loss of this many times the credit the option position collected."
body = """
An option setup that sells premium declares its stop as a multiple of the credit it receives. A stop of 2 on this basis closes the position when its loss reaches twice the credit, at a close. It is the rule the backtest used, so the setup's results already include its stopped trades. A price gap can carry the loss past the stop before a close that would trigger it.
"""
next = "Multiply the credit on the example position by the stop to read it in dollars."
see_also = ["exit_stop_declared", "exit_basis_collateral", "exit_take_profit"]

[[term]]
id = "exit_basis_collateral"
term = "Stop basis: collateral"
short = "The stop is a loss on the option position's marks of this share of the collateral it ties up."
body = """
An option setup that declares no stop gets one from its history. Each winning trade's worst loss on its daily marks is taken as a share of the position's collateral, and the stop is the level 80% of winners never passed. A stop of 0.08 on this basis means a mark loss of 8% of the collateral. Marks are mid prices at the close, so a thin chain can show losses a fill would not have. It is not from a declared rule and the backtest never stopped out at it.
"""
next = "Read it against the collateral on the example position, and against the setup's losing trades."
see_also = ["exit_stop_history", "exit_basis_credit", "position_mark_loss_share"]

[[term]]
id = "exit_take_profit"
term = "Take profit (declared)"
short = "The option setup closes the position once it has captured this share of the credit."
body = """
A take profit of 0.5 on an option setup closes the position at the first close where half the credit collected is kept as profit. A share setup's take profit is another meaning: see take profit on shares. It is part of the rule the backtest used, published as declared. It caps the gain of each trade: the setup trades the rest of the credit for a shorter time at risk. Its results are only for this setting; another setting is another test.
"""
next = "Check how often the setup's trades closed by take profit in its ledger."
see_also = ["exit_basis_credit", "exit_dte_declared", "position_profit_share", "exit_take_profit_entry"]

[[term]]
id = "exit_take_profit_entry"
term = "Take profit on shares (declared)"
short = "The share setup closes the position once the price has risen this fraction above the entry close."
body = """
A take profit of 0.10 on a share setup closes the position at the first close 10% above the entry close. It is a rise of the price, not a share of any credit. It is part of the rule the backtest used, published as declared. It caps the gain of each trade at that close, so a price that gaps past it is still closed at the close, not at the level. The setup's results are for this setting only. Another setting is another test. The target price on the idea is that rise applied to the reference close.
"""
next = "Read the target price beside the stop price to see the range the rule allows."
see_also = ["exit_basis_entry", "exit_stop_declared", "exit_prices", "exit_take_profit"]

[[term]]
id = "exit_prices"
term = "Stop and target prices"
short = "The stop and the take profit as prices: the reference close moved by the setup's declared or measured distances."
body = """
The stop price is the reference close at the session less the stop's distance. That distance is a fraction of the close, declared or from the winners' history, or for the fallback a multiple of the name's average true range. The target price is the close plus the declared take profit, see take profit. They are levels to watch, computed from the close the pick was read at, not from tomorrow's open. The entry may fill at another price, and a gap can carry a close past either level. A missing close leaves both blank with the reason, never an older price.
"""
next = "Re-compute both from your own fill price if you enter away from the reference close."
see_also = ["exit_take_profit_entry", "exit_basis_entry", "exit_stop_history", "exit_take_profit"]

[[term]]
id = "exit_dte_declared"
term = "Exit days to expiry (declared)"
short = "The option setup closes the position at this many calendar days before the option expires."
body = """
An exit at 21 days to expiry closes the position at the first close with 21 calendar days or fewer left, whatever its profit. Setups declare it to avoid the last weeks, when a price move changes an option's value fastest. It is part of the tested rule and counts calendar days, unlike the hold, which counts sessions.
"""
next = "Read the hold beside it: the earlier of the two ends the trade."
see_also = ["exit_hold", "exit_take_profit", "position_dte"]

[[term]]
id = "exit_condition_declared"
term = "Exit condition (declared)"
short = "A rule over the position's own fields and market fields that closes the option position at the first close it is true."
body = """
Beside its fixed exits an option setup can declare a condition, such as the position's delta passing a level. The page names the fields it reads, each with its own Guide entry. The condition is checked at closes only, and one whose fields are unknown at a close never fires. It is part of the rule the backtest used.
"""
next = "Open each field's Guide entry to see what it measures and when it can be missing."
see_also = ["exit_take_profit", "exit_dte_declared", "position_delta"]

# How a trade in a setup's ledger closed (the trade contract's `exit_kind`, ADR 0088 2.5a): the
# declared exits above, plus the ways an option or share position ends on its own.

[[term]]
id = "exit_expired"
term = "Expired"
short = "The option position was held to its expiry and closed at the value it had then."
body = """
The trade ran to the option's expiry with no exit rule closing it first. An option out of the money at expiry is worth nothing, so a sold option keeps its whole credit. One in the money is worth what it is in the money, and that is what was paid to close it. The return is on the collateral the position set aside for its whole life.
"""
next = "Compare expired trades with those closed early in the ledger to see what the exit rules changed."
see_also = ["exit_hold", "exit_take_profit", "exit_assigned"]

[[term]]
id = "exit_assigned"
term = "Assigned"
short = "A sold option was exercised against the position at expiry, so the trade ended with shares bought or sold at the strike."
body = """
A sold put in the money at expiry is assigned: the seller buys the shares at the strike. A sold call in the money is assigned the other way. The trade is closed at that point and its return counts the shares at the expiry close against the strike. A setup that keeps the shares to sell calls against them is a different setup, tested on its own.
"""
next = "Check how often the setup's trades were assigned before you sell puts on names you don't want to own."
see_also = ["exit_expired", "exit_early_assigned_dividend"]

[[term]]
id = "exit_early_assigned_dividend"
term = "Assigned early before a dividend"
short = "A sold call in the money was exercised before expiry, on the day before the shares went ex-dividend."
body = """
An owner of a call in the money can exercise it the day before the shares go ex-dividend, to collect the dividend. When the dividend is worth more than the call's remaining time value, the backtest treats the sold call as exercised then. The trade ends early with the shares delivered at the strike. A covered call over a dividend date carries this risk.
"""
next = "Look at the ex-dividend dates inside a covered call's life before relying on its full credit."
see_also = ["exit_assigned", "calls_early_exercise"]

[[term]]
id = "exit_delisted"
term = "Delisted"
short = "The shares stopped trading during the trade, so it ended at the last close that was stored."
body = """
A name can be delisted after a merger, a buyout or a failure. The trade is ended at its last stored close and counted, never dropped: leaving it out would make the setup look better than it was. A takeover usually ends with a gain, a failure with a large loss.
"""
next = "Read a delisted trade's return and the news behind it before treating it as typical."
see_also = ["exit_hold"]
