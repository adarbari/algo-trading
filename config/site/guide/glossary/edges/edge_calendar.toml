# L3 site setting: the Guide glossary, edges: the calendar windows an edge schedule may use (ADR 0051, ADR 0053). One [[term]]
# each: id, term, short (one sentence), body, see_also. Typed by
# src/algotrade/config/site/guide/glossary.py; one term per window of src/algotrade/core/time/windows.py
# (id = calendar_<window>), kept complete by tests/architecture/guide/test_calendar_windows_guide.py.

[[term]]
id = "calendar_turn_of_month"
term = "Turn of the month"
short = "The edge is held for the last trading day of a month and the first three of the next."
body = """
This schedule opens one trade a month. The screen runs two sessions before the month's last. The entry is the session before the last. The trade is held for 4 sessions: the last session and the three after it. Pay and pension money tends to arrive then, and some traders say it lifts prices. The calendar fixes the dates ahead, so nothing about the window is known late. Windows never overlap, so each month is one independent trade. Example: for February 2026 the window is 27 February and 2, 3 and 4 March. A year holds 12 windows, so even ten years give only about 120 trades. Treat a result from fewer than 100 as noise. Don't read a small lift as proof: one strong year can carry it. Check the out-of-sample figure and the result by year instead.
"""
next = "Open the edge's result and read the out-of-sample lift and the trades behind it."
see_also = ["base_rate", "out_of_sample", "calendar_quarter_end"]

[[term]]
id = "calendar_opex_week"
term = "Option expiry week"
short = "The edge is held for the five sessions that end on a month's standard option expiry, normally the third Friday."
body = """
This schedule opens one trade a month, held for 5 sessions up to and including the monthly option expiry. In that week dealers who sold options adjust their stock hedges, which can move large and heavily optioned stocks more than the rest. The expiry is the third Friday, or the Thursday when the Friday is a market holiday. After a Thursday expiry the window starts on the Friday before, so it still has 5 sessions. Windows never overlap, so each month is one independent trade. Example: the window of January 2026 is 12 to 16 January. A year holds 12 windows, so fewer than 100 trades is noise. A pattern that appears only in large stocks may be a size effect, not an expiry effect. Compare the picks with the base rate of the same week.
"""
next = "Compare the picks with the base rate of the same week, then check the result by year."
see_also = ["base_rate", "out_of_sample", "calendar_turn_of_month"]

[[term]]
id = "calendar_after_monthly_expiry"
term = "First session after monthly expiry"
short = "The edge opens on the first trading day after a month's standard option expiry, the day the Cboe PUT index rolls."
body = """
This schedule opens one trade a month, on the first session after the monthly option expiry. The expiry is the third Friday, or the Thursday when the Friday is a market holiday (Good Friday, Juneteenth). The Cboe PUT index sells a new put on that day, so a short-put setup that copies it enters then. The calendar fixes the date ahead, so nothing about it is known late. Windows are a month apart, so each is one independent trade. Example: for April 2025 the expiry is Thursday 17 April and the entry day is Monday 21 April. A year holds only 12 entries, so fewer than 100 trades is thin. Check the result by year before trusting a small lift.
"""
next = "Read the result with the trades behind it, then check it by year."
see_also = ["base_rate", "out_of_sample", "calendar_opex_week"]

[[term]]
id = "calendar_quarter_end"
term = "Quarter-end window"
short = "The edge is held for the last five trading days of March, June, September and December."
body = """
This schedule opens one trade a quarter, held for 5 sessions that end on the quarter's last session. Funds that rebalance or tidy their books at quarter end can push stocks they bought or sold in the quarter. The calendar fixes the window ahead, so nothing about it is known late. Windows are a quarter apart, so each is one independent trade. Example: the window of March 2026 is 25, 26, 27, 30 and 31 March. A year holds only 4 windows, so ten years give about 40 trades, which is thin. Treat a result from fewer than 40 as noise. Don't compare picks with last quarter's winners alone: a loser that rebounds in the next quarter's first days is outside this window. Read the lift with the trades behind it.
"""
next = "Read the lift together with the trades behind it, and wait for more quarters before trusting it."
see_also = ["base_rate", "out_of_sample", "calendar_turn_of_month"]

[[term]]
id = "calendar_pre_month_end"
term = "Last three sessions of the month"
short = "The edge is held for the last three trading days of every month."
body = """
This schedule opens one trade a month, held for 3 sessions that end on the month's last session. Funds that tidy their books before the month closes can push prices in those days. The calendar fixes the window ahead, so nothing about it is known late. Windows are a month apart, so each is one independent trade. Example: the window of February 2026 is 25, 26 and 27 February. A year holds 12 windows, so ten years give about 120 trades. Treat a result from fewer than 100 as noise. It is not the month-end rebalance schedule, which trades once at month end. Check the out-of-sample figure and the result by year before trusting a small lift.
"""
next = "Open the edge's result and read the out-of-sample lift and the trades behind it."
see_also = ["base_rate", "out_of_sample", "calendar_turn_of_month"]

[[term]]
id = "calendar_year_turn"
term = "Turn of the year"
short = "The edge is held for the last five trading days of December and the first five of January."
body = """
This schedule opens one trade a year, held for 10 sessions: the last 5 of December and the first 5 of January. Tax selling, window dressing and new-year buying are said to move prices around the turn. The calendar fixes the window ahead, so nothing about it is known late. The window belongs to the year that December is in. Example: the window of 2025 runs from 24 December 2025 to 8 January 2026. A year holds only 1 window, so ten years give 10 trades, which is far too few to trust. Treat any result as a hint to watch, not a finding. Read the lift together with the trades behind it.
"""
next = "Read the lift together with the trades behind it, and wait for more years before trusting it."
see_also = ["base_rate", "out_of_sample", "calendar_quarter_end"]

[[term]]
id = "calendar_pre_holiday"
term = "Before a holiday"
short = "The edge is held for the one trading day before a scheduled market holiday."
body = """
This schedule opens a trade for the single session before each scheduled full-day closure, about nine a year. Traders who avoid holding through a closed market may leave prices a little higher that day. Only closures the calendar set ahead count: Thanksgiving and Christmas do, a day of mourning or a storm closure does not. The window is 1 session long, so the horizon is 1. Windows are distinct days, so they never overlap. Example: for Independence Day 2026, observed on Friday 3 July, the window is Thursday 2 July. One day is a small move, so costs can erase a small lift. Check the edge's cost estimate before reading the result.
"""
next = "Open the edge's cost estimate and compare it with the lift."
see_also = ["base_rate", "out_of_sample", "calendar_turn_of_month"]

[[term]]
id = "base_out_of_window"
term = "Compared with its own other days"
short = "An edge on one fund or index is judged against that same fund's returns on days outside the window."
body = """
Some edges time one instrument, not a list of names: hold SPY over the turn of the month, say. There is no crowd to compare it with, so the comparison is the same instrument on ordinary days. Each window's return is set beside the returns of equal-length stretches outside every window. The result shows the difference in average return and a t-ratio for it. It also shows the share of windows that gained against the share of other stretches that gained. The Sharpe ratio and its t are read from each window minus the stretch right after it. A fund that only rises then does not pass on drift. Windows are few: about 12 a year for a monthly window. Treat a result from fewer than 100 windows as noise. A high t from many tries is weaker than it looks, so read the trial count beside it.
"""
next = "Read the difference and the t-ratio together with the number of windows behind them."
see_also = ["base_rate", "out_of_sample", "calendar_turn_of_month", "sharpe_ratio"]
