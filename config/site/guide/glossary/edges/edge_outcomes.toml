# L3 site setting: the Guide glossary, edges: what counts as an edge working (the outcome kinds and the option structures of an outcome; ADR 0053, ADR 0051). One [[term]]
# each: id, term, short (one sentence), body, next, see_also. Typed by
# src/algotrade/config/site/guide/glossary.py; fitness tests: tests/unit/config/site/guide/test_glossary.py.

[[term]]
id = "outcome_excess_return"
term = "Outcome: Excess return"
short = "A pick works when it beats the benchmark over the holding period, after the round-trip cost."
body = """
The edge's value for a pick is its return from the entry close to the close at the horizon. The
benchmark's return over the same days is taken off. So is the cost, in basis points of the entry
price, charged once. A pick hits when that number is above zero. It is a return, so its windows add up
to a curve. Example: a pick that gains 3% while SPY gains 1%, with a 25 bp cost, scores 1.75%.
A hit rate alone hides size: a pick can hit often and still lose money when the misses are large.
Don't read one window as a result; the verdict needs enough out-of-sample trades.
"""
next = "Read the mean excess return and the hit rate against the base rate on the edge page."
see_also = ["edge", "base_rate", "win_rate", "verdict"]

[[term]]
id = "outcome_residual_return"
term = "Outcome: Residual return (factor-neutral)"
short = "An excess-return edge whose value is the return left after market, size, momentum and value moves are taken off."
body = """
The edge names the measure residual return. The value for a pick is its return over the holding
period minus what its factor loadings explain. That is the loading on each factor times that
factor's return over the same days. The factors are ETF proxies. They are the market (SPY), size
(IWM minus SPY), momentum (MTUM minus SPY) and value (VLUE minus SPY). Sector exposure is not
taken off. The loadings come from the 252 sessions ending before the entry session, so nothing of the holding period is in them. The figure is factor-neutral. An edge
that only holds a cheap, small or high-momentum basket earns about zero here. Cost is charged once,
as for an excess return. It is a return, so its windows add up to a curve. A name the factors cannot
cover is unmeasured, never a zero and never a market-only residual. That covers windows before 2013
(MTUM and VLUE have no history), a name with too short a history, and a window not stored yet.
Example: a pick that gains 3% when its loadings explain 2% leaves a residual of 1%, before cost.
Don't compare it with the excess return of another edge: the two answer different questions.
"""
next = "Read the factor-neutral mean and the hit rate; unmeasured windows are counted, not hidden."
see_also = ["edge", "outcome_excess_return", "base_rate", "verdict"]

[[term]]
id = "outcome_hit_target"
term = "Outcome: Hit target"
short = "A pick works when a measure over the holding period lands on the right side of a target."
body = """
The edge names a measure (the excess return, or realised over implied volatility), a direction
(below or above) and a target. A pick hits when the measure is on the named side; equal is a
miss. The value shown is the measure itself, oriented so higher is better. It is not a return,
so the edge's curve counts wins above what the base rate predicts. Example: realised over implied
volatility below 1.0 hits when the stock moved less than options priced. Don't read a ratio near
the target as a result: a few points either side flips the hit.
"""
next = "Read the hit rate against the base rate; the size shown is the measure's mean, not money."
see_also = ["edge", "base_rate", "win_rate", "verdict", "not_a_return"]

[[term]]
id = "outcome_expires_otm"
term = "Outcome: Expires out of the money"
short = "A pick works when the short option it describes would not be assigned at the horizon's close."
body = """
The strike is set at the entry close from the implied volatility known the session before, by
delta or by a fixed distance. A pick hits when the price at the horizon stays on the safe side of
it (both sides for a strangle). The value is the cushion to the nearest strike. No premium and no
profit and loss is counted. A high hit rate therefore overstates what selling the option earns,
because a few large misses can cost more than many small wins. The risk-neutral chance of the hit and how
often the strike was touched on the way are shown beside the hit rate, never inside it.
"""
next = "Compare the hit rate with its risk-neutral reference; for money, use a modelled P&L outcome."
see_also = ["edge", "base_rate", "win_rate", "outcome_option_model_pnl"]

[[term]]
id = "outcome_option_model_pnl"
term = "Outcome: Option model P&L"
short = "A pick works when a modelled straddle position would have made money over the holding period."
body = """
The value is the profit and loss of one at-the-money straddle opened at the entry close. It is a
fraction of the entry price, from the implied volatility known the session before and the stored
price window. The option price is a model price (basis model), not a quote. The stored data holds
no historical option prices, so the real spread and fill are not in it. The structure says which
position is modelled (long, short or delta-hedged). The cost in basis points of the entry price
is charged once; no hedging cost is modelled. A volatility or window that is missing makes the
pick unmeasured, with the reason, never a zero. The implied volatility keeps its source's licence. Example: at 30% implied volatility over 21 sessions a straddle costs 6.9% of the
price, so a stock that moves 10% earns a long straddle 3.1%.
The implied volatility is a 30-day figure. The edge's horizons must therefore lie between 10 and
42 sessions. A shorter or longer window would price the wrong option, so the document is refused.
Don't read it as money earned: it is a model of the structure on the stored data.
"""
next = "Check the structure and the basis label before comparing it with an excess-return edge."
see_also = ["model_basis", "straddle_long", "straddle_short", "delta_hedged_straddle", "edge", "base_rate"]

[[term]]
id = "straddle_long"
term = "Structure: Long at-the-money straddle"
short = "A call and a put bought at the entry price and held to the horizon: it pays when the move is large."
body = """
The modelled position loses the straddle's price if the stock ends where it started and gains
the move beyond that price in either direction. Its value is the absolute return less the
model price at the implied volatility. Example: at 30% implied volatility over 21 sessions the
price is 6.9% of the stock; a 2% move loses 4.9%, a 12% move gains 5.1%. It is the position of a
trader who expects a larger move than options price. Most windows lose a little and a few win a
lot, so the hit rate alone says little. The edge's horizon must be near the implied volatility's
30 days, so a window of a few sessions around a report cannot be modelled this way.
"""
next = "Read the mean value and how often it is above zero; a model, so no fill or spread is in it."
see_also = ["outcome_option_model_pnl", "model_basis", "straddle_short"]

[[term]]
id = "straddle_short"
term = "Structure: Short at-the-money straddle"
short = "The straddle sold and held to the horizon: it pays when the move is small and loses when it is large."
body = """
The modelled value is exactly the long straddle's value with the sign reversed. It wins the
price of the straddle if the stock ends where it started and loses the move beyond that price.
The hit rate is usually high and the losses are large and rare, so judge the mean value, not
the win rate. Example: at 30% implied volatility over 21 sessions a 2% move earns 4.9% and a
12% move loses 5.1%. The model has no margin, no assignment and no early exit.
Don't size a real position from a modelled average.
"""
next = "Read the mean value and the worst windows before the hit rate."
see_also = ["outcome_option_model_pnl", "model_basis", "straddle_long", "win_rate"]

[[term]]
id = "delta_hedged_straddle"
term = "Structure: Delta-hedged at-the-money straddle"
short = "A long straddle whose stock exposure is hedged every day, so it earns the gap between realised and implied volatility."
body = """
Hedging removes the direction of the move and leaves the size of the daily moves. The modelled
value is the straddle's sensitivity to volatility times (realised volatility squared minus
implied volatility squared) over twice the implied volatility, the standard approximation
for small gaps. It is positive when the stock moved more than options priced and negative when it moved less.
Example: realised 34% against implied 30% over 21 sessions is worth about 1% of the price.
It overstates the gain a little for large gaps and ignores hedging costs and jumps between hedges.
"""
next = "Read it as the variance risk premium's size; the short side is its own structure."
see_also = ["outcome_option_model_pnl", "model_basis", "straddle_long", "delta_hedged_straddle_short"]

[[term]]
id = "delta_hedged_straddle_short"
term = "Structure: Short delta-hedged at-the-money straddle"
short = "The hedged straddle sold: it earns the gap when options price more movement than the stock delivers."
body = """
The modelled value is exactly the delta-hedged long straddle's value with the sign reversed. It
is positive when the stock moved less than options priced, the variance risk premium that a seller
collects, and negative when it moved more. The hedge removes the direction, so one large move
does not dominate, but the hedged seller still loses when volatility jumps. Example: realised 26%
against implied 30% over 21 sessions earns about 1% of the price; realised 34% loses about 1%.
The model ignores hedging costs and jumps between hedges, so a real seller earns less.
Don't size a real position from a modelled average.
"""
next = "Read the mean value and the worst windows before the hit rate."
see_also = ["outcome_option_model_pnl", "model_basis", "delta_hedged_straddle", "win_rate"]

[[term]]
id = "outcome_pair_spread"
term = "Outcome: Pair spread"
short = "A pick is the cheap share class of an issuer, and it works when it returns more than its sibling class."
body = """
Some issuers list two share classes with the same cash flows. The sibling of each is read the
session the screen runs (rollup.share_classes@v1.sibling_id), never from today's reference, so a
later reclassification cannot leak in. The value is the pick's return minus its sibling's over the
same window. Two round-trip costs come off, and so does the borrow cost of the sibling, the leg
sold short. A pick hits when the value is above zero. The comparison rate is every eligible class
against its own sibling. The result is judged as a spread, so it is a diagnostic and never a
verdict basis. Some names cannot be paired: a name with no sibling, a sibling not in the universe,
a sibling that does not name it back, or one with no return. Each is excluded with its reason, never counted as zero. Few issuers
qualify, about 15 to 25, so read the number of independent windows beside the figure. Don't read
it as a trade: the borrow cost is an assumed rate, and no short availability is stored.
"""
next = "Check how many pairs and independent windows stand behind the figure before the mean."
see_also = ["outcome_excess_return", "share_class_pair", "side_long_short", "verdict_basis", "base_rate"]

[[term]]
id = "share_class_pair"
term = "Share class pair"
short = "Two listed share classes of one issuer, found from the reference snapshot the session sees."
body = """
A pair is PAIRED when an issuer has exactly two share classes with one listed id each. It is
AMBIGUOUS when it has three or more classes, or a class listed under several ids. Then no sibling
is named, because a guess could pair a name with the wrong class. Classes are told apart by the
issuer and the share-class FIGI the reference stores. Only operating companies count; a fund or a preferred share is
not a class. The z-score field (rollup.share_classes@v1.spread_z_252d) says how far today's price ratio is from its
own year: below zero means this class is cheap against its sibling.
"""
next = "Read the status before the z-score; an ambiguous issuer has no pair to compare."
see_also = ["outcome_pair_spread"]

[[term]]
id = "model_basis"
term = "Model basis"
short = "A value priced by a formula on stored inputs, not read from a market quote."
body = """
A result with the basis model was computed with an option pricing formula from the implied
volatility and the stock's price window, because no historical option prices are stored. It
answers what the structure would have earned in the formula's world. It leaves out the quoted
spread, the fill, margin and early exercise, so a real result can be lower. When option chains
have been stored long enough, a result priced from real quotes will carry a different basis.
Don't compare a model result with a result from quotes as if they were the same kind of number.
"""
next = "Treat a model result as a size estimate; the edge's evidence needs the same sample rules as any other."
see_also = ["outcome_option_model_pnl", "edge", "out_of_sample"]

[[term]]
id = "outcome_option_pnl"
term = "Outcome: Option chain P&L"
short = "A pick works when an option position bought from the stored chain quotes would have made money over the holding period."
body = """
The position is priced from the option chains we store. It is bought at the ask of the entry
close and sold at the bid of the exit close, so the quoted spread is paid. The value is the profit and loss as
a fraction of the entry price of the stock. The structure says which position is held (a straddle, a
hedged straddle or a short put) and the tenor says how far out the options expire. The hedged
structures also trade the stock every day using our own delta from each session's chain. A
chain that is missing or stale on a session of the window makes the pick unmeasured, with the
reason, never a zero. Chains are stored only from 2 October 2026, after every frozen period, so the
results grow one session at a time and stay insufficient for weeks. Example: a straddle bought at
6% of the price and sold at 7.5% with a 1% spread cost earns about 0.5% of the stock price. Don't
read the first few windows as a result: the sample is small.
"""
next = "Check the chain basis and the number of measured windows before reading the verdict."
see_also = ["chain_basis", "chain_outcome_unmeasured", "straddle_long", "put_short", "edge", "out_of_sample"]

[[term]]
id = "chain_basis"
term = "Chain basis"
short = "A value priced from stored option quotes at the entry and exit sessions, not from a formula."
body = """
A result with the basis chain used the bid, ask and mid of real quotes we stored on the entry
session and on the exit session. It pays the quoted spread and uses our own delta, computed from
each session's chain, for any hedge. It leaves out the fill below the quote, margin, early
exercise, the cost of trading the stock and financing, so a real result can be lower.
Chains exist only from 2 October 2026. Every row is out of sample: no earlier period is
stored to choose a setting from. The verdict can reach Promising but not Works until the rule
for such a basis is amended. Don't compare a chain result with a model result as if both
were the same kind of number.
"""
next = "Treat the first results as a small sample and read how many windows were measured."
see_also = ["outcome_option_pnl", "model_basis", "edge", "out_of_sample"]

[[term]]
id = "put_short"
term = "Structure: Short put by delta"
short = "A put sold at the strike whose delta matches the edge's setting and held to the horizon."
body = """
The strike is chosen on the entry session from the chain: the listed put whose own delta is nearest
the edge's strike delta. The position collects the put's premium and pays back its later price.
It earns when the stock stays above the strike and loses when it falls through it. The
value is net of the quoted spread. Example: a put sold for 1.0% of the price and bought back
at 0.4% earns 0.6% less the spread. Wins are frequent and the losses are large and rare, so
judge the mean value, not the win rate. There is no margin, assignment or early exit in the
number. Don't size a real position from it.
"""
next = "Read the mean value and the worst windows before the hit rate."
see_also = ["outcome_option_pnl", "chain_basis", "straddle_short", "win_rate"]

[[term]]
id = "chain_outcome_unmeasured"
term = "Chain outcome: Unmeasured"
short = "A chain P&L window with no value because a quote it needs was missing or stale."
body = """
The row is kept with its reason and no profit and loss, and the harness counts the pick as
unmeasured, never as a loss or a zero. NO_CHAIN means a session of the window has no chain for the
name. STALE_CHAIN means the feed served an older session's chain, so it is not used. NO_EXIT_QUOTE
means a contract has no two-sided quote at the exit. NO_DELTA means a hedge delta could not be
computed on a session. NO_EXPIRY means no listed expiry could be held to the window's end.
NO_ENTRY_QUOTE means no two-sided strike or no underlying quote at the entry. NO_PNL means a
price was missing in the arithmetic. NO_CHAIN, STALE_CHAIN and NO_DELTA on a session between the
entry and the exit cost only the hedged value. The row keeps its unhedged value, and a hedged
edge reads it as unmeasured. Don't fill the gap from an older chain.
"""
next = "Read how many windows were measured; a high unmeasured share means the sample is thinner than it looks."
see_also = ["outcome_option_pnl", "chain_outcome_complete", "chain_basis"]

[[term]]
id = "chain_outcome_complete"
term = "Chain outcome: Complete"
short = "A chain P&L window measured from stored quotes on every session it needs."
body = """
The entry and the exit session have a current chain for the name. The contracts were quoted at
the entry and the exit. The hedged value also needs a current chain and a delta on each session in
between; without them only the hedged value is missing.
The values are stored with the contracts held, so the result can be audited. A complete window is
a measurement of one name over one holding period, not a forecast. It is known only after the exit
session's chain was stored, which is in the evening. Don't read one complete window as a result.
"""
next = "Read the mean value across windows and how many were measured."
see_also = ["outcome_option_pnl", "chain_outcome_unmeasured", "chain_basis"]

[[term]]
id = "outcome_portfolio_return"
term = "Outcome: Portfolio return"
short = "A book of the screen's picks works when it beats a blended benchmark over the holding period, after the cost of changing the book."
body = """
This outcome judges a whole allocation, such as an ETF rotation, not each pick on its own. At each
rebalance the picks are weighted into one book. The value of the session is the book's return from
the entry close to the close at the horizon, minus the return of the benchmark over the same days.
A session wins when that is above zero after the cost. Cost is paid only on the weight that
changes between rebalances, so a book that holds still pays nothing. There is no base rate: the
benchmark is the base, and a session that cannot be valued is left out with its reason, never
counted as zero. With fewer than about 20 ranked names there are no deciles either. Example: a
60% stock and 40% bond mix returns 1.0% and the book 1.8%, so the session is worth 0.8%. Don't
read a high win rate as size: read the mean excess return and the t of the series.
"""
next = "Read the mean excess return and its t, then the blended benchmark and the weighting it used."
see_also = ["blended_benchmark", "weighting_equal", "cash_position", "outcome_excess_return", "base_rate", "win_rate"]

[[term]]
id = "blended_benchmark"
term = "Blended benchmark"
short = "A fixed mix of instruments, such as 60% SPY and 40% AGG, that a book must beat."
body = """
A rotation between stocks and bonds is not fairly compared with stocks alone. The edge names its
own mix, written as each ticker and its weight, and the weights add to one. The mix's return is the
weighted return of the constituents over the same window as the book's. Each constituent is read
from the stored outcome rows at the entry session. A session where a constituent has no row is left
out with the reason, never filled with a guess. The mix is not rebalanced inside the window.
Example: SPY returns 2% and AGG 0%, so a 60/40 mix returns 1.2%. A passive mix is hard to beat
after costs, so a book that only matches it has no edge.
"""
next = "Check that the mix is what a passive holder of the same assets would have owned."
see_also = ["outcome_portfolio_return", "outcome_excess_return"]

[[term]]
id = "weighting_equal"
term = "Weighting: Equal"
short = "Every name in the book has the same weight, one over the number of picks."
body = """
The book splits itself evenly across the names the screen picks at the decision session. It needs
nothing but the picks, so it has no input that can be missing. It ignores how risky or how highly
ranked each name is. Example: three picks have a third each. A few volatile names can then
dominate the book's swings.
"""
next = "Compare it with inverse volatility if the picks differ a lot in risk."
see_also = ["weighting_inverse_vol", "weighting_score", "outcome_portfolio_return"]

[[term]]
id = "weighting_inverse_vol"
term = "Weighting: Inverse volatility"
short = "Each name's weight is proportional to one over its volatility, so calmer names get more."
body = """
The edge names the volatility feature it reads, and the value known at the decision session
sets the weights. A name twice as volatile gets half the weight, so each name contributes a
similar amount of risk. A name with no usable volatility makes the whole session unmeasured, with
the reason: the book is never quietly built from the names that have one. Example: names with
10% and 20% volatility get two thirds and one third. Don't read the weights as a forecast: they
only size the names by past movement.
"""
next = "Check that the volatility feature is known at the decision session for every pick."
see_also = ["weighting_equal", "weighting_score", "outcome_portfolio_return"]

[[term]]
id = "weighting_score"
term = "Weighting: By score"
short = "Each name's weight is proportional to the screen's score, so the best-ranked names get more."
body = """
The screen's score at the decision session sets the weights, so a name with twice the score has
twice the weight. A score is a ranking key, not a size, so every pick needs a positive score. A
pick without one makes the session unmeasured, with the reason. Example: scores of 3 and 1 give
three quarters and one quarter. Weighting by score can concentrate the book in one name, and the
size of a score is only meaningful if the screen was built to carry it.
"""
next = "Use it only for a screen whose score is a size, and compare it with equal weights."
see_also = ["weighting_equal", "weighting_inverse_vol", "outcome_portfolio_return"]

[[term]]
id = "cash_position"
term = "Cash position"
short = "Money a book does not invest, which earns the Treasury bill yield known at the decision session."
body = """
A trend filter can send a book to cash. A pick named CASH earns the bill yield read at the decision
session, scaled to the holding period as the yield times the sessions held over 252. Each place the screen leaves unfilled (fewer qualify than the edge's top K) is cash too. A session with
no picks at all is a cash session: the whole book is in cash and is measured, not left out. Cash
costs nothing to enter or leave. If no yield is stored for the session, the session is left out with
the reason, never given a zero return. Example: a 4% yield over 21 sessions earns 0.33%. The
benchmark never holds cash, so a book in cash is judged on what it missed or avoided.
"""
next = "Look at how often the book was in cash and what the benchmark did in those sessions."
see_also = ["outcome_portfolio_return", "blended_benchmark"]

[[term]]
id = "edge_ensemble"
term = "Ensemble"
short = "A grid of screeners fixed in advance whose books are averaged each session into one result, tried once."
body = """
A trend rule has a lookback to choose: 3, 6, 9 or 12 months. Picking the best lookback after seeing the
results would overfit. An ensemble lists the whole grid in the edge's document before the run. Each
session the members' books are averaged name by name, and the average is valued as one book. The
ensemble counts as one trial, however many members it has, because no member was chosen over another;
the grid size is shown beside it. If one member cannot be read or weighted for a session, the session
is left out, never averaged over the others. Example: four lookbacks each hold 25% in name A in one
session, so the ensemble holds 25% in A. Don't read a member as a result of its own: it is shown, never
the basis of a verdict.
"""
next = "Judge the ensemble's line; read each member only to see how much they differ."
see_also = ["ensemble_member", "outcome_portfolio_return", "weighting_equal"]

[[term]]
id = "ensemble_member"
term = "Ensemble member"
short = "One screener of an ensemble's grid: its own book is reported, but it is neither a trial nor a basis."
body = """
Members are measured like any screener of a book, so the page can show how far the grid's choices
disagree. They are not counted among the trials of the deflated Sharpe ratio, and a verdict never
rests on one, since the ensemble was fixed to avoid choosing among them. A member that beats the
ensemble is not a better edge. It is the best of the grid in hindsight, which is the choice an
ensemble is there to avoid.
"""
next = "Compare a member with the ensemble only to see the spread, never to pick one."
see_also = ["edge_ensemble", "outcome_portfolio_return", "deflated_sharpe", "sharpe_ratio"]

[[term]]
id = "vol_target_sizing"
term = "Volatility target"
short = "A book scaled down so its recent volatility is at most a stated level, the rest held in cash."
body = """
Some books are sized to a risk level, not only to a mix. The edge states a target (10% a year, for
example). Each session the book's volatility is measured from the daily returns its current weights
would have had over the last 60 sessions, as known on each of those days. If that is above the target,
every name is multiplied by the target over the volatility, and the freed share goes to cash at the
bill yield. A book already under the target is left as it is, so the book never borrows. Example: a
book with 20% volatility and a 10% target holds half its weights and half cash. A name with no
return on some day of the window leaves the session out, with the reason. Scaling changes weights from
one session to the next, and that turnover pays the cost.
"""
next = "Look at how much of the time the book was scaled down, and compare it with the same book unscaled."
see_also = ["book_volatility", "cash_position", "outcome_portfolio_return"]

[[term]]
id = "book_volatility"
term = "Book volatility"
short = "How much a book's daily returns varied over the last 60 sessions, as a yearly figure."
body = """
It is the sample standard deviation of the book's daily returns, times the square root of 252. Each
daily return is the sum of every held name's weight times its return that day, taken from what was
stored on that day. Cash adds no variation. It is measured with today's weights on past returns, so it
describes the book as held now, not the book that was held back then. Example: daily moves of about
1.3% give about 20% a year. It looks backwards: a calm window does not warn of a sudden move.
"""
next = "Read it beside the volatility target to see how often the book was scaled down."
see_also = ["vol_target_sizing", "outcome_portfolio_return"]
