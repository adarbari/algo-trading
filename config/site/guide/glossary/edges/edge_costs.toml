# L3 site setting: the Guide glossary, edges: cost sensitivity and capacity (ADR 0051, ADR 0064 decision 5, docs/ui/guide.md section 3, "Glossary"). One [[term]]
# each: id, term, short (one sentence), body, see_also. Typed by
# src/algotrade/config/site/guide/glossary.py; fitness tests: tests/unit/config/site/guide/test_glossary.py.

[[term]]
id = "cost_sensitivity"
term = "Cost sensitivity"
short = "How the win rate, lift and mean return change as each round trip costs more: the same trades at 0, 15, 30 and 50 bp."
body = """
An edge's figures are net of one round-trip cost, the one its document assumes. Cost sensitivity
re-reads the same trades at other costs. The picks are the same and the base rate keeps the same
cost, so the lines show how fast the edge is eaten, not a different trade. The mean return falls by
the cost; the win rate falls as small winners drop below it. Costs are in basis points (hundredths
of a percent) per round trip. Example: a mean excess return of 1.25% before costs is 125 bp. At 50
bp it keeps 0.75%. At 125 bp it has none. The decile spread does not move with cost, because both
tenths pay it. Small samples are noise: below about 40 trades, read the lines as a direction.
Real costs rise with size and fall with liquidity, and the cost a trader pays can differ from every
level shown. Don't pick the cost that makes the result look best; check capacity too.
"""
see_also = ["break_even_cost", "capacity", "cost_state", "win_rate", "base_rate", "lift", "top_vs_bottom_decile", "trades"]

[[term]]
id = "break_even_cost"
term = "Break-even cost"
short = "The round-trip cost, in basis points, at which the picks' mean excess return reaches zero: how much cost the edge can pay."
body = """
It is the mean excess return before any cost, in basis points. Cost is subtracted from every pick
in the same way, so the figure is exact at any cost level. Read it against what you expect to pay.
Example: a break-even of 125 bp says the edge stays positive up to 125 bp per round trip. At
30 bp it keeps 95 bp. A break-even below your own cost means the mean return is negative after
cost, even when the win rate looks good. It is a mean over every trade in the period, so a few
large winners can lift it; the median trade can still lose. Take the in-sample and out-of-sample
figures side by side: if the out-of-sample one is much lower, the edge was thinner than it looked.
"""
see_also = ["cost_sensitivity", "capacity", "win_rate", "in_sample", "out_of_sample", "trades"]

[[term]]
id = "capacity"
term = "Capacity"
short = "How much money the picks can take: their typical 20-day dollar volume and how many trade below the site's low-liquidity floor."
body = """
A pick that trades little cannot take much money before it moves the price. Capacity shows the
median 20-day average dollar volume of the counted picks, read on the decision session. It also
shows how many fall below the floor the site sets (5 million dollars by default). Picks with no
stored volume are counted apart, never as zero. The page also sizes a position against that median. The size is set in the site settings (100,000
dollars by default), and it reads like "a 100,000 dollar position is 1.25% of the median pick's
volume". The floor row appears only when the site floor is above the floor the edge's own universe
already requires. A universe that needs 50 million of volume can never breach a 5 million floor,
so that row would say nothing. Example: a median of 8 million means a
position of 80,000 dollars is 1% of the median pick's daily volume.
A position above a few percent of daily volume usually costs more than the cost grid assumes. The
figure is for the picks of the period, not a promise about the next ones. Don't scale a position
from the median alone: the smallest picks set the limit.
"""
see_also = ["cost_sensitivity", "break_even_cost", "cost_state", "trades"]

[[term]]
id = "cost_state"
term = "Cost and capacity state"
short = "Why a cost or capacity figure is missing: not stored, not a cost outcome or hidden; a measured one has its value."
body = """
Measured: the figure is stored and shown. Not stored: the run behind the page is older than the
figure, or no pick had a stored volume. It also reads not stored when the period does not exist,
as an edge with no frozen period has no out-of-sample. The figure is blank, never zero. Not a cost outcome: the edge's outcome
is not a return, for example a hit on an option's strike. A round-trip cost does not apply, so no
cost line is drawn. Hidden: the out-of-sample result of a copy is withheld until you show it, and
the whole-history figures hold it too. Only the in-sample period is shown. A blank is not a poor
result.
"""
next = "Re-run the backtest to fill a not stored figure; show the out-of-sample result to fill a hidden one."
see_also = ["cost_sensitivity", "capacity", "out_of_sample", "in_sample", "not_a_return"]
