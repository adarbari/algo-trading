# L3 site setting: the Guide glossary, reading a screen's result (ADR 0051, docs/ui/guide.md section 3, "Glossary"). One [[term]]
# each: id, term, short (one sentence), body, see_also. Typed by
# src/algotrade/config/site/guide/glossary.py; fitness tests: tests/unit/config/site/guide/test_glossary.py.

# ------------------------------------------------------------------------ reading a screen's result

[[term]]
id = "near_miss"
term = "Near miss"
short = "A value that missed a soft or score criterion's threshold by no more than its tolerance."
body = """
A near miss costs points by how close it came: 10 times the distance divided by the
tolerance, so 0 to 10. On a soft criterion it also sets the row's decision through on_miss; on
a score criterion it only lowers the score. Every run and preview lists its narrow misses: the rows that missed only within tolerance. Each shows the criterion, the value, the threshold and the distance. This is where a threshold set a little too tight shows up.
"""
see_also = ["tolerance", "on_miss", "watch", "score"]

[[term]]
id = "gating_criterion"
term = "Gating criterion"
short = "A hard or soft criterion: one that can remove a row (a score criterion never does)."
body = """
The Builder's funnel shows the gating criteria in order. It starts with the universe at the top. For each criterion it shows how many rows enter, pass, miss narrowly, fail and have no value, and how many are left for the next. A row with no value for a soft criterion stays in; for a hard one it is
removed.
"""
see_also = ["hard", "soft", "mode", "selection"]

[[term]]
id = "qualified"
term = "QUALIFIED"
short = "The decision of a row that met every hard and soft criterion."
body = """
A QUALIFIED row passed every gating criterion. Its score can still be below 100: score
criteria it missed, or a soft criterion with no value (listed among its reasons), cost
points.
"""
see_also = ["score", "watch", "reject", "gating_criterion"]

[[term]]
id = "watch"
term = "WATCH"
short = "The default decision of a near miss: close enough to keep an eye on, not a pass."
body = """
A row is WATCH when it passed every hard criterion and nearly missed at least one soft criterion whose on_miss is WATCH. No near miss gave it anything more severe. It is a name
that may qualify on a later day if the value moves a little.
"""
see_also = ["near_miss", "on_miss", "qualified"]

[[term]]
id = "liquidity_risk"
term = "LIQUIDITY_RISK"
short = "A near miss on a criterion about how much a name trades, so it may be harder to buy and sell than the screen wants."
body = """
A screen gives LIQUIDITY_RISK when a soft criterion with on_miss = LIQUIDITY_RISK nearly
misses. Every site preset uses it on the average daily dollar volume
(rollup.price_stats@v2.adv_usd_20d); one also uses it on option volume. It is more severe than
WATCH and less than EVENT_RISK: the setup is there, but check the spread and the size you can
trade.
"""
see_also = ["on_miss", "near_miss", "event_risk", "watch"]

[[term]]
id = "event_risk"
term = "EVENT_RISK"
short = "The most severe near-miss decision, meant for a criterion that keeps names away from an event such as earnings."
body = """
A screen gives EVENT_RISK when a soft criterion with on_miss = EVENT_RISK nearly misses, for
example one asking for no earnings report within the next few days. It outranks LIQUIDITY_RISK
and WATCH when a row has several near misses. No site preset uses it today; your own screens
can.
"""
see_also = ["on_miss", "near_miss", "liquidity_risk", "watch"]

[[term]]
id = "reject"
term = "REJECT"
short = "The decision of a row that failed a hard criterion, had no value for one, or missed a soft one by more than its tolerance."
body = """
Rejected rows are still scored and kept with the run, so the funnel and the narrow misses can
show why a name did not make it. Many hard misses tie at a score of 0.
"""
see_also = ["hard", "soft", "score"]

[[term]]
id = "paused"
term = "PAUSED"
short = "A pick the regime gate held back: it met the screen, but the market's regime is one the screen pauses in."
body = """
With the regime gate on, the [regime] settings (the site's defaults or your own config) list the regimes each screen pauses in. On a session in one of them, its QUALIFIED and WATCH rows become PAUSED. The rule that paused them is the first reason. The VRP scanner, which sells option volatility, pauses in Storm and Severe storm. The
gate fails closed: when the regime is UNKNOWN for the session, every QUALIFIED and WATCH row
of a gated screen is paused. A paused pick stays visible with its reason (Ideas, Paused by regime), never silently
dropped. The gate is off unless the site or your settings turn it on.
"""
see_also = ["regime", "qualified", "watch", "unknown"]

[[term]]
id = "regime"
term = "Regime"
short = "The market's weather for the session: Clear, Clouds building, Storm or Severe storm."
body = """
The regime comes from two scores from 0 to 100. Macro risk measures the warning signs in the economy (the financial conditions index is one, though it moves fast). Market stress measures the fast signs in prices. Clear (CALM) is neither high, Clouds
building (CAUTION) macro risk only, Storm (STRESS) market stress only, Severe storm (CRISIS)
both. It is UNKNOWN when either score cannot be computed, never Clear for lack of data. On an
edge's Where it worked that regime reads Unclassified, and only when a trade fell on such a
session. To
avoid flickering, the label is the most severe one of the last five sessions, so a regime is
left only after five sessions below it. It can size new positions and drive the regime gate,
both off unless turned on.
"""
next = "Read the label as the session's backdrop, and open the regime indicators in the Guide to see which signs drove it."
see_also = ["paused", "unknown", "edge_where_worked"]

[[term]]
id = "score"
term = "Score"
short = "A row's number from 0 to 100 for sorting: 100 when every threshold is met, less a penalty for each miss."
body = """
A near miss costs 0 to 10 points by how close it came. A score criterion missed beyond its tolerance costs 10, and so does a soft or score criterion with no value. A hard miss, or a soft miss beyond tolerance, costs 100. The score stops at 0. It is for ordering the list, not a probability. Rows sort
by score, then by the screen's tie-break field, then by instrument.
"""
see_also = ["near_miss", "score_mode", "qualified"]

# ------------------------------------------------------------------------ the Ideas list (owner decision 2026-10-22)

[[term]]
id = "ideas_ranking"
term = "How Ideas are ranked"
short = "A ticker's score is its best pick's weight divided by its position in a screener's list; your own screeners weigh 3, site ones 1."
body = """
Only the first picks of each screener count: the first 5 of a site screener and the first 20 of one of yours. A pick at position 3 of your screener scores 3 divided by 3, which is 1, the same as the first pick of a site screener. A ticker picked by several screeners keeps the score of its best pick, never the sum, so many site screeners cannot bury your own. Ties go to the ticker more screeners picked, then to the higher total, then to the symbol. The same data always gives the same list. The numbers are in the site's ranking settings. A screener with no run for the session adds nothing and is listed as not run, and a withheld screener adds nothing either. An idea is shown from its best pick alone: the decision, reasons and display values are that screener's, never mixed from several. Don't read the score as a probability: it only orders the list.
"""
see_also = ["picked_by", "withheld_screener", "paused", "not_run"]

[[term]]
id = "picked_by"
term = "Picked by"
short = "The screeners that picked an idea, each with its position in its list; the first is the pick the idea is shown from."
body = """
Each entry shows the screener's name and the place the ticker holds in that screener's list, such as 2 for the second pick. Positions count only the picks the ranking keeps, not every name the screener picked. Screeners often read the same fields, so several of them agreeing is less independent than it looks. The count of screeners breaks a tie between two ideas with the same score, but it never lifts an idea above one with a better pick. Open a screener's name to see its whole run.
"""
see_also = ["ideas_ranking", "score"]

[[term]]
id = "withheld_screener"
term = "Withheld screener"
short = "A screener whose order depends on data you have no licence for, so it adds no ideas to your list."
body = """
Some screeners rank names by values from a source under a personal data licence. Without that licence you can see which names the screener picked, but not their order, because its first picks would reveal the hidden values. So the ranking leaves the whole screener out of your ideas and lists it as withheld, with the number of names it picked. The ideas from your other screeners are unaffected. With the licence, the screener's picks join the list again.
"""
see_also = ["ideas_ranking", "picked_by"]

[[term]]
id = "idea_decision"
term = "Idea decision"
short = "The badge says how the best pick fared overall; the squares under it show each criterion it was judged on."
body = """
The decision comes from the criteria, never the other way round. A square is green for a pass, amber for a near miss, red for a miss and grey when no value was stored. A criterion that misses outright or has no value makes the row REJECT. A near miss gives WATCH, LIQUIDITY_RISK or EVENT_RISK by the criterion's on_miss setting, and a row with only passes is QUALIFIED. With the regime gate on, a regime the screener pauses in shows PAUSED. For example, four squares of green, amber, red and grey beside REJECT mean the red miss decided it. Don't read QUALIFIED as a forecast: it says the screen's thresholds were met, nothing about the next move. Hover a square for its criterion and outcome.
"""
next = "Open the pick's screener from Picked by to see each criterion's value and threshold."
see_also = ["qualified", "watch", "liquidity_risk", "event_risk", "reject", "paused", "near_miss", "on_miss"]

[[term]]
id = "idea_size"
term = "Idea size"
short = "The share of a normal position the market regime allows for a new idea: 100% in Clear down to 25% in Severe storm."
body = """
The multipliers are Clear (CALM) 100%, Clouds building (CAUTION) 75%, Storm (STRESS) 50% and Severe storm (CRISIS) 25%. It is 0% when the idea's screener pauses in the session's regime, and 0% when the regime is unknown, because sizing fails closed. For example, a pick on a Storm session shows 50%: half the size you would take on a Clear day. The column appears only when the run stamped a size, and the regime gate is off unless the site or your settings turn it on. Don't read it as a forecast or a recommendation: it only scales a new position.
"""
next = "Check the regime label in the Guide before sizing a trade."
see_also = ["regime", "paused", "idea_decision"]

[[term]]
id = "idea_price"
term = "Idea price"
short = "The stored close of the session and its move from the session before; end of day, not live."
body = """
The close is the last price of the session the page is showing, with the return from the previous close under it, such as 226.80 and +1.2%. It reads Unknown when no close is stored for that session, never an older day's price. Don't trade from it: the live quote on a ticker's own page is the one to check before an order.
"""
next = "Open the ticker to see its live quote and chart."
see_also = ["unknown", "idea_decision"]

[[term]]
id = "idea_watch_out"
term = "Idea watch out"
short = "What the screener flagged on the idea, with the reasons it came close to missing; empty does not mean safe."
body = """
The badges are the screener's own flags, LIQUIDITY_RISK when the decision is that, and earnings before the nearest expiry for an option idea. The muted lines under them are the near-miss reasons, such as a spread slightly too wide, with the full text on hover. They list criteria that missed or nearly missed, never why a pick passed. With nothing flagged the cell shows the next earnings date in muted text. An empty cell means nothing was flagged, not that the idea is safe. Check the event calendar and the spread before acting.
"""
next = "Open the pick's screener to see the criterion behind each reason."
see_also = ["liquidity_risk", "idea_decision", "near_miss"]
