# L3 site setting: the Guide glossary, reading a screen's result (ADR 0051, docs/ui/guide.md section 3, "Glossary"). One [[term]]
# each: id, term, short (one sentence), body, see_also. Typed by
# src/algotrade/config/site/guide/glossary.py; fitness tests: tests/unit/config/site/guide/test_glossary.py.

# ------------------------------------------------------------------------ reading a screen's result

[[term]]
id = "near_miss"
term = "Near miss"
short = "A value that missed a soft or score criterion's threshold by no more than its tolerance."
body = """
A near miss costs points by how close it came: 10 times the distance divided by the
tolerance, so 0 to 10. On a soft criterion it also sets the row's decision through on_miss; on
a score criterion it only lowers the score. Every run and preview lists its narrow misses: the rows that missed only within tolerance. Each shows the criterion, the value, the threshold and the distance. This is where a threshold set a little too tight shows up.
"""
see_also = ["tolerance", "on_miss", "watch", "score"]

[[term]]
id = "gating_criterion"
term = "Gating criterion"
short = "A hard or soft criterion: one that can remove a row (a score criterion never does)."
body = """
The Builder's funnel shows the gating criteria in order. It starts with the universe at the top. For each criterion it shows how many rows enter, pass, miss narrowly, fail and have no value, and how many are left for the next. A row with no value for a soft criterion stays in; for a hard one it is
removed.
"""
see_also = ["hard", "soft", "mode", "selection"]

[[term]]
id = "qualified"
term = "QUALIFIED"
short = "The decision of a row that met every hard and soft criterion."
body = """
A QUALIFIED row passed every gating criterion. Its score can still be below 100: score
criteria it missed, or a soft criterion with no value (listed among its reasons), cost
points.
"""
see_also = ["score", "watch", "reject", "gating_criterion"]

[[term]]
id = "watch"
term = "WATCH"
short = "The default decision of a near miss: close enough to keep an eye on, not a pass."
body = """
A row is WATCH when it passed every hard criterion and nearly missed at least one soft criterion whose on_miss is WATCH. No near miss gave it anything more severe. It is a name
that may qualify on a later day if the value moves a little.
"""
see_also = ["near_miss", "on_miss", "qualified"]

[[term]]
id = "liquidity_risk"
term = "LIQUIDITY_RISK"
short = "A near miss on a criterion about how much a name trades, so it may be harder to buy and sell than the screen wants."
body = """
A screen gives LIQUIDITY_RISK when a soft criterion with on_miss = LIQUIDITY_RISK nearly
misses. Every site preset uses it on the average daily dollar volume
(rollup.price_stats@v2.adv_usd_20d); one also uses it on option volume. It is more severe than
WATCH and less than EVENT_RISK: the setup is there, but check the spread and the size you can
trade.
"""
see_also = ["on_miss", "near_miss", "event_risk", "watch"]

[[term]]
id = "event_risk"
term = "EVENT_RISK"
short = "The most severe near-miss decision, meant for a criterion that keeps names away from an event such as earnings."
body = """
A screen gives EVENT_RISK when a soft criterion with on_miss = EVENT_RISK nearly misses, for
example one asking for no earnings report within the next few days. It outranks LIQUIDITY_RISK
and WATCH when a row has several near misses. No site preset uses it today; your own screens
can.
"""
see_also = ["on_miss", "near_miss", "liquidity_risk", "watch"]

[[term]]
id = "reject"
term = "REJECT"
short = "The decision of a row that failed a hard criterion, had no value for one, or missed a soft one by more than its tolerance."
body = """
Rejected rows are still scored and kept with the run, so the funnel and the narrow misses can
show why a name did not make it. Many hard misses tie at a score of 0.
"""
see_also = ["hard", "soft", "score"]

[[term]]
id = "paused"
term = "PAUSED"
short = "A pick the regime gate held back: it met the screen, but the market's regime is one the screen pauses in."
body = """
With the regime gate on, the [regime] settings (the site's defaults or your own config) list the regimes each screen pauses in. On a session in one of them, its QUALIFIED and WATCH rows become PAUSED. The rule that paused them is the first reason. The VRP scanner, which sells option volatility, pauses in Storm and Severe storm. The
gate fails closed: when the regime is UNKNOWN for the session, every QUALIFIED and WATCH row
of a gated screen is paused. A paused pick stays visible with its reason (Ideas, Paused by regime), never silently
dropped. The gate is off unless the site or your settings turn it on.
"""
see_also = ["regime", "qualified", "watch", "unknown"]

[[term]]
id = "regime"
term = "Regime"
short = "The market's weather for the session: Clear, Clouds building, Storm or Severe storm."
body = """
The regime comes from two scores from 0 to 100. Macro risk measures the warning signs in the economy (the financial conditions index is one, though it moves fast). Market stress measures the fast signs in prices. Clear (CALM) is neither high, Clouds
building (CAUTION) macro risk only, Storm (STRESS) market stress only, Severe storm (CRISIS)
both. It is UNKNOWN when either score cannot be computed, never Clear for lack of data. On an
edge's Where it worked that regime reads Unclassified, and only when a trade fell on such a
session. To
avoid flickering, the label is the most severe one of the last five sessions, so a regime is
left only after five sessions below it. It can size new positions and drive the regime gate,
both off unless turned on.
"""
next = "Read the label as the session's backdrop, and open the regime indicators in the Guide to see which signs drove it."
see_also = ["paused", "unknown", "edge_where_worked"]

[[term]]
id = "score"
term = "Score"
short = "A row's number from 0 to 100 for sorting: 100 when every threshold is met, less a penalty for each miss."
body = """
A near miss costs 0 to 10 points by how close it came. A score criterion missed beyond its tolerance costs 10, and so does a soft or score criterion with no value. A hard miss, or a soft miss beyond tolerance, costs 100. The score stops at 0. It is for ordering the list, not a probability. Rows sort
by score, then by the screen's tie-break field, then by instrument.
"""
see_also = ["near_miss", "score_mode", "qualified"]

# ------------------------------------------------------------------------ the Ideas list (owner decision 2026-10-22)

[[term]]
id = "ideas_ranking"
term = "How Ideas are ranked"
short = "A ticker's score is its best pick's weight divided by its position in a screener's list; your own screeners weigh 3, site ones 1."
body = """
Only the first picks of each screener count: the first 5 of a site screener and the first 20 of one of yours. A pick at position 3 of your screener scores 3 divided by 3, which is 1, the same as the first pick of a site screener. A ticker picked by several screeners keeps the score of its best pick, never the sum, so many site screeners cannot bury your own. Ties go to the ticker more screeners picked, then to the higher total, then to the symbol. The same data always gives the same list. The numbers are in the site's ranking settings. A screener with no run for the session adds nothing and is listed as not run, and a withheld screener adds nothing either. An idea is shown from its best pick alone: the decision, reasons and display values are that screener's, never mixed from several. Don't read the score as a probability: it only orders the list.
"""
see_also = ["picked_by", "withheld_screener", "paused", "not_run"]

[[term]]
id = "picked_by"
term = "Picked by"
short = "The screeners that picked an idea, each with its position in its list; the first is the pick the idea is shown from."
body = """
Each entry shows the screener's name and the place the ticker holds in that screener's list, such as 2 for the second pick. Positions count only the picks the ranking keeps, not every name the screener picked. Screeners often read the same fields, so several of them agreeing is less independent than it looks. The count of screeners breaks a tie between two ideas with the same score, but it never lifts an idea above one with a better pick. Open a screener's name to see its whole run.
"""
see_also = ["ideas_ranking", "score"]

[[term]]
id = "withheld_screener"
term = "Withheld screener"
short = "A screener whose order depends on data you have no licence for, so it adds no ideas to your list."
body = """
Some screeners rank names by values from a source under a personal data licence. Without that licence you can see which names the screener picked, but not their order, because its first picks would reveal the hidden values. So the ranking leaves the whole screener out of your ideas and lists it as withheld, with the number of names it picked. The ideas from your other screeners are unaffected. With the licence, the screener's picks join the list again.
"""
see_also = ["ideas_ranking", "picked_by"]

[[term]]
id = "idea_decision"
term = "Idea decision"
short = "The badge says how the best pick fared overall; the squares under it show each criterion it was judged on."
body = """
The decision comes from the criteria, never the other way round. A square is green for a pass, amber for a near miss, red for a miss and grey when no value was stored. A criterion that misses outright or has no value makes the row REJECT. A near miss gives WATCH, LIQUIDITY_RISK or EVENT_RISK by the criterion's on_miss setting, and a row with only passes is QUALIFIED. With the regime gate on, a regime the screener pauses in shows PAUSED. For example, four squares of green, amber, red and grey beside REJECT mean the red miss decided it. Don't read QUALIFIED as a forecast: it says the screen's thresholds were met, nothing about the next move. Hover a square for its criterion and outcome.
"""
next = "Open the pick's screener from Picked by to see each criterion's value and threshold."
see_also = ["qualified", "watch", "liquidity_risk", "event_risk", "reject", "paused", "near_miss", "on_miss"]

[[term]]
id = "idea_size"
term = "Idea size"
short = "The share of a normal position the market regime allows for a new idea: 100% in Clear down to 25% in Severe storm."
body = """
The multipliers are Clear (CALM) 100%, Clouds building (CAUTION) 75%, Storm (STRESS) 50% and Severe storm (CRISIS) 25%. It is 0% when the idea's screener pauses in the session's regime, and 0% when the regime is unknown, because sizing fails closed. For example, a pick on a Storm session shows 50%: half the size you would take on a Clear day. The column appears only when the run stamped a size, and the regime gate is off unless the site or your settings turn it on. Don't read it as a forecast or a recommendation: it only scales a new position.
"""
next = "Check the regime label in the Guide before sizing a trade."
see_also = ["regime", "paused", "idea_decision"]

[[term]]
id = "idea_price"
term = "Idea price"
short = "The stored close of the session and its move from the session before; end of day, not live."
body = """
The close is the last price of the session the page is showing, with the return from the previous close under it, such as 226.80 and +1.2%. It reads Unknown when no close is stored for that session, never an older day's price. Don't trade from it: the live quote on a ticker's own page is the one to check before an order.
"""
next = "Open the ticker to see its live quote and chart."
see_also = ["unknown", "idea_decision"]

[[term]]
id = "idea_watch_out"
term = "Idea watch out"
short = "What the screener flagged on the idea, with the reasons it came close to missing; empty does not mean safe."
body = """
The badges are the screener's own flags, LIQUIDITY_RISK when the decision is that, and earnings before the nearest expiry for an option idea. The muted lines under them are the near-miss reasons, such as a spread slightly too wide, with the full text on hover. They list criteria that missed or nearly missed, never why a pick passed. With nothing flagged the cell shows the next earnings date in muted text. An empty cell means nothing was flagged, not that the idea is safe. Check the event calendar and the spread before acting.
"""
next = "Open the pick's screener to see the criterion behind each reason."
see_also = ["liquidity_risk", "idea_decision", "near_miss"]

[[term]]
id = "screener_picks"
term = "Picks today"
short = "How many names the screener picked in the latest session, with how many joined and left since the run before."
body = """
The number counts the names the screener kept after its criteria and its ranking. The green +N is the names that are new since the previous run, the red −N the names that dropped out. A muted line says how many were paused because the market regime stopped the screener that session. For example, 12 with +3 −2 means three new names, two gone and ten kept. Not run means no run is stored for the session, and it opens the screener too. Don't read a long list as a better screener: a loose screen picks many names, and the track record says whether the picks did well.
"""
next = "Click the pick count to open the screener and see each pick and the criterion behind its decision."
see_also = ["paused", "idea_decision", "screener_track_record"]

[[term]]
id = "screener_decisions"
term = "Screener decisions"
short = "The bar splits the screener's picks by decision, such as QUALIFIED, WATCH or REJECT; the line under it counts each."
body = """
Each pick carries one decision, worked out from its criteria. The bar's segments are in proportion to the counts, which the muted line spells out, such as 8 qualified · 3 watch · 1 reject. A screener whose bar is mostly QUALIFIED had most names meet every threshold; a long WATCH segment means many names only came close. Don't read QUALIFIED as a forecast: it says the thresholds were met, nothing about the next move.
"""
next = "Open the screener's row to see its criteria and which one decides most picks."
see_also = ["qualified", "watch", "reject", "idea_decision"]

[[term]]
id = "screener_column"
term = "Screener and what it finds"
short = "The screener's name, the one line saying what it finds, whether it is a site preset or yours, and the session of its latest run."
body = """
Under the name, one line says what the screener finds. A preset's line is written by the site; for your own screeners you write it when you save, up to 140 characters. A screener of yours without one shows Add a description. A Preset is a screener the site ships; Mine is one you built. Draft means you have not finalized it, so it has not run. Does not resolve means its config no longer loads. The muted line is the session of the latest run, not the day it started. No run today means the screener has no run for the session the page shows, so its picks are not the latest. Paused means the market regime stopped it that session and it picked nothing on purpose. Built in code means the screener is written in code, not as criteria: you can view it, not edit or copy it.
"""
next = "Check the run date before you act on a screener's picks."
see_also = ["screener_picks", "paused", "not_run"]

[[term]]
id = "screener_actions"
term = "Screener actions"
short = "What you can do with a screener from the list: edit its criteria, duplicate it or delete it."
body = """
Click the pick count in the Picks today column to open the screener page with its picks and criteria. Every screener has that link: without a run today it reads Not run, and a screener built in code has it too. On one of yours, Edit criteria opens its criteria in the Builder and Delete removes it after asking. Duplicate makes a copy you can change. A site preset is never changed in place, so its only action is Duplicate to edit. A screener built in code has no actions, since its rules are not criteria. On a narrow screen the actions turn into icons with the same names.
"""
next = "Open the screener from its pick count to read it before you copy it."
see_also = ["screener_column", "screener_picks"]

[[term]]
id = "screener_track_record"
term = "Evidence and edges"
short = "The edges this screener implements, strongest first, and how that edge's picks did in the past."
body = """
A screener has evidence only when it implements an edge, and one screener can be part of several. The line leads with the headline edge. An evidenced edge beats a candidate, and a candidate beats the rest. Ties go to the edge with more trades, then to its id. Only an edge with a readable record can be the headline. Click the edge name to list every edge the screener is in. Each has its own record or its reason for having none. Under the name, a record shows the win rate against the base rate and the lift in points. It also shows the trades behind it, the holding period and the date the test was frozen. The test is the out-of-sample period whose date was fixed before it was read, never an exploratory run. For example, 62% against 55% on 40 trades means the picks beat the field by 7 points. The hold is 20 sessions and the test was frozen on 1 May. Most screeners show no record yet, and that is normal. Either the edge has no frozen run, or fewer than 20 independent trades have passed since the freeze, and the line says which. It does not mean the screener is bad. Not part of an edge means no edge uses it. Don't read a record as profit: it counts outcomes, not amounts.
"""
next = "Click the edge name, then Open edge to see the curve, the sample size and the verdict."
see_also = ["win_rate", "base_rate", "lift", "trades", "out_of_sample", "record_how_to_read"]

[[term]]
id = "record_how_to_read"
term = "How to read a record"
short = "Read the win rate beside its base rate, the trades behind it and the date the test was frozen; never the win rate alone."
body = """
Start with the base rate: a win rate means something only beside it, and the lift is their gap in points. Then look at the trades: a lift on a few dozen trades is noise, and a record with fewer than 20 trades since the freeze is not shown at all. Then the freeze date: figures after it were never used to tune the edge, which is why they can be trusted more than the older history. Last, the status of the edge: evidenced passed its out-of-sample test, a candidate has not yet. Two edges on one screener are two separate records, not an average.
"""
next = "Open the edge to see how its record built up over time."
see_also = ["win_rate", "base_rate", "lift", "trades", "screener_track_record"]

[[term]]
id = "screener_history"
term = "30d picks"
short = "A small line of how many names the screener picked on each of the last sessions."
body = """
The line rises when the screener picked more names that session and falls when it picked fewer. It has no scale: read its shape, not its height. Gaps are sessions with no stored run. A flat line means a steady list. A spike means more names met the thresholds that day. A drop to zero may mean the screener was paused. Don't read a spike as a stronger signal.
"""
next = "Open the screener to compare today's picks with its earlier runs."
see_also = ["screener_picks", "paused"]

[[term]]
id = "screener_last_run"
term = "Screener last run"
short = "The session of the screener's latest run, or why there is none: No run today or Paused."
body = """
The date is the trading session the run read, not the day it was started. No run today means the screener has no run for the session the page shows, so its picks are not the latest. Paused means the market regime stopped the screener for that session and it picked nothing on purpose. A dash means the screener has no rules, or it is a draft that was never run.
"""
next = "Check the date before you act on a screener's picks."
see_also = ["paused", "not_run", "screener_picks"]

[[term]]
id = "screener_edge_line"
term = "Screener edge line"
short = "The edge this screener implements and how that edge's picks did in the past: its status, win rate against the base rate, trades and hold."
body = """
An edge is a stated reason a pattern should keep paying, tested out of sample. This screener is one way to pick names for it. The line shows the strongest edge that lists the screener, ranked by status and then by trades. A +N chip means more edges list it, and Evidence opens the record of each. The figures are the frozen-period record: the test whose start date was fixed before it was read, shown as the first session it covers. For example, 62% against a 55% base rate on 40 trades with a 20-session hold means the picks beat the field by 7 points. Not part of an edge means no test covers this screener, and No record yet means the test has not run. Neither says the screener is bad. Don't read the record as a forecast for today's picks: it counts past outcomes, not amounts.
"""
next = "Open Evidence to compare the record of each edge, then the edge page for its curve and verdict."
see_also = ["screener_track_record", "win_rate", "base_rate", "lift", "trades"]

[[term]]
id = "why_it_matched"
term = "Why it matched"
short = "The rules this pick passed, each with the value it was judged on, in the field's own unit."
body = """
Each item is a rule of the screener the pick met, followed by its value in that run. For example, revisions +6.2% · 7 analysts · above 50d means three rules passed with those readings. A rule the pick missed or nearly met is not listed here: the Why column and the pick's detail show it. A pick that failed a rule can still list the rules it passed, so a long list is not a qualified pick. The value is the one the run stored, so it can differ from today's value in Explore.
"""
next = "Open the pick to see every rule with its threshold and outcome."
see_also = ["counts_toward", "near_miss", "idea_decision"]

[[term]]
id = "counts_toward"
term = "Counts toward"
short = "Which edges took this pick at the session, from their own stored picks, and the reason when one did not."
body = """
Each night, every edge that lists the screener stores the names it took, by its own rules. Those are the screener's qualified names inside the edge's own universe, best first, up to its cut. This column reads that store for the session you are viewing. A pick the edge took counts, with its place in the edge's list. A pick the regime gate held back, or one that is not in the edge's list (outside its universe, or past its cut), is not counted. Counting a pick says what the edge would take, not what it has earned: the outcome is not known until the holding period ends. When the edge decides only on some sessions, or its picks were not stored, the column says so instead of guessing. A single pick is not a forecast; the edge's record is a statement about many picks.
"""
next = "Open the screener's edge line to see each edge's record, then Evidence for the figures."
see_also = ["screener_edge_line", "edge_pick_counts", "edge_pick_paused", "edge_pick_not_counted", "edge_pick_not_a_decision_day", "edge_pick_unjudged", "edge_pick_not_stored"]

[[term]]
id = "edge_pick_counts"
term = "Counts"
short = "The edge took this pick at the session, so it goes into the edge's record."
body = """
The edge's own list for the session, made by its rules, contains this name. Its place is its position in that list, best first. It is scored against the edge's outcome when its holding period ends. For example, place 3 of the top 5 counts. The place can differ from the screener's rank: the edge leaves out names outside its universe, so every later name moves up. Counting is not a signal to buy: the record is judged over many picks.
"""
next = "Open the edge to see how its counted picks did."
see_also = ["counts_toward", "edge_pick_not_counted"]

[[term]]
id = "edge_pick_paused"
term = "Held back by the regime gate"
short = "The market regime stopped this pick for the session, so the edge does not count it."
body = """
The screener's regime gate pauses picks when the market state is one the screener should sit out. A paused pick keeps its rank and its reason, but it is not an idea for the session and no edge counts it. For example, a pick that passed every rule is still held back in a stress regime. A pause is not a rule failure.
"""
next = "Open the pick's detail to read the rule that paused it."
see_also = ["paused", "counts_toward"]

[[term]]
id = "edge_pick_not_counted"
term = "Edge did not take it"
short = "The edge decided at this session and did not take this pick."
body = """
The edge's own list for the session does not contain this name. Common reasons: the name did not qualify, or it is outside the edge's universe, such as an ETF for an edge on common stocks. It may also rank past the edge's cut among the names the edge can take. The edge's record says nothing about it.
"""
next = "Open the edge to see its universe and its cut."
see_also = ["counts_toward", "edge_pick_counts", "qualified"]

[[term]]
id = "edge_pick_not_a_decision_day"
term = "Not a decision day"
short = "The edge's schedule does not decide at this session, so it took no picks."
body = """
Some edges decide only on certain sessions, such as the last session of a month, or around an event. On any other session the edge takes nothing, whatever the screener picked. For example, a month-end edge counts nothing on a mid-month session. Not a decision day is not a verdict on the pick.
"""
next = "Open the edge to read its schedule."
see_also = ["counts_toward", "edge_pick_unjudged"]

[[term]]
id = "edge_pick_withheld"
term = "Not judged"
short = "The pick's rank is withheld from you, so it cannot be placed in the edge's list."
body = """
A run recorded under a data licence you do not hold shows names and decisions but not the score or rank behind them. The edge's list is built from that rank, so the server does not say whether the pick counts. This is a limit of your access, not a verdict on the pick.
"""
next = "Ask an admin whether the data licence can be added to your account."
see_also = ["counts_toward"]

[[term]]
id = "edge_pick_unjudged"
term = "Not judged: other side"
short = "The edge shorts, or holds a book, so the screener's picks are not its picks."
body = """
An edge that shorts names, or holds a long-short or portfolio book, ranks names by its own score and liquidity rules, not by the screener's qualified list. The page does not say which of the screener's picks it takes. Not judged is not a verdict on the pick.
"""
next = "Open the edge to read how it picks."
see_also = ["counts_toward", "edge_pick_withheld"]

[[term]]
id = "edge_pick_not_stored"
term = "Picks not stored"
short = "The edge's picks for this session are not stored, so the page cannot say whether it took this one."
body = """
Each night the edge's picks are stored for the session. This one has none. The nightly step may not have run for the session yet, the edge may have been added after it, or the data it needed may have been missing. An edge of your own is never stored. The page never shows an older session's picks in its place. Picks not stored is not a verdict on the pick.
"""
next = "Check the session date, then look again after the next nightly run."
see_also = ["counts_toward"]

[[term]]
id = "cohort_percentile"
term = "Cohort percentile"
short = "Where a value ranks among the stocks it is compared with: 0 the lowest, 1 the highest."
body = """
A cohort percentile ranks one value against the same value of the other stocks in a group. The group is all the stocks of the universe, the stocks of the name's sector, or those of its industry.

The rank is the average position among the stocks that have a value. It is scaled so the lowest is 0 and the highest is 1, and stocks with equal values share their position. 0.9 means the name is above nine tenths of its group, whatever the size of the numbers behind it.

A percentile is null for an ETF, fund or trust, because only stocks count as the group. It is also null for a name with no sector or industry at that level, and for a group too small to rank (a site setting for each level). A sector or industry percentile says how the name stands against its peers. That can differ a lot from its rank against the whole universe.
"""
see_also = ["near_miss"]
