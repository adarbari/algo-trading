# L3 site setting: the Guide glossary, the shared filter bar (ADR 0051, ADR 0082, docs/ui/guide.md section 3, "Glossary"). One [[term]]
# each: id, term, short (one sentence), body, see_also. Typed by
# src/algotrade/config/site/guide/glossary.py; fitness tests: tests/unit/config/site/guide/test_glossary.py.
# The filters of a surface point here through `guide = "term:filter_<id>"` in config/site/filters/.

[[term]]
id = "filter_decision"
term = "Decision filter"
short = "Keeps the ideas whose best pick has the decisions you tick."
body = """
Each idea comes from its best pick, and that pick has a decision: Qualified, Watch, and the rest. Tick one or more and the list keeps the ideas with one of them. The number beside each decision counts the ideas that have it among the ideas that pass your other filters.
"""
next = "Start with Qualified to see the names that met every rule; add Watch to include the ones that missed one."
see_also = ["selection", "watch", "unknown"]

[[term]]
id = "filter_screener"
term = "Screener filter"
short = "Keeps the ideas that a screener you tick picked."
body = """
Several screeners can pick the same idea. Tick a screener and the list keeps every idea it picked, whether or not it was the best pick. The number beside a screener counts the ideas it picked among those that pass your other filters.
"""
next = "Use it to see one screener's picks next to the others."
see_also = ["screener", "picked_by", "filter_agreeing"]

[[term]]
id = "filter_agreeing"
term = "Agreeing screeners filter"
short = "Keeps the ideas that at least, or at most, a number of screeners picked."
body = """
The number is how many screeners in the Ideas pool, site presets and yours, count the idea among their first picks in this session. Two or more means independent rules arrived at the same name, which is a stronger reason to look than one pick. The bars show how many ideas sit at each count among those that pass your other filters.
"""
next = "Set the minimum to 2 to see only the names more than one screener agrees on."
see_also = ["filter_screener", "picked_by", "filter_range"]

[[term]]
id = "filter_days_picked"
term = "Days on the list filter"
short = "Keeps the rows by how many runs in a row the screener has picked them, up to 20."
body = """
The count starts at 1 for a row the screener picks now. It grows by one for each earlier run of the same screener, going back one after another, that also picked it. It stops at the first run that did not, and at 20, so a row that has stayed for 20 runs or more counts as 20. A row the screener did not pick is 0. The count is unknown when it reaches a run you cannot see, or a session where the screener did not run, before it could end. An unknown row does not pass this filter.
"""
next = "Set the minimum to 5 to see the names that have stayed on the list for a week."
see_also = ["filter_change", "filter_unknown_rows"]

[[term]]
id = "filter_option_tier"
term = "Option liquidity class filter"
short = "Keeps the rows whose options trade well enough for a short put or call."
body = """
The class is the worse of the short put's and the short call's tier. A is the easiest to trade and C the hardest that still passes; D means no usable options, including a name the options data did not list. A row with no class for the session, because the options data was not pulled or failed, never passes this filter and is counted as unknown.
"""
next = "Tick A and B for options you can open and close without giving up much to the spread."
see_also = ["filter_spread", "filter_unknown_rows"]

[[term]]
id = "filter_spread"
term = "Option spread filter"
short = "Keeps the rows whose option quote is within a range of bid-ask spread."
body = """
The spread is the gap between the ask and the bid at the short put's strike, as a share of the middle price. 5% means the gap is one twentieth of the price. A wide spread costs you that gap each time you trade. It is the stored quote of the session, not a live one, so judge a trade on a live quote. A row with no put quote that day is unknown. It never passes.
"""
next = "Set the maximum to 10% to leave out options that are expensive to trade."
see_also = ["filter_option_tier", "filter_range", "filter_unknown_rows"]

[[term]]
id = "filter_dollar_volume"
term = "Dollar volume filter"
short = "Keeps the rows whose shares traded within a range of dollars on the session."
body = """
Dollar volume is the closing price times the shares traded that day: how much money changed hands. It says how much you can trade in the shares, whatever the price. It is one day's figure, so a quiet day understates a normally busy name.
"""
next = "Set a minimum to leave out thinly traded names."
see_also = ["filter_range", "liquidity_risk"]

[[term]]
id = "filter_earnings"
term = "Earnings window filter"
short = "Keeps the rows that report earnings within a number of trading sessions."
body = """
The number counts exchange sessions after the session you are reading, so 0 is a report today and 5 is a report within the next five sessions. It uses the report dates known by that session. A row with no known report date ahead is unknown and never passes, even when you only set an upper limit.
"""
next = "Use it to avoid, or to look for, names with a report coming."
see_also = ["filter_window", "filter_unknown_rows", "event_risk"]

[[term]]
id = "filter_ex_dividend"
term = "Ex-dividend window filter"
short = "Keeps the rows whose next ex-dividend date is within a number of calendar days."
body = """
The number counts calendar days from the session you are reading to the next ex-dividend date known by then. A date is known only once the dividend is declared. A row with none is unknown, which is not the same as paying no dividend, and it never passes this filter.
"""
next = "Use it to see which short calls risk early assignment around the date."
see_also = ["filter_window", "filter_unknown_rows"]

[[term]]
id = "filter_result_decision"
term = "Result decision filter"
short = "Keeps the rows of a screener's results that have the decisions you tick."
body = """
Every instrument the screener looked at gets a decision in its run: Qualified, Watch, Reject and the rest. Tick one or more and the table keeps the rows with one of them. The number beside each decision counts the rows that have it among those that pass your other filters. Skipped and Unknown rows are listed so you can see where the data was missing.
"""
next = "Tick Qualified and Watch to see the names that passed or narrowly missed."
see_also = ["qualified", "watch", "unknown", "filter_decision", "filter_unknown_rows"]

[[term]]
id = "filter_rank"
term = "Rank filter"
short = "Keeps the rows whose place in the screener's order lies between a minimum and a maximum."
body = """
Rank 1 is the screener's best row of the run. The rank is the one stored for the run, so it is the order you see when you sort the table by rank. A row with no rank, because the order follows data you may not see, never passes this filter.
"""
next = "Set the maximum to 25 to read only the screener's first 25."
see_also = ["filter_range", "score", "filter_unknown_rows"]

[[term]]
id = "filter_score"
term = "Score filter"
short = "Keeps the rows whose score, from 0 to 100, lies between a minimum and a maximum."
body = """
The score is the run's number for ordering rows: 100 when every threshold is met, less a penalty for each miss. A row with no score never passes. It is not a probability, so a score of 80 is not an 80% chance of anything.
"""
next = "Set the minimum to 80 to see the rows that came close to meeting every rule."
see_also = ["score", "filter_range", "filter_unknown_rows"]

[[term]]
id = "filter_change"
term = "Since the previous run filter"
short = "Keeps the rows new to the screener's picks, or dropped from them, since its previous run."
body = """
New means the screener picked the row in this run and did not in its previous run; dropped means it picked it before and no longer does. Both compare two runs of the same screener, not two days of the market. A screener with no earlier run has nothing new or dropped, and its rows are not compared. They do not pass this filter.
"""
next = "Tick New to see what the screener found since last time."
see_also = ["screener_last_run", "filter_unknown_rows"]

[[term]]
id = "filter_rank_moved_up"
term = "Places moved up filter"
short = "Keeps the rows that rose in the screener's order since its previous run, by at least a number of places."
body = """
Places moved up is the row's rank in the screener's previous run minus its rank in this one, so 5 means it rose five places. A row that fell has a negative number. It compares the screener's last two stored runs, not two days of the market. A row has no number in four cases. The screener has no earlier run, or the previous run did not rank it. You may not see a run's order, or the settings changed between the runs. Such a row never passes this filter.
"""
next = "Set the minimum to 5 to see the names climbing the order fastest."
see_also = ["filter_rank", "filter_change", "filter_range", "filter_unknown_rows"]

[[term]]
id = "filter_near_misses"
term = "Near misses filter"
short = "Keeps the rows that narrowly missed a number of the screener's gates."
body = """
A gate is a rule the row must pass. A near miss is a gate the row missed by only a little, close enough that the screener lists the row as Watch rather than Reject. The number counts them for the row. Zero means none, which is not the same as unknown: a run whose values you may not see has no count, and its rows never pass this filter.
"""
next = "Set the minimum to 1 to see the rows that are one small step from qualifying."
see_also = ["watch", "near_miss", "filter_gates_failing", "filter_range", "filter_unknown_rows"]

[[term]]
id = "filter_gates_failing"
term = "Gates not passed filter"
short = "Keeps the rows that missed a number of the screener's gates, narrowly or clearly."
body = """
A gate is a rule the row must pass. The number counts the gates the row missed, near misses included, so a row with 0 passed every gate it could be judged on. A gate with no data to judge is not counted here. A run whose values you may not see has no count, and its rows never pass this filter.
"""
next = "Set the maximum to 1 to see the rows that missed at most one gate."
see_also = ["filter_near_misses", "filter_range", "filter_unknown_rows"]

[[term]]
id = "filter_security_type"
term = "Security type filter"
short = "Keeps the instruments of the types you tick: common stock, ETF, closed-end fund and so on."
body = """
The type is the one the exchange listing and the reference data give the instrument. The options are the types stored for the day you are reading. The number beside each counts the instruments of that type among those that pass your other filters. An instrument whose type is not stored never passes.
"""
next = "Tick ETF to leave the stocks out of the table."
see_also = ["filter_sector", "filter_unknown_rows"]

[[term]]
id = "filter_sector"
term = "Sector filter"
short = "Keeps the instruments in the sectors you tick."
body = """
The sector is the company's classification from the reference data. Funds and many ETFs have none, so ticking a sector leaves them out. The number beside each counts the instruments in that sector among those that pass your other filters. In a table of trades it is the sector the name has in the session you are reading. It is not the sector on the day of the trade. A name that has since left the data has none, so ticking a sector leaves out the names delisted since.
"""
next = "Combine it with the market cap range to compare a sector's large names."
see_also = ["filter_security_type", "filter_unknown_rows"]

[[term]]
id = "filter_in_sp500"
term = "S&P 500 filter"
short = "Keeps the instruments that are, or are not, members of the S&P 500 on the day."
body = """
Membership is the stored flag of the day's reference data, so a name added to the index last week shows once the reference data holds it. Yes keeps members, No keeps the rest, Either applies nothing. An instrument with no stored flag passes neither yes nor no. Only the S&P 500 is stored. Other indexes would need their own data first.
"""
next = "Choose yes to start from the large, widely held names."
see_also = ["filter_toggle", "filter_unknown_rows"]

[[term]]
id = "filter_leveraged"
term = "Leveraged filter"
short = "Keeps the funds that are, or are not, leveraged: they move a multiple of an index each day."
body = """
A leveraged fund aims for a multiple, such as two or three times, of its index's move in one day, and an inverse one the opposite. Over longer holdings its result drifts from the multiple. The flag comes from the reference data and the fund's name and terms. Choose no to leave them out of a search for ordinary holdings.
"""
next = "Choose no to leave the leveraged funds out."
see_also = ["filter_toggle", "filter_security_type"]

[[term]]
id = "filter_market_cap"
term = "Market cap filter"
short = "Keeps the instruments whose market value, in dollars, lies between a minimum and a maximum."
body = """
Market cap is the shares outstanding times the closing price of the session, in dollars. 2,000,000,000 is two billion. Funds have no market cap. Neither has a company whose share count is missing or stale. Those rows are unknown and never pass, even when you only set an upper limit.
"""
next = "Set a minimum of 10,000,000,000 to see the large caps."
see_also = ["filter_range", "filter_price", "filter_unknown_rows"]

[[term]]
id = "filter_price"
term = "Price filter"
short = "Keeps the instruments whose closing price lies between a minimum and a maximum."
body = """
The price is the close of the session you are reading. It is not a live quote. A low price does not mean a cheap company: it only says how much one share costs. An instrument with no bar that day is unknown and never passes.
"""
next = "Set a minimum of 10 to leave out the lowest-priced shares."
see_also = ["filter_range", "filter_market_cap", "filter_unknown_rows"]

[[term]]
id = "filter_liquidity_class"
term = "Liquidity class filter"
short = "Keeps the instruments whose shares trade as high, medium or low volume."
body = """
High means every high threshold of the site's liquidity rule holds, medium every medium one, and low is the rest. It describes the shares, not their options. The class comes from the session's price and volume, so one quiet day can lower it. An instrument with no bar that day has no class and never passes.
"""
next = "Tick High to see the names you can trade without moving the price."
see_also = ["filter_option_tier", "filter_dollar_volume", "liquidity_risk"]

[[term]]
id = "filter_optionable"
term = "Listed options filter"
short = "Keeps the instruments that have listed options, or that have none."
body = """
Yes means an exchange lists options on the instrument. It does not say the options trade well: for that read the option liquidity class on Ideas. The flag comes from the reference data and changes when options are listed or delisted. An instrument with no stored flag passes neither yes nor no.
"""
next = "Choose yes before looking for an options trade."
see_also = ["filter_toggle", "filter_option_tier"]

[[term]]
id = "filter_owner"
term = "Owner filter"
short = "Keeps the screeners that are yours, or the site's presets."
body = """
Mine are the screeners you built or copied. Presets are the site's own, shared by everyone, and only the site changes them. Tick both to see the whole list.
"""
next = "Tick Mine to see the screeners you can edit."
see_also = ["preset", "screener"]

[[term]]
id = "filter_edges_implemented"
term = "Edges that list it filter"
short = "Keeps the screeners that at least, or at most, a number of edges list as an implementation."
body = """
An edge is a claim about the market, and its screeners are the rules that try to catch it. A screener that no edge lists has no frozen-period record behind it. Set the minimum to 1 to see the screeners an edge stands on. The bars show how many screeners sit at each count among those that pass your other filters.
"""
next = "Set the minimum to 1 to leave out screeners with no edge."
see_also = ["edge", "filter_range", "screener_track_record"]

[[term]]
id = "filter_picked"
term = "Candidates in the latest run filter"
short = "Keeps the screeners whose latest run for the session picked a number of names between a minimum and a maximum."
body = """
The count is the names the screener picked in its run for the session you are reading. Set the minimum to 1 to see only screeners that found something. A screener with no run for the session has no count: it is unknown and never passes, even with a minimum of 0.
"""
next = "Set the minimum to 1 to see what has candidates today."
see_also = ["screener_picks", "not_run", "filter_range", "filter_unknown_rows"]

[[term]]
id = "filter_run_status"
term = "Last run filter"
short = "Keeps the screeners whose latest run for the session ended in the states you tick."
body = """
Complete means the run had all the data it needed. Partial means it ran without some table, so its picks may be incomplete. Failed, queued, running and waiting say where a run stands. A screener with no run for the session has no state: it never passes this filter.
"""
next = "Tick Partial to find the screeners whose picks need a second look."
see_also = ["run", "not_run", "filter_unknown_rows"]

[[term]]
id = "filter_edge_verdict"
term = "Verdict filter"
short = "Keeps the edges whose verdict is one you tick."
body = """
The verdict is the server's one word for how the evidence stands: works, promising, not working, not enough data, waiting on data, or diagnostic only. It is judged on the out-of-sample result, so an edge the data cannot yet judge is not counted as failing. The number beside each counts the edges with it among those that pass your other filters.
"""
next = "Tick Works and Promising to see the edges worth reading first."
see_also = ["verdict", "verdict_works", "verdict_promising", "verdict_not_working", "verdict_not_enough_data", "verdict_waiting_on_data", "verdict_diagnostic_only"]

[[term]]
id = "filter_edge_status"
term = "Status filter"
short = "Keeps the edges at the stages of their life you tick, from researching to retired or rejected."
body = """
Status is the one stage an edge is in: researching, candidate, evidenced, live, retired, rejected or blocked. Rejected edges stay on the list with their reason, so a finding is not forgotten. Status says where the edge stands in your process. The verdict says what the numbers show.
"""
next = "Tick Rejected to read what failed and why."
see_also = ["edge_status", "verdict"]

[[term]]
id = "filter_edge_mine"
term = "Mine filter"
short = "Keeps the edges that are your own documents, or only the site's."
body = """
Yes keeps the edges you wrote or copied. No keeps the site's edges. Either applies nothing.
"""
see_also = ["edge_owner", "filter_toggle"]

[[term]]
id = "filter_edge_followed"
term = "Following filter"
short = "Keeps the edges you follow, or the ones you do not."
body = """
Following an edge puts it on your desk and starts its paper record. Yes keeps the edges you follow. No keeps the rest. Either applies nothing.
"""
next = "Choose yes to see only the edges you watch."
see_also = ["follow_edge", "filter_toggle", "paper_trading"]

[[term]]
id = "filter_edge_lift"
term = "Out-of-sample lift filter"
short = "Keeps the edges whose out-of-sample hit rate beats the base rate by a range of percentage points."
body = """
Lift is the hit rate minus the base rate, in points. 5 means the edge won five points more often than a random pick would. A negative lift is worse than the base rate. An edge with no out-of-sample result is unknown and never passes.
"""
next = "Set a minimum of 3 to see the edges that beat the base rate by a margin."
see_also = ["lift", "base_rate", "out_of_sample", "filter_range", "filter_unknown_rows"]

[[term]]
id = "filter_edge_sample"
term = "Out-of-sample trades filter"
short = "Keeps the edges that have a number of out-of-sample trades between a minimum and a maximum."
body = """
A rate means little on a few trades. The count is the trades of the edge's basis on the period it was not tuned on. Set a minimum to leave out the edges whose result rests on too few picks. An edge with no out-of-sample trades never passes.
"""
next = "Set a minimum of 100 to leave out thin evidence."
see_also = ["trades", "evidence_needed", "filter_range", "filter_unknown_rows"]

[[term]]
id = "filter_edge_live_state"
term = "Live state filter"
short = "Keeps the edges whose paper record is in the live states you tick, such as on track or below range."
body = """
The state compares the edge's settled paper trades with the range its backtest led you to expect. On track means inside the range. Below range is the one to look at: the edge is doing worse than the backtest, and a fall that lasts is a sign it has decayed. An edge with no paper record has a state that says why, and it passes only if you tick that state.
"""
next = "Tick Below range to see the edges that may have stopped working."
see_also = ["live_state", "decay", "usual_range", "paper_trading"]

[[term]]
id = "filter_trade_result"
term = "Result filter"
short = "Keeps the trades that won, lost, were excluded or are still open."
body = """
A trade won when it beat what the edge is judged against and lost when it did not. Excluded trades could not be measured, and each carries its reason. Open trades are paper trades not yet settled. Open and excluded trades are never counted as losses.
"""
next = "Tick Lost to read the picks that went wrong."
see_also = ["trade_status", "trade_excluded_reason"]

[[term]]
id = "filter_trade_in_sample"
term = "In sample filter"
short = "Keeps the trades from the period the edge was tuned on, or from the period it was not."
body = """
Yes keeps the in-sample trades, the ones the edge's rules were chosen on. No keeps the out-of-sample trades, which are the fair test. Either applies nothing. A live paper trade is out of sample by definition.
"""
next = "Choose no to read only the trades that count as evidence."
see_also = ["in_sample", "out_of_sample", "trade_period", "filter_toggle"]

[[term]]
id = "filter_trade_record"
term = "Backtest or live filter"
short = "Keeps the trades of the backtest, or the live paper record."
body = """
Backtest trades come from the edge's run over history. Live trades are the paper trades the edge has recorded since it began, as each session knew them. An edge that records no paper trades has no live ones.
"""
see_also = ["trade_ledger", "paper_trading", "live_record"]

[[term]]
id = "filter_trade_return"
term = "Trade return filter"
short = "Keeps the trades whose return lies between a minimum and a maximum."
body = """
The return is the trade's result in the edge's own measure, as a fraction: 0.05 is five percent and -0.10 a loss of ten percent. It is the stored figure before you apply your own costs. A trade whose value is not stored, or that you may not see under a data licence, never passes.
"""
next = "Set a maximum of -0.1 to read the worst trades."
see_also = ["outcome_excess_return", "filter_range", "filter_unknown_rows"]

[[term]]
id = "filter_trade_adv"
term = "Average dollar volume filter"
short = "Keeps the trades in names whose average daily dollar volume at the decision lies in a range."
body = """
It is the average dollars traded a day over the twenty sessions before the decision. It says whether a trade could have been done in size. A name with no stored figure is unknown and never passes.
"""
next = "Set a minimum of 5,000,000 to leave out names too thin to trade."
see_also = ["capacity", "filter_range", "filter_unknown_rows"]

[[term]]
id = "filter_group_setup"
term = "Setup"
short = "The filters that say what a row is or how it was found: its decision, rank and score, its type and size."
body = """
A group button opens the filters it holds and shows how many are in use. On Ideas, Setup holds the decision, the screener and how many screeners agree. On a screener's results it holds the decision, the rank and the score. On Explore it holds the security type, the sector, index membership, leverage, market cap and price. On the Screeners, Edges and trade lists it holds the owner, the evidence and the result of each row.
"""
see_also = ["filter_decision", "filter_result_decision", "filter_rank", "filter_security_type"]

[[term]]
id = "filter_group_changed"
term = "What changed"
short = "The filters that compare the session with the one before it."
body = """
A group button opens the filters it holds and shows how many are in use. On a screener's results, What changed holds the rows new or dropped since the screener's previous run. It also holds how many places a row rose in the screener's order.
"""
see_also = ["filter_change", "filter_rank_moved_up", "filter_group_setup"]

[[term]]
id = "filter_group_tradeable"
term = "Tradeable"
short = "The filters that say how well the shares and their options trade."
body = """
A group button opens the filters it holds and shows how many are in use. Ideas and a screener's results hold the option liquidity class, the option spread and the dollar volume here. Explore holds the liquidity class and whether the name has listed options.
"""
see_also = ["filter_option_tier", "filter_spread", "filter_dollar_volume", "filter_liquidity_class"]

[[term]]
id = "filter_group_coming_up"
term = "Coming up"
short = "The filters on dated events ahead: earnings and the ex-dividend date."
body = """
A group button opens the filters it holds and shows how many are in use. Coming up holds the earnings window and the ex-dividend window.
"""
see_also = ["filter_earnings", "filter_ex_dividend"]

[[term]]
id = "filter_group_more"
term = "More filters"
short = "Any other field of the catalogue, found by typing its name."
body = """
More filters opens a search over the catalogue's fields. A field you pick becomes a filter on the list, shown with the others.
"""
see_also = ["filter_group_setup"]

[[term]]
id = "filter_removes"
term = "Removes"
short = "How many rows a filter takes out of the list, given your other filters."
body = """
Each applied filter shows a number: the rows that would come back if you switched that filter off, with every other filter unchanged. Two filters that cut the same rows each show a small number even though together they cut many. When a search finds nothing, the filters with the largest numbers are the ones to loosen first.
"""
next = "Click a filter to switch it off and see the list grow by that many rows."
see_also = ["filter_switched_off"]

[[term]]
id = "filter_switched_off"
term = "Switched-off filter"
short = "A filter you keep on the bar without applying it."
body = """
Clicking an applied filter switches it off: it stays on the bar, struck through, and takes no rows out. Click it again to apply it with the same values. Remove it with the cross when you no longer want it.
"""
see_also = ["filter_removes"]

[[term]]
id = "filter_unknown_rows"
term = "Unknown rows"
short = "Rows whose value for a filter is not known, which a filter never lets through."
body = """
When a value is not stored for the session, the app does not guess. The row is unknown for that filter and does not pass it, so a range from 0 up does not keep it either. The control says how many rows are unknown, so you can tell a row that failed the filter from one that was never measured.
"""
next = "Switch the filter off to see those rows again."
see_also = ["unknown"]

[[term]]
id = "filter_range"
term = "Range filter"
short = "Keeps the rows whose value lies between a minimum and a maximum."
body = """
Leave one end empty for no limit. The bars show how many of the rows that pass your other filters sit in each band. The bands are fixed, so they do not move as you change the others.
"""
see_also = ["filter_unknown_rows"]

[[term]]
id = "filter_window"
term = "Window filter"
short = "Keeps the rows whose dated event is within a number of days or sessions."
body = """
A session is a trading day, a day is a calendar day: a window of five sessions reaches about a week ahead. The unit is fixed by the filter. A row with no date for the event is unknown and does not pass.
"""
see_also = ["filter_unknown_rows"]

[[term]]
id = "filter_toggle"
term = "Yes, no or either"
short = "A filter on a yes or no fact: yes keeps the rows where it is true, no where it is false, either applies nothing."
body = """
A row where the fact is not known passes neither yes nor no; only either lets it through.
"""
see_also = ["filter_unknown_rows"]

[[term]]
id = "cohort"
term = "Cohort"
short = "The group of stocks an instrument is ranked against: the whole universe, its sector or its industry."
body = """
A rank only means something against peers. The cohort is that peer group: all the stocks of the universe, the stocks of the same sector, or the stocks of the same industry. Membership is as of the session you are reading, from the company data stored for it, so a company that changed sector later does not move back. A cohort too small to rank fairly, fewer than 20 stocks for a sector or 10 for an industry, gives no value. ETFs and funds belong to no cohort and have no value, so a filter on a cohort rank leaves them out.
"""
next = "Pick the sector rank to compare a name with its direct peers, the universe rank to compare it with everything."
see_also = ["percentile", "top_pct_of_cohort", "filter_unknown_rows"]

[[term]]
id = "percentile"
term = "Percentile"
short = "Where a value stands in its cohort, from 0 (the lowest) to 1 (the highest)."
body = """
0.9 means the value is above 90% of the stocks in the cohort that have one. 0.5 is the middle. Names with the same value share one rank. It tells you the order, not the distance: the top name can be far ahead or barely ahead of the second. It is a rank for one session and moves as the cohort moves, so a name can fall in rank without its own value changing. A stock with no value, or in a cohort too small to rank, has no percentile and never passes a filter on it.
"""
next = "Set a minimum of 0.8 to keep the top fifth of the cohort."
see_also = ["cohort", "top_pct_of_cohort", "filter_range"]

[[term]]
id = "top_pct_of_cohort"
term = "Top N% of its sector"
short = "A percentile filter read as a share: a minimum of 0.9 is the top 10% of the cohort."
body = """
The filters work on the percentile from 0 to 1. The top N% of a cohort is a minimum of 1 minus N/100: 0.9 for the top 10%, 0.75 for the top quarter. The bottom N% is a maximum of N/100. The top 10% of a sector of 40 stocks is only four names, so a small cohort gives a coarse answer. Stocks without a value are never counted in the top or the bottom.
"""
next = "Set the minimum to 0.9 on the sector rank to see the leaders of each sector."
see_also = ["cohort", "percentile", "filter_range"]

[[term]]
id = "filter_mom_pct_sector"
term = "Momentum in sector filter"
short = "Keeps the stocks whose 12-1 momentum ranks within a range of the percentile of their sector."
body = """
12-1 momentum is the return over the past year leaving out the latest month. The filter ranks it among the stocks of the same sector, from 0 (the weakest) to 1 (the strongest). 0.9 or more is the top tenth of its sector. A high rank says the stock trended better than its peers, not that the trend continues. A sector with fewer than 20 stocks that have a value gives none, and an ETF or fund has no sector rank. Those rows are unknown and never pass, even when you only set a maximum.
"""
next = "Set a minimum of 0.8 to see the strongest trends within each sector."
see_also = ["cohort", "percentile", "top_pct_of_cohort", "filter_unknown_rows"]

[[term]]
id = "filter_rs_pct_sector"
term = "Relative strength in sector filter"
short = "Keeps the stocks whose 63-session strength against the market ranks within a range among their sector."
body = """
Relative strength is the 63-session return against SPY. The filter ranks it among the stocks of the same sector, from 0 to 1, 1 the strongest. Three months is a short window: one burst of news can lift a stock to the top for a while. A sector with fewer than 20 stocks that have a value gives none, and an ETF or fund has no sector rank. Those rows are unknown and never pass.
"""
next = "Set a minimum of 0.8 to find the stocks leading their sector over the last three months."
see_also = ["cohort", "percentile", "filter_rs_pct_industry", "filter_unknown_rows"]

[[term]]
id = "filter_rs_pct_industry"
term = "Relative strength in industry filter"
short = "Keeps the stocks whose 63-session strength against the market ranks within a range among their industry."
body = """
The same rank as the sector filter, among the narrower group of the stocks of the same industry, so the peers are closer. An industry has fewer stocks, so the ranks are coarser: fewer than 10 stocks with a value gives none. An ETF or fund, and a stock with no industry on record, have no rank. Those rows are unknown and never pass.
"""
next = "Use it with the sector filter: leaders of both are the strongest."
see_also = ["cohort", "percentile", "filter_rs_pct_sector", "filter_sector", "filter_unknown_rows"]

[[term]]
id = "filter_dollar_volume_pct_universe"
term = "Dollar volume in universe filter"
short = "Keeps the stocks whose 20-session dollar volume ranks within a range among all the stocks of the universe."
body = """
Dollar volume is the money that changed hands, averaged over 20 sessions, so a single busy day moves it little. The rank runs from 0 (the least traded) to 1 (the most). It says how liquid the stock is next to the others, not whether you can trade your size: for that read the dollar volume itself. An ETF or fund has no rank, and the whole rank is missing on a day the price data came in partial. Those rows are unknown and never pass.
"""
next = "Set a minimum of 0.5 to stay with the more heavily traded half of the universe."
see_also = ["cohort", "percentile", "filter_dollar_volume", "filter_unknown_rows"]

[[term]]
id = "filter_days_to_cover_pct_sector"
term = "Days to cover in sector filter"
short = "Keeps the stocks whose short interest, in days of volume, ranks within a range among their sector."
body = """
Days to cover is the short position divided by the daily volume: how long the shorts would need to buy back. The filter ranks it among the stocks of the same sector, from 0 (the least) to 1 (the most). A high rank means crowded shorts, which can fuel a squeeze or warn of a weak stock. The short position is published twice a month, so it can be two weeks old. A sector with fewer than 20 stocks that have a value gives none, and an ETF or fund has no rank. Those rows are unknown and never pass.
"""
next = "Set a minimum of 0.9 to list the most heavily shorted stocks of each sector."
see_also = ["cohort", "percentile", "top_pct_of_cohort", "filter_unknown_rows"]

[[term]]
id = "filter_pe_pct_sector"
term = "P/E in sector filter"
short = "Keeps the stocks whose price to earnings ranks within a range among their sector."
body = """
The price to earnings multiple is ranked among the stocks of the same sector, from 0 (the cheapest) to 1 (the dearest). A low rank is cheap against peers, which is not the same as a bargain: it can reflect weak growth. A company that loses money has no multiple, so it has no rank. Nor has a stock in a sector with fewer than 20 ranked stocks, or any ETF or fund. Those rows are unknown and never pass, so the filter never lists loss-making names.
"""
next = "Set a maximum of 0.25 to see the cheapest quarter of each sector, then check why."
see_also = ["cohort", "percentile", "filter_pe_pct_industry", "filter_unknown_rows"]

[[term]]
id = "filter_pe_pct_industry"
term = "P/E in industry filter"
short = "Keeps the stocks whose price to earnings ranks within a range among their industry."
body = """
The same rank as the sector filter, among the closer peers of the same industry. An industry has fewer stocks, so the ranks are coarser: fewer than 10 ranked stocks gives none. A loss-making company, an ETF or fund, and a stock with no industry on record have no rank. Those rows are unknown and never pass.
"""
next = "Use it with the sector filter: cheap against both is a stronger sign."
see_also = ["cohort", "percentile", "filter_pe_pct_sector", "filter_sector", "filter_unknown_rows"]

[[term]]
id = "filter_iv_rank_pct_sector"
term = "IV rank in sector filter"
short = "Keeps the stocks whose option volatility rank ranks within a range among their sector."
body = """
IV rank is where the current 30-day implied volatility sits in its own 252-session range. The filter ranks that among the stocks of the same sector, from 0 to 1, so it finds names whose options are dear against their peers. It is built from our own stored volatility history. A stock whose history is too short, a sector with fewer than 20 stocks that have a value, and any ETF or fund have no rank. Those rows are unknown and never pass.
"""
next = "Set a minimum of 0.8 to see where option premium is rich against the sector."
see_also = ["cohort", "percentile", "filter_iv_rank_pct_industry", "filter_unknown_rows"]

[[term]]
id = "filter_iv_rank_pct_industry"
term = "IV rank in industry filter"
short = "Keeps the stocks whose option volatility rank ranks within a range among their industry."
body = """
The same rank as the sector filter, among the closer peers of the same industry. Fewer than 10 ranked stocks in the industry gives none. A stock with a short volatility history, an ETF or fund, and a stock with no industry on record have no rank. Those rows are unknown and never pass.
"""
next = "Use it with the sector filter to find premium that is rich against the closest peers."
see_also = ["cohort", "percentile", "filter_iv_rank_pct_sector", "filter_sector", "filter_unknown_rows"]

[[term]]
id = "export"
term = "Export"
short = "Saves the rows your filters leave as a CSV file, with what you can see and nothing more."
body = """
Export writes the list you are looking at, with the filters in force, as a CSV file. The server builds it the way it builds the page, so the file has the same rows in the same order. A value you cannot see on the page reads LICENCE in the file. A value that is not known shows its reason the same way, and one that is not stored is empty. The first line of the file is a notice; see the export notice. A list longer than 50,000 rows is cut there, and a second line says so.
"""
next = "Narrow the filters first if the file says it was cut."
see_also = ["export_notice", "unavailable_licence", "unknown"]

[[term]]
id = "export_notice"
term = "Export notice"
short = "The first line of an exported file: the session, who exported it and which data licences they hold."
body = """
Some values come from a source licensed for one person's own use, such as the broker feed. The notice names the session the file reads, your user and the licences you hold, and says those values are for the holder's own use and not for redistribution. A person who does not hold the licence sees LICENCE in those cells and never the value. Each export is logged with your user, the list, the filters, the number of rows and the licences held.
"""
next = "Keep a file that holds personal-licence values to yourself."
see_also = ["export", "unavailable_licence"]
