# L3 site setting: the Guide glossary, edges: the idea, its status, the builder and paper trading (ADR 0051, docs/ui/guide.md section 3, "Glossary"). One [[term]]
# each: id, term, short (one sentence), body, see_also. Typed by
# src/algotrade/config/site/guide/glossary.py; fitness tests: tests/unit/config/site/guide/test_glossary.py.

[[term]]
id = "edge"
term = "Edge"
short = "A written reason why some stocks should do better than others, tested on the stored history."
body = """
An edge is a document. It states the idea in one sentence and who is forced or wrong so that the pattern exists. It says why the pattern should last once known and how a trade would be held (how long, against what, at what cost). It lists the screens that implement it. The app runs each screen on every past session
using only what was known then, and compares what its picks did next with every other eligible
name. An edge earns trust only from those numbers, never from the idea alone.
"""
see_also = ["verdict", "edge_status", "edge_owner", "edge_copy", "base_rate", "out_of_sample"]

[[term]]
id = "edge_status"
term = "Edge status"
short = "Where an edge stands: researching, candidate, evidenced, live or retired; or rejected, blocked."
body = """
Every edge has one status. Five follow one another in order. Researching: the idea is written
and nothing is claimed. Candidate: it is being tested. Evidenced: its picks beat the base rate
and the baselines out of sample, on enough trades. Live: it is evidenced and used to rank ideas.
Retired: it stopped working by its own retirement rule. Two statuses sit off the line. Rejected:
checked and dropped, with the reason kept so it is not filed again. Blocked: worth testing, but
missing the data it needs. A site edge's status is the site's, the same for everybody; the status of
your own edge is yours to move. Only an official result over the out-of-sample period can move a
site edge to evidenced.
"""
next = "Only the site's reviewers move a site edge; you move your own edge yourself (Moving your edge's status)."
see_also = ["verdict", "edge_owner", "edge_state", "out_of_sample", "exploratory", "official_result", "base_rate"]

[[term]]
id = "edge_owner"
term = "Edge owner"
short = "Whose edge it is: the site's, shared by everybody, or yours."
body = """
A site edge is reviewed and shared: its document, its status and its official result are the same
for every user, and only the site's reviewers change them. Your edge is a document of your own: a
clone of a site edge or one you wrote from scratch. You set its status, you see its backtests and
nobody else does, until an admin publishes it site-wide. You cannot change a site edge's status;
clone it, or follow it.
"""
see_also = ["edge_copy", "edge_status", "follow_edge", "official_result"]

[[term]]
id = "edge_state"
term = "Moving your edge's status"
short = "You move your own edge along its status line; a site edge's status is not yours to move."
body = """
A clone starts as researching. Make it a candidate when you start testing it, live when you
intend to act on it, and retire it when it stops working or you stop acting on it. Reject one you
have checked and dropped: a reason is needed and is kept so it is not filed again. From any status
you can go back to researching, and a rejected or retired edge can be reopened. A candidate that
replaces another edge of yours (a new version) retires the old one when it goes live. A move is
your record, not an order: the app never trades. Some pages still show the older words: trial
for a candidate, and following for a live edge or a site edge you bookmarked.
"""
next = "The app records each move, and from candidate on it records the edge's paper trades every night."
see_also = ["edge_status", "edge_owner", "forward_test"]

[[term]]
id = "edge_copy"
term = "Cloning an edge"
short = "A clone is your own edge that extends another; you change only what you want."
body = """
Clone an edge to make one of your own. It extends the edge it was cloned from (its `extends`),
so you write down only what differs (the screens, the picks, the holding periods, the universe).
Everything else follows the original, which stays as it is. Your clone is researching to
begin with and has its own backtests. Its out-of-sample result stays hidden until you show it or
make it live, so the fair test is not used up while you tune. An admin can publish a clone
site-wide.
"""
see_also = ["edge", "edge_owner", "show_out_of_sample", "compare_versions"]

[[term]]
id = "follow_edge"
term = "Following an edge"
short = "Following is a bookmark of a site edge: it keeps the edge in your list and on paper."
body = """
Follow a site edge to keep it in your list and have the app record its paper trades for you.
Following changes nothing about the edge: its status and its official result stay the site's, and
unfollowing removes the bookmark. The app warns when the verdict is Not working or Not enough
data, and the warning stays on the bookmark as a permanent label (Followed against the verdict).
Your own edge is not followed: you set its status instead. A bookmark is a record of your
interest, not an order: the app never trades.
"""
next = "Unfollow at any time to remove the bookmark; to change the edge itself, clone it."
see_also = ["edge_owner", "edge_status", "verdict", "edge_labels", "paper_trading", "official_result"]

[[term]]
id = "edge_labels"
term = "Edge labels"
short = "Permanent warnings the app puts on an edge when a choice weakens its evidence."
body = """
Followed against the verdict: you followed it, or made your own edge live, while its verdict was Not working. Out-of-sample
seen while tuning: you looked at a copy's out-of-sample result and kept changing it, so that
result is no longer a fair test. Replaced without a forward test: a new version replaced the old
one before enough new sessions had passed. Split moved after viewing: the out-of-sample start
was moved after the result was seen. Labels are never removed.
"""
next = "To avoid one, look at a clone's out-of-sample result only when you have finished tuning, and forward-test a new version before it replaces the old one."
see_also = ["follow_edge", "edge_state", "out_of_sample", "show_out_of_sample", "forward_test"]

[[term]]
id = "show_out_of_sample"
term = "Show out-of-sample"
short = "Reveals a clone's out-of-sample result; once seen it cannot be hidden again."
body = """
The out-of-sample period is the fair test: data the edge was not tuned on. While you are still
changing a copy the app keeps that result hidden and judges the copy on the in-sample period
only. Showing it reveals the figures and the verdict on them. Do it when you are done tuning:
if you keep changing the copy afterwards, the label Out-of-sample seen while tuning is kept on
it.
"""
see_also = ["out_of_sample", "edge_labels", "edge_copy"]

[[term]]
id = "compare_versions"
term = "Compare versions"
short = "Your copy beside the edge it extends and the baselines, on the same measures."
body = """
Each row is one version tested on one screen and holding period: your copy's latest backtest,
the edge it extends (its official result) and the baselines. Read the in-sample columns to see
whether a change helped on the period you tuned on. The out-of-sample columns appear once you
show that result. A copy that beats its original in-sample but not out-of-sample was probably
fitted to the past.
"""
see_also = ["edge_copy", "show_out_of_sample", "win_rate", "official_result"]

[[term]]
id = "edge_builder_idea"
term = "Edge builder: the idea"
short = "The claim the edge makes and why it should keep working."
body = """
Step 1 of the six. The name and the thesis say what the edge claims in one sentence. Why it should
last asks who is forced or systematically wrong so that the pattern exists, and why it survives
being known. List where the idea comes from: a paper with its link, or author, title and year.
Everything else the edge does is tested; this part is the reason to believe the test is more than
luck, so write it before you look at a result.
"""
see_also = ["edge", "edge_quality_bar", "edge_builder_screens", "edge_persistence"]

[[term]]
id = "edge_quality_bar"
term = "The quality bar"
short = "Nine written answers every edge gives before its numbers are read."
body = """
Every edge answers nine questions. Who is forced or wrong? Why does the pattern survive being known? How is the outcome measured? When does the trigger become known? How could a stranger replicate it? What size should you expect? What are the capacity and costs? How does it fail? What else could explain the result? The seven under More in step 1 are
those after the first two. An answer is a few sentences; an edge that cannot answer them is a
backtest looking for a story.
"""
see_also = ["edge", "edge_builder_idea"]

[[term]]
id = "edge_builder_screens"
term = "Edge builder: screens"
short = "The existing screens that decide which stocks qualify and in what order."
body = """
Step 2 of the six. A screen only decides which stocks qualify on a session and how they rank. Everything after that belongs to the edge: when it fires, how many picks it takes, how it is held. Choose one or more: each one is tested on its own as an implementation of the edge. The
record beside a screen is its win rate against the base rate on the out-of-sample period, or No
record yet. Edit in Screen Builder opens the screen and brings you back here with your draft kept.
"""
see_also = ["edge", "base_rate", "edge_builder_picks", "win_rate"]

[[term]]
id = "edge_builder_picks"
term = "Edge builder: picks"
short = "When the edge fires and how many of the screen's ranked stocks it takes."
body = """
Step 3 of the six. Every session or month end fires on the calendar; an event fires after that
event, such as an earnings report, for the stocks that had it. Top N takes the first N of the
screen's ranked list; all that qualify takes every stock that passes. Fewer stocks per session
means fewer trades, so a verdict takes longer to reach.
"""
see_also = ["edge_builder_screens", "edge_builder_trade", "trades"]

[[term]]
id = "edge_builder_trade"
term = "Edge builder: trade"
short = "How each pick is entered and held, what it costs and what counts as a win."
body = """
Step 4 of the six. Enter says how many sessions after the trigger the position opens (at least
one, so nothing is bought on a price that was not known yet). Each holding period is measured and
reported on its own. Costs are for a round trip in basis points (100 bps is 1%). A win is either
a return above the benchmark after costs, or only a rise after costs.
"""
see_also = ["edge_builder_picks", "win_rate", "edge_builder_compare"]

[[term]]
id = "edge_builder_compare"
term = "Edge builder: compare against"
short = "The universe that sets the base rate and the decoys the edge must beat."
body = """
Step 5 of the six. The universe is the set of stocks a random pick could have been; its win rate
is the base rate the edge has to beat. The decoys are other screens run on the same sessions: if
a plain one does as well, the idea is not what explains the result.
"""
see_also = ["base_rate", "edge_builder_trade", "edge_builder_test", "win_rate"]

[[term]]
id = "edge_builder_test"
term = "Edge builder: test and run"
short = "Where the out-of-sample period starts, a summary, and the run."
body = """
Step 6 of the six. Before the date is in-sample, the period you may tune on; from it is
out-of-sample, kept aside to check. Results for the out-of-sample period stay hidden while you
change the edge. Moving the date after seeing a result is recorded as a permanent label on the
edge. Save and run backtest saves the whole edge and starts the backtest; you can leave and the
result lands on the edge's page.
"""
see_also = ["out_of_sample", "variants_tried", "show_out_of_sample", "run_backtest"]

[[term]]
id = "edge_builder_running"
term = "Backtest running"
short = "The backtest of your edge is running; you can leave and the result will be on its page."
body = """
A backtest runs the edge on every past session using only what was known then. It can take a
while, and one backtest of yours runs at a time. When it finishes the edge's page shows your
copy beside the site edge and the decoys, in-sample; out-of-sample stays hidden until you show it.
"""
see_also = ["compare_versions", "show_out_of_sample", "official_result"]

[[term]]
id = "edge_definition"
term = "How the edge is defined"
short = "The six lines that say exactly what was tested: idea, screens, picks, trade, comparison and test."
body = """
Idea: the thesis in one sentence. Screens: the rule screens that implement it, each opening its
own page. Picks: how often, and how many names, are taken from the screen. Trade: when to enter,
how long to hold and what counts as a win. Compare against: the universe and the baselines.
Test: the date the out-of-sample period starts. Read these before any figure: a figure answers
only the question these lines ask. Example: vrp_short_premium takes the top 20 of the vrp_iv_hv
screen every session. It enters 1 session later, holds 15, 21 or 31 trading days, and wins when
the short 0.30-delta put is not assigned. Don't compare the win rates of two edges with different
Trade lines.
"""
see_also = ["edge", "baselines", "out_of_sample", "win_rate", "edge_persistence"]

[[term]]
id = "edge_persistence"
term = "Why it should last"
short = "The reason a pattern should survive being known, with the sources it comes from."
body = """
A pattern with no reason to last is a coincidence, and a coincidence ends once you rely on it.
This panel says who is forced or wrong so that the pattern exists, and why that should continue.
It also lists where the claim comes from; a source with a link opens its document. A person writes the reason
and the app does not test it: only the numbers are tested. Read it as the question the numbers
must answer. Don't take a good reason as evidence, or good numbers as a reason. An edge needs
both, and the verdict looks only at the numbers.
"""
see_also = ["edge", "edge_definition", "verdict"]

[[term]]
id = "run_backtest"
term = "Run backtest"
short = "Tests this edge now on every stored session, under your own split; the result is yours, not the site's."
body = """
For each past session the run applies the edge's screens using only what was known then and
records what the picks did next. The rows are yours: nobody else sees them. If your
out-of-sample date is not the edge's frozen one, the run is EXPLORATORY and never changes the
verdict or the official result. A run takes 30 to 40 minutes, one at a time per user. A second
request is refused until the first ends, and the page says so when no outcomes are stored. Run as
site, shown to admins only, runs it for the site: a site run at the frozen date is what becomes
the official result. Don't keep running other dates until a number looks better.
"""
see_also = ["exploratory", "official_result", "edge_backtests", "out_of_sample"]

[[term]]
id = "edge_views"
term = "Edge views"
short = "The four views of the edges list: All, Mine, Following and Rejected."
body = """
All lists every edge you can see. Mine lists the edges that are yours: clones and edges you wrote.
Following lists the edges you keep in your list by following them. Rejected lists the edges that
were rejected, whether by you or by the site's own status. The number beside each name counts the
edges in it. A view only filters the list; it never changes an edge, and each row still sits
under its verdict.
"""
see_also = ["edge_status", "follow_edge", "edge_copy", "verdict"]

[[term]]
id = "edge_left_out"
term = "Edge left out"
short = "A warning that one of your own edge files could not be read, so the app left that edge out."
body = """
Left out, followed by an edge id, appears when a file of your own fails the checks the app runs
when it loads edges. A file of your own is a clone or an edge you wrote. Common causes: the site edge it extends
changed or was removed, it names a screen or selection that no longer exists, or a line in it is
invalid. The reason under the title says which. Your other edges load as usual, and a site edge
you follow stays listed with only its bookmark read. Correct the file the reason names, or ask an
admin to. Nothing in your other edges is lost.
"""
see_also = ["edge_copy", "edge_views", "edge"]

# ---------------------------------------------------------------- paper trading and the live record

[[term]]
id = "paper_trading"
term = "Paper trading"
short = "What an edge of yours would have bought and sold, recorded every night as it happens."
body = """
For an edge you follow, or your own candidate or live edge, the app takes the picks of its
screen each night, using only what was known that night. It records them as paper trades: the name, the session to buy it and the
session to sell it after the edge's holding period. Nothing is ever ordered. A trade stays open
until its window has closed and the result is stored, and is then won or lost by the same win
rule as the backtest. A trade whose result could not be read is skipped with the reason; it is
never counted as a loss. The record is kept as written: editing the edge later does not change
the trades already made.
"""
see_also = ["live_record", "usual_range", "forward_test", "win_rate"]

[[term]]
id = "live_record"
term = "Live record"
short = "How the closed paper trades of a followed edge have done so far."
body = """
The live record counts the closed paper trades, the wins among them and the win rate, and sets
it against what the backtest led you to expect (the usual range). Open and skipped trades are
counted apart. With few closed trades the rate swings widely by chance. So the record is judged only once the site's minimum number of signal sessions have closed. Before that it says it is too early.
On track means the live win rate is inside the usual range; below or above means it is outside,
which is worth a look but proves nothing alone.
"""
see_also = ["paper_trading", "usual_range", "win_rate"]

[[term]]
id = "usual_range"
term = "Usual range"
short = "The spread of win rates the backtest's own win rate would give over the same number of trades."
body = """
Suppose the backtest's win rate really held. The share of wins among a given number of trades would still vary from one run of trades to the next, by chance alone. The usual range is the middle
80% of that variation (the 10th to the 90th percentile of a binomial distribution of wins), so
it narrows as more sessions close. The picks of one night are bets on the same market over the same window, and they move together. So the range counts signal sessions, not trades: ten picks on one night are one observation, not ten. The picture shows the whole spread, the live win rate and
the two ends of the range. A live rate outside it is unusual if the backtest was right, but
one in five honest records falls outside by chance.
"""
see_also = ["live_record", "win_rate", "paper_trading"]

[[term]]
id = "forward_test"
term = "Forward test"
short = "A new version of an edge tried on live paper trades beside the edge it would replace."
body = """
A new version of an edge is a candidate first, tried on paper next to the version it would
replace. Both record the same nights' picks from the day it became a candidate. It can go live and
retire the old one once the site's number of sessions have passed and its win rate is not behind.
Replacing earlier is allowed, but the edge then carries the label replaced without a forward test.
The backtest of a version you have tuned looks better than it will do going forward.
"""
next = "The app records both versions' paper trades each night until the site's number of sessions has passed."
see_also = ["paper_trading", "live_record", "official_result", "win_rate"]

[[term]]
id = "edge_tonight"
term = "Tonight's signal"
short = "What the nightly run did for a followed edge on the session, so an empty buy list says why."
body = """
Signalled: the edge was due and its picks are listed as buys. No picks: it was due but its screen
qualified no name. Not due: its schedule does not fire on this session (an edge held for 20
sessions signals about once a month). Skipped: it was due but could not be signalled, and the reason says why (an input table was missing, the edge is not paper traded yet). It is never an empty record. Not run: the nightly has no finished run for the session. Missed counts due
sessions between nights that nobody signalled, kept so a gap is never silent.
"""
see_also = ["paper_trading", "live_record"]

[[term]]
id = "edge_run_rights"
term = "Who may run what"
short = "You run the edges that are yours; a site edge is run by an admin as the site (Run as site)."
body = """
Run starts a backtest of one edge and stores the result under the edge's owner. You can run only
edges you own: your own edges, and your clones of a site edge. A site edge belongs to the site, so a
trader cannot run it. Clone it to test your own version. An admin runs it with Run as site, which
stores the result as the site's, the official one. Admins do not run a site edge as themselves. One backtest runs at a time for each owner: a second Run waits until the first has
finished.
"""
see_also = ["edge_owner", "edge_copy", "run_trigger"]

[[term]]
id = "run_trigger"
term = "Run trigger"
short = "What started a backtest run: the nightly schedule, the Run button (ui) or the command line (cli)."
body = """
Every stored run says what started it. Nightly means the scheduled update ran it. Ui means someone
pressed Run (or Run as site) in the app. Cli means it was started from the command line on the
host. The trigger says nothing about how good the result is, only where it came from. A run stored
before the trigger was recorded shows none, and the app does not guess one.
"""
next = "Judge a run by its measures, not its trigger; press Run on an edge you own to start a fresh one."
see_also = ["edge_run_rights", "edge_owner"]
