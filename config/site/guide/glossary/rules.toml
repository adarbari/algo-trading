# L3 site setting: the Guide glossary, the rule grammar (ADR 0051, docs/ui/guide.md section 3, "Glossary"). One [[term]]
# each: id, term, short (one sentence), body, see_also. Typed by
# src/algotrade/config/site/guide/glossary.py; fitness tests: tests/unit/config/site/guide/test_glossary.py.

# ---------------------------------------------------------------------------- the rule grammar

[[term]]
id = "criterion"
term = "Criterion"
short = "One rule of a screen: a field, a comparison, a threshold and a mode."
body = """
A criterion compares one catalogue field with a threshold, for example the closing price
rollup.price_stats@v2.close greater than 5. Its mode says what a miss does (hard, soft or
score), a soft or score criterion may have a tolerance, and a soft one an on_miss. The
funnel shows the criteria in the order written. A criterion can be switched off without
deleting it.
"""
see_also = ["op", "mode", "tolerance", "on_miss", "criterion_group"]

[[term]]
id = "op"
term = "op"
short = "The comparison a criterion makes, such as gte (greater than or equal to) or between."
body = """
The comparison operators are eq (equals), ne (not equal), gt and gte (greater than; or equal to), and lt and lte (less than; or equal to). The list operators are in and not_in (one of a list, or none of it). The operator between means within two bounds, both included. The operators is_null and not_null take no value. A tolerance works
only with the numeric comparisons gt, gte, lt, lte and between. A value that is absent, not a
number, or of the wrong type for the comparison counts as missing, and missing never passes.
"""
see_also = ["criterion", "tolerance"]

[[term]]
id = "mode"
term = "mode"
short = "What a criterion's miss does to a row: hard rejects it, soft may keep it as a near miss, score only lowers its score."
body = """
Every criterion has a mode, hard unless it says otherwise. A hard criterion must pass. A soft
one may miss by up to its tolerance and keep the row as a near miss. A score criterion never
removes a row; it only moves it down the list. Hard and soft criteria are the gating ones, the
steps of the screen's funnel.
"""
see_also = ["hard", "soft", "score_mode", "gating_criterion", "near_miss"]

[[term]]
id = "hard"
term = "hard"
short = "A criterion that must pass: a miss, or no value, rejects the row."
body = """
A hard criterion is strict: with the closing price required to be greater than 5, a close of
4.99 is a REJECT. A row with no value for it is rejected too, with the reason no <field>. A
hard criterion takes no tolerance, and each hard miss costs the row 100 points of score.
"""
see_also = ["mode", "reject", "soft"]

[[term]]
id = "soft"
term = "soft"
short = "A criterion that may miss by a little: within its tolerance the row stays in as a near miss."
body = """
A soft criterion needs a tolerance. A value that passes is fine. One that misses by no more than the tolerance is a near miss, and gives the row the decision its on_miss names (WATCH by default). One that misses by more is a REJECT. A row with no value for it stays in, loses the
full near-miss penalty of 10 points, and its reasons list no <field>.
"""
see_also = ["tolerance", "on_miss", "near_miss", "mode", "watch", "reject"]

[[term]]
id = "score_mode"
term = "score (mode)"
short = "A criterion that never removes a row: a miss only lowers the row's score."
body = """
Use score for a preference rather than a requirement: names that meet it rise, the others stay
in lower down. Its tolerance is optional. A miss within it costs 0 to 10 points by how far it missed. A miss beyond it, a miss with no tolerance, or no value at all costs 10.
"""
see_also = ["score", "mode", "tolerance"]

[[term]]
id = "tolerance"
term = "tolerance"
short = "How far a value may miss a soft or score criterion's threshold and still count as a near miss."
body = """
A tolerance is either a number in the field's own unit or a share of the threshold (relative). A tolerance of 0.02 on a threshold of 0.10 makes 0.08 to 0.10 a near miss. A relative 0.2 on an average daily dollar volume of at least $50M (rollup.price_stats@v2.adv_usd_20d) makes $40M to $50M a near miss. It is required for soft, optional for score, not allowed for hard, and works
only with numeric comparisons.
"""
see_also = ["near_miss", "soft", "score_mode"]

[[term]]
id = "on_miss"
term = "on_miss"
short = "What a soft criterion's near miss makes the row: WATCH (the default), LIQUIDITY_RISK or EVENT_RISK."
body = """
A row can nearly miss several soft criteria; it gets the most severe of their on_miss
decisions, EVENT_RISK above LIQUIDITY_RISK above WATCH, and every reason is listed. Only soft
criteria have an on_miss: a hard miss is always a REJECT and a score miss changes only the
score.
"""
see_also = ["watch", "liquidity_risk", "event_risk", "near_miss", "reject"]

# ---------------------------------------------------------------------------- groups (ADR 0071)

[[term]]
id = "criterion_group"
term = "Criterion group"
short = "Criteria combined into one step of a screen: all of them, any of them, or none of them."
body = """
A group holds two or more criteria, or other groups, and decides as one. A screen without groups needs every gating criterion to pass; a group changes that for the criteria inside it. Each criterion in a group keeps its own mode, tolerance and on_miss. A group has no mode of its own. At the top level a group is a step of the funnel, placed where its first criterion is written, and the screen still needs every step.

On a result a group shows its outcome (pass, near miss, fail or missing) and the member that decided it. Example: the group oversold, any of rsi_low and near_low, with RSI at 41 and the price 12% above its low, fails because neither member passes. Don't read a group's outcome as a measurement: open its members to see the values.
"""
see_also = ["group_all", "group_any", "group_none", "criterion", "mode", "near_miss", "hard", "gating_criterion", "on_miss"]

[[term]]
id = "group_all"
term = "all (group)"
short = "A group that passes only when every member passes."
body = """
An all group is the screen's own rule applied to a few criteria. One miss rejects it and the penalties add up. A near miss keeps the most severe on_miss among its members. It is useful inside an any group, as in (RSI below 30 and volume up) or price near its low.
"""
next = "Open the failing member to see which value missed, and by how much."
see_also = ["criterion_group", "group_any", "near_miss", "on_miss"]

[[term]]
id = "group_any"
term = "any (group)"
short = "A group that passes when at least one member passes, taking the verdict of its best member."
body = """
An any group is an or. It takes the verdict of its best member: one that passes before one that does not, then the lowest penalty, then the order written. With RSI a near miss and volume a hard fail, the group is the RSI near miss. A hard any with no passing member rejects the row, and it also rejects when the members have no value, so missing data never passes. An any with a score member never rejects.
"""
next = "Read the deciding member on the row: it is the one that carried the group."
see_also = ["criterion_group", "group_all", "near_miss", "score_mode", "hard"]

[[term]]
id = "group_none"
term = "none (group)"
short = "A group that passes when no member holds: the screen excludes every condition listed."
body = """
A none group is an except. Each member is turned into its opposite, so none of RSI below 30 means RSI at or above 30, and the group needs all of those opposites to hold. A member keeps its mode and tolerance: with a tolerance of 2, RSI at 29 is a near miss. A row that matches an excluded condition fails, with the reason naming it.
"""
next = "To find why a row failed, look for the excluded condition it matched."
see_also = ["criterion_group", "group_all", "near_miss", "reject"]
