# L3 site setting: the Guide glossary, Ideas from the picks of setups (ADR 0083): the two tabs, whether a tab's list is
# listed or Unproven, what a setup did tonight and why a setup or a pick was left out. One [[term]] each: id, term,
# short (one sentence), body, next, see_also. Typed by src/algotrade/config/site/guide/glossary.py; fitness tests:
# tests/unit/config/site/guide/test_glossary.py.

[[term]]
id = "idea_tab"
term = "Stocks and Premium"
short = "Ideas has two tabs: Stocks for setups that trade shares, Premium for setups that collect option premium."
body = """
A setup belongs to the tab of the position it tests. A position made of shares is Stocks. A position with any option leg is Premium. Each tab is its own list, built the same way, with its own cap of 15 ideas. A tab with no setup that qualifies shows its Unproven section, while the other tab may show its list. Premium stays Unproven until an option setup has a stored verdict of works or promising, which needs a three-month unseen holdout. The tab is part of the address, so a link opens the tab it was copied from.
"""
next = "Open the tab you trade; switch tab to see the other list."
see_also = ["ideas_listed", "ideas_unproven", "verdict"]

[[term]]
id = "ideas_listed"
term = "Listed"
short = "At least one setup of this tab has a good stored verdict, so the list is built from the picks of those setups."
body = """
The list holds the names that setups with a verdict of works or promising picked tonight, strongest evidence first, at most 15. A night on which those setups pick nothing is an empty list with the reason beside each setup, such as not a decision day. It never falls back to Unproven. The setups and the order are the same for every viewer. The only difference between viewers is the names a data licence keeps off a list, which are counted, never named.
"""
next = "Read the setup line above each group before the names under it."
see_also = ["ideas_ranking", "ideas_unproven", "verdict", "idea_setup_picked", "edge_pick_not_a_decision_day"]

[[term]]
id = "ideas_unproven"
term = "Unproven"
short = "No setup of this tab has a good stored verdict yet, so tonight's matches are shown without that evidence."
body = """
The names are what the screeners of this tab matched tonight. No setup has a verdict of works or promising for them, so nothing says these matches have beaten chance. The counts beside the section say how many setups were left out for want of a readable verdict, so a stale verdict never turns the list Unproven unseen. Premium is Unproven until an option setup passes its holdout. Don't treat an Unproven match as a tested idea: it is a screen result.
"""
next = "Open the setup behind a screener to see how much evidence it has so far."
see_also = ["idea_tab", "ideas_listed", "idea_left_out_no_verdict"]

[[term]]
id = "idea_setup_picked"
term = "Picked tonight"
short = "The setup took names tonight; they sit in its group, ranked by its own order."
body = """
Each setup takes names by its own rule at its own schedule, and only the screener its verdict rests on counts. The group shows how many it picked and how many made the cap of 15. A name picked by two setups is listed once, under the stronger one, with the other named as also in.
"""
next = "Open the setup to see its rules and how it has done."
see_also = ["ideas_listed", "verdict_basis", "picked_by"]

[[term]]
id = "idea_setup_nothing_picked"
term = "Nothing picked"
short = "It was a day this setup decides, and no name met its rule."
body = """
An empty group is a result, not a gap. The setup looked at the screener's matches and none passed its universe or its cut. The list stays a list: a quiet night does not turn it into Unproven.
"""
next = "Check the next decision day of the setup on its page."
see_also = ["edge_pick_not_a_decision_day", "ideas_listed"]

[[term]]
id = "idea_setup_unknown"
term = "Picks not known"
short = "The nightly pick step did not store this setup's picks for the session, so tonight's picks are unknown, not none."
body = """
The setup qualifies, but its picks for this session were not stored or could not be judged. The group says so rather than showing an empty list. Names it would have picked are missing from the list.
"""
next = "Come back after the next nightly run; the setup's page names the gap."
see_also = ["unavailable_not_stored", "not_run", "idea_setup_nothing_picked"]

[[term]]
id = "idea_left_out_newer_run"
term = "Only a newer run"
short = "The setup's only evidence was committed after this session, so it cannot be used for it."
body = """
A past session reads the verdict as it was known then. A run committed later is disclosed and not used, so an old list never borrows later knowledge. The count is setups, not names.
"""
next = "Open today's list to see the setup with its newer run."
see_also = ["ideas_unproven", "verdict"]

[[term]]
id = "idea_left_out_no_verdict"
term = "No readable verdict"
short = "The setup has a run but no stored verdict that matches its current document, so it is not listed."
body = """
The verdict is stored once a night. It is missing when the row was not written, when the setup's document or the judging rules changed since, or when the row cannot be read. The setup is left out instead of being judged on the spot. The count is setups, not names.
"""
next = "It returns to the list once the nightly step stores a matching verdict."
see_also = ["ideas_unproven", "verdict"]

[[term]]
id = "idea_left_out_no_basis"
term = "No basis recorded"
short = "The stored verdict does not say which screener it rests on, so the setup's picks cannot be told apart."
body = """
A verdict names the screener and holding period it was judged on. Older rows do not, and only that screener's names count as ideas. The setup is left out until a newer verdict records its basis. The count is setups, not names.
"""
next = "It returns after the next evaluation run stores the basis."
see_also = ["verdict_basis", "ideas_unproven"]

[[term]]
id = "idea_left_out_licence"
term = "Kept off by a licence"
short = "Some picks rest on data under a licence your account does not hold, so they are not listed and not ranked."
body = """
The count is of picks, never of which names. The list is renumbered without them, so no rank reveals a hidden pick. The setups and verdicts behind the list are the same for every viewer.
"""
next = "Nothing to do: the list shows everything your licences allow."
see_also = ["withheld_screener", "ideas_listed"]

[[term]]
id = "ideas_watchlist"
term = "Showing your watchlist"
short = "Ideas lists only the names on your watchlist; the line says how many of the list's ideas those are."
body = """
The list is built the same way for everyone first. The setups pick, one rule ranks the picks and the list stops at 15. Only then does your watchlist keep the names on it. A watched name ranked 16th or lower is not shown, and each name keeps the rank it has in the whole list. "Showing 3 of 15 ideas" means 3 of the 15 ideas under the cap are on your watchlist. The counts of what was left out never include a name your watchlist hides.

When no setup qualifies, the Unproven list of screener matches is filtered the same way. Each screener's first picks are ranked as usual, and only your watched names among them are listed.

An empty watchlist shows everything. The watchlist changes what you see, never a ranking, a verdict or a statistic.
"""
next = "Add or remove names in Settings, or with the Watch button on a name's page."
see_also = ["watchlist", "ideas_listed", "ideas_unproven"]

[[term]]
id = "idea_why"
term = "Why it is here"
short = "The setup's thesis and the screener criteria this name met tonight."
body = """
A setup picks names that share a measurable pattern. The thesis says what the pattern is and why it might pay. The criteria list shows each rule of the setup's screener, the value this name has and whether it passed. A near miss is marked as such. The text is the setup's own, the same for every name it picks, so read the criteria to see how this name differs from the next one. Don't read a pass as a forecast: the pattern held on average in the past, and any single name can still go the other way.
"""
see_also = ["idea_evidence", "idea_risks", "verdict", "near_miss"]

[[term]]
id = "idea_exit_rule"
term = "Historical exit rule"
short = "How the setup's past winners behaved: how far they dipped and how long they were held."
body = """
The stop distance is the drawdown that 80% of the setup's winning trades never went past, measured from the entry close. The other 20% went past it. The hold is the number of sessions the verdict was judged over. Both come from the setup's backtest, and a stop from fewer winning trades than a set minimum falls back to a multiple of the stock's recent average range. The page says which. The rule describes the past; it is not an instruction, and it knows nothing about the size you trade or your account. A setup that declares its own stop and take profit shows them as declared, with the stop and target as prices. Don't treat the stop as a limit on loss: a price can gap through it.
"""
next = "Copy the rule as text to keep it with your own notes."
see_also = ["idea_evidence", "idea_risks", "exit_stop_declared", "exit_prices", "exit_take_profit"]

[[term]]
id = "idea_evidence"
term = "Evidence behind the setup"
short = "The stored verdict the setup was listed on, with the figures it rests on, all backtested (hypothetical)."
body = """
The verdict is works or promising. The lift is how many points the setup's picks beat the base rate by on data held out from the search. The out-of-sample trades are how many trades that figure rests on. A lift on fewer than about 30 trades is noise. Every figure here is a backtest on past data, not a forecast and not a live record. The setup's own page holds the full evidence, including the curve and how sure the result is. Don't compare lifts of setups with different holds as if they were the same unit.
"""
see_also = ["verdict", "out_of_sample", "lift", "edge_how_sure", "base_rate", "live_record"]

[[term]]
id = "idea_risks"
term = "What could go wrong"
short = "Why the setup's edge should last, so what would end it, and the events inside the hold."
body = """
The first line is the setup's reason for persisting. If that reason stops being true, the pattern may stop paying. Below it come the name's own earnings reports that fall before the hold ends, because a report can move the price more than the pattern does. Watch-outs mark liquidity and other flags the screener raised. When an input is not stored, the section says so instead of showing an empty list. Don't read an empty list of events as a clear calendar.
"""
see_also = ["idea_exit_rule", "idea_evidence"]

[[term]]
id = "idea_learn"
term = "Learn this setup"
short = "The setup's own pages: its Guide entry, and its rules and track record."
body = """
Every idea comes from one setup, and the setup is where the evidence lives. Its Guide entry explains the mechanism in plain words and where it fails. Its page shows the rules, the history by year and regime, and how it has done since it was frozen. Read it once before relying on any pick from it.
"""
see_also = ["idea_evidence", "verdict", "setup_how_done"]

# The option grid (ADR 0083 amendment of 2026-11-01).
[[term]]
id = "option_grid"
term = "Option grid"
short = "The puts and calls of one stock at several strikes and expiry dates, each cell the figures of one sold option."
body = """
Each row is a delta from 0.10 to 0.30, the strike whose delta of ours is nearest it. Each column is an expiry about 7, 14, 30, 45, 60 or 90 days away, the nearest listed one. A cell shows the premium we compute as the middle of the stored bid and ask, never the bid or ask itself, and the figures that follow from it. A cell that says why it is empty (no listed expiry, too thin a quote, no strike near that delta) is not a zero. The prices are the last stored quotes of the session, end of day and delayed, so judge a trade on a live quote.
"""
next = "Pick the delta you are comfortable with, then read across the expiries."
see_also = ["delta_band", "return_on_collateral", "yield_a_year", "breakeven_price", "chance_below_strike", "spread_of_mid", "report_inside_expiry", "grid_strike", "grid_mid", "open_interest"]

[[term]]
id = "delta_band"
term = "Delta band"
short = "The delta a cell aims for: the strike whose own delta is nearest, within 0.025 of it."
body = """
Delta is our own, worked out from the option's mid premium with the Treasury rate and the dividend yield, not copied from the feed. A put's delta is negative and a call's positive, and the grid reads each by its size. A band with no strike within 0.025 of it stays empty rather than showing a strike far from it. A lower delta sits farther from the price, pays less and is less likely to be reached.
"""
see_also = ["option_grid", "chance_below_strike"]

[[term]]
id = "return_on_collateral"
term = "Return on collateral"
short = "The premium over what backs the position: a put's premium over its strike, a call's over the share price."
body = """
A cash-secured put sets aside the strike price to take the shares if they are assigned, so its premium is measured against that cash. A covered call is backed by the shares, so its premium is measured against the share price. It is a return for the whole period to the expiry, not a year.
"""
see_also = ["yield_a_year"]

[[term]]
id = "yield_a_year"
term = "Yield a year"
short = "The return on collateral scaled to a year: that return times 365, over the days to the expiry."
body = """
It is simple, not compounded, and it assumes the same trade could be repeated at the same price for a year. That is rarely true, so use it to compare cells, not as a forecast. Short expiries and wide spreads inflate it. A high yield is usually a high implied volatility paying for a real risk.
"""
see_also = ["return_on_collateral", "spread_of_mid"]

[[term]]
id = "breakeven_price"
term = "Breakeven"
short = "The price the stock can fall to at the expiry before the sold option loses money."
body = """
For a put it is the strike minus the premium. For a covered call it is the share price now minus the premium. It ignores commissions and early assignment, and it describes the expiry, not a stop.
"""
see_also = ["return_on_collateral"]

[[term]]
id = "chance_below_strike"
term = "Chance below the strike"
short = "The model's chance that the stock ends below the strike at the expiry."
body = """
It comes from the option's implied volatility with no drift and no interest, the same convention the setups use. It is a model number, not a forecast, and it is only as good as the volatility the market priced in. The volatility we solve uses the Treasury rate and the dividend yield, so the two differ by about one percentage point at 30 days.
"""
see_also = ["delta_band", "option_grid"]

[[term]]
id = "spread_of_mid"
term = "Spread of mid"
short = "The gap between the stored bid and ask as a share of the middle price."
body = """
A wide spread means the premium shown is less reachable: filling at the middle is unlikely and the real price is nearer the worse side. It is measured on the stored end-of-day quote, so a live quote can differ.
"""
see_also = ["option_grid", "yield_a_year"]

[[term]]
id = "report_inside_expiry"
term = "Report inside"
short = "Whether the company's next earnings report falls after today and on or before the expiry."
body = """
An earnings report inside the life of the option can move the stock past the strike, so the premium may be paying for it. When the report date is not known the column says so rather than showing no report. An ETF has no earnings report, so the question does not apply to it.
"""
see_also = ["option_grid"]

[[term]]
id = "grid_strike"
term = "Strike"
short = "The price the shares change hands at if the sold option is assigned."
body = """
The grid shows, for each delta band and expiry, the listed strike whose delta of ours is nearest the band. A strike farther below the share price (for a put) pays less and is less likely to be reached. Strikes come from the stored chain, so a strike that was not listed that day cannot appear.
"""
next = "Compare it with the breakeven, which also counts the premium."
see_also = ["option_grid", "delta_band", "breakeven_price"]

[[term]]
id = "grid_mid"
term = "Our mid"
short = "The premium we compute as the middle of the stored bid and ask, per share."
body = """
It is a calculation from the end-of-day quote, not a price you can be filled at: real fills are usually worse, by about half the spread. The grid never shows the bid or the ask itself. Multiply by 100 for the premium of one contract.
"""
next = "Judge a trade on a live quote before acting."
see_also = ["option_grid", "spread_of_mid"]

[[term]]
id = "open_interest"
term = "Open interest"
short = "The number of contracts of this option that are still open at the end of the day."
body = """
A higher number means more people hold the contract and it is easier to trade near the middle price. A small number means a thin market and a wider real spread. When the feed did not send it for that contract the cell says unknown, which is not zero.
"""
next = "Treat a thin contract with care even when its yield looks high."
see_also = ["option_grid", "spread_of_mid"]

[[term]]
id = "idea_plan"
term = "The plan"
short = "The position the setup's rule would open on tonight's option chain, with its exits and the most it can lose."
body = """
An option setup is a rule: which contracts to open, how long to hold, when to close. This panel applies that rule to tonight's end-of-day chain for this name, so you see one worked example per contract. Every figure is derived from mid prices, not from quotes you could trade at.
Monday's chain will differ. The rule picks again then, so the strike, the premium and every figure below can move. The panel is an example of the rule, not an order, and it knows nothing about your account.
Don't read the example as a price you will get.
"""
next = "Open the setup to see how the rule did in the past."
see_also = ["idea_example_position", "idea_most_you_can_lose", "risk_statement"]

[[term]]
id = "idea_example_position"
term = "Example position"
short = "The contracts the setup's rule picks from tonight's chain, each at its mid price; the premium is what the position collects."
body = """
Each row is one contract: short or long, the right (put or call), the strike, the expiry and the mid price, halfway between the bid and the ask. Premium collected is the net of the rows, per share, so a short put at $0.71 collects $0.71 a share, $71 a contract.
Worked example: "Short 1 put, 55, Fri 27 Nov, $0.71 mid" is one contract that obliges its writer to take 100 shares at 55 if the stock ends below it.
The mid is a convention. A real fill is usually worse than the mid, and a wide gap between bid and ask makes the example optimistic.
"""
next = "Check the cash set aside and the most you can lose below it."
see_also = ["idea_cash_set_aside", "idea_plan", "return_on_collateral"]

[[term]]
id = "idea_cash_set_aside"
term = "Cash set aside"
short = "The cash that backs one contract of the example if you hold it to the end, per the setup's collateral rule."
body = """
For a short put the setup sets aside the strike times 100 shares: a 55 strike sets aside $5,500 a contract. For a covered call it is the shares you already hold. The figure is the position's own backing, not what your broker asks for, which can be smaller.
Return on collateral, the setup's lead number, divides the profit by this cash. It is not a return on the premium.
Don't take it as your available cash. The site knows no account.
"""
next = "Compare it with the most you can lose."
see_also = ["return_on_collateral", "idea_most_you_can_lose", "not_a_return"]

[[term]]
id = "idea_option_exits"
term = "Declared exits"
short = "The exits the setup's rule declares, as dollar marks on this example: the profit to close at, the stop and the last day."
body = """
Some setups close early: at a share of the premium kept, at a loss multiple of the premium, or a set number of days before expiry. This page turns each declared exit into a price on the example's premium. Take profit at half the premium on a $0.71 credit closes at $0.36.
A setup that declares no stop shows the loss its history stopped at, per contract, or says it has none. The last day held is the earlier of the expiry and the hold the verdict was judged over.
Prices can gap through a stop. The exits describe the rule, not an order.
"""
next = "Open the setup to see the exits' evidence."
see_also = ["idea_exit_rule", "idea_plan", "exit_take_profit"]

[[term]]
id = "idea_chance_in_the_money"
term = "Chance of ending in the money"
short = "The chance, from today's option prices, that the stock finishes past the strike; not a backtested figure."
body = """
It comes from the option's own implied volatility with no drift: the market's price of the outcome, not a forecast. For a short put it is the chance the stock ends below the strike, which is when you would be assigned the shares. About 1 in 5 reads as 20%.
It is a pricing figure, so it is not backtested and it moves every day with volatility. Options priced for a quiet stock overstate nothing and understate nothing until the stock moves.
Don't treat a low chance as safety: the loss when it happens is the most you can lose.
"""
next = "Read it beside the most you can lose."
see_also = ["idea_most_you_can_lose", "idea_one_sigma_loss"]

[[term]]
id = "idea_most_you_can_lose"
term = "Most you can lose"
short = "The worst result of one contract held to expiry: the cash at risk less the premium collected, or no limit."
body = """
It is the lowest value of the position at expiry over every price the stock could finish at, from zero up, after the premium. A short put at 55 that collected $0.71 can lose (55 - 0.71) x 100 = $5,429. A spread is capped at its width less the credit. A covered call loses the share cost less the premium.
A short call with no shares behind it has no limit, and the page says so.
It ignores fees and early assignment, and an exit rule can cut the loss earlier. It does not ignore a gap: the price can fall below any stop.
"""
next = "Compare it with the cash set aside."
see_also = ["idea_cash_set_aside", "idea_option_exits"]

[[term]]
id = "idea_monday_floor"
term = "Monday premium floor"
short = "The lowest premium at which the setup's rule would still apply on Monday; not stored for any setup yet."
body = """
The rule picks its contract again on Monday's chain, and the premium may differ from this example. A floor would say how much less you could collect before the setup's rule no longer holds.
No setup declares a minimum premium yet. No verdict stores a typical trade to derive one from either, so the page says it is not applicable rather than inventing a number.
When a setup declares a minimum credit, the floor appears here as a dollar figure.
"""
next = "Re-check the premium against Monday's chain before you act."
see_also = ["idea_plan", "idea_example_position"]

[[term]]
id = "idea_position_risks"
term = "The position's risks"
short = "What the example position does day to day and around its dates: theta, a one-sigma day, reports and ex-dividend."
body = """
These are derived from the example's own option prices. Theta is the position's value change from one day passing, in dollars; for a short position it is positive, because time works for the seller. A one-sigma day is the loss if the stock moves by a day's implied move against you at once.
The flags say whether the name reports earnings, or goes ex-dividend, between the entry and the expiry. A report or an ex-dividend date inside the trade can move the stock or trigger early assignment.
A figure the chain could not supply says why instead of showing zero.
"""
next = "Read each figure's own entry."
see_also = ["idea_example_position", "idea_theta_day", "idea_one_sigma_loss", "idea_report_in_life", "idea_ex_dividend"]

[[term]]
id = "idea_theta_day"
term = "Theta, a day"
short = "Dollars the example position gains or loses from one day passing, all else equal."
body = """
Theta is the feed's own figure for each contract, per share a day, times the contract's 100 shares and its direction. A short put with theta -0.02 a share earns +$2 a day for the seller. The figure grows near expiry and ignores moves in the stock.
It is a rate at tonight's prices, not a promise: a fall in the stock outweighs weeks of theta.
"""
next = "Read it with the one-sigma day loss."
see_also = ["idea_one_sigma_loss", "idea_position_risks", "idea_example_position"]

[[term]]
id = "idea_one_sigma_loss"
term = "A one-sigma day"
short = "The loss, in dollars, if the stock makes a typical day's implied move against the position."
body = """
A day's implied move is the implied volatility over the square root of 252 trading days, of the leg nearest the money, times the price. The page reprices every leg at that move, up and down, and shows the worse one. At 40% volatility a $60 stock moves about $1.51.
One sigma is a typical day, not a bad one. Roughly one day in three is bigger than this, and a gap can be many times it.
"""
next = "Compare it with the most you can lose."
see_also = ["idea_theta_day", "idea_most_you_can_lose", "idea_position_risks"]

[[term]]
id = "idea_report_in_life"
term = "Reports before expiry"
short = "Whether the name reports earnings between the entry and the expiry; the report date when it does."
body = """
Options carry a premium for earnings, and the stock often moves on the report. A Yes means the position is held through a report; a setup that skips reports would not have listed the name. The date is the company's expected or confirmed one, as known tonight.
Not known means the report date is not stored for the name.
"""
next = "Open the name in Explore for its calendar."
see_also = ["idea_position_risks", "idea_risks"]

[[term]]
id = "idea_ex_dividend"
term = "Ex-dividend in the trade"
short = "Whether the name's next ex-dividend date falls between the entry and the expiry; early assignment risk for sold calls."
body = """
A stock trades without its next dividend from the ex-dividend date on. A sold call that is in the money the day before that date can be assigned early, so the holder gets the dividend. A Yes shows the date. A put is rarely affected.
The date comes from the stored dividend schedule as known tonight; a name that has none stored shows Not known, not No.
"""
next = "Check the date against the expiry on the plan."
see_also = ["idea_position_risks"]
