# L3 site setting: the Guide's playbook for the site preset cef_discount_zscore (ADR 0051; docs/ui/guide.md
# "The playbook page"). The prose its page shows beside the preset's latest version (a preset
# version is immutable, its prose is not); the family is config/site/guide/sections.toml's.
# Keys: summary (the hero), hit (what a hit looks like), not_checked, before_acting (caveats,
# naming catalogue fields so the server links them), related (other playbooks), sources, and
# [asks]: each criterion of the latest preset version in a few plain words. Typed by
# src/algotrade/config/site/guide/playbooks.py; fitness tests in
# tests/unit/config/site/guide/test_playbooks.py.
id = "cef_discount_zscore"
version = 1  # the preset version this prose was written for
summary = "Ranks closed-end funds by how wide their discount to net asset value is against the fund's own past year, the widest first. Their prices follow sentiment, not the value of the assets, and a wide discount tends to narrow. A candidate edge under test."
hit = "The name is an active closed-end fund closing above $3 that trades at least $500k a day, with a recent net asset value and a year of discounts. The most negative discount z-score, the widest against its own year, ranks first."
not_checked = "It does not check whether the discount is fair (fees, borrowing and a high payout all widen it), the fund's category, or whether the payout is covered by what the fund earns."
before_acting = [
  "A fund that is always at a wide discount is not cheap against itself: read rollup.cef_nav@v1.cef_discount_to_nav beside rollup.cef_nav@v1.cef_discount_zscore, which shows the level and the move.",
  "The net asset value is the issuer's own, struck after the close and known from the next session, so the discount is one session old. A value older than five sessions is left empty, never carried forward.",
  "Bond and municipal funds carry rate and credit exposure, and a leveraged fund's discount moves with it. History before 2026-10-02 holds only funds that still exist, which flatters a discount strategy.",
]
sources = [
  "Lee, Shleifer and Thaler, Investor Sentiment and the Closed-End Fund Puzzle (1991)",
  "Patro, Piccotti and Wu, Exploiting Closed-End Fund Discounts: A Systematic Examination of Alphas (2017)",
]
related = [
  { id = "bdc_price_to_nav", reason = "the same discount idea for business development companies" },
]

[asks]
security_type = "A closed-end fund"
status = "Still listed and trading"
price = "Closes above $3"
adv = "Trades at least $500k a day"
discount_zscore = "Has a recent net asset value and a year of discounts to compare with"
