# L3 site setting: the Guide's playbook for the site preset target_upside_high (ADR 0051; docs/ui/guide.md
# "The playbook page"). The prose its page shows beside the preset's latest version (a preset
# version is immutable, its prose is not); the family is config/site/guide/sections.toml's.
# Typed by src/algotrade/config/site/guide/playbooks.py; fitness tests in
# tests/unit/config/site/guide/test_playbooks.py.
id = "target_upside_high"
version = 1  # the preset version this prose was written for
summary = "Ranks stocks by how far the analysts' average price target sits above the close, the highest first. Da and Schaumburg find the highest implied return does best. It is a candidate edge under test."
hit = "The name is a common stock closing above $5 that trades at least $5M a day, with an analyst consensus target. The highest upside to the average target ranks first."
not_checked = "It does not check the date of the target, how many analysts set it or the industry: the paper compares within an industry and this is the raw figure. The free data covers few names."
before_acting = [
  "Analysts are optimistic: a high upside is common in some sectors, so compare feature.target_upside with the sector's usual figure.",
  "A target has no date of its own: read rollup.analyst_targets@v1.targets_age_days before trusting an old one.",
  "Beaten-down names show the highest upside, so the list is partly a bet on value and reversal. The data is for personal use under its licence.",
]
sources = [
  "Da and Schaumburg, Relative Valuation and Analyst Target Price Forecasts (2011)",
  "Brav and Lehavy, An Empirical Analysis of Analysts' Target Prices (2003)",
]
related = [
  { id = "eps_revision_up", reason = "the estimate revision instead of the price target" },
  { id = "composite_value", reason = "a value ranking that overlaps with beaten-down names" },
]

[asks]
security_type = "A common stock"
status = "Still listed and trading"
price = "Closes above $5"
adv = "Trades at least $5M a day"
upside = "Has an analyst consensus price target"
