# L3 site setting: the Guide's playbook for the site preset bdc_price_to_nav (ADR 0051; docs/ui/guide.md
# "The playbook page"). The prose its page shows beside the preset's latest version (a preset
# version is immutable, its prose is not); the family is config/site/guide/sections.toml's.
# Keys: summary (the hero), hit (what a hit looks like), not_checked, before_acting (caveats,
# naming catalogue fields so the server links them), related (other playbooks), sources, and
# [asks]: each criterion of the latest preset version in a few plain words. Typed by
# src/algotrade/config/site/guide/playbooks.py; fitness tests in
# tests/unit/config/site/guide/test_playbooks.py.
id = "bdc_price_to_nav"
version = 1  # the preset version this prose was written for
summary = "Ranks the listed business development companies (BDCs) by price to net asset value, the deepest discount first. BDC prices drift away from a net asset value that is published only quarterly, and the discount tends to narrow. A candidate edge under test."
hit = "The name is on the hand list of listed BDCs, an active common stock that trades at least $1M a day, with a positive price to book. The lowest price to book, the deepest discount to the last reported net assets, ranks first."
not_checked = "It does not check whether the net asset value is falling (a deep discount is often a credit loss in progress), the dividend and its coverage, or the interest-rate exposure of floating-rate loans. The net asset value is the latest quarterly report, up to four months old."
before_acting = [
  "The discount is against the last reported net assets: feature.pb_ratio can look cheap because the value is stale, so check when the latest report was filed before acting.",
  "A discount that keeps widening usually follows rising non-accruals; a shrinking book (rollup.balance_sheet@v2.stockholders_equity compared with a quarter ago) says the discount is earned.",
  "The list is keyed by instrument id and survivor-only: a BDC merged away before the list was made is missing, and a newly listed one is missing until it is added. The book value is the balance sheet (at most 135 days old here) while the share count is the newest cover page, so the ratio mixes two dates.",
]
sources = [
  "Pontiff, Closed-End Fund Premia and Returns: Implications for Financial Market Equilibrium (1995)",
  "Patro, Piccotti and Wu, Exploiting Closed-End Fund Discounts: A Systematic Examination of Alphas (2017)",
]
related = [
  { id = "qmj", reason = "a quality screen to read beside a deep discount" },
]

[asks]
security_type = "A common stock"
status = "Still listed and trading"
bdc = "On the list of listed BDCs"
nav_fresh = "Its latest balance sheet is at most about 135 days old"
adv = "Trades at least $1M a day"
price_to_nav = "Trades below or near its book value per share"
