# L3 site setting: the Guide's playbook for the site preset option_stock_volume (ADR 0051; docs/ui/guide.md
# "The playbook page"). The prose its page shows beside the preset's latest version (a preset
# version is immutable, its prose is not); the family is config/site/guide/sections.toml's.
# Keys: summary (the hero), hit (what a hit looks like), not_checked, before_acting (caveats,
# naming catalogue fields so the server links them), related (other playbooks), sources, and
# [asks]: each criterion of the latest preset version in a few plain words. Typed by
# src/algotrade/config/site/guide/playbooks.py; fitness tests in
# tests/unit/config/site/guide/test_playbooks.py.
id = "option_stock_volume"
version = 1  # the preset version this prose was written for
summary = "Ranks every liquid optionable stock by the option-to-stock volume ratio, the share volume its options control over the shares traded, lowest first. The literature finds a high ratio, bad news traded in options, followed by lower stock returns."
hit = "The name is a listed stock closing above $5 that trades at least $50M a day and has option and stock volume for the session. Every such name qualifies; the lowest ratio ranks first, the highest last."
not_checked = "It does not know whether option trades open or close positions, who is buying, or whether volume is a hedge. Johnson and So found the effect mostly in the high-ratio names."
before_acting = [
  "Chain volume is stored from 2026-10-02 only, so there is no earlier history.",
  "A ratio spikes before earnings and around expirations for reasons that carry no signal; read the report date.",
  "A name whose options carry no volume that day reads null, not zero.",
]
sources = [
  "Johnson and So, The Option to Stock Volume Ratio and Future Returns (2012)",
  "Ge, Lin and Pearson, Why Does the Option to Stock Volume Ratio Predict Stock Returns? (2016)",
]
related = [
  { id = "retail_option_attention", reason = "the same ratio among lottery-like names" },
]

[asks]
security_type = "A common stock or ADR"
status = "Still listed and trading"
price = "Closes above $5"
adv = "Trades at least $50M a day"
option_stock_volume_ratio = "Has an option-to-stock volume ratio"
