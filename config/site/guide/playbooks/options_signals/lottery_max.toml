# L3 site setting: the Guide's playbook for the site preset lottery_max (ADR 0051; docs/ui/guide.md
# "The playbook page"). The prose its page shows beside the preset's latest version (a preset
# version is immutable, its prose is not); the family is config/site/guide/sections.toml's.
# Keys: summary (the hero), hit (what a hit looks like), not_checked, before_acting (caveats,
# naming catalogue fields so the server links them), related (other playbooks), sources, and
# [asks]: each criterion of the latest preset version in a few plain words. Typed by
# src/algotrade/config/site/guide/playbooks.py; fitness tests in
# tests/unit/config/site/guide/test_playbooks.py.
id = "lottery_max"
version = 1  # the preset version this prose was written for
summary = "Ranks every liquid stock by its best one-day return of the last 21 sessions, the lottery measure of the finance literature, with the most lottery-like names last. Retail demand for skewness is thought to overprice them, so they are an avoid list."
hit = "The name is a listed stock closing above $5 that trades at least $50M a day and has a best one-day return for the last 21 sessions. Every such name qualifies; the largest best day ranks last, as the one to avoid."
not_checked = "It does not read option skew, which is what Boyer and Vorkink sort on, nor idiosyncratic volatility. A one-day jump on a takeover bid looks the same as lottery demand."
before_acting = [
  "The effect is concentrated in small names; in liquid large stocks it is weaker, which is why this screen keeps the $50M floor.",
  "A best day on an earnings report or a bid is news, not a lottery: check rollup.earnings@v1.last_earnings_date.",
  "Writing calls on such a name is the dangerous side of the trade; the edge only tests the stock's own return.",
]
sources = [
  "Bali, Cakici and Whitelaw, Maxing Out: Stocks as Lotteries and the Cross-Section of Expected Returns (2011)",
  "Boyer and Vorkink, Stock Options as Lotteries (2014)",
]
related = [
  { id = "retail_option_attention", reason = "the same lottery names ranked by option volume" },
]

[asks]
security_type = "A common stock or ADR"
status = "Still listed and trading"
price = "Closes above $5"
adv = "Trades at least $50M a day"
max_ret_21d = "Has a best one-day return for the last 21 sessions"
