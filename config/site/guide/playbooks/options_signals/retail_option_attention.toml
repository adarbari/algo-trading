# L3 site setting: the Guide's playbook for the site preset retail_option_attention (ADR 0051; docs/ui/guide.md
# "The playbook page"). The prose its page shows beside the preset's latest version (a preset
# version is immutable, its prose is not); the family is config/site/guide/sections.toml's.
# Keys: summary (the hero), hit (what a hit looks like), not_checked, before_acting (caveats,
# naming catalogue fields so the server links them), related (other playbooks), sources, and
# [asks]: each criterion of the latest preset version in a few plain words. Typed by
# src/algotrade/config/site/guide/playbooks.py; fitness tests in
# tests/unit/config/site/guide/test_playbooks.py.
id = "retail_option_attention"
version = 1  # the preset version this prose was written for
summary = "Finds lottery-like stocks, with a best day of 10% or more last month, and ranks them by how heavy their option volume is against their share volume. Retail traders buy short-dated out-of-the-money calls in such names, and the literature finds the stock and the calls lose afterwards."
hit = "The name is a listed stock closing above $5 that trades at least $50M a day, had a one-day gain of 10% or more in the last 21 sessions, and has an option-to-stock volume ratio. The edge ranks the highest ratio as the one to avoid."
not_checked = "It does not see strikes, expiries or who traded: the share of option volume in short-dated out-of-the-money calls is not stored, so the volume ratio stands in for it. The 10% gate is a declared assumption."
before_acting = [
  "Chain volume is stored from 2026-10-02 only, so the history is short.",
  "A name with a big day on a takeover or earnings report is not lottery demand: check the report date.",
  "Shorting such names is costly and squeeze-prone; the edge uses the ranking as an avoid list.",
]
sources = [
  "Bryzgalova, Pavlova and Sikorskaya, Retail Trading in Options and the Rise of the Big Three Wholesalers (2023)",
  "Byun and Kim, Gambling Preference and Individual Equity Option Returns (2016)",
]
related = [
  { id = "option_stock_volume", reason = "the ratio over all names" },
  { id = "lottery_max", reason = "the best-day ranking alone" },
]

[asks]
security_type = "A common stock or ADR"
status = "Still listed and trading"
price = "Closes above $5"
adv = "Trades at least $50M a day"
max_ret_21d = "Had a best day of +10% or more in the last 21 sessions"
option_stock_volume_ratio = "Has an option-to-stock volume ratio"
