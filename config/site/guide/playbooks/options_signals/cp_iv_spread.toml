# L3 site setting: the Guide's playbook for the site preset cp_iv_spread (ADR 0051; docs/ui/guide.md
# "The playbook page"). The prose its page shows beside the preset's latest version (a preset
# version is immutable, its prose is not); the family is config/site/guide/sections.toml's.
# Keys: summary (the hero), hit (what a hit looks like), not_checked, before_acting (caveats,
# naming catalogue fields so the server links them), related (other playbooks), sources, and
# [asks]: each criterion of the latest preset version in a few plain words. Typed by
# src/algotrade/config/site/guide/playbooks.py; fitness tests in
# tests/unit/config/site/guide/test_playbooks.py.
id = "cp_iv_spread"
version = 1  # the preset version this prose was written for
summary = "Ranks every liquid optionable stock by how much richer its calls are than its same-strike puts, the call-put implied volatility spread of the option literature. It is a ranking: the top of the list is where option traders are paying most for upside."
hit = "The name is a listed stock closing above $5 that trades at least $50M a day and has a call-put IV spread from our own chain data. Every such name qualifies; the order is the point, the largest positive spread first."
not_checked = "It does not check how liquid the option quotes are, whether an earnings report falls inside the expiry, or the borrow cost that can explain a spread. It is the screen of the option_cp_iv_signals edge, which the harness is still testing."
before_acting = [
  "The spread comes from chains stored since 2026-10-02 only: rollup.cp_iv@v1.cp_iv_status says which step failed when a name has no value.",
  "A spread near an earnings date often reflects the report, not information: compare rollup.cp_iv@v1.cp_iv_dte with the report date.",
  "Hard-to-borrow names show rich calls and cheap puts for borrow reasons alone; the value cannot tell the two apart.",
]
sources = [
  "Cremers and Weinbaum, Deviations from Put-Call Parity and Stock Return Predictability (2010)",
  "Bali and Hovakimian, Volatility Spreads and Expected Stock Returns (2009)",
]
related = [
  { id = "iv_smirk", reason = "the put-wing signal of the same family" },
  { id = "iv_change_call", reason = "the change in call IV rather than the level" },
]

[asks]
security_type = "A common stock or ADR"
status = "Still listed and trading"
price = "Closes above $5"
adv = "Trades at least $50M a day"
cp_iv_spread = "Has a call-put IV spread"
