# L3 site setting: the Guide's playbook for the site preset earnings_date_early (ADR 0051; docs/ui/guide.md
# "The playbook page"). The prose its page shows beside the preset's latest version (a preset
# version is immutable, its prose is not); the family is config/site/guide/sections.toml's.
# Keys: summary (the hero), hit (what a hit looks like), not_checked, before_acting (caveats,
# naming catalogue fields so the server links them), related (other playbooks), sources, and
# [asks]: each criterion of the latest preset version in a few plain words. Typed by
# src/algotrade/config/site/guide/playbooks.py; fitness tests in
# tests/unit/config/site/guide/test_playbooks.py.
id = "earnings_date_early"
version = 1  # the preset version this prose was written for
summary = "Finds liquid stocks whose next earnings report is scheduled a week or more earlier than last year, the largest advance first: the finding that managers schedule good news early and the market reads the date as a calendar item. It is a candidate edge under test, not a proven trade."
hit = "The name is a common stock closing above $5 that trades at least $5M a day, and the calendar now lists its next report at least seven days before last year's report plus 52 weeks. The biggest advance ranks first."
not_checked = "It does not know that the date is confirmed (the calendar only schedules), why it moved (a fiscal-year change or a merger looks the same), or how fresh the shift is. It is the screen of the earnings-date advance edge, which the harness is still testing."
before_acting = [
  "The shift needs a report from a year ago to compare with: rollup.earnings_date_shift@v1.earnings_shift_direction is empty for a new listing, and rollup.earnings_date_shift@v1.sessions_since_earnings_shift says how fresh the shift is.",
  "A date can move again before the report: the Nasdaq calendar never confirms one, so check rollup.earnings_expected@v1.expected_basis before relying on the day.",
  "The study measured the month after the date became known; the report itself can fall later, so the position may be closed before it.",
]
sources = [
  "Johnson and So, Time Will Tell: Information in the Timing of Scheduled Earnings News (2018)",
]
related = [
  { id = "pre_earnings_runup", reason = "another event play on the earnings calendar" },
  { id = "size_small", reason = "the size baseline the edge is compared with" },
]

[asks]
security_type = "A common stock"
status = "Still listed and trading"
price = "Closes above $5"
adv = "Trades at least $5M a day"
shift_direction = "The next report is scheduled earlier than last year's"
