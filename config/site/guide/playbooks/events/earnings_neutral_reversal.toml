# L3 site setting: the Guide's playbook for the site preset earnings_neutral_reversal (ADR 0051; docs/ui/guide.md
# "The playbook page"). The prose its page shows beside the preset's latest version (a preset
# version is immutable, its prose is not); the family is config/site/guide/sections.toml's.
# Keys: summary (the hero), hit (what a hit looks like), not_checked, before_acting (caveats,
# naming catalogue fields so the server links them), related (other playbooks), sources, and
# [asks]: each criterion of the latest preset version in a few plain words. Typed by
# src/algotrade/config/site/guide/playbooks.py; fitness tests in
# tests/unit/config/site/guide/test_playbooks.py.
id = "earnings_neutral_reversal"
version = 1  # the preset version this prose was written for
summary = "Ranks liquid stocks by their return over the last 20 sessions leaving out the days an earnings report moved the price, the biggest losers first. It isolates the month's move that earnings did not make."
hit = "The name is a listed stock closing above $5 that trades at least $50M a day with a 20-session return known to exclude earnings days. Every such name qualifies; the lowest return ranks first."
not_checked = "It does not read 8-K news or press: only earnings reaction windows are left out. It is unknown for a name with no earnings report on file."
before_acting = [
  "A fall on a filing, not an earnings report, still counts: pair it with rollup.filing_activity@v1.filing_count_5d.",
  "A name whose last report was long ago drops no days: rollup.earnings_neutral_reversal@v1.earnings_days_excluded is 0 then.",
]
sources = [
  "So and Wang, News-Driven Return Reversals: Liquidity Provision Ahead of Earnings Announcements (2014)",
]
related = [
  { id = "pre_earnings_reversal", reason = "the 3-session return into a report" },
]

[asks]
security_type = "A common stock or ADR"
status = "Still listed and trading"
price = "Closes above $5"
adv = "Trades at least $50M a day"
ret_ex_earnings_20d = "Has a 20-session return without earnings reaction days"
