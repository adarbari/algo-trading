# L3 site setting: the Guide's playbook for the site preset residual_reversal (ADR 0051; docs/ui/guide.md
# "The playbook page"). The prose its page shows beside the preset's latest version (a preset
# version is immutable, its prose is not); the family is config/site/guide/sections.toml's.
# Typed by src/algotrade/config/site/guide/playbooks.py; fitness tests in
# tests/unit/config/site/guide/test_playbooks.py.
id = "residual_reversal"
version = 1  # the preset version this prose was written for
summary = "Ranks every tradeable name by last month's return net of the market, the biggest losers first. Blitz and co-authors find the residual loser beats the residual winner next month: liquidity providers are paid to take the other side. It is a candidate edge under test."
hit = "The name is a listed stock, ADR or ETF closing above $5 that trades at least $50M a day, with a market-residual 20-session return. Every such name qualifies; the lowest residual comes first."
not_checked = "It does not exclude names that moved on news (an earnings reaction drifts, it does not reverse), nor strip size and value (the paper's residual). The harness measures whether the order pays after costs."
before_acting = [
  "The raw one-month reversal has faded since the 1990s and is worth little after costs; the claim is only for the residual in liquid names. Read the harness's net numbers, not the gross ones.",
  "A big loser may be a name with bad news: check rollup.momentum_variants@v1.resid_ret_20d against the earnings calendar before buying the dip.",
]
sources = [
  "Blitz, Huij, Lansdorp and Verbeek, Short-Term Residual Reversal (2013)",
]
related = [
  { id = "sector_reversal", reason = "the same idea against the sector instead of the market" },
]

[asks]
security_type = "A common stock, ADR or ETF"
status = "Still listed and trading"
price = "Closes above $5"
adv = "Trades at least $50M a day"
resid_ret_20d = "Has a market-residual 20-session return"
