# L3 site setting: the Guide's playbook for the site preset news_free_residual_reversal (ADR 0051; docs/ui/guide.md
# "The playbook page"). The prose its page shows beside the preset's latest version (a preset
# version is immutable, its prose is not); the family is config/site/guide/sections.toml's.
# Typed by src/algotrade/config/site/guide/playbooks.py; fitness tests in
# tests/unit/config/site/guide/test_playbooks.py.
id = "news_free_residual_reversal"
version = 1  # the preset version this prose was written for
summary = "Ranks stocks that fell against the market over the month with no 8-K or earnings report in the last 5 sessions, the biggest loser first. A fall with no filing is a pressure that tends to reverse. It is a candidate edge under test."
hit = "The name is a common stock or ADR closing above $5 that trades at least $50M a day, with a market-residual 20-session return and no 8-K filing or earnings window in the last 5 sessions. The lowest residual comes first."
not_checked = "It does not see news that is not an 8-K: a press story, an analyst note or a rumour. It does not check news older than 5 sessions inside the 20-session window, or strip size and value."
before_acting = [
  "A name with no filing can still have news: check feature.news_free_5d is true and read the headlines before acting on a drop.",
  "The news test needs the filings history; where feature.news_free_5d is unknown the name does not qualify, so early sessions show nothing.",
  "The reversal has shrunk since the 1990s and the cost of trading monthly is large; read the harness's net numbers, not the gross ones.",
]
sources = [
  "Chan, Stock Price Reaction to News and No-News (2003)",
  "Blitz, Huij, Lansdorp and Verbeek, Short-Term Residual Reversal (2013)",
]
related = [
  { id = "residual_reversal", reason = "the same ranking without the news test" },
  { id = "volume_shock_no_news", reason = "another list that asks for no news" },
]

[asks]
security_type = "A common stock or ADR"
status = "Still listed and trading"
price = "Closes above $5"
adv = "Trades at least $50M a day"
resid_ret_20d = "Has a market-residual 20-session return"
news_free = "No 8-K filing or earnings window in the last 5 sessions"
