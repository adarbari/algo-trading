# L3 site setting: the Guide's playbook for the site preset insider_cluster_buys (ADR 0051; docs/ui/guide.md
# "The playbook page"). The prose its page shows beside the preset's latest version (a preset
# version is immutable, its prose is not); the family is config/site/guide/sections.toml's.
# Keys as in tender_offer_filed.toml; typed by src/algotrade/config/site/guide/playbooks.py.
id = "insider_cluster_buys"
version = 1  # the preset version this prose was written for
summary = "Finds liquid stocks where three or more insiders bought shares on the open market in the last 30 days and a buyer trades at irregular times. It is a candidate edge under test, not a proven trade."
hit = "The name is a common stock closing above $5 that trades at least $1M a day, with at least three different insiders buying in the last 30 days (counted from the session each filing became public). The most buyers rank first."
not_checked = "It does not read the size of the purchases, whether the buyers are officers or directors, or why they bought. A purchase made under a pre-arranged plan is not screened out: its column rollup.insider_buys@v1.plan_10b5_1_flag shows it."
before_acting = [
  "Insiders often buy after a price fall, so the name may simply be cheap: read rollup.trend_stats@v2.mom_12_1 beside it.",
  "A filing accepted after the close counts from the next session, and the trade itself is up to two business days older than the filing.",
  "A buyer without a trade in each of the last three years cannot be called routine or not: rollup.insider_buys@v1.insider_opportunistic_flag is then empty and the name drops out.",
]
sources = [
  "Cohen, Malloy and Pomorski, Decoding Inside Information (2012)",
  "Lakonishok and Lee, Are Insider Trades Informative? (2001)",
]
related = [
  { id = "size_small", reason = "the size baseline the edge is compared with" },
  { id = "tender_offer_filed", reason = "another filing-driven long idea" },
]

[asks]
security_type = "A common stock"
status = "Still listed and trading"
price = "Closes above $5"
adv = "Trades at least $1M a day"
cluster = "Three or more insiders bought in the last 30 days"
opportunistic = "A buyer trades at irregular times, not in the same month every year"
