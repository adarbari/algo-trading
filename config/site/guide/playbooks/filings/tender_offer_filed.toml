# L3 site setting: the Guide's playbook for the site preset tender_offer_filed (ADR 0051; docs/ui/guide.md
# "The playbook page"). The prose its page shows beside the preset's latest version (a preset
# version is immutable, its prose is not); the family is config/site/guide/sections.toml's.
# Keys: summary (the hero), hit (what a hit looks like), not_checked, before_acting (caveats,
# naming catalogue fields so the server links them), related (other playbooks), sources, and
# [asks]: each criterion of the latest preset version in a few plain words. Typed by
# src/algotrade/config/site/guide/playbooks.py; fitness tests in
# tests/unit/config/site/guide/test_playbooks.py.
id = "tender_offer_filed"
version = 1  # the preset version this prose was written for
summary = "Finds liquid stocks with a tender offer (the company's own SC TO-I or a third party's SC TO-T) that became known 20 or more sessions ago, the earliest it can have expired: the finding that firms outperform after buying back their own shares by tender. It is a candidate edge under test, not a proven trade."
hit = "The name is a common stock closing above $5 that trades at least $5M a day and has a tender offer filing that became known at least 20 sessions ago (the group looks back 60). The most liquid ranks first."
not_checked = "It does not know the expiry (an offer can be extended), whether the offer was the company's own or a takeover bid, or that it completed. It is the screen of the tender-offer edge, which the harness is still testing."
before_acting = [
  "A third-party offer is a takeover, not a buyback: read the name's price against the offer, rollup.filing_events@v1.sessions_since_tender_offer does not tell the two apart.",
  "Count 20 sessions as the earliest expiry only: an extended offer is still open, and the entry then comes early.",
  "The study's drift took one to two years; the harness's frozen period will not cover that for a long time.",
]
sources = [
  "Lakonishok and Vermaelen, Anomalous price behavior around repurchase tender offers (1990)",
  "Peyer and Vermaelen, The nature and persistence of buyback anomalies (2009)",
]
related = [
  { id = "sp500_deletion", reason = "another event-driven long idea" },
  { id = "size_small", reason = "the size baseline the edge is compared with" },
]

[asks]
security_type = "A common stock"
status = "Still listed and trading"
price = "Closes above $5"
adv = "Trades at least $5M a day"
tender_offer = "A tender offer became known at least 20 sessions ago"
