# L3 site setting: the Guide's playbook for the site preset exhaustion (ADR 0051; docs/ui/guide.md
# "The playbook page"). The prose its page shows beside the preset's latest version (a preset
# version is immutable, its prose is not); the family is config/site/guide/sections.toml's.
# Keys: summary (the hero), hit (what a hit looks like), not_checked, before_acting (caveats,
# naming catalogue fields so the server links them), related (other playbooks), sources, and
# [asks]: each criterion of the latest preset version in a few plain words. Typed by
# src/algotrade/config/site/guide/playbooks.py; fitness tests in
# tests/unit/config/site/guide/test_playbooks.py.
id = "exhaustion"
version = 1  # the preset version this prose was written for
summary = "Finds shares that have run hard enough to be among the week's top performers, far above their one-month average and overbought, on a spike in volume and range, while this week's momentum has started to fade. These are names where a top may be forming, worth a look for trimming or fading."
hit = "This week's return is in the top 10% of the universe's stocks; the close is more than 2 ATR above its 20-session average; RSI(14) is above 70; today's volume is more than 1.5 times the 20-session average; this week's daily range is more than 1.1 times the month's; the close sits at or beyond 95% of the way to the upper Bollinger band; and this week's return fell short of last week's."
not_checked = "It does not know about a pending takeover or a news-driven short squeeze, both of which pin RSI high with no top behind them. The continuation case (the same screen with momentum still accelerating) is a copy in the Builder with the momentum row flipped."
before_acting = [
  "A takeover bid is the classic false hit: one day up 15% to 40% in rollup.price_moves@v1.one_day_move, then a dead tape with feature.atr_pct near 0; RSI stays above 80 for weeks with no trend to fade.",
  "In a strong trend rollup.momentum@v1.rsi_14 stays above 70 and feature.bb_pct_b above 0.8 for weeks (the band walk, rollup.bands@v2.band_walk); overbought alone is strength, not a sell signal. The field guide fades a stretch only with RSI above 75 or %B above 1.",
  "A gap on news puts the close many ATRs from the mean in one day and widens the bands for 20 sessions: check rollup.price_moves@v1.one_day_move and rollup.earnings@v1.last_earnings_date. After earnings a large move tends to continue rather than reverse.",
  "rollup.trend_stats@v2.mom_accel_5d flips on one big day; confirm the fade with rollup.trend_stats@v2.ret_z_20d.",
]
sources = [
  "Bollinger, Bollinger on Bollinger Bands (%b and closes outside the band)",
  "Raschke and Connors, Street Smarts (climax and exhaustion reversals)",
  "Wilder, New Concepts in Technical Trading Systems; Cardwell's RSI range rules",
]
related = [
  { id = "breakout", reason = "the move that may be ending" },
  { id = "failed_breakout", reason = "the other short-side setup" },
  { id = "oversold_reversal", reason = "the same extremes on the downside" },
]

[asks]
security_type = "A common stock, ADR or ETF"
status = "Still listed and trading"
price = "Closes above $5"
adv = "Trades at least $50M a day"
ret_5d_rank = "Among the week's top 10%"
stretched = "More than 2 ATR above its 20-session average"
rsi = "Overbought: RSI above 70"
rel_volume = "Volume above 1.5 times normal"
atr_expanding = "Daily range widening"
upper_band = "At or above the upper Bollinger band"
momentum_fading = "This week lagged last week"
