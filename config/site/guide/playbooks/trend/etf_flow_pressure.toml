# L3 site setting: the Guide's playbook for the site preset etf_flow_pressure (ADR 0051; docs/ui/guide.md
# "The playbook page"). Keys and tests as in playbooks/income/vrp_scanner.toml.
id = "etf_flow_pressure"
version = 1  # the preset version this prose was written for
summary = "Lists unleveraged iShares ETFs with a share count 21 sessions apart, ordered so the funds that took in the most money come last. It is the screen of a candidate edge under test, and it only exists for iShares funds."
hit = "An unleveraged ETF closing above $5 on at least $20M of 20-day dollar volume, with an iShares share count now and 21 sessions ago. The heaviest net redemption ranks first, the heaviest creation last."
not_checked = "It does not check why shares were created: a rising price draws money in. It does not read the fund's size, its holdings or its issuer beyond iShares, and it needs a month of stored counts before a fund appears."
before_acting = [
  "Only iShares publishes the count here: a fund from another issuer is absent, not neutral. Check rollup.etf_flows@v1.etf_shares_asof for how old the count is.",
  "The history starts on 2026-10-17, so no fund has a change before about 2026-11-17. The harness cannot test the edge until months of counts accrue.",
  "The study that found the reversal is at the fund level and from before 2020. Read the harness's result, not the paper's, before trusting a pick.",
]
sources = [
  "Brown, Davies and Ringgenberg (2021), ETF Arbitrage, Non-Fundamental Demand, and Return Predictability, Review of Finance",
]
related = [
  { id = "size_small", reason = "a baseline every edge is compared with" },
]

[asks]
security_type = "An ETF"
status = "Still listed and trading"
not_leveraged = "Not a leveraged fund"
not_inverse = "Not an inverse fund"
price = "Closes above $5"
adv = "Trades at least $20M a day"
shares_change = "Has a share count 21 sessions apart"
