# L3 site setting: the Guide's playbook for the site preset momentum_volume_confirmed (ADR 0051; docs/ui/guide.md
# "The playbook page"). The prose its page shows beside the preset's latest version (a preset
# version is immutable, its prose is not); the family is config/site/guide/sections.toml's.
# Keys: summary (the hero), hit (what a hit looks like), not_checked, before_acting (caveats,
# naming catalogue fields so the server links them), related (other playbooks), sources, and
# [asks]: each criterion of the latest preset version in a few plain words. Typed by
# src/algotrade/config/site/guide/playbooks.py; fitness tests in
# tests/unit/config/site/guide/test_playbooks.py.
id = "momentum_volume_confirmed"
version = 1  # the preset version this prose was written for
summary = "Ranks past-year winners that also show net buying: on-balance volume rising and closes in the upper half of the day's range on volume, over 20 sessions. It tests whether volume confirmation improves 12-1 momentum."
hit = "The name closes above $5, trades at least $50M a day, has positive 12-1 momentum, and both the 20-session OBV trend and Chaikin money flow are above 0. Best momentum first."
not_checked = "It does not check the size of any one day's volume, news, or earnings. OBV and CMF have no academic test of their own."
before_acting = [
  "Lee and Swaminathan found low-volume winners persist longer, the opposite reading of volume: treat this as one test of the two.",
  "One heavy day can carry the OBV trend; check rollup.volume@v1.volume_z_20d.",
  "CMF ignores gaps: a gap down that closes at the high scores well; compare rollup.volume@v1.up_volume_share_20d.",
]
sources = [
  "Lee and Swaminathan, Price Momentum and Trading Volume (2000)",
  "Chordia and Subrahmanyam, Order Imbalance and Individual Stock Returns (2004)",
]
related = [
  { id = "momentum_12_1", reason = "the ranking this conditions" },
  { id = "momentum_own_trend", reason = "another condition on the same ranking" },
]

[asks]
security_type = "A common stock, ADR or ETF"
status = "Still listed and trading"
price = "Closes above $5"
adv = "Trades at least $50M a day"
mom_12_1 = "A past-year winner: positive 12-1 momentum"
obv_trend = "Net buying: on-balance volume rising over 20 sessions"
cmf = "Closes in the upper half of the range on volume"
