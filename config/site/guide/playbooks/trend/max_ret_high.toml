# L3 site setting: the Guide's playbook for the site preset max_ret_high (ADR 0051; docs/ui/guide.md
# "The playbook page"). A decoy of the edge harness's battery (verdict.toml [decoys], ADR 0053
# amendment 2026-10-18): a yardstick, not a trade idea. Keys as size_small.toml.
id = "max_ret_high"
version = 1  # the preset version this prose was written for
summary = "Ranks every tradeable stock by its biggest one-day return of the last 21 sessions, largest first (the MAX measure of lottery-like demand). It is a yardstick, not a trade idea: an edge whose picks are recent big jumpers must do better than simply buying them."
hit = "The name is a listed common stock or ADR closing above $3 that trades at least $2M a day, and it has a MAX value. Every such name qualifies; the order is the point, the biggest recent one-day jump first."
not_checked = "It does not check why the name jumped (earnings, a takeover bid), trend, quality or valuation. It is a decoy of the edge harness's battery, not a trade signal."
before_acting = [
  "One day decides the rank: an earnings gap or a bid sets it, not a pattern. Check rollup.earnings@v1.last_earnings_date.",
  "Lottery-like names are small and cheap: compare feature.market_cap and rollup.price_stats@v2.close.",
]
sources = [
  "Bali, Cakici and Whitelaw, Maxing Out: Stocks as Lotteries and the Cross-Section of Expected Returns (2011)",
]
related = [
  { id = "ivol_high", reason = "the idiosyncratic-volatility decoy" },
  { id = "size_small", reason = "another decoy every edge is compared with" },
]

[asks]
security_type = "A common stock or ADR"
status = "Still listed and trading"
price = "Closes above $3"
adv = "Trades at least $2M a day"
max_ret = "Has a largest one-day return over 21 sessions"
