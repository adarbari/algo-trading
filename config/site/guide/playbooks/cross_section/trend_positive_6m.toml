# L3 site setting: the Guide's playbook for the site preset trend_positive_6m (ADR 0051; docs/ui/guide.md
# "The playbook page"). Keys and tests as in playbooks/trend/momentum_own_trend.toml.
id = "trend_positive_6m"
version = 1  # the preset version this prose was written for
summary = "Lists unleveraged ETFs whose 6-month return is above zero, best first. It is the trend rule of the ETF allocation edges, which hold these funds and keep cash for the rest."
hit = "An unleveraged ETF whose close is above its close 120 sessions ago. The largest 6-month gain ranks first. A fund with a shorter history has no value and is absent."
not_checked = "It does not compare the return with the Treasury bill rate, add dividends or check liquidity. The edge's own list of funds is what limits the names."
before_acting = [
  "The return is raw price, not excess of cash: a year of 2 percent passes here but would not against a 4 percent bill.",
  "A positive trend exits late in a fast fall and re-enters late in a rebound, so a screen of this kind lags the turns by months.",
  "Read it with the allocation edge's own page: the edge, not this list, says how the funds are weighted and what stands in for cash.",
]
sources = [
  "Moskowitz, Ooi and Pedersen, Time Series Momentum (2012)",
  "Hurst, Ooi and Pedersen, A Century of Evidence on Trend-Following Investing (2017)",
]
related = [
  { id = "trend_positive_12m", reason = "the same rule over twelve months" },
  { id = "trend_positive_3m", reason = "the same rule over three months" },
]

[asks]
security_type = "An ETF"
status = "Still listed and trading"
not_leveraged = "Not a leveraged fund"
not_inverse = "Not an inverse fund"
trend = "A positive 6-month return"
