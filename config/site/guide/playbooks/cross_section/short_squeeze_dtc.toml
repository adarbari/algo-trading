# L3 site setting: the Guide's playbook for the site preset short_squeeze_dtc (ADR 0051; docs/ui/guide.md
# "The playbook page"). The prose its page shows beside the preset's latest version (a preset
# version is immutable, its prose is not); the family is config/site/guide/sections.toml's.
# Keys as in tender_offer_filed.toml; typed by src/algotrade/config/site/guide/playbooks.py.
id = "short_squeeze_dtc"
version = 1  # the preset version this prose was written for
summary = "Finds liquid stocks with a crowded short: 5% or more of the shares sold short and three or more days of volume to cover. Studies find these names lag the market. It is a candidate edge under test."
hit = "The name is a common stock closing above $5 that trades at least $5M a day, with 5% or more of its shares outstanding short and FINRA's days to cover at 3 or more. The highest days to cover ranks last."
not_checked = "It does not know the borrow cost or whether shares can be borrowed, the float, or a catalyst. It does not see a squeeze already under way, and the figure is about two weeks old."
before_acting = [
  "The short interest is as of a settlement date about two weeks before it became public: read rollup.short_interest@v1.short_interest_date.",
  "A crowded short can rise sharply when shorts cover; the studies' average lag hides that tail, and most such names are costly to borrow.",
  "The ratio divides by shares outstanding of every class, not the float, so it understates crowding where few shares trade.",
]
sources = [
  "Hong, Li, Ni, Scheinkman and Yan, Days to Cover and Stock Returns (2015)",
  "Boehmer, Huszar and Jordan, The good news in short interest (2010)",
]
related = [
  { id = "ivol_high", reason = "another list of stocks that tend to lag" },
  { id = "size_small", reason = "the size baseline the edge is compared with" },
]

[asks]
security_type = "A common stock"
status = "Still listed and trading"
price = "Closes above $5"
adv = "Trades at least $5M a day"
short_ratio = "5% or more of the shares outstanding are sold short"
days_to_cover = "Three or more days of volume to cover the short position"
