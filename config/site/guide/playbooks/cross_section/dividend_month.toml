# L3 site setting: the Guide's playbook for the site preset dividend_month (ADR 0051; docs/ui/guide.md
# "The playbook page"). The prose its page shows beside the preset's latest version (a preset
# version is immutable, its prose is not); the family is config/site/guide/sections.toml's.
# Keys: summary (the hero), hit (what a hit looks like), not_checked, before_acting (caveats,
# naming catalogue fields so the server links them), related (other playbooks), sources, and
# [asks]: each criterion of the latest preset version in a few plain words. Typed by
# src/algotrade/config/site/guide/playbooks.py; fitness tests in
# tests/unit/config/site/guide/test_playbooks.py.
id = "dividend_month"
version = 1  # the preset version this prose was written for
summary = "Finds stocks that paid an ex-dividend date in the calendar month ahead in each of the last years, the most regular payers first. The finance literature finds stocks earn more in the months they are expected to pay."
hit = "The name is a listed stock closing above $5 that trades at least $50M a day, with an ex-dividend date in the coming month in at least one of the last 3 years. Three of three ranks first."
not_checked = "It does not know this year's declared date, a cut or suspension, or special dividends (which are excluded from the count). It predicts from history only."
before_acting = [
  "Run it at month end: the flag looks at the month after the session's own.",
  "Dividend payers tilt to value and low volatility; the premium is the calendar, not the tilt, which the edge's baselines try to separate.",
]
sources = [
  "Hartzmark and Solomon, The Dividend Month Premium (2013)",
]

[asks]
security_type = "A common stock or ADR"
status = "Still listed and trading"
price = "Closes above $5"
adv = "Trades at least $50M a day"
expected_div_month_flag = "Paid an ex-dividend date in the coming month in the last 3 years"
