# L3 site setting: the Guide's playbook for the site preset vrp_scanner (ADR 0051; docs/ui/guide.md
# "The playbook page"). The prose its page shows beside the preset's latest version (a preset
# version is immutable, its prose is not); the family is config/site/guide/sections.toml's.
# Keys: summary (the hero), hit (what a hit looks like), not_checked, before_acting (caveats,
# naming catalogue fields so the server links them), related (other playbooks), sources, and
# [asks]: each criterion of the latest preset version in a few plain words. Typed by
# src/algotrade/config/site/guide/playbooks.py; fitness tests in
# tests/unit/config/site/guide/test_playbooks.py.
id = "vrp_scanner"
version = 4  # the preset version this prose was written for
summary = "Finds optionable shares whose options price far more movement than the share has recently delivered (a rich volatility premium) while the share sits near a one-year high or low, and names the out-of-the-money put a seller would look at. It identifies candidates for selling puts; whether to sell them is a separate judgement."
hit = "The share has listed options, closes above $5, and its 30-day implied volatility (the lower of IBKR's and Cboe's) is at least 50%, at least 10 points above and at least 1.25 times the last 30 sessions' realised volatility; the close is within 10% of its 52-week high or low (the columns say which). For ranking only: the best put at the 30 to 60-day expiry is scored on how close its delta sits to the 8 to 15 band (full points inside, none 20 points off), on open interest and daily volume above 1,000 contracts, on a stored bid-ask spread under 15% of the mid (nothing at 30%), on the IV rank being at least 0.5 (IBKR's where it has one, else ours from Cboe chains), and on an option tier of A or B. A one-day move above 10% in the last month and leveraged or inverse funds are flagged, not rejected."
not_checked = "It does not check earnings (the next report date and the expiry's days to go are columns, by owner decision), which side of the 52-week range the share is near, or how the candidates correlate with each other. It is not scheduled: run it on request."
before_acting = [
  "A report inside 30 days is the premium: the earnings move inflates feature.vrp_iv30 and the spread. Read rollup.earnings@v1.days_to_earnings; high IV with no report ahead is usually a binary event the catalogue does not store (an FDA date, a ruling): EVENT_RISK, not free premium.",
  "There is no floor on realised volatility by design, so a pinned takeover target with HV near 0.03 shows a feature.vrp_iv_hv_ratio of 3 and tops the list; require rollup.price_stats@v2.hv30 of at least 0.10 or feature.atr_pct of at least 0.01.",
  "feature.dist_52w does not say which side: read feature.near_52w, feature.pct_from_high_52w and feature.pct_from_low_52w; a name 5% under its high and one 5% above its low are opposite setups.",
  "The stored rollup.put_wing@v1.best_put_spread_pct is an after-close quote and wide by nature; judge the fill on a live quote during the session. A round 5,000 of rollup.put_wing@v1.best_put_oi at one strike with 50 at its neighbours is one position, not a liquid wing (rollup.put_wing@v1.wing_oi). feature.iv_rank is IBKR's where it has one, else ours from Cboe chains; feature.iv_rank_source says which, and the two are not the same history. It is null only where neither has 60 sessions of IV, and then only costs points.",
]
sources = [
  "Carr and Wu (2009), Variance risk premiums, Review of Financial Studies",
  "tastylive, Options liquidity (volume, open interest, spread): https://www.tastylive.com/concepts-strategies/options-liquidity",
  "McMillan, Options as a Strategic Investment (selling puts when implied volatility is rich)",
]
related = [
  { id = "support_reversal", reason = "a tested level to strike under" },
  { id = "exhaustion", reason = "the names near a high that may turn" },
  { id = "oversold_reversal", reason = "the names near a low that may bounce" },
]

[asks]
security_type = "A common stock, ADR or ETF"
status = "Still listed and trading"
optionable = "Has listed options"
iv30 = "Implied volatility at least 50%"
price = "Closes above $5"
iv_hv_spread = "IV at least 10 points over realised"
iv_hv_ratio = "IV at least 1.25 times realised"
near_52w = "Within 10% of a 52-week high or low"
adv = "Trades at least $50M a day"
delta_closeness = "Best put near the 8 to 15 delta band"
put_open_interest = "Best put open interest over 1,000"
put_trading_volume = "Best put volume over 1,000 a day"
put_bid_ask = "Best put spread under 15% of the mid"
iv_rank = "IV rank at least 0.5"
execution = "Option execution tier A or B"
