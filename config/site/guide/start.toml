[[page]]
id = "read_an_edge_page"
order = 7
title = "Read an edge page"
summary = "Walk down an edge page with one real example: why a win rate 8 points above the base rate on 3 trades is noise."
links = [
  { kind = "term", id = "verdict" },
  { kind = "term", id = "verdict_criteria" },
  { kind = "term", id = "verdict_not_enough_data" },
  { kind = "term", id = "win_rate" },
  { kind = "term", id = "base_rate" },
  { kind = "term", id = "lift" },
  { kind = "term", id = "trades" },
  { kind = "term", id = "top_vs_bottom_decile" },
  { kind = "term", id = "robustness" },
  { kind = "term", id = "sharpe_ratio" },
  { kind = "term", id = "deflated_sharpe" },
  { kind = "term", id = "run_backtest" },
  { kind = "start", id = "edge_life" },
  { kind = "term", id = "official_result" },
  { kind = "term", id = "variants_tried" },
  { kind = "term", id = "overfitting_probability" },
  { kind = "term", id = "not_a_return" },
  { kind = "term", id = "edge_definition" },
  { kind = "term", id = "edge_persistence" },
  { kind = "mechanism", id = "slow_to_update" },
]

[[page.section]]
title = "The header: verdict, status and official result"
body = """
The badge is the verdict: the app's judgement of the edge's official result. The sentence under
it names the first test the edge fails. Beside it, Site edge or Your edge says whose it is, the
status says where it stands in its life, and Last backtest dates the official result. Example:
vrp_short_premium sells put options, contracts that pay out if a stock falls, and wins when they
expire worthless. It is a site edge, its status is candidate, and its verdict is Not enough data:
only 3 out-of-sample trades, 40 needed. The badge says the evidence is too thin to judge, not that
the idea is wrong. Don't read a badge as advice to act.
"""

[[page.section]]
title = "The figures strip"
body = """
Five figures sum up the official result: win rate, base rate, lift, trades and the top vs bottom
decile spread. A win rate means little alone. Read it beside the base rate, then read both beside
the number of trades. Example: vrp_short_premium wins 77% against a base rate of 69%, a lift of
+8 points. It rests on 3 trades out of 15 in all, and three independent test dates cannot tell
skill from luck. Don't read a win rate as profit. A short put wins when the option expires
worthless. Wins are frequent and the rare losses are large, and the app does not model profit
and loss, so the win rate overstates what the trade earns.
"""

[[page.section]]
title = "Deciles and robustness"
body = """
The decile bars rank every eligible name by the edge's own score, cut the ranking into ten equal
groups and show each group's average outcome, best-ranked first. A ranking that works slopes down
from left to right. The robustness histogram sets the edge's lift against 1,000 backtests of random
picks; Works needs it to beat 95% of them. Example: the ten bars of vrp_short_premium read 7.5%,
6.5%, 6.0%, 7.6%, 7.5%, 6.5%, 7.9%, 6.8%, 7.6% and 7.4%. They are flat, and the spread is -0.034
with a t of -1.66: the ranking carries no information. The edge beats 91% of random backtests,
short of the 95% it needs.
"""

[[page.section]]
title = "Year by year"
body = """
This table splits the result by calendar year and marks each year in-sample or out-of-sample.
Look for a result that holds in most years; one year carrying everything is a warning. A year with
no trades has no result, which is different from zero. Example: vrp_short_premium has no trades
from 2011 to 2023, because the data it needs starts around 2024. In 2024 it won 80% against 70% on
2 trades, in 2025 70% against 71% on 8 trades, and in 2026 73% against 71% on 5. The in-sample
lift is about zero.
"""

[[page.section]]
title = "Backtests and the verdict tests"
body = """
Open Details for the evidence behind the badge. What the verdict tests lists every test with its
value, what it needs and pass, fail or not measured. Backtests lists the runs, with the official
result marked, and the figures add the Sharpe ratio, the deflated Sharpe and the overfitting
probability. Example: vrp_short_premium fails 3 of the 7 Promising tests, passes 3 and does not
measure one. Its Sharpe ratio is of its win rate above the base rate, since a cushion is not a
return. The deflated Sharpe weighs it against 126 variants tried: the best of that many tries
looks good by luck.
"""

[[page.section]]
title = "Definition and why it should last"
body = """
How the edge is defined lists six lines: the idea, the screens, the picks, the trade, what it is
compared against and the test. Why it should last gives the reason the pattern should survive
being known, with sources. Read the definition before the figures, because every figure answers
only the question it asks. Example: vrp_short_premium takes the top 20 of the vrp_iv_hv screen
every session and holds a short put for 15, 21 or 31 trading days. It is compared with
momentum_12_1 and size_small, and tested out-of-sample from 2026-04-01. Don't treat a good reason as evidence.
"""

[[page.section]]
title = "Putting the example together"
body = """
Read the example as a chain. A lift of +8 points on 3 trades is noise. The in-sample lift was
about zero. The deciles are flat and their t is negative, so the ranking carries no information.
The deflated Sharpe asks whether the Sharpe ratio beats the best of 126 tries by luck.
It beats 91% of random backtests, not 95%. Together they say the evidence is too thin to trust.
More out-of-sample sessions settle it, not a different date. Don't change an edge and
rerun it until the numbers look good: that is how a lucky result is made.
"""

# --------------------------------------------------------------------------------------- 8
[[page]]
id = "edge_life"
order = 8
title = "An edge's life"
summary = "An edge moves along one status line, from researching to retired; rejected and blocked sit off it. Who moves it, and what you can undo."
links = [
  { kind = "term", id = "edge_status" },
  { kind = "term", id = "edge_state" },
  { kind = "term", id = "edge_copy" },
  { kind = "term", id = "follow_edge" },
  { kind = "term", id = "paper_trading" },
  { kind = "term", id = "forward_test" },
  { kind = "term", id = "verdict" },
  { kind = "start", id = "read_an_edge_page" },
  { kind = "term", id = "official_result" },
  { kind = "term", id = "base_rate" },
  { kind = "term", id = "run_backtest" },
]

[[page.section]]
title = "One line, two owners"
body = """
Every edge has one status on one line: researching, candidate, evidenced, live, retired.
Rejected and blocked sit off the line. A site edge's status is the site's, the same for everyone.
The status of your own edge is yours to move. The verdict is different: the app computes it from
the official result by a fixed rule. A status is a decision and a verdict is a measurement, so
they can disagree, and the page shows both. On your own edge every move can be undone; labels
such as Followed against the verdict cannot, so a hasty choice stays on the record. Don't move an
edge to live to see what happens: the move is your record of a decision.
"""

[[page.section]]
title = "Follow, or clone"
body = """
You cannot change a site edge's status. You can follow it, which keeps it in your list and leaves
its status and official result as the site's; unfollowing removes the bookmark. Or you can clone
it into an edge of your own that extends it. A clone starts as researching, has its own backtests,
and keeps its out-of-sample result hidden until you show it or make it live. Following records
your interest. It is not an order: the app never trades.
"""

[[page.section]]
title = "Researching"
body = """
You get here by writing an edge or cloning one: every clone starts as researching. It means the
idea is written and nothing is claimed. Run backtest gives it figures, and the page shows its
verdict. Next, make it a candidate when you start testing it, or reject it. From candidate, live, retired or
rejected, your own edge can go back to researching.
"""

[[page.section]]
title = "Candidate"
body = """
You get here from researching, or a new version of an edge starts here. It means the edge is being
tested. A verdict can show, but a verdict is not a status. Next, make it live when you intend to
act on it, reject it, or go back to researching. A new version of an edge you follow is tried on
paper beside it first (see Forward test). For a site edge, candidate says the site is still
testing it.
"""

[[page.section]]
title = "Evidenced"
body = """
Only the site sets this status, and only after an official result over the out-of-sample period
shows the edge's picks beating the base rate and the baselines on enough trades. You cannot set
it on your own edge: yours goes from candidate to live. It means the evidence is strong, not that
the pattern will last. A later, weaker official result can show a lower verdict, and the site
decides what happens to the status.
"""

[[page.section]]
title = "Live"
body = """
For a site edge, live means evidenced and used to rank ideas. For your own edge, it means you
intend to act on it. Next, retire it when it stops working or you stop acting on it, or go back to
candidate or researching. Making your own edge live while its verdict is Not working puts the
label Followed against the verdict on it for good. A candidate that replaces another edge of yours
retires the old one when it goes live. Paper trades show how it does going forward.
"""

[[page.section]]
title = "Retired, rejected, blocked"
body = """
Retired: the edge stopped working by its own retirement rule, or you stopped acting on it; it
keeps its record, so you can still read why. Rejected: checked and dropped, with the reason kept
so the same idea is not filed again; the Rejected view lists these edges. Reopening either sends
your own edge back to researching. Blocked: worth testing but missing the data it needs; only
the site sets and clears it. Blocked describes the edge, while Waiting on data describes a result.
"""

# --------------------------------------------------------------------------------------- 9
[[page]]
id = "read_feature_requests"
order = 9
title = "Read the Feature requests page"
summary = "Admins: the features traders asked Describe it for that the catalogue lacks, ranked so the next feature to build is clear."
links = [
  { kind = "term", id = "feature_request_score" },
  { kind = "term", id = "feature_request_status" },
  { kind = "term", id = "feature_request_feasibility" },
  { kind = "term", id = "accepted_formula" },
]

[[page.section]]
title = "What the page lists"
body = """
Each row is one feature a trader asked Describe it for that the catalogue did not have. The page shows counts only: how many distinct users asked, how many times, and when. It never shows who. Rows come in the server's order, best first, and the rank column is that order.
"""

[[page.section]]
title = "How the ranking works"
body = """
The score adds up the users who asked, each fading with the age of their latest request, and multiplies by the feasibility weight. A feature buildable from stored data ranks above a harder one with the same asks. Open and unmapped requests come before promoted and won't do ones.
"""

[[page.section]]
title = "What to do with a row"
body = """
Filter by status to see what is waiting. An open row is a candidate to promote to a site feature; a promoted row links to its field page. An unmapped row needs its name merged into a backlog item. All of these are changes to the backlog, reviewed like any other.
"""

[[page.section]]
title = "Accepted formulas"
body = """
Below the requests, each row is one formula traders wrote in Describe it and saved as their own feature. Equal formulas are one row, grouped by their fingerprint. The row counts distinct users and acceptances and never names a user. Open a row to read its canonical form.
The Duplicates column names the site feature that already computes the same thing, and the Backlog column the backlog item exactly tied to it. A formula with neither is a candidate to promote; promoting it is a reviewed change, like any other.
"""
