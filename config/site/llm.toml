# L3 site setting: the text model behind "Describe it" in the screener Builder (ADR 0041).
# Off by default. The key never goes here: set ALGOTRADE_LLM_API_KEY in .env (a local Ollama
# server needs none; with [[provider]] tables, ALGOTRADE_LLM_API_KEY_<ID upper> per provider).
# What leaves the machine is the typed sentence and the field catalogue.
#
# Any OpenAI-compatible endpoint works; `base_url` is the root that has /chat/completions:
#   Ollama (local, free):   base_url = "http://localhost:11434/v1",                  model = "llama3.1"
#   Gemini (free tier):     base_url = "https://generativelanguage.googleapis.com/v1beta/openai", model = "gemini-2.5-flash"
#   Groq (free tier):       base_url = "https://api.groq.com/openai/v1",             model = "llama-3.3-70b-versatile"
#   OpenRouter (:free):     base_url = "https://openrouter.ai/api/v1",               model = "<id>:free"
#   Anthropic:              base_url = "https://api.anthropic.com/v1",               model = "claude-haiku-4-5"

# No model call from tests, local gates, the real-app smoke or CI: `ALGOTRADE_LLM=off` in the
# environment forces the text model off whatever this file or a machine's llm.local.toml say
# (tests/conftest.py, the Makefile test and smoke targets, playwright.real.config.ts and the CI
# workflows set it; the owner's API and the nightly never do). ADR 0041, amended 2026-10-08.

enabled = false
# The single-provider form: these two are the defaults (a local Ollama). A machine file
# llm.local.toml that adds [[provider]] tables must not set them (see the chain below).
# base_url = "http://localhost:11434/v1"
# model = "llama3.1"
timeout_s = 60                   # one request may take this long before "drafting unavailable"
answer_limit = 8000              # tokens for the answer AND the model's thinking (Gemini 3.x thinks
                                 # ~2,000 tokens first; a draft itself is a few hundred)
retries = 2                      # a busy provider (429, 5xx: Gemini's "high demand") or a dropped
                                 # connection is retried this many times, pausing 3 s then 6 s

# [request]: extra fields sent with every request as given (strings, numbers and booleans only;
# `model`, `messages`, `temperature`, `max_tokens` and `response_format` are refused: the
# adapter sets them). Gemini 3.x thinks before it answers: `reasoning_effort = "low"` keeps that
# short, which leaves the answer budget for the draft and answers faster.
# [request]
# reasoning_effort = "low"

# A chain (ADR 0041, amended 2026-10-08): `[[provider]]` tables, tried in order; the next one
# answers only when the one before is unavailable (down, refused, out of retries, an answer that
# is not text). Use either these tables or the top-level `base_url` / `model`, never both. The
# top-level `timeout_s`, `answer_limit`, `retries` and `request` are the defaults of every
# provider; each table may override them. The key of a provider is ALGOTRADE_LLM_API_KEY_<ID
# upper> (here _CLAUDE and _GEMINI); a remote provider without a key is left out with a warning.
# `deadline_s`: once the chain has spent this long it starts no further provider; unset, it is
# every provider's worst case added up, and a value that would cut off the fallback is refused.
# A machine's llm.local.toml can hold the [[provider]] tables (and `enabled = true`).
#
# enabled = true
#
# [[provider]]
# id = "claude"
# base_url = "https://api.anthropic.com/v1"
# model = "claude-haiku-4-5"
#
# [[provider]]
# id = "gemini"
# base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
# model = "gemini-2.5-flash"
# [provider.request]
# reasoning_effort = "low"

# The owner's Claude Code login (kind = "claude-cli", ADR 0041 amended 2026-10-08): instead of
# an endpoint, a provider can run Claude Code headless (`claude -p`) on this machine under the
# owner's own login (the keychain; no token, no API key). A subscription login must never serve
# other users, so it needs `only_users` (user ids from users.toml); everyone else goes straight
# to the next provider. `command` is the absolute path (launchd's PATH is minimal), `model`
# "haiku" or "sonnet", `retries` defaults to 0. `only_users` may be set on any provider.
#
# [[provider]]
# id = "claude_cli"
# kind = "claude-cli"
# command = "/Users/adarbari/.local/bin/claude"
# model = "haiku"
# timeout_s = 90
# only_users = ["abhi"]
#
# [[provider]]
# id = "gemini"
# base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
# model = "gemini-2.5-flash"

# Prices and budget (ADR 0057). Every call is logged (usage/llm_calls: tokens, latency, cost).
# A remote provider's model needs a [[price]] (USD per million tokens) or `free = true` (a free
# tier): a model without one makes this file refuse to load, because a missing price must not
# count as $0. A local server (Ollama) is free without one; `claude-cli` counts the notional cost
# Claude Code reports. [budget] caps what the paid and reported providers may spend per exchange
# calendar day / month (all optional; absent: no cap). Over a cap, `over = "free"` skips them and
# lets only the free providers answer (the default), `over = "refuse"` refuses every call.
# Declare `free = true` only for a key that cannot bill: on a key with billing enabled it would
# bypass the budget. A call of unknown cost (no usage reported, a failure) is charged an upper bound;
# `reported_call_usd` (default 0.25) is the bound of one claude-cli call.
# The Gemini free tier is `free = true`: logged at $0 (cost_basis "free") and still answering
# when the budget is spent under `over = "free"`.
#
# [[price]]
# model = "claude-haiku-4-5"
# input_per_mtok = 1.0
# output_per_mtok = 5.0
#
# [[price]]
# model = "gemini-2.5-flash"
# free = true
#
# [budget]
# daily_usd = 1.0
# monthly_usd = 15.0
# over = "free"
