# Rollup parameters (L3, reviewed via PR). One section per rollup that takes parameters,
# named by its key; each key is a scalar field of the rollup's params dataclass, typed and
# validated by config/site/settings.py (rollup_params). A missing key keeps the default; an
# unknown section or key fails. Rollups without parameters (earnings@v1) have no section.
# Changing a value changes the definition's output: record why in the PR. Expression
# features (and their params, e.g. the liquidity thresholds) live in features/*.toml.

["option_liquidity@v1"]
dte_target = 35       # target expiry: the standard monthly closest to this many days
dte_min = 21          # ... within [dte_min, dte_max]
dte_max = 60
dte_fallback = 14     # else any expiry at least this far out
delta_target = 0.30   # short strike fallback: closest |delta| to this
pick_lo = 0.20        # short strike: tightest spread with pick_lo <= |delta| <= pick_hi
pick_hi = 0.40
zone_lo = 0.15        # zone open interest / volume: zone_lo <= |delta| <= zone_hi
zone_hi = 0.40

["price_stats@v2"]
year_sessions = 252      # the 52-week window, in exchange sessions
min_year_sessions = 240  # bars needed in that window for high_52w / low_52w (else null)
periods_per_year = 252   # realised-vol annualisation

["dividends@v2"]
min_history_days = 240   # bars among the last 252 sessions before "no dividend" means 0 (else null)
include_special = false  # count distributions typed "special" in the trailing 12 months

["iv30@v1"]
target_days = 30         # constant maturity, calendar days
min_days = 7             # expiries nearer than this are left out
max_days = 90            # ... and further than this
max_spread_pct = 0.35    # a quote is used only if (ask - bid) / mid <= this
min_open_interest = 10   # ... and open interest >= this
min_volume = 1           # ... or volume >= this

["iv_history@v2"]
window = 252             # sessions for a FULL rank (today included)
min_provisional = 60     # sessions with an IV before the rank is shown (PROVISIONAL)
source = "ours"          # "ours" (iv30@v1.iv30) or "cboe" (iv30@v1.iv30_cboe)

["ibkr_iv@v1"]           # IBKR's IV (volatility/ibkr_iv30): the same rank rules as iv_history@v2
window = 252             # sessions for a FULL rank (today included)
min_provisional = 60     # sessions with an IBKR IV before the rank is shown (PROVISIONAL)

["fundamentals@v2"]
stale_days = 400         # shares whose period ended longer ago than this are STALE (no market cap);
                         # 10-Q filers report every ~3 months, 20-F filers once a year

["financials@v1"]
stale_days = 480         # the oldest TTM period ended longer ago than this: STALE (still shown, no P/E);
                         # a 10-K-only or 20-F filer is up to ~15 months behind just before its next annual report
history_days = 1100      # facts whose period ended earlier are not read (two TTMs need ~2.3 years)

["put_wing@v1"]          # the VRP scanner's short-put wing (docs/screeners/vrp-scanner.md);
                         # the DTE window and delta bands are part of v1: changing them is v2
dte_target = 45          # target expiry: the one closest to this many calendar days ...
dte_min = 30             # ... among those dte_min..dte_max days out (ties: the earlier)
dte_max = 60
delta_lo = 0.08          # target band: delta_lo <= |our delta| <= delta_hi (edges included)
delta_hi = 0.15
search_lo = 0.05         # candidates for the best put: search_lo <= |our delta| <= search_hi
search_hi = 0.35
prefer_monthly = true    # standard monthlies in the window first (where OI concentrates), else any

["oi_walls@v1"]          # call / put walls (docs/data/swing.md); the DTE window is part of v1
dte_min = 1              # open interest is summed across expiries dte_min..dte_max calendar
dte_max = 60             # days out (0: an expiry on the session, gone by the next open)
