# Rollup parameters (L3, reviewed via PR). One section per rollup that takes parameters,
# named by its key; each key is a scalar field of the rollup's params dataclass, typed and
# validated by config/site/settings.py (rollup_params). A missing key keeps the default; an
# unknown section or key fails. Rollups without parameters (earnings@v1) have no section.
# Changing a value changes the definition's output: record why in the PR. Expression
# features (and their params, e.g. the liquidity thresholds) live in features/*.toml.

["option_liquidity@v1"]
dte_target = 35       # target expiry: the standard monthly closest to this many days
dte_min = 21          # ... within [dte_min, dte_max]
dte_max = 60
dte_fallback = 14     # else any expiry at least this far out
delta_target = 0.30   # short strike fallback: closest |delta| to this
pick_lo = 0.20        # short strike: tightest spread with pick_lo <= |delta| <= pick_hi
pick_hi = 0.40
zone_lo = 0.15        # zone open interest / volume: zone_lo <= |delta| <= zone_hi
zone_hi = 0.40

["price_stats@v2"]
year_sessions = 252      # the 52-week window, in exchange sessions
min_year_sessions = 240  # bars needed in that window for high_52w / low_52w (else null)
periods_per_year = 252   # realised-vol annualisation

["price_history@v1"]       # no trade on the session, and the high / low since listing (ADR 0046)
year_sessions = 252        # the window (price_stats@v2's 52 weeks)
full_bars = 240            # bars in the window for FULL (price_stats@v2's min_year_sessions)
listing_quiet = 60         # sessions with no bar before the first bar that make it a listing
min_listing_sessions = 20  # sessions since listing for a range (else NEW_LISTING)

["dividends@v2"]
min_history_days = 240   # bars among the last 252 sessions before "no dividend" means 0 (else null)
include_special = false  # count distributions typed "special" in the trailing 12 months

["iv30@v1"]
target_days = 30         # constant maturity, calendar days
min_days = 7             # expiries nearer than this are left out
max_days = 90            # ... and further than this
max_spread_pct = 0.35    # a quote is used only if (ask - bid) / mid <= this
min_open_interest = 10   # ... and open interest >= this
min_volume = 1           # ... or volume >= this

["iv_history@v2"]
window = 252             # sessions for a FULL rank (today included)
min_provisional = 60     # sessions with an IV before the rank is shown (PROVISIONAL)
source = "ours"          # "ours" (iv30@v1.iv30) or "cboe" (iv30@v1.iv30_cboe)

["ibkr_iv@v1"]           # IBKR's IV (volatility/ibkr_iv30): the same rank rules as iv_history@v2
window = 252             # sessions for a FULL rank (today included)
min_provisional = 60     # sessions with an IBKR IV before the rank is shown (PROVISIONAL)

["fundamentals@v2"]
stale_days = 400         # shares whose period ended longer ago than this are STALE (no market cap);
                         # 10-Q filers report every ~3 months, 20-F filers once a year

["financials@v1"]
stale_days = 480         # the oldest TTM period ended longer ago than this: STALE (still shown, no P/E);
                         # a 10-K-only or 20-F filer is up to ~15 months behind just before its next annual report
history_days = 1100      # facts whose period ended earlier are not read (two TTMs need ~2.3 years)

["put_wing@v1"]          # the VRP scanner's short-put wing (docs/screeners/vrp-scanner.md);
                         # the DTE window and delta bands are part of v1: changing them is v2
dte_target = 45          # target expiry: the one closest to this many calendar days ...
dte_min = 30             # ... among those dte_min..dte_max days out (ties: the earlier)
dte_max = 60
delta_lo = 0.08          # target band: delta_lo <= |our delta| <= delta_hi (edges included)
delta_hi = 0.15
search_lo = 0.05         # candidates for the best put: search_lo <= |our delta| <= search_hi
search_hi = 0.35
prefer_monthly = true    # standard monthlies in the window first (where OI concentrates), else any

["market_breadth@v1"]      # the universe's breadth (ADR 0047)
min_coverage = 0.9         # share of member stocks with a bar on the session, else every breadth column is null

["market_macro@v3"]         # the regime model's macro readings (ADR 0048): monthly windows tolerate gaps
min_months_12 = 10          # a 12-month mean or low needs this many of its months (Oct 2025: shutdown)
min_months_3 = 2            # a 3-month mean needs this many of its months

["regime_indicators@v1"]     # the regime cards' verdicts (ADR 0047; docs/market-regime-plan.md 3-4)
changed_sessions = 5         # <card>_changed compares the verdict with this many sessions earlier
curve_below = 0.0            # curve: 10y - 3m below this (inverted) ...
curve_min_inverted_days = 21 # ... now and on this many of the last 252 sessions (= regime@v3 curve_inverted_days)
hy_oas_above = 0.05          # high-yield spread above 5% ...
hy_oas_off_low = 0.015       # ... or 150 bp or more above its 126-session low
unrate_trend_above = 0.0     # unemployment above its 12-month mean
sahm_at_least = 0.005        # Sahm gap of 0.5 points or more
nfci_above = 0.0             # financial conditions tighter than average
spx_trend_below = 0.0        # the S&P 500 below its 200-day mean
vix_term_above = 1.0         # VIX above VIX3M (backwardation)
breadth_below = 0.40         # fewer than 40% of the universe above their 200-day mean

["regime@v3"]                # the regime scores and label (plan section 4: the macro tiers and the
                             # curve's memory set on the 1971-2026 episode scorecard, the measured
                             # leads in the plan's table). Each score's w_* sum to 100.
hold_sessions = 5            # label: the most severe raw label of this many sessions (hysteresis)
changed_sessions = 5         # label_changed compares the label with this many sessions earlier
min_coverage = 0.5           # a score (or a macro tier) with less than this share of its weight known: unknown
macro_high = 50.0            # macro_risk (the higher of its two tiers) at or above: macro high (CAUTION, or CRISIS with stress)
market_high = 50.0           # market_stress at or above: market high (STRESS, or CRISIS)
w_curve = 20.0               # macro early tier (35): curve 20, permits 5, Fed hikes 5, inflation 5;
w_permits = 5.0              # the curve alone is 57% of the tier, so a year with a month of
w_fed = 5.0                  # inversion is macro high by itself
w_inflation = 5.0
w_credit = 20.0              # macro confirming tier (65): credit 20 (the hy_oas card, else EBP),
w_unrate_trend = 7.0         # labour 20 (unemployment trend 7, Sahm 7, claims 6), NFCI 15,
w_sahm = 7.0                 # lending standards 10
w_claims = 6.0
w_nfci = 15.0
w_sloos = 10.0
curve_inverted_days = 21     # curve: 10y - 3m inverted on at least this many of the last 252 sessions (= the card's curve_min_inverted_days; a test holds them equal)
claims_at_least = 1.15       # 4-week claims 15% or more above their 52-week low
sloos_above = 0.20           # more than 20% of banks tightening C&I standards
permits_at_most = -0.20      # permits down 20% or more on the year
fed_hikes_above = 0.02       # fed funds up more than 200 bp on the year
cpi_above = 0.04             # CPI inflation above 4%
ebp_above = 0.005            # credit when the high-yield spread is unknown (before 2023 on FRED): EBP above 50 bp
w_trend = 20.0               # market_stress: the card verdicts spx_trend_200d, vix_term,
w_vol_term = 20.0            # breadth_200d and the thresholds below
w_drawdown = 10.0
w_breadth = 20.0
w_leadership = 8.0           # leadership (XLY/XLP and IWM/SPY both falling over 63 sessions) and
w_credit_etf = 7.0           # credit ETFs (HYG/LQD falling): 15
w_turbulence = 8.0           # turbulence and absorption: 15
w_absorption = 7.0
drawdown_at_most = -0.10     # SPY 10% or more below its 52-week closing high
turbulence_at_least = 2.0    # turbulence / basket size (about 1 on an ordinary day)
absorption_shift_at_least = 1.0  # the absorption ratio up a standard deviation
w_credit_boom = 50.0         # fragility (context only): bank credit growth and SPY's run-up
w_runup = 50.0
credit_boom_above = 0.10     # bank credit up more than 10% on the year
runup_above = 0.30           # SPY up more than 30% on the year

["relative_strength@v1"]  # relative strength, percentiles and the sector (docs/data/technical.md)
min_members = 200        # universe stocks with a known return a percentile needs, else it is null
min_coverage = 0.9       # share of member stocks with a bar on the session, else every percentile is null
min_sector_etfs = 6      # sector ETFs (of 11) with a known 63-session return a sector rank needs

["trend_stats@v1"]        # streaks and the base length (docs/data/technical.md)
tight_range_pct = 0.15   # a 20-session high-low range at most this share of the close is tight
