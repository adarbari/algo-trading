# L3 site setting: trader vocabulary -> catalogue fields, for natural-language screener drafts
# (ADR 0041). The drafting prompt lists these after the catalogue so the words a trader uses
# ("momentum", "near the low", "liquid") land on the right fields with sensible thresholds.
# Edit by PR. Every field named here must exist in the site catalogue (a test checks); a phrase
# whose fields the caller's catalogue lacks is left out of that caller's prompt.
#
# [[phrase]]  say    = what the trader says (any of these words)
#             fields = the catalogue fields that express it (exact names)
#             hint   = how to use them: which is the gate, which a confirmation or a score,
#                      typical thresholds, what not to combine

[[phrase]]
say = ["upward momentum", "momentum", "trending up", "gaining", "strong"]
fields = ["rollup.price_stats@v2.ret_20d", "rollup.price_stats@v2.ret_60d", "feature.pct_vs_sma_20", "rollup.momentum@v1.rsi_14"]
hint = "gate: ret_20d gt 0 (ret_60d for a longer run); confirm: pct_vs_sma_20 gt 0; rsi_14 gte 50 as a score, never the only gate; do not add trend_state UPTREND when the sentence also says near the low"

[[phrase]]
say = ["downward momentum", "falling", "weak", "selling off"]
fields = ["rollup.price_stats@v2.ret_20d", "feature.pct_vs_sma_20", "rollup.momentum@v1.rsi_14"]
hint = "gate: ret_20d lt 0; confirm: pct_vs_sma_20 lt 0; rsi_14 lte 50 as a score"

[[phrase]]
say = ["near the 52-week low", "close to its low", "off the lows", "beaten down", "at the bottom"]
fields = ["feature.pct_from_low_52w", "feature.near_52w"]
hint = "pct_from_low_52w lte 0.10 (within 10% of the low; 0.20 for 'off the lows'), soft with tolerance 0.05; or near_52w eq LOW for the catalogue's own 10% band"

[[phrase]]
say = ["near the 52-week high", "at highs", "near its high", "breaking out to highs"]
fields = ["feature.pct_from_high_52w", "feature.near_52w"]
hint = "pct_from_high_52w gte -0.10 (within 10% of the high; the value is negative or 0), soft with tolerance 0.05; or near_52w eq HIGH"

[[phrase]]
say = ["oversold"]
fields = ["rollup.momentum@v1.rsi_14"]
hint = "rsi_14 lt 30 (percentage points, 0 to 100)"

[[phrase]]
say = ["overbought"]
fields = ["rollup.momentum@v1.rsi_14"]
hint = "rsi_14 gt 70 (percentage points, 0 to 100)"

[[phrase]]
say = ["uptrend", "in an uptrend", "above its moving averages"]
fields = ["feature.trend_state", "feature.pct_vs_sma_50", "feature.pct_vs_sma_200"]
hint = "trend_state eq UPTREND (close above SMA50 above SMA200); or pct_vs_sma_50 gt 0 for a looser 'above the 50-day'"

[[phrase]]
say = ["downtrend"]
fields = ["feature.trend_state", "feature.pct_vs_sma_50"]
hint = "trend_state eq DOWNTREND; or pct_vs_sma_50 lt 0"

[[phrase]]
say = ["pullback", "dip in an uptrend", "buy the dip"]
fields = ["feature.pullback_to_sma20"]
hint = "pullback_to_sma20 eq true (an uptrend with the close within one ATR of SMA20)"

[[phrase]]
say = ["breakout", "breaking out", "new 20-day high on volume"]
fields = ["feature.breakout_20d", "rollup.momentum@v1.rel_volume"]
hint = "breakout_20d eq true; 'on heavy volume' alone is rel_volume gte 1.5"

[[phrase]]
say = ["liquid", "actively traded", "heavy volume", "enough volume", "tradable"]
fields = ["rollup.price_stats@v2.adv_usd_20d", "feature.liquidity_class"]
hint = "adv_usd_20d gte 50000000 (dollars a day; 'very liquid' 100000000, 'some volume' 5000000), soft with tolerance {relative = 0.2} and on_miss LIQUIDITY_RISK; or liquidity_class in [HIGH, MEDIUM]"

[[phrase]]
say = ["cheap", "low priced", "under $N", "penny stocks", "expensive"]
fields = ["rollup.price_stats@v2.close"]
hint = "close lt N / gt N in dollars; 'penny' is close lt 5; a price floor ('over $5') is a hard gate"

[[phrase]]
say = ["large cap", "mid cap", "small cap", "market cap"]
fields = ["feature.market_cap"]
hint = "market_cap in dollars: large gte 10000000000, mid between [2000000000, 10000000000], small lt 2000000000"

[[phrase]]
say = ["high implied volatility", "high IV", "IV rank", "elevated vol", "expensive options", "volatility premium"]
fields = ["feature.iv_rank", "rollup.iv_history@v2.iv30", "feature.iv_hv_spread", "feature.iv_hv_ratio"]
hint = "iv_rank gte 0.5 (a fraction 0 to 1: 'IV rank above 50%' is 0.5); 'IV over 40%' is iv30 gte 0.40; 'premium' or 'IV over realised' is iv_hv_spread gte 0.05 or iv_hv_ratio gte 1.2"

[[phrase]]
say = ["low implied volatility", "cheap options", "low IV"]
fields = ["feature.iv_rank", "rollup.iv_history@v2.iv30"]
hint = "iv_rank lte 0.3; or iv30 lte 0.25"

[[phrase]]
say = ["earnings soon", "before earnings", "earnings this week", "avoid earnings", "no earnings coming"]
fields = ["rollup.earnings@v1.days_to_earnings"]
hint = "sessions until the next report: 'earnings this week' days_to_earnings lte 5; 'avoid earnings' / 'no earnings in the next N' days_to_earnings gt N (N sessions; default 10), soft with on_miss EVENT_RISK"

[[phrase]]
say = ["dividend", "yield", "income"]
fields = ["feature.div_yield"]
hint = "div_yield as a fraction: 'yield over 3%' is div_yield gte 0.03"

[[phrase]]
say = ["volatile", "big moves", "choppy", "moves a lot"]
fields = ["feature.atr_pct", "rollup.price_stats@v2.hv20", "rollup.price_moves@v1.one_day_move"]
hint = "atr_pct gte 0.03 (daily range as a fraction of price); 'realised vol over 40%' is hv20 gte 0.40; 'had a big one-day move' is one_day_move gte 0.08"

[[phrase]]
say = ["good options", "tradable options", "tight spreads", "options liquidity"]
fields = ["feature.option_tier", "feature.option_chain_oi"]
hint = "option_tier in [A, B] (A best); 'open interest over N' is option_chain_oi gte N; add instrument.optionable eq true"

[[phrase]]
say = ["cheap valuation", "low P/E", "growing", "revenue growth"]
fields = ["feature.pe_ratio", "feature.revenue_growth_yoy"]
hint = "pe_ratio lt 15 (trailing); 'growing revenue' is revenue_growth_yoy gt 0.10 (a fraction)"

[[phrase]]
say = ["cheap on sales", "low price to sales", "low P/S"]
fields = ["feature.ps_ratio", "feature.net_margin"]
hint = "ps_ratio lt 2 (market cap over trailing sales), soft with tolerance 0.5; add net_margin gt 0.05 so it is not just a thin margin; '5 to 10' is the growth price, ps_ratio between 5 and 10"

[[phrase]]
say = ["high margin", "high margins", "fat margins"]
fields = ["feature.net_margin"]
hint = "net_margin gte 0.10 (a fraction, 0.10 is 10%) for a healthy business, soft with tolerance 0.03; gte 0.20 for a franchise; margins differ by sector, so pair with an instrument.sector gate"

[[phrase]]
say = ["safe dividend", "sustainable dividend", "covered dividend"]
fields = ["feature.payout_ratio", "feature.div_yield"]
hint = "payout_ratio between 0 and 0.60 (a fraction; never a bare lt 0.6: a negative payout is a payer with negative earnings) and div_yield gte 0.02 so there is a dividend; above 1.0 is unsustainable"

[[phrase]]
say = ["earnings growth", "growing earnings", "EPS growth"]
fields = ["feature.eps_growth_qtr_yoy", "feature.eps_growth_yoy"]
hint = "eps_growth_qtr_yoy gte 0.25 (the latest quarter against a year earlier, a fraction) and eps_growth_yoy gte 0.25 for the year, soft with tolerance 0.05; both are null from a loss, so a turnaround is not matched"

[[phrase]]
say = ["accelerating earnings", "earnings acceleration", "CAN SLIM earnings"]
fields = ["feature.eps_growth_qtr_yoy", "feature.eps_growth_yoy", "feature.revenue_growth_qtr_yoy"]
hint = "eps_growth_qtr_yoy gte 0.25 as the gate, eps_growth_yoy gte 0.25 and revenue_growth_qtr_yoy gte 0.25 as confirmations; accelerating means the quarterly rate is above the yearly one, which the rule grammar cannot compare, so state both thresholds"

[[phrase]]
say = ["buying back shares", "buybacks", "shrinking share count"]
fields = ["feature.shares_change_yoy"]
hint = "shares_change_yoy lte -0.01 (a fraction, -0.03 is a 3% smaller count), soft with tolerance 0.01; 1 to 5% a year is a steady repurchaser"

[[phrase]]
say = ["diluting", "dilution", "issuing shares"]
fields = ["feature.shares_change_yoy"]
hint = "shares_change_yoy gt 0.10 finds dilution above 10% a year; 'no dilution' is shares_change_yoy lte 0.10, soft with tolerance 0.03"

[[phrase]]
say = ["near support", "near resistance", "room to run"]
fields = ["feature.dist_to_support", "feature.dist_to_resistance"]
hint = "near support: dist_to_support lte 0.03 (fraction of price); room to run: dist_to_resistance gte 0.10"

[[phrase]]
say = ["stocks", "ETFs", "optionable", "active"]
fields = ["instrument.security_type", "instrument.optionable", "instrument.status"]
hint = "stocks: security_type in [COMMON_STOCK, ADR]; ETFs: security_type in [ETF]; optionable: optionable eq true; always status eq ACTIVE"

[[phrase]]
say = ["volume drying up", "quiet volume", "volume contraction", "dried-up volume", "tight and quiet"]
fields = ["feature.volume_dry_up", "rollup.volume@v1.volume_ratio_5d_20d"]
hint = "volume_dry_up eq true (the last 5 sessions under 60% of the 20-session average); or volume_ratio_5d_20d lte 0.6 soft with tolerance 0.1 to rank how dry; pair with feature.range_20d_pct lte for a tight base"

[[phrase]]
say = ["accumulation", "being accumulated", "buyers in control", "distribution", "under distribution", "sellers in control", "money flowing in"]
fields = ["feature.volume_bias", "rollup.volume@v1.up_volume_share_20d", "rollup.volume@v1.cmf_20d"]
hint = "volume_bias eq ACCUMULATION (DISTRIBUTION for the sellers); or up_volume_share_20d gte 0.6 (lte 0.4) soft with tolerance 0.05 to rank; 'money flowing in' is cmf_20d gte 0.1 soft (lte -0.1 for out); check rollup.earnings@v1.last_earnings_date: one earnings day can set the whole window"

[[phrase]]
say = ["volume climax", "capitulation volume", "climactic volume", "unusual volume", "volume spike"]
fields = ["feature.volume_climax", "rollup.volume@v1.volume_z_20d", "rollup.momentum@v1.rel_volume"]
hint = "volume_climax eq true (3 standard deviations above the 20 sessions before); 'unusual volume' alone is volume_z_20d gte 2 soft or rel_volume gte 3; most climaxes are earnings: check rollup.earnings@v1.last_earnings_date"

[[phrase]]
say = ["tested support twice", "support held twice", "double bottom support", "multiple tests of support"]
fields = ["rollup.pivot_strength@v1.support_touches", "feature.dist_to_support_atr", "feature.trend_state"]
hint = "support_touches gte 2 (soft with tolerance 1); gate with dist_to_support_atr lte 1 so the price is at the level now, and trend_state eq UPTREND; a floor tested many times is not safer, only more watched"

[[phrase]]
say = ["higher highs and higher lows", "higher highs higher lows", "uptrend structure", "lower highs and lower lows", "downtrend structure"]
fields = ["rollup.pivot_strength@v1.pivot_structure", "feature.trend_state"]
hint = "pivot_structure eq HH_HL (LH_LL for lower highs and lower lows); it reads the last two swing highs and lows, so confirm with trend_state eq UPTREND (DOWNTREND) when both the pivots and the averages should agree"

[[phrase]]
say = ["breakout retest", "retest of the breakout", "pullback to the breakout level", "breakout that held", "broken resistance as support"]
fields = ["rollup.retest@v1.retest_state", "feature.breakout_retest_held", "feature.breakout_failed"]
hint = "retest_state in [RETESTING, HELD] for a breakout that came back to its level and held; RETESTING alone is the retest happening today; breakout_retest_held eq true is the HELD half; a failed breakout is breakout_failed eq true, never in this set"

[[phrase]]
say = ["unfilled gap above", "gap overhead", "open gap above", "unfilled gap below", "gap fill", "gap support"]
fields = ["feature.dist_to_gap_above", "feature.dist_to_gap_below"]
hint = "unfilled gap above: dist_to_gap_above lte 0.05 (fraction of price; a down gap still overhead, resistance); unfilled gap below: dist_to_gap_below lte 0.05 (an up gap still unfilled under the price, support); both are null when none, so a hard criterion needs one to exist"

[[phrase]]
say = ["squeeze", "coiling", "volatility contraction", "tight bands", "narrow range", "building a base"]
fields = ["feature.bb_squeeze", "rollup.bands@v2.bb_width_pctile_252d", "rollup.trend_stats@v2.tight_range_sessions"]
hint = "gate: bb_squeeze eq true, or bb_width_pctile_252d lte 0.10 (narrower than 90% of the year); tight_range_sessions gte 10 for a base at least two weeks old; do not add a momentum gate, a squeeze is a pre-move state"

[[phrase]]
say = ["stretched", "extended", "far above its average", "overextended", "parabolic"]
fields = ["feature.stretch_sma20_atr", "feature.price_z_20d", "feature.bb_pct_b"]
hint = "stretch_sma20_atr gte 3 (three ATRs above the 20-session mean), or price_z_20d gte 2 (on the upper band), or bb_pct_b gt 1; negative values for 'stretched below'"

[[phrase]]
say = ["at the lower band", "below the band", "washed out", "mean reversion long"]
fields = ["feature.bb_pct_b", "feature.price_z_20d", "feature.trend_state"]
hint = "bb_pct_b lte 0 (at or under the lower Bollinger band) or price_z_20d lte -2; pair with trend_state eq UPTREND or feature.pct_vs_sma_200 gt 0 so it is a dip, not a downtrend"

[[phrase]]
say = ["12-month momentum", "one-year momentum", "long-term momentum", "momentum factor"]
fields = ["rollup.trend_stats@v2.mom_12_1", "rollup.trend_stats@v2.ret_252d"]
hint = "mom_12_1 gt 0 as the gate (the last month skipped, the factor definition); ret_252d for the plain one-year return"

[[phrase]]
say = ["winning streak", "up days in a row", "consecutive up days", "down days in a row", "losing streak"]
fields = ["rollup.trend_stats@v2.close_streak"]
hint = "close_streak gte 5 for five up closes in a row, lte -5 for five down; a long streak is a short-term reversal setup more than a trend signal"

[[phrase]]
say = ["big move today", "unusual move", "outsized day", "shock day"]
fields = ["rollup.trend_stats@v2.ret_z_20d", "rollup.volume@v1.volume_z_20d"]
hint = "ret_z_20d gte 3 for an up shock, lte -3 for a down one (three times the normal daily move); confirm with volume_z_20d gte 2"

[[phrase]]
say = ["covered call", "covered calls", "sell calls against shares", "call to write"]
fields = ["rollup.call_wing@v1.wing_status", "rollup.call_wing@v1.best_call_yield", "feature.call_otm_pct", "feature.cc_yield_annualised"]
hint = "the call at the 30 to 60 day expiry nearest 45 days, 15 to 30 delta (ours): wing_status eq OK, soft with tolerance 0 (the near miss is OUTSIDE_BAND); rank by best_call_yield (0.01 is 1% for the term) or cc_yield_annualised gte 0.10; call_otm_pct gte 0.04 for room before the shares are called away; add feature.ex_div_before_expiry eq false when the sentence says early assignment"

[[phrase]]
say = ["call premium yield", "premium yield", "covered call yield", "call income"]
fields = ["rollup.call_wing@v1.best_call_yield", "feature.cc_yield_annualised"]
hint = "best_call_yield gte 0.01 (decimal, per term: 0.01 is 1%), soft with tolerance 0.003; cc_yield_annualised gte 0.10 for a yearly rate (0.10 is 10%); a high yield is a high IV, so do not gate on it alone"

[[phrase]]
say = ["strike above resistance", "call strike above resistance", "above the swing high"]
fields = ["feature.call_strike_above_resistance", "feature.cc_resistance_cushion_atr"]
hint = "call_strike_above_resistance eq true, soft with tolerance 0; cc_resistance_cushion_atr gte 1 (average days' range of room above the swing high) as the ATR-scaled version; both are null when no swing high above the close is confirmed"

[[phrase]]
say = ["ex-dividend before expiry", "ex-dividend date before expiry", "dividend before expiry", "no dividend before expiry"]
fields = ["feature.ex_div_before_expiry", "feature.ex_div_before_nearest_expiry", "rollup.dividend_schedule@v1.days_to_ex_date"]
hint = "ex_div_before_expiry eq false for no known ex-dividend date before the 30 to 60 day wing expiry, soft with on_miss EVENT_RISK (it is null while no date is listed; the source lists dates about 30 days ahead); ex_div_before_nearest_expiry for the nearest expiry; days_to_ex_date lte 7 is the early-assignment window"

[[phrase]]
say = ["early assignment risk", "early assignment", "assigned early"]
fields = ["feature.ex_div_before_expiry", "feature.ex_div_before_nearest_expiry", "rollup.dividend_schedule@v1.next_div_amount", "rollup.call_wing@v1.best_call_delta"]
hint = "an in-the-money short call is assigned early just before an ex-dividend date: ex_div_before_nearest_expiry eq false (no known ex-date before the nearest expiry), soft with on_miss EVENT_RISK; best_call_delta lte 0.30 keeps the call out of the money; next_div_amount against the call's mid says whether the dividend exceeds the time value"

[[phrase]]
say = ["volatility expanding", "range expansion", "ATR expanding", "volatility contracting", "ATR contracting", "quiet for this name"]
fields = ["feature.atr_ratio_5_20", "feature.hv_ratio_10_60", "rollup.vol_stats@v1.hv20_pctile_252d"]
hint = "expanding: atr_ratio_5_20 gte 1.2 (or hv_ratio_10_60 gte 1.3); contracting: atr_ratio_5_20 lte 0.8; 'calm for this name' is hv20_pctile_252d lte 0.15 (its own year, not a level)"

[[phrase]]
say = ["heavy volume level", "point of control", "value area", "high volume node", "thin air", "low volume node", "volume shelf"]
fields = ["feature.dist_to_poc", "feature.in_value_area", "rollup.volume_profile@v1.volume_near_close_share", "rollup.volume_profile@v1.hvn_above", "rollup.volume_profile@v1.lvn_above"]
hint = "near the point of control: dist_to_poc between -0.03 and 0.03; at a heavy level: volume_near_close_share gte 0.15; in thin air: volume_near_close_share lte 0.05 or in_value_area eq false; the node levels are compared with the close, not thresholded"

[[phrase]]
say = ["turnover", "actively traded relative to float", "volume building", "volume trend up", "busiest day of the year"]
fields = ["feature.turnover_20d", "feature.volume_trend_20_60", "rollup.vol_stats@v1.volume_pctile_252d"]
hint = "turnover_20d gte 0.01 for 1% of the company a day; volume_trend_20_60 gte 1.2 for a month busier than the quarter; volume_pctile_252d gte 0.95 for one of the year's busiest sessions"

[[phrase]]
say = ["pocket pivot", "accumulation day", "up day on heavy volume inside the base"]
fields = ["rollup.vol_stats@v1.pocket_pivot", "rollup.momentum@v1.rel_volume"]
hint = "pocket_pivot eq true; add feature.pct_vs_ema_20 gt 0 and rollup.trend_stats@v2.tight_range_sessions gte 10 so it is inside a base"

[[phrase]]
say = ["dividend before the call expires", "ex-dividend during the covered call", "collect the dividend with a covered call"]
fields = ["feature.ex_div_before_call_expiry", "rollup.call_wing@v1.best_call_delta"]
hint = "ex_div_before_call_expiry eq true to collect it (with best_call_delta lte 0.3 so the call is not assigned first), eq false to avoid the assignment question; null means no date is known yet, not none"
