# L3 site setting: the macro series and index levels stored in macro/series (ADR 0048), typed
# in src/algotrade/config/site/macro.py. Feature groups read one as `series:<KEY>`; its id is
# MACRO:<KEY> (kind = "macro") or IDX:<KEY> (kind = "index").
#
# key               the series' name here; `code` is the vendor's code when it differs
# source            "fred" (FRED / ALFRED API, key from ALGOTRADE_FRED_API_KEY) or "published"
#                   (a file at `url` read by `parser`, with `date_column` and `value_column`)
# kind              "macro" (an economic series) or "index" (an index level)
# cadence           daily, weekly, monthly or quarterly
# release_lag_days  calendar days from an observation to its publication: the vintage date of a
#                   pit = "lag" series and how stale a series may get; conservative (errs late)
# pit               "alfred" (every vintage from ALFRED; fred only) or "lag" (unrevised series:
#                   vintage_date = obs_date + release_lag_days, vintage_kind = "lagged")
# transform         how the macro group reads it: level, yoy (year-over-year change) or diff
# licence, terms    "personal" for data licensed for personal use only: third-party series on FRED
#                   (ICE BofA, Moody's, Nasdaq, Cboe) and Stooq (ADR 0028)
# revised           true for a pit = "lag" file whose history is re-estimated in place (EBP, OFR
#                   FSI, EPU): its values are revised although they have no vintages, so the
#                   regime scorecard reports episodes that relied on them (ALFRED series are)

[macro]
run_budget_s = 900            # the macro task stops fetching series after this many seconds and
                              # records the rest as skipped (a FRED outage must not hold the nightly up)

