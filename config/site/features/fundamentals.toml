# Expression features over fundamentals and dividends (L3; ADR 0023 step 3).
# Language and keys: docs/configuration.md "Expression features".

[div_yield]
expr = "if(price_stats.close > 0, dividends.div_ttm / price_stats.close, null)"
dtype = "float32"
unit = "decimal"
description = "Trailing dividend yield: div_ttm / close; the continuous q in option pricing (iv30 reads it, so it is stored)"
null_meaning = "dividends div_ttm is null (no dividend in the window and too little bar history to call it a non-payer), or the close is not positive"
valid_range = [0, 1]
materialise = true  # iv30@v1 prices with it: stored as rollups/instrument/div_yield@v1
version = 1

[market_cap]
expr = 'if(fundamentals.market_cap_status == "OK", fundamentals.shares_outstanding * price_stats.close, null)'
dtype = "float"
unit = "usd"
description = "shares_outstanding x close (the company total times this class's close)"
null_meaning = "fundamentals market_cap_status is not OK (no count, a stale count, or no close)"
valid_range = [0, inf]
version = 1

[pe_ratio]
expr = "if(financials.eps_diluted_ttm > 0 and price_stats.close > 0 and not financials.eps_stale and not financials.is_adr, price_stats.close / financials.eps_diluted_ttm, null)"
dtype = "float"
unit = "ratio"
description = "Trailing P/E: close / diluted EPS over the trailing twelve months. Null when the company lost money (EPS <= 0: a negative P/E is not shown), when the EPS is stale, and for an ADR (its EPS is per ordinary share and the ADR ratio is not stored). Every share class of a company uses the company's EPS: only meaningful when the classes have equal economics"
null_meaning = "financials eps_diluted_ttm is null or not positive (a loss; ETFs and funds have none), the close is not positive, eps_stale (the EPS TTM ended more than stale_days before the session), or the instrument is an ADR"
valid_range = [0, inf]
version = 1

[revenue_growth_yoy]
expr = "if(financials.revenue_ttm_year_ago > 0, financials.revenue_ttm / financials.revenue_ttm_year_ago - 1, null)"
dtype = "float"
unit = "decimal"
description = "Revenue growth year over year: the trailing-twelve-month revenue against the same TTM a year earlier"
null_meaning = "revenue_ttm or revenue_ttm_year_ago is null (fewer than two years of reported quarters or fiscal years), or the year-ago revenue is not positive"
valid_range = [-1, inf]
version = 1
