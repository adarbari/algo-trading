# Expression features comparing implied and realised volatility (L3; ADR 0023 step 3).
# Language and keys: docs/configuration.md "Expression features".

[iv_hv_spread]
expr = "iv_history.iv30 - price_stats.hv30"
dtype = "float"
unit = "decimal"
description = "IV30 minus HV30 (iv_history, price_stats): the variance risk premium's raw input"
null_meaning = "iv30 or hv30 is null (no IV for the session, or a gap in the last 31 sessions)"
valid_range = [-5, 5]
version = 1

[iv_hv_ratio]
expr = "if(price_stats.hv30 > 0, iv_history.iv30 / price_stats.hv30, null)"
dtype = "float"
unit = "ratio"
description = "IV30 / HV30 (iv_history, price_stats)"
null_meaning = "iv30 or hv30 is null, or hv30 is 0"
valid_range = [0, inf]
version = 1

# IV rank with a labelled fallback (owner decision 2026-10-03, ADR 0028): IBKR's rank where it
# has one (ibkr_iv, a year of IB's own IV history), else ours (iv_history, from Cboe chains);
# iv_rank_source always says which. Reading ibkr_iv makes these personal-licence features.

[iv_rank]
expr = "coalesce(ibkr_iv.iv_rank_252d_ibkr, iv_history.iv_rank_252d)"
dtype = "float"
unit = "decimal"
description = "IV rank over 252 sessions: IBKR's (ibkr_iv) where it has one, else ours (iv_history); iv_rank_source says which"
null_meaning = "neither has a rank: both rank statuses are UNKNOWN (under 60 sessions of IV), there is no IV today, or every IV in the window is equal"
valid_range = [0, 1]
version = 1

[iv_percentile]
expr = "coalesce(ibkr_iv.iv_percentile_252d_ibkr, iv_history.iv_percentile_252d)"
dtype = "float"
unit = "decimal"
description = "IV percentile over 252 sessions: IBKR's (ibkr_iv) where it has one, else ours (iv_history); iv_rank_source says which"
null_meaning = "neither has a percentile: both rank statuses are UNKNOWN, there is no IV today, or no earlier IV"
valid_range = [0, 1]
version = 1

[iv_rank_source]
kind = "label"
expr = '''
if(not is_null(ibkr_iv.iv_rank_252d_ibkr), "ibkr",
   if(not is_null(iv_history.iv_rank_252d), "ours", null))
'''
dtype = "str"
unit = "category"
categories = ["ibkr", "ours"]
description = "Where iv_rank and iv_percentile came from: ibkr (IBKR's IV history) or ours (iv_history, from Cboe chains)"
null_meaning = "iv_rank is null (neither source has a rank)"
version = 1

# Volatility expansion and contraction over vol_stats@v1 (TA track, docs/data/technical.md).

[atr_ratio_5_20]
expr = "vol_stats.atr_5 / vol_stats.atr_20"
dtype = "float"
unit = "ratio"
description = "ATR(5) / ATR(20): above 1 the daily range is expanding (this week wider than the month), below 1 contracting; 1.3 is a clear expansion, 0.7 a tight week"
null_meaning = "atr_5 or atr_20 is null (fewer than 21 consecutive bars), or atr_20 is 0"
valid_range = [0, inf]
version = 1

[hv_ratio_10_60]
expr = "vol_stats.hv10 / vol_stats.hv60"
dtype = "float"
unit = "ratio"
description = "Realised vol over 10 sessions / over 60: above 1 the last two weeks were more volatile than the quarter, below 1 calmer"
null_meaning = "hv10 or hv60 is null (a gap among the last 61 sessions, or a shorter history), or hv60 is 0"
valid_range = [0, inf]
version = 1
