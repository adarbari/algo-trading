# Expression features over the event study (ADR 0050 EV6, docs/event-sensitivity-plan.md 5.4): what
# is coming that has moved this name before, against the nearest option expiry. An impact event is
# one whose class has a median reaction of at least `impact_multiple` normal days for the name
# (event_reaction@v1: macro releases over three years with at least `min_macro` of them, own
# earnings with at least `min_earnings` reports); the dates are the next reaction sessions of the
# release calendar (event_calendar@v1) and the next report (earnings; a report made today has
# reacted already and is not ahead). A calendar that does not reach the horizon (event_calendar
# .calendar_through) makes the feature null, never zero. Language and keys: docs/configuration.md
# "Expression features".

[days_to_next_impact_event]
expr = '''
if(event_reaction.reaction_status == "OK" and not is_null(event_calendar.calendar_through),
   if(min(
   coalesce(if(event_reaction.macro_cpi_n >= min_macro and event_reaction.macro_cpi_multiple_median >= impact_multiple, event_calendar.cpi_sessions_to, null), never),
   coalesce(if(event_reaction.macro_employment_n >= min_macro and event_reaction.macro_employment_multiple_median >= impact_multiple, event_calendar.employment_sessions_to, null), never),
   coalesce(if(event_reaction.macro_pce_n >= min_macro and event_reaction.macro_pce_multiple_median >= impact_multiple, event_calendar.pce_sessions_to, null), never),
   coalesce(if(event_reaction.macro_gdp_n >= min_macro and event_reaction.macro_gdp_multiple_median >= impact_multiple, event_calendar.gdp_sessions_to, null), never),
   coalesce(if(event_reaction.macro_ppi_n >= min_macro and event_reaction.macro_ppi_multiple_median >= impact_multiple, event_calendar.ppi_sessions_to, null), never),
   coalesce(if(event_reaction.macro_retail_sales_n >= min_macro and event_reaction.macro_retail_sales_multiple_median >= impact_multiple, event_calendar.retail_sales_sessions_to, null), never),
   coalesce(if(event_reaction.macro_ism_mfg_n >= min_macro and event_reaction.macro_ism_mfg_multiple_median >= impact_multiple, event_calendar.ism_mfg_sessions_to, null), never),
   coalesce(if(event_reaction.macro_ism_services_n >= min_macro and event_reaction.macro_ism_services_multiple_median >= impact_multiple, event_calendar.ism_services_sessions_to, null), never),
   coalesce(if(event_reaction.macro_fomc_n >= min_macro and event_reaction.macro_fomc_multiple_median >= impact_multiple, event_calendar.fomc_sessions_to, null), never),
   coalesce(if(event_reaction.earnings_n >= min_earnings and event_reaction.earnings_multiple_median >= impact_multiple and earnings.days_to_earnings >= 1, earnings.days_to_earnings, null), never)
   ) >= never, null, min(
   coalesce(if(event_reaction.macro_cpi_n >= min_macro and event_reaction.macro_cpi_multiple_median >= impact_multiple, event_calendar.cpi_sessions_to, null), never),
   coalesce(if(event_reaction.macro_employment_n >= min_macro and event_reaction.macro_employment_multiple_median >= impact_multiple, event_calendar.employment_sessions_to, null), never),
   coalesce(if(event_reaction.macro_pce_n >= min_macro and event_reaction.macro_pce_multiple_median >= impact_multiple, event_calendar.pce_sessions_to, null), never),
   coalesce(if(event_reaction.macro_gdp_n >= min_macro and event_reaction.macro_gdp_multiple_median >= impact_multiple, event_calendar.gdp_sessions_to, null), never),
   coalesce(if(event_reaction.macro_ppi_n >= min_macro and event_reaction.macro_ppi_multiple_median >= impact_multiple, event_calendar.ppi_sessions_to, null), never),
   coalesce(if(event_reaction.macro_retail_sales_n >= min_macro and event_reaction.macro_retail_sales_multiple_median >= impact_multiple, event_calendar.retail_sales_sessions_to, null), never),
   coalesce(if(event_reaction.macro_ism_mfg_n >= min_macro and event_reaction.macro_ism_mfg_multiple_median >= impact_multiple, event_calendar.ism_mfg_sessions_to, null), never),
   coalesce(if(event_reaction.macro_ism_services_n >= min_macro and event_reaction.macro_ism_services_multiple_median >= impact_multiple, event_calendar.ism_services_sessions_to, null), never),
   coalesce(if(event_reaction.macro_fomc_n >= min_macro and event_reaction.macro_fomc_multiple_median >= impact_multiple, event_calendar.fomc_sessions_to, null), never),
   coalesce(if(event_reaction.earnings_n >= min_earnings and event_reaction.earnings_multiple_median >= impact_multiple and earnings.days_to_earnings >= 1, earnings.days_to_earnings, null), never)
   )),
   null)
'''
params = { impact_multiple = 1.5, min_earnings = 4, min_macro = 8, never = 100000 }
dtype = "int"
unit = "sessions"
valid_range = [1, inf]
description = "Exchange sessions to the first coming event whose kind has moved the name by at least 1.5 normal days at the median (a macro release with at least 8 behind the median, or its own earnings with at least 4): event_reaction's per-kind multiples against the release calendar and the next report date"
null_meaning = "the name has under 250 sessions of bars (event_reaction.reaction_status is not OK), the release calendar is not stored, or no coming event of a kind that has moved it that much is listed (a calendar's horizon is not a quiet period: event_calendar.calendar_through says how far it reaches)"
version = 1

[impact_events_before_expiry]
expr = '''
if(is_null(nearest_expiry.expiry_date) or event_reaction.reaction_status != "OK"
   or is_null(event_calendar.calendar_through)
   or event_calendar.calendar_through < nearest_expiry.expiry_date, null,
   (
   coalesce(if(event_reaction.macro_cpi_n >= min_macro and event_reaction.macro_cpi_multiple_median >= impact_multiple and event_calendar.cpi_next_date <= nearest_expiry.expiry_date, 1, 0), 0) +
   coalesce(if(event_reaction.macro_employment_n >= min_macro and event_reaction.macro_employment_multiple_median >= impact_multiple and event_calendar.employment_next_date <= nearest_expiry.expiry_date, 1, 0), 0) +
   coalesce(if(event_reaction.macro_pce_n >= min_macro and event_reaction.macro_pce_multiple_median >= impact_multiple and event_calendar.pce_next_date <= nearest_expiry.expiry_date, 1, 0), 0) +
   coalesce(if(event_reaction.macro_gdp_n >= min_macro and event_reaction.macro_gdp_multiple_median >= impact_multiple and event_calendar.gdp_next_date <= nearest_expiry.expiry_date, 1, 0), 0) +
   coalesce(if(event_reaction.macro_ppi_n >= min_macro and event_reaction.macro_ppi_multiple_median >= impact_multiple and event_calendar.ppi_next_date <= nearest_expiry.expiry_date, 1, 0), 0) +
   coalesce(if(event_reaction.macro_retail_sales_n >= min_macro and event_reaction.macro_retail_sales_multiple_median >= impact_multiple and event_calendar.retail_sales_next_date <= nearest_expiry.expiry_date, 1, 0), 0) +
   coalesce(if(event_reaction.macro_ism_mfg_n >= min_macro and event_reaction.macro_ism_mfg_multiple_median >= impact_multiple and event_calendar.ism_mfg_next_date <= nearest_expiry.expiry_date, 1, 0), 0) +
   coalesce(if(event_reaction.macro_ism_services_n >= min_macro and event_reaction.macro_ism_services_multiple_median >= impact_multiple and event_calendar.ism_services_next_date <= nearest_expiry.expiry_date, 1, 0), 0) +
   coalesce(if(event_reaction.macro_fomc_n >= min_macro and event_reaction.macro_fomc_multiple_median >= impact_multiple and event_calendar.fomc_next_date <= nearest_expiry.expiry_date, 1, 0), 0) +
   coalesce(if(event_reaction.earnings_n >= min_earnings and event_reaction.earnings_multiple_median >= impact_multiple and earnings.days_to_earnings >= 1 and earnings.next_earnings_date <= nearest_expiry.expiry_date, 1, 0), 0)
   ))
'''
params = { impact_multiple = 1.5, min_earnings = 4, min_macro = 8 }
dtype = "int"
unit = "count"
valid_range = [0, 10]
description = "How many kinds of coming event that have moved the name by at least 1.5 normal days at the median (a macro release with at least 8 behind the median, or its own earnings with at least 4) fall on or before the nearest listed option expiry; each kind counts once, by its next occurrence"
null_meaning = "no stored chain with an expiry on or after the session, the name has under 250 sessions of bars, or the release calendar does not reach the expiry (event_calendar.calendar_through is earlier or missing): a calendar that stops short is unknown, not event-free"
version = 1
