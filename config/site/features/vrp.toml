# Expression features of the VRP (IV / HV volatility premium) scanner (L3; ADR 0023 step 3,
# docs/screeners/vrp-scanner.md "Owner decisions (2026-10-03)"). The gate's IV30 is the
# lower of IBKR's and Cboe's when both exist, else whichever exists, else null (UNKNOWN);
# our own IV30 is not used. Reading ibkr_iv makes these personal-licence features (ADR 0028).
# Language and keys: docs/configuration.md "Expression features".

[vrp_iv30]
expr = "min(coalesce(ibkr_iv.iv30_ibkr, iv30.iv30_cboe), coalesce(iv30.iv30_cboe, ibkr_iv.iv30_ibkr))"
dtype = "float"
unit = "decimal"
description = "The VRP gate's IV30: the lower of IBKR's (ibkr_iv) and Cboe's (iv30.iv30_cboe) when both exist, else whichever exists; vrp_iv30_source says which"
null_meaning = "neither IBKR nor Cboe has an IV30 for the session"
valid_range = [0, 5]
version = 1

[vrp_iv30_source]
kind = "label"
expr = '''
if(is_null(vrp_iv30), null,
   if(is_null(iv30.iv30_cboe), "ibkr",
      if(is_null(ibkr_iv.iv30_ibkr), "cboe",
         if(ibkr_iv.iv30_ibkr <= iv30.iv30_cboe, "ibkr", "cboe"))))
'''
dtype = "str"
unit = "category"
categories = ["ibkr", "cboe"]
description = "Where vrp_iv30 came from: ibkr or cboe (the lower one when both exist; ibkr on a tie)"
null_meaning = "vrp_iv30 is null (neither source has an IV30)"
version = 1

[vrp_iv_hv_spread]
expr = "vrp_iv30 - price_stats.hv30"
dtype = "float"
unit = "decimal"
description = "vrp_iv30 minus HV30 (price_stats): the VRP scanner's volatility premium"
null_meaning = "vrp_iv30 or hv30 is null (no IV30 from IBKR or Cboe, or a gap in the last 31 sessions)"
valid_range = [-5, 5]
version = 1

[vrp_iv_hv_ratio]
expr = "vrp_iv30 / price_stats.hv30"
dtype = "float"
unit = "ratio"
description = "vrp_iv30 / HV30 (price_stats): plain ratio, no HV30 floor (owner decision 2026-10-03)"
null_meaning = "vrp_iv30 or hv30 is null, or hv30 is 0"
valid_range = [0, inf]
version = 1
