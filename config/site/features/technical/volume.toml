# Volume: drying up, event-sized days and accumulation / distribution. Formulas over
# volume@v1, computed on read. The language and the keys: docs/configuration.md "Expression
# features". Changing a formula or a param: bump its version.

[volume_dry_up]
expr = "volume.volume_ratio_5d_20d < max_ratio"
params = { max_ratio = 0.6 }  # the last week under 60% of the 20-session average volume
dtype = "bool"
unit = "flag"
description = "The last 5 sessions traded under 60% (params.max_ratio) of the 20-session average volume: the contraction that often precedes a breakout"
null_meaning = "volume_ratio_5d_20d is null (a gap among the last 20 sessions, a shorter history, or no volume at all over the 20)"
version = 1

[volume_climax]
expr = "volume.volume_z_20d >= min_z"
params = { min_z = 3.0 }  # standard deviations above the 20 sessions before the session
dtype = "bool"
unit = "flag"
description = "The session's volume is 3 (params.min_z) or more standard deviations above the 20 sessions before it: an event-sized day (earnings, news, an index event or a capitulation)"
null_meaning = "volume_z_20d is null (a gap among the last 21 sessions, a shorter history, or the 20 sessions before all had the same volume)"
version = 1

[volume_bias]
kind = "label"
expr = '''
if(is_null(volume.up_volume_share_20d), null,
   if(volume.up_volume_share_20d >= accumulation_at, "ACCUMULATION",
      if(volume.up_volume_share_20d <= distribution_at, "DISTRIBUTION", "NEUTRAL")))
'''
params = { accumulation_at = 0.6, distribution_at = 0.4 }  # up-volume share bounds (edges included)
dtype = "str"
unit = "category"
categories = ["ACCUMULATION", "DISTRIBUTION", "NEUTRAL"]
description = "ACCUMULATION when 60% (params.accumulation_at) or more of the last 20 sessions' volume traded on up days, DISTRIBUTION at 40% (params.distribution_at) or less, else NEUTRAL"
null_meaning = "up_volume_share_20d is null (a gap among the last 21 sessions, a shorter history, or no volume at all over the 20)"
version = 1

[volume_trend_20_60]
expr = "volume.adv_shares_20d / vol_stats.adv_shares_60d"
dtype = "float"
unit = "ratio"
description = "The 20-session average volume / the 60-session average: above 1 activity is building over the quarter, below 1 fading; 1.3 is a clear pick-up"
null_meaning = "adv_shares_20d or adv_shares_60d is null (a gap among the last 60 sessions, or a shorter history), or the 60-session average is 0"
valid_range = [0, inf]
version = 1

[turnover_20d]
expr = "volume.adv_shares_20d / fundamentals.shares_outstanding"
dtype = "float"
unit = "decimal"
description = "Daily turnover: the 20-session average share volume / shares outstanding, 0.01 means 1% of the company changes hands a day (about a 100-session holding period). Both inputs are split-adjusted to the session"
null_meaning = "adv_shares_20d is null (a gap among the last 20 sessions), or shares_outstanding is null (no share count filed, or STALE: fundamentals market_cap_status)"
valid_range = [0, inf]
version = 1

[volume_shock]
expr = "volume.volume_z_20d >= min_z"
params = { min_z = 2.0 }  # standard deviations above the 20 sessions before the session
dtype = "bool"
unit = "flag"
description = "The session's volume is 2 (params.min_z) or more standard deviations above the 20 sessions before it: the unusually high volume of the volume-shock premium (Gervais, Kaniel and Mingelgrin 2001); a lower bar than volume_climax, which is event-sized"
null_meaning = "volume_z_20d is null (a gap among the last 21 sessions, a shorter history, or the 20 sessions before all had the same volume)"
version = 1

[news_free_5d]
expr = "filing_activity.filing_count_5d == 0 and not filing_activity.earnings_in_5d"
dtype = "bool"
unit = "flag"
description = "No 8-K or 8-K/A was filed through the previous session (5 sessions) and no earnings reaction window touched the last 5 sessions, as known on the session: nothing identifiable explains a move in them"
null_meaning = "filing_count_5d is null (no clean filings walk has reached the previous session, no filing stored for the instrument, or the backfill starts after the span) or earnings_in_5d is null (no earnings report known for it), and the other term does not already make it false"
version = 1

[volume_shock_no_news]
expr = "volume_shock and news_free_5d"
dtype = "bool"
unit = "flag"
description = "A volume shock (volume_shock) with nothing to explain it (news_free_5d): the setup the volume-shock return premium trades"
null_meaning = "volume_shock or news_free_5d is null and the other term is not false"
version = 1
