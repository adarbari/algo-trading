# Expression features over price_stats and price_history (L3, reviewed via PR; ADR 0023 step 3). Each [name] is
# one feature: a formula over stored features (group.column), other expression features (by
# name) and its own params. Computed on read unless materialise = true. The language and the
# keys: docs/configuration.md "Expression features". Changing a formula: bump its version.

[pct_from_high_52w]
expr = "price_stats.close / price_stats.high_52w - 1"
dtype = "float"
unit = "decimal"
description = "Close / 52-week high - 1 (at or below 0)"
null_meaning = "price_stats high_52w is null (fewer than 240 bars in the last 252 sessions), or no price_stats row"
valid_range = [-1, 0]
version = 1

[pct_from_high_avail]
expr = "price_stats.close / price_history.high_avail - 1"
dtype = "float"
unit = "decimal"
description = "Close / the high over the history available - 1 (at or below 0): the 52-week high, or the high since listing for a younger listing (price_history range_sessions says how many sessions)"
null_meaning = "no trade on the session (no price_stats row), or price_history high_avail is null (a listing under 20 sessions old, or a name trading too rarely for the window)"
valid_range = [-1, 0]
version = 1

[pct_from_low_52w]
expr = "price_stats.close / price_stats.low_52w - 1"
dtype = "float"
unit = "decimal"
description = "Close / 52-week low - 1 (at or above 0)"
null_meaning = "price_stats low_52w is null (fewer than 240 bars in the last 252 sessions), or no price_stats row"
valid_range = [0, inf]
version = 1

[near_52w]
kind = "label"
expr = '''
if(pct_from_high_52w >= -within and pct_from_low_52w <= within, "BOTH",
   if(pct_from_high_52w >= -within, "HIGH",
      if(pct_from_low_52w <= within, "LOW", "NONE")))
'''
params = { within = 0.10 }  # within 10% of the 52-week high / low
dtype = "str"
unit = "category"
categories = ["HIGH", "LOW", "BOTH", "NONE"]
description = "Where the close sits in its 52-week range: HIGH within 10% (params.within) of the high, LOW within 10% of the low, BOTH (a narrow range), else NONE"
null_meaning = "the 52-week high or low is unknown (pct_from_high_52w or pct_from_low_52w is null)"
version = 1

[dist_52w]
expr = "min(-pct_from_high_52w, pct_from_low_52w)"
dtype = "float"
unit = "decimal"
description = "Distance to the nearer 52-week extreme: the smaller of (high - close) / high and (close - low) / low (0 at an extreme)"
null_meaning = "the 52-week high or low is unknown (pct_from_high_52w or pct_from_low_52w is null)"
valid_range = [0, inf]
version = 1

[pct_vs_sma_20]
expr = "price_stats.close / price_stats.sma_20 - 1"
dtype = "float"
unit = "decimal"
description = "Close / 20-session moving average - 1"
null_meaning = "price_stats sma_20 is null (a gap among the last 20 sessions, or a shorter history), or no price_stats row"
valid_range = [-1, inf]
version = 1

[pct_vs_sma_50]
expr = "price_stats.close / price_stats.sma_50 - 1"
dtype = "float"
unit = "decimal"
description = "Close / 50-session moving average - 1"
null_meaning = "price_stats sma_50 is null (a gap among the last 50 sessions, or a shorter history), or no price_stats row"
valid_range = [-1, inf]
version = 1

[pct_vs_sma_200]
expr = "price_stats.close / price_stats.sma_200 - 1"
dtype = "float"
unit = "decimal"
description = "Close / 200-session moving average - 1"
null_meaning = "price_stats sma_200 is null (a gap among the last 200 sessions, or a shorter history), or no price_stats row"
valid_range = [-1, inf]
version = 1

# Relative strength (relative_strength@v1, docs/data/technical.md): the flags the owner's screens
# ask for, over the stored columns.
[rs_spy_positive]
expr = "relative_strength.rs_spy_63d > 0"
dtype = "bool"
unit = "flag"
description = "The instrument beat SPY over the last 63 sessions: rs_spy_63d above 0 (outperforming the market over a quarter)"
null_meaning = "rs_spy_63d is null (a gap in the 64 closes, or SPY not in the symbol map), or no relative_strength row"
version = 1

[rs_improving]
expr = "relative_strength.rs_spy_trend_20d > 0"
dtype = "bool"
unit = "flag"
description = "Relative strength against SPY is improving: rs_spy_trend_20d above 0 (the 63-session relative strength is higher than it was 20 sessions ago)"
null_meaning = "rs_spy_trend_20d is null (a gap in either 63-session window, or SPY not in the symbol map), or no relative_strength row"
version = 1

[sector_leader]
expr = "relative_strength.sector_rank_63d <= leader_rank"
params = { leader_rank = 3 }  # the strongest three of the eleven sector ETFs
dtype = "bool"
unit = "flag"
description = "The instrument's sector is one of the three strongest of the eleven sector ETFs over 63 sessions: sector_rank_63d at most 3 (params.leader_rank)"
null_meaning = "sector_rank_63d is null (no sector or sector ETF, the ETF has no complete window, or fewer than min_sector_etfs ETFs do), or no relative_strength row"
version = 1

# Momentum variants (docs/edge-ideas/statarb-technical.md; the residual, discreteness and sector
# columns are momentum_variants@v1)
[mom_12_1_vol_scaled]
expr = "trend_stats.mom_12_1 / vol_stats.hv60"
dtype = "float"
unit = "ratio"
description = "The 12-1 momentum divided by the 60-session realised volatility (annualised): the return earned per unit of risk the name carries, so a calm 20% outranks a wild 20%; 1.0 is a 12-1 return equal to a year of one-stdev moves"
null_meaning = "mom_12_1 is null (a gap among the last 253 sessions, or a shorter history), hv60 is null (a gap among the last 61 sessions) or 0, or no trend_stats or vol_stats row"
valid_range = [-100, 100]
version = 1

# Own-trend and cost-basis signals (docs/edge-ideas/cross-sectional.md stock_time_series_momentum,
# statarb-technical.md anchored_vwap_reversion_retest).
[stock_tsmom_sign]
expr = '''
if(is_null(trend_stats.ret_252d) or is_null(price_stats.sma_200), null,
   if(trend_stats.ret_252d > 0 and price_stats.close > price_stats.sma_200, 1,
      if(trend_stats.ret_252d < 0 and price_stats.close < price_stats.sma_200, -1, 0)))
'''
dtype = "float"
unit = "ratio"
description = "The name's own trend: 1 when its 252-session return is above 0 and the close is above the 200-session average, -1 when both are below, 0 when they disagree (the time-series momentum sign of Moskowitz, Ooi and Pedersen, confirmed by the average; the raw return is not an excess return over cash)"
null_meaning = "ret_252d or sma_200 is null (a gap among the last 253 sessions, or a shorter history), or no trend_stats or price_stats row"
valid_range = [-1, 1]
version = 1

[capital_gains_overhang]
expr = "(price_stats.close - anchored_vwap.avwap_earnings) / price_stats.close"
dtype = "float"
unit = "decimal"
description = "Where the close sits against the volume-weighted average price since the last earnings report: 0.05 is 5% above it, -0.05 is 5% below. A proxy for the capital-gains overhang of Grinblatt and Han, whose reference price is a turnover-weighted average over years of trading"
null_meaning = "avwap_earnings is null (no report in the last 126 sessions, fewer than 2 sessions since it, a gap in the range, or no volume), or no price_stats row"
valid_range = [-1000, 1]
version = 1
