# L3 site setting: the field guide (ADR 0041, amended 2026-10-06), one <theme>.toml per theme
# plus situations.toml; loaded together by config/site/settings.py load_field_guide. Every
# [[field]] says how to read one catalogue field, which criterion means what, and when the
# reading lies; a [[situation]] is one state of the world that fools several thresholds at once.
# The keys are documented in momentum.toml. Edit by PR; `make features-doc` renders the page.

[[field]]
name = "feature.market_cap"
theme = "fundamentals"
reads = "Shares outstanding times the close, in dollars. The usual US buckets: micro under $300M, small $300M to $2B, mid $2B to $10B, large $10B to $200B, mega above $200B. They are conventions, not rules: index providers draw the lines differently and names migrate across them as prices move."
caveats = [
  "The count is the company total and the price is this share class's, so a company with two listed classes shows the same cap on both only when they trade at the same price. Check rollup.fundamentals@v4.market_cap_status.",
  "Null for funds (no share count filed), for a stale count (rollup.fundamentals@v4.market_cap_status STALE) and for a company with no SEC filing (foreign private issuers); a hard size gate drops ETFs and many ADRs.",
  "Cap is size, not quality or liquidity: a $20B name can trade $5M a day (a controlled company) and a $500M name $50M (a meme). Pair with rollup.price_stats@v2.adv_usd_20d.",
]
sources = [
  "Market-cap bucket conventions: https://en.wikipedia.org/wiki/Market_capitalization and Morningstar's definitions",
]
[[field.use]]
for = "large cap"
op = "gte"
value = 10000000000
mode = "hard"
[[field.use]]
for = "mid cap"
op = "between"
value = [2000000000, 10000000000]
mode = "hard"
[[field.use]]
for = "small cap"
op = "between"
value = [300000000, 2000000000]
mode = "hard"
note = "under 300000000 is micro cap; pair with a liquidity gate"

[[field]]
name = "feature.pe_ratio"
theme = "fundamentals"
reads = "Close over diluted earnings per share of the trailing twelve months. The long-run market average is around 15 to 20; under 10 is cheap on its face, above 30 is priced for growth. It is only shown when the company earned money, when the figure is recent and when the shares are not an ADR, so a null is common and meaningful."
caveats = [
  "Cyclicals look cheapest at the top of their cycle: an oil producer or a chip maker at a P/E of 6 on peak earnings becomes 18 when earnings normalise without the price moving. Pair a low P/E with feature.revenue_growth_yoy and instrument.sector, or compare against several years of earnings (not stored).",
  "A low P/E is often a value trap: the market has priced in falling earnings, a shrinking industry or heavy debt. A low P/E in feature.trend_state DOWNTREND is the market disagreeing with the ratio.",
  "One-offs inside the twelve months (an asset sale, a tax gain, a write-down) swing EPS and the ratio; nothing here separates them.",
  "Null for loss makers (EPS at or below 0), ADRs and stale filings: a hard 'pe_ratio lt 15' silently removes every unprofitable company and every ADR. If that is not the intent, use mode score, or add rollup.financials@v3.financials_status.",
  "Sector ranges differ by a factor of three (banks and energy low, software high); a single market-wide cut-off mostly selects sectors.",
]
sources = [
  "Problems with taking P/E at face value: https://anurimabanerjee.substack.com/p/problems-with-taking-pe-at-face-value",
  "Cyclical peak earnings and value traps: https://moneyweek.com/10368/the-pitfalls-of-value-investing-53516",
  "Graham and Dodd; Shiller's cyclically adjusted P/E for the multi-year averaging idea",
]
[[field.use]]
for = "cheap on trailing earnings"
op = "lt"
value = 15
mode = "soft"
tolerance = 3
note = "with feature.revenue_growth_yoy gte 0 to keep out shrinking businesses; remember loss makers are null, not cheap"
[[field.use]]
for = "not priced for perfection"
op = "lte"
value = 30
mode = "score"
tolerance = 10

[[field]]
name = "feature.revenue_growth_yoy"
theme = "fundamentals"
reads = "Trailing-twelve-month revenue against the same twelve months a year earlier, as a fraction: 0.10 is 10% growth. Around 0.03 to 0.05 is nominal GDP-like; above 0.15 is a growth company; above 0.30 is rare outside early-stage names; negative is a shrinking business. It lags: the TTM ends at the last filed quarter, which can be four months old."
caveats = [
  "Acquisitions inflate reported growth and divestitures deflate it; companies report 'organic' growth for that reason and the catalogue has only the reported figure. A jump from 5% to 40% is usually a deal. Check instrument.sic or the company's filings before reading it as demand.",
  "A tiny year-ago base makes huge percentages (a company going from $10M to $30M is 200%); pair with feature.market_cap or rollup.financials@v3.revenue_ttm.",
  "Currency moves show up as growth or shrinkage for companies that earn abroad.",
  "Null with under two years of filings (recent IPOs, foreign filers, funds): a hard criterion rejects them. rollup.financials@v3.financials_status says why.",
]
sources = [
  "Organic versus reported revenue growth, as defined in issuers' filings (e.g. PepsiCo, Moody's 10-K definitions on sec.gov)",
]
[[field.use]]
for = "growing revenue"
op = "gte"
value = 0.10
mode = "soft"
tolerance = 0.03
[[field.use]]
for = "fast growth"
op = "gte"
value = 0.25
mode = "soft"
tolerance = 0.05
note = "check for an acquisition when the jump is sudden"
[[field.use]]
for = "not shrinking"
op = "gte"
value = 0
mode = "soft"
tolerance = 0.03

[[field]]
name = "feature.div_yield"
theme = "fundamentals"
reads = "Dividends paid in the trailing twelve months over the close, as a fraction: 0.03 is a 3% yield. The S&P 500 yields about 0.013 to 0.02; 0.03 to 0.05 is a solid income name; above 0.08 is where the market is usually pricing a cut (a yield trap: the yield rose because the price fell on the news that the payout cannot last); above 0.10 is a warning, not an opportunity."
caveats = [
  "A yield trap looks best right before the cut: a high yield with feature.trend_state DOWNTREND or rollup.price_stats@v2.ret_60d well below 0 is the market expecting the cut. Pair high-yield rules with a trend filter or with earnings coverage (rollup.financials@v3.eps_diluted_ttm above the dividend).",
  "A special dividend inflates the trailing twelve months for a year: rollup.dividends@v2.div_count_ttm above 4 for a quarterly payer is the sign.",
  "REITs, MLPs, BDCs and bond or covered-call ETFs yield 0.06 to 0.12 by structure; a market-wide 'above 5%' screen is mostly a list of those. Check instrument.sector and instrument.is_etf.",
  "Null for a non-payer with too little history to say so; 0 for a known non-payer. A hard 'gte 0.03' drops both, which is usually intended.",
]
sources = [
  "Yield traps and payout ratios (yields above 10% and payouts above 100% precede cuts): https://www.livewiremarkets.com/wires/how-to-avoid-dividend-traps and https://indexes.morningstar.com/insights/perspective/bltdb6d3e043f097825/not-all-dividend-stocks-are-safe-heres-how-to-avoid-dividend-traps",
]
[[field.use]]
for = "pays a meaningful dividend"
op = "gte"
value = 0.03
mode = "soft"
tolerance = 0.005
[[field.use]]
for = "not a yield trap"
op = "lte"
value = 0.08
mode = "soft"
tolerance = 0.01
note = "with feature.trend_state ne DOWNTREND"

[[field]]
name = "rollup.financials@v3.eps_diluted_ttm"
theme = "fundamentals"
reads = "Diluted earnings per share over the trailing twelve months, summed from the quarters and split-adjusted to the session, in dollars; negative for a loss. The numerator's denominator in feature.pe_ratio, which is null for a loss, so this is the field that can say 'unprofitable': under 0 is a loss-maker, which a growth screen may want and a value screen must know about."
caveats = [
  "The TTM lags: it ends at the last filed quarter, up to four months old (rollup.financials@v3.ttm_as_of); rollup.financials@v3.eps_stale flags a figure more than 480 days old.",
  "One-offs (a tax gain, a write-down, an asset sale) swing a year's EPS; nothing here separates them from operations.",
  "Null for funds, foreign filers and companies without four consecutive quarters or a fiscal year on file (rollup.financials@v3.financials_status).",
]
sources = ["SEC EDGAR company facts (docs/data/vendors.md)"]
[[field.use]]
for = "profitable over the last year"
op = "gt"
value = 0
mode = "hard"
note = "the gate feature.pe_ratio applies implicitly; make it explicit when it matters"
[[field.use]]
for = "loss-making (speculative growth, turnarounds)"
op = "lte"
value = 0
mode = "hard"

[[field]]
name = "rollup.financials@v3.net_income_ttm"
theme = "fundamentals"
reads = "Net income over the trailing twelve months, in dollars; negative for a loss. The company-level profit behind EPS: against rollup.financials@v3.revenue_ttm it gives feature.net_margin (10% is healthy for most industries, 20% and above is software or a franchise, under 0 is a loss), and against feature.market_cap the earnings yield."
caveats = [
  "Lags like every TTM figure, and includes one-offs.",
  "Null for funds, foreign filers and incomplete filings; a hard criterion drops every ETF and ADR without US filings.",
]
sources = ["SEC EDGAR company facts"]
[[field.use]]
for = "profitable"
op = "gt"
value = 0
mode = "hard"
[[field.use]]
for = "a large, established earner"
op = "gte"
value = 1000000000
mode = "soft"
tolerance = { relative = 0.3 }

[[field]]
name = "rollup.financials@v3.revenue_ttm"
theme = "fundamentals"
reads = "Revenue over the trailing twelve months, in dollars: the last four discrete quarters, else the latest fiscal year (rollup.financials@v3.ttm_basis says which). Size of the business in sales terms: under $100M is early-stage, $1B is a mid-sized company, above $50B a giant. The denominator of feature.revenue_growth_yoy and the base of the net margin."
caveats = [
  "Which revenue concept a company reports varies (Revenues, RevenueFromContractWithCustomer, SalesRevenueNet); banks and insurers report revenue differently from industrials, so cross-sector comparisons are rough.",
  "Fiscal-year basis (ttm_basis) lags a quarter-based TTM by up to a year.",
  "Null for funds, foreign filers and incomplete filings.",
]
sources = ["SEC EDGAR company facts (docs/data/vendors.md)"]
[[field.use]]
for = "an established business"
op = "gte"
value = 1000000000
mode = "soft"
tolerance = { relative = 0.3 }
[[field.use]]
for = "a small or early-stage business"
op = "lt"
value = 100000000
mode = "soft"
tolerance = { relative = 0.3 }

[[field]]
name = "rollup.dividends@v2.div_count_ttm"
theme = "fundamentals"
reads = "How many ex-dividend dates fell in the last 365 days: 4 is a quarterly payer, 12 monthly, 1 or 2 annual or semi-annual, 0 a known non-payer. Above the usual cadence (5 for a quarterly payer) means a special dividend inflated feature.div_yield for the year."
caveats = [
  "Null for a non-payer with too little history to call it one (under 240 bars); 0 only with a full year of bars.",
  "Special distributions are excluded from div_ttm by default but still counted here when stored; a count of 5 with an ordinary yield is the usual sign of one.",
]
sources = ["Site convention (features/rollups/corporate/dividends.py)"]
[[field.use]]
for = "a regular quarterly payer"
op = "gte"
value = 4
mode = "soft"
tolerance = 1
note = "pair with feature.div_yield gte 0.02"
[[field.use]]
for = "no special-dividend distortion"
op = "lte"
value = 4
mode = "soft"
tolerance = 1

[[field]]
name = "feature.ps_ratio"
theme = "fundamentals"
reads = "Market capitalisation over revenue of the trailing twelve months: the dollars the market pays for each dollar of yearly sales. Under 1 is cheap on sales (a distressed or low-margin business), under 2 is the value end, 2 to 5 is ordinary, 5 to 10 is a growth price that needs sustained growth to be earned, above 10 prices in years of it. Unlike feature.pe_ratio it exists for a loss maker, which is the point of using it."
caveats = [
  "Sales are not profit: a grocer and a software company trade at very different P/S for good reason. Pair it with feature.net_margin, or compare within instrument.sector; a low P/S on a 1% margin is not cheap.",
  "Market cap is the company total count times this class's close (rollup.fundamentals@v4.market_cap_status says whether the count is current), while revenue is the company's: misstated when share classes trade at very different prices, and for an ADR whose ratio is not stored.",
  "Banks, insurers and other financials report revenue in ways that do not compare with industrials; the ratio means little there.",
  "Null for funds, for a stale or missing count, for a missing or stale revenue TTM (rollup.financials@v3.financials_status STALE) and for no revenue: a hard 'lt 2' silently drops all of them. The revenue TTM can be four months old.",
]
sources = [
  "Fisher, Super Stocks (1984): the price-to-sales ratio as a valuation screen",
  "O'Shaughnessy, What Works on Wall Street: price-to-sales as the strongest single value ratio in the study",
  "Damodaran, price-to-sales by industry: https://pages.stern.nyu.edu/~adamodar/New_Home_Page/datafile/psdata.html",
]
[[field.use]]
for = "cheap on sales"
op = "lt"
value = 2
mode = "soft"
tolerance = 0.5
note = "with feature.net_margin gt 0.05 so a cheap ratio is not just a thin margin, and rollup.financials@v3.financials_status eq OK"
[[field.use]]
for = "a growth price (5 to 10 times sales), not a bubble"
op = "between"
value = [5, 10]
mode = "soft"
tolerance = 1
note = "with feature.revenue_growth_yoy gte 0.25: this price is only earned by fast growth"

[[field]]
name = "feature.net_margin"
theme = "fundamentals"
reads = "Net income over revenue of the trailing twelve months, as a fraction: 0.10 is ten cents of profit on each dollar of sales. Under 0 is a loss, 0 to 0.05 is thin (retail, distribution, airlines), 0.10 and above is a healthy business and the line most quality screens draw, 0.20 and above is a franchise (software, payments, a strong brand) that competitors have not been able to compete away."
caveats = [
  "Margins differ by industry far more than by quality: a 4% grocer is excellent and a 4% software company is broken. Compare within instrument.sector (Damodaran's industry tables show the spread); a market-wide 'above 0.10' mostly selects sectors.",
  "One-offs (a tax gain, an asset sale, a write-down) move net income and the margin for the twelve months they sit in; a margin far above the company's history is usually one. Pair with rollup.financials@v3.eps_diluted_ttm and its growth feature.eps_growth_yoy.",
  "Financials report revenue and income in ways that do not compare with industrials; a bank's margin is not an industrial's.",
  "Null for funds, foreign filers and any company without a revenue or net income TTM (rollup.financials@v3.financials_status); a hard criterion drops them.",
]
sources = [
  "Damodaran, margins by industry: https://pages.stern.nyu.edu/~adamodar/New_Home_Page/datafile/margin.html",
  "Quality screens built on profitability: Novy-Marx (2013), The Other Side of Value: The Gross Profitability Premium",
]
[[field.use]]
for = "a quality business"
op = "gte"
value = 0.10
mode = "soft"
tolerance = 0.03
note = "within a sector, not market-wide"
[[field.use]]
for = "a franchise margin"
op = "gte"
value = 0.20
mode = "soft"
tolerance = 0.03
[[field.use]]
for = "profitable at all"
op = "gt"
value = 0
mode = "hard"

[[field]]
name = "feature.payout_ratio"
theme = "fundamentals"
reads = "Dividends per share of the last 365 days over diluted EPS of the trailing twelve months, as a fraction: 0.5 means half of the earnings is paid out. 0 is a known non-payer, under 0.6 is a payout the earnings cover with room (safe), 0.6 to 1 is stretched (normal for REITs and utilities, which pay out by structure), above 1 pays more than the company earns and is not sustainable. A negative value is a dividend payer with negative earnings: not a negative payout but the least safe case, which a bare 'lt 0.6' would wrongly pass."
caveats = [
  "A negative payout means the company pays a dividend while its EPS is negative; 'lt 0.6' passes it. Use 'between 0 and 0.6' for a safe dividend, never a one-sided upper bound.",
  "Earnings are not cash: REITs, MLPs and capital-heavy businesses pay out of cash flow and show payouts above 1 for years (depreciation depresses EPS). Check instrument.sector before reading 'above 1' as a coming cut; cash-flow coverage is not stored.",
  "A one-off in the twelve months (a gain, a write-down) swings EPS and the ratio; a payout of 0.2 or 3 for a single year often says that, not the dividend. Compare with feature.eps_growth_yoy.",
  "Null when the EPS is 0, missing or stale (rollup.financials@v3.eps_stale), for an ADR (EPS per ordinary share, dividend per ADR) and for a payer with too little bar history (rollup.dividends@v2.div_ttm is null): a hard criterion drops all of them.",
]
sources = [
  "Payout ratios above 100% and dividend cuts: https://indexes.morningstar.com/insights/perspective/bltdb6d3e043f097825/not-all-dividend-s",
  "Lintner (1956), Distribution of incomes of corporations among dividends, retained earnings, and taxes: firms target a payout and smooth dividends",
]
[[field.use]]
for = "a safe dividend"
op = "between"
value = [0, 0.60]
mode = "soft"
tolerance = 0.10
note = "with feature.div_yield gte 0.02 so there is a dividend to be safe about; the lower bound 0 keeps out payers with negative earnings"
[[field.use]]
for = "an unsustainable dividend (a cut candidate)"
op = "gt"
value = 1.0
mode = "soft"
tolerance = 0.1
note = "payers with negative earnings are negative, so this misses them: add a second rule 'lt 0'"

[[field]]
name = "feature.eps_growth_yoy"
theme = "fundamentals"
reads = "Diluted EPS of the trailing twelve months against the same twelve months a year earlier, as a fraction: 0.25 is +25%. CAN SLIM asks for annual growth of 25% or more (O'Neil's 'A'); 0.10 to 0.25 is steady, under 0 is a decline, and below -1 means the EPS turned negative. The yearly rate is smoother than feature.eps_growth_qtr_yoy and lags it: compare the two for acceleration."
caveats = [
  "Null when the EPS a year earlier was 0 or negative: a growth rate from a loss or from nothing is meaningless, so a turnaround (a loss to a profit) is null, not infinite. A hard 'gte 0.25' drops every turnaround and every recent IPO; use rollup.financials@v3.eps_diluted_ttm gt 0 to find the profitable ones separately.",
  "A small year-ago EPS makes huge percentages (from 0.02 to 0.20 is +900%); pair with rollup.financials@v3.eps_diluted_ttm_year_ago gte a few percent of the price.",
  "One-offs (a tax gain, a write-down) and buybacks (fewer shares lift EPS with no profit growth) move EPS; compare with feature.revenue_growth_yoy and feature.shares_change_yoy.",
  "Null for funds, foreign filers, fewer than two years of reported quarters or fiscal years, and a stale EPS TTM (rollup.financials@v3.eps_stale).",
]
sources = [
  "O'Neil, How to Make Money in Stocks: CAN SLIM 'A', annual earnings growth of 25% or more",
  "Investor's Business Daily on the CAN SLIM earnings criteria: https://www.investors.com/ibd-university/can-slim/",
]
[[field.use]]
for = "annual earnings growth (CAN SLIM A)"
op = "gte"
value = 0.25
mode = "soft"
tolerance = 0.05
note = "with feature.eps_growth_qtr_yoy gte 0.25 for the quarterly half (CAN SLIM C)"
[[field.use]]
for = "earnings not shrinking"
op = "gte"
value = 0
mode = "soft"
tolerance = 0.03

[[field]]
name = "feature.revenue_growth_qtr_yoy"
theme = "fundamentals"
reads = "Revenue of the latest reported quarter against the same quarter a year earlier, as a fraction: 0.25 is +25%. It is the freshest read of demand the filings give, a quarter nearer than feature.revenue_growth_yoy (which averages four): growth above the yearly rate means it is accelerating, below it that it is slowing. Above 0.25 is fast; negative is shrinking."
caveats = [
  "One quarter is noisy: a timing shift of an order, a 53-week year (its 14-week fourth quarter lifts the rate by about 8%), an acquisition closing or a currency swing moves it; check feature.revenue_growth_yoy points the same way.",
  "Quarter dates differ by company: the latest quarter ends up to four months before the session, and a company that has not filed its newest quarter shows the previous one (rollup.financials@v3.qtr_as_of says which).",
  "The fourth quarter is the annual figure minus the nine months, so it is only known once the 10-K is filed and the nine-month figure exists; null otherwise, and null for a quarter older than 480 days (stale). Null for funds, foreign filers and a year-ago quarter that is missing or not positive.",
]
sources = [
  "O'Neil, How to Make Money in Stocks: CAN SLIM 'C' pairs accelerating quarterly sales with quarterly earnings",
]
[[field.use]]
for = "fast quarterly sales growth"
op = "gte"
value = 0.25
mode = "soft"
tolerance = 0.05
note = "with feature.eps_growth_qtr_yoy gte 0.25"
[[field.use]]
for = "quarterly sales not shrinking"
op = "gte"
value = 0
mode = "soft"
tolerance = 0.03

[[field]]
name = "feature.eps_growth_qtr_yoy"
theme = "fundamentals"
reads = "Diluted EPS of the latest reported quarter against the same quarter a year earlier, as a fraction: 0.25 is +25%: CAN SLIM's 'C', current quarterly earnings, which asks for 25% or more (many practitioners want 40% or more for a leader). Compared with feature.eps_growth_yoy: quarterly above the yearly rate is accelerating earnings; below it the growth is fading. A negative value is a decline; below -1 the quarter's EPS turned negative."
caveats = [
  "Null when the EPS of the quarter a year earlier was 0 or negative: a growth rate from a loss or from nothing is meaningless, so a company that has recently turned profitable is null, not infinite. A hard 'gte 0.25' drops every turnaround; read rollup.financials@v3.eps_diluted_qtr gt 0 for the first profitable quarter.",
  "One quarter is noisy and one-offs (a tax gain, a write-down, an asset sale) land in a single quarter; confirm with feature.revenue_growth_qtr_yoy (real growth has sales behind it) and feature.eps_growth_yoy.",
  "A small year-ago EPS gives huge percentages; a fourth quarter is derived (annual minus nine months) and, with share count changes, quarterly EPS is not exactly additive.",
  "The newest quarter can be four months old (rollup.financials@v3.qtr_as_of); null with no derivable quarter, for a stale quarter, for funds and for foreign filers.",
]
sources = [
  "O'Neil, How to Make Money in Stocks: CAN SLIM 'C', current quarterly earnings per share up 25% or more, preferably accelerating",
  "Investor's Business Daily on the CAN SLIM earnings criteria: https://www.investors.com/ibd-university/can-slim/",
]
[[field.use]]
for = "current quarterly earnings growth (CAN SLIM C)"
op = "gte"
value = 0.25
mode = "soft"
tolerance = 0.05
note = "with feature.revenue_growth_qtr_yoy gte 0.25 and feature.eps_growth_yoy gte 0.25"
[[field.use]]
for = "accelerating earnings (a score)"
op = "gte"
value = 0.25
mode = "score"
tolerance = 0.25
note = "accelerating means the quarterly rate is above feature.eps_growth_yoy: read both for the same name; the rule grammar compares to a constant, not to another field"

[[field]]
name = "feature.shares_change_yoy"
theme = "fundamentals"
reads = "The share count against the count a year earlier, as a fraction: -0.03 is a 3% smaller count. Negative is buybacks (a count that shrinks 1 to 5% a year is a steady repurchaser, returning cash to the holders who stay), around 0 is a stable count, a few percent positive is the ordinary leakage of stock compensation, above 0.10 (10% more shares a year) is dilution: an offering, an acquisition paid in stock or heavy compensation, and a warning for every holder."
caveats = [
  "The counts are the company total from the filings: a cover-page count against a cover-page count, or a weighted average against a weighted average, never one against the other, so a company that began tagging the cover page recently is null. Weighted averages lag a buyback or an offering by about half a period.",
  "A stock split is adjusted away, but a spin-off, a merger or a reverse merger changes the count without being dilution; check feature.market_cap and the filings when the change is above 0.5.",
  "A shrinking count can hide an offering: companies buy back what compensation issues, so a flat count is not a company that does nothing. Pair with rollup.financials@v3.eps_diluted_ttm growth.",
  "Null for funds, companies without two counts a year apart (recent IPOs and filers), and a stale count (rollup.fundamentals@v4.market_cap_status STALE).",
]
sources = [
  "Pontiff and Woodgate (2008), Share Issuance and Cross-Sectional Returns, Journal of Finance: issuers underperform, repurchasers outperform",
  "Faber (2013), Shareholder Yield: the net of dividends and buybacks as the measure of cash returned",
]
[[field.use]]
for = "buying back shares"
op = "lte"
value = -0.01
mode = "soft"
tolerance = 0.01
note = "buybacks of 1 to 5% a year are steady; check feature.eps_growth_yoy to see the profit behind them"
[[field.use]]
for = "no dilution (a warning above 10% a year)"
op = "lte"
value = 0.10
mode = "soft"
tolerance = 0.03
[[field.use]]
for = "diluting (a screen for the warning)"
op = "gt"
value = 0.10
mode = "soft"
tolerance = 0.03

[[field]]
name = "rollup.financials@v3.eps_diluted_ttm_year_ago"
theme = "fundamentals"
reads = "Diluted EPS over the trailing twelve months a year earlier (the four quarters ending a year before the EPS TTM, or the previous fiscal year), in dollars, split-adjusted like rollup.financials@v3.eps_diluted_ttm. The base of feature.eps_growth_yoy: positive means a growth rate exists, 0 or negative means it is null."
caveats = [
  "Null with fewer than two years of EPS history or a gap in it: a recent IPO, a foreign filer or a broken quarter chain.",
