# L3 site setting: the field guide (ADR 0041), the "momentum and trend" theme continued
# (momentum.toml holds the first part: RSI, returns, the SMA distances, the setups). The TA
# track's fields (bands@v1, trend_stats@v1 and the bands.toml / swing.toml expressions): band
# positions, stretches, slopes, short returns, acceleration, EMA alignment and distances, the
# channel distances, the pullback's depth and age, the day's close location, breakouts and
# breakdowns. The keys and the rules each entry follows are in the header of momentum.toml.
# Positions in the bands and channels, stretches and streaks (bands@v1, trend_stats@v1 and
# config/site/features/bands.toml): where the close sits against its own recent range, how
# far it has run, and the longer momentum returns.

[[field]]
name = "feature.bb_pct_b"
theme = "momentum and trend"
reads = "%B: where the close sits between the Bollinger bands, 0 at the lower band, 0.5 at the 20-session mean, 1 at the upper band, below 0 or above 1 outside them. Low to high: under 0 is a two-sigma dip against the last month (the mean-reversion long in an uptrend), 0.2 to 0.8 is inside the normal range, above 1 the close has broken out of the band (strength in a trend, exhaustion after a long run). Bollinger's own rules: buy strength when %B exceeds 1 with volume, buy weakness when it is below 0 with a trend behind it."
caveats = [
  "In a strong trend %B sits above 0.8 for weeks (the band walk, rollup.bands@v1.band_walk): a high %B is not overbought in itself. Pair with rollup.momentum@v1.rsi_14 or feature.stretch_sma20_atr before reading it as stretched.",
  "Below 0 in a downtrend is where the price lives, not a dip: gate a mean-reversion long on feature.trend_state eq UPTREND or feature.pct_vs_sma_200 gt 0.",
  "The bands widen for 20 sessions after a shock day, so %B reads 'inside' while the price is far from where it was. Check rollup.price_moves@v1.one_day_move.",
  "Null when the bands are unknown (a gap among the last 20 sessions) or coincide (20 equal closes).",
]
sources = [
  "Bollinger (2001), Bollinger on Bollinger Bands: %b",
  "Bollinger Bands, Wikipedia: https://en.wikipedia.org/wiki/Bollinger_Bands",
]
[[field.use]]
for = "a dip to the lower band in an uptrend"
op = "lte"
value = 0.0
mode = "soft"
tolerance = 0.1
note = "with feature.trend_state eq UPTREND as the gate; alone it finds downtrends"
[[field.use]]
for = "breaking out above the upper band"
op = "gte"
value = 1.0
mode = "soft"
tolerance = 0.05
note = "with rollup.momentum@v1.rel_volume gte 1.5 for participation; a score, not a gate, in a trend"

[[field]]
name = "feature.kc_position"
theme = "momentum and trend"
reads = "Where the close sits in the Keltner channel: 0 at the lower line (EMA minus 2 ATR), 0.5 at the 20-session EMA, 1 at the upper line, outside 0..1 beyond them. Because the channel is built from the daily range, 1 means 'two average days above the EMA': a close above it is a strong move for this name whatever its price. Between 0.3 and 0.7 the name is near its short-term mean."
caveats = [
  "A collapsed ATR (a pending takeover, a halted name) makes the channel a hair wide and every close 'outside'. Check feature.atr_pct; see the 'pending takeover' situation.",
  "The channel lags a gap by two weeks (the ATR catches up), so the day after a gap the position is far outside and means 'gapped', not 'trending'. Check rollup.price_moves@v1.one_day_move.",
  "Null with fewer than 20 consecutive bars ending on the session, or an ATR of 0.",
]
sources = [
  "Keltner channel, Wikipedia: https://en.wikipedia.org/wiki/Keltner_channel",
]
[[field.use]]
for = "pulled back to the channel midline in an uptrend"
op = "between"
value = [0.35, 0.65]
mode = "soft"
tolerance = 0.1
note = "with feature.trend_state eq UPTREND; feature.pullback_to_sma20 is the same idea against the SMA"

[[field]]
name = "feature.price_z_20d"
theme = "momentum and trend"
reads = "The price z-score: how many standard deviations of the last 20 closes the close sits from their mean. 0 is at the mean, +2 on the upper Bollinger band, -2 on the lower; beyond 2.5 either way is rare (a few sessions a year on a mean-reverting name) and beyond 3 is almost always a one-day shock. It is %B on a different scale (%B 0 is -2, %B 1 is +2); use it when a rule wants sigmas, and feature.stretch_sma20_atr when it wants average daily ranges."
caveats = [
  "A clean trend inflates the deviation (the closes spread out along the move), so a trending name shows a moderate z-score while sitting far from its mean in ATRs. Check feature.stretch_sma20_atr as well.",
  "A high z-score in an uptrend is strength more often than a top: pair with rollup.momentum@v1.rsi_14 and feature.pct_vs_sma_50 before fading it.",
  "Null when sma_20 or close_std_20 is unknown (a gap among the last 20 sessions) or the closes never moved.",
]
sources = [
  "Standard score, Wikipedia: https://en.wikipedia.org/wiki/Standard_score",
  "Bollinger (2001), Bollinger on Bollinger Bands: bands as +-2 standard deviations",
]
[[field.use]]
for = "a mean-reversion long"
op = "lte"
value = -2.0
mode = "soft"
tolerance = 0.5
note = "with feature.trend_state eq UPTREND; feature.bb_pct_b lte 0 is the same criterion"
[[field.use]]
for = "stretched above the mean"
op = "gte"
value = 2.0
mode = "soft"
tolerance = 0.5
note = "a filter against chasing; in a strong trend expect many names here"

[[field]]
name = "feature.stretch_sma20_atr"
theme = "momentum and trend"
reads = "How far the close sits from its 20-session mean, measured in Wilder ATR(14): +1 is one average day's range above it, -1 below. Low to high: within -1 to +1 is at the mean (feature.pullback_to_sma20 is this band in an uptrend), 2 to 3 is extended, beyond 4 is a climax or a gap, the zone where a long is late and a pullback likely. The ATR scale makes it comparable across names: 3 ATR is 3 ATR on a utility and on a biotech."
caveats = [
  "A gap on news puts the close many ATRs from the mean in one day; the ATR then grows and the stretch shrinks without the price moving. Check rollup.price_moves@v1.one_day_move and rollup.earnings@v1.last_earnings_date.",
  "A pending takeover shrinks the ATR towards zero, so the stretch explodes on a flat price. Check feature.atr_pct; see the 'pending takeover' situation.",
  "In a strong uptrend 2 to 3 ATR above the mean persists for weeks; fade it only with rollup.momentum@v1.rsi_14 above 75 or feature.bb_pct_b above 1.",
  "Null when sma_20 or atr_14 is unknown (a gap among the last 20 sessions, fewer than 15 consecutive bars) or the ATR is 0.",
]
sources = [
  "Wilder (1978), New Concepts in Technical Trading Systems: ATR",
  "Raschke and Connors (1995), Street Smarts: 'stretch' entries measured in ATR",
]
[[field.use]]
for = "not overextended (entry filter)"
op = "lte"
value = 2.0
mode = "soft"
tolerance = 0.5
note = "with feature.trend_state eq UPTREND; feature.pullback_to_sma20 is the within-1-ATR version"
[[field.use]]
for = "a climax run (fade or trim)"
op = "gte"
value = 4.0
mode = "soft"
tolerance = 1.0
note = "a score; confirm with rollup.momentum@v1.rsi_14 gte 75 and feature.volume_climax"

[[field]]
name = "feature.stretch_sma50_atr"
theme = "momentum and trend"
reads = "How far the close sits from its 50-session mean, in Wilder ATR(14): the intermediate-term version of feature.stretch_sma20_atr. Within -2 to +2 is near the mean (where a trend-following entry on the 50-day lives), 4 to 6 is a strong run, beyond 8 an extended one that has usually gone a quarter without a rest."
caveats = [
  "A gap moves the stretch many ATRs in a day; the ATR then grows and the stretch shrinks without the price moving. Check rollup.price_moves@v1.one_day_move.",
  "A pending takeover shrinks the ATR, so the stretch explodes on a flat price; see the 'pending takeover' situation.",
  "Null when sma_50 or atr_14 is unknown (a gap among the last 50 sessions, fewer than 15 consecutive bars) or the ATR is 0.",
]
sources = [
  "Wilder (1978), New Concepts in Technical Trading Systems: ATR",
]
[[field.use]]
for = "pulled back to the 50-day in an uptrend"
op = "between"
value = [-1.5, 1.5]
mode = "soft"
tolerance = 0.5
note = "with feature.trend_state eq UPTREND (close above SMA50 above SMA200)"

[[field]]
name = "feature.donchian_pos_20d"
theme = "momentum and trend"
reads = "Where the close sits in the 20-session high-low channel, 0 at the channel low, 1 at the channel high. 1 means the close is at a 20-session high (today's high included), the Turtle entry; 0 at a 20-session low. Between 0.4 and 0.6 the name is mid-range. Unlike %B it uses highs and lows and has no statistical scale, so it reads the same on every name."
caveats = [
  "A single spike high 19 sessions ago keeps the channel top far above the price for one more day, so the position reads low on a name that is quietly rising; feature.range_20d_pct says how wide the channel is.",
  "A close at the channel high in a downtrend is a rally to resistance: gate a breakout on feature.trend_state or feature.pct_vs_sma_200, and on volume (feature.breakout_20d).",
  "Null when high_20d or low_20d is unknown (a gap among the last 20 sessions) or the channel has no width.",
]
sources = [
  "Donchian channels and the Turtle rules: https://en.wikipedia.org/wiki/Richard_Donchian",
  "Faith (2007), Way of the Turtle: the 20-day breakout entry",
]
[[field.use]]
for = "at a 20-session high (breakout)"
op = "gte"
value = 0.95
mode = "soft"
tolerance = 0.05
note = "with rollup.momentum@v1.rel_volume gte 1.5; feature.breakout_20d is the volume-confirmed flag"
[[field.use]]
for = "at a 20-session low"
op = "lte"
value = 0.05
mode = "soft"
tolerance = 0.05
note = "with feature.trend_state eq UPTREND for a dip; alone it lists breakdowns"

[[field]]
name = "rollup.bands@v1.band_walk"
theme = "momentum and trend"
reads = "How many consecutive sessions the close has sat outside the Bollinger bands: positive counts closes above the upper band, negative below the lower, 0 inside. A walk of 3 or more up the band is the signature of a strong trend (Bollinger: 'a tag of the upper band is not a sell signal'); a walk down the lower band is a persistent sell-off. Most walks end within a week; 10 and above is a run that usually ends in a climax."
caveats = [
  "A walk starts with a shock day as often as with a trend: a one-day earnings gap sits outside the band for a session or two while the bands catch up. Check rollup.price_moves@v1.one_day_move and rollup.earnings@v1.last_earnings_date.",
  "A thin name with equal closes has bands of zero width, so any tick is outside them. Gate on rollup.price_stats@v2.adv_usd_20d.",
  "Null when today's bands are unknown (a gap among the last 20 sessions); the count stops at the first session without bands.",
]
sources = [
  "Bollinger (2001), Bollinger on Bollinger Bands: walking the bands",
]
[[field.use]]
for = "walking the upper band (strong trend)"
op = "gte"
value = 3
mode = "soft"
tolerance = 1
note = "with rollup.momentum@v1.rel_volume for participation; a score, the gate is feature.trend_state eq UPTREND"
[[field.use]]
for = "a persistent sell-off"
op = "lte"
value = -3
mode = "soft"
tolerance = 1
note = "a capitulation candidate with feature.volume_climax; not a long entry on its own"

[[field]]
name = "rollup.trend_stats@v1.ret_120d"
theme = "momentum and trend"
reads = "The close over the close 120 sessions (about six months) earlier, minus one: 0.25 is up 25%. The six-month return is the classic intermediate momentum horizon (Jegadeesh and Titman's 6-month formation); above about 0.20 a name is a momentum leader in an ordinary year, below -0.20 a laggard. Compare with the market's six-month return (market.market_trend@v2.spx_ret_252d is the year) before reading it as stock-specific."
caveats = [
  "A single gap (an earnings surprise, a takeover) can be the whole return: check rollup.price_moves@v1.one_day_move and rollup.earnings@v1.last_earnings_date before reading it as a trend.",
  "Six months ago may sit just before or after a crash: the same stock reads +40% or -10% depending on the day. Read with rollup.price_stats@v2.ret_60d and rollup.trend_stats@v1.ret_252d.",
  "Null after a gap in the last 121 sessions or a shorter history (a listing under six months old).",
]
sources = [
  "Jegadeesh and Titman (1993), Returns to Buying Winners and Selling Losers",
  "Momentum (finance), Wikipedia: https://en.wikipedia.org/wiki/Momentum_(finance)",
]
[[field.use]]
for = "six-month momentum"
op = "gte"
value = 0.15
mode = "soft"
tolerance = 0.05
note = "gate ret_120d gt 0; score the size; pair with rollup.price_stats@v2.ret_20d to avoid names already reversing"

[[field]]
name = "rollup.trend_stats@v1.ret_252d"
theme = "momentum and trend"
reads = "The close over the close 252 sessions (one year) earlier, minus one: the plain one-year return, 0.30 is up 30%. In an average year the S&P 500 returns about 10% with a spread of about 15 points across its members, so above 0.30 is a leader and below -0.20 a laggard. For the momentum factor as the literature defines it, which skips the last month, use rollup.trend_stats@v1.mom_12_1."
caveats = [
  "The last month's reversal is inside this number: a stock up 50% on the year and down 20% this month reads +20%. rollup.trend_stats@v1.mom_12_1 leaves the month out.",
  "The year-ago base day moves daily: a crash or a rally one year ago rolling out of the window changes the return with no move today. Check rollup.price_stats@v2.ret_60d for the recent trend.",
  "Null after a gap in the last 253 sessions or a shorter history (a listing under a year old; rollup.price_history@v1.range_status says SINCE_LISTING).",
]
sources = [
  "Momentum (finance), Wikipedia: https://en.wikipedia.org/wiki/Momentum_(finance)",
]
[[field.use]]
for = "one-year winner"
op = "gte"
value = 0.30
mode = "soft"
tolerance = 0.10
note = "a score; relative strength against the market is rollup.trend_stats@v1.ret_252d minus market.market_trend@v2.spx_ret_252d"

[[field]]
name = "rollup.trend_stats@v1.mom_12_1"
theme = "momentum and trend"
reads = "The 12-1 momentum: the return from 12 months ago to one month ago (the close 21 sessions back over the close 252 sessions back, minus one), the definition the momentum factor literature uses because the most recent month tends to reverse. 0.20 means the name was up 20% over the eleven months ending a month ago. Positive is the gate; the top decile of the universe (about 0.40 and above in a normal year) is where the factor's return has come from, and the bottom decile is where it has been short."
caveats = [
  "It ignores the last month on purpose, so a name that collapsed in the last three weeks still reads as a winner; pair with rollup.price_stats@v2.ret_20d or feature.trend_state to catch the turn.",
  "Momentum crashes: after a bear market the losers rally hardest (2009, 2020), and a pure 12-1 screen is on the wrong side for months. Check market.market_trend@v2.spx_drawdown_252d.",
  "Null after a gap in the last 253 sessions or a shorter history.",
]
sources = [
  "Jegadeesh and Titman (1993), Returns to Buying Winners and Selling Losers",
  "Carhart (1997), On Persistence in Mutual Fund Performance: the 12-1 momentum factor",
  "Daniel and Moskowitz (2016), Momentum Crashes",
]
[[field.use]]
for = "momentum factor long"
op = "gte"
value = 0.20
mode = "soft"
tolerance = 0.10
note = "gate mom_12_1 gt 0; score the size; add rollup.price_stats@v2.ret_20d gt -0.10 to avoid the names already breaking"

[[field]]
name = "rollup.trend_stats@v1.close_streak"
theme = "momentum and trend"
reads = "How many consecutive sessions the close has risen (positive) or fallen (negative), ending today; 0 when today's close is unchanged. Streaks of 3 to 5 are common (a coin flip gives five in a row one time in sixteen); 7 and above is rare and, in the short-term mean-reversion literature, a reversal setup rather than a trend: Connors' rules buy after several down closes in an uptrend and sell after several up closes."
caveats = [
  "A streak says nothing about size: five up closes of 0.1% each is noise. Read it with rollup.price_stats@v2.ret_20d or feature.stretch_sma20_atr for the distance covered.",
  "A takeover pins the price, so the streak alternates around zero for months; a halted name has no streak. See the 'pending takeover' situation.",
  "Null when the session before has no bar (a gap); the count stops at the first gap.",
]
sources = [
  "Connors and Alvarez (2009), Short Term Trading Strategies That Work: consecutive-close setups",
]
[[field.use]]
for = "a pullback of several down closes in an uptrend"
op = "lte"
value = -3
mode = "soft"
tolerance = 1
note = "with feature.trend_state eq UPTREND as the gate; the short-term mean-reversion entry"
[[field.use]]
for = "a long run of up closes (not chasing)"
op = "lte"
value = 5
mode = "soft"
tolerance = 1
note = "a filter against buying the sixth up day; use with feature.stretch_sma20_atr"

[[field]]
name = "rollup.trend_stats@v1.sma20_streak"
theme = "momentum and trend"
reads = "How many consecutive sessions the close has held above (positive) or below (negative) its 20-session mean, ending today. 1 to 3 is a fresh cross, often a whipsaw; 10 and above is a trend that has held for two weeks; 40 and above is a run that has not visited its mean for two months. A negative count of the same size is the mirror in a downtrend. The 20-session mean is the short-term trend line most pullback strategies use, so the streak dates the current leg."
caveats = [
  "A fresh cross (a streak of 1 or 2) reverses as often as not; a gate on the crossing alone is noise. Require 3 or more, or pair with rollup.momentum@v1.rel_volume on the cross day.",
  "A long streak above the mean with a shrinking distance (feature.pct_vs_sma_20 near 0) is a trend losing speed, not strength; read both.",
  "Null when today's 20-session mean is unknown (a gap among the last 20 sessions); the count stops at the first session without a mean.",
]
sources = [
  "Moving average crossovers, Investopedia: https://www.investopedia.com/terms/c/crossover.asp",
]
[[field.use]]
for = "an established short-term uptrend"
op = "gte"
value = 10
mode = "soft"
tolerance = 3
note = "with feature.pct_vs_sma_20 gt 0.02 so the trend still has distance; the mirror lte -10 for a downtrend"
[[field.use]]
for = "a fresh cross above the 20-day"
op = "between"
value = [1, 3]
mode = "soft"
tolerance = 1
note = "confirm with rollup.momentum@v1.rel_volume gte 1.3 on the cross; alone it is a whipsaw list"

# Slopes, short returns, acceleration, the EMA alignment and distances, the channel distances,
# the pullback's depth and age, the day's close location, and the breakout and breakdown
# rules (bands@v1, trend_stats@v1, config/site/features/bands.toml and swing.toml).

[[field]]
name = "rollup.bands@v1.ema20_slope_5d"
theme = "momentum and trend"
reads = "How much the 20-session EMA moved over the last 5 sessions, as a fraction: 0.02 means the fast average is 2% higher than a week ago (rising), -0.02 falling. Near 0 (within about 0.005) the short-term trend is flat. A rising 20 EMA with the close above it is the simplest statement of a short-term uptrend; the slope turning negative while the close is still above the average is the early deterioration signal."
caveats = [
  "The average lags: after a gap the slope reads the gap for a week. Check rollup.price_moves@v1.one_day_move.",
  "Scale it by the name's volatility: 0.02 a week is a crawl on a high-beta name and a sprint on a utility. Compare with feature.atr_pct, or use feature.stretch_sma20_atr for the position in ATRs.",
  "Null with fewer than 25 consecutive bars ending on the session.",
]
sources = ["Moving average slope as a trend filter (Kaufman, Trading Systems and Methods)"]
[[field.use]]
for = "a rising short-term trend"
op = "gt"
value = 0.0
mode = "hard"
note = "with rollup.price_stats@v2.close above rollup.bands@v1.ema_20 (feature.pct_vs_ema_20 gt 0)"
[[field.use]]
for = "a flat base (no slope)"
op = "between"
value = [-0.005, 0.005]
mode = "soft"
tolerance = 0.003
note = "with rollup.trend_stats@v1.tight_range_sessions gte 10 for a base"

[[field]]
name = "rollup.bands@v1.ema50_slope_10d"
theme = "momentum and trend"
reads = "How much the 50-session EMA moved over the last 10 sessions, as a fraction: 0.03 means the intermediate average is 3% higher than two weeks ago. Positive is an intermediate uptrend; the pullback screens require it so that a dip is a dip in a trend. It turns later than the 20-day slope and whipsaws far less."
caveats = [
  "The average lags by weeks: it stays positive for a while after a top. Pair with feature.pct_vs_ema_50 or rollup.bands@v1.ema20_slope_5d for the turn.",
  "Null with fewer than 60 consecutive bars ending on the session.",
]
sources = ["Moving average slope as a trend filter (Kaufman, Trading Systems and Methods)"]
[[field.use]]
for = "an intermediate uptrend"
op = "gt"
value = 0.0
mode = "hard"
note = "with feature.ema_stack eq BULL for full alignment"

[[field]]
name = "rollup.bands@v1.sma200_slope_20d"
theme = "momentum and trend"
reads = "How much the 200-session SMA moved over the last 20 sessions, as a fraction: 0.01 means the long-term average is 1% higher than a month ago. Positive is a long-term uptrend; the classic 'price above a rising 200-day' condition is this field above 0 with feature.pct_vs_sma_200 above 0. It moves slowly: 0.03 a month is a strong bull trend, -0.03 a bear one."
caveats = [
  "It turns months after the price: a name can fall 30% while the 200-day slope is still positive. Use it as the regime filter, not the timing.",
  "Null after a gap in the last 220 sessions or a shorter history.",
]
sources = ["Faber (2007), A Quantitative Approach to Tactical Asset Allocation"]
[[field.use]]
for = "a rising 200-day (long-term uptrend)"
op = "gt"
value = 0.0
mode = "hard"
note = "with feature.pct_vs_sma_200 gt 0; the filter the trend-following screens gate on"

[[field]]
name = "rollup.trend_stats@v1.ret_1d"
theme = "momentum and trend"
reads = "Today's close over yesterday's minus one: 0.02 is up 2% on the day. The size of an ordinary day depends on the name (feature.atr_pct is its typical range); rollup.trend_stats@v1.ret_z_20d says how unusual today was in the name's own terms. Positive is 'close above the prior close', the confirmation the reversal screens ask for."
caveats = [
  "An earnings day or an ex-dividend day moves the close for reasons the chart does not show; check rollup.earnings@v1.last_earnings_date and rollup.dividends@v2.last_ex_date.",
  "Null when the session before has no bar (a gap).",
]
sources = ["Rate of return, Wikipedia: https://en.wikipedia.org/wiki/Rate_of_return"]
[[field.use]]
for = "an up day (close above the prior close)"
op = "gt"
value = 0.0
mode = "hard"
note = "with rollup.trend_stats@v1.close_range_pos gte 0.6 for a strong close"

[[field]]
name = "rollup.trend_stats@v1.ret_3d"
theme = "momentum and trend"
reads = "The close over the close three sessions earlier, minus one: the shortest swing horizon, 0.05 is up 5% in three days. Short-term mean-reversion systems fade it (buy after a three-day drop in an uptrend) and breakout systems want it positive on the breakout day."
caveats = [
  "Three days is noise on most names: a 2% move is within one ATR for the average stock. Read it with rollup.trend_stats@v1.ret_z_20d or feature.stretch_sma20_atr.",
  "Null after a gap in the last 4 sessions.",
]
sources = ["Connors and Alvarez (2009), Short Term Trading Strategies That Work"]
[[field.use]]
for = "a three-day dip in an uptrend"
op = "lte"
value = -0.03
mode = "soft"
tolerance = 0.01
note = "with feature.trend_state eq UPTREND; the short-term mean-reversion entry"

[[field]]
name = "rollup.trend_stats@v1.ret_10d"
theme = "momentum and trend"
reads = "The close over the close ten sessions (two weeks) earlier, minus one: 0.08 is up 8% in two weeks. It bridges rollup.momentum@v1.ret_5d and rollup.price_stats@v2.ret_20d; on a pullback it is usually negative while ret_20d is still positive, and that combination (down two weeks, up a month) is the pullback screens' shape."
caveats = [
  "An earnings day inside the window is the return; check rollup.earnings@v1.last_earnings_date.",
  "Null after a gap in the last 11 sessions or a shorter history.",
]
sources = ["Momentum (finance), Wikipedia: https://en.wikipedia.org/wiki/Momentum_(finance)"]
[[field.use]]
for = "a two-week pullback inside a monthly uptrend"
op = "lt"
value = 0.0
mode = "hard"
note = "with rollup.price_stats@v2.ret_20d gt 0 and feature.ema_stack eq BULL"

[[field]]
name = "rollup.trend_stats@v1.mom_accel_5d"
theme = "momentum and trend"
reads = "Momentum acceleration: this week's 5-session return minus last week's, in return points. +0.03 means this week ran 3 points ahead of last week (accelerating); -0.03 it slowed by 3 points (deteriorating). On a pullback a negative value turning less negative is the 'downside momentum decelerating' the reversal screens look for; on a run a positive value turning negative while the price is still rising is the exhaustion tell. Compare it with the name's weekly range: feature.atr_pct times about 2.2 is a normal week."
caveats = [
  "It is a difference of two noisy numbers: one big day flips it. Confirm with rollup.trend_stats@v1.ret_z_20d (was there an event?) and rollup.momentum@v1.rsi_14.",
  "An earnings day in either week dominates both terms; check rollup.earnings@v1.last_earnings_date.",
  "Null after a gap in the last 11 sessions or a shorter history.",
]
sources = ["Momentum acceleration (second-order momentum): Chen and Yu (2014), Investor attention and momentum; Kaufman, Trading Systems and Methods (rate-of-change of momentum)"]
[[field.use]]
for = "momentum accelerating (continuation)"
op = "gt"
value = 0.0
mode = "soft"
tolerance = 0.01
note = "with rollup.momentum@v1.ret_5d gt 0; distinguishes a continuation from an exhausted run"
[[field.use]]
for = "downside momentum decelerating (reversal)"
op = "gt"
value = 0.0
mode = "soft"
tolerance = 0.01
note = "with rollup.momentum@v1.ret_5d lt 0: this week fell less than last week"
[[field.use]]
for = "momentum deteriorating (not chasing)"
op = "gte"
value = -0.02
mode = "soft"
tolerance = 0.01
note = "a filter against buying a run that is already slowing"

[[field]]
name = "rollup.trend_stats@v1.sessions_since_high_20d"
theme = "momentum and trend"
reads = "How many sessions ago the highest high of the last 20 sessions was set: 0 means today's high is the channel high (no pullback), 3 to 7 a one-week pullback, 15 to 19 a dip that has lasted nearly the whole window (the high is about to leave it). It is the pullback's duration; feature.pullback_atr_20d is its depth."
caveats = [
  "When the high leaves the window the count resets to a younger high and the pullback 'shortens' with no price change; read it with feature.dist_to_high_20d.",
  "Null after a gap in the last 20 sessions or a shorter history.",
]
sources = ["Pullback trading (Raschke and Connors, Street Smarts: the holy grail setup)"]
[[field.use]]
for = "a short pullback (under two weeks)"
op = "between"
value = [2, 10]
mode = "soft"
tolerance = 2
note = "with feature.pullback_atr_20d lte 1.5 and feature.ema_stack eq BULL"
[[field.use]]
for = "at a fresh 20-session high today"
op = "eq"
value = 0
mode = "hard"
note = "the breakout day; feature.breakout_20d adds the volume condition"

[[field]]
name = "rollup.trend_stats@v1.close_range_pos"
theme = "momentum and trend"
reads = "Where today's close sits in today's high-low range, 0 at the low of the day, 1 at the high. Above 0.7 the session closed strong (buyers held into the close), below 0.3 it closed weak; around 0.5 the day was indecisive. A breakout that closes above 0.7 on volume is a far better candidate than one that spiked intraday and closed in the lower half (a shooting star)."
caveats = [
  "One day: a strong close on a quiet day means little. Pair with rollup.momentum@v1.rel_volume.",
  "Null when the bar has no range (high equals low: a halted or untraded session).",
]
sources = ["Candlestick close location (Nison, Japanese Candlestick Charting Techniques); the 'closing range' in O'Neil's breakout rules"]
[[field.use]]
for = "closed strong (a breakout or reversal day)"
op = "gte"
value = 0.7
mode = "soft"
tolerance = 0.1
note = "with rollup.momentum@v1.rel_volume gte 1.25; for a reversal day 0.6 is enough"
[[field.use]]
for = "closed weak (a failed breakout)"
op = "lte"
value = 0.3
mode = "soft"
tolerance = 0.1
note = "with feature.breakout_magnitude_20d gt 0 for the shooting-star breakout"

[[field]]
name = "feature.pct_vs_ema_20"
theme = "momentum and trend"
reads = "Close over the 20-session EMA minus one: 0.02 is 2% above the fast average. Within about one ATR of it (feature.stretch_sma20_atr is the same distance in ATRs) is a pullback entry; far above is extended; below it the short-term trend has paused."
caveats = [
  "Percent means different things on different names: 3% is a day's range on a high-beta name and a week's on a utility. Use feature.stretch_sma20_atr when comparing across names.",
  "Null when ema_20 is unknown (fewer than 20 consecutive bars).",
]
sources = ["Moving average (exponential), Wikipedia: https://en.wikipedia.org/wiki/Moving_average#Exponential_moving_average"]
[[field.use]]
for = "above the 20 EMA (short-term trend intact)"
op = "gt"
value = 0.0
mode = "hard"
note = "with rollup.bands@v1.ema20_slope_5d gt 0"
[[field.use]]
for = "not extended from the 20 EMA"
op = "lte"
value = 0.05
mode = "soft"
tolerance = 0.02
note = "feature.stretch_sma20_atr lte 2 is the ATR-scaled version"

[[field]]
name = "feature.pct_vs_ema_50"
theme = "momentum and trend"
reads = "Close over the 50-session EMA minus one: the intermediate-term distance. Above 0 the name is above its quarterly trend line; within about 3% of it in an uptrend is the swing pullback zone; 15% and more above it is extended for most large caps."
caveats = [
  "Null when ema_50 is unknown (fewer than 50 consecutive bars).",
]
sources = ["Moving average (exponential), Wikipedia: https://en.wikipedia.org/wiki/Moving_average#Exponential_moving_average"]
[[field.use]]
for = "above the 50 EMA"
op = "gt"
value = 0.0
mode = "hard"
note = "with feature.ema_stack eq BULL for alignment"

[[field]]
name = "feature.pct_vs_ema_200"
theme = "momentum and trend"
reads = "Close over the 200-session EMA minus one: the long-term distance. Above 0 is a bull trend for the name; 30% and more above it is a stretched year; 20% below it is a bear trend. Nearly identical to feature.pct_vs_sma_200 on most names."
caveats = [
  "Null when ema_200 is unknown (fewer than 200 consecutive bars: a listing under ten months old).",
]
sources = ["Faber (2007), A Quantitative Approach to Tactical Asset Allocation"]
[[field.use]]
for = "above the 200 EMA (long-term uptrend)"
op = "gt"
value = 0.0
mode = "hard"
note = "the regime gate of the trend screens"

[[field]]
name = "feature.ema_stack"
theme = "momentum and trend"
reads = "The EMA alignment: BULL when EMA20 > EMA50 > EMA200 (the averages stacked in order, the shape of an established uptrend), BEAR when EMA20 < EMA50 < EMA200, else MIXED (a crossing in progress or a range). feature.trend_state is the same idea on the close and the SMAs (close > SMA50 > SMA200), so BULL here with UPTREND there is full alignment."
caveats = [
  "Alignment lags: a stack stays BULL for weeks after a top. Pair with rollup.bands@v1.ema20_slope_5d or feature.pct_vs_ema_20 for the turn.",
  "Null when an EMA is unknown (fewer than 200 consecutive bars).",
]
sources = ["Moving average ribbons and alignment (Guppy, Trend Trading)"]
[[field.use]]
for = "an aligned uptrend"
op = "eq"
value = "BULL"
mode = "hard"
note = "the gate of the pullback and continuation screens; add feature.trend_state eq UPTREND for the close as well"
[[field.use]]
for = "an aligned downtrend (short setups)"
op = "eq"
value = "BEAR"
mode = "hard"
note = "with feature.breakdown_20d for the trigger"

[[field]]
name = "feature.dist_to_high_20d"
theme = "momentum and trend"
reads = "Close over the 20-session high minus one, at or below 0: the pullback from the channel high as a fraction, -0.05 is 5% below it, 0 is a close at the high. The breakout screens want it near 0; the pullback screens want a modest negative value (-0.03 to -0.08 on a large cap) with the trend intact. feature.pullback_atr_20d is the same depth in ATRs."
caveats = [
  "One intraday spike sets the high for 20 sessions, so a name quietly rising can read 5% 'below its high' for weeks; check rollup.trend_stats@v1.sessions_since_high_20d.",
  "Null when high_20d is unknown (a gap among the last 20 sessions).",
]
sources = ["Donchian channels: https://en.wikipedia.org/wiki/Richard_Donchian"]
[[field.use]]
for = "within a few percent of the 20-session high"
op = "gte"
value = -0.03
mode = "soft"
tolerance = 0.02
note = "feature.breakout_magnitude_20d gt 0 is the actual breakout; feature.dist_to_high_50d gte -0.03 for the 50-session version"
[[field.use]]
for = "a shallow pullback"
op = "between"
value = [-0.08, -0.02]
mode = "soft"
tolerance = 0.02
note = "with feature.ema_stack eq BULL; use feature.pullback_atr_20d to scale by volatility"

[[field]]
name = "feature.dist_to_high_50d"
theme = "momentum and trend"
reads = "Close over the 50-session high minus one, at or below 0: how far the close sits under the quarterly high. 'Within X% of the 50-day high' is the breakout screens' second condition (near 0 means the 20-session breakout is also at a quarterly high, not a bounce inside a longer decline)."
caveats = [
  "Null when high_50d is unknown (a gap among the last 50 sessions).",
]
sources = ["Donchian channels: https://en.wikipedia.org/wiki/Richard_Donchian"]
[[field.use]]
for = "within a few percent of the 50-session high"
op = "gte"
value = -0.05
mode = "soft"
tolerance = 0.02
note = "with feature.breakout_20d for a breakout that is also a quarterly high"

[[field]]
name = "feature.dist_to_low_20d"
theme = "momentum and trend"
reads = "Close over the 20-session low minus one, at or above 0: how far the close has lifted off the channel low, 0.10 is 10% above it. Near 0 is a close at a 20-session low (a breakdown or a capitulation); a bounce that lifts 1 to 2 ATRs off the low is the reversal screens' trigger."
caveats = [
  "Null when low_20d is unknown (a gap among the last 20 sessions).",
]
sources = ["Donchian channels: https://en.wikipedia.org/wiki/Richard_Donchian"]
[[field.use]]
for = "at or near a 20-session low"
op = "lte"
value = 0.02
mode = "soft"
tolerance = 0.01
note = "with feature.trend_state eq UPTREND for a dip; alone it lists breakdowns"

[[field]]
name = "feature.dist_to_low_50d"
theme = "momentum and trend"
reads = "Close over the 50-session low minus one, at or above 0: how far the close sits above the quarterly low. Near 0 is a quarterly low; 0.20 and more means the name has recovered a fifth off its low."
caveats = [
  "Null when low_50d is unknown (a gap among the last 50 sessions).",
]
sources = ["Donchian channels: https://en.wikipedia.org/wiki/Richard_Donchian"]
[[field.use]]
for = "well off its quarterly low"
op = "gte"
value = 0.10
mode = "soft"
tolerance = 0.05
note = "a filter for trend screens against names still at their lows"

[[field]]
name = "feature.pullback_atr_20d"
theme = "momentum and trend"
reads = "The pullback from the 20-session high measured in Wilder ATR(14): 1.5 means the close sits one and a half average days' range under the channel high. 0 is at the high; up to about 1.5 is the shallow pullback the swing screens buy; 3 and more is a correction, not a pullback. Scaled by volatility, so the same threshold works on a utility and a biotech."
caveats = [
  "A gap down puts the close many ATRs under the high in a day; the ATR then widens and the number shrinks without a rally. Check rollup.price_moves@v1.one_day_move.",
  "Null when high_20d or atr_14 is unknown, or the ATR is 0.",
]
sources = ["Raschke and Connors (1995), Street Smarts: ATR-scaled pullbacks"]
[[field.use]]
for = "a shallow pullback (swing entry)"
op = "lte"
value = 1.5
mode = "soft"
tolerance = 0.5
note = "with feature.ema_stack eq BULL and rollup.trend_stats@v1.sessions_since_high_20d between 2 and 10"

[[field]]
name = "feature.pct_52w_range"
theme = "momentum and trend"
reads = "Where the close sits in its 52-week range, 0 at the low, 1 at the high: the 52-week percentile of the price. Above 0.8 the name trades in the top fifth of its year (George and Hwang's nearness-to-high effect, where momentum lives); below 0.2 in the bottom fifth. feature.near_52w is the labelled version (HIGH / LOW within 10%)."
caveats = [
  "The range is set by two days a year ago as much as by today: a spike high makes the whole year read 'low in the range'. Check feature.dist_52w for the distance to the nearer extreme.",
  "Null when the 52-week high or low is unknown (fewer than 240 bars in the last 252 sessions) or they coincide.",
]
sources = ["George and Hwang (2004), The 52-Week High and Momentum Investing"]
[[field.use]]
for = "in the top of its yearly range"
op = "gte"
value = 0.8
mode = "soft"
tolerance = 0.1
note = "a momentum score; feature.pct_from_high_52w gte -0.10 is the 'within 10% of the high' gate"

[[field]]
name = "feature.breakout_magnitude_20d"
theme = "momentum and trend"
reads = "How far the close sits above (positive) or below (negative) the highest high of the 20 sessions before today, as a fraction: 0.02 is a 2% breakout, -0.01 a close 1% under the level. A breakout of 1 to 3% that closed strong (rollup.trend_stats@v1.close_range_pos) on volume is the textbook entry; 8% and more in one day is a gap that may already be extended (feature.stretch_sma20_atr)."
caveats = [
  "A positive value with low volume (rollup.momentum@v1.rel_volume under 1.25) is the breakout that fails most; feature.breakout_20d requires the volume.",
  "The level excludes today; it can be yesterday's spike, so a 'breakout' can be a return to where the name was two days ago. Check feature.dist_to_high_50d.",
  "Null when prior_high_20d is unknown (a gap among the 20 sessions before today).",
]
sources = ["O'Neil (2009), How to Make Money in Stocks: buying within 5% of the pivot"]
[[field.use]]
for = "a fresh breakout (not extended)"
op = "between"
value = [0.0, 0.05]
mode = "soft"
tolerance = 0.02
note = "with rollup.momentum@v1.rel_volume gte 1.25 and rollup.trend_stats@v1.close_range_pos gte 0.7"
[[field.use]]
for = "a failed breakout (back under the level)"
op = "lt"
value = 0.0
mode = "hard"
note = "with rollup.momentum@v1.prior_high_20d gt rollup.price_stats@v2.close yesterday: use rollup.trend_stats@v1.ret_1d lt 0 and feature.dist_to_high_20d gte -0.03"

[[field]]
name = "feature.breakout_50d"
theme = "momentum and trend"
reads = "True when the close is above the highest high of the previous 50 sessions on at least 1.5 times average volume: the quarterly breakout, the Turtles' slower system (55 days) and the level where a 20-session breakout becomes a trend rather than a range swing. Fewer and better signals than feature.breakout_20d."
caveats = [
  "A takeover announcement or an earnings gap is a 50-session breakout on volume with no follow-through to come; check rollup.price_moves@v1.one_day_move and rollup.earnings@v1.last_earnings_date.",
  "Null when the prior high or the volume ratio is unknown and the known side does not already say false.",
]
sources = ["Faith (2007), Way of the Turtle: System 2 (55-day breakout)"]
[[field.use]]
for = "a quarterly breakout on volume"
op = "eq"
value = true
mode = "hard"
note = "with feature.stretch_sma20_atr lte 3 so the breakout is not already a climax"

[[field]]
name = "feature.breakdown_20d"
theme = "momentum and trend"
reads = "True when the close is below the lowest low of the previous 20 sessions on at least 1.5 times average volume: the mirror of feature.breakout_20d, the short-setup trigger and, for a long, the stop that just got hit. In an uptrend it marks the end of the leg; in a downtrend it is the next leg down."
caveats = [
  "A capitulation day is a breakdown on volume and often the low; pair with rollup.trend_stats@v1.close_range_pos (a close near the day's high after a breakdown is a reversal, not a breakdown).",
  "An ex-dividend day or an index event can print a volume breakdown on a flat chart; check rollup.dividends@v2.last_ex_date and rollup.trend_stats@v1.ret_1d.",
  "Null when the prior low or the volume ratio is unknown and the known side does not already say false.",
]
sources = ["Faith (2007), Way of the Turtle: the 20-day channel exit"]
[[field.use]]
for = "a breakdown on volume (short setup)"
op = "eq"
value = true
mode = "hard"
note = "with feature.ema_stack eq BEAR for a trend short; with feature.trend_state eq UPTREND it is a stop-out list"
