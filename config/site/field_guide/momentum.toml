# L3 site setting: the field guide (ADR 0041, amended 2026-10-06). How to read each catalogue
# field, which thresholds mean what, and when a threshold lies. One source for three readers:
# the Builder (field help), the generated page docs/data/field-guide.md (`make features-doc`)
# and the drafting prompt (after the phrasebook; `sources` are not sent to the model).
# Edit by PR. Every `name`, every field the prose names and every `affects` must exist in the
# site catalogue; a `use` value must fit the field's type, categories and declared range
# (tests/architecture/test_features.py). Values are in the field's unit: a decimal field takes
# 0.10 for 10%, pct_points takes 30 for 30, usd takes 50000000 for $50M.
#
# [[field]]      name    = the catalogue field (exact)
#                theme   = the group the page files it under (momentum and trend, liquidity, ...)
#                reads   = what the number means, low to high, in plain words
#                caveats = when the reading lies, each ending with what to check instead
#                sources = where the thresholds come from (literature, practitioner references)
# [[field.use]]  for     = the intent a trader has ("oversold bounce")
#                op / value / mode / tolerance / on_miss = the criterion as the rule grammar
#                          takes it (docs/screeners/rules.md); note = how to combine it
# [[situation]]  name / signs / affects / do: one state of the world that fools several
#                thresholds at once (a pending takeover, an earnings gap in the window)


[[field]]
name = "rollup.momentum@v1.rsi_14"
theme = "momentum and trend"
reads = "Wilder's RSI over 14 sessions, 0 to 100: the share of recent movement that was up. 50 is balance; 70 and above means the last two weeks were mostly gains (overbought), 30 and below mostly losses (oversold). In a steady uptrend RSI lives between 40 and 80 and rarely visits 30; in a downtrend between 20 and 60 (Cardwell's ranges), so 'overbought' in a bull range is strength, not a top."
caveats = [
  "A pending takeover pins the price just under the offer: RSI prints 80+ on the announcement day and then stays high for weeks with no trend behind it. Check rollup.price_moves@v1.one_day_move (one big day) with feature.atr_pct near 0 since; see the 'pending takeover' situation.",
  "In a strong trend RSI stays above 70 for weeks; 'overbought' alone is not a sell signal (Cardwell). Pair an overbought rule with feature.pct_vs_sma_20 or feature.dist_to_resistance before reading it as stretched.",
  "RSI is 100 when the 14-session run had no down close at all, which happens on thin, low-priced names that barely trade. Gate on rollup.price_stats@v2.adv_usd_20d and rollup.price_stats@v2.close first.",
  "Oversold in a downtrend keeps falling (a falling knife): an RSI below 30 is a bounce candidate only with feature.trend_state UPTREND or feature.pct_vs_sma_200 above 0.",
  "Null after a gap in the last 15 sessions or a shorter history; a hard criterion then rejects the name.",
]
sources = [
  "Wilder (1978), New Concepts in Technical Trading Systems: the 70 / 30 convention",
  "Cardwell's RSI range rules (bull 40-80, bear 20-60): https://nexusfi.com/a/concepts/cardwell-rsi-framework",
  "Relative strength index, Wikipedia: https://en.wikipedia.org/wiki/Relative_strength_index",
]
[[field.use]]
for = "oversold bounce in an uptrend"
op = "lt"
value = 30
mode = "soft"
tolerance = 5
note = "with feature.trend_state eq UPTREND (or feature.pct_vs_sma_200 gt 0) as the gate; alone it finds falling knives"
[[field.use]]
for = "momentum strength (a score, never the only gate)"
op = "gte"
value = 50
mode = "score"
tolerance = 20
note = "ranks the stronger names; the gate is rollup.price_stats@v2.ret_20d gt 0"
[[field.use]]
for = "not chasing an overbought name"
op = "lte"
value = 70
mode = "soft"
tolerance = 5
note = "a filter on entries, not a short signal; in a strong uptrend expect many names above 70"

[[field]]
name = "rollup.price_stats@v2.ret_20d"
theme = "momentum and trend"
reads = "The return over the last 20 sessions (about a month) as a fraction: 0.05 is up 5%, -0.10 is down 10%. Above 0 the month was up; beyond about 0.10 or -0.10 the move was large for a typical large cap (ATR of 1.5% a day compounds to a monthly range of that order). One-month returns tend to reverse slightly rather than continue (the short-term reversal), so this is a trend confirmation, not the academic momentum signal: that one is the 12-month return skipping the last month, which rollup.price_stats@v2.ret_60d comes nearer to."
caveats = [
  "One day can be the whole month: an earnings gap or a takeover jump of 15% leaves ret_20d at 0.15 with nineteen flat sessions around it. Check rollup.price_moves@v1.one_day_move; when it is most of ret_20d the 'momentum' is one event.",
  "After a large up month the next month leans slightly the other way (Jegadeesh 1990): a high ret_20d is weak evidence of continuation. Rank by it, do not gate hard on a large value.",
  "A null means a missing bar in the window (a halt, a listing gap) and rejects a hard criterion.",
]
sources = [
  "Jegadeesh (1990), Evidence of predictable behavior of security returns: the one-month reversal",
  "Jegadeesh and Titman (1993) and the 12-1 convention: https://alphaarchitect.com/skip-month-mystery/",
]
[[field.use]]
for = "upward momentum (the gate)"
op = "gt"
value = 0
mode = "hard"
note = "confirm with feature.pct_vs_sma_20 gt 0; rank by ret_20d descending"
[[field.use]]
for = "a strong month"
op = "gte"
value = 0.10
mode = "soft"
tolerance = 0.03
note = "check rollup.price_moves@v1.one_day_move is not most of it"
[[field.use]]
for = "a weak month (mean-reversion candidates)"
op = "lte"
value = -0.10
mode = "soft"
tolerance = 0.03
note = "with feature.trend_state eq UPTREND to buy a dip rather than a decline"

[[field]]
name = "rollup.price_stats@v2.ret_60d"
theme = "momentum and trend"
reads = "The return over the last 60 sessions (about a quarter) as a fraction. Positive means the quarter was up. Of the stored returns this is the closest to the academic momentum formation window (6 to 12 months, skipping the latest month), where past winners kept winning on average; it is still shorter than that evidence, so read it as 'the quarter was up', not as a proven factor."
caveats = [
  "A single event (earnings, a deal, an index inclusion) can be most of a quarter's return; check rollup.price_moves@v1.one_day_move and rollup.earnings@v1.last_earnings_date.",
  "Null after any missing bar in the last 61 sessions.",
]
sources = [
  "Jegadeesh and Titman (1993), Returns to buying winners and selling losers",
  "Momentum formation windows and the skip month: https://alphaarchitect.com/skip-month-mystery/",
]
[[field.use]]
for = "a longer run of momentum"
op = "gt"
value = 0
mode = "hard"
note = "use instead of ret_20d when the sentence says a longer trend; rank descending"
[[field.use]]
for = "a strong quarter"
op = "gte"
value = 0.20
mode = "soft"
tolerance = 0.05

[[field]]
name = "rollup.momentum@v1.ret_5d"
theme = "momentum and trend"
reads = "The return over the last 5 sessions (a week) as a fraction. Short windows mean-revert: a week that was sharply up or down is more likely to give some back than to continue, so this is a timing field (buy the dip in an uptrend, do not chase a spike), not a momentum field."
caveats = [
  "A week dominated by one gap day is an event, not a drift; check rollup.price_moves@v1.one_day_move.",
  "Thin names swing 5% in a week on noise; gate on rollup.price_stats@v2.adv_usd_20d.",
]
sources = [
  "Jegadeesh (1990) and Lehmann (1990): one-week to one-month contrarian profits",
]
[[field.use]]
for = "a dip to buy inside an uptrend"
op = "lte"
value = -0.03
mode = "soft"
tolerance = 0.01
note = "with feature.trend_state eq UPTREND; the dip is the entry, the trend is the reason"
[[field.use]]
for = "not chasing a spike"
op = "lte"
value = 0.08
mode = "soft"
tolerance = 0.02

[[field]]
name = "feature.pct_from_high_52w"
theme = "momentum and trend"
reads = "How far the close sits under its 52-week high, as a fraction at or below 0: -0.05 is 5% below the high, 0 is at it. Nearness to the 52-week high predicts returns better than past returns do (George and Hwang 2004: investors anchor on the high and under-react to news near it), and those profits do not reverse later. Within 10% of the high is the catalogue's own 'near' band (feature.near_52w HIGH)."
caveats = [
  "A pending takeover puts the close at its high and keeps it there; the anchoring story does not apply. See the 'pending takeover' situation.",
  "Null for a name with fewer than 240 bars in the last 252 sessions (a listing under a year old, a long halt): a hard criterion rejects it. Check instrument.listed_on.",
  "A name 50% below its high is 'cheap' only in price; nothing here says why it fell. Pair a deep-discount rule with feature.trend_state or rollup.financials@v1.financials_status.",
]
sources = [
  "George and Hwang (2004), The 52-week high and momentum investing, Journal of Finance: https://alphaarchitect.com/the-secret-to-momentum-is-the-52-week-high/",
  "Quantpedia, 52-weeks high effect in stocks: https://quantpedia.com/strategies/52-weeks-high-effect-in-stocks",
]
[[field.use]]
for = "near the 52-week high (the anchoring effect)"
op = "gte"
value = -0.10
mode = "soft"
tolerance = 0.05
note = "or feature.near_52w eq HIGH; rank by pct_from_high_52w descending (nearest first)"
[[field.use]]
for = "at a new high"
op = "gte"
value = -0.02
mode = "soft"
tolerance = 0.02
[[field.use]]
for = "well off the high (beaten down)"
op = "lte"
value = -0.30
mode = "soft"
tolerance = 0.05
note = "say why it is interesting with another field; a discount alone is not a reason"

[[field]]
name = "feature.pct_from_low_52w"
theme = "momentum and trend"
reads = "How far the close sits above its 52-week low, as a fraction at or above 0: 0.10 is 10% above the low, 0 is at it. Near the low is where 'beaten down' names are; nearness to the low has weaker evidence than nearness to the high and the names there are often there for a reason."
caveats = [
  "At the low with feature.trend_state DOWNTREND the trend is down; a bounce rule needs a turn (rollup.price_stats@v2.ret_20d gt 0, feature.pct_vs_sma_20 gt 0) or it buys the decline.",
  "A dividend cut, a failed deal or a going-concern notice puts a name at its low; check rollup.financials@v1.financials_status and instrument.financial_status.",
  "Null under 240 bars in the last 252 sessions (recent listings).",
]
sources = [
  "George and Hwang (2004): the low has less predictive power than the high",
]
[[field.use]]
for = "near the 52-week low"
op = "lte"
value = 0.10
mode = "soft"
tolerance = 0.05
note = "or feature.near_52w eq LOW; 0.20 for 'off the lows'; add a turn signal (ret_20d gt 0)"

[[field]]
name = "feature.near_52w"
theme = "momentum and trend"
reads = "Where the close sits in its 52-week range: HIGH within 10% of the high, LOW within 10% of the low, BOTH when the whole range is under about 20% (a quiet name: a utility, a bond fund, a pinned takeover target), NONE in between."
caveats = [
  "BOTH is a narrow range, not 'near both extremes': it marks low-volatility names and pinned takeover targets. Exclude it from momentum screens.",
  "Null when the 52-week high or low is unknown (under 240 bars).",
]
sources = ["George and Hwang (2004) for HIGH; BOTH is a site convention"]
[[field.use]]
for = "near the high"
op = "eq"
value = "HIGH"
mode = "hard"
[[field.use]]
for = "near the low"
op = "eq"
value = "LOW"
mode = "hard"

[[field]]
name = "feature.pct_vs_sma_20"
theme = "momentum and trend"
reads = "Close over its 20-session average minus 1: 0.03 is 3% above the one-month average, negative is below. Above 0 the short-term trend is up. Beyond about 0.08 to 0.10 above, a large cap is stretched for a month and tends to come back to the average; a pullback to it is the 'buy the dip' entry (feature.pullback_to_sma20 measures that in ATRs)."
caveats = [
  "A gap day (earnings, a deal) jumps the close far above the average in one session: a 'stretched' reading right after a gap is the event, not an overextension. Check rollup.price_moves@v1.one_day_move.",
  "Leveraged and inverse funds reset daily and drift from their index; moving-average readings describe the fund's path, not the market's. Exclude with instrument.is_leveraged eq false.",
  "Null after a gap in the last 20 sessions.",
]
sources = [
  "Brock, Lakonishok and LeBaron (1992), Simple technical trading rules: buy signals after a close above the average earned more than sell signals",
]
[[field.use]]
for = "short-term trend up (confirmation)"
op = "gt"
value = 0
mode = "soft"
tolerance = 0.02
note = "the confirmation of rollup.price_stats@v2.ret_20d gt 0"
[[field.use]]
for = "not stretched above the month's average"
op = "lte"
value = 0.08
mode = "soft"
tolerance = 0.02
note = "for entries; a breakout screen wants the opposite"

[[field]]
name = "feature.pct_vs_sma_50"
theme = "momentum and trend"
reads = "Close over its 50-session average minus 1: the intermediate trend. Above 0 the name trades above its roughly quarterly average; the 50-day average was the best performing single rule in Brock, Lakonishok and LeBaron's long Dow test. More than about 0.15 above is stretched for a large cap."
caveats = [
  "Gaps and takeovers as for the 20-day average: one event, not a trend. Check rollup.price_moves@v1.one_day_move.",
  "Leveraged and inverse funds: exclude with instrument.is_leveraged eq false.",
  "Null after a gap in the last 50 sessions or a shorter history.",
]
sources = [
  "Brock, Lakonishok and LeBaron (1992): https://ideas.repec.org/a/bla/jfinan/v47y1992i5p1731-64.html",
]
[[field.use]]
for = "above the 50-day (a loose uptrend)"
op = "gt"
value = 0
mode = "soft"
tolerance = 0.02
[[field.use]]
for = "not stretched above the 50-day"
op = "lte"
value = 0.15
mode = "soft"
tolerance = 0.03

[[field]]
name = "feature.pct_vs_sma_200"
theme = "momentum and trend"
reads = "Close over its 200-session average minus 1: the long-term trend, the daily version of Faber's 10-month moving average rule. Above 0 is the classic bull-market condition: returns after a close above the long average were higher and calmer than after a close below it. More than about 0.25 above the 200-day is far from its long average and historically gave some back; more than 0.25 below is a name in a long decline."
caveats = [
  "The rule's edge was found on indices and diversified portfolios; on a single stock a close above the 200-day is a trend filter, not a return forecast.",
  "Null for names with under 200 sessions of history (listings under ten months old) or a gap in the window; a hard criterion rejects them. Check instrument.listed_on.",
  "Leveraged and inverse funds: exclude with instrument.is_leveraged eq false and instrument.is_inverse eq false.",
]
sources = [
  "Faber (2007), A quantitative approach to tactical asset allocation (the 10-month SMA): https://www.cxoadvisory.com/?p=1115",
  "Brock, Lakonishok and LeBaron (1992)",
]
[[field.use]]
for = "long-term uptrend (the bull-market filter)"
op = "gt"
value = 0
mode = "hard"
note = "or feature.trend_state eq UPTREND for the stricter close > SMA50 > SMA200"
[[field.use]]
for = "not far above the long average"
op = "lte"
value = 0.25
mode = "soft"
tolerance = 0.05
[[field.use]]
for = "in a long decline (contrarian or avoid)"
op = "lte"
value = -0.25
mode = "soft"
tolerance = 0.05

[[field]]
name = "feature.trend_state"
theme = "momentum and trend"
reads = "UPTREND when close > SMA50 > SMA200 (price above a rising structure), DOWNTREND when close < SMA50 < SMA200, MIXED otherwise. MIXED is a large bucket: a pullback below the 50-day inside an uptrend, a bounce inside a downtrend, and every crossover in progress."
caveats = [
  "A name can be UPTREND the day after a 30% takeover jump and stay so for months without moving again; see the 'pending takeover' situation (feature.atr_pct near 0).",
  "Null under 200 sessions of history; a hard UPTREND criterion silently drops every recent listing. Check instrument.listed_on when that matters.",
  "Leveraged and inverse funds: exclude with instrument.is_leveraged eq false.",
]
sources = [
  "Faber (2007) and Brock, Lakonishok and LeBaron (1992) for the moving-average evidence; the alignment rule is a practitioner convention",
]
[[field.use]]
for = "in an uptrend"
op = "eq"
value = "UPTREND"
mode = "hard"
note = "do not combine with 'near the 52-week low'; those rarely coexist"
[[field.use]]
for = "in a downtrend"
op = "eq"
value = "DOWNTREND"
mode = "hard"

[[field]]
name = "feature.pullback_to_sma20"
theme = "momentum and trend"
reads = "True when the name is in an uptrend (feature.trend_state UPTREND) and the close is within one ATR of its 20-session average, above or below it: the dip-in-an-uptrend entry. The ATR scales 'near' to the name's own volatility, so a 1% move on a utility and a 4% move on a chip maker both count."
caveats = [
  "A pinned takeover target converges onto its average with a tiny ATR, so 'within one ATR' becomes trivially true in an UPTREND: a false pullback. Require feature.atr_pct gte 0.01.",
  "True on the day of a sharp drop through the average as much as on a gentle dip; add rollup.momentum@v1.ret_5d gte -0.06 to keep out breakdowns.",
  "Null when the trend, the average or the ATR is unknown.",
]
sources = [
  "Practitioner convention (pullback-to-moving-average entries); the Turtle rules' ATR-scaled distances",
]
[[field.use]]
for = "buy the dip in an uptrend"
op = "eq"
value = true
mode = "hard"
note = "with feature.atr_pct gte 0.01 and rollup.price_stats@v2.adv_usd_20d as gates"

[[field]]
name = "feature.breakout_20d"
theme = "momentum and trend"
reads = "True when the close is above the highest high of the previous 20 sessions and the day's volume is at least 1.5 times its 20-session average: a Donchian-style breakout with volume confirmation (1.5 to 2 times average is the usual bar, above 2 is strong participation). Breakouts fail often in ranging markets (Raschke and Connors built the 'Turtle Soup' strategy on fading them), so volume and a trend filter matter."
caveats = [
  "The announcement day of a takeover is a textbook breakout on volume, and the last move the name will make. Check feature.atr_pct in the sessions after; see the 'pending takeover' situation.",
  "An earnings gap is a breakout on volume too; whether it continues is the post-earnings drift question, not a technical one. Check rollup.earnings@v1.last_earnings_date.",
  "Index events (quarterly expiry Fridays, the Russell reconstitution in late June, S&P changes) put huge volume on a flat close; the price condition still has to hold, but treat a breakout on such a day with suspicion.",
  "Null when the prior high or the volume ratio is unknown (a gap in the last 21 sessions).",
]
sources = [
  "Volume confirmation of breakouts (1.5x to 2x the 20-day average): https://www.luxalgo.com/blog/how-volume-confirms-breakouts-in-trading/",
  "Turtle rules (20-day Donchian entries) and their failure rate; Raschke and Connors, Street Smarts (Turtle Soup)",
]
[[field.use]]
for = "breaking out on volume"
op = "eq"
value = true
mode = "hard"
note = "with feature.trend_state eq UPTREND or feature.pct_vs_sma_200 gt 0 as the trend filter"

[[field]]
name = "rollup.momentum@v1.rel_volume"
theme = "momentum and trend"
reads = "The session's volume over the average of the 20 sessions before it: 1 is normal, 2 is twice normal, 0.5 is a quiet day. Above 1.5 is the usual confirmation that a move has participation behind it; above 2 is strong; above 5 is an event. Below 0.7 on an up day is a move nobody joined."
caveats = [
  "Quarterly expiry Fridays, the Russell reconstitution (late June) and index inclusions multiply volume without any news; so do secondary offerings and block trades. High volume with a flat close (rollup.momentum@v1.ret_5d near 0) is usually one of these.",
  "Earnings days are 3 to 10 times normal volume by nature; check rollup.earnings@v1.last_earnings_date before reading a spike as unusual.",
  "On thin names a single institutional order is a 5x day; gate on rollup.price_stats@v2.adv_usd_20d.",
  "The base is the 20 sessions before today; after a very heavy week the base is inflated and today's ratio understates activity.",
]
sources = [
  "Volume confirmation thresholds: https://www.luxalgo.com/blog/how-volume-confirms-breakouts-in-trading/",
]
[[field.use]]
for = "heavy volume today"
op = "gte"
value = 1.5
mode = "soft"
tolerance = 0.3
[[field.use]]
for = "an unusual volume event"
op = "gte"
value = 3
mode = "soft"
tolerance = 0.5
note = "check rollup.earnings@v1.last_earnings_date; most 3x days are earnings or index events"

[[field]]
name = "rollup.price_moves@v1.one_day_move"
theme = "momentum and trend"
reads = "The largest single-day close-to-close move, up or down, in the last 20 sessions, as a fraction: 0.12 is a 12% day. Below about 0.04 the month had no shock; 0.08 and above is a news day for a large cap (earnings, guidance, a deal, an FDA decision). After earnings a large move tends to continue for days to weeks (the post-earnings announcement drift); a large move with no earnings behind it more often partly reverses."
caveats = [
  "It says a move happened, not why or which way: pair with rollup.earnings@v1.last_earnings_date (an earnings move) and the sign of rollup.price_stats@v2.ret_20d.",
  "A move of 0.20 or more followed by a dead-flat tape is the takeover signature; see the 'pending takeover' situation.",
  "Low-priced and thin names post 10% days on noise; gate on rollup.price_stats@v2.close and rollup.price_stats@v2.adv_usd_20d.",
  "The window is 20 sessions: a shock 21 sessions ago has dropped out of this field but still sits inside rollup.price_stats@v2.hv30.",
]
sources = [
  "Ball and Brown (1968); Bernard and Thomas (1989): the post-earnings announcement drift",
  "Short-term reversal after non-news moves: Jegadeesh (1990)",
]
[[field.use]]
for = "no shock in the last month (a calm name)"
op = "lte"
value = 0.05
mode = "soft"
tolerance = 0.02
note = "a filter for premium-selling and pullback screens"
[[field.use]]
for = "had a big one-day move"
op = "gte"
value = 0.08
mode = "soft"
tolerance = 0.02
note = "check rollup.earnings@v1.last_earnings_date to know whether it was earnings"

[[field]]
name = "feature.dist_to_resistance"
theme = "momentum and trend"
reads = "How far the nearest confirmed swing high above the close is, as a fraction of price: 0.05 is 5% of room before the last place sellers showed up. Under about 0.02 the name is at resistance; above about 0.10 there is room to run. A swing high is confirmed five sessions after it forms, so the level lags."
caveats = [
  "Null at a one-year high (no swing high above the close): a hard 'room to run' criterion rejects exactly the names breaking out. Use feature.pct_from_high_52w gte -0.02 for those.",
  "The nearest swing high can be a minor one; compare feature.dist_to_resistance_atr: under 1 ATR away the level is in today's noise.",
  "A level from eleven months ago has less meaning than one from last month; rollup.swing_levels@v1.swing_high_date says when it formed.",
]
sources = ["Practitioner convention (swing-point support and resistance)"]
[[field.use]]
for = "room to run"
op = "gte"
value = 0.10
mode = "soft"
tolerance = 0.03
note = "soft, so a name at a new high (null) is listed rather than rejected; or use pct_from_high_52w"
[[field.use]]
for = "near resistance (a sell-call or fade level)"
op = "lte"
value = 0.03
mode = "soft"
tolerance = 0.01

[[field]]
name = "feature.dist_to_support"
theme = "momentum and trend"
reads = "How far the nearest confirmed swing low below the close is, as a fraction of price: 0.03 is 3% above the last place buyers showed up. Under about 0.03 the name is at support (a stop goes just below it); above about 0.15 a stop at support is a wide one."
caveats = [
  "Null at a one-year low (no swing low below): a 'near support' criterion then rejects the names that just broke support, which may be what you want.",
  "A level more than a few ATRs away is not 'support' for a swing trade; feature.dist_to_support_atr under 2 is the usual working range.",
]
sources = ["Practitioner convention; ATR-scaled stops (Turtle rules)"]
[[field.use]]
for = "near support"
op = "lte"
value = 0.03
mode = "soft"
tolerance = 0.01
note = "with feature.trend_state eq UPTREND; support in a downtrend breaks"

[[field]]
name = "feature.dist_52w"
theme = "momentum and trend"
reads = "The distance to the nearer 52-week extreme as a fraction of it: 0 at the high or the low, 0.10 when the close is 10% from whichever is closer. It is the one-number form of 'near a 52-week extreme' (the VRP scanner's gate); feature.near_52w says which side (HIGH, LOW, BOTH)."
caveats = [
  "It does not say which extreme: a name 5% under its high and one 5% above its low both read 0.05, and they are opposite setups. Read feature.near_52w, or feature.pct_from_high_52w and feature.pct_from_low_52w, before acting on it.",
  "A pinned takeover target sits at its high with a distance near 0 for months (the 'pending takeover' situation).",
  "Null under 240 bars in the last 252 sessions (recent listings).",
]
sources = ["George and Hwang (2004) for the high; the VRP scanner's spec (docs/screeners/vrp-scanner.md) for the 10% gate"]
[[field.use]]
for = "within 10% of a 52-week extreme (the VRP gate)"
op = "lte"
value = 0.10
mode = "hard"
note = "read feature.near_52w for the side"
[[field.use]]
for = "near an extreme, listing near misses"
op = "lte"
value = 0.10
mode = "soft"
tolerance = 0.05

# ---------------------------------------------------------------------- episode behaviour

[[field]]
name = "rollup.episode_behaviour@v1.beta_252d"
theme = "episode behaviour"
reads = "The slope of the name's daily returns on SPY's over the trailing 252 sessions: 1 moves with the market, 1.5 moves half again as much (a 5% market fall is a 7.5% fall here), 0.5 half as much, below 0 against it. Under 0.8 is defensive (utilities, staples, health care), 0.8 to 1.2 average, above 1.2 high beta (technology, discretionary, financials, small caps). A position's market risk is its weight times its beta."
caveats = [
  "Beta is average co-movement, not downside behaviour: a low-beta name can fall as much as the market in a panic when correlations go to one. The episode drawdowns (dd_covid_2020 and the others) are the direct measure of that.",
  "Trailing a year: a name that changed character (a merger, a new business) carries the old beta for months.",
  "Null for young listings (under 200 overlapping returns) and when SPY's bars are missing.",
]
sources = ["Sharpe (1964) and the CAPM; beta bands as practitioners use them: https://www.tastylive.com/concepts-strategies/beta"]
[[field.use]]
for = "defensive (low beta)"
op = "lte"
value = 0.8
mode = "soft"
tolerance = 0.1
note = "with rollup.episode_behaviour@v1.corr_252d gte 0.3 so the low beta is a steady name, not noise"
[[field.use]]
for = "high beta (a market play with leverage)"
op = "gte"
value = 1.3
mode = "soft"
tolerance = 0.1
[[field.use]]
for = "market-like"
op = "between"
value = [0.8, 1.2]
mode = "soft"
tolerance = 0.1

[[field]]
name = "rollup.episode_behaviour@v1.corr_252d"
theme = "episode behaviour"
reads = "The correlation of the name's daily returns with SPY's over the trailing 252 sessions, -1 to 1: above 0.7 the name is mostly a market bet, 0.3 to 0.7 ordinary, under 0.3 it has a life of its own (gold miners, biotech, special situations), negative is rare and usually an inverse fund. Beta says how much, correlation says how reliably."
caveats = [
  "A low beta with a low correlation is noise, not defence: the regression explains little. Defensive names have a low beta with a decent correlation.",
  "Correlations rise toward 1 in a crash, whatever the trailing year said; diversification by low correlation is weakest when it is needed.",
  "Null for young listings and when SPY's bars are missing.",
]
sources = ["Standard portfolio theory (Markowitz); the correlation-in-crashes observation (Longin and Solnik 2001)"]
[[field.use]]
for = "moves with the market"
op = "gte"
value = 0.7
mode = "soft"
tolerance = 0.1
[[field.use]]
for = "its own story (low correlation)"
op = "lte"
value = 0.3
mode = "soft"
tolerance = 0.1
note = "exclude inverse funds with instrument.is_inverse eq false"

[[field]]
name = "rollup.episode_behaviour@v1.dd_covid_2020"
theme = "episode behaviour"
reads = "The worst fall of the name's close from its own running high during the Covid crash (2020-02-19 to 2020-03-23), as a negative fraction: -0.35 means it lost 35% peak to trough. SPY lost about a third; a reading better than -0.25 held up well, worse than -0.50 was hit hard (travel, energy, small caps). The name's realised behaviour in a fast, liquidity-driven crash."
caveats = [
  "Five years old: the company and its shareholders may have changed; it is evidence of the kind of name it was, not a forecast.",
  "Null for names listed after the episode or with under 80% of its sessions on file, which a hard criterion rejects: most IPOs since 2020 and every young fund.",
]
sources = ["docs/market-regime-plan.md (the episode scorecard, ADR 0047)"]
[[field.use]]
for = "held up in a fast crash"
op = "gte"
value = -0.30
mode = "soft"
tolerance = 0.05
[[field.use]]
for = "was hit hard (a high-beta or cyclical name)"
op = "lte"
value = -0.45
mode = "soft"
tolerance = 0.05

[[field]]
name = "rollup.episode_behaviour@v1.dd_hikes_2022"
theme = "episode behaviour"
reads = "The worst fall of the name's close from its own running high during the 2022 rate-hike bear market (2022-01-03 to 2022-10-12), as a negative fraction. SPY lost about a quarter; long-duration growth and unprofitable technology lost 50% to 80%, energy and value held or rose. A slow, valuation-driven decline, the opposite kind of episode to Covid."
caveats = [
  "A name that did well in 2022 and badly in 2020 (or the reverse) is telling you which kind of drawdown it is exposed to; read the three episodes together.",
  "Null for names listed after 2022 or thinly traded through it.",
]
sources = ["docs/market-regime-plan.md (the episode scorecard)"]
[[field.use]]
for = "held up in a slow bear market"
op = "gte"
value = -0.25
mode = "soft"
tolerance = 0.05
[[field.use]]
for = "was hit hard by rates (long duration)"
op = "lte"
value = -0.50
mode = "soft"
tolerance = 0.05

[[field]]
name = "rollup.episode_behaviour@v1.dd_tariffs_2025"
theme = "episode behaviour"
reads = "The worst fall of the name's close from its own running high during the 2025 tariff shock (2025-02-19 to 2025-04-08), as a negative fraction. SPY lost about a fifth in seven weeks; importers, semiconductors and small caps lost more, domestic defensives less. The most recent episode, so the most representative of today's holders."
caveats = [
  "Short and sharp, and recovered fast: a deep drawdown here with a quick recovery (rollup.episode_behaviour@v1.recovery_sessions_tariffs_2025) is a liquid high-beta name, not a broken one.",
  "Null for names listed after early 2025 or thinly traded through it.",
]
sources = ["docs/market-regime-plan.md (the episode scorecard)"]
[[field.use]]
for = "held up in the tariff shock"
op = "gte"
value = -0.20
mode = "soft"
tolerance = 0.05
[[field.use]]
for = "was hit hard by the tariff shock"
op = "lte"
value = -0.35
mode = "soft"
tolerance = 0.05

[[field]]
name = "rollup.episode_behaviour@v1.recovery_sessions_covid_2020"
theme = "episode behaviour"
reads = "Sessions from the Covid trough (2020-03-23) until the close first regained the pre-episode high: 0 means the trough itself was at or above it, about 100 is the index's own recovery (SPY regained its high in August 2020), 250 is a year. Resilience in one number: how long holders waited to be whole."
caveats = [
  "Null means not recovered within 400 sessions of the trough, or the session is before the trough: 'never came back' and 'too early to say' look the same, and a hard criterion rejects both.",
  "A fast recovery of a shallow drawdown is unremarkable; read with rollup.episode_behaviour@v1.dd_covid_2020.",
]
sources = ["docs/market-regime-plan.md; S&P 500 recovery times after bear markets (StockCharts, Bear markets and drawdowns)"]
[[field.use]]
for = "recovered as fast as the index or faster"
op = "lte"
value = 120
mode = "soft"
tolerance = 30
[[field.use]]
for = "recovered at all within the horizon"
op = "not_null"
mode = "soft"
tolerance = 0

[[field]]
name = "rollup.episode_behaviour@v1.recovery_sessions_hikes_2022"
theme = "episode behaviour"
reads = "Sessions from the 2022 trough (2022-10-12) until the close first regained the pre-episode high (the early-2022 peak). SPY took about 300 sessions (January 2024); many growth names took longer or have not, which is what a null here means."
caveats = [
  "Null is 'not within 400 sessions' as much as 'not yet': for this episode the horizon has passed, so null reads as 'did not recover within about 19 months'.",
]
sources = ["docs/market-regime-plan.md"]
[[field.use]]
for = "recovered faster than the index"
op = "lte"
value = 250
mode = "soft"
tolerance = 50
[[field.use]]
for = "recovered within the horizon"
op = "not_null"
mode = "soft"
tolerance = 0

[[field]]
name = "rollup.episode_behaviour@v1.recovery_sessions_tariffs_2025"
theme = "episode behaviour"
reads = "Sessions from the tariff-shock trough (2025-04-08) until the close first regained the pre-episode high. SPY needed about 30 sessions; a liquid high-beta name often recovered in a similar time, a name that had something else wrong took much longer."
caveats = [
  "The horizon (400 sessions after the trough) runs into late 2026: a null can still be 'not yet'.",
]
sources = ["docs/market-regime-plan.md"]
[[field.use]]
for = "recovered with the index"
op = "lte"
value = 45
mode = "soft"
tolerance = 15
[[field.use]]
for = "recovered within the horizon so far"
op = "not_null"
mode = "soft"
tolerance = 0
