# L3 site setting: the field guide (ADR 0041, amended 2026-10-06), one <theme>.toml per theme
# (the [[situation]] entries sit at the end of instrument.toml); loaded together by
# config/site/settings.py load_field_guide. Every
# [[field]] says how to read one catalogue field, which criterion means what, and when the
# reading lies; a [[situation]] is one state of the world that fools several thresholds at once.
# The keys are documented in momentum.toml. Edit by PR; `make features-doc` renders the page.

[[field]]
name = "instrument.status"
theme = "instrument gates"
reads = "Whether the listing is live: ACTIVE for a name in the current reference snapshot, DELISTED for one that left it (instrument.delisted_on says when). A screen almost always gates on ACTIVE; the drafting examples do. It is identity, not a measure, so it is hard, never soft or scored."
caveats = [
  "DELISTED names keep their history: a backtest or a results table can show one with stored features. The gate is what keeps them out of today's picks.",
  "A name that was acquired is DELISTED only after the deal closes; before that it is ACTIVE and pinned (see the 'pending takeover' situation).",
]
sources = ["Site convention (docs/data/instruments.md)"]
[[field.use]]
for = "listed today (always)"
op = "eq"
value = "ACTIVE"
mode = "hard"

[[field]]
name = "instrument.security_type"
theme = "instrument gates"
reads = "What kind of listing it is: COMMON_STOCK, ADR (a foreign company's US receipt) or ETF, among others. 'Stocks' is COMMON_STOCK and ADR; 'ETFs' is ETF. A company screen (P/E, revenue growth, market cap) wants stocks only: funds have no financials and ADRs have no P/E here."
caveats = [
  "An ADR passes a 'stocks' gate but feature.pe_ratio is null for it (the ADR ratio is not stored) and its filings are foreign; add rollup.financials@v3.is_adr eq false when the screen reads earnings.",
  "ETFs include leveraged and inverse funds; a fund screen that wants plain index exposure adds instrument.is_leveraged eq false and instrument.is_inverse eq false.",
]
sources = ["Site convention (docs/data/instruments.md; the vendor's type wins over the name rules)"]
[[field.use]]
for = "stocks"
op = "in"
value = ["COMMON_STOCK", "ADR"]
mode = "hard"
[[field.use]]
for = "ETFs"
op = "in"
value = ["ETF"]
mode = "hard"
[[field.use]]
for = "stocks and funds (options screens)"
op = "in"
value = ["COMMON_STOCK", "ADR", "ETF"]
mode = "hard"

[[field]]
name = "instrument.optionable"
theme = "instrument gates"
reads = "Whether listed options exist on the name. True is the gate for any options screen; it says nothing about how tradable those options are, which is feature.option_tier and the chain's open interest and volume."
caveats = [
  "Optionable with feature.option_tier D is a chain nobody trades: gate on the tier as well for a trade, not only on the flag.",
  "A newly optionable name has no IV history: feature.iv_rank is null for its first 60 sessions.",
]
sources = ["Site convention (the reference snapshot's optionable flag)"]
[[field.use]]
for = "has listed options"
op = "eq"
value = true
mode = "hard"
note = "add feature.option_tier in [A, B] for tradable ones"

[[field]]
name = "instrument.is_leveraged"
theme = "instrument gates"
reads = "True for a fund that targets a multiple of its index's daily return (instrument.leverage gives the multiple). Such funds reset daily and drift from the index over time (volatility decay), so trend, momentum and volatility readings describe the fund's path, not the market's."
caveats = [
  "A stock screen that does not exclude these finds 2x and 3x funds at the top of every momentum and volatility list; see the 'leveraged or inverse fund' situation.",
]
sources = ["StockCharts, Why technical analysis does not work for leveraged ETFs: https://articles.stockcharts.com/article/articles-finalbar-2024-06-why-technical-analysis-does-no-911/"]
[[field.use]]
for = "no leveraged funds"
op = "eq"
value = false
mode = "hard"
note = "pair with instrument.is_inverse eq false"

[[field]]
name = "instrument.is_inverse"
theme = "instrument gates"
reads = "True for a fund that targets the opposite of its index's daily return. An inverse fund in a 'downtrend' is a rising market; every directional reading on it is reversed and decays like a leveraged one."
caveats = [
  "Exclude from stock and trend screens with the leveraged flag; screen them deliberately or not at all (the 'leveraged or inverse fund' situation).",
]
sources = ["StockCharts, Why technical analysis does not work for leveraged ETFs: https://articles.stockcharts.com/article/articles-finalbar-2024-06-why-technical-analysis-does-no-911/"]
[[field.use]]
for = "no inverse funds"
op = "eq"
value = false
mode = "hard"

[[field]]
name = "instrument.in_sp500"
theme = "instrument gates"
reads = "Whether the name is an S&P 500 constituent in the reference snapshot. Membership is a liquidity and quality filter in one flag (the index requires profitability and float), and index flows make members trade differently: additions get bid, deletions sold, and every member moves with the ETF rebalances."
caveats = [
  "Membership changes quarterly and on corporate events; a name added last week has the flag and none of the history as a member.",
  "Not a size cut-off: the smallest members are around $10B and some $50B companies are not in (foreign domiciles, dual-class rules). feature.market_cap is the size.",
  "Null when the reference does not know; false for every ETF.",
]
sources = ["S&P Dow Jones Indices, S&P 500 eligibility criteria"]
[[field.use]]
for = "S&P 500 members only"
op = "eq"
value = true
mode = "hard"

[[field]]
name = "instrument.sector"
theme = "instrument gates"
reads = "The company's sector as derived from its SEC industry code (SIC): the broad group (energy, financials, health care, technology and so on). A screen uses it to compare like with like, because every valuation and volatility threshold is sector-dependent: a P/E of 12 is rich for a bank and cheap for software, an IV of 0.40 is calm for a biotech."
caveats = [
  "SIC-derived, so the labels follow the SEC's old industry codes rather than GICS: a platform company can sit under 'services', a conglomerate under its original business. instrument.industry is the finer SIC description.",
  "Null for funds (no SIC) and companies without a filing; a hard sector criterion drops every ETF.",
]
sources = ["SEC SIC codes (docs/data/instruments.md); sector-relative valuation as a practitioner convention"]
[[field.use]]
for = "one sector"
op = "eq"
value = "Technology"
mode = "hard"
note = "the values are the catalogue's sector labels; use in [..] for several"

[[field]]
name = "instrument.industry"
theme = "instrument gates"
reads = "The company's industry as the SEC's SIC description gives it (a few hundred labels: 'pharmaceutical preparations', 'semiconductors and related devices', 'state commercial banks'). Finer than instrument.sector: the peer group a company is valued and traded against."
caveats = [
  "SIC descriptions are decades old and self-reported at registration: many technology companies are 'services-prepackaged software' and a company that changed business keeps its original code.",
  "Null for funds and companies without a filing.",
]
sources = ["SEC SIC codes (docs/data/instruments.md)"]
[[field.use]]
for = "one industry"
op = "in"
value = ["Pharmaceutical Preparations"]
mode = "hard"
note = "the values are the catalogue's industry labels, spelled exactly"

[[field]]
name = "instrument.is_etf"
theme = "instrument gates"
reads = "True for an exchange-traded fund (and the trusts and notes the reference classes with them). A fund has no earnings, revenue or market cap here, its on-screen volume understates its liquidity (creation and redemption), and its 'sector' is null; the company fields do not apply and a company screen should exclude it."
caveats = [
  "Includes leveraged and inverse funds; instrument.is_leveraged and instrument.is_inverse single those out.",
  "instrument.security_type in [ETF] is the same gate in the three-way form; this flag is the one-bit version.",
]
sources = ["Site convention (docs/data/instruments.md)"]
[[field.use]]
for = "funds only"
op = "eq"
value = true
mode = "hard"
[[field.use]]
for = "no funds (a company screen)"
op = "eq"
value = false
mode = "hard"

# Relative strength (relative_strength@v1 and the price.toml flags over it): the instrument
# against the market (SPY), the universe's stocks and its sector ETF. Filed under this theme
# because the "momentum and trend" page is at its length cap.

[[field]]
name = "rollup.relative_strength@v1.rs_spy_63d"
theme = "instrument gates"
reads = "Relative strength against SPY over a quarter (63 sessions): (1 + the name's return) / (1 + SPY's return) - 1. 0 is level with the market, 0.10 is ten points ahead of it, -0.10 ten points behind; the value is a ratio of growth factors, so it is the same whatever the market did (a name up 5% in a market down 5% reads +0.105). Above 0 for the last quarter is the usual meaning of 'outperforming SPY' (O'Neil, Mansfield: buy leaders, not laggards)."
caveats = [
  "A name that rose on one gap (a takeover bid, an earnings jump) reads as a leader for the whole quarter. Check rollup.price_moves@v1.one_day_move and rollup.relative_strength@v1.rs_spy_trend_20d: a leader whose trend is falling has stopped leading.",
  "Against SPY every name in a rotating market looks strong or weak by its sector. Pair with rollup.relative_strength@v1.rs_sector_63d to separate stock strength from sector strength.",
  "Price return only (no dividends), split-adjusted: a high-yield name trails its total return by its yield.",
  "Null when the name or SPY has a gap in the 64 closes, or SPY is not in the symbol map; a hard criterion then rejects the name.",
]
sources = [
  "O'Neil (1988), How to Make Money in Stocks: relative price strength",
  "Levy (1967), Relative strength as a criterion for investment selection, Journal of Finance",
  "Mansfield relative strength: https://www.investopedia.com/terms/r/relativestrength.asp",
]
[[field.use]]
for = "outperforming SPY over the quarter"
op = "gt"
value = 0.0
mode = "soft"
tolerance = 0.02
note = "feature.rs_spy_positive is the same gate as a flag; add rollup.relative_strength@v1.rs_spy_trend_20d gt 0 to want it improving"
[[field.use]]
for = "a clear market leader"
op = "gte"
value = 0.10
mode = "soft"
tolerance = 0.03
note = "ten points ahead of SPY; with rollup.relative_strength@v1.mom_pctile_63d gte 0.8 so the lead is also a top-quintile return"

[[field]]
name = "rollup.relative_strength@v1.rs_spy_252d"
theme = "instrument gates"
reads = "Relative strength against SPY over a year (252 sessions): (1 + the name's return) / (1 + SPY's return) - 1. The long-run leadership reading: above 0 the name has beaten the market over the year, 0.30 is thirty points ahead. It moves slowly; a quarter that turned (rs_spy_63d) takes months to show here."
caveats = [
  "A year back is one start date: a name that fell hard 252 sessions ago and recovered reads a big positive value that says 'bounce', not 'leader'. Check rollup.trend_stats@v2.mom_12_1 (skips the last month) and rollup.relative_strength@v1.rs_spy_63d.",
  "A recent listing or a gap in the year gives null, never a shorter window: a young name is invisible to a hard criterion on this field.",
  "Price return only (no dividends).",
]
sources = [
  "O'Neil (1988), How to Make Money in Stocks: the 12-month relative price strength rank",
  "Jegadeesh and Titman (1993), Returns to buying winners and selling losers, Journal of Finance",
]
[[field.use]]
for = "a year-long market leader"
op = "gt"
value = 0.0
mode = "soft"
tolerance = 0.05
note = "with rollup.relative_strength@v1.rs_spy_63d gt 0 so the leadership is current, not a year-old move"

[[field]]
name = "rollup.relative_strength@v1.rs_line_high_252d"
theme = "instrument gates"
reads = "True when the relative-strength line (the close divided by SPY's close) stands at its highest of the last 252 sessions, today included: the name is outperforming at a new high, even if its own price is not yet at one. A rising line into a breakout is the classic leader tell (O'Neil's 'blue dot'); False means the line peaked earlier in the year."
caveats = [
  "A flat line while SPY and the name rise together can still tie its own high on a day the market dips; one day proves little. Check rollup.relative_strength@v1.rs_spy_trend_20d for whether the line has been climbing.",
  "It looks back one year only: a name that peaked relative to the market 14 months ago can print True after a long sag. Check rollup.relative_strength@v1.rs_spy_252d.",
  "Null when the name or SPY has a gap in the last 252 sessions, or SPY is not in the symbol map.",
]
sources = [
  "O'Neil (1988), How to Make Money in Stocks: the relative strength line at a new high",
]
[[field.use]]
for = "the RS line at a new high"
op = "eq"
value = true
mode = "hard"
note = "a score input more than a gate: combine with feature.breakout_20d for a leader breaking out"

[[field]]
name = "rollup.relative_strength@v1.rs_spy_trend_20d"
theme = "instrument gates"
reads = "How relative strength against SPY changed over the last 20 sessions: rs_spy_63d today minus rs_spy_63d a month ago. Above 0 relative strength is improving (the name is gaining on the market), below 0 deteriorating; 0.03 means three points better than a month ago. It is the 'RS improving' of a screen, a change rather than a level."
caveats = [
  "A name that was far behind and merely stopped falling reads positive while still lagging. Pair with rollup.relative_strength@v1.rs_spy_63d gt 0 for improving and ahead.",
  "The two 63-session windows overlap by 43 sessions, so the change comes from the 20 newest and the 20 oldest sessions: read it as a month's drift, not a day's move.",
  "Null when either 63-session window has a gap (SPY's included): 84 closes must be whole.",
]
sources = [
  "Relative-strength momentum of the line's slope, a standard charting reading: https://school.stockcharts.com/doku.php?id=technical_indicators:price_relative",
]
[[field.use]]
for = "relative strength improving"
op = "gt"
value = 0.0
mode = "soft"
tolerance = 0.02
note = "feature.rs_improving is the same gate as a flag; pair with rollup.relative_strength@v1.rs_spy_63d gt 0 to exclude laggards that merely stopped falling"
[[field.use]]
for = "an upward trend soon against the market"
op = "gt"
value = 0.0
mode = "soft"
tolerance = 0.02
note = "a name gaining on SPY over the last month; a leader's trend can still be falling, so pair with rollup.relative_strength@v1.rs_spy_63d gt 0"

[[field]]
name = "rollup.relative_strength@v1.ret_5d_pctile"
theme = "instrument gates"
reads = "Where the 5-session return ranks among the universe's stocks: the share of universe members (the stocks of the snapshot the session sees) whose return is strictly below the name's, among members with a known return. 0.9 means the name beat 90% of stocks this week, 0.1 only 10%. It is a rank, so it is comparable across market regimes; the best member reads slightly under 1."
caveats = [
  "A week is noisy: a top-decile week is as often a spike that mean-reverts as a start. Pair with rollup.relative_strength@v1.mom_pctile_63d gte 0.7 for a name that is strong over the quarter too.",
  "ETFs are ranked against stocks but never count as members, so an ETF's rank says how it would sit among stocks.",
  "Null with no universe snapshot on or before the session, fewer than 90% of its members with a bar on the session (min_coverage), fewer than 200 members with a known return (min_members), or a gap in the name's own 6 closes.",
]
sources = [
  "Cross-sectional momentum ranks: Jegadeesh and Titman (1993), Journal of Finance",
]
[[field.use]]
for = "a top-quintile week"
op = "gte"
value = 0.8
mode = "soft"
tolerance = 0.05
note = "with rollup.relative_strength@v1.mom_pctile_63d gte 0.7; alone it finds one-week spikes"

[[field]]
name = "rollup.relative_strength@v1.mom_pctile_63d"
theme = "instrument gates"
reads = "Where the 63-session (a quarter) return ranks among the universe's stocks: the share of universe members whose return is strictly below the name's, among members with a known return. 0.9 is the top decile of the quarter, 0.5 the median stock, 0.1 the bottom decile. 'Top decile momentum' is this at or above 0.9."
caveats = [
  "Ties share the lower rank, and the best member reads slightly under 1 (n - 1 of n are below it): gte 0.9 is a top decile, not 'above 90% of everything'.",
  "A rank hides magnitude: in a flat market the top decile may have gained 5%. Read rollup.price_stats@v2.ret_60d for the size.",
  "Top-decile quarterly winners are the most extended names: add feature.stretch_sma50_atr lte 4 to avoid chasing.",
  "Null with no universe snapshot on or before the session, fewer than 90% of its members with a bar on the session (min_coverage), fewer than 200 members with a known return (min_members), or a gap in the name's own 64 closes.",
]
sources = [
  "Jegadeesh and Titman (1993), Returns to buying winners and selling losers, Journal of Finance",
  "O'Neil (1988), How to Make Money in Stocks: relative price strength rank (top 20%)",
]
[[field.use]]
for = "top decile momentum"
op = "gte"
value = 0.9
mode = "soft"
tolerance = 0.05
note = "with feature.pct_vs_sma_200 gt 0 so a bounce in a downtrend does not qualify"
[[field.use]]
for = "a top-quintile quarter"
op = "gte"
value = 0.8
mode = "soft"
tolerance = 0.05

[[field]]
name = "rollup.relative_strength@v1.mom_pctile_252d"
theme = "instrument gates"
reads = "Where the 252-session (a year) return ranks among the universe's stocks: the share of universe members whose return is strictly below the name's, among members with a known return. 0.9 is the top decile of the year, 0.5 the median. The classic momentum rank; it includes the last month, which mom_12_1 skips."
caveats = [
  "It includes the most recent month, where short-term reversal works against it: a name at 0.95 after a spike this month may pull back. Check rollup.trend_stats@v2.mom_12_1 and rollup.relative_strength@v1.ret_5d_pctile.",
  "A rank over a year favours names that are already extended; add feature.pct_vs_sma_50 lte 0.2 when you do not want to chase.",
  "Null with no universe snapshot on or before the session, fewer than 90% of its members with a bar on the session (min_coverage), fewer than 200 members with a known return (min_members), or a gap in the name's own 253 closes (a recent listing).",
]
sources = [
  "Jegadeesh and Titman (1993), Returns to buying winners and selling losers, Journal of Finance",
  "Fama and French (2012), Size, value and momentum in international stock returns",
]
[[field.use]]
for = "top decile momentum over the year"
op = "gte"
value = 0.9
mode = "soft"
tolerance = 0.05
note = "with rollup.relative_strength@v1.mom_pctile_63d gte 0.7 so the year's leadership is still running"

[[field]]
name = "rollup.relative_strength@v1.sector_etf"
theme = "instrument gates"
reads = "The ticker of the sector ETF the name's sector maps to: Technology XLK, Health Care XLV, Financials XLF, Consumer Discretionary XLY, Consumer Staples XLP, Energy XLE, Industrials XLI, Materials XLB, Utilities XLU, Real Estate XLRE, Communication Services XLC. The sector is a coarse market sector derived from the SEC SIC code, not a GICS sector; it names the benchmark that sector_ret_63d, rs_sector_63d and sector_rank_63d compare against."
caveats = [
  "The SIC code is the company's old filing category: a name that is now a software business filed under an industrial code reads Industrials. Treat the sector as a first approximation and check instrument.name or the SEC description for a name that matters.",
  "ETFs and funds listed as such in the universe have no sector here (null), so a sector screen drops them; gate on instrument.security_type for stocks anyway.",
  "Null when the company snapshot on or before the session has no sector for the name, or the sector has no ETF.",
]
sources = [
  "SPDR Select Sector ETFs: https://www.sectorspdrs.com",
  "SEC SIC code list: https://www.sec.gov/search-filings/standard-industrial-classification-sic-code-list",
]
[[field.use]]
for = "technology names"
op = "eq"
value = "XLK"
mode = "hard"
note = "a sector filter; with rollup.relative_strength@v1.sector_rank_63d lte 3 for names in a leading sector"

[[field]]
name = "rollup.relative_strength@v1.sector_ret_63d"
theme = "instrument gates"
reads = "The 63-session (a quarter) return of the name's sector ETF: how the sector has done. 0.08 is a sector up 8% in a quarter, below 0 a sector in decline. It is the benchmark for rs_sector_63d and the number the sector rank orders."
caveats = [
  "An ETF's price return leaves out dividends, which matter for Utilities and Real Estate: their sector return runs about a point per quarter below total return.",
  "A sector can rise because three mega-caps carry it (XLK, XLC): a strong sector return is not breadth. Check feature.sector_leader and the name's own rollup.relative_strength@v1.rs_sector_63d.",
  "Null when sector_etf is null, or the ETF is not in the symbol map or has a gap in its 64 closes.",
]
sources = [
  "SPDR Select Sector ETFs: https://www.sectorspdrs.com",
]
[[field.use]]
for = "a rising sector"
op = "gt"
value = 0.0
mode = "soft"
tolerance = 0.02
note = "with rollup.relative_strength@v1.sector_rank_63d lte 5 so the sector is also above the middle of the eleven"

[[field]]
name = "rollup.relative_strength@v1.rs_sector_63d"
theme = "instrument gates"
reads = "Relative strength against the name's own sector ETF over a quarter: (1 + the name's return) / (1 + the ETF's return) - 1. Above 0 the name beat its sector, 0.10 ten points ahead; it separates stock strength from sector strength (a name up 20% in a sector up 20% reads 0)."
caveats = [
  "The sector benchmark is the SIC heuristic's: a name classified into the wrong sector is measured against the wrong ETF. Check rollup.relative_strength@v1.sector_etf.",
  "A heavyweight is a large part of its own sector ETF, so its relative strength against it is damped toward 0.",
  "Null when sector_ret_63d is null or the name's own 64 closes have a gap.",
]
sources = [
  "Levy (1967), Relative strength as a criterion for investment selection, Journal of Finance",
]
[[field.use]]
for = "beating its sector"
op = "gt"
value = 0.0
mode = "soft"
tolerance = 0.02
note = "with rollup.relative_strength@v1.rs_spy_63d gt 0 for a name that leads both its sector and the market"

[[field]]
name = "rollup.relative_strength@v1.sector_rank_63d"
theme = "instrument gates"
reads = "The rank of the name's sector ETF among the eleven sector ETFs by 63-session return: 1 the strongest sector of the quarter, 11 the weakest, ties sharing the better rank. 1 to 3 is a leading sector, 9 to 11 a lagging one; it is the same number for every name of a sector."
caveats = [
  "A rank hides the gap: first and second can be a point apart, or ten. Check rollup.relative_strength@v1.sector_ret_63d for the size.",
  "Eleven sectors hold thousands of names: the top three sectors pass many of them, so 'sector leader' is not a scarce filter. Add rollup.relative_strength@v1.mom_pctile_63d gte 0.8 for the leader within it.",
  "Null when sector_ret_63d is null, or fewer than 6 of the 11 ETFs have a complete window (min_sector_etfs).",
]
sources = [
  "Sector rotation by relative strength: https://school.stockcharts.com/doku.php?id=market_analysis:sector_rotation_analysis",
]
[[field.use]]
for = "a name in a leading sector"
op = "lte"
value = 3
mode = "soft"
tolerance = 1
note = "feature.sector_leader is the same gate as a flag; with rollup.relative_strength@v1.rs_sector_63d gt 0 for a leader within it"

[[field]]
name = "feature.rs_spy_positive"
theme = "instrument gates"
reads = "True when the name beat SPY over the last 63 sessions (rs_spy_63d above 0), False when it matched or lagged it. The flag form of 'outperforming SPY' for a quarter; the size of the lead is rollup.relative_strength@v1.rs_spy_63d."
caveats = [
  "A flag hides how far ahead: 0.1 points ahead and 30 points ahead are both True. Check rollup.relative_strength@v1.rs_spy_63d for a minimum lead.",
  "Null when rs_spy_63d is null (a gap in the quarter, or SPY not in the symbol map); a hard criterion then rejects the name.",
]
sources = ["Levy (1967), Relative strength as a criterion for investment selection, Journal of Finance"]
[[field.use]]
for = "outperforming SPY over the quarter"
op = "eq"
value = true
mode = "hard"
note = "with feature.rs_improving eq true for relative strength that is still rising"

[[field]]
name = "feature.rs_improving"
theme = "instrument gates"
reads = "True when relative strength against SPY is improving: rs_spy_trend_20d above 0, i.e. the 63-session relative strength is higher than it was 20 sessions ago. The flag form of 'RS improving'; it says nothing about the level."
caveats = [
  "A laggard that stopped falling reads True while still behind the market. Pair with feature.rs_spy_positive eq true for improving and ahead.",
  "Null when rs_spy_trend_20d is null (a gap in either 63-session window, or SPY not in the symbol map).",
]
sources = ["Relative-strength line slope: https://school.stockcharts.com/doku.php?id=technical_indicators:price_relative"]
[[field.use]]
for = "relative strength improving"
op = "eq"
value = true
mode = "soft"
tolerance = 0
note = "with feature.rs_spy_positive eq true so a recovering laggard does not qualify"

[[field]]
name = "feature.sector_leader"
theme = "instrument gates"
reads = "True when the name's sector is one of the three strongest of the eleven sector ETFs over 63 sessions (sector_rank_63d at most 3), False for any other sector. The flag form of 'strong sector'; the rank and the return are rollup.relative_strength@v1.sector_rank_63d and rollup.relative_strength@v1.sector_ret_63d."
caveats = [
  "It describes the sector, not the name: a laggard in a leading sector is True. Add rollup.relative_strength@v1.rs_sector_63d gt 0 for a name that is itself leading.",
  "Null when sector_rank_63d is null (no sector or ETF for the name, the ETF has no complete window, or fewer than 6 ETFs do).",
]
sources = ["Sector rotation by relative strength: https://school.stockcharts.com/doku.php?id=market_analysis:sector_rotation_analysis"]
[[field.use]]
for = "a name in a strong sector"
op = "eq"
value = true
mode = "hard"
note = "with rollup.relative_strength@v1.rs_sector_63d gt 0 for a leader within it"

[[field]]
name = "instrument.exchange"
theme = "instrument gates"
reads = "The exchange the stock is listed on, as the symbol directory gives it: NASDAQ for Nasdaq-listed names (the Nasdaq Trader directory is the universe's source). Identity, not a measure, so hard, never soft or scored."
caveats = [
  "Names listed on other exchanges carry other codes (the directory's other-listed file); a 'Nasdaq stocks' gate drops every NYSE and NYSE American name, including S&P 500 members that are not on Nasdaq.",
  "A company that moves its listing changes value on the snapshot after the move; a backtest reads the snapshot of its own session.",
]
sources = ["Site convention (docs/data/instruments.md; Nasdaq Trader symbol directory)"]
[[field.use]]
for = "Nasdaq-listed names"
op = "eq"
value = "NASDAQ"
mode = "hard"

# Skew, skew rank and the IV term structure (skew@v1, skew_history@v1, iv_term@v1, positioning.toml):
# theme "implied volatility"; filed in instrument.toml because the volatility and option-chain guide files reached their line cap.

[[field]]
name = "rollup.skew@v1.skew_status"
theme = "implied volatility"
reads = "Whether the 30-day skew has a value: OK (two expiries around 30 days), SINGLE_EXPIRY (one usable expiry, its vols unchanged, still a value), or the first failing step: NO_SPOT, NO_CHAIN, NO_EXPIRY (none 7 to 90 days out), NO_ATM (no ATM vol from the two-sided, tight quotes) or NO_WING (an ATM vol, but the 25-delta strikes are not bracketed on a side)."
caveats = [
  "NO_ATM and NO_WING are thin chains: skew is computed only from quotes within 35% spread, never guessed, so a name with a sparse chain reads null rather than wrong.",
]
sources = ["Site convention (features/rollups/positioning/skew.py)"]
[[field.use]]
for = "a priced skew"
op = "eq"
value = "OK"
mode = "soft"
tolerance = 0
note = "the near miss is SINGLE_EXPIRY, one expiry's skew rather than the 30-day one"

[[field]]
name = "rollup.skew@v1.skew"
theme = "implied volatility"
reads = "The normalised 25-delta skew at 30 days: (put vol at delta -0.25 minus call vol at +0.25) over the ATM vol. Positive means puts are richer than calls, the normal shape for stocks: about 0.10 to 0.20 is ordinary, above about 0.25 puts are rich (downside protection is expensive: collar and put-spread sellers like it, a put buyer pays up), near 0 flat, negative call-rich (a takeover, a squeeze, a meme name where the upside is what is bid). Dividing by ATM vol makes a 20-vol and an 80-vol name comparable."
caveats = [
  "The level of a skew is partly structural: index ETFs sit high, single names lower, and a name's own history matters more than the cross-section; rollup.skew_history@v1.skew_rank_252d says where it is for the name, but is null for the first 60 sessions of stored chains.",
  "Our delta at each contract's own IV, from after-close mids of tight quotes; one stale wing quote moves it. Read rollup.skew@v1.skew_status and compare rollup.skew@v1.ne_skew, which should agree in sign.",
  "An earnings report inside 30 days lifts the ATM vol and the wings differently, so the ratio can move with no change in sentiment; check rollup.earnings@v1.days_to_earnings.",
  "Null when the status is not OK or SINGLE_EXPIRY.",
]
sources = [
  "Risk reversal and skew: https://www.investopedia.com/terms/r/risk-reversal.asp",
  "Normalising the risk reversal by ATM vol: Sinclair (2013), Volatility Trading",
]
[[field.use]]
for = "puts rich (a steep put skew)"
op = "gte"
value = 0.25
mode = "soft"
tolerance = 0.05
note = "with rollup.skew@v1.skew_status eq OK; prefer rollup.skew_history@v1.skew_rank_252d gte 0.8 once a rank exists"
[[field.use]]
for = "call-rich skew (calls priced above puts)"
op = "lte"
value = -0.05
mode = "soft"
tolerance = 0.05
note = "rare; check for a pending takeover or a squeeze (rollup.price_moves@v1.one_day_move)"

[[field]]
name = "rollup.skew@v1.iv_25p"
theme = "implied volatility"
reads = "The put vol at our delta -0.25 interpolated to 30 days, as a fraction: 0.34 is 34%. The price of downside protection one quarter of the way out of the money, in vol terms; compared with rollup.skew@v1.iv_atm it is the put wing's premium."
caveats = [
  "Linear in delta between the two quotes around -0.25, in total variance across expiries; no extrapolation, so a chain that does not reach a 25-delta put is null (NO_WING), not clipped.",
  "Null when the skew status is not OK or SINGLE_EXPIRY.",
]
sources = ["Site convention (docs/data/positioning.md OP3)"]
[[field.use]]
for = "expensive downside puts"
op = "gte"
value = 0.40
mode = "soft"
tolerance = 0.05
note = "an absolute level; prefer feature.skew_rr25 or rollup.skew@v1.skew for the shape"

[[field]]
name = "rollup.skew@v1.iv_25c"
theme = "implied volatility"
reads = "The call vol at our delta +0.25 interpolated to 30 days, as a fraction. The price of upside, one quarter of the way out of the money; below rollup.skew@v1.iv_25p on a normal stock, above it when calls are bid."
caveats = [
  "Same construction and nulls as rollup.skew@v1.iv_25p.",
]
sources = ["Site convention (docs/data/positioning.md OP3)"]
[[field.use]]
for = "calls bid above the ATM vol"
op = "gte"
value = 0.40
mode = "soft"
tolerance = 0.05
note = "with rollup.skew@v1.skew lte 0 for a call-rich skew"

[[field]]
name = "rollup.skew@v1.iv_atm"
theme = "implied volatility"
reads = "The at-the-money vol the skew is measured against: the mean of the call vol at delta +0.50 and the put vol at -0.50, interpolated to 30 days, as a fraction. Close to rollup.iv30@v1.iv30 (another method, the forward-strike average) and within a few points of it on a liquid name."
caveats = [
  "Both a +0.50 call and a -0.50 put must bracket, otherwise the status is NO_ATM and the vol is null; prefer rollup.iv30@v1.iv30 for a plain 30-day ATM vol.",
]
sources = ["Site convention (docs/data/positioning.md OP3)"]
[[field.use]]
for = "a name that is volatile at the money"
op = "gte"
value = 0.40
mode = "soft"
tolerance = 0.05

[[field]]
name = "rollup.skew@v1.ne_skew"
theme = "implied volatility"
reads = "The same normalised 25-delta skew at the next expiry (the first listed one at least one day out, weeklies included), with no interpolation. The skew of the nearest event or weekly pin rather than of the month; compare it with rollup.skew@v1.skew: a next-expiry skew far above the 30-day one means the near-term downside is what is bid."
caveats = [
  "Very short expiries have 25-delta strikes close to the money and noisy vols: read rollup.skew@v1.ne_dte and ignore it under about 7 days.",
  "Null when the next expiry has no ATM vol or no 25-delta put and call among its tight quotes, whatever the 30-day status is.",
]
sources = ["Site convention (docs/data/positioning.md OP3)"]
[[field.use]]
for = "near-term puts rich"
op = "gte"
value = 0.25
mode = "soft"
tolerance = 0.05
note = "with rollup.skew@v1.ne_dte gte 7 so a pinned weekly is not read as a view"

[[field]]
name = "rollup.skew@v1.ne_dte"
theme = "implied volatility"
reads = "Calendar days from the session to the next expiry, the one rollup.skew@v1.ne_skew reads: 1 to 7 on a name with weeklies, up to a month on a monthly-only chain."
caveats = [
  "Weekly and daily expiries make it small on liquid names; a screen on ne_skew should floor it.",
]
sources = ["Site convention (docs/data/positioning.md OP3)"]
[[field.use]]
for = "a next expiry far enough out to read"
op = "gte"
value = 7
mode = "soft"
tolerance = 2

[[field]]
name = "feature.skew_rr25"
theme = "implied volatility"
reads = "The raw 25-delta risk reversal at 30 days: put vol minus call vol in vol points as a fraction (0.06 is six points). Positive: puts richer than calls. What a collar or a put spread is quoted in; rollup.skew@v1.skew divides it by the ATM vol to compare names of different vol level."
caveats = [
  "A high-vol name has a large raw reversal at an ordinary skew: compare names through rollup.skew@v1.skew, one name over time through either.",
  "Null when the skew status is not OK or SINGLE_EXPIRY.",
]
sources = ["Risk reversal: https://www.investopedia.com/terms/r/risk-reversal.asp"]
[[field.use]]
for = "puts at least six vol points over calls"
op = "gte"
value = 0.06
mode = "soft"
tolerance = 0.01
note = "with rollup.skew@v1.skew gte 0.2 so a high-vol name is not read as skewed"

[[field]]
name = "rollup.skew_history@v1.skew_rank_252d"
theme = "implied volatility"
reads = "Skew rank, 0 to 1: where today's 30-day skew sits between the year's lowest and highest. Above 0.8 is a stretched put premium for the name (puts are as rich as they have been this year), below 0.2 the flattest. The year the rank needs is built from stored chains, which start on 2026-10-02: every name reads null until it has 60 sessions with a skew (about the end of 2026), and a full year around October 2027."
caveats = [
  "One spike sets the year's maximum and squashes later readings, as for IV rank; rollup.skew_history@v1.skew_percentile_252d is the steadier cross-check (one extreme day moves it less).",
  "A short window is a short sample: PROVISIONAL (rollup.skew_history@v1.skew_rank_status) means under a year of skews, so a rank near 1 can be an ordinary day.",
  "Null while skew_rank_status is UNKNOWN, with no skew today, or when every skew in the window is equal.",
]
sources = ["https://flashalpha.com/articles/iv-rank-vs-iv-percentile-difference-which-matters (the same rank construction)"]
[[field.use]]
for = "a stretched put premium for the name"
op = "gte"
value = 0.8
mode = "soft"
tolerance = 0.1
note = "with rollup.skew_history@v1.skew_rank_status in PROVISIONAL or FULL"

[[field]]
name = "rollup.skew_history@v1.skew_percentile_252d"
theme = "implied volatility"
reads = "The share of the last 252 sessions' skews below today's, 0 to 1. The steadier companion of rollup.skew_history@v1.skew_rank_252d: one extreme day does not distort it."
caveats = [
  "Null while the rank status is UNKNOWN (fewer than 60 sessions with a skew), with no skew today, or without an earlier skew.",
]
sources = ["https://flashalpha.com/articles/iv-rank-vs-iv-percentile-difference-which-matters"]
[[field.use]]
for = "puts richer than on most days of the year"
op = "gte"
value = 0.8
mode = "soft"
tolerance = 0.1

[[field]]
name = "rollup.skew_history@v1.history_days"
theme = "implied volatility"
reads = "Sessions of the 252-session window with a 30-day skew, today included: 60 is the floor for a rank, 252 a full year. Chains are stored from 2026-10-02, so counts are short for every name until a year has passed."
caveats = [
  "A session with no skew (no chain, or a chain with no 25-delta wing) is a gap, not filled.",
]
sources = ["Site convention (docs/data/positioning.md OP3)"]
[[field.use]]
for = "enough history for a skew rank"
op = "gte"
value = 60
mode = "hard"

[[field]]
name = "rollup.skew_history@v1.skew_rank_status"
theme = "implied volatility"
reads = "How complete the skew history is for the rank: UNKNOWN below 60 sessions with a skew (no rank), PROVISIONAL below 252, FULL from 252. Every name is UNKNOWN until about the end of 2026."
caveats = [
  "PROVISIONAL over a short window makes an ordinary skew rank near 1; read rollup.skew@v1.skew with it.",
]
sources = ["Site convention (docs/data/positioning.md OP3)"]
[[field.use]]
for = "a rank over a full year"
op = "eq"
value = "FULL"
mode = "soft"
tolerance = 0
note = "the near miss is PROVISIONAL"

[[field]]
name = "rollup.iv_term@v1.iv_term_status"
theme = "implied volatility"
reads = "Whether the term points have values: OK (both), or the first failing step: NO_SPOT, NO_CHAIN, NO_NEXT (no ATM vol at the next expiry) or NO_90D (no pair of expiries 30 to 180 days out around 90 days with ATM vols). The side that exists keeps its value."
caveats = [
  "A single listed expiry in the 30 to 180 day window is not a 90-day vol: NO_90D, where rollup.iv30@v1.iv30_status would say SINGLE_EXPIRY.",
]
sources = ["Site convention (features/rollups/positioning/iv_term.py)"]
[[field.use]]
for = "both term points priced"
op = "eq"
value = "OK"
mode = "hard"

[[field]]
name = "rollup.iv_term@v1.iv_next"
theme = "implied volatility"
reads = "The at-the-money vol at the next expiry (the first listed one at least one day out, weeklies included), as a fraction: iv30's method on that single expiry. Above rollup.iv30@v1.iv30 when an event sits in the nearest expiry; feature.term_ratio_next_30 is that comparison."
caveats = [
  "A few days to expiry make it noisy, and pin risk bids the at-the-money options; read rollup.skew@v1.ne_dte for how many days out it is.",
  "Null when the status is NO_SPOT, NO_CHAIN or NO_NEXT.",
]
sources = ["Site convention (docs/data/positioning.md)"]
[[field.use]]
for = "a high near-term vol"
op = "gte"
value = 0.60
mode = "soft"
tolerance = 0.1
note = "with feature.term_ratio_next_30 gte 1.3 to know it is an event, not the name's level"

[[field]]
name = "rollup.iv_term@v1.iv_90d"
theme = "implied volatility"
reads = "Our constant 90-day at-the-money vol as a fraction: the two expiries around 90 days among 30 to 180 days out (standard monthlies first), each priced as in rollup.iv30@v1.iv30, interpolated in total variance. The back of the term structure: the vol the market charges for a quarter."
caveats = [
  "Needs both expiries of the pair with ATM vols: a thin back month makes it null (NO_90D) and the term ratio with it.",
  "A name's back vol sits near its long-run level; a front vol far above it is stress or an event, far below it is calm.",
]
sources = ["Site convention (docs/data/positioning.md)"]
[[field.use]]
for = "a high long-dated vol"
op = "gte"
value = 0.40
mode = "soft"
tolerance = 0.05

[[field]]
name = "feature.term_ratio_30_90"
theme = "implied volatility"
reads = "The front of the vol term structure over the back: our 30-day ATM vol over the 90-day one. 1 is flat; above 1 is backwardation (the front richer than the back: an event or stress is priced near, calendars sell the front), above about 1.1 a clear one; below 1 is contango, the normal shape, below about 0.9 steep (calendars buy the front cheaply)."
caveats = [
  "An earnings date inside 30 days (rollup.earnings@v1.days_to_earnings) lifts the 30-day vol and the ratio with it, with no stress in the market; feature.term_ratio_next_30 isolates the front expiry.",
  "The two vols come from different expiries and spot rules (the 30-day one reads the feed's price, the 90-day one the close), a small error against a 0.1 threshold.",
  "Null when either vol is null; a single usable expiry is not a 90-day vol.",
]
sources = ["Term structure of implied volatility and calendar spreads: Natenberg, Option Volatility and Pricing"]
[[field.use]]
for = "backwardation (the front richer than the back)"
op = "gte"
value = 1.1
mode = "soft"
tolerance = 0.05
note = "with rollup.earnings@v1.days_to_earnings gt 30 to rule out a report"
[[field.use]]
for = "steep contango (the front cheap against the back)"
op = "lte"
value = 0.9
mode = "soft"
tolerance = 0.05

[[field]]
name = "feature.term_ratio_next_30"
theme = "implied volatility"
reads = "The front-expiry premium: the ATM vol at the next expiry over the 30-day vol. 1 is no premium; above 1.2 an event (earnings, a ruling) is priced into the nearest expiry, above about 1.3 clearly so. After the event the premium drops out."
caveats = [
  "A next expiry a few days out is noisy and pin-bid: read rollup.skew@v1.ne_dte and floor it near 7 days.",
  "A name with weeklies has a different next expiry from one with monthlies only, so ratios of the two are not like for like.",
  "Null when either vol is null.",
]
sources = ["Event vol in the front expiry: https://www.tastylive.com/concepts-strategies/implied-volatility-earnings"]
[[field.use]]
for = "an event priced into the nearest expiry"
op = "gte"
value = 1.3
mode = "soft"
tolerance = 0.1
note = "with rollup.skew@v1.ne_dte gte 7"

# The session's bar shape and the named candles (candle@v1, and the inside_day_breakout and
# strong_close expressions in config/site/features/technical/swing.toml): what the day's open, high, low
# and close say on their own. A single candle means little without where it formed. Filed under
# "volume" because the momentum and price-level pages are at their 1000-line cap.

[[situation]]
name = "pending takeover"
signs = "One day up 15% to 40% (rollup.price_moves@v1.one_day_move), then a dead tape: feature.atr_pct under 0.005, rollup.price_stats@v2.hv20 under 0.10, feature.range_20d_pct tiny, rollup.iv_history@v2.iv30 collapsed and feature.iv_rank near 0, the close a few percent under a round number (the offer) for weeks. The merger-arbitrage spread of 2% to 3% that then shrinks toward 0 is all the price will do until the deal closes or breaks."
affects = ["rollup.momentum@v1.rsi_14", "rollup.price_stats@v2.ret_20d", "rollup.price_stats@v2.ret_60d", "feature.pct_from_high_52w", "feature.near_52w", "feature.trend_state", "feature.breakout_20d", "feature.pullback_to_sma20", "feature.iv_rank", "feature.iv_percentile", "feature.iv_hv_ratio", "feature.atr_pct", "feature.range_20d_pct", "rollup.price_stats@v2.hv20"]
do = "The catalogue has no deal flag yet (a planned feature). Until then every momentum, breakout, calm-name and cheap-options screen should carry feature.atr_pct gte 0.005 (soft) and treat a name whose one_day_move is most of its ret_20d as an event, not a trend."

[[situation]]
name = "earnings gap inside the window"
signs = "rollup.earnings@v1.last_earnings_date within the last 20 to 30 sessions and rollup.price_moves@v1.one_day_move of 0.05 or more."
affects = ["rollup.price_stats@v2.hv20", "rollup.price_stats@v2.hv30", "feature.iv_hv_spread", "feature.iv_hv_ratio", "rollup.price_stats@v2.ret_20d", "rollup.momentum@v1.rel_volume", "feature.breakout_20d", "feature.atr_pct", "rollup.momentum@v1.rsi_14"]
do = "Realised volatility and the ATR are inflated by one day for the length of their window, so IV-over-HV premiums look thin and 'volatile' flags fire. After earnings a large move tends to continue (the post-earnings drift), which makes a post-earnings breakout more trustworthy than one on no news; a large move with no report behind it more often partly reverses. Prefer rollup.price_stats@v2.hv20_yz when comparing volatility across names."

[[situation]]
name = "recent listing, spin-off or long halt"
signs = "instrument.listed_on or instrument.first_seen within the last year; rollup.price_stats@v2.history_days under 240; rollup.iv_history@v2.history_days under 60."
affects = ["feature.pct_from_high_52w", "feature.pct_from_low_52w", "feature.near_52w", "feature.pct_vs_sma_200", "feature.trend_state", "feature.iv_rank", "feature.iv_percentile", "feature.revenue_growth_yoy", "feature.pe_ratio"]
do = "These fields are null, and a null never passes a hard criterion (missing data never passes), so a screen with hard long-window criteria silently excludes every new name. Use soft or score for those criteria when new listings are wanted, or state instrument.listed_on explicitly."

[[situation]]
name = "leveraged or inverse fund"
signs = "instrument.is_leveraged eq true or instrument.is_inverse eq true (instrument.leverage gives the multiple)."
affects = ["feature.pct_vs_sma_20", "feature.pct_vs_sma_50", "feature.pct_vs_sma_200", "feature.trend_state", "rollup.price_stats@v2.ret_20d", "rollup.price_stats@v2.ret_60d", "feature.atr_pct", "rollup.price_stats@v2.hv20", "feature.pct_from_high_52w", "feature.pct_from_low_52w"]
do = "Daily resetting funds drift from their index (volatility decay), so trend and momentum readings describe the fund's path, not the market, and an inverse fund in a 'downtrend' is a rising market. Exclude them from stock screens with instrument.is_leveraged eq false and instrument.is_inverse eq false; screen them deliberately or not at all."

[[situation]]
name = "low-priced or thin name"
signs = "rollup.price_stats@v2.close under 5 or rollup.price_stats@v2.adv_usd_20d under 1000000."
affects = ["feature.atr_pct", "rollup.momentum@v1.rsi_14", "rollup.momentum@v1.rel_volume", "rollup.price_moves@v1.one_day_move", "feature.breakout_20d", "rollup.price_stats@v2.hv20"]
do = "Every volatility and momentum reading is inflated by the tick size, wide spreads and single orders: a 10% day, a 5x volume day and an RSI of 100 are noise here. Put a price floor and a dollar-volume gate first in every screen; the drafting examples do."

[[situation]]
name = "index and expiry days"
signs = "A quarterly expiry Friday (third Friday of March, June, September, December), the Russell reconstitution (the last Friday of June), an S&P index change, a large ETF rebalance."
affects = ["rollup.momentum@v1.rel_volume", "feature.breakout_20d", "feature.option_chain_volume"]
do = "Volume is several times normal across the market with no information in it; a volume rule fires everywhere. Read a breakout or an unusual-volume screen from such a session with that in mind, or require the price condition on its own (the close above the prior high, rollup.momentum@v1.ret_5d) before trusting the volume."

[[situation]]
name = "a null is not a value"
signs = "The field is often null by construction: feature.pe_ratio (loss makers, ADRs), feature.iv_rank (under 60 sessions of IV), the 52-week fields (under 240 bars), rollup.earnings@v1.days_to_earnings (no announced date, every ETF), feature.option_tier (a failed chain run)."
affects = ["feature.pe_ratio", "feature.revenue_growth_yoy", "feature.iv_rank", "feature.iv_percentile", "feature.pct_from_high_52w", "feature.pct_from_low_52w", "rollup.earnings@v1.days_to_earnings", "feature.earnings_before_expiry", "feature.option_tier", "feature.market_cap"]
do = "A null never passes a hard criterion and a soft one lists it as a near miss; so a hard 'pe_ratio lt 15' drops every unprofitable company and 'days_to_earnings gt 10' drops every ETF. Choose hard only when excluding the unknown is the intent; otherwise soft (listed with the reason) or score (ranked lower). 'not_null' is the explicit way to require the fact."

[[field]]
name = "rollup.ibkr_iv_history@v1.ibkr_iv_chg_21d"
theme = "implied volatility"
reads = "IBKR's 30-day implied vol now minus 21 sessions ago (about a month), as a fraction (0.03 is three vol points). IBKR's IV30 blends calls and puts, so it tests the overall IV-change effect, not the call-minus-put split (rollup.cp_iv_history@v1.atm_call_iv_chg_21d and atm_put_iv_chg_21d). Unlike the chain-derived changes it has history: IBKR's IV reaches back about 502 sessions. Personal-use data: it carries the personal licence."
caveats = [
  "It moves with the market: when every name's IV rises in a sell-off the change says little; judge it as a rank across names on the session.",
  "An earnings date inside the window lifts IV and drops it after; read the earnings fields before reading a change across one.",
  "Null if IBKR had no IV today or 21 sessions ago (a gap is not filled), or IB Gateway was down for the session's pull.",
]
sources = ["An, Ang, Bali and Cakici, The Joint Cross Section of Stocks and Options, JF 2014: https://onlinelibrary.wiley.com/doi/10.1111/jofi.12181"]
[[field.use]]
for = "IBKR IV up three vol points in a month"
op = "gte"
value = 0.03
mode = "soft"
tolerance = 0.01
note = "overall IV change, calls and puts blended; compare across names"

[[field]]
name = "rollup.ibkr_iv_history@v1.ibkr_iv_chg_5d"
theme = "implied volatility"
reads = "IBKR's 30-day implied vol now minus 5 sessions ago, as a fraction: option buyers paying up (positive) or backing off (negative) over a week. IBKR's IV30 blends calls and puts, so it tests the overall IV-change effect, not the call-minus-put split. Personal-use data: it carries the personal licence."
caveats = [
  "Same caveats and nulls as rollup.ibkr_iv_history@v1.ibkr_iv_chg_21d; a week is noisier than a month.",
]
sources = ["Site convention (docs/edge-ideas/options-volatility.md c03)"]
[[field.use]]
for = "IBKR IV up three vol points in a week"
op = "gte"
value = 0.03
mode = "soft"
tolerance = 0.01
note = "overall IV change, calls and puts blended; compare across names"

[[field]]
name = "instrument.symbol"
theme = "instrument gates"
reads = "The ticker. Identity, not a measure: used to gate a screen to a hand list of names (the listed business development companies of the bdc_price_to_nav screener), so hard, never soft or scored. A list is only as current as its last edit."
caveats = [
  "A ticker can be reused after a delisting and changes when a company renames itself; a backtest reads the snapshot of its own session, and a newly listed name is missing from a hand list until it is added.",
  "A list by ticker says nothing about what the name is: check the company before trusting a name that only matches by spelling.",
]
sources = ["Site convention (docs/data/instruments.md)"]
[[field.use]]
for = "one of these tickers"
op = "in"
value = ["MAIN", "ARCC"]
mode = "hard"

# Edge build E2: the fundamentals entries (cash-based operating profitability sits in statements.toml),
# filed here under their own themes because the fundamentals and statements guide files reached
# their line cap.

[[field]]
name = "feature.composite_value_yield"
theme = "fundamentals"
reads = "What the company earns for each dollar of its value, on two yields averaged: operating profit over enterprise value and free cash flow over market value. 0.08 is 8 cents a year; above 0.10 is cheap by either measure, below 0.04 is dear. Value is high-is-cheap here, the opposite of ev_ebit, so a screen for cheap names asks for a high number."
caveats = [
  "A formalisation, not the paper's composite: the research composites use book to market, earnings, cash flow and sales growth; this has the first two yields only, and averages the yields themselves, so a very high yield in one part dominates the mean.",
  "A very high yield is often a peak-earnings cyclical or a company the market expects to shrink: check feature.revenue_cagr_3y and feature.cash_op_profitability.",
  "Null for a company with an operating loss, a negative enterprise value, no capex line, a stale statement or no market value, and for banks; a missing value is a gap, not a pass.",
  "Enterprise value ignores minority interest and preferred stock, and both yields use the latest filings, up to four months old.",
]
sources = ["Lakonishok, Shleifer and Vishny (1994), Journal of Finance 49(5), Contrarian Investment, Extrapolation, and Risk", "Asness and Frazzini (2013), Journal of Portfolio Management 39(4), The Devil in HML's Details"]
[[field.use]]
for = "cheap on earnings and cash flow"
op = "gte"
value = 0.08
mode = "soft"
tolerance = { relative = 0.25 }

[[field]]
name = "rollup.qmj@v1.qmj_score"
theme = "fundamentals"
reads = "Quality minus junk as a z-score across the day's cross-section: 0 is the middle, 1 is one standard deviation above, -1 below. High is quality (profitable, cash-generating, little debt and distress risk), low is junk. 1 and above is the top sixth of the cross-section; the idea (Asness, Frazzini and Pedersen) is to prefer quality and avoid junk at any price."
caveats = [
  "Built from what is stored: profitability in full (gross profit over assets, ROE, ROA, cash flow over assets, gross margin, low accruals) but safety only as leverage and distress; the paper's growth part and its beta and earnings-volatility parts are not built, so rollup.qmj@v1.safety_z does not know how steady the earnings are.",
  "Relative to the session: the score falls when others improve; it has no level and cannot be compared across dates. It ranks across all names, so an asset-light software company outranks a utility on margins.",
  "Needs enough profitability parts (four of six) and a cross-section of at least 100 names; a name without them has no score (a gap, not a pass). Banks are scored on the parts they have.",
  "Quality is not cheapness: compare feature.pb_ratio and feature.ev_ebit. Statement figures enter from the session after SEC acceptance of the filing and can be four months old.",
]
sources = ["Asness, Frazzini and Pedersen (2019), Review of Accounting Studies 24(1), Quality Minus Junk", "Novy-Marx (2014), Journal of Financial Economics 112(1), The Quality Dimension of Value Investing"]
[[field.use]]
for = "a high-quality name"
op = "gte"
value = 0.5
mode = "soft"
tolerance = 0.3

[[field]]
name = "feature.net_issuance_pct_12m"
theme = "fundamentals"
reads = "The log change of the share count over a year, the form Pontiff and Woodgate use: -0.03 is about 3% of the shares bought back, +0.10 about 10% more shares issued. Negative is a net buyer of its own stock, around 0 stable, above +0.05 a steady issuer, above +0.20 a heavy one (an offering, an acquisition in stock, heavy compensation); in the research the issuers underperform and the repurchasers outperform. It ranks like feature.shares_change_yoy and is the form the issuance edge sorts on."
caveats = [
  "The counts are the company total from the filings, a cover-page count against a cover-page count or a weighted average against a weighted average, so a company that began tagging the cover page recently is null.",
  "An acquisition paid in shares, a spin-off or a reverse merger changes the count without being a financing decision; a split is adjusted away.",
  "A shrinking count can hide issuance: companies buy back what compensation issues, so a flat count is not a company that does nothing; and a buyback funded by debt is not strength (see feature.debt_to_equity).",
  "Null for funds, companies without two counts a year apart (recent IPOs and filers) and a stale count.",
]
sources = ["Pontiff and Woodgate (2008), Journal of Finance 63(2), Share Issuance and Cross-Sectional Returns"]
[[field.use]]
for = "buying back shares"
op = "lte"
value = -0.01
mode = "soft"
tolerance = 0.01
[[field.use]]
for = "no heavy issuance"
op = "lte"
value = 0.1
mode = "soft"
tolerance = 0.03
