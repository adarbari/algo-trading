# L3 site setting: the field guide (ADR 0041, amended 2026-10-06), one <theme>.toml per theme
# plus situations.toml; loaded together by config/site/settings.py load_field_guide. Every
# [[field]] says how to read one catalogue field, which criterion means what, and when the
# reading lies; a [[situation]] is one state of the world that fools several thresholds at once.
# The keys are documented in momentum.toml. Edit by PR; `make features-doc` renders the page.

# Price levels (price_stats@v2, momentum@v1, swing_levels@v1): averages, highs, lows and swing
# points in dollars per share. A level is compared with the close, not thresholded; the
# derived fields (pct_vs_sma_*, pct_from_high_52w, dist_to_support, breakout_20d) carry the
# screening thresholds and this page says what the levels mean.

[[field]]
name = "rollup.price_stats@v2.sma_20"
theme = "price levels"
reads = "The mean close of the last 20 sessions, in dollars: the one-month average, the short-term trend line a pullback returns to. The close above it is a short-term uptrend; feature.pct_vs_sma_20 is the distance as a fraction and feature.pullback_to_sma20 the dip-in-an-uptrend entry (within one ATR of it)."
caveats = [
  "An average, so it lags: after a gap the 20-day average takes weeks to catch up and 'above the average' says the gap happened, not that a trend exists.",
  "Null after any missing bar in the last 20 sessions.",
]
sources = ["Brock, Lakonishok and LeBaron (1992) for moving-average rules in general"]
[[field.use]]
for = "has a one-month average"
op = "not_null"
mode = "hard"
note = "threshold the distance instead: feature.pct_vs_sma_20"

[[field]]
name = "rollup.price_stats@v2.sma_50"
theme = "price levels"
reads = "The mean close of the last 50 sessions, in dollars: the intermediate trend line, the best single rule in Brock, Lakonishok and LeBaron's long Dow test. Above it is an intermediate uptrend; with the 200-day average it defines feature.trend_state (close above 50 above 200: UPTREND). feature.pct_vs_sma_50 is the distance."
caveats = [
  "Lags by about a quarter of its length: a trend change shows in the close weeks before it shows in the average.",
  "Null after any missing bar in the last 50 sessions or a shorter history.",
]
sources = ["Brock, Lakonishok and LeBaron (1992): https://ideas.repec.org/a/bla/jfinan/v47y1992i5p1731-64.html"]
[[field.use]]
for = "has a 50-day average"
op = "not_null"
mode = "hard"
note = "threshold the distance instead: feature.pct_vs_sma_50"

[[field]]
name = "rollup.price_stats@v2.sma_200"
theme = "price levels"
reads = "The mean close of the last 200 sessions, in dollars: the long-term trend line, the daily version of Faber's 10-month average. Above it is the classic bull-market condition for the name; the 50-day crossing above it is the 'golden cross', below the 'death cross'. feature.pct_vs_sma_200 is the distance."
caveats = [
  "Needs 200 sessions of history: null for listings under ten months old and after any gap, so a hard criterion on it excludes every recent listing (the 'recent listing' situation).",
  "The crossover signals lag by months and whipsaw in ranges; the evidence is for indices and portfolios more than single names.",
]
sources = ["Faber (2007); Brock, Lakonishok and LeBaron (1992)"]
[[field.use]]
for = "has a 200-day average (ten months of history)"
op = "not_null"
mode = "hard"
note = "threshold the distance instead: feature.pct_vs_sma_200"

[[field]]
name = "rollup.price_stats@v2.high_52w"
theme = "price levels"
reads = "The highest daily high of the last 252 sessions, split-adjusted, in dollars: the 52-week high investors anchor on (George and Hwang). A level to show next to the close; the distance to it is feature.pct_from_high_52w and the near-the-high band feature.near_52w."
caveats = [
  "Split-adjusted but not dividend-adjusted: a large special dividend leaves a high the price cannot regain without the payout.",
  "Null under 240 bars in the last 252 sessions; feature.pct_from_high_avail uses the high since listing for younger names.",
]
sources = ["George and Hwang (2004)"]
[[field.use]]
for = "has a 52-week high"
op = "not_null"
mode = "hard"
note = "threshold the distance instead: feature.pct_from_high_52w"

[[field]]
name = "rollup.price_stats@v2.low_52w"
theme = "price levels"
reads = "The lowest daily low of the last 252 sessions, split-adjusted, in dollars: the 52-week low. The distance above it is feature.pct_from_low_52w; LOW in feature.near_52w is within 10% of it."
caveats = [
  "A low set on one panic day (a halt, a flash move) can sit far below any price the name has traded at since; feature.pct_from_low_52w then reads 'far from the low' for a name that is at its usual bottom.",
  "Null under 240 bars in the last 252 sessions.",
]
sources = ["George and Hwang (2004)"]
[[field.use]]
for = "has a 52-week low"
op = "not_null"
mode = "hard"
note = "threshold the distance instead: feature.pct_from_low_52w"

[[field]]
name = "rollup.price_stats@v2.history_days"
theme = "price levels"
reads = "How many of the last 252 sessions have a bar, the session included: 252 is a full year, 240 is the floor for the 52-week fields, under 200 means the 200-day average is null, under about 60 is a listing a few months old. The one-number form of 'how much history does this name have'."
caveats = [
  "A low count is either a young listing (instrument.listed_on) or a name that trades rarely (rollup.price_history@v1.bar_status); the two need different treatment.",
]
sources = ["Site convention (the window floors of price_stats@v2)"]
[[field.use]]
for = "a full year of history"
op = "gte"
value = 240
mode = "hard"
[[field.use]]
for = "enough history for the long averages"
op = "gte"
value = 200
mode = "soft"
tolerance = 20

[[field]]
name = "rollup.momentum@v1.atr_14"
theme = "price levels"
reads = "Wilder's average true range over 14 sessions, in dollars: the typical daily range including gaps. The unit of swing-trading distances: a stop 2 ATRs below entry (the Turtle rule), a target 3 ATRs above, a pullback 'within 1 ATR' of the average. feature.atr_pct is the same number as a share of price, which is what a screen compares across names."
caveats = [
  "Dollars are not comparable across names: $2 is 1% on a $200 stock and 10% on a $20 one. Threshold feature.atr_pct, not this.",
  "One gap day lifts it for two weeks; a takeover pins it near zero (the 'pending takeover' situation).",
]
sources = ["Wilder (1978); the Turtle rules (ATR-sized stops)"]
[[field.use]]
for = "has a range (15 consecutive bars)"
op = "not_null"
mode = "hard"
note = "threshold feature.atr_pct instead"

[[field]]
name = "rollup.momentum@v1.high_20d"
theme = "price levels"
reads = "The highest daily high of the last 20 sessions, the session included, in dollars: the top of the month's channel. With rollup.momentum@v1.low_20d it gives feature.range_20d_pct (the channel's height). The close at it is a one-month high."
caveats = [
  "Includes today, so a close at the high reads as 'at the channel top' by definition; the breakout test uses rollup.momentum@v1.prior_high_20d, which excludes today.",
]
sources = ["Donchian channels (the Turtle rules)"]
[[field.use]]
for = "has a 20-day channel"
op = "not_null"
mode = "hard"

[[field]]
name = "rollup.momentum@v1.low_20d"
theme = "price levels"
reads = "The lowest daily low of the last 20 sessions, the session included, in dollars: the bottom of the month's channel, the Turtle rules' exit level for a long (a close below the 10- or 20-day low). The close at it is a one-month low."
caveats = [
  "Includes today: a close at the low is at the channel bottom by definition.",
]
sources = ["Donchian channels (the Turtle rules)"]
[[field.use]]
for = "has a 20-day channel"
op = "not_null"
mode = "hard"

[[field]]
name = "rollup.momentum@v1.high_50d"
theme = "price levels"
reads = "The highest daily high of the last 50 sessions, the session included, in dollars: the top of the quarter's channel, the longer Turtle entry level (System 2 used 55 days). A close at it is a quarterly high."
caveats = [
  "Includes today; compare the close with yesterday's channel for a breakout test (only the 20-day version stores the prior high).",
]
sources = ["Donchian channels (the Turtle rules)"]
[[field.use]]
for = "has a 50-day channel"
op = "not_null"
mode = "hard"

[[field]]
name = "rollup.momentum@v1.low_50d"
theme = "price levels"
reads = "The lowest daily low of the last 50 sessions, the session included, in dollars: the bottom of the quarter's channel. A close at it is a quarterly low."
caveats = [
  "Includes today.",
]
sources = ["Donchian channels (the Turtle rules)"]
[[field.use]]
for = "has a 50-day channel"
op = "not_null"
mode = "hard"

[[field]]
name = "rollup.momentum@v1.prior_high_20d"
theme = "price levels"
reads = "The highest daily high of the 20 sessions before today, today excluded, in dollars: the level a breakout close has to clear. feature.breakout_20d is the close above it with volume at 1.5 times normal; this field is the level itself, to show next to the close."
caveats = [
  "A level set by one spike high (a halt, a news candle) is easy to clear on a quiet day: the volume condition of feature.breakout_20d is there for that reason.",
  "Null after a gap among those 20 sessions.",
]
sources = ["Donchian channels (the Turtle rules); Raschke and Connors on failed breakouts"]
[[field.use]]
for = "has a breakout level"
op = "not_null"
mode = "hard"
note = "the breakout itself is feature.breakout_20d"

[[field]]
name = "rollup.swing_levels@v1.swing_high"
theme = "price levels"
reads = "Resistance: the high of the most recent confirmed swing high above the close, in dollars. A swing high is a bar whose high is strictly above the five highs before it and at least the five after, so it is confirmed five sessions later. It is where sellers last showed up above the current price; feature.dist_to_resistance is the distance as a fraction and feature.dist_to_resistance_atr in ATRs."
caveats = [
  "Null at a one-year high (nothing above the close): a 'near resistance' criterion then rejects the names breaking out, which is often what you want, and a hard 'not_null' drops them.",
  "The most recent swing high above the close is not always the strongest: an older, higher one can matter more; rollup.swing_levels@v1.swing_high_date says when it formed.",
  "Confirmed five sessions late: a swing high from the last week is not yet a level.",
]
sources = ["docs/data/swing.md (pivot width 5); practitioner swing-point conventions"]
[[field.use]]
for = "has resistance above"
op = "not_null"
mode = "hard"
note = "threshold feature.dist_to_resistance instead"

[[field]]
name = "rollup.swing_levels@v1.swing_high_date"
theme = "price levels"
reads = "The session of the swing high that is the current resistance. A level from last month is fresher than one from eleven months ago: recent levels have more participants anchored to them. A date to show with the level."
caveats = [
  "Null when there is no confirmed swing high above the close.",
]
sources = ["docs/data/swing.md"]
[[field.use]]
for = "has a dated resistance"
op = "not_null"
mode = "hard"

[[field]]
name = "rollup.swing_levels@v1.swing_low"
theme = "price levels"
reads = "Support: the low of the most recent confirmed swing low below the close, in dollars (a bar whose low is strictly below the five lows before it and at most the five after, confirmed five sessions later). Where buyers last showed up below the current price; the usual place for a stop just under it. feature.dist_to_support is the distance as a fraction and feature.dist_to_support_atr in ATRs."
caveats = [
  "Null at a one-year low (nothing below the close): the name just broke every support, which a screen should read as what it is.",
  "Confirmed five sessions late; a level more than a few ATRs below is not support for a swing trade.",
]
sources = ["docs/data/swing.md; the Turtle rules for ATR-scaled stops"]
[[field.use]]
for = "has support below"
op = "not_null"
mode = "hard"
note = "threshold feature.dist_to_support instead"

[[field]]
name = "rollup.swing_levels@v1.swing_low_date"
theme = "price levels"
reads = "The session of the swing low that is the current support. A recent low is a level the market has just defended; an old one is a memory. A date to show with the level."
caveats = [
  "Null when there is no confirmed swing low below the close.",
]
sources = ["docs/data/swing.md"]
[[field.use]]
for = "has a dated support"
op = "not_null"
mode = "hard"

[[field]]
name = "feature.pct_from_high_avail"
theme = "price levels"
reads = "The close against the highest high of the history available, minus 1 (at or below 0): the 52-week high for a name with a year of bars, the high since listing for a younger one (rollup.price_history@v1.range_sessions says how many sessions that is). The version of feature.pct_from_high_52w that does not go null on recent listings."
caveats = [
  "For a young listing the 'high' can be the first day's print (IPO pops): 20% below it after three months is normal, not a discount. Check rollup.price_history@v1.range_sessions before reading the distance like a 52-week one.",
  "Null for a listing under 20 sessions old or a name trading too rarely.",
]
sources = ["George and Hwang (2004) for the 52-week version; site convention (ADR 0046) for the available-history fallback"]
[[field.use]]
for = "near the high of its history"
op = "gte"
value = -0.10
mode = "soft"
tolerance = 0.05
note = "for names with a year of bars prefer feature.pct_from_high_52w"

[[field]]
name = "feature.dist_to_resistance_atr"
theme = "price levels"
reads = "The distance to resistance in ATRs: how many typical daily ranges sit between the close and the last swing high above it. Under 1 the level is inside today's noise (at resistance); 2 to 4 is a swing trade's room; above 6 the level is out of play. The ATR scaling makes it comparable across calm and volatile names, which feature.dist_to_resistance (a fraction of price) is not."
caveats = [
  "Null at a one-year high (no resistance above) and when the ATR is 0: a hard 'room to run' criterion rejects the names at new highs.",
  "A tiny ATR (a pinned takeover target) makes any distance read as many ATRs; require feature.atr_pct gte 0.005.",
]
sources = ["The Turtle rules (ATR-scaled distances); docs/data/swing.md"]
[[field.use]]
for = "room to run (in ATRs)"
op = "gte"
value = 3
mode = "soft"
tolerance = 1
note = "soft, so a name at a new high (null) is listed rather than rejected"
[[field.use]]
for = "at resistance"
op = "lte"
value = 1
mode = "soft"
tolerance = 0.5

[[field]]
name = "feature.dist_to_support_atr"
theme = "price levels"
reads = "The distance to support in ATRs: how many typical daily ranges sit between the close and the last swing low below it. Under 1 the close is at support (a stop just below it is tight); 2 to 3 is the usual working distance for a swing entry; above 5 a stop at support is a wide one."
caveats = [
  "Null at a one-year low (no support below) and when the ATR is 0.",
  "Support in a downtrend breaks: pair with feature.trend_state eq UPTREND.",
]
sources = ["The Turtle rules (a 2 ATR stop); docs/data/swing.md"]
[[field.use]]
for = "near support (a tight stop)"
op = "lte"
value = 1
mode = "soft"
tolerance = 0.5
note = "with feature.trend_state eq UPTREND"
[[field.use]]
for = "a stop at support within reach"
op = "lte"
value = 3
mode = "soft"
tolerance = 1

[[field]]
name = "rollup.retest@v1.breakout_level"
theme = "price levels"
reads = "The level the latest breakout cleared, in dollars: the highest high of the 20 sessions before the breakout session (the prior_high_20d of that day), within the last 60 sessions. Broken resistance is the textbook place for new support: a pullback that holds near it is the retest. rollup.retest@v1.retest_state says where the close stands against it."
caveats = [
  "A level set by one spike high (a halt, a news candle) is easy to clear and weak support afterwards; check rollup.retest@v1.sessions_since_breakout and the volume on the day (rollup.momentum@v1.rel_volume).",
  "Null when no session of the last 60 closed above its prior 20-session high (retest_state NONE); a hard 'not_null' drops every name that has not broken out lately.",
  "The close alone defines the breakout here, with no volume condition (unlike feature.breakout_20d).",
]
sources = ["docs/data/swing.md; Edwards and Magee, Technical Analysis of Stock Trends (broken resistance turning into support); Donchian 20-session channel entries"]
[[field.use]]
for = "has a recent breakout level"
op = "not_null"
mode = "hard"
note = "judge the retest with rollup.retest@v1.retest_state"

[[field]]
name = "rollup.retest@v1.breakout_date"
theme = "price levels"
reads = "The session of the latest 20-session breakout among the last 60 sessions. A date to show with the level: a breakout from last week is fresher than one from two months ago, and rollup.retest@v1.sessions_since_breakout is the same fact as a count."
caveats = [
  "Null when there was no breakout in the last 60 sessions; an older breakout is not shown.",
  "Only the most recent breakout is kept: a name that broke out twice shows the second one.",
]
sources = ["docs/data/swing.md"]
[[field.use]]
for = "has a dated recent breakout"
op = "not_null"
mode = "hard"

[[field]]
name = "rollup.gaps@v1.gap_above"
theme = "price levels"
reads = "Overhead gap: the lower edge, in dollars, of the nearest unfilled down gap that lies wholly above the close. A down gap is a session whose high stayed below the previous session's low, so nothing traded in between; the zone starts at that session's high (where price rising would enter it) and is filled only when a later high reaches the previous low. Gaps are the classic place price tends to come back to and meet supply; feature.dist_to_gap_above is the distance as a fraction."
caveats = [
  "A gap is not a wall: price often runs straight through a zone, and a gap from earnings (rollup.earnings@v1.last_earnings_date) is a news reaction, not a technical level.",
  "Null when no unfilled down gap lies wholly above the close in the last 253 sessions: all of them filled, or the close sits inside a partly filled zone. A hard 'not_null' drops the names with a clean overhead.",
  "Bars are split-adjusted, not dividend-adjusted: a split is never a gap, but a large special dividend can print as one; rollup.gaps@v1.gap_above_date says when it formed.",
]
sources = ["docs/data/swing.md; Edwards and Magee, Technical Analysis of Stock Trends (gaps); Murphy, Technical Analysis of the Financial Markets (gaps as support and resistance)"]
[[field.use]]
for = "has an unfilled gap overhead"
op = "not_null"
mode = "hard"
note = "threshold feature.dist_to_gap_above instead"

[[field]]
name = "rollup.gaps@v1.gap_above_date"
theme = "price levels"
reads = "The session of the down gap behind rollup.gaps@v1.gap_above. A gap from last week is a fresh, fully remembered level; one from eleven months ago is mostly forgotten."
caveats = [
  "Null when rollup.gaps@v1.gap_above is null.",
]
sources = ["docs/data/swing.md"]
[[field.use]]
for = "has a dated overhead gap"
op = "not_null"
mode = "hard"

[[field]]
name = "rollup.gaps@v1.gap_below"
theme = "price levels"
reads = "Gap support: the upper edge, in dollars, of the nearest unfilled up gap that lies wholly below the close. An up gap is a session whose low stayed above the previous session's high; the zone is entered from above at that session's low and is filled only when a later low reaches the previous high. Price pulling back into the zone is the usual 'gap fill' trade; feature.dist_to_gap_below is the distance as a fraction."
caveats = [
  "Most up gaps eventually fill, but 'eventually' can be a year: an unfilled gap says nothing about when, and a breakaway gap on news may never fill; check rollup.gaps@v1.gap_below_date and rollup.earnings@v1.last_earnings_date.",
  "Null when no unfilled up gap lies wholly below the close in the last 253 sessions (all filled, or the close is inside a partly filled zone).",
  "Bars are split-adjusted, not dividend-adjusted: a large special dividend can print as a gap.",
]
sources = ["docs/data/swing.md; Edwards and Magee, Technical Analysis of Stock Trends (gaps); Murphy, Technical Analysis of the Financial Markets"]
[[field.use]]
for = "has an unfilled gap below"
op = "not_null"
mode = "hard"
note = "threshold feature.dist_to_gap_below instead"

[[field]]
name = "rollup.gaps@v1.gap_below_date"
theme = "price levels"
reads = "The session of the up gap behind rollup.gaps@v1.gap_below. A recent gap is a level the market has just jumped over; an old one is a memory."
caveats = [
  "Null when rollup.gaps@v1.gap_below is null.",
]
sources = ["docs/data/swing.md"]
[[field.use]]
for = "has a dated gap below"
op = "not_null"
mode = "hard"

# Bands and channels as levels (bands@v1 and config/site/features/bands.toml): the Bollinger

# Bands and channels as levels (bands@v2 and config/site/features/bands.toml): the Bollinger
# bands and the Keltner channel in dollars per share. Compared with the close, not
# thresholded; the positions (feature.bb_pct_b, feature.kc_position) and the squeeze carry
# the screening thresholds (momentum and trend, volatility).

[[field]]
name = "rollup.bands@v2.ema_20"
theme = "price levels"
reads = "The 20-session exponential moving average of the close, in dollars per share: the midline of the Keltner channel and the fastest of the common averages (it weights the latest close 2 / 21, so it turns a few sessions before rollup.price_stats@v2.sma_20). Compare with the close: above it the short-term trend is up, below it down; the gap between the two in percent or ATRs is what to threshold (feature.pct_vs_sma_20 and feature.stretch_sma20_atr do that for the SMA, which sits within a fraction of a percent of the EMA on all but the fastest moves)."
caveats = [
  "The EMA is seeded with the mean of the first 20 bars of the consecutive run ending today; after a gap in the bars the run restarts, so a name that just resumed trading has an EMA over few bars. Check rollup.price_history@v1.bar_status and rollup.price_stats@v2.history_days.",
  "Null with fewer than 20 consecutive bars ending on the session (a gap among the last 20, or a new listing).",
]
sources = [
  "Moving average (exponential), Wikipedia: https://en.wikipedia.org/wiki/Moving_average#Exponential_moving_average",
  "Keltner channel, Wikipedia: https://en.wikipedia.org/wiki/Keltner_channel",
]
[[field.use]]
for = "has a 20-session EMA"
op = "not_null"
mode = "hard"
note = "threshold the distance instead: feature.kc_position or feature.pct_vs_sma_20"

[[field]]
name = "rollup.bands@v2.ema_10"
theme = "price levels"
reads = "The 10-session exponential moving average of the close, in dollars per share: the fastest trend line in the catalogue, about two trading weeks, which day traders and short-term swing systems use as the trailing reference. The close above it is a short-term uptrend in force; a close below it after a run is the first warning. Threshold the distance, not the level."
caveats = [
  "It hugs the price: a 10-day average crosses the close every few sessions in a range, so a cross alone is noise. Pair with rollup.bands@v2.ema_20 or feature.ema_stack for the direction.",
  "Null with fewer than 10 consecutive bars ending on the session.",
]
sources = ["Moving average (exponential), Wikipedia: https://en.wikipedia.org/wiki/Moving_average#Exponential_moving_average"]
[[field.use]]
for = "has a 10-session EMA"
op = "not_null"
mode = "hard"
note = "compare with rollup.price_stats@v2.close in a rule; threshold feature.pct_vs_ema_20 for distance"

[[field]]
name = "rollup.bands@v2.ema_50"
theme = "price levels"
reads = "The 50-session exponential moving average of the close, in dollars per share: the intermediate trend line (about a quarter). Above it with the 20-session EMA above it too is the alignment the pullback and continuation screens require (feature.ema_stack BULL); a pullback that holds it is the classic swing entry. feature.pct_vs_ema_50 is the distance."
caveats = [
  "It is seeded with the mean of the first 50 bars of the run ending today, so after a gap in the bars it restarts; a name that resumed trading recently has a young average. Check rollup.price_stats@v2.history_days.",
  "Null with fewer than 50 consecutive bars ending on the session.",
]
sources = ["Brock, Lakonishok and LeBaron (1992): https://ideas.repec.org/a/bla/jfinan/v47y1992i5p1731-64.html"]
[[field.use]]
for = "has a 50-session EMA"
op = "not_null"
mode = "hard"
note = "threshold feature.pct_vs_ema_50 or use feature.ema_stack for alignment"

[[field]]
name = "rollup.bands@v2.ema_200"
theme = "price levels"
reads = "The 200-session exponential moving average of the close, in dollars per share: the long-term trend line (about ten months). The close above it is the bull-market condition most trend-following systems gate on (Faber's rule uses the 10-month SMA, within a percent of this). feature.pct_vs_ema_200 is the distance, feature.ema_stack the alignment with the 20 and the 50."
caveats = [
  "Seeded with the mean of the run's first 200 bars over at most the last 400 sessions, so on a name with under 400 bars the seed still carries weight and the EMA sits close to the SMA; rollup.price_stats@v2.sma_200 is the comparison.",
  "Null with fewer than 200 consecutive bars ending on the session (a listing under ten months old, or any gap in that span).",
]
sources = ["Faber (2007), A Quantitative Approach to Tactical Asset Allocation: https://papers.ssrn.com/sol3/papers.cfm?abstract_id=962461"]
[[field.use]]
for = "has a 200-session EMA (ten months of history)"
op = "not_null"
mode = "hard"
note = "threshold feature.pct_vs_ema_200 or feature.pct_vs_sma_200"

[[field]]
name = "rollup.pivot_strength@v1.resistance_touches"
theme = "price levels"
reads = "How many separate times the last 252 sessions tested the current resistance (rollup.swing_levels@v1.swing_high), the pivot bar counted: a bar touches when its high came within half an ATR of the level and it closed at or below it; consecutive bars count once. 1 is the pivot alone; 2 to 3 is a level the market has respected; 4 or more is a heavily tested ceiling, which breaks on strong volume more often than a lone high but is also where many stops and orders sit."
caveats = [
  "Touches measure attention, not strength: a ceiling tested six times may be about to give way as supply is absorbed. Pair it with rollup.momentum@v1.rel_volume and feature.dist_to_resistance before reading it either way.",
  "A tight ATR makes the half-ATR band narrow, so a calm name shows fewer touches than a volatile one at the same chart; rollup.momentum@v1.atr_14 is the unit.",
  "Null when there is no resistance (the close is at a one-year high) or atr_14 is unknown; a hard criterion then rejects the name.",
]
sources = ["docs/data/swing.md; Edwards and Magee, Technical Analysis of Stock Trends (tests of a level); Bulkowski, Encyclopedia of Chart Patterns (the number of touches in a range)"]
[[field.use]]
for = "resistance tested more than once"
op = "gte"
value = 2
mode = "soft"
tolerance = 1
note = "with feature.dist_to_resistance_atr lte 1 for a name pressing against it"
[[field.use]]
for = "a heavily tested ceiling"
op = "gte"
value = 4
mode = "score"
tolerance = 2

[[field]]
name = "rollup.pivot_strength@v1.support_touches"
theme = "price levels"
reads = "How many separate times the last 252 sessions tested the current support (rollup.swing_levels@v1.swing_low), the pivot bar counted: a bar touches when its low came within half an ATR of the level and it closed at or above it; consecutive bars count once. 1 is the pivot alone; 2 to 3 is a floor that held; each further test is also a chance that the buyers there are exhausted."
caveats = [
  "A floor that held three times has not been broken yet, which is all it says; a fourth test can fail. Check rollup.pivot_strength@v1.support_age and feature.trend_state (support in a downtrend breaks more than it holds).",
  "Needs the close above a swing low: null at a one-year low, and when atr_14 is unknown.",
]
sources = ["docs/data/swing.md; Edwards and Magee, Technical Analysis of Stock Trends"]
[[field.use]]
for = "tested support twice"
op = "gte"
value = 2
mode = "soft"
tolerance = 1
note = "with feature.trend_state eq UPTREND and feature.dist_to_support_atr lte 1"

[[field]]
name = "rollup.pivot_strength@v1.resistance_age"
theme = "price levels"
reads = "Sessions since the swing high that is the current resistance (5 to 246). A level from the last two months is recent supply that many holders still remember; one from ten months ago is mostly forgotten, and a stock that clears it has little overhead memory."
caveats = [
  "At least 5 by construction (a pivot is confirmed 5 sessions later); a very recent high is not yet a level.",
  "The age of the pivot, not of the last test: rollup.pivot_strength@v1.resistance_touches says whether it was tested since.",
  "Null when there is no resistance above the close.",
]
sources = ["docs/data/swing.md"]
[[field.use]]
for = "a recent resistance"
op = "lte"
value = 60
mode = "soft"
tolerance = 20
[[field.use]]
for = "an old resistance (little memory)"
op = "gte"
value = 120
mode = "soft"
tolerance = 30

[[field]]
name = "rollup.pivot_strength@v1.support_age"
theme = "price levels"
reads = "Sessions since the swing low that is the current support (5 to 246). A recent low is a floor the market has just defended; an old one is a memory."
caveats = [
  "At least 5 by construction; the age of the pivot, not of its last test (rollup.pivot_strength@v1.support_touches).",
  "Null when there is no support below the close.",
]
sources = ["docs/data/swing.md"]
[[field.use]]
for = "a recently defended support"
op = "lte"
value = 60
mode = "soft"
tolerance = 20

[[field]]
name = "rollup.retest@v1.sessions_since_breakout"
theme = "price levels"
reads = "Sessions since the latest 20-session breakout of the last 60 (0 is today). A breakout from the last few days is fresh and is where a retest, if there is one, comes next; one from two months ago has either worked or faded."
caveats = [
  "A breakout today is never a retest (rollup.retest@v1.retest_state FRESH); look again in a few sessions.",
  "Null when there was no breakout in the last 60 sessions.",
]
sources = ["docs/data/swing.md"]
[[field.use]]
for = "a fresh breakout"
op = "lte"
value = 10
mode = "soft"
tolerance = 5
note = "with rollup.retest@v1.retest_state ne FAILED"

[[field]]
name = "rollup.retest@v1.failed_breakouts_252d"
theme = "price levels"
reads = "How many of the name's 20-session breakouts in the last 252 sessions fell back below their level within 20 sessions (a run of consecutive breakout days counts once; one younger than 20 sessions counts only if it has already failed). 0 means its breakouts have worked, or it has had none; 2 or more is a name whose breakouts do not stick, which is the pattern a breakout buyer should fade or avoid."
caveats = [
  "0 mixes two cases: breakouts that held and no breakouts at all. Check rollup.retest@v1.breakout_date, which is null without a recent one.",
  "A pending breakout (under 20 sessions old) that has not failed yet counts as 0 today and can turn into 1 tomorrow.",
  "Null unless every one of the last 292 sessions has a bar, so a name with a gap or under 14 months of history never passes a hard criterion on it (use soft).",
]
sources = ["docs/data/swing.md; Bulkowski, Encyclopedia of Chart Patterns (breakout failure); Raschke and Connors, Street Smarts (failed breakouts)"]
[[field.use]]
for = "breakouts that stick"
op = "lte"
value = 1
mode = "soft"
tolerance = 1
[[field.use]]
for = "a record of failed breakouts"
op = "gte"
value = 2
mode = "soft"
tolerance = 1

[[field]]
name = "rollup.gaps@v1.gap_open_pct"
theme = "price levels"
reads = "Today's open against the previous close, as a fraction: 0.03 opened 3% above, -0.02 opened 2% below. Overnight news shows here before the day's range does: earnings, a downgrade, a market-wide move. Whether the gap is then held or filled is the day's story, not this number's."
caveats = [
  "Most large gaps are news (rollup.earnings@v1.last_earnings_date, rollup.earnings@v1.next_earnings_date); a gap on no news and thin volume more often fills.",
  "The open is the first print, which can be far from where the day trades; judge the day with the close and rollup.momentum@v1.rel_volume.",
  "Null when the previous session has no bar (a halt, a listing day); a hard criterion then rejects the name.",
]
sources = ["docs/data/swing.md; Edwards and Magee, Technical Analysis of Stock Trends (gaps)"]
[[field.use]]
for = "gapped up at the open"
op = "gte"
value = 0.03
mode = "hard"
note = "with rollup.momentum@v1.rel_volume gte 1.5 to tell news from noise"
[[field.use]]
for = "gapped down at the open"
op = "lte"
value = -0.03
mode = "hard"

[[field]]
name = "feature.dist_to_gap_above"
theme = "price levels"
reads = "How far above the close the nearest unfilled down gap begins, as a fraction of the close: 0.03 is 3% above. Close to 0 the close is just under a gap zone where supply sat when price dropped through; 0.10 or more is out of play for a swing trade. The zone is rollup.gaps@v1.gap_above (its lower edge)."
caveats = [
  "Null when no unfilled down gap lies wholly above the close (all filled, or the close is inside one): that is a clean overhead, not a zero distance.",
  "A gap from an earnings reaction (rollup.gaps@v1.gap_above_date near rollup.earnings@v1.last_earnings_date) is a weaker level than one on no news.",
]
sources = ["docs/data/swing.md; Murphy, Technical Analysis of the Financial Markets (gaps as resistance)"]
[[field.use]]
for = "an overhead gap close by"
op = "lte"
value = 0.05
mode = "soft"
tolerance = 0.02
note = "a resistance to respect; with feature.dist_to_resistance for the swing high"
[[field.use]]
for = "room before the next overhead gap"
op = "gte"
value = 0.08
mode = "soft"
tolerance = 0.03
note = "soft, so a name with a clean overhead (null) is listed rather than rejected"

[[field]]
name = "feature.dist_to_gap_below"
theme = "price levels"
reads = "How far below the close the nearest unfilled up gap begins, as a fraction of the close: 0.03 is 3% below. Close to 0 the close is just above a gap zone, where a pullback meets the old gap; the zone is rollup.gaps@v1.gap_below (its upper edge). A gap that far below has not been tested since it formed."
caveats = [
  "Null when no unfilled up gap lies wholly below the close (all filled, or the close is inside one).",
  "A breakaway gap on news may never fill; check rollup.gaps@v1.gap_below_date and rollup.earnings@v1.last_earnings_date.",
]
sources = ["docs/data/swing.md; Murphy, Technical Analysis of the Financial Markets (gaps as support)"]
[[field.use]]
for = "a support gap just under the price"
op = "lte"
value = 0.03
mode = "soft"
tolerance = 0.02
note = "with feature.trend_state eq UPTREND"

[[field]]
name = "rollup.pivot_strength@v1.pivot_structure"
theme = "price levels"
reads = "The shape of the last two swing highs and the last two swing lows over the past year. HH_HL: the later high is above the earlier and the later low above the earlier (higher highs and higher lows: the Dow definition of an uptrend). LH_LL: both lower (a downtrend). MIXED: one up and one down, or an equal pair (a range, an expanding or contracting wedge). Unlike feature.trend_state it reads the pivots, not the averages, so it turns earlier and is blind to the size of the steps."
caveats = [
  "Only the last two pivots of each kind: one higher low after a long decline reads HH_HL if the last two highs also rose, long before a trend exists. Confirm with feature.trend_state and rollup.price_stats@v2.ret_60d.",
  "Pivots are confirmed 5 sessions late, so the newest swing is not in it yet.",
  "Null with fewer than two swing highs or two swing lows in the 252 sessions read (a steady trend with no pullbacks has few pivots) or a missing bar around them.",
]
sources = ["docs/data/swing.md; Dow theory (higher highs and higher lows) as in Murphy, Technical Analysis of the Financial Markets"]
[[field.use]]
for = "higher highs and higher lows"
op = "eq"
value = "HH_HL"
mode = "hard"
note = "with feature.trend_state eq UPTREND to ask for both the pivots and the averages"
[[field.use]]
for = "not in a downtrend structure"
op = "ne"
value = "LH_LL"
mode = "soft"
tolerance = 0

[[field]]
name = "feature.breakout_retest_held"
theme = "price levels"
reads = "True when the latest 20-session breakout came back to within half an ATR of its level on an earlier session and no close since has gone below the level (rollup.retest@v1.retest_state HELD). The breakout has been tested and survived; it does not say price is at the level now (RETESTING is today's retest)."
caveats = [
  "False covers every other state: not yet retested (FRESH), retesting today, failed and no breakout. Use rollup.retest@v1.retest_state in to include RETESTING.",
  "One held retest is a sample of one; combine with feature.trend_state eq UPTREND.",
  "Null when the name has no retest row (no bar on the session).",
]
sources = ["docs/data/swing.md; Bulkowski, Encyclopedia of Chart Patterns"]
[[field.use]]
for = "a breakout that held its retest"
op = "eq"
value = true
mode = "hard"
note = "with feature.trend_state eq UPTREND"

[[field]]
name = "feature.breakout_failed"
theme = "price levels"
reads = "True when the latest 20-session breakout of the last 60 sessions has since closed below its level (rollup.retest@v1.retest_state FAILED): a bull trap. Used to drop names whose breakout did not work, or to look for the reversal."
caveats = [
  "One close below the level is enough, even if price recovered after: check rollup.retest@v1.sessions_since_breakout and feature.dist_to_resistance_atr for whether it is back above.",
  "False includes names with no breakout at all; it is not a quality mark.",
  "Null when the name has no retest row (no bar on the session).",
]
sources = ["docs/data/swing.md; Raschke and Connors, Street Smarts (failed breakouts)"]
[[field.use]]
for = "a failed breakout"
op = "eq"
value = true
mode = "hard"
[[field.use]]
for = "no failed breakout behind it"
op = "eq"
value = false
mode = "soft"
tolerance = 0

# Volume at price (volume_profile@v1, a daily-bar approximation) and the swing-anchored VWAPs
# (anchored_vwap@v2): levels in dollars per share, compared with the close.

[[field]]
name = "rollup.anchored_vwap@v2.avwap_earnings"
theme = "price levels"
reads = "The volume-weighted average price since the last earnings reaction session, in dollars per share: where the average share bought since the report is positioned. The close above it means holders since the report are in profit (the post-earnings drift has support); below it they are under water and rallies into it meet sellers. Compare with the close; rollup.anchored_vwap@v2.avwap_anchor_date says how old the anchor is."
caveats = [
  "A fresh anchor (a few sessions old) is nearly the current price and says little; the level means more after two to four weeks of trading.",
  "Null without a report in the last 126 sessions, with fewer than 2 sessions since it, a gap in the range, or no volume.",
]
sources = ["Anchored VWAP (Brian Shannon, Maximum Trading Gains with Anchored VWAP)"]
[[field.use]]
for = "has an earnings-anchored VWAP"
op = "not_null"
mode = "hard"
note = "compare with rollup.price_stats@v2.close in a rule"

[[field]]
name = "rollup.anchored_vwap@v2.avwap_anchor_date"
theme = "price levels"
reads = "The session avwap_earnings is anchored on: the last report date for a pre-market or unknown-time report, the next session for one after the close. Its age is how long the earnings VWAP has had to form."
caveats = [
  "Null without a report in the last 126 sessions.",
]
sources = ["Anchored VWAP (Brian Shannon)"]
[[field.use]]
for = "has an earnings anchor"
op = "not_null"
mode = "hard"
note = "rollup.earnings@v1.last_earnings_date is the report date itself"

[[field]]
name = "rollup.anchored_vwap@v2.avwap_swing_low"
theme = "price levels"
reads = "The volume-weighted average price since the most recent confirmed swing low below the close (the support swing_levels@v1 found), in dollars per share: the average cost of everyone who bought since the bottom. In an uptrend the close holds above it and pullbacks to it are bought; a close below it means the rally's buyers are under water, the first sign the swing is over. A rising anchored VWAP with the price above is the cleanest statement of a healthy leg up."
caveats = [
  "Support is the most recent swing low, which can be a minor pivot a week old; then the VWAP is a few sessions long and close to the price. Check rollup.swing_levels@v1.swing_low_date.",
  "Null without a confirmed swing low below the close, with fewer than 2 sessions since it, a gap in the range, or no volume.",
]
sources = ["Anchored VWAP from swing lows (Brian Shannon, Maximum Trading Gains with Anchored VWAP)"]
[[field.use]]
for = "has a swing-low VWAP"
op = "not_null"
mode = "hard"
note = "compare with rollup.price_stats@v2.close: above it the leg up is intact"

[[field]]
name = "rollup.anchored_vwap@v2.avwap_swing_high"
theme = "price levels"
reads = "The volume-weighted average price since the most recent confirmed swing high above the close (the resistance swing_levels@v1 found), in dollars per share: the average cost of everyone who bought since the top, all of whom are under water while the close stays below it. A close back above it means the sellers since the top have been absorbed, the first sign of a turn; below it, rallies into it are sold."
caveats = [
  "Resistance is the most recent swing high, possibly a minor one; check rollup.swing_levels@v1.swing_high_date.",
  "Null without a confirmed swing high above the close, with fewer than 2 sessions since it, a gap in the range, or no volume.",
]
sources = ["Anchored VWAP from swing highs (Brian Shannon)"]
[[field.use]]
for = "has a swing-high VWAP"
op = "not_null"
mode = "hard"
note = "compare with rollup.price_stats@v2.close: a close above it is the reclaim"

[[field]]
name = "rollup.bands@v2.sma_150"
theme = "price levels"
reads = "The mean close of the last 150 sessions (30 weeks), in dollars per share: the one average off the 20 / 50 / 200 stack that two named methods threshold. Minervini's trend template requires the close above it, it above the 200-day and the 50-day above it; Weinstein's stage analysis reads a rising 30-week average with the price above as stage 2 (the only stage to buy). feature.pct_vs_sma_150 is the distance."
caveats = [
  "An average over seven months lags a turn by weeks; pair with rollup.bands@v2.ema20_slope_5d or feature.ema_stack for the recent direction.",
  "Null after any missing bar in the last 150 sessions or a shorter history.",
]
sources = [
  "Minervini (2013), Trade Like a Stock Market Wizard: the trend template",
  "Weinstein (1988), Secrets for Profiting in Bull and Bear Markets: the 30-week moving average",
]
[[field.use]]
for = "has a 30-week average"
op = "not_null"
mode = "hard"
note = "threshold feature.pct_vs_sma_150 gt 0, with rollup.price_stats@v2.sma_200 below it for the template"

[[field]]
name = "feature.bb_upper"
theme = "volatility"
reads = "The upper Bollinger band: the 20-session mean close plus two standard deviations of those closes, in dollars per share. Price touches it on about 5% of sessions in a random walk; in a trend it rides along it (the band walk, rollup.bands@v2.band_walk). Compare with the close through feature.bb_pct_b (1 is on the band, above 1 is outside it) rather than the level itself."
caveats = [
  "A band is a statement about the last 20 closes, not resistance: in a strong uptrend the close lives on or above the upper band for weeks. Pair a 'too far above' reading with feature.trend_state and rollup.momentum@v1.rsi_14 before reading it as a top.",
  "After a one-day shock (earnings, a takeover) both bands jump apart for 20 sessions and the price sits 'inside' them; the squeeze that follows is the shock leaving the window, not a new base. Check rollup.price_moves@v1.one_day_move.",
  "Null after a gap in the last 20 sessions or a shorter history.",
]
sources = [
  "Bollinger (2001), Bollinger on Bollinger Bands: the 20 / 2 defaults",
  "Bollinger Bands, Wikipedia: https://en.wikipedia.org/wiki/Bollinger_Bands",
]
[[field.use]]
for = "has Bollinger bands"
op = "not_null"
mode = "hard"
note = "threshold the position instead: feature.bb_pct_b"

[[field]]
name = "feature.bb_lower"
theme = "volatility"
reads = "The lower Bollinger band: the 20-session mean close minus two standard deviations of those closes, in dollars per share. A close at or under it (feature.bb_pct_b at or below 0) is a two-sigma dip against the last month; in an uptrend that is the classic mean-reversion entry, in a downtrend it is where the price lives."
caveats = [
  "A close below the band in a downtrend keeps falling: a dip is a dip only with feature.trend_state UPTREND or feature.pct_vs_sma_200 above 0.",
  "The band widens after a shock and narrows as the shock leaves the window, so a touch 20 sessions after an earnings gap means less than one in a quiet month. Check rollup.earnings@v1.last_earnings_date.",
  "Null after a gap in the last 20 sessions or a shorter history.",
]
sources = [
  "Bollinger (2001), Bollinger on Bollinger Bands",
  "Mean reversion with bands (Connors and Alvarez, Short Term Trading Strategies That Work)",
]
[[field.use]]
for = "has Bollinger bands"
op = "not_null"
mode = "hard"
note = "threshold the position instead: feature.bb_pct_b"

[[field]]
name = "feature.kc_upper"
theme = "volatility"
reads = "The upper Keltner channel: the 20-session EMA plus two Wilder ATR(14), in dollars per share. Unlike a Bollinger band it is built from the daily range, so it moves with how much the name trades each day rather than with the dispersion of closes; price closes above it on a strong day, and a Bollinger band inside it is the squeeze (feature.bb_squeeze). Compare with the close through feature.kc_position."
caveats = [
  "The channel uses ATR(14) where the classic uses ATR(10); the width is the same within a few percent on most names and the reading is unchanged. For the exact TTM construction see the sources.",
  "A takeover pins the price with an ATR near zero, so the channel collapses onto the EMA and every close is 'outside' it. Check feature.atr_pct and the 'pending takeover' situation.",
  "Null with fewer than 20 consecutive bars ending on the session.",
]
sources = [
  "Keltner channel, Wikipedia: https://en.wikipedia.org/wiki/Keltner_channel",
  "Carter (2005), Mastering the Trade: the TTM squeeze (Bollinger 20/2 inside Keltner 20/1.5 ATR)",
]
[[field.use]]
for = "has a Keltner channel"
op = "not_null"
mode = "hard"
note = "threshold the position instead: feature.kc_position"

[[field]]
name = "feature.kc_lower"
theme = "volatility"
reads = "The lower Keltner channel: the 20-session EMA minus two Wilder ATR(14), in dollars per share. A close below it is a strong down day against the name's own daily range; a Bollinger band inside it is part of the squeeze. Compare with the close through feature.kc_position."
caveats = [
  "A gap down on news puts the close far below the channel for one day and the ATR catches up over the next two weeks; the channel widens after the move, not before. Check rollup.price_moves@v1.one_day_move.",
  "Null with fewer than 20 consecutive bars ending on the session.",
]
sources = [
  "Keltner channel, Wikipedia: https://en.wikipedia.org/wiki/Keltner_channel",
]
[[field.use]]
for = "has a Keltner channel"
op = "not_null"
mode = "hard"
note = "threshold the position instead: feature.kc_position"

# The EMA stack, the longer channels and the prior extremes (bands@v2, trend_stats@v2): levels
# in dollars per share. Compared with the close; the distances (feature.pct_vs_ema_*,
# feature.dist_to_high_*, feature.breakout_magnitude_20d) carry the thresholds.
