[[field]]
name = "rollup.analyst_ratings@v1.rating_count"
theme = "analyst"
reads = "How many analysts the five ratings add up to in the newest month. A count of 20 is a well covered name, 3 a thin one. Zero means no analyst rates the name."
caveats = [
  "The vendor counts the analysts it tracks, not every analyst on the Street. Large caps read 20 to 40 and small names a handful.",
  "The count can fall after a month of drop-outs with no change of view. Read rollup.analyst_ratings@v1.rating_month for the month it is from.",
  "Null with ratings_status NOT_COVERED or NOT_FETCHED reads as not covered by our analyst data. The vendor does not answer for every name, and the nightly rotation has not asked every name yet.",
  "Null with ratings_status STALE: the newest snapshot is over 45 days old, so no value is served.",
]
sources = [
  "Finnhub analyst recommendation trends, stored nightly in analyst/estimate_snapshots (docs/adr/0068-analyst-data-vendors.md)",
]
[[field.use]]
for = "enough analysts behind the rating"
op = "gte"
value = 5
mode = "hard"

[[field]]
name = "rollup.analyst_ratings@v1.rating_score"
theme = "analyst"
reads = "The mean analyst rating on a scale of 1 to 5. A 5 is every analyst at strong buy, 3 is hold, 1 is strong sell. Most covered stocks sit between 3.5 and 4.5, since analysts seldom publish a sell."
caveats = [
  "Analysts lean to buy, so a score of 3.0 is already a cautious consensus. Compare the score with other names, not with the midpoint of the scale.",
  "A score from a handful of analysts moves with each of them. Read rollup.analyst_ratings@v1.rating_count beside it.",
  "The score says what analysts rate, not what the stock will do. A high score after a rally is often the lag of the price.",
  "Null when no analyst rates the name, and with ratings_status STALE, NOT_COVERED or NOT_FETCHED. A hard criterion rejects those names.",
]
sources = [
  "Finnhub analyst recommendation trends, stored nightly in analyst/estimate_snapshots (docs/adr/0068-analyst-data-vendors.md)",
]
[[field.use]]
for = "most analysts rate it a buy"
op = "gte"
value = 4.0
mode = "hard"
[[field.use]]
for = "analysts neutral or better"
op = "gte"
value = 3.0
mode = "soft"
tolerance = 0.3

[[field]]
name = "rollup.analyst_ratings@v1.rating_month"
theme = "analyst"
reads = "The month the counts are for, shown as its first day. The vendor publishes one record a month, so 2026-12-01 is the December trend, read at the newest snapshot we hold."
caveats = [
  "The month is the vendor's, not the day we fetched it. Analyst changes made since the month began are in the next record.",
  "Null with ratings_status NOT_COVERED or NOT_FETCHED reads as not covered by our analyst data. The vendor does not answer for every name, and the nightly rotation has not asked every name yet.",
  "Null with ratings_status STALE: the newest snapshot is over 45 days old, so no value is served.",
]
sources = [
  "Finnhub analyst recommendation trends, stored nightly in analyst/estimate_snapshots (docs/adr/0068-analyst-data-vendors.md)",
]
[[field.use]]
for = "a rating month exists"
op = "not_null"
mode = "hard"

[[field]]
name = "rollup.analyst_ratings@v1.rating_score_change_90d"
theme = "analyst"
reads = "The mean rating now less the mean rating in our own snapshot about 90 days ago, on the 1 to 5 scale. A value of +0.3 is analysts turning more bullish, -0.3 more cautious."
caveats = [
  "The history is ours: the vendor restates its past months, so only our snapshots are compared. Our history starts on 2026-10-19, so the field is null until about 2027-01-17.",
  "A move of 0.1 can be one analyst on a thin name. Read rollup.analyst_ratings@v1.rating_count before trusting a small change.",
  "A snapshot more than a week older than 90 days is not used, so a name the nightly rotation missed for weeks reads null.",
  "Null with ratings_status NOT_COVERED or NOT_FETCHED reads as not covered by our analyst data. The vendor does not answer for every name, and the nightly rotation has not asked every name yet.",
  "Null with ratings_status STALE: the newest snapshot is over 45 days old, so no value is served.",
]
sources = [
  "Finnhub analyst recommendation trends, stored nightly in analyst/estimate_snapshots (docs/adr/0068-analyst-data-vendors.md)",
]
[[field.use]]
for = "analysts turning more bullish"
op = "gte"
value = 0.2
mode = "hard"
note = "history starts 2026-10-19, so the field is null before about 2027-01-17"

[[field]]
name = "rollup.analyst_ratings@v1.ratings_status"
theme = "analyst"
reads = "Whether the analyst ratings of the name can be used. OK: a snapshot at most 45 days old. STALE: older, so no value is served. NOT_COVERED: the vendor has no ratings for the name. NOT_FETCHED: we have not asked yet."
caveats = [
  "NOT_COVERED and NOT_FETCHED read the same to a trader, as not covered. The admin cause tells them apart, and NOT_FETCHED ends as the nightly rotation reaches the name.",
  "STALE is not the old value: a snapshot past 45 days serves nothing, so a vendor outage shows as STALE rather than as old counts.",
  "OK does not say the score has a 90-day change: rollup.analyst_ratings@v1.rating_score_change_90d is null until our history is that long.",
]
sources = [
  "Finnhub analyst recommendation trends, stored nightly in analyst/estimate_snapshots (docs/adr/0068-analyst-data-vendors.md)",
]
[[field.use]]
for = "ratings are current"
op = "eq"
value = "OK"
mode = "hard"
[[field.use]]
for = "leave out stale snapshots"
op = "ne"
value = "STALE"
mode = "hard"

[[field]]
name = "rollup.analyst_revisions@v1.eps_fy1_revision_30d"
theme = "analyst"
reads = "How much the consensus EPS for the current fiscal year moved in 30 days, in percent of the old estimate, for the same year. A value of +5 means analysts raised it by 5%. -10 means a 10% cut."
caveats = [
  "Our history starts on 2026-10-19, so this is null until about 2026-11-18. Read rollup.analyst_revisions@v1.revisions_status for whether the windows exist yet.",
  "The comparison is for the same fiscal year, matched on its year end. At the year roll a year the old snapshots never listed has no past value, so the field reads null, not a jump.",
  "A small old estimate makes a big percentage: the field is null when the old EPS is under five cents in size. Read it beside rollup.analyst_estimates@v1.eps_fy1.",
  "One analyst moving a thin estimate shifts it a lot. Read rollup.analyst_estimates@v1.eps_fy1_analysts, and prefer 5 or more.",
  "Null with revisions_status NOT_COVERED or NOT_FETCHED reads as not covered by our analyst data. The vendor does not answer for every name, and the nightly rotation has not asked every name yet.",
  "Null with revisions_status STALE: the newest snapshot is over 21 days old, so no estimate and no revision is served.",
]
sources = [
  "Gleason and Lee, Analyst Forecast Revisions and Market Price Discovery (2003)",
  "Chan, Jegadeesh and Lakonishok, Momentum Strategies (1996): the revision-in-earnings-forecasts effect",
  "Financial Modeling Prep analyst estimates, stored nightly in analyst/estimate_snapshots (docs/adr/0068-analyst-data-vendors.md)",
]
[[field.use]]
for = "analysts raising this year's EPS estimate"
op = "gte"
value = 2
mode = "hard"
note = "with rollup.analyst_revisions@v1.revisions_status eq OK and rollup.analyst_estimates@v1.eps_fy1_analysts gte 5"

