[[field]]
name = "rollup.analyst_revisions@v1.revisions_status"
theme = "analyst"
reads = "Whether the estimate revisions of the name can be measured. OK: a snapshot of the same fiscal year exists for 30, 60 and 90 days back. BUILDING: an earlier one exists, but not for every window. NO_PRIOR: none holds this year. STALE, NOT_COVERED and NOT_FETCHED are the estimates' own status."
caveats = [
  "OK says the comparisons exist, not that the estimate moved: most names read a revision near 0. Read the revision fields for the size.",
  "BUILDING lasts until 2027-01-17 for every name, since our history starts on 2026-10-19. A night the rotation missed can also hold a covered name there.",
  "NO_PRIOR also covers a year that the older snapshots never listed, as at the fiscal year roll, and a name whose first estimate year is unknown.",
  "Null with revisions_status NOT_COVERED or NOT_FETCHED reads as not covered by our analyst data. The vendor does not answer for every name, and the nightly rotation has not asked every name yet.",
  "Null with revisions_status STALE: the newest snapshot is over 21 days old, so no estimate and no revision is served.",
]
sources = [
  "Financial Modeling Prep analyst estimates, stored nightly in analyst/estimate_snapshots (docs/adr/0068-analyst-data-vendors.md)",
]
[[field.use]]
for = "only names whose revisions over every window can be measured"
op = "eq"
value = "OK"
mode = "hard"
[[field.use]]
for = "leave out stale snapshots"
op = "ne"
value = "STALE"
mode = "hard"

# --- forward formulas ---
# Formulas over the analyst consensus groups (config/site/features/company/forward.toml). Each
# inherits the personal licence of its source (ADR 0069), so a viewer without it sees UNKNOWN.

[[field]]
name = "feature.forward_pe"
theme = "analyst"
reads = "Close divided by the analysts' average EPS estimate for the current fiscal year (FY1): 15 means the price is fifteen times this year's expected earnings. Lower is cheaper on expected profit."
caveats = [
  "At the fiscal year roll FY1 moves when the annual report becomes public, so the ratio jumps once. That is a change of year, not of the estimate: check rollup.analyst_estimates@v1.fy1_period_end.",
  "Null with estimates_status NOT_COVERED or NOT_FETCHED reads as not covered by our analyst data. The free vendor plan covers few names, so a hard criterion keeps only a covered subset.",
  "A consensus of one or two analysts is an opinion, not a consensus: check rollup.analyst_estimates@v1.eps_fy1_analysts.",
  "Analysts' EPS usually leaves out one-off items that the reported EPS keeps, so this ratio and feature.pe_ratio are measured differently. Compare them as a rough guide only.",
  "Null for a forecast loss and for an ADR, whose EPS is per ordinary share. A hard criterion drops both.",
]
sources = [
  "Damodaran, Investment Valuation: the price earnings ratio, trailing and forward",
  "Financial Modeling Prep analyst estimates, stored nightly in analyst/estimate_snapshots (docs/adr/0068-analyst-data-vendors.md)",
]
[[field.use]]
for = "cheap on expected earnings"
op = "lte"
value = 15
mode = "soft"
tolerance = 3
note = "with feature.forward_eps_growth gte 0 so a low multiple is not a profit expected to shrink"
[[field.use]]
for = "a forward multiple exists"
op = "gt"
value = 0
mode = "hard"
note = "drops names with no estimates, a forecast loss or an ADR. On a night without the analyst table it rejects every row, though the run reads complete"

[[field]]
name = "feature.forward_pe_fy2"
theme = "analyst"
reads = "Close divided by the analysts' average EPS estimate for the fiscal year after FY1. Beside feature.forward_pe, a lower multiple here means analysts expect earnings to grow."
caveats = [
  "At the fiscal year roll FY2 moves with FY1 when the annual report becomes public, so the ratio jumps once. Check rollup.analyst_estimates@v1.fy2_period_end.",
  "Null when the vendor lists only one forward year, which is common for thinly covered names. A hard criterion drops them.",
  "Null with estimates_status NOT_COVERED or NOT_FETCHED reads as not covered by our analyst data. The free vendor plan covers few names, so a hard criterion keeps only a covered subset.",
  "Null for a forecast loss and for an ADR, whose EPS is per ordinary share. A hard criterion drops both.",
]
sources = [
  "Damodaran, Investment Valuation: the price earnings ratio, trailing and forward",
  "Financial Modeling Prep analyst estimates, stored nightly in analyst/estimate_snapshots (docs/adr/0068-analyst-data-vendors.md)",
]
[[field.use]]
for = "cheap on the later estimate"
op = "lte"
value = 12
mode = "soft"
tolerance = 3
note = "with feature.forward_pe lte 15 so the cheapness does not rest on one far-off estimate"

[[field]]
name = "feature.forward_eps_growth"
theme = "analyst"
reads = "The analysts' FY1 EPS estimate divided by the diluted EPS of the last twelve months, minus 1: 0.20 is 20% more earnings per share. Below 0 is a profit expected to shrink, below -1 a forecast loss."
caveats = [
  "At the fiscal year roll FY1 moves when the annual report becomes public, so the figure jumps once. That is a change of year, not of the estimate: check rollup.analyst_estimates@v1.fy1_period_end.",
  "Analysts' EPS usually leaves out one-off items that the reported EPS keeps, so a one-off can make the figure look high or low. Check feature.eps_cagr_3y for the reported trend.",
  "Null when the last twelve months were a loss: a growth rate off a loss is not shown, so a hard criterion drops turnarounds. Null for an ADR and for a stale reported EPS.",
  "Null with estimates_status NOT_COVERED or NOT_FETCHED reads as not covered by our analyst data. The free vendor plan covers few names, so a hard criterion keeps only a covered subset.",
]
sources = [
  "Damodaran, Investment Valuation: expected growth in earnings and analyst estimates",
  "Financial Modeling Prep analyst estimates, stored nightly in analyst/estimate_snapshots (docs/adr/0068-analyst-data-vendors.md)",
]
[[field.use]]
for = "earnings expected to rise"
op = "gte"
value = 0.1
mode = "soft"
tolerance = 0.05
note = "with feature.forward_pe lte 30 so the rise is not already in the price"

[[field]]
name = "feature.forward_revenue_growth"
theme = "analyst"
reads = "The analysts' FY1 revenue estimate divided by the revenue of the last twelve months, minus 1: 0.10 is 10% more sales. Below 0 is revenue expected to shrink."
caveats = [
  "At the fiscal year roll FY1 moves when the annual report becomes public, so the figure jumps once. That is a change of year, not of the estimate: check rollup.analyst_estimates@v1.fy1_period_end.",
  "Null for an ADR, because a foreign filer's revenue is in its own currency. Null when the reported revenue is stale or not positive.",
  "Null with estimates_status NOT_COVERED or NOT_FETCHED reads as not covered by our analyst data. The free vendor plan covers few names, so a hard criterion keeps only a covered subset.",
  "A consensus of one or two analysts is an opinion, not a consensus: check rollup.analyst_estimates@v1.revenue_fy1_analysts.",
]
sources = [
  "Damodaran, Investment Valuation: expected growth in revenues and analyst estimates",
  "Financial Modeling Prep analyst estimates, stored nightly in analyst/estimate_snapshots (docs/adr/0068-analyst-data-vendors.md)",
]
[[field.use]]
for = "sales expected to rise"
op = "gte"
value = 0.08
mode = "soft"
tolerance = 0.04
note = "with feature.forward_eps_growth gte 0 so the sales rise reaches profit"

[[field]]
name = "feature.target_upside"
theme = "analyst"
reads = "The average analyst price target divided by the close, minus 1: 0.15 means the average analyst puts the price 15% above today's close. Negative means the close is above the target."
caveats = [
  "Targets are the vendor's current ones on the day it was asked and carry no date of their own: check rollup.analyst_targets@v1.targets_age_days.",
  "Targets usually look twelve months ahead and move after the price does, so a large upside is often a recent fall. It is not a forecast of the price.",
  "Null with targets_status NOT_COVERED or NOT_FETCHED reads as not covered by our analyst data. The free vendor plan covers few names, so a hard criterion keeps only a covered subset.",
  "A wide gap between the highest and the lowest target means analysts disagree: check rollup.analyst_targets@v1.target_high and rollup.analyst_targets@v1.target_low.",
]
sources = [
  "Brav and Lehavy (2003), An empirical analysis of analysts' target prices, Journal of Finance",
  "Financial Modeling Prep price-target consensus, stored nightly in analyst/estimate_snapshots (docs/adr/0068-analyst-data-vendors.md)",
]
[[field.use]]
for = "room to the analysts' target"
op = "gte"
value = 0.15
mode = "soft"
tolerance = 0.05
note = "with feature.forward_eps_growth gte 0 so the room is not on a shrinking profit"

[[field]]
name = "instrument.instrument_id"
theme = "instrument gates"
reads = "The instrument's own id. Identity, not a measure: used to gate a screen to a hand list of names (the listed business development companies of the bdc_price_to_nav screener), so hard, never soft or scored. The list is resolved from tickers once, through the symbol resolver, and keyed by id so a renamed company stays itself."
caveats = [
  "A list by id is survivor-only: a company merged away or delisted before the list was made is missing from any history built on it. A newly listed name is missing until it is added.",
  "A list says nothing about what a name is; check the company before trusting an id copied from another list.",
]
sources = ["Site convention (docs/data/instruments.md; ADR 0018, FIGI ids)"]
[[field.use]]
for = "one of these instruments"
op = "in"
value = ["EQ:EXAMPLE1", "EQ:EXAMPLE2"]
mode = "hard"

[[field]]
name = "rollup.qmj@v1.balance_sheet_age_days"
theme = "statements"
reads = "Calendar days from the latest balance sheet's date to the session: how old the book figures are. A quarter-end balance sheet is public about 45 days after the quarter. So 0 to 135 days is the normal range, and above 135 is a missed or late quarter."
caveats = [
  "The statement groups only call a balance sheet STALE after 480 days. A ratio built on book value (feature.pb_ratio) can therefore rest on a balance sheet several quarters old. This field is how a screen bounds it.",
  "It dates the balance sheet, not the share count: shares_outstanding is the newest cover page and can be a quarter newer than the equity it is compared with.",
  "Null for funds and for names with no balance sheet filed; a missing value is a gap, not a pass.",
]
sources = ["SEC EDGAR company facts, the statement lines of instruments/statements (docs/adr/0067-sec-financial-statements-table.md)"]
[[field.use]]
for = "a balance sheet from the latest quarter"
op = "lte"
value = 135
mode = "hard"

# Edge build E2: the fundamentals entries (cash-based operating profitability sits in statements.toml),
# filed here under their own themes because the fundamentals, statements and instrument guide files
# reached their line cap.

[[field]]
name = "feature.composite_value_yield"
theme = "fundamentals"
reads = "What the company earns for each dollar of its value, on two yields averaged: operating profit over enterprise value and free cash flow over market value. 0.08 is 8 cents a year; above 0.10 is cheap by either measure, below 0.04 is dear. Value is high-is-cheap here, the opposite of ev_ebit, so a screen for cheap names asks for a high number."
caveats = [
  "A formalisation, not the paper's composite. The research composites use book to market, earnings, cash flow and sales growth. This has two yields only and averages the yields themselves, so a very high yield in one part dominates the mean.",
  "A very high yield is often a peak-earnings cyclical or a company the market expects to shrink: check feature.revenue_cagr_3y and feature.cash_op_profitability.",
  "Null for a company with an operating loss, a negative enterprise value, no capex line, a stale statement or no market value, and for banks. A missing value is a gap, not a pass.",
  "Enterprise value ignores minority interest and preferred stock, and both yields use the latest filings, up to four months old.",
]
sources = ["Lakonishok, Shleifer and Vishny (1994), Journal of Finance 49(5), Contrarian Investment, Extrapolation, and Risk", "Asness and Frazzini (2013), Journal of Portfolio Management 39(4), The Devil in HML's Details"]
[[field.use]]
for = "cheap on earnings and cash flow"
op = "gte"
value = 0.08
mode = "soft"
tolerance = { relative = 0.25 }

[[field]]
name = "rollup.qmj@v1.qmj_score"
theme = "fundamentals"
reads = "Quality minus junk as a z-score across the day's cross-section: 0 is the middle, 1 is one standard deviation above, -1 below. High is quality (profitable, cash-generating, little debt and distress risk), low is junk. 1 and above is the top sixth of the cross-section; the idea (Asness, Frazzini and Pedersen) is to prefer quality and avoid junk at any price."
caveats = [
  "Built from what is stored. Profitability is complete (gross profit over assets, ROE, ROA, cash flow over assets, gross margin, low accruals). Safety is only leverage and distress. The paper's growth, beta and earnings-volatility parts are not built, so rollup.qmj@v1.safety_z does not know how steady the earnings are.",
  "Relative to the session: the score falls when others improve; it has no level and cannot be compared across dates. It ranks across all names, so an asset-light software company outranks a utility on margins.",
  "Needs enough profitability parts (four of six) and a cross-section of at least 100 names; a name without them has no score (a gap, not a pass). Banks are scored on the parts they have.",
  "Quality is not cheapness: compare feature.pb_ratio and feature.ev_ebit. Statement figures enter from the session after SEC acceptance of the filing and can be four months old.",
]
sources = ["Asness, Frazzini and Pedersen (2019), Review of Accounting Studies 24(1), Quality Minus Junk", "Novy-Marx (2014), Journal of Financial Economics 112(1), The Quality Dimension of Value Investing"]
[[field.use]]
for = "a high-quality name"
op = "gte"
value = 0.5
mode = "soft"
tolerance = 0.3

[[field]]
name = "feature.net_issuance_pct_12m"
theme = "fundamentals"
reads = "The log change of the share count over a year, the form Pontiff and Woodgate use. A value of -0.03 is about 3% of the shares bought back and +0.10 about 10% more shares issued. Negative is a net buyer of its own stock and around 0 is stable. Above +0.05 is a steady issuer. Above +0.20 is a heavy one: an offering, an acquisition in stock or heavy compensation. In the research the issuers underperform and the repurchasers outperform. It ranks like feature.shares_change_yoy. It is the form the issuance edge sorts on."
caveats = [
  "The counts are the company total from the filings. A cover-page count is compared with a cover-page count and a weighted average with a weighted average, so a company that began tagging the cover page recently is null.",
  "An acquisition paid in shares, a spin-off or a reverse merger changes the count without being a financing decision; a split is adjusted away.",
  "A shrinking count can hide issuance: companies buy back what compensation issues, so a flat count is not a company that does nothing. A buyback funded by debt is not strength (see feature.debt_to_equity).",
  "Null for funds, companies without two counts a year apart (recent IPOs and filers) and a stale count.",
]
sources = ["Pontiff and Woodgate (2008), Journal of Finance 63(2), Share Issuance and Cross-Sectional Returns"]
[[field.use]]
for = "buying back shares"
op = "lte"
value = -0.01
mode = "soft"
tolerance = 0.01
[[field.use]]
for = "no heavy issuance"
op = "lte"
value = 0.1
mode = "soft"
tolerance = 0.03

[[field]]
name = "rollup.insider_buys@v1.insider_cluster_buy_count"
theme = "events"
reads = "How many different insiders bought on the open market in the last 30 days, counted from the session each filing became public. 1 is one buyer; 3 or more is a cluster. A name with no purchase in the window has no row."
caveats = [
  "A name with no row is not 'no insider buying': the field is null, and a hard 'gte' drops it. Several lines from one insider count once.",
  "A filing accepted after the close counts from the next session, so a buy two days ago may not show yet. Read rollup.insider_buys@v1.insider_opportunistic_flag for whether the buyers are routine.",
]
sources = ["Lakonishok and Lee (2001), Are Insider Trades Informative?, Review of Financial Studies"]
[[field.use]]
for = "a cluster of insiders buying"
op = "gte"
value = 3
mode = "hard"
note = "the practitioner rule; the studies do not fix a count"

[[field]]
name = "rollup.insider_buys@v1.insider_opportunistic_flag"
theme = "events"
reads = "True when a buyer in the window trades at irregular times, not the same calendar month every year (routine). It needs a trade in each of the three years before; routine is the same month each year. Opportunistic buys carried the signal in the study."
caveats = [
  "Null when no buyer has a trade in each of the three previous years: such an insider cannot be classed, and a hard 'eq true' drops the name.",
  "False means every classed buyer is routine; an unclassed buyer beside them is ignored. The record starts in 2006, so read it beside rollup.insider_buys@v1.insider_cluster_buy_count.",
]
sources = ["Cohen, Malloy and Pomorski (2012), Decoding Inside Information, Journal of Finance"]
[[field.use]]
for = "opportunistic insider buying"
op = "eq"
value = true
mode = "hard"
note = "routine buyers had no signal in the study"

[[field]]
name = "rollup.insider_buys@v1.plan_10b5_1_flag"
theme = "events"
reads = "True when a purchase in the window was made under a Rule 10b5-1 plan, set up in advance. A planned buy says little about what the insider knows now, so a screen for informed buying leaves them out."
caveats = [
  "The checkbox exists on Form 4 only since April 2023. Null means no purchase in the window carries it, so older filings are never read as unplanned.",
  "A hard 'eq false' drops every null name, which is every filing before 2023. Read the column beside the screen instead, or use the test only for recent sessions.",
]
sources = ["SEC (2022), Insider Trading Arrangements and Related Disclosures, Release 33-11138"]
[[field.use]]
for = "a purchase made outside a plan"
op = "eq"
value = false
mode = "hard"
note = "drops every name with no value, which is every filing before April 2023"

[[field]]
name = "rollup.short_interest@v1.days_to_cover"
theme = "events"
reads = "FINRA's days to cover: shares sold short divided by the average daily share volume of the report's period. 5 means five average sessions of volume to buy the short position back. High values mean a crowded short."
caveats = [
  "The figure is the settlement date's, about two weeks old when it becomes public (rollup.short_interest@v1.short_interest_date). A squeeze can have come and gone.",
  "Null when no report became public in the last 30 sessions or FINRA gives no volume. The data may not train a learned scorer; rule screens only.",
]
sources = ["Hong, Li, Ni, Scheinkman and Yan (2015), Days to Cover and Stock Returns, NBER working paper 21166"]
[[field.use]]
for = "a crowded short"
op = "gte"
value = 5
mode = "hard"
note = "the studies sort into groups; the threshold is a screen choice"

[[field]]
name = "feature.short_interest_ratio"
theme = "events"
reads = "Shares sold short as a share of the shares outstanding: 0.10 is 10% of the company short. It uses the latest public FINRA report and the latest share count. High values mean heavy short bets against the company."
caveats = [
  "It divides by shares outstanding of every class, not the float, so it understates the crowding of a stock with locked-up shares or a second class.",
  "Null with no recent report or no current share count; a hard 'gte' drops those names. FINRA data may not train a learned scorer.",
]
sources = ["Boehmer, Huszar and Jordan (2010), The good news in short interest, Journal of Financial Economics"]
[[field.use]]
for = "heavily shorted"
op = "gte"
value = 0.1
mode = "hard"
note = "10% of the shares outstanding"

# The edge build's signal fields that shipped without an entry: the option-implied history and
# status columns, the factor loadings, the quality parts, the short-interest and fund-NAV
# dates, the share-count fields and two statement ratios. Each says when the field lies.

[[field]]
name = "rollup.factor_betas@v1.beta_size"
theme = "instrument gates"
reads = "How much a name moves with small companies against the market, over the last 252 sessions: the slope on IWM minus SPY, fitted together with the other factors. 0 is neutral; 0.5 means the name gains about half a percent when small caps beat the market by one percent; negative leans large. It is a loading, not a prediction."
caveats = [
  "Unknown before about 2014. MTUM and VLUE, the momentum and value proxies, start in 2013, and the fit needs 200 sessions of every factor. factor_status says NO_FACTOR_HISTORY then. The value is never a market-only fit.",
  "Also null with SHORT_HISTORY: under 200 sessions of the name's own returns (a recent listing). Read rollup.factor_betas@v1.factor_obs for how many the fit used; under about 250 is noisy.",
  "The factors are ETFs, not the academic long-short portfolios. A loading of 0.3 is relative to those funds only, so rank exposures across names and never compare with a paper's number.",
]
sources = ["Fama and French (1993), Common risk factors in the returns on stocks and bonds, JFE 33(1); ETF proxies are a site choice"]
[[field.use]]
for = "a small-cap tilt"
op = "gte"
value = 0.3
mode = "soft"
tolerance = 0.1
note = "a loading against IWM minus SPY, not a size rank"

[[field]]
name = "rollup.factor_betas@v1.beta_mom"
theme = "instrument gates"
reads = "How much a name moves with the momentum factor, over the last 252 sessions: the slope on MTUM minus SPY, fitted with the other factors. Positive means the name behaves like recent winners, negative like recent losers; 0 is neutral. A loading of 0.5 means half a percent for each percent the momentum fund beats the market."
caveats = [
  "Unknown before about 2014 (NO_FACTOR_HISTORY in rollup.factor_betas@v1.factor_status): MTUM started in 2013.",
  "Momentum funds rotate. MTUM's holdings change twice a year, so a loading fitted across a rebalance mixes two portfolios; read it as a one-year average.",
  "Null with SHORT_HISTORY; check rollup.factor_betas@v1.factor_obs.",
]
sources = ["Carhart (1997), On persistence in mutual fund performance, JF 52(1); the MTUM proxy is a site choice"]
[[field.use]]
for = "a name that trades like recent winners"
op = "gte"
value = 0.3
mode = "soft"
tolerance = 0.1
note = "a loading against MTUM minus SPY"

[[field]]
name = "rollup.factor_betas@v1.beta_value"
theme = "instrument gates"
reads = "How much a name moves with the value factor, over the last 252 sessions: the slope on VLUE minus SPY, fitted with the other factors. Positive means the name trades with cheap stocks, negative with expensive growth names; 0 is neutral."
caveats = [
  "Unknown before about 2014 (NO_FACTOR_HISTORY): VLUE started in 2013 and the fit needs 200 sessions.",
  "VLUE is sector-neutral, so a loading says little about being cheap on the numbers; read feature.ev_ebit or feature.composite_value_yield for that.",
  "Null with SHORT_HISTORY; check rollup.factor_betas@v1.factor_obs.",
]
sources = ["Fama and French (1993), Common risk factors in the returns on stocks and bonds, JFE 33(1); the VLUE proxy is a site choice"]
[[field.use]]
for = "a name that trades like cheap stocks"
op = "gte"
value = 0.3
mode = "soft"
tolerance = 0.1
note = "a loading against VLUE minus SPY, not a valuation"

[[field]]
name = "rollup.factor_betas@v1.beta_sector"
theme = "instrument gates"
reads = "How much a name moves with its own sector against the market, over the last 252 sessions: the slope on its sector SPDR minus SPY, from the four-factor fit. 1 moves one for one with the sector's edge over the market; near 0 means the name ignores its sector. Use it to see whether a trade is a stock call or a sector call."
caveats = [
  "Null with NO_SECTOR when the session has no sector ETF for the name (rollup.relative_strength@v1.sector_etf is null: no company snapshot yet, or an ETF). The other betas are still set then.",
  "A sector ETF holds the name itself. A megacap's sector loading is therefore partly its own return.",
  "Unknown before about 2014 and with SHORT_HISTORY, as the other betas.",
]
sources = ["Site convention over the select-sector SPDR ETFs (rollup.relative_strength@v1.sector_etf)"]
[[field.use]]
for = "a name that moves with its sector"
op = "gte"
value = 0.5
mode = "soft"
tolerance = 0.2
note = "low values mean the name ignores its sector; check factor_status for NO_SECTOR"

[[field]]
name = "rollup.factor_betas@v1.factor_obs"
theme = "instrument gates"
reads = "The sessions of the 252-session window in which the name and every factor all had a return: the observations the regression used. 252 is a full year; 200 is the minimum for any beta. A new listing or a name with trading halts has fewer."
caveats = [
  "Under about 250 the betas have wide error bands; a loading near 0.2 from 205 sessions cannot be told from 0. Treat the betas of a name with under 250 sessions as a rough guide.",
  "It counts sessions, not information: a long halt followed by a jump contributes few real observations.",
]
sources = ["Site convention (the regression window of rollup.factor_betas@v1)"]
[[field.use]]
for = "a regression on a full year of sessions"
op = "gte"
value = 250
mode = "hard"
note = "under about 250 the betas are noisy"

[[field]]
name = "rollup.factor_betas@v1.factor_status"
theme = "instrument gates"
reads = "Whether the factor loadings of the session could be fitted. OK: every beta is set. NO_SECTOR: all but beta_sector, as no sector ETF is known for the name. NO_FACTOR_HISTORY: a factor ETF has fewer than 200 returns in the window, which holds for every name before about 2014. SHORT_HISTORY: the name has fewer than 200 sessions with a return and every factor."
caveats = [
  "NO_FACTOR_HISTORY is a limit of the data, not of the name: the same name is OK from about 2014 on. A backtest before then has no betas, and a rule on them rejects every name there.",
  "SHORT_HISTORY ends by itself once the name has 200 sessions; nothing needs fixing. A rule that must hold on new listings should not use the betas.",
]
sources = ["Site convention (the fit's minimum of 200 observations)"]
[[field.use]]
for = "names with every factor loading set"
op = "eq"
value = "OK"
mode = "hard"
note = "NO_FACTOR_HISTORY holds for every name before about 2014"

[[field]]
name = "rollup.qmj@v1.profitability_z"
theme = "fundamentals"
reads = "How profitable a company is against the session's other companies, in standard deviations. It averages the z-scores of six measures: gross profit to assets, ROE, ROA, operating cash flow to assets, gross margin and low accruals. 0 is the middle, 1 is one standard deviation above, -1 below. It is the profitability half of the quality-minus-junk score."
caveats = [
  "A cross-section statistic: it moves when other companies move and carries no level. It is null when fewer than 100 companies have a value that session.",
  "Null for ETFs, funds, companies with no CIK or a non-USD report, and when a statement is more than 480 days old. A hard 'gte' drops these names.",
  "Needs at least 4 of the 6 measures; a company with an unreported line is scored on fewer, and a bank or insurer is often unscored. Read rollup.qmj@v1.balance_sheet_age_days for how old the statements are.",
]
sources = ["Asness, Frazzini and Pedersen (2019), Quality Minus Junk, Review of Accounting Studies 24: https://link.springer.com/article/10.1007/s11142-018-9470-2"]
[[field.use]]
for = "a more profitable company than most"
op = "gte"
value = 0.5
mode = "soft"
tolerance = 0.25
note = "read with rollup.qmj@v1.safety_z; a score across the session, not a level"

[[field]]
name = "rollup.qmj@v1.safety_z"
theme = "fundamentals"
reads = "How safe a company's balance sheet is against the session's others, in standard deviations: the average of the z-scores of low debt to equity and low ohlson_o (a distress score). 1 is one standard deviation safer than the middle; -1 riskier. It is a leverage and distress score, not the paper's safety."
caveats = [
  "It leaves out three parts of the published safety score: low beta, low Altman Z and low earnings volatility. Beta lives in rollup.factor_betas@v1.beta_mkt; a name safe here can still swing with the market.",
  "Null for a negative equity, an untagged debt line, or a bank (debt is its product), and under the same statement-age and 100-name rules as rollup.qmj@v1.profitability_z.",
  "Don't read a high value as a buy: a safe balance sheet can sit under a collapsing business. Read it with rollup.qmj@v1.profitability_z.",
]
sources = ["Asness, Frazzini and Pedersen (2019), Quality Minus Junk, Review of Accounting Studies 24: https://link.springer.com/article/10.1007/s11142-018-9470-2"]
[[field.use]]
for = "a safer balance sheet than most"
op = "gte"
value = 0.5
mode = "soft"
tolerance = 0.25
note = "a leverage and distress score; read with rollup.qmj@v1.profitability_z"

[[field]]
name = "rollup.mispricing@v1.composite_inputs"
theme = "fundamentals"
reads = "How many of the seven anomalies rollup.mispricing@v1.composite_rank averaged for the name: 5, 6 or 7 when the rank is set. A rank on 7 uses every measure; one on 5 leans on fewer. It is the confidence of the rank, not a signal."
caveats = [
  "A rank averaged over 5 can sit at an extreme by chance. Two names with rank 0.9 are not equally reliable if one has 7 inputs and the other 5. Gate on at least 6 when the rank is the decision.",
  "Null when the rank is null (fewer than 5 inputs); a hard criterion drops the name.",
]
sources = ["Stambaugh, Yu and Yuan (2015), Journal of Finance 70(5)"]
[[field.use]]
for = "a composite rank built on at least six of seven anomalies"
op = "gte"
value = 6
mode = "hard"
note = "gate for when rollup.mispricing@v1.composite_rank is the decision"

[[field]]
name = "rollup.cef_nav@v1.nav_per_share"
theme = "instrument gates"
reads = "The latest net asset value per share of a closed-end fund known by the session: what the assets behind one share are worth, as the fund struck it. A fund at 10.00 NAV and 9.00 close trades at a 10% discount. It is the figure the discount is measured against."
caveats = [
  "It is as struck, not split-adjusted; after a reverse split it will not match the adjusted close. rollup.cef_nav@v1.cef_discount_to_nav adjusts for splits before comparing.",
  "It is struck once a day after the close and shows from the session after its date, so on the session it is usually a day old (rollup.cef_nav@v1.nav_date). A fund holding foreign or illiquid assets prices its NAV stale at the close.",
  "The data is for personal use only (Tiingo): rule screens for the owner's own use only. Null with no NAV stored or none in the last 252 sessions.",
]
sources = ["Tiingo, Nasdaq Mutual Fund Quotation Service NAV series (personal licence)"]
[[field.use]]
for = "funds with a stored NAV"
op = "not_null"
mode = "hard"
note = "personal-licence data; the discount is in rollup.cef_nav@v1.cef_discount_to_nav"

[[field]]
name = "rollup.cef_nav@v1.nav_date"
theme = "instrument gates"
reads = "The date the fund struck the NAV in rollup.cef_nav@v1.nav_per_share. The session minus this date is the NAV's age: 1 session is normal for a fund updated daily; 5 is the limit, since the discount is null beyond it."
caveats = [
  "NAV dates lag prices. The discount pairs the NAV with the close of the same date, not the session's close, so a day of price move never counts as discount. Don't compare nav_per_share against today's close by hand.",
  "A NAV restated later replaces the first one from the session that learned of it; a past session never sees the restatement.",
  "Null with no NAV stored or none dated in the last 252 sessions. Personal-licence data.",
]
sources = ["Tiingo, Nasdaq Mutual Fund Quotation Service NAV series (personal licence)"]
[[field.use]]
for = "funds with a stored NAV to date the discount by"
op = "not_null"
mode = "hard"
note = "personal-licence data; the discount is null when the NAV is over 5 sessions old"

[[field]]
name = "rollup.etf_flows@v1.etf_shares_outstanding"
theme = "instrument gates"
reads = "The issuer's latest count of shares outstanding for an iShares fund known by the session. A fund creates shares when money comes in and redeems them when it goes out, so the count is its size in shares. A count of 500,000,000 up from 480,000,000 a month earlier is 4% net creation."
caveats = [
  "iShares files only: SPDR, Vanguard and every other issuer's funds have none, and the stored history starts about 2026-10-17, so no change exists before a month later.",
  "It is the issuer's date, which can be a few days before the session (rollup.etf_flows@v1.etf_shares_asof); a count more than 30 days old is not shown.",
  "A share count is not dollars: a price change moves assets but not the count. For the flow see rollup.etf_flows@v1.etf_shares_chg_21d. Null for a fund without a recent count.",
]
sources = ["iShares fund files (issuer's daily shares outstanding), edge build D4"]
[[field.use]]
for = "iShares funds with a recent share count"
op = "not_null"
mode = "hard"
note = "other issuers' funds have no count"

[[field]]
name = "rollup.etf_flows@v1.etf_shares_asof"
theme = "instrument gates"
reads = "The issuer's date of the share count in rollup.etf_flows@v1.etf_shares_outstanding. A fund listed daily has a date one or two sessions old; one the issuer lists weekly can be up to 7 days old. The session minus this date is the age of the count."
caveats = [
  "The 21-session change is null when this date is more than 7 days before the session. Check it before reading a flow as quiet: an old date means no data, not no flow.",
  "A count the issuer restated is seen from the session that fetched it, never earlier.",
  "Null for a fund with no count in the last 30 days.",
]
sources = ["iShares fund files (issuer's daily shares outstanding), edge build D4"]
[[field.use]]
for = "funds with a recent share count to date the flow by"
op = "not_null"
mode = "hard"
note = "the 21-session change needs a count within 7 days of the session"

[[field]]
name = "rollup.share_classes@v1.class_count"
theme = "instrument gates"
reads = "How many share classes of the issuer the reference lists: 2 for GOOG and GOOGL or for BRK.A and BRK.B, 3 or more for a company with several. It only counts classes; rollup.share_classes@v1.sibling_status says whether the classes make a clean pair."
caveats = [
  "Null for an issuer with one listed class or without an issuer or class id in the reference, so null is the common case, not a gap.",
  "Three or more classes, or one class listed under several ids, is AMBIGUOUS in rollup.share_classes@v1.sibling_status: no pair is guessed, so spread rules skip the name.",
  "It counts the classes in the snapshot the session sees; a class added or dropped shows from that snapshot, never from today's reference.",
]
sources = ["Site convention over the instrument reference (issuer CIK and share-class FIGI)"]
[[field.use]]
for = "issuers with more than one share class"
op = "gte"
value = 2
mode = "hard"
note = "then read sibling_status; three or more is AMBIGUOUS"

[[field]]
name = "feature.buyback_flag"
theme = "fundamentals"
reads = "True when the company's share count fell by at least 1% over the year: it bought back more stock than it issued. False means the count held or grew. 0.8% fewer shares is false; 3% fewer is true. It is a flag on feature.shares_change_yoy, measured from share counts, not a repurchase announcement."
caveats = [
  "Buybacks that only offset stock pay leave the count flat and read false, though cash was spent; a count that fell through a reverse split is not a buyback. Check feature.net_issuance_pct_12m and cash flow.",
  "Share counts come from filing cover pages, so a count can lag a quarter. Null when the year-ago count is missing or the current one is stale (rollup.fundamentals@v4.market_cap_status STALE); a hard 'eq true' drops those names.",
  "A company can retire stock while borrowing to do it; check feature.debt_to_equity.",
]
sources = ["Ikenberry, Lakonishok and Vermaelen (1995), Market underreaction to open market share repurchases, JFE 39; Pontiff and Woodgate (2008), Share issuance and cross-sectional returns, JF 63"]
[[field.use]]
for = "companies shrinking their share count"
op = "eq"
value = true
mode = "hard"
note = "a flag on net share change, not a repurchase announcement"

[[field]]
name = "feature.ev_ebit"
theme = "analyst"
reads = "Enterprise value divided by operating income over the last twelve months: 12 means the whole business, debt included, costs twelve years of operating profit before interest and tax. Low is cheap: under 8 is cheap against most of the market, over 25 expensive. It sees through debt and depreciation, unlike a price-to-earnings."
caveats = [
  "Null for a loss: a company with no positive EBIT has no multiple, so a hard 'lt 10' drops every unprofitable name. A bank, broker or insurer has no EBIT either (see feature.ev_ebitda for the same gap).",
  "A cyclical company at a profit peak looks cheap right before earnings fall. Compare it with its own history as well as with other names.",
  "A stale income statement gives null (rollup.income_statement@v2.is_status STALE). Enterprise value uses today's price against a statement up to four months old.",
]
sources = ["Loughran and Wellman (2011), New evidence on the relation between the enterprise multiple and average stock returns, JFQA 46"]
[[field.use]]
for = "cheap against operating profit"
op = "lt"
value = 10
mode = "soft"
tolerance = 2
note = "a loss-making company has no multiple, so a hard rule drops it"

# The macro signals (etf_macro@v1): a macro series as a column of the fund that trades it.

[[field]]
name = "rollup.etf_macro@v1.vx_basis"
theme = "instrument gates"
reads = "How far the first monthly VIX future sits above the VIX: 0.05 means it settles 5 percent over spot (contango, the usual state); below 0 is backwardation, stress. Carried by SPY."
caveats = ["Null unless the futures' trade date is the VIX observation date, so a gap day is unknown, not zero. The futures are monthly expiries after the session only, so the basis jumps when the front contract rolls."]
sources = ["Cboe VIX futures settlements and the VIX close, both personal use (decision log 2026-10-18)"]

[[field]]
name = "rollup.etf_macro@v1.vx_roll"
theme = "instrument gates"
reads = "The second monthly VIX future over the first, minus 1: the one-month roll of the curve. Above 0 a long VIX position pays the roll; it is the cost the VIX funds bleed. Carried by SPY."
caveats = ["Null with fewer than two monthly futures after the session or no settle (settles before May 2013 are null). It is a curve slope at one close, not a forecast of the VIX."]
sources = ["Cboe VIX futures settlements, personal use"]

[[field]]
name = "rollup.etf_macro@v1.cape"
theme = "instrument gates"
reads = "The country's cyclically adjusted price over ten-year real earnings, on its fund's row: 12 is cheap, 30 is dear against that country's own history. Rank across countries or against its own past, not against a global number."
caveats = ["The history is revised in place, so a backfill reads today's estimate, not what was known then: a historical test is optimistic. Null when the latest month is over 100 days old (rollup.etf_macro@v1.cape stops updating) or the fund is not a country fund."]
sources = ["Barclays Shiller CAPE file (personal research use, never served to other users); Shiller (2000), Irrational Exuberance"]

[[field]]
name = "rollup.etf_macro@v1.fx_carry"
theme = "instrument gates"
reads = "The currency's 3-month interbank rate minus the US one: 0.02 means holding it earns 2 points a year more than dollars. Positive is the carry side, negative the funding side. Carried by the six currency funds."
caveats = ["Null for the euro and the pound until fresher series are stored, and when either rate is over 100 days old. The fund's own price excludes the interest it earns, so carry is not its return."]
sources = ["OECD 3-month interbank rates via FRED; Lustig, Roussanov and Verdelhan (2011), Common risk factors in currency markets, RFS 24"]

[[field]]
name = "rollup.etf_macro@v1.hy_oas"
theme = "instrument gates"
reads = "The high-yield bond spread over Treasuries, on HYG's row: 0.04 is 4 percent, calm; above 0.08 is a credit scare. Its 50- and 200-observation means (hy_oas_ma50, hy_oas_ma200) give the trend."
caveats = ["A spread above its 200-day mean is stress rising; the level alone says nothing about direction. Null when the series is over 7 days old. Personal-use data: never served to other users."]
sources = ["ICE BofA US High Yield Index OAS via FRED (personal use)"]

[[field]]
name = "rollup.etf_macro@v1.vix"
theme = "instrument gates"
reads = "The VIX close on SPY's row: 12 is calm, 30 stressed, 40 panic. Its 50- and 200-observation means are the trend references; vix9d, vix3m, vix6m and vvix give the term structure."
caveats = ["A spike resolves within days, so a level above its mean is a regime read, not a signal by itself. Null when the VIX is over 7 days old."]
sources = ["Cboe VIX close via FRED (personal use)"]
