# L3 site setting: the field guide (ADR 0041), the analyst theme: how to read the analyst
# consensus fields (ratings, price targets, estimate revisions, the forward formulas over them).
# Entries arrive with the analyst feature groups; the keys and the rules each entry follows are in
# the header of momentum.toml. A theme file with no [[field]] yet renders no page.

# --- analyst ratings and revisions ---

[[field]]
name = "rollup.analyst_ratings@v1.rating_strong_buy"
theme = "analyst"
reads = "How many analysts rate the stock a strong buy in the newest month the vendor lists. A count of 10 is ten analysts. Compare it with rating_count for the share, not the count alone."
caveats = [
  "Analysts rate on different dates, and the vendor does not date each rating. A count mixes views from last week and from a year ago.",
  "A few analysts make a thin consensus. Read rollup.analyst_ratings@v1.rating_count beside the counts.",
  "Ratings follow the price: analysts upgrade after a rise and downgrade after a fall. A strong rating can be the lag of a rally.",
  "Null with ratings_status NOT_COVERED or NOT_FETCHED reads as not covered by our analyst data. The vendor does not answer for every name, and the nightly rotation has not asked every name yet.",
  "Null with ratings_status STALE: the newest snapshot is over 45 days old, so no value is served.",
]
sources = [
  "Finnhub analyst recommendation trends, stored nightly in analyst/estimate_snapshots (docs/adr/0068-analyst-data-vendors.md)",
]
[[field.use]]
for = "several analysts rate it a strong buy"
op = "gte"
value = 3
mode = "hard"

