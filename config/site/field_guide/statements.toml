[[field]]
name = "feature.debt_to_equity"
theme = "statements"
reads = "Total debt over stockholders' equity at the latest balance sheet: 0.5 is 50 cents of borrowing for each dollar of book equity. Under 0.5 is conservative, above 2 is heavily borrowed for an industrial."
caveats = [
  "Null unless rollup.balance_sheet@v2.bs_status is OK: PARTIAL means a core line sits at an older date than the debt, and mixing dates would mislead.",
  "Null for negative equity, so a hard criterion drops the most indebted names. Check rollup.balance_sheet@v2.total_debt against feature.ebitda instead.",
  "Total debt is the sum of the parts of one filing and leaves out operating leases. Finance leases are in under rules d to f, and their current part under rules c and e. Banks and utilities run high ratios for good reason: compare within an industry.",
  "A company that tags no debt line is null, not debt-free. Null when the statement it reads is STALE: its newest period ended over 480 days before the session. Old figures are shown in the rollup but never used in a ratio.",
]
sources = [
  "SEC EDGAR company facts, the statement lines of instruments/statements (docs/adr/0067-sec-financial-statements-table.md)",
  "Damodaran, Investment Valuation (3rd ed.), ch. 'Measuring Earnings' and 'Equity Value to Firm Value': the definitions behind these ratios",
]
[[field.use]]
for = "conservative borrowing"
op = "lte"
value = 0.5
mode = "soft"
tolerance = 0.25
[[field.use]]
for = "not heavily borrowed"
op = "lte"
value = 2
mode = "hard"

[[field]]
name = "feature.pb_ratio"
theme = "statements"
reads = "Market cap over stockholders' equity at the latest balance sheet: 1 means the market values the company at its book. Under 1 is below book, 1 to 3 is typical, above 5 is priced for returns well above book value."
caveats = [
  "Null for negative equity. Buybacks and old losses push book equity down, so a high or missing P/B can mean an old, cash-rich company, not an expensive one.",
  "Book value leaves out brands, software and people: it means little for asset-light companies. Banks keep it, where it is the standard ratio.",
  "Market cap is the company total count times this class's close. The statements are the company's, so it is misstated when share classes trade at very different prices, and null for an ADR. Null when the statement it reads is STALE: its newest period ended over 480 days before the session. Old figures are shown in the rollup but never used in a ratio.",
]
sources = [
  "SEC EDGAR company facts, the statement lines of instruments/statements (docs/adr/0067-sec-financial-statements-table.md)",
  "Fama and French (1992), The Cross-Section of Expected Stock Returns: book-to-market and returns",
]
[[field.use]]
for = "cheap against book"
op = "lt"
value = 1.5
mode = "soft"
tolerance = 0.5
note = "with feature.roe gt 0.08 so a low price is not a poor business"

[[field]]
name = "feature.fcf"
theme = "statements"
reads = "Operating cash flow less capital expenditure over the trailing twelve months, in dollars: the cash left after the business pays to keep and grow its assets. Negative when spending exceeds cash from operations."
caveats = [
  "Null unless rollup.cash_flow@v2.cf_status is OK: PARTIAL can mean the two lines end on different periods, and subtracting one year of capex from another year of cash flow is wrong.",
  "Null for a filer that does not tag capex: free cash flow is never taken as equal to operating cash flow. rollup.cash_flow@v2.cf_status shows PARTIAL for those names.",
  "Capex covers property, plant and equipment only. Acquisitions, capitalised software and leases are other lines, so an acquisitive company can look richer than it is.",
  "Working capital swings move one year's figure: read two years. Null when the statement it reads is STALE: its newest period ended over 480 days before the session. Old figures are shown in the rollup but never used in a ratio. Lags like every TTM: it ends at the last filed quarter, up to four months before the session. A restatement filed later changes the figure only from its filing date.",
]
sources = ["SEC EDGAR company facts, the statement lines of instruments/statements (docs/adr/0067-sec-financial-statements-table.md)"]
[[field.use]]
for = "positive free cash flow"
op = "gt"
value = 0
mode = "hard"

[[field]]
name = "feature.fcf_yield"
theme = "statements"
reads = "Free cash flow over the trailing twelve months divided by market cap: 0.05 is 5 cents of free cash flow a year for each dollar of market value. Above 0.08 is cheap on cash, negative means the company burns cash."
caveats = [
  "Null unless the cash flow is OK: both lines must end on the same period.",
  "Null for a filer that does not tag capex, for a missing market cap and for an ADR. A hard criterion drops them all.",
  "Market cap is the company total count times this class's close. The statements are the company's, so it is misstated when share classes trade at very different prices, and null for an ADR.",
  "A high yield from a one-year working capital release reverses: check feature.fcf over two years. Banks' cash flow includes deposit movements, so the figure is not comparable with an industrial's.",
]
sources = [
  "SEC EDGAR company facts, the statement lines of instruments/statements (docs/adr/0067-sec-financial-statements-table.md)",
  "Damodaran, free cash flow to equity and the cash yield as a valuation screen",
]
[[field.use]]
for = "cheap on free cash flow"
op = "gte"
value = 0.06
mode = "soft"
tolerance = 0.02
note = "with feature.interest_cover gte 3 so the cash is not owed to lenders"

[[field]]
name = "feature.enterprise_value"
theme = "statements"
reads = "Market cap plus total debt less cash at the latest balance sheet, in dollars: what it would cost to buy the whole business and clear its net debt. The numerator of feature.ev_ebitda."
caveats = [
  "Null unless rollup.balance_sheet@v2.bs_status is OK: PARTIAL means a core line sits at an older date than the debt, and mixing dates would mislead.",
  "Minority interest, preferred stock, operating leases, pensions and short-term investments are not adjusted for. Finance leases are in debt under rules d to f, and their current part under c and e. The figure is approximate for companies with large ones.",
  "Null when debt or cash is untagged, for a missing market cap and for an ADR. Market cap is the company total count times this class's close. The statements are the company's, so it is misstated when share classes trade at very different prices, and null for an ADR.",
  "Banks have no meaningful enterprise value: their debt is their operating liabilities. Null when the statement it reads is STALE: its newest period ended over 480 days before the session. Old figures are shown in the rollup but never used in a ratio.",
]
sources = [
  "SEC EDGAR company facts, the statement lines of instruments/statements (docs/adr/0067-sec-financial-statements-table.md)",
  "Damodaran, Investment Valuation (3rd ed.), ch. 'Measuring Earnings' and 'Equity Value to Firm Value': the definitions behind these ratios",
]
[[field.use]]
for = "a large enterprise"
op = "gte"
value = 10000000000
mode = "soft"
tolerance = { relative = 0.3 }

[[field]]
name = "feature.ev_ebitda"
theme = "statements"
reads = "Enterprise value over EBITDA for the trailing twelve months: 10 means the business is priced at ten years of its operating earnings before interest, tax and depreciation. Under 8 is cheap, above 20 is priced for growth."
caveats = [
  "Null when EBITDA is not positive, so loss makers are not shown cheap, and for banks, where the EBIT family is null by design. A hard 'lt 8' silently drops them.",
  "Capital-intensive industries run low multiples for good reason: compare within instrument.sector. Debt, leases and one-offs are as the filer tagged them.",
  "Null when any input is null, and for an ADR. Null when the statement it reads is STALE: its newest period ended over 480 days before the session. Old figures are shown in the rollup but never used in a ratio.",
]
sources = [
  "SEC EDGAR company facts, the statement lines of instruments/statements (docs/adr/0067-sec-financial-statements-table.md)",
  "Damodaran, Investment Valuation (3rd ed.), ch. 'Measuring Earnings' and 'Equity Value to Firm Value': the definitions behind these ratios",
  "Loughran and Wellman (2011), New Evidence on the Relation between the Enterprise Multiple and Average Stock Returns",
]
[[field.use]]
for = "cheap on enterprise value"
op = "lt"
value = 8
mode = "soft"
tolerance = 2
note = "with feature.operating_margin gt 0.05 so a low multiple is not a thin margin"

[[field]]
name = "feature.revenue_cagr_3y"
theme = "statements"
reads = "Compound annual growth of revenue over three years: the TTM against the TTM about three years earlier, as a yearly rate. 0.10 is 10% a year, 0.20 and above is a fast grower, negative is a shrinking business."
caveats = [
  "Null when the base 3 years ago is zero or negative, or the current one is, and for a company with under three years of filed history.",
  "Acquisitions inflate reported growth and divestitures deflate it; the figure is the reported one, not organic. A jump after a deal is not demand.",
  "The two ends are TTMs, so a seasonal company is compared like with like, but a cycle peak or trough end point can mislead. Check feature.revenue_growth_yoy for the recent pace.",
  "Null when the statement it reads is STALE: its newest period ended over 480 days before the session. Old figures are shown in the rollup but never used in a ratio.",
]
sources = [
  "SEC EDGAR company facts, the statement lines of instruments/statements (docs/adr/0067-sec-financial-statements-table.md)",
  "CFA Institute curriculum, compound annual growth rate as the standard multi-year growth measure",
]
[[field.use]]
for = "steady growth over three years"
op = "gte"
value = 0.1
mode = "soft"
tolerance = 0.03
note = "with feature.revenue_growth_yoy gt 0 so the old growth has not stopped"

