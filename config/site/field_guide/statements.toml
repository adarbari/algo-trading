[[field]]
name = "rollup.balance_sheet@v1.is_financial"
theme = "statements"
reads = "Whether the issuer is a bank, broker or insurer (SIC code 6000 to 6411 in the company snapshot). Their balance sheet is kept as filed; only the operating income (rollup.income_statement@v1.ebit_ttm), D&A and interest lines are null for them. A bank's debt and operating income are not those of an operating company. False for a name with no company snapshot."
caveats = [
  "Leverage ratios mean something else for these names. A bank's deposits and borrowings are its raw material, and a ratio over its total debt or total liabilities is not comparable with an industrial's. Use it to leave them out of a debt screen.",
  "Decided from the SIC code of the company snapshot: a holding company with a bank inside it may not be flagged, and a name with no snapshot reads false.",
  "Equity, total assets, cash and debt are kept and are as good as any filer's; return on equity and price to book are the usual lenses for banks.",
]
sources = ["SEC EDGAR company facts, the statement lines of instruments/statements (docs/adr/0067-sec-financial-statements-table.md)"]
[[field.use]]
for = "leave out banks and insurers"
op = "eq"
value = false
mode = "hard"
[[field]]
name = "rollup.balance_sheet@v1.bs_status"
theme = "statements"
reads = "Whether the balance sheet lines of the name can be trusted as a set. OK: cash, total assets and stockholders equity all end on the newest balance sheet date. Every other line is read at that date and is null when the filer did not report it then. PARTIAL: at least one of them is missing or ends on an older date, so the lines may describe different dates. NO_FACTS: no balance sheet fact is filed (funds, foreign filers that do not report in USD). STALE: the newest balance sheet date is more than 480 days before the session; the values are shown but old. A bank keeps its balance sheet: it is flagged by rollup.balance_sheet@v1.is_financial, not by a status."
caveats = [
  "OK says the three core lines share a date, not that debt, short-term investments or current items exist. Those are optional and many filers do not tag them, so read the line itself.",
  "STALE is checked first: a filer 16 months behind its filings is STALE even when its lines match. A name between its quarterly and annual report is not stale.",
  "PARTIAL is common for filers that switch the tag of a line (for example cash with or without restricted cash) between reports. Read rollup.balance_sheet@v1.bs_as_of and check the figures before a ratio.",
]
sources = ["SEC EDGAR company facts, the statement lines of instruments/statements (docs/adr/0067-sec-financial-statements-table.md)"]
[[field.use]]
for = "complete balance sheet figures"
op = "eq"
value = "OK"
mode = "hard"
