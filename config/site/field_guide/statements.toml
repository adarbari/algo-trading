value = "REPORTED"
mode = "hard"

[[field]]
name = "rollup.balance_sheet@v2.stockholders_equity"
theme = "statements"
reads = "Stockholders' equity at the balance sheet date (bs_as_of), in dollars (us-gaap StockholdersEquity, else the figure including the portion attributable to noncontrolling interests). It is what is left for the owners after the liabilities. Over total assets it is the equity ratio; under shares it is the book value per share; against profit it gives the return on equity. Negative after accumulated losses or heavy buybacks."
caveats = [
  "Book value, not market value. Years of buybacks can push equity below zero for a profitable business (negative equity is not distress by itself); a ratio over it then has no meaning.",
  "The two tags differ by the noncontrolling interest: a company with large minority shareholders shows a larger figure under the including tag. The tag in use is not stored, so compare within a company over time, not across.",
  "A balance sheet is a snapshot at a quarter or year end and lags like every filing. It is up to four months old on the day it is filed. A restatement filed later changes the figure only from its filing date. Check rollup.balance_sheet@v2.bs_as_of for the date. Lines other than cash, total assets and equity are read only at that date: a line the filer did not report on it is null, never an older figure.",
  "Null for funds, foreign filers that do not report in USD and companies whose filer does not tag the line; null is not zero.",
]
sources = ["SEC EDGAR company facts, the statement lines of instruments/statements (docs/adr/0067-sec-financial-statements-table.md)"]
[[field.use]]
for = "positive book equity"
op = "gt"
value = 0
mode = "hard"
[[field]]
name = "rollup.balance_sheet@v2.current_assets"
theme = "statements"
reads = "Current assets at the balance sheet date (bs_as_of), in dollars (us-gaap AssetsCurrent): cash, securities, receivables and inventory, what turns to cash within a year. Over rollup.balance_sheet@v2.current_liabilities it is the current ratio (above 1 covers the year's bills, under 1 leans on new financing)."
caveats = [
  "Banks, insurers and many financial filers do not report a classified balance sheet, so the line is null for them; null is not zero.",
  "Inventory counts in full: a retailer with unsold stock can show a healthy ratio and still be short of cash. Read rollup.balance_sheet@v2.cash too.",
  "A balance sheet is a snapshot at a quarter or year end and lags like every filing. It is up to four months old on the day it is filed. A restatement filed later changes the figure only from its filing date. Check rollup.balance_sheet@v2.bs_as_of for the date. Lines other than cash, total assets and equity are read only at that date: a line the filer did not report on it is null, never an older figure.",
  "Null for funds, foreign filers that do not report in USD and companies whose filer does not tag the line; null is not zero.",
]
sources = ["SEC EDGAR company facts, the statement lines of instruments/statements (docs/adr/0067-sec-financial-statements-table.md)"]
[[field.use]]
for = "current assets are reported"
op = "gt"
value = 0
mode = "hard"

[[field]]
name = "rollup.balance_sheet@v2.current_liabilities"
theme = "statements"
reads = "Current liabilities at the balance sheet date (bs_as_of), in dollars (us-gaap LiabilitiesCurrent): payables, accrued costs, deferred revenue and the debt due within a year. The bills of the next twelve months; rollup.balance_sheet@v2.current_assets over it is the current ratio."
caveats = [
  "Banks, insurers and many financial filers do not report a classified balance sheet, so the line is null for them; null is not zero.",
  "Includes the current portion of debt: a company that must refinance soon shows it here before rollup.balance_sheet@v2.total_debt tells you.",
  "A balance sheet is a snapshot at a quarter or year end and lags like every filing. It is up to four months old on the day it is filed. A restatement filed later changes the figure only from its filing date. Check rollup.balance_sheet@v2.bs_as_of for the date. Lines other than cash, total assets and equity are read only at that date: a line the filer did not report on it is null, never an older figure.",
  "Null for funds, foreign filers that do not report in USD and companies whose filer does not tag the line; null is not zero.",
]
sources = ["SEC EDGAR company facts, the statement lines of instruments/statements (docs/adr/0067-sec-financial-statements-table.md)"]
[[field.use]]
for = "current liabilities are reported"
op = "gt"
value = 0
mode = "hard"

[[field]]
name = "rollup.balance_sheet@v2.bs_as_of"
theme = "statements"
reads = "The newest balance sheet date of the core lines (cash, total assets, stockholders equity): the quarter end or fiscal year end every other line of the row is read at. It tells how old rollup.balance_sheet@v2.cash and its siblings are, and the status is OK only when the core lines end on it."
caveats = [
  "Not the date the figures became public: that is rollup.balance_sheet@v2.bs_filed, and the session reads only what was filed by it.",
  "When rollup.balance_sheet@v2.bs_status is PARTIAL some line can end on an older date. A core line that ends earlier keeps its own latest figure. The newest date is this one, and every other line is read at it.",
  "Null when no balance sheet fact is filed.",
]
sources = ["SEC EDGAR company facts, the statement lines of instruments/statements (docs/adr/0067-sec-financial-statements-table.md)"]
[[field.use]]
for = "a balance sheet is known"
op = "not_null"
mode = "hard"

[[field]]
name = "rollup.balance_sheet@v2.bs_filed"
theme = "statements"
reads = "The filing date of the newest balance sheet fact: the day the figures became public, the earliest session that could have known them. Between rollup.balance_sheet@v2.bs_as_of and this date is the reporting lag."
caveats = [
  "A filing made in the evening counts for the session of its filing date: a few hours of look-ahead, the same as every statement figure.",
  "It dates the newest fact of the newest balance sheet; a restated line of an older date can have been filed later, which does not move this date.",
  "Null when no balance sheet fact is filed.",
]
sources = ["SEC EDGAR company facts, the statement lines of instruments/statements (docs/adr/0067-sec-financial-statements-table.md)"]
[[field.use]]
for = "a balance sheet is filed"
op = "not_null"
mode = "hard"

[[field]]
name = "rollup.balance_sheet@v2.is_financial"
theme = "statements"
reads = "Whether the issuer is a bank, broker or insurer (SIC code 6000 to 6411 in the company snapshot). Their balance sheet is kept as filed; only the operating income (rollup.income_statement@v2.ebit_ttm), D&A and interest lines are null for them. A bank's debt and operating income are not those of an operating company. False for a name with no company snapshot."
caveats = [
  "Leverage ratios mean something else for these names. A bank's deposits and borrowings are its raw material, and a ratio over its total debt or total liabilities is not comparable with an industrial's. Use it to leave them out of a debt screen.",
  "Decided from the SIC code of the company snapshot: a holding company with a bank inside it may not be flagged, and a name with no snapshot reads false.",
  "Equity, total assets, cash and debt are kept and are as good as any filer's; return on equity and price to book are the usual lenses for banks.",
]
sources = ["SEC EDGAR company facts, the statement lines of instruments/statements (docs/adr/0067-sec-financial-statements-table.md)"]
[[field.use]]
for = "leave out banks and insurers"
op = "eq"
value = false
mode = "hard"
[[field]]
name = "rollup.balance_sheet@v2.bs_status"
theme = "statements"
reads = "Whether the balance sheet lines of the name can be trusted as a set. OK: cash, total assets and stockholders equity all end on the newest balance sheet date. Every other line is read at that date and is null when the filer did not report it then. PARTIAL: at least one of them is missing or ends on an older date, so the lines may describe different dates. NO_FACTS: no balance sheet fact is filed (funds, foreign filers that do not report in USD). STALE: the newest balance sheet date is more than 480 days before the session; the values are shown but old. A bank keeps its balance sheet: it is flagged by rollup.balance_sheet@v2.is_financial, not by a status."
caveats = [
  "OK says the three core lines share a date, not that debt, short-term investments or current items exist. Those are optional and many filers do not tag them, so read the line itself.",
  "STALE is checked first: a filer 16 months behind its filings is STALE even when its lines match. A name between its quarterly and annual report is not stale.",
  "PARTIAL is common for filers that switch the tag of a line (for example cash with or without restricted cash) between reports. Read rollup.balance_sheet@v2.bs_as_of and check the figures before a ratio.",
]
sources = ["SEC EDGAR company facts, the statement lines of instruments/statements (docs/adr/0067-sec-financial-statements-table.md)"]
[[field.use]]
for = "complete balance sheet figures"
op = "eq"
value = "OK"
mode = "hard"

