# L3 site setting: the field guide (ADR 0041, amended 2026-10-06), one <theme>.toml per theme
# plus situations.toml; loaded together by config/site/settings.py load_field_guide. Every
# [[field]] says how to read one catalogue field, which criterion means what, and when the
# reading lies; a [[situation]] is one state of the world that fools several thresholds at once.
# The keys are documented in momentum.toml. Edit by PR; `make features-doc` renders the page.

[[field]]
name = "feature.atr_pct"
theme = "volatility"
reads = "Wilder's 14-day average true range as a share of price: the typical daily range. Under 0.015 is a calm large cap or a fund; 0.015 to 0.025 is a normal stock; 0.025 to 0.035 is a lively swing-trading range; 0.035 to 0.05 is volatile; above 0.05 is very volatile (small caps, biotech, crypto-linked names). A stop or a target is usually set in multiples of it (2 ATR is the Turtle stop)."
caveats = [
  "Near 0 for weeks after a takeover announcement: the price is pinned. Under 0.005 on a stock that is not a bond fund is that signature; see the 'pending takeover' situation.",
  "One gap day raises the 14-day ATR for two weeks; a 'volatile' reading right after earnings is the event. Check rollup.price_moves@v1.one_day_move and rollup.earnings@v1.last_earnings_date.",
  "Low-priced names show a high ratio partly because the tick is a large share of the price; gate on rollup.price_stats@v2.close.",
  "Leveraged funds run at two or three times their index's range by construction; exclude with instrument.is_leveraged eq false unless that is the point.",
]
sources = [
  "ATR-percent bands used by swing traders (under 2.5% stable, 2.5 to 3.5% normal, 3.5 to 4.5% volatile, over 5% very volatile): https://oneoption.com/?p=59457",
  "Wilder (1978) for the ATR; the Turtle rules for ATR-sized stops",
]
[[field.use]]
for = "moves enough to trade (swing range)"
op = "gte"
value = 0.02
mode = "soft"
tolerance = 0.005
[[field.use]]
for = "volatile"
op = "gte"
value = 0.03
mode = "soft"
tolerance = 0.005
[[field.use]]
for = "calm (premium selling, income)"
op = "lte"
value = 0.02
mode = "soft"
tolerance = 0.005
note = "with feature.atr_pct gte 0.005 so pinned takeover targets do not pass as calm"

[[field]]
name = "feature.range_20d_pct"
theme = "volatility"
reads = "The height of the last 20 sessions' high-low channel as a share of price: 0.08 means the month's range was 8% of the price. Under about 0.06 for a stock is a tight consolidation (the volatility contraction that precedes many breakouts); above 0.25 is a wide, choppy month."
caveats = [
  "A pinned takeover target has the tightest range on the board; a tight range with feature.atr_pct under 0.005 is a deal, not a setup.",
  "A tight range that includes a gap is two ranges; check rollup.price_moves@v1.one_day_move.",
]
sources = [
  "Volatility contraction before breakouts (Minervini's VCP; Bollinger's squeeze) as practitioner conventions",
]
[[field.use]]
for = "tight consolidation (a breakout setup)"
op = "lte"
value = 0.08
mode = "soft"
tolerance = 0.02
note = "with feature.trend_state eq UPTREND and feature.atr_pct gte 0.01"

[[field]]
name = "rollup.price_stats@v2.hv20"
theme = "volatility"
reads = "Realised (historical) volatility over 20 sessions, annualised, as a fraction: 0.20 is 20% a year, the long-run average for a large-cap index is about 0.15 to 0.20, a typical single stock 0.25 to 0.40, a biotech or a meme name above 0.60. It is the denominator of every 'IV over HV' comparison (the 30-session version, hv30, is the one feature.iv_hv_ratio uses)."
caveats = [
  "Close-to-close volatility is dominated by one gap: a 15% earnings day alone puts hv20 near 0.50 for the next 20 sessions, then it drops out overnight. rollup.price_stats@v2.hv20_yz (Yang-Zhang, which weighs the overnight gap and the intraday range separately) is steadier; check rollup.earnings@v1.last_earnings_date.",
  "Very low readings (under 0.10 on a stock) are a pinned takeover or a halted name, not a calm company.",
  "Null after any missing bar in the window.",
]
sources = [
  "Yang and Zhang (2000); why one gap day distorts close-to-close estimates: https://flashalpha.com/articles/yang-zhang-vs-close-to-close-realized-volatility",
]
[[field.use]]
for = "a volatile name (realised)"
op = "gte"
value = 0.40
mode = "soft"
tolerance = 0.05
[[field.use]]
for = "a calm name (realised)"
op = "lte"
value = 0.25
mode = "soft"
tolerance = 0.05
note = "with rollup.price_stats@v2.hv20 gte 0.08 so pinned names do not pass"

[[field]]
name = "rollup.iv_history@v2.iv30"
theme = "volatility"
reads = "Our 30-day at-the-money implied volatility as a fraction: 0.30 is 30% a year. It is the market's price of the next month's movement. Levels are relative to the name: 0.20 is high for a utility and low for a chip maker, so compare it with the name's own history (feature.iv_rank, feature.iv_percentile) and with realised movement (feature.iv_hv_spread) rather than against one number. Options are 'expensive' when IV is high versus both."
caveats = [
  "A report inside the next 30 days inflates it: the earnings move is priced in and IV collapses right after the report (20% to 60% of it in a session). Check rollup.earnings@v1.days_to_earnings before calling options expensive.",
  "High IV with no earnings ahead usually means a known binary event the catalogue does not store (an FDA decision, a court ruling, a deal vote). It is not a free premium; treat it as EVENT_RISK.",
  "IV collapses after a takeover announcement (the price will not move): a very low iv30 with feature.atr_pct near 0 is a deal, not cheap options.",
  "Null when the session's chain gave no usable ATM quotes (rollup.iv30@v1.iv30_status says why).",
]
sources = [
  "IV behaviour around earnings: https://optionalpha.com/learn/iv-crush and https://flashalpha.com/articles/complete-guide-trading-earnings-volatility",
]
[[field.use]]
for = "high implied volatility (absolute)"
op = "gte"
value = 0.40
mode = "soft"
tolerance = 0.05
note = "prefer feature.iv_rank gte 0.5 (relative to the name's own year)"
[[field.use]]
for = "low implied volatility (absolute)"
op = "lte"
value = 0.25
mode = "soft"
tolerance = 0.05
note = "with feature.atr_pct gte 0.005; prefer feature.iv_rank lte 0.3"

[[field]]
name = "feature.iv_rank"
theme = "volatility"
reads = "Where today's IV30 sits between the lowest and highest IV30 of the last 252 sessions, 0 to 1: 0.5 is halfway up the year's range, 0.8 is near the year's high. The premium-selling convention is above 0.5 (IV is high for this name), premium buying below 0.3. The source is IBKR's history where it has one, else ours (feature.iv_rank_source says which)."
caveats = [
  "One spike (a market crash, one wild earnings) sets the year's maximum and squashes every later reading toward 0 for 252 sessions: a rank of 0.3 can be a normal IV after an abnormal year. feature.iv_percentile (the share of days below today) is not distorted by a single day; when the two disagree, trust the percentile.",
  "A report in the next ten sessions lifts the rank by itself; a high rank with rollup.earnings@v1.days_to_earnings under 10 is the earnings premium, which disappears after the report.",
  "After a takeover announcement IV collapses and the rank goes to 0 and stays there: 'cheap options' on a name that will not move. Check feature.atr_pct.",
  "Null under 60 sessions of IV history (new listings, newly optionable names) and when every IV in the window is equal; a hard criterion rejects them.",
]
sources = [
  "IV rank versus IV percentile, and the 50 / 30 convention: https://flashalpha.com/articles/iv-rank-vs-iv-percentile-difference-which-matters",
  "tastylive on IV rank for premium selling",
]
[[field.use]]
for = "options expensive for this name (sell premium)"
op = "gte"
value = 0.5
mode = "soft"
tolerance = 0.1
note = "add rollup.earnings@v1.days_to_earnings gt 10 (soft, EVENT_RISK) and feature.iv_hv_spread gte 0.05"
[[field.use]]
for = "options cheap for this name (buy premium)"
op = "lte"
value = 0.3
mode = "soft"
tolerance = 0.1
note = "with feature.atr_pct gte 0.01 so pinned names are out"

[[field]]
name = "feature.iv_percentile"
theme = "volatility"
reads = "The share of the last 252 sessions whose IV30 was below today's, 0 to 1: 0.9 means IV was lower on 90% of days this year. It answers the same question as feature.iv_rank but counts days instead of measuring the span, so one extreme day cannot squash it; it is the more robust of the two for premium selling."
caveats = [
  "The earnings and takeover caveats of feature.iv_rank apply unchanged.",
  "A percentile near 1 after a long calm stretch can be a modest IV (every earlier day was lower, but not by much); read the level too (rollup.iv_history@v2.iv30).",
]
sources = ["https://flashalpha.com/articles/iv-rank-vs-iv-percentile-difference-which-matters"]
[[field.use]]
for = "IV high for the name (robust)"
op = "gte"
value = 0.7
mode = "soft"
tolerance = 0.1
[[field.use]]
for = "IV low for the name (robust)"
op = "lte"
value = 0.3
mode = "soft"
tolerance = 0.1

[[field]]
name = "feature.iv_hv_spread"
theme = "volatility"
reads = "IV30 minus HV30, in volatility points as a fraction: 0.05 means options price 5 points more movement than the stock delivered last month. Across markets implied volatility exceeds realised by about 3 to 4 points on average (the variance risk premium, Carr and Wu 2009), so a spread near 0.04 is just the normal insurance premium; 0.08 and above is a rich one, and a negative spread means the stock moved more than its options expected."
caveats = [
  "A report inside 30 days inflates IV and the spread with it; the premium is the earnings move, not free. Check rollup.earnings@v1.days_to_earnings.",
  "A quiet month depresses HV30 and widens the spread; after a report drops out of the HV window the spread jumps with no change in IV. Check rollup.price_moves@v1.one_day_move and rollup.earnings@v1.last_earnings_date.",
  "A report inside the HV window (the last 30 sessions) inflates HV and hides a real premium: the spread looks negative while the forward month is calm.",
  "Null without an IV for the session or with a gap in the last 31 bars.",
]
sources = [
  "Carr and Wu (2009), Variance risk premiums, Review of Financial Studies: implied exceeds realised by 3 to 4 points on average",
  "IV minus HV as a premium-selling signal: https://www.optionsanalysissuite.com/screeners/highest-vrp",
]
[[field.use]]
for = "a volatility premium worth selling"
op = "gte"
value = 0.05
mode = "soft"
tolerance = 0.02
note = "with feature.iv_hv_ratio gte 1.2 (both: a spread of 0.05 on a 0.10 HV is a ratio of 1.5, on a 0.60 HV it is noise)"
[[field.use]]
for = "options cheaper than the stock's movement (buy premium)"
op = "lte"
value = 0
mode = "soft"
tolerance = 0.02

[[field]]
name = "feature.iv_hv_ratio"
theme = "volatility"
reads = "IV30 over HV30: 1 means options price exactly last month's movement, 1.2 means 20% more, 0.8 means less. Around 1.1 to 1.2 is the normal premium; 1.5 and above is rich; under 1 the market expects calmer times than the last month delivered (often right after a shock)."
caveats = [
  "The ratio explodes when HV30 is tiny: a pinned takeover target with HV 0.03 and IV 0.10 shows 3.3, the richest 'premium' on the board and the worst trade. Require rollup.price_stats@v2.hv30 gte 0.10 or feature.atr_pct gte 0.01, and read feature.iv_hv_spread alongside.",
  "A report inside the HV window compresses the ratio (HV inflated), a report ahead inflates it (IV inflated); check rollup.earnings@v1.days_to_earnings and last_earnings_date.",
  "The VRP scanner's version, feature.vrp_iv_hv_ratio, uses the lower of IBKR's and Cboe's IV30 (a conservative premium); this one uses our Cboe-derived IV30 only.",
]
sources = [
  "Carr and Wu (2009); practitioner IV/HV screens: https://www.optionsanalysissuite.com/documentation/iv-hv-history",
]
[[field.use]]
for = "a volatility premium worth selling"
op = "gte"
value = 1.2
mode = "soft"
tolerance = 0.1
note = "with feature.iv_hv_spread gte 0.05 and rollup.price_stats@v2.hv30 gte 0.10"
[[field.use]]
for = "options cheaper than realised (buy premium)"
op = "lte"
value = 0.9
mode = "soft"
tolerance = 0.1

[[field]]
name = "feature.vrp_iv30"
theme = "volatility"
reads = "The VRP scanner's IV30: the lower of IBKR's and Cboe's 30-day implied volatility when both exist (feature.vrp_iv30_source says which), as a fraction. Taking the lower one makes the premium conservative: a name passes only when both feeds agree it is high. 0.50 is the scanner's gate (the owner may lower it to 0.40); 0.30 is an ordinary large cap, 0.80 and above is a biotech or a meme name."
caveats = [
  "A report inside 30 days inflates it; the earnings move is the premium. Check rollup.earnings@v1.days_to_earnings.",
  "High IV with no report ahead is usually a known binary event the catalogue does not store (an FDA date, a court ruling): EVENT_RISK, not free premium.",
  "Null when neither feed has an IV30 for the session (no chain, a failed fetch): a hard gate rejects the name that day.",
]
sources = ["docs/screeners/vrp-scanner.md (the owner's 50% gate); the IV behaviour around earnings: https://optionalpha.com/learn/iv-crush"]
[[field.use]]
for = "high implied volatility (the VRP gate)"
op = "gte"
value = 0.50
mode = "hard"
note = "0.40 for a looser screen"
[[field.use]]
for = "elevated, listing near misses"
op = "gte"
value = 0.40
mode = "soft"
tolerance = 0.05

[[field]]
name = "feature.vrp_iv_hv_spread"
theme = "volatility"
reads = "The VRP scanner's volatility premium: vrp_iv30 minus HV30, in volatility points as a fraction. 0.10 means options price ten points more movement than the stock delivered over the last 30 sessions. The average premium across markets is 3 to 4 points (Carr and Wu), so 0.10 is a rich one; the scanner gates on it and ranks by it."
caveats = [
  "The caveats of feature.iv_hv_spread apply: a report ahead inflates it, a report inside the HV window hides it, a quiet month widens it. Check rollup.earnings@v1.days_to_earnings and rollup.price_moves@v1.one_day_move.",
  "A spread of 0.10 on a 0.08 HV is a pinned or halted name, not a premium; require feature.vrp_iv_hv_ratio and rollup.price_stats@v2.hv30 gte 0.10 with it.",
]
sources = ["Carr and Wu (2009), Variance risk premiums; docs/screeners/vrp-scanner.md"]
[[field.use]]
for = "a rich premium (the VRP gate)"
op = "gte"
value = 0.10
mode = "hard"
note = "with feature.vrp_iv_hv_ratio gte 1.25; rank by the spread descending"
[[field.use]]
for = "a premium worth a look"
op = "gte"
value = 0.05
mode = "soft"
tolerance = 0.02

[[field]]
name = "feature.vrp_iv_hv_ratio"
theme = "volatility"
reads = "vrp_iv30 over HV30 with no floor on HV30: 1.25 means options price 25% more movement than the last 30 sessions delivered. The scanner requires both the spread and the ratio, because each alone is fooled: a spread is small on a low-volatility name even when the ratio is large, and a ratio explodes when HV30 is tiny."
caveats = [
  "No HV30 floor by design (owner, 2026-10-03): a pinned takeover target with HV 0.03 shows a ratio of 3 or more and tops the list. Pair with rollup.price_stats@v2.hv30 gte 0.10 or feature.atr_pct gte 0.01.",
  "A report inside the HV window compresses it; a report ahead inflates it. Check rollup.earnings@v1.days_to_earnings and last_earnings_date.",
  "Null when HV30 is 0 or either input is missing.",
]
sources = ["Carr and Wu (2009); docs/screeners/vrp-scanner.md"]
[[field.use]]
for = "a rich premium (the VRP gate)"
op = "gte"
value = 1.25
mode = "hard"
note = "with feature.vrp_iv_hv_spread gte 0.10"
[[field.use]]
for = "a premium worth a look"
op = "gte"
value = 1.1
mode = "soft"
tolerance = 0.1

[[field]]
name = "rollup.ibkr_iv@v1.iv_rank_252d_ibkr"
theme = "volatility"
reads = "IV rank on IBKR's own implied-volatility history, 0 to 1: where today's IV sits between the year's low and high. The same reading as feature.iv_rank, which prefers this one where IBKR has it; use this field only when the screen must say 'IBKR's rank', as the VRP scanner does (it scores it, so a name IBKR has no history for loses points rather than the screen)."
caveats = [
  "Null for the names IBKR has no history for (under 60 sessions of its IV, rollup.ibkr_iv@v1.rank_status_ibkr says): a hard criterion silently excludes them. Prefer feature.iv_rank for a gate; score this one.",
  "Every caveat of feature.iv_rank applies: one spike squashes the year, a report ahead lifts it, a takeover collapses it. feature.iv_percentile is the robust cross-check.",
]
sources = ["https://flashalpha.com/articles/iv-rank-vs-iv-percentile-difference-which-matters; ADR 0028 (IBKR-derived, personal licence)"]
[[field.use]]
for = "IV high for the name (scored, IBKR's history)"
op = "gte"
value = 0.5
mode = "score"
tolerance = 0.5
note = "full points at 0.5 and above, none at 0; a missing rank scores nothing"

# ------------------------------------------------------------------- realised volatility

[[field]]
name = "rollup.price_stats@v2.hv30"
theme = "volatility"
reads = "Realised (historical) volatility over 30 sessions, annualised, as a fraction: 0.25 is 25% a year. The denominator of the IV-over-HV premium (feature.iv_hv_spread, feature.iv_hv_ratio, the VRP scanner's versions): what the stock actually did against what its options price. A large-cap index runs 0.12 to 0.20, a typical single stock 0.25 to 0.40, a biotech or a meme name above 0.60."
caveats = [
  "Close-to-close, so one gap dominates it for 30 sessions: an earnings day of 15% alone puts hv30 near 0.45 (the 'earnings gap inside the window' situation); rollup.price_stats@v2.hv20_yz is the gap-robust alternative.",
  "Under 0.10 on a stock is a pinned takeover or a halted name, not calm; a tiny HV makes feature.iv_hv_ratio explode.",
  "Null after any missing bar in the last 31 sessions.",
]
sources = ["Carr and Wu (2009) on the realised side of the premium; Yang and Zhang (2000)"]
[[field.use]]
for = "the premium's denominator is real"
op = "gte"
value = 0.10
mode = "hard"
note = "the floor the VRP ratio lacks by design; add it to any IV/HV screen"
[[field.use]]
for = "a volatile name (realised, a month and a half)"
op = "gte"
value = 0.40
mode = "soft"
tolerance = 0.05

[[field]]
name = "rollup.price_stats@v2.hv20_yz"
theme = "volatility"
reads = "Yang-Zhang realised volatility over 20 sessions, annualised, as a fraction. It uses the open, high, low and close, weighing the overnight gap and the intraday range separately, so it is several times more efficient than close-to-close and does not let one gap day own the window. The better estimate for comparing realised volatility across names; the close-to-close hv20 and hv30 are what the stored IV/HV features use."
caveats = [
  "Still a 20-session window: a shock inside it raises the estimate, just less violently than close-to-close.",
  "Bad intraday highs and lows (a bad print) distort a range estimator more than a close estimator; a reading far from rollup.price_stats@v2.hv20 is worth a look at the bars.",
]
sources = ["Yang and Zhang (2000); https://flashalpha.com/articles/yang-zhang-vs-close-to-close-realized-volatility"]
[[field.use]]
for = "a calm name (gap-robust)"
op = "lte"
value = 0.25
mode = "soft"
tolerance = 0.05
note = "with rollup.price_stats@v2.hv20_yz gte 0.08 so pinned names are out"
[[field.use]]
for = "a volatile name (gap-robust)"
op = "gte"
value = 0.40
mode = "soft"
tolerance = 0.05

# ---------------------------------------------------------- implied volatility: the inputs

[[field]]
name = "rollup.iv30@v1.iv30"
theme = "implied volatility"
reads = "Our 30-calendar-day at-the-money implied volatility as a fraction (ADR 0021): the forward ATM vols of the two expiries around 30 days, each from the two strikes around the forward with calls and puts averaged, interpolated in total variance. The number rollup.iv_history@v2.iv30 stores and feature.iv_rank ranks. 0.20 is a calm large cap, 0.30 to 0.50 an ordinary single stock, above 0.80 a biotech, a meme or an event."
caveats = [
  "A report inside 30 days inflates it: the earnings move is priced in and drops out after the report (20% to 60% of it in a session). Check rollup.earnings@v1.days_to_earnings.",
  "Built from after-close quotes that pass the quality filters; on a thin chain few quotes survive (rollup.iv30@v1.n_quotes_used) and one wide quote moves the number. SINGLE_EXPIRY (rollup.iv30@v1.iv30_status) means one expiry only, flat vol.",
  "The feed's IV30 (rollup.iv30@v1.iv30_cboe) and IBKR's (rollup.ibkr_iv@v1.iv30_ibkr) use other methods; they differ by a few points on liquid names and by more on thin ones, which is why feature.vrp_iv30 takes the lower.",
]
sources = ["ADR 0021 (our IV30); https://optionalpha.com/learn/iv-crush for the earnings behaviour"]
[[field.use]]
for = "high implied volatility (ours, absolute)"
op = "gte"
value = 0.40
mode = "soft"
tolerance = 0.05
note = "prefer feature.iv_rank gte 0.5 (relative to the name's own year)"
[[field.use]]
for = "low implied volatility (ours, absolute)"
op = "lte"
value = 0.25
mode = "soft"
tolerance = 0.05
note = "with feature.atr_pct gte 0.005"

[[field]]
name = "rollup.iv30@v1.iv30_cboe"
theme = "implied volatility"
reads = "The feed's (Cboe's) 30-day implied volatility as a fraction: 0.253 is 25.3%. The same quantity as our rollup.iv30@v1.iv30 by another method; the two agree within a few points on a liquid name. rollup.option_liquidity@v1.iv30 is the same feed number in percentage points."
caveats = [
  "A fraction here, percentage points in the chain group: 'IV over 40%' is gte 0.40 on this field.",
  "Null when the feed gives no IV30 (no underlying quote, a thin chain); ours may still have one, and vice versa.",
]
sources = ["Cboe's IV30 definition"]
[[field.use]]
for = "high implied volatility (the feed's)"
op = "gte"
value = 0.40
mode = "soft"
tolerance = 0.05
note = "prefer feature.iv_rank"

[[field]]
name = "rollup.iv30@v1.iv30_status"
theme = "implied volatility"
reads = "Why our IV30 has a value or not: OK (two expiries), SINGLE_EXPIRY (one usable expiry, flat vol, still a value), or the first failing step: NO_SPOT, NO_CHAIN, NO_EXPIRY (none 7 to 90 days out), NO_QUOTES, WIDE_SPREADS (every ATM quote wider than 35% of mid), ILLIQUID (no quote met the open-interest or volume floor), IV_FAILED (the inversion did not converge)."
caveats = [
  "WIDE_SPREADS and ILLIQUID are facts about the name's options, not the run: an IV that is null for that reason is a name whose options are not worth pricing. NO_CHAIN and NO_SPOT can be the day's fetch.",
  "SINGLE_EXPIRY values are less reliable near 30 days when the one expiry is far from it.",
]
sources = ["ADR 0021; features/rollups/options/iv30.py"]
[[field.use]]
for = "an IV30 from two expiries"
op = "eq"
value = "OK"
mode = "soft"
tolerance = 0
note = "the near miss is SINGLE_EXPIRY"

[[field]]
name = "rollup.iv30@v1.near_expiry"
theme = "implied volatility"
reads = "The expiry at or before 30 days out that our IV30 interpolates from (standard monthlies first, 7 to 90 days). A date to show; with rollup.iv30@v1.far_expiry it says how far the two bracketing expiries are from 30 days, which is how much interpolation the number carries."
caveats = [
  "Null when no expiry sits in 7 to 90 days at or before the target: the IV30 is then SINGLE_EXPIRY from the far one, or null.",
]
sources = ["ADR 0021"]
[[field.use]]
for = "a near expiry was selected"
op = "not_null"
mode = "hard"

[[field]]
name = "rollup.iv30@v1.far_expiry"
theme = "implied volatility"
reads = "The expiry at or after 30 days out that our IV30 interpolates from. With the near expiry it brackets the 30-day target; the closer the two are to 30 days, the less the interpolation matters."
caveats = [
  "Null when no expiry sits in 7 to 90 days at or after the target.",
]
sources = ["ADR 0021"]
[[field.use]]
for = "a far expiry was selected"
op = "not_null"
mode = "hard"

[[field]]
name = "rollup.iv30@v1.atm_strike_near"
theme = "implied volatility"
reads = "The listed strike nearest the forward price in the near expiry (the far one without a near): the strike our ATM vol is read around. A level to show; its distance from rollup.iv30@v1.spot says how coarse the strike ladder is at the money, which matters for how exact 'at the money' is."
caveats = [
  "On a high-priced stock with $5 strikes the nearest strike can be 2% from the forward; the two-strike interpolation handles it, but the quoted vols are not exactly ATM.",
]
sources = ["ADR 0021"]
[[field.use]]
for = "an ATM strike was found"
op = "not_null"
mode = "hard"

[[field]]
name = "rollup.iv30@v1.spot"
theme = "implied volatility"
reads = "The underlying's price captured with the chain, in dollars: the S our IV30 is priced against. It should be within the day's range of rollup.price_stats@v2.close; a gap between them means the chain was snapped at another time and the ATM strike is off by that move."
caveats = [
  "Null when no positive underlying price came with the chain (iv30_status NO_SPOT).",
]
sources = ["ADR 0021"]
[[field.use]]
for = "a spot price with the chain"
op = "not_null"
mode = "hard"

[[field]]
name = "rollup.iv30@v1.rate"
theme = "implied volatility"
reads = "The continuous risk-free rate at 30 days from the Treasury curve the session sees, as a fraction: 0.045 is 4.5%. An input of the forward and the inversion, the same for every name on the session; it moves the IV30 by a fraction of a point and is stored so the number can be reproduced."
caveats = [
  "Not a screening field: every name has the same value on a session.",
]
sources = ["ADR 0021 (the Treasury curve as the rate input)"]
[[field.use]]
for = "the curve was available"
op = "not_null"
mode = "hard"

[[field]]
name = "rollup.iv30@v1.div_yield"
theme = "implied volatility"
reads = "The dividend yield used as the continuous q in the forward, read from the materialised div_yield feature: 0.03 is 3%. A name priced with q = 0 (null here) has its forward slightly too high, and its IV30 off by a fraction of a point. The screening version of the yield is feature.div_yield."
caveats = [
  "Null means 'priced with no dividend', which is right for a non-payer and slightly wrong for a payer with too little history to be known as one.",
]
sources = ["ADR 0021"]
[[field.use]]
for = "priced with a known yield"
op = "not_null"
mode = "soft"
tolerance = 0

[[field]]
name = "rollup.iv30@v1.n_quotes_used"
theme = "implied volatility"
reads = "How many option quotes' implied vols were averaged into our IV30, across both expiries: 8 is the full set (two strikes, call and put, two expiries), 4 is one expiry (SINGLE_EXPIRY) or one side, 1 or 2 is a number resting on a quote or two. The confidence of rollup.iv30@v1.iv30 in one count."
caveats = [
  "Few quotes means a wide or thin chain: the IV30 is then a noisy number and the IV-over-HV premium built on it noisier still. Require 4 or more for a premium-selling screen.",
]
sources = ["ADR 0021"]
[[field.use]]
for = "an IV30 built on enough quotes"
op = "gte"
value = 4
mode = "soft"
tolerance = 2
on_miss = "LIQUIDITY_RISK"

[[field]]
name = "rollup.ibkr_iv@v1.iv30_ibkr"
theme = "implied volatility"
reads = "IBKR's 30-day implied volatility of the underlying's options for the session, as a fraction (IB's daily implied-volatility bar, or the streamed value after the close). A third method next to ours and Cboe's; on liquid names the three agree within a few points. feature.vrp_iv30 takes the lower of IBKR's and Cboe's so a premium screen is conservative. Personal licence (ADR 0028)."
caveats = [
  "The earnings and event caveats of every IV apply (rollup.earnings@v1.days_to_earnings).",
  "Null for names IBKR has no IV for (no listed options, no quotes) and for sessions outside the nightly snapshot's coverage; the history backfill covers IV, not HV.",
]
sources = ["ADR 0028 (IBKR-derived features); IB's option implied-volatility bars"]
[[field.use]]
for = "high implied volatility (IBKR's)"
op = "gte"
value = 0.40
mode = "soft"
tolerance = 0.05
note = "prefer feature.vrp_iv30 (the lower of the two feeds) for a premium gate"

[[field]]
name = "rollup.ibkr_iv@v1.hv30_ibkr"
theme = "implied volatility"
reads = "IBKR's 30-day historical (realised) volatility for the session, as a fraction: IB's own estimate of what the stock did, next to our close-to-close rollup.price_stats@v2.hv30. The two agree closely on ordinary names; a gap between them is usually a split or a bad print on one side."
caveats = [
  "Only from the nightly snapshot: null on sessions the backfill filled (it fetches IV only). Our hv30 is the one every stored IV/HV feature uses.",
]
sources = ["ADR 0028"]
[[field.use]]
for = "a realised-volatility cross-check exists"
op = "not_null"
mode = "soft"
tolerance = 0

[[field]]
name = "rollup.ibkr_iv@v1.iv_percentile_252d_ibkr"
theme = "implied volatility"
reads = "The share of the last 252 sessions whose IBKR IV was below today's, 0 to 1: 0.9 means IV was lower on 90% of days this year. The robust companion of rollup.ibkr_iv@v1.iv_rank_252d_ibkr (counts days instead of measuring the span, so one spike cannot squash it); feature.iv_percentile prefers this one where IBKR has it."
caveats = [
  "Null under 60 sessions of IBKR IV (rollup.ibkr_iv@v1.rank_status_ibkr UNKNOWN); PROVISIONAL below 252 sessions compares against a shorter year.",
  "A report in the next ten sessions lifts it like every IV measure.",
]
sources = ["https://flashalpha.com/articles/iv-rank-vs-iv-percentile-difference-which-matters; ADR 0028"]
[[field.use]]
for = "IV high for the name (robust, IBKR's history)"
op = "gte"
value = 0.7
mode = "soft"
tolerance = 0.1

[[field]]
name = "rollup.ibkr_iv@v1.history_days_ibkr"
theme = "implied volatility"
reads = "Sessions of the 252-session window with an IBKR IV, today included: 252 is a full year, 60 is the floor for a rank, under 60 means no rank yet. Says how much of the year the IBKR-based rank and percentile are computed over."
caveats = [
  "Gaps are not filled: a name IBKR dropped and re-added has a low count with a long listing history.",
]
sources = ["ADR 0028"]
[[field.use]]
for = "a full year of IBKR IV"
op = "gte"
value = 252
mode = "soft"
tolerance = 30
[[field.use]]
for = "enough history for a rank"
op = "gte"
value = 60
mode = "hard"

[[field]]
name = "rollup.ibkr_iv@v1.rank_status_ibkr"
theme = "implied volatility"
reads = "How complete IBKR's IV history is for the rank: UNKNOWN below 60 sessions (no rank), PROVISIONAL below 252 (a rank over a partial year), FULL from 252. A PROVISIONAL rank over three months compares today against a short, possibly calm, window."
caveats = [
  "A PROVISIONAL rank of 1.0 after a quiet quarter is a modest IV; read the level (rollup.ibkr_iv@v1.iv30_ibkr) with it.",
]
sources = ["ADR 0028"]
[[field.use]]
for = "a rank over a full year"
op = "eq"
value = "FULL"
mode = "soft"
tolerance = 0
note = "the near miss is PROVISIONAL"

[[field]]
name = "rollup.iv_history@v2.iv_rank_252d"
theme = "implied volatility"
reads = "IV rank on our own IV30 history, 0 to 1: where today's IV30 sits between the year's low and high. feature.iv_rank prefers IBKR's rank and falls back to this one (feature.iv_rank_source says which); use this field only when the screen must say 'our history'."
caveats = [
  "Every caveat of feature.iv_rank: one spike squashes the year, a report ahead lifts it, a takeover collapses it; rollup.iv_history@v2.iv_percentile_252d is the robust cross-check.",
  "Null under 60 sessions of our IV (rollup.iv_history@v2.rank_status UNKNOWN), when there is no IV today, or when every IV in the window is equal.",
]
sources = ["https://flashalpha.com/articles/iv-rank-vs-iv-percentile-difference-which-matters"]
[[field.use]]
for = "IV high for the name (our history)"
op = "gte"
value = 0.5
mode = "soft"
tolerance = 0.1
note = "prefer feature.iv_rank, which takes IBKR's where it exists"

[[field]]
name = "rollup.iv_history@v2.iv_percentile_252d"
theme = "implied volatility"
reads = "The share of the last 252 sessions whose IV30 (ours) was below today's, 0 to 1. The robust companion of rollup.iv_history@v2.iv_rank_252d; feature.iv_percentile prefers IBKR's and falls back to this."
caveats = [
  "A percentile near 1 after a long calm stretch can be a modest IV; read the level too.",
  "Null under 60 sessions of IV or without an earlier IV.",
]
sources = ["https://flashalpha.com/articles/iv-rank-vs-iv-percentile-difference-which-matters"]
[[field.use]]
for = "IV high for the name (robust, our history)"
op = "gte"
value = 0.7
mode = "soft"
tolerance = 0.1

[[field]]
name = "rollup.iv_history@v2.history_days"
theme = "implied volatility"
reads = "Sessions of the 252-session window with our IV30, today included: 252 is a full year, 60 the floor for a rank. Our history starts when the chain store starts (2026-10-02), so counts are short for every name until a year has passed; IBKR's history (rollup.ibkr_iv@v1.history_days_ibkr) is the longer one."
caveats = [
  "Gaps are not filled: a session whose chain failed is a missing day in the window.",
]
sources = ["Site convention (docs/roadmap.md: the IBKR IV history backfill)"]
[[field.use]]
for = "enough history for a rank"
op = "gte"
value = 60
mode = "hard"

[[field]]
name = "rollup.iv_history@v2.rank_status"
theme = "implied volatility"
reads = "How complete our IV history is for the rank: UNKNOWN below 60 sessions (no rank), PROVISIONAL below 252, FULL from 252."
caveats = [
  "PROVISIONAL over a short, calm window makes an ordinary IV rank near 1; read rollup.iv_history@v2.iv30 with it.",
]
sources = ["Site convention"]
[[field.use]]
for = "a rank over a full year"
op = "eq"
value = "FULL"
mode = "soft"
tolerance = 0
note = "the near miss is PROVISIONAL"

[[field]]
name = "feature.iv_rank_source"
theme = "implied volatility"
reads = "Where feature.iv_rank and feature.iv_percentile came from: ibkr (IBKR's IV history, the longer one, personal licence) or ours (iv_history, from Cboe chains, from 2026-10-02). A label to show next to the rank; a screen restricted to one source pins it here."
caveats = [
  "Null when neither source has a rank; the two sources' ranks are not interchangeable on the same name (different methods, different windows), so a screen that mixes them compares slightly different things.",
]
sources = ["ADR 0028"]
[[field.use]]
for = "IBKR's rank only"
op = "eq"
value = "ibkr"
mode = "hard"

[[field]]
name = "feature.vrp_iv30_source"
theme = "implied volatility"
reads = "Where feature.vrp_iv30 came from: ibkr or cboe, the lower of the two when both exist (ibkr on a tie). A label to show with the VRP gate's IV30; when it says cboe, IBKR's number was the higher (or missing), and the premium screen used the conservative one."
caveats = [
  "Null when neither feed has an IV30 for the session.",
]
sources = ["docs/screeners/vrp-scanner.md (the lower-of-two rule)"]
[[field.use]]
for = "both feeds agreed closely enough to use IBKR's"
op = "eq"
value = "ibkr"
mode = "soft"
tolerance = 0

# Realised-volatility bands and the squeeze (bands@v2, trend_stats@v2 and
# config/site/features/bands.toml): how dispersed the last month's closes are, where that
# sits against the year, and the compressions that precede a move.

[[field]]
name = "rollup.bands@v2.close_std_20"
theme = "volatility"
reads = "The sample standard deviation of the last 20 closes, in dollars per share: half the distance from the 20-session mean to a one-sigma Bollinger band. It scales with the price, so read it as a share of the price (feature.bb_width is four of these over the mean) or in the z-score it normalises (feature.price_z_20d): a $2 deviation is wide on a $30 stock and tight on a $300 one."
caveats = [
  "It measures dispersion of closes, which a steady trend inflates as much as choppiness does: a stock that rose 10% in a straight line over 20 sessions has a large deviation and no noise. For the noise alone use rollup.price_stats@v2.hv20 (the deviation of returns).",
  "Null after a gap in the last 20 sessions or a shorter history.",
]
sources = [
  "Bollinger Bands, Wikipedia: https://en.wikipedia.org/wiki/Bollinger_Bands",
]
[[field.use]]
for = "has a 20-close deviation"
op = "not_null"
mode = "hard"
note = "threshold the normalised forms instead: feature.bb_width or feature.price_z_20d"

[[field]]
name = "feature.bb_width"
theme = "volatility"
reads = "The Bollinger bandwidth: the distance between the bands as a share of the 20-session mean, 0.10 meaning the bands are 10% of the price apart (four standard deviations of the last 20 closes). Low to high: under about 0.05 is tight for a large cap, 0.08 to 0.15 ordinary, above 0.25 a volatile month. The level depends on the name, so screen on its rank against the year, rollup.bands@v2.bb_width_pctile_252d, and use this to compare two names on the same day."
caveats = [
  "A shock day widens the bands for exactly 20 sessions and then they snap shut as it leaves the window; a 'narrowest in a year' reading right then is arithmetic, not a base. Check rollup.price_moves@v1.one_day_move and rollup.earnings@v1.last_earnings_date.",
  "Bandwidth rises in a clean trend as well as in a chop (a one-direction move spreads the closes), so a high value is not 'risky' on its own; pair with feature.trend_state.",
  "Null after a gap in the last 20 sessions or a shorter history.",
]
sources = [
  "Bollinger (2001), Bollinger on Bollinger Bands: BandWidth and the Squeeze",
  "Bollinger BandWidth, StockCharts: https://school.stockcharts.com/doku.php?id=technical_indicators:bollinger_band_width",
]
[[field.use]]
for = "comparing two names' volatility today"
op = "lte"
value = 0.10
mode = "score"
tolerance = 0.05
note = "a score between names; for 'tight for this name' use rollup.bands@v2.bb_width_pctile_252d lte 0.10"

[[field]]
name = "rollup.bands@v2.bb_width_pctile_252d"
theme = "volatility"
reads = "Where today's Bollinger bandwidth sits against the name's own last year, 0 to 1: the share of the 252 sessions before today whose bandwidth was narrower. 0.05 means the bands are tighter than on 95% of days in the year (Bollinger's Squeeze: the lowest bandwidth in six months), 0.50 an ordinary month, 0.95 one of the widest. A squeeze says a large move is likelier, not which way: it is a setup to pair with a direction (feature.trend_state, rollup.volume@v1.up_volume_share_20d), and feature.bb_squeeze is the same idea measured against the Keltner channel."
caveats = [
  "Twenty sessions after a shock day the bands snap shut as the shock leaves the window, and the percentile can print 0.05 on a name that just had its biggest day of the year; a genuine squeeze has a flat chart behind it. Check rollup.price_moves@v1.one_day_move and rollup.trend_stats@v2.tight_range_sessions.",
  "A squeeze can last weeks and the release can go either way; do not read a low percentile as a buy. Confirm the direction with feature.breakout_20d or rollup.volume@v1.up_volume_share_20d once it moves.",
  "A pending takeover pins the price, so the bands stay the tightest in the year until the deal closes. See the 'pending takeover' situation.",
  "Null when fewer than 240 of the 252 sessions before today have a bandwidth (a young listing or a name with gaps), or today's is unknown.",
]
sources = [
  "Bollinger (2001), Bollinger on Bollinger Bands: 'The Squeeze' (BandWidth at a six-month low)",
  "Minervini (2013), Trade Like a Stock Market Wizard: volatility contraction before breakouts",
]
[[field.use]]
for = "a squeeze (volatility contraction)"
op = "lte"
value = 0.10
mode = "soft"
tolerance = 0.05
note = "pair with feature.trend_state eq UPTREND for a bullish setup; the squeeze itself has no direction"
[[field.use]]
for = "a volatile month (avoid for mean reversion)"
op = "gte"
value = 0.90
mode = "soft"
tolerance = 0.05
note = "a filter for strategies that need a calm name; for 'wide bands today' use feature.bb_width"

[[field]]
name = "feature.bb_squeeze"
theme = "volatility"
reads = "True when both Bollinger bands sit inside the Keltner channel: the dispersion of closes has fallen below the name's own daily range, the compression Carter's TTM squeeze is built on. It is a state, not a signal: the release (the first session the bands move back outside the channel) is the event, and its direction comes from the price. It usually coincides with rollup.bands@v2.bb_width_pctile_252d under about 0.15 but needs no history, so it works on young listings."
caveats = [
  "With a Keltner multiplier of 2 ATR the squeeze fires less often than Carter's 1.5; a name that is 'almost' squeezed shows in rollup.bands@v2.bb_width_pctile_252d.",
  "A squeeze lasts from a few sessions to months; screening on it alone finds names going nowhere. Pair with feature.trend_state or feature.volume_dry_up to find the ones building a base.",
  "A pending takeover squeezes forever (no range, no dispersion); see the 'pending takeover' situation.",
  "Null when the bands or the channel are unknown (fewer than 20 consecutive bars) and the known side does not already say false.",
]
sources = [
  "Carter (2005), Mastering the Trade: the TTM squeeze",
  "TTM Squeeze, StockCharts: https://school.stockcharts.com/doku.php?id=technical_indicators:ttm_squeeze",
]
[[field.use]]
for = "a squeeze setup"
op = "eq"
value = true
mode = "hard"
note = "with feature.trend_state eq UPTREND (bullish) or rollup.volume@v1.up_volume_share_20d gte 0.55 for the direction"

[[field]]
name = "rollup.trend_stats@v2.ret_z_20d"
theme = "volatility"
reads = "Today's close-to-close return in units of the name's normal daily move: the return divided by the standard deviation of the 20 daily returns before it. Low to high: within -1 to +1 is an ordinary day, beyond 2 a notable one (about one day in twenty by chance), beyond 3 an event (earnings, news, an index change, a capitulation), beyond 5 almost always a gap on news. The sign is the direction; rollup.volume@v1.volume_z_20d is the same measure for volume."
caveats = [
  "The base is the 20 sessions before today, so the day after a shock the base is wide and a second large move reads small; the day after that the shock is in the base for 19 more sessions. Check rollup.price_moves@v1.one_day_move for the largest recent day.",
  "An earnings day is an outsized day by nature; check rollup.earnings@v1.last_earnings_date before reading a 3-sigma move as news.",
  "A thin name with a half-cent daily move has a tiny base, so an ordinary tick prints as sigmas; gate on rollup.price_stats@v2.adv_usd_20d.",
  "Null after a gap in the last 22 sessions, a shorter history, or when the 20 base returns were all equal (zero deviation).",
]
sources = [
  "Standard score, Wikipedia: https://en.wikipedia.org/wiki/Standard_score",
  "Event-day detection by standardised returns (de Bondt and Thaler style event studies): https://en.wikipedia.org/wiki/Event_study",
]
[[field.use]]
for = "an outsized up day"
op = "gte"
value = 3.0
mode = "soft"
tolerance = 0.5
note = "confirm with rollup.volume@v1.volume_z_20d gte 2; for a down shock use lte -3"
[[field.use]]
for = "an ordinary day (no event today)"
op = "between"
value = [-2.0, 2.0]
mode = "hard"
note = "a filter for setups that need a quiet entry day"

[[field]]
name = "rollup.trend_stats@v2.tight_range_sessions"
theme = "volatility"
reads = "How many consecutive sessions, ending today, the 20-session high-low range has been at most 15% of the close: the age of the current base. 0 means the range is not tight today; 5 to 10 is a young base (one or two weeks); 20 and above a month-old consolidation, the kind O'Neil's flat base and Minervini's contraction patterns describe; 60 and above a long, often dull, range. It counts sessions, so the base's start is today minus the count."
caveats = [
  "15% of the close is tight for a large cap and wide for a biotech or a leveraged fund: a high-volatility name never qualifies and a utility always does. For 'tight for this name' use rollup.bands@v2.bb_width_pctile_252d, which ranks against the name's own year.",
  "A base in a downtrend is a shelf before the next leg down as often as a bottom; pair with feature.trend_state or feature.pct_vs_sma_200 for the direction it should resolve in.",
  "A pending takeover makes the tightest base there is; see the 'pending takeover' situation.",
  "Null when today's 20-session range is unknown (a gap among the last 20 sessions, or a shorter history).",
]
sources = [
  "O'Neil (2009), How to Make Money in Stocks: flat bases (at least five weeks, under 15% deep)",
  "Minervini (2013), Trade Like a Stock Market Wizard: the volatility contraction pattern",
]
[[field.use]]
for = "an established base"
op = "gte"
value = 20
mode = "soft"
tolerance = 5
note = "with feature.trend_state eq UPTREND for a base in a trend; feature.breakout_20d then marks the exit from it"
[[field.use]]
for = "not in a base (already moving)"
op = "eq"
value = 0
mode = "hard"
note = "a filter for momentum entries that want the move under way"
