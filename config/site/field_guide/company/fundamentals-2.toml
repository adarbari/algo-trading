# Continues fundamentals.toml: the same keys, the same theme; see its header.

[[field]]
name = "rollup.financials@v3.qtr_as_of"
theme = "fundamentals"
reads = "The end date of the latest reported quarter that rollup.financials@v3.revenue_qtr and rollup.financials@v3.eps_diluted_qtr describe. Up to about four months before the session; the same date for every non-null quarter column of the row."
caveats = [
  "Not the date it became public: that is later. A session reads only what SEC had accepted by its close. A filing accepted at or after 16:00 New York time counts from the next session.",
  "Null when no quarter can be formed or the quarter is older than 480 days.",
]
sources = ["SEC EDGAR company facts (docs/data/vendors.md)"]
[[field.use]]
for = "a latest quarter is known"
op = "not_null"
mode = "hard"

[[field]]
name = "rollup.fundamentals@v5.shares_outstanding_year_ago"
theme = "fundamentals"
reads = "The company's share count a year earlier: the count of the same kind (cover page or weighted average) whose period ended 9 to 15 months before rollup.fundamentals@v5.shares_as_of, the one closest to a year, split-adjusted to the session. The base of feature.shares_change_yoy."
caveats = [
  "Null for a recent filer, and for a company that began tagging the cover page less than a year ago (no cover count a year back): the weighted average is not substituted, as the two differ by definition.",
  "A weighted average lags: it is the average over its period, not the count at its end.",
]
sources = ["SEC EDGAR company facts (docs/data/vendors.md)"]
[[field.use]]
for = "a year-over-year share change is defined"
op = "gt"
value = 0
mode = "hard"

[[field]]
name = "rollup.financials@v3.financials_status"
theme = "fundamentals"
reads = "Whether the company's revenue, net income and earnings per share each have a trailing twelve month figure. OK: all three do. PARTIAL: some do, so a ratio built on a missing one is blank. NO_TTM: facts are filed but no figure can be formed, a recent filer without four quarters or a year. NO_FACTS: nothing is filed, as for funds and foreign filers that do not report in dollars. STALE: the first figure ended more than 480 days before the session; the values are shown but old."
caveats = [
  "OK says the figures exist, not that they are recent. A name stays OK for months after its period ended, and a company between two reports is not stale.",
  "STALE is checked before PARTIAL and OK, so a late filer with all three figures reads STALE. The price to sales ratio, feature.ps_ratio, is blank for it. The price to earnings ratio, feature.pe_ratio, is blank when only the earnings figure is old.",
  "OK does not make feature.pe_ratio defined. It is also blank for a loss and for an ADR, which rollup.financials@v3.is_adr marks.",
]
sources = ["SEC EDGAR company facts (docs/data/vendors.md)"]
[[field.use]]
for = "complete, current financials"
op = "eq"
value = "OK"
mode = "hard"
[[field.use]]
for = "leave out stale or missing financials"
op = "in"
value = ["OK", "PARTIAL"]
mode = "hard"

[[field]]
name = "rollup.analyst_estimates@v2.fy1_period_end"
theme = "fundamentals"
reads = "The fiscal year end of the first estimate year: the first year the vendor lists after the last annual report we know. It is the current year, not yet reported, so a December filer reads 2026-12-31 until its 10-K is public."
caveats = [
  "At the fiscal year roll FY1 moves when the annual report becomes public, so a ratio over FY1 jumps once. That is a change of year, not of the estimate: check rollup.analyst_estimates@v2.fy1_period_end.",
  "A 52 or 53 week year can differ from the vendor's date by a few days; years ending within 60 days of the last report count as that report.",
  "Null with estimates_status NOT_COVERED or NOT_FETCHED reads as not covered by our analyst data. The free vendor plan covers few names, and the nightly rotation has not asked every name yet.",
  "Null with estimates_status STALE: the newest snapshot is over 21 days old, so no estimate is served. rollup.analyst_estimates@v2.estimates_age_days says how old it is.",
]
sources = [
  "Financial Modeling Prep analyst estimates and price-target consensus, stored nightly in analyst/estimate_snapshots (docs/adr/0068-analyst-data-vendors.md)",
]
[[field.use]]
for = "estimates for the current year exist"
op = "not_null"
mode = "hard"
note = "a building block: check the year before using an estimate"

