# Continues statements.toml: the same keys, the same theme; see its header.

[[field]]
name = "rollup.growth_history@v2.revenue_ttm_5y_ago"
theme = "statements"
reads = "Revenue over the trailing twelve months that ended about five years before the newest one, in dollars. It is the four consecutive quarters, else the fiscal year, ending within 40 days of that date. The base of feature.revenue_cagr_5y."
caveats = [
  "Null for a company with less than five years of filed history and for a gap in it. A missing quarter gives null, never a shorter sum.",
  "Restatements and acquisitions are as filed: the figure is the one public at the session, not a like-for-like base. A merged company can show growth that no customer ever bought.",
  "Lags like every TTM: it ends at the last filed quarter, up to four months before the session. A restatement filed later changes the figure only from its filing date.",
  "Null for funds, foreign filers that do not report in USD and companies without the filed history. A hard criterion drops them all.",
]
sources = ["SEC EDGAR company facts, the statement lines of instruments/statements (docs/adr/0067-sec-financial-statements-table.md)"]
[[field.use]]
for = "five years of revenue history exist"
op = "not_null"
mode = "hard"
note = "mostly a building block for feature.revenue_cagr_5y; a hard criterion drops every company younger than five years"

[[field]]
name = "rollup.growth_history@v2.eps_diluted_ttm_3y_ago"
theme = "statements"
reads = "Diluted EPS over the trailing twelve months that ended about three years before the newest one, in dollars per share, split-adjusted to the session. The base of feature.eps_cagr_3y; negative when the company then lost money."
caveats = [
  "Split-adjusted by filing date like rollup.financials@v3.eps_diluted_ttm, so a split in between is not read as a fall. Quarterly EPS is not additive across share count changes, so the sum is the usual approximation.",
  "A loss or a zero then gives no growth rate: feature.eps_cagr_3y is null, not negative. Check the revenue rate instead.",
  "Null for a company with less than three years of filed history and for a gap in it. Companies of one CIK share the company figure.",
  "Lags like every TTM: it ends at the last filed quarter, up to four months before the session. A restatement filed later changes the figure only from its filing date.",
  "Null for funds, foreign filers that do not report in USD and companies without the filed history. A hard criterion drops them all.",
]
sources = ["SEC EDGAR company facts, the statement lines of instruments/statements (docs/adr/0067-sec-financial-statements-table.md)"]
[[field.use]]
for = "earned money three years ago"
op = "gt"
value = 0
mode = "hard"
note = "mostly a building block for feature.eps_cagr_3y"

[[field]]
name = "rollup.growth_history@v2.eps_diluted_ttm_5y_ago"
theme = "statements"
reads = "Diluted EPS over the trailing twelve months that ended about five years before the newest one, in dollars per share, split-adjusted to the session. The base of feature.eps_cagr_5y; negative when the company then lost money."
caveats = [
  "Split-adjusted by filing date like rollup.financials@v3.eps_diluted_ttm, so a split in between is not read as a fall. Quarterly EPS is not additive across share count changes, so the sum is the usual approximation.",
  "A loss or a zero then gives no growth rate: feature.eps_cagr_5y is null, not negative. Check the revenue rate instead.",
  "Null for a company with less than five years of filed history and for a gap in it. Companies of one CIK share the company figure.",
  "Lags like every TTM: it ends at the last filed quarter, up to four months before the session. A restatement filed later changes the figure only from its filing date.",
  "Null for funds, foreign filers that do not report in USD and companies without the filed history. A hard criterion drops them all.",
]
sources = ["SEC EDGAR company facts, the statement lines of instruments/statements (docs/adr/0067-sec-financial-statements-table.md)"]
[[field.use]]
for = "earned money five years ago"
op = "gt"
value = 0
mode = "hard"
note = "mostly a building block for feature.eps_cagr_5y"

[[field]]
name = "rollup.growth_history@v2.gh_status"
theme = "statements"
reads = "Whether the multi-year history of the name can be trusted as a set. OK: revenue and EPS TTMs end on the same period and all four values are known. PARTIAL: some are missing, or the two end on different periods. NO_TTM: facts are filed but neither has a TTM. NO_FACTS: no revenue or EPS fact is filed. STALE: the newest TTM ended more than 480 days before the session; values are shown but old."
caveats = [
  "PARTIAL is normal for a company under five years old, and for a filer without an EPS line: read the single column you need instead of requiring OK.",
  "STALE is checked first, so a late filer reads STALE whatever its history. A name between its quarterly and annual report is not stale.",
  "OK does not say the growth rates exist: a loss then or now makes the EPS rates null, and a zero revenue base does the same for revenue.",
]
sources = ["SEC EDGAR company facts, the statement lines of instruments/statements (docs/adr/0067-sec-financial-statements-table.md)"]
[[field.use]]
for = "a complete history"
op = "eq"
value = "OK"
mode = "hard"
[[field.use]]
for = "leave out stale filers"
op = "ne"
value = "STALE"
mode = "hard"

[[field]]
name = "feature.ebitda"
theme = "statements"
reads = "Operating income plus depreciation and amortisation over the trailing twelve months, in dollars: operating profit before the non-cash charge for old assets. Negative for an operating loss. The denominator of feature.ev_ebitda."
caveats = [
  "The operating income and D&A lines are not checked to end on the same quarter, as only operating income is a core line of is_status.",
  "Null for banks, brokers and insurers (SIC 6000 to 6411), where rollup.income_statement@v2.is_status says FINANCIAL. Their operating income, interest and debt are not those of an operating company.",
  "A filer that does not tag a line has none, and null is not zero. A filer without a D&A line has no EBITDA: check the cash flow statement in the filing.",
  "Both lines are the filer's own tags, so the sum can differ from the figure a company quotes as adjusted EBITDA. One-offs inside operating income stay in.",
  "Null when the statement it reads is STALE: its newest period ended over 480 days before the session. Old figures are shown in the rollup but never used in a ratio. Lags like every TTM: it ends at the last filed quarter, up to four months before the session. A restatement filed later changes the figure only from its filing date.",
]
sources = [
  "SEC EDGAR company facts, the statement lines of instruments/statements (docs/adr/0067-sec-financial-statements-table.md)",
  "Damodaran, Investment Valuation (3rd ed.), ch. 'Measuring Earnings' and 'Equity Value to Firm Value': the definitions behind these ratios",
]
[[field.use]]
for = "positive EBITDA"
op = "gt"
value = 0
mode = "hard"
[[field.use]]
for = "a large operating earner"
op = "gte"
value = 1000000000
mode = "soft"
tolerance = { relative = 0.3 }

[[field]]
name = "feature.gross_margin"
theme = "statements"
reads = "Gross profit over revenue for the trailing twelve months: 0.20 is a distributor or retailer, 0.40 a branded manufacturer, 0.70 and above software. The share of each sales dollar left after the direct cost of what was sold."
caveats = [
  "Null when the income statement and the revenue end on different quarters: is_ttm_as_of must equal rollup.financials@v3.ttm_as_of. The end of the gross profit line itself is not checked.",
  "Many filers do not tag GrossProfit, so a hard criterion drops them. Null is not a bad margin; check rollup.income_statement@v2.ebit_ttm for those names.",
  "Filers draw the line between cost of revenue and operating costs differently. Compare within an industry only.",
  "Gross profit and revenue are separate TTMs and can end on different quarters when the filer's tags differ in timing. Null when the statement it reads is STALE: its newest period ended over 480 days before the session. Old figures are shown in the rollup but never used in a ratio.",
]
sources = [
  "SEC EDGAR company facts, the statement lines of instruments/statements (docs/adr/0067-sec-financial-statements-table.md)",
  "Penman, Financial Statement Analysis and Security Valuation: profitability ratios and their drivers",
]
[[field.use]]
for = "a strong gross margin"
op = "gte"
value = 0.4
mode = "soft"
tolerance = 0.05
note = "compare within instrument.sector: a retailer at 0.25 is strong"

[[field]]
name = "feature.operating_margin"
theme = "statements"
reads = "Operating income (EBIT) over revenue for the trailing twelve months: 0.10 is healthy for most industries, 0.25 and above is software or a franchise, negative is an operating loss. The profit left on each sales dollar before interest and tax."
caveats = [
  "Null when the income statement and the revenue end on different quarters: rollup.income_statement@v2.is_ttm_as_of must equal rollup.financials@v3.ttm_as_of.",
  "Null for banks, brokers and insurers (SIC 6000 to 6411), where rollup.income_statement@v2.is_status says FINANCIAL. Their operating income, interest and debt are not those of an operating company.",
  "Operating income includes one-offs the filer leaves in it (impairments, restructuring, legal charges). One bad quarter can turn a sound business negative.",
  "EBIT and revenue are separate TTMs and can end on different quarters when the tags differ in timing. Null when the statement it reads is STALE: its newest period ended over 480 days before the session. Old figures are shown in the rollup but never used in a ratio.",
]
sources = [
  "SEC EDGAR company facts, the statement lines of instruments/statements (docs/adr/0067-sec-financial-statements-table.md)",
  "Penman, Financial Statement Analysis and Security Valuation: profitability ratios and their drivers",
]
[[field.use]]
for = "a profitable operation"
op = "gt"
value = 0.1
mode = "soft"
tolerance = 0.03
[[field.use]]
for = "no operating loss"
op = "gt"
value = 0
mode = "hard"

[[field]]
name = "feature.interest_cover"
theme = "statements"
reads = "Operating income over interest expense for the trailing twelve months: how many times the operating profit pays the interest. Under 2 is thin, 2 to 8 is normal, above 8 is comfortable. Negative when operating income is a loss."
caveats = [
  "The operating income and interest lines are not checked to end on the same quarter, as only operating income is a core line of is_status.",
  "Null for banks, brokers and insurers (SIC 6000 to 6411), where rollup.income_statement@v2.is_status says FINANCIAL. Their operating income, interest and debt are not those of an operating company.",
  "Null when the interest expense is zero or untagged: a company without an interest line is not shown as infinitely covered. Check the debt in the filing.",
  "Some filers net interest income against it or report it inside another line, which can flatter the cover. Null when the statement it reads is STALE: its newest period ended over 480 days before the session. Old figures are shown in the rollup but never used in a ratio.",
]
sources = [
  "SEC EDGAR company facts, the statement lines of instruments/statements (docs/adr/0067-sec-financial-statements-table.md)",
  "Damodaran, Investment Valuation (3rd ed.), ch. 'Measuring Earnings' and 'Equity Value to Firm Value': the definitions behind these ratios",
]
[[field.use]]
for = "comfortable interest cover"
op = "gte"
value = 5
mode = "soft"
tolerance = 1
note = "with feature.debt_to_equity lte 1 so a low cover is not hidden by a large debt"

[[field]]
name = "feature.roe"
theme = "statements"
reads = "Net income over the trailing twelve months against stockholders' equity at the latest balance sheet: 0.10 is average, 0.15 and above is a strong business, negative is a loss. The yearly profit earned on each dollar of book equity."
caveats = [
  "Null for negative equity, which buybacks and accumulated losses both cause, so a hard criterion drops some of the best and some of the worst names. Check feature.roic.",
  "Debt lifts it: a leveraged company shows a high ROE with the same business. Pair with feature.debt_to_equity.",
  "Net income is a TTM and equity a quarter-end balance, not an average over the year. Banks keep it: ROE is their main measure. Null when the statement it reads is STALE: its newest period ended over 480 days before the session. Old figures are shown in the rollup but never used in a ratio.",
]
sources = [
  "SEC EDGAR company facts, the statement lines of instruments/statements (docs/adr/0067-sec-financial-statements-table.md)",
  "Penman, Financial Statement Analysis and Security Valuation: profitability ratios and their drivers",
]
[[field.use]]
for = "a strong return on equity"
op = "gte"
value = 0.15
mode = "soft"
tolerance = 0.03
note = "with feature.debt_to_equity lte 1.5"

[[field]]
name = "feature.roa"
theme = "statements"
reads = "Net income over the trailing twelve months against total assets at the latest balance sheet: 0.05 is a good industrial, 0.01 is normal for a bank. The yearly profit earned on each dollar of assets, whoever financed them."
caveats = [
  "Comparable only within an industry: a bank holds assets worth ten times its equity, a software company almost none.",
  "Net income is a TTM and assets a quarter-end balance, not an average over the year. Banks keep it. Null when the statement it reads is STALE: its newest period ended over 480 days before the session. Old figures are shown in the rollup but never used in a ratio.",
  "Null for a missing assets figure and for funds and foreign filers that do not report in USD.",
]
sources = [
  "SEC EDGAR company facts, the statement lines of instruments/statements (docs/adr/0067-sec-financial-statements-table.md)",
  "Penman, Financial Statement Analysis and Security Valuation: profitability ratios and their drivers",
]
[[field.use]]
for = "a good return on assets"
op = "gte"
value = 0.05
mode = "soft"
tolerance = 0.02

[[field]]
name = "feature.roic"
theme = "statements"
reads = "Operating income after a flat 21% tax (EBIT times 0.79) over invested capital: equity plus total debt less cash. 0.08 is about the cost of capital, 0.15 and above is a strong business. The yearly return on money put into operations."
caveats = [
  "Null unless rollup.balance_sheet@v2.bs_status is OK: PARTIAL means a core line sits at an older date than the debt, and mixing dates would mislead.",
  "Null for banks, brokers and insurers (SIC 6000 to 6411), where rollup.income_statement@v2.is_status says FINANCIAL. Their operating income, interest and debt are not those of an operating company.",
  "The flat 21% tax is not the company's own rate. Invested capital leaves out operating leases, goodwill adjustments and short-term investments. Finance leases are in debt under rules d to f, and their current part under c and e. Read it as a screen, not a valuation input.",
  "Null when any of equity, debt or cash is untagged, and when cash exceeds equity plus debt. A hard criterion drops those names. Null when the statement it reads is STALE: its newest period ended over 480 days before the session. Old figures are shown in the rollup but never used in a ratio.",
]
sources = [
  "SEC EDGAR company facts, the statement lines of instruments/statements (docs/adr/0067-sec-financial-statements-table.md)",
  "Greenblatt, The Little Book That Beats the Market: return on capital as a quality screen",
  "Damodaran, Investment Valuation (3rd ed.), ch. 'Measuring Earnings' and 'Equity Value to Firm Value': the definitions behind these ratios",
]
[[field.use]]
for = "a strong return on capital"
op = "gte"
value = 0.15
mode = "soft"
tolerance = 0.03
note = "with rollup.income_statement@v2.is_status eq OK"

[[field]]
name = "feature.net_debt"
theme = "statements"
reads = "Total debt less cash and equivalents at the latest balance sheet, in dollars. Negative is a net cash position. Short-term investments are left out, so a company that keeps its cash as securities shows more net debt than it has."
caveats = [
  "Null unless rollup.balance_sheet@v2.bs_status is OK: PARTIAL means a core line sits at an older date than the debt, and mixing dates would mislead.",
  "Null when debt or cash is untagged: an untagged debt line is not zero, and rollup.balance_sheet@v2.debt_basis says NOT_TAGGED.",
  "Operating leases and pension deficits are not debt here. Finance leases are in under rules d to f, and their current part under rules c and e. Banks hold deposits as liabilities and a bank's debt is not comparable with an industrial's.",
  "Dollars, not a ratio: compare with feature.ebitda or feature.market_cap. Null when the statement it reads is STALE: its newest period ended over 480 days before the session. Old figures are shown in the rollup but never used in a ratio.",
]
sources = [
  "SEC EDGAR company facts, the statement lines of instruments/statements (docs/adr/0067-sec-financial-statements-table.md)",
  "Damodaran, Investment Valuation (3rd ed.), ch. 'Measuring Earnings' and 'Equity Value to Firm Value': the definitions behind these ratios",
]
[[field.use]]
for = "a net cash balance sheet"
op = "lt"
value = 0
mode = "hard"
note = "mostly a building block; compare it with feature.market_cap"

[[field]]
name = "feature.debt_to_equity"
theme = "statements"
reads = "Total debt over stockholders' equity at the latest balance sheet: 0.5 is 50 cents of borrowing for each dollar of book equity. Under 0.5 is conservative, above 2 is heavily borrowed for an industrial."
caveats = [
  "Null unless rollup.balance_sheet@v2.bs_status is OK: PARTIAL means a core line sits at an older date than the debt, and mixing dates would mislead.",
  "Null for negative equity, so a hard criterion drops the most indebted names. Check rollup.balance_sheet@v2.total_debt against feature.ebitda instead.",
  "Total debt is the sum of the parts of one filing and leaves out operating leases. Finance leases are in under rules d to f, and their current part under rules c and e. Banks and utilities run high ratios for good reason: compare within an industry.",
  "A company that tags no debt line is null, not debt-free. Null when the statement it reads is STALE: its newest period ended over 480 days before the session. Old figures are shown in the rollup but never used in a ratio.",
]
sources = [
  "SEC EDGAR company facts, the statement lines of instruments/statements (docs/adr/0067-sec-financial-statements-table.md)",
  "Damodaran, Investment Valuation (3rd ed.), ch. 'Measuring Earnings' and 'Equity Value to Firm Value': the definitions behind these ratios",
]
[[field.use]]
for = "conservative borrowing"
op = "lte"
value = 0.5
mode = "soft"
tolerance = 0.25
[[field.use]]
for = "not heavily borrowed"
op = "lte"
value = 2
mode = "hard"

[[field]]
name = "feature.pb_ratio"
theme = "statements"
reads = "Market cap over stockholders' equity at the latest balance sheet: 1 means the market values the company at its book. Under 1 is below book, 1 to 3 is typical, above 5 is priced for returns well above book value."
caveats = [
  "Null for negative equity. Buybacks and old losses push book equity down, so a high or missing P/B can mean an old, cash-rich company, not an expensive one.",
  "Book value leaves out brands, software and people: it means little for asset-light companies. Banks keep it, where it is the standard ratio.",
  "Market cap is the company total count times this class's close. The statements are the company's, so it is misstated when share classes trade at very different prices, and null for an ADR. Null when the statement it reads is STALE: its newest period ended over 480 days before the session. Old figures are shown in the rollup but never used in a ratio.",
]
sources = [
  "SEC EDGAR company facts, the statement lines of instruments/statements (docs/adr/0067-sec-financial-statements-table.md)",
  "Fama and French (1992), The Cross-Section of Expected Stock Returns: book-to-market and returns",
]
[[field.use]]
for = "cheap against book"
op = "lt"
value = 1.5
mode = "soft"
tolerance = 0.5
note = "with feature.roe gt 0.08 so a low price is not a poor business"

[[field]]
name = "feature.fcf"
theme = "statements"
reads = "Operating cash flow less capital expenditure over the trailing twelve months, in dollars: the cash left after the business pays to keep and grow its assets. Negative when spending exceeds cash from operations."
caveats = [
  "Null unless rollup.cash_flow@v2.cf_status is OK: PARTIAL can mean the two lines end on different periods, and subtracting one year of capex from another year of cash flow is wrong.",
  "Null for a filer that does not tag capex: free cash flow is never taken as equal to operating cash flow. rollup.cash_flow@v2.cf_status shows PARTIAL for those names.",
  "Capex covers property, plant and equipment only. Acquisitions, capitalised software and leases are other lines, so an acquisitive company can look richer than it is.",
  "Working capital swings move one year's figure: read two years. Null when the statement it reads is STALE: its newest period ended over 480 days before the session. Old figures are shown in the rollup but never used in a ratio. Lags like every TTM: it ends at the last filed quarter, up to four months before the session. A restatement filed later changes the figure only from its filing date.",
]
sources = ["SEC EDGAR company facts, the statement lines of instruments/statements (docs/adr/0067-sec-financial-statements-table.md)"]
[[field.use]]
for = "positive free cash flow"
op = "gt"
value = 0
mode = "hard"

[[field]]
name = "feature.fcf_yield"
theme = "statements"
reads = "Free cash flow over the trailing twelve months divided by market cap: 0.05 is 5 cents of free cash flow a year for each dollar of market value. Above 0.08 is cheap on cash, negative means the company burns cash."
caveats = [
  "Null unless the cash flow is OK: both lines must end on the same period.",
  "Null for a filer that does not tag capex, for a missing market cap and for an ADR. A hard criterion drops them all.",
  "Market cap is the company total count times this class's close. The statements are the company's, so it is misstated when share classes trade at very different prices, and null for an ADR.",
  "A high yield from a one-year working capital release reverses: check feature.fcf over two years. Banks' cash flow includes deposit movements, so the figure is not comparable with an industrial's.",
]
sources = [
  "SEC EDGAR company facts, the statement lines of instruments/statements (docs/adr/0067-sec-financial-statements-table.md)",
  "Damodaran, free cash flow to equity and the cash yield as a valuation screen",
]
[[field.use]]
for = "cheap on free cash flow"
op = "gte"
value = 0.06
mode = "soft"
tolerance = 0.02
note = "with feature.interest_cover gte 3 so the cash is not owed to lenders"

[[field]]
name = "feature.enterprise_value"
theme = "statements"
reads = "Market cap plus total debt less cash at the latest balance sheet, in dollars: what it would cost to buy the whole business and clear its net debt. The numerator of feature.ev_ebitda."
caveats = [
  "Null unless rollup.balance_sheet@v2.bs_status is OK: PARTIAL means a core line sits at an older date than the debt, and mixing dates would mislead.",
  "Minority interest, preferred stock, operating leases, pensions and short-term investments are not adjusted for. Finance leases are in debt under rules d to f, and their current part under c and e. The figure is approximate for companies with large ones.",
  "Null when debt or cash is untagged, for a missing market cap and for an ADR. Market cap is the company total count times this class's close. The statements are the company's, so it is misstated when share classes trade at very different prices, and null for an ADR.",
  "Banks have no meaningful enterprise value: their debt is their operating liabilities. Null when the statement it reads is STALE: its newest period ended over 480 days before the session. Old figures are shown in the rollup but never used in a ratio.",
]
sources = [
  "SEC EDGAR company facts, the statement lines of instruments/statements (docs/adr/0067-sec-financial-statements-table.md)",
  "Damodaran, Investment Valuation (3rd ed.), ch. 'Measuring Earnings' and 'Equity Value to Firm Value': the definitions behind these ratios",
]
[[field.use]]
for = "a large enterprise"
op = "gte"
value = 10000000000
mode = "soft"
tolerance = { relative = 0.3 }

[[field]]
name = "feature.ev_ebitda"
theme = "statements"
reads = "Enterprise value over EBITDA for the trailing twelve months: 10 means the business is priced at ten years of its operating earnings before interest, tax and depreciation. Under 8 is cheap, above 20 is priced for growth."
caveats = [
  "Null when EBITDA is not positive, so loss makers are not shown cheap, and for banks, where the EBIT family is null by design. A hard 'lt 8' silently drops them.",
  "Capital-intensive industries run low multiples for good reason: compare within instrument.sector. Debt, leases and one-offs are as the filer tagged them.",
  "Null when any input is null, and for an ADR. Null when the statement it reads is STALE: its newest period ended over 480 days before the session. Old figures are shown in the rollup but never used in a ratio.",
]
sources = [
  "SEC EDGAR company facts, the statement lines of instruments/statements (docs/adr/0067-sec-financial-statements-table.md)",
  "Damodaran, Investment Valuation (3rd ed.), ch. 'Measuring Earnings' and 'Equity Value to Firm Value': the definitions behind these ratios",
  "Loughran and Wellman (2011), New Evidence on the Relation between the Enterprise Multiple and Average Stock Returns",
]
[[field.use]]
for = "cheap on enterprise value"
op = "lt"
value = 8
mode = "soft"
tolerance = 2
note = "with feature.operating_margin gt 0.05 so a low multiple is not a thin margin"

[[field]]
name = "feature.revenue_cagr_3y"
theme = "statements"
reads = "Compound annual growth of revenue over three years: the TTM against the TTM about three years earlier, as a yearly rate. 0.10 is 10% a year, 0.20 and above is a fast grower, negative is a shrinking business."
caveats = [
  "Null when the base 3 years ago is zero or negative, or the current one is, and for a company with under three years of filed history.",
  "Acquisitions inflate reported growth and divestitures deflate it; the figure is the reported one, not organic. A jump after a deal is not demand.",
  "The two ends are TTMs, so a seasonal company is compared like with like, but a cycle peak or trough end point can mislead. Check feature.revenue_growth_yoy for the recent pace.",
  "Null when the statement it reads is STALE: its newest period ended over 480 days before the session. Old figures are shown in the rollup but never used in a ratio.",
]
sources = [
  "SEC EDGAR company facts, the statement lines of instruments/statements (docs/adr/0067-sec-financial-statements-table.md)",
  "CFA Institute curriculum, compound annual growth rate as the standard multi-year growth measure",
]
[[field.use]]
for = "steady growth over three years"
op = "gte"
value = 0.1
mode = "soft"
tolerance = 0.03
note = "with feature.revenue_growth_yoy gt 0 so the old growth has not stopped"

