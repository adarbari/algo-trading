[[field]]
name = "rollup.cohort_pct_options@v1.iv_rank_252d_pct_universe"
theme = "instrument gates"
reads = "Where the 252-session IV rank ranks among the universe's stocks: 0 the calmest options, 1 the richest. It shows which names have expensive options next to the market, where the raw IV rank only says where a name sits against its own year."
caveats = [
  "Only STOCKS of the universe snapshot are ranked, so an ETF, fund or trust is null. Null too when fewer than 200 stocks have a known value.",
  "It ranks our own IV rank (from our open IV30), never the blended rank that may carry an IBKR value, so it stays open to every viewer.",
  "A name with too little IV history, or a thin chain, has no IV rank and is not counted in its cohort.",
]
sources = ["Natenberg (1994), Option Volatility and Pricing: volatility rank"]
[[field.use]]
for = "rich options among the universe's stocks"
op = "gte"
value = 0.8
mode = "soft"
tolerance = 0.05
note = "with the raw figure so the size is read too"

