# Continues instrument.toml: the same keys, the same theme; see its header.

[[field]]
name = "rollup.skew@v1.skew_status"
theme = "implied volatility"
reads = "Whether the 30-day skew has a value: OK (two expiries around 30 days), SINGLE_EXPIRY (one usable expiry, its vols unchanged, still a value), or the first failing step: NO_SPOT, NO_CHAIN, NO_EXPIRY (none 7 to 90 days out), NO_ATM (no ATM vol from the two-sided, tight quotes) or NO_WING (an ATM vol, but the 25-delta strikes are not bracketed on a side)."
caveats = [
  "NO_ATM and NO_WING are thin chains: skew is computed only from quotes within 35% spread, never guessed, so a name with a sparse chain reads null rather than wrong.",
]
sources = ["Site convention (features/rollups/positioning/skew.py)"]
[[field.use]]
for = "a priced skew"
op = "eq"
value = "OK"
mode = "soft"
tolerance = 0
note = "the near miss is SINGLE_EXPIRY, one expiry's skew rather than the 30-day one"

[[field]]
name = "rollup.skew@v1.skew"
theme = "implied volatility"
reads = "The normalised 25-delta skew at 30 days: (put vol at delta -0.25 minus call vol at +0.25) over the ATM vol. Positive means puts are richer than calls, the normal shape for stocks: about 0.10 to 0.20 is ordinary, above about 0.25 puts are rich (downside protection is expensive: collar and put-spread sellers like it, a put buyer pays up), near 0 flat, negative call-rich (a takeover, a squeeze, a meme name where the upside is what is bid). Dividing by ATM vol makes a 20-vol and an 80-vol name comparable."
caveats = [
  "The level of a skew is partly structural: index ETFs sit high, single names lower, and a name's own history matters more than the cross-section; rollup.skew_history@v1.skew_rank_252d says where it is for the name, but is null for the first 60 sessions of stored chains.",
  "Our delta at each contract's own IV, from after-close mids of tight quotes; one stale wing quote moves it. Read rollup.skew@v1.skew_status and compare rollup.skew@v1.ne_skew, which should agree in sign.",
  "An earnings report inside 30 days lifts the ATM vol and the wings differently, so the ratio can move with no change in sentiment; check rollup.earnings@v1.days_to_earnings.",
  "Null when the status is not OK or SINGLE_EXPIRY.",
]
sources = [
  "Risk reversal and skew: https://www.investopedia.com/terms/r/risk-reversal.asp",
  "Normalising the risk reversal by ATM vol: Sinclair (2013), Volatility Trading",
]
[[field.use]]
for = "puts rich (a steep put skew)"
op = "gte"
value = 0.25
mode = "soft"
tolerance = 0.05
note = "with rollup.skew@v1.skew_status eq OK; prefer rollup.skew_history@v1.skew_rank_252d gte 0.8 once a rank exists"
[[field.use]]
for = "call-rich skew (calls priced above puts)"
op = "lte"
value = -0.05
mode = "soft"
tolerance = 0.05
note = "rare; check for a pending takeover or a squeeze (rollup.price_moves@v1.one_day_move)"

[[field]]
name = "rollup.skew@v1.iv_25p"
theme = "implied volatility"
reads = "The put vol at our delta -0.25 interpolated to 30 days, as a fraction: 0.34 is 34%. The price of downside protection one quarter of the way out of the money, in vol terms; compared with rollup.skew@v1.iv_atm it is the put wing's premium."
caveats = [
  "Linear in delta between the two quotes around -0.25, in total variance across expiries; no extrapolation, so a chain that does not reach a 25-delta put is null (NO_WING), not clipped.",
  "Null when the skew status is not OK or SINGLE_EXPIRY.",
]
sources = ["Site convention (docs/data/positioning.md OP3)"]
[[field.use]]
for = "expensive downside puts"
op = "gte"
value = 0.40
mode = "soft"
tolerance = 0.05
note = "an absolute level; prefer feature.skew_rr25 or rollup.skew@v1.skew for the shape"

[[field]]
name = "rollup.skew@v1.iv_25c"
theme = "implied volatility"
reads = "The call vol at our delta +0.25 interpolated to 30 days, as a fraction. The price of upside, one quarter of the way out of the money; below rollup.skew@v1.iv_25p on a normal stock, above it when calls are bid."
caveats = [
  "Same construction and nulls as rollup.skew@v1.iv_25p.",
]
sources = ["Site convention (docs/data/positioning.md OP3)"]
[[field.use]]
for = "calls bid above the ATM vol"
op = "gte"
value = 0.40
mode = "soft"
tolerance = 0.05
note = "with rollup.skew@v1.skew lte 0 for a call-rich skew"

[[field]]
name = "rollup.skew@v1.iv_atm"
theme = "implied volatility"
reads = "The at-the-money vol the skew is measured against: the mean of the call vol at delta +0.50 and the put vol at -0.50, interpolated to 30 days, as a fraction. Close to rollup.iv30@v1.iv30 (another method, the forward-strike average) and within a few points of it on a liquid name."
caveats = [
  "Both a +0.50 call and a -0.50 put must bracket, otherwise the status is NO_ATM and the vol is null; prefer rollup.iv30@v1.iv30 for a plain 30-day ATM vol.",
]
sources = ["Site convention (docs/data/positioning.md OP3)"]
[[field.use]]
for = "a name that is volatile at the money"
op = "gte"
value = 0.40
mode = "soft"
tolerance = 0.05

[[field]]
name = "rollup.skew@v1.ne_skew"
theme = "implied volatility"
reads = "The same normalised 25-delta skew at the next expiry (the first listed one at least one day out, weeklies included), with no interpolation. The skew of the nearest event or weekly pin rather than of the month; compare it with rollup.skew@v1.skew: a next-expiry skew far above the 30-day one means the near-term downside is what is bid."
caveats = [
  "Very short expiries have 25-delta strikes close to the money and noisy vols: read rollup.skew@v1.ne_dte and ignore it under about 7 days.",
  "Null when the next expiry has no ATM vol or no 25-delta put and call among its tight quotes, whatever the 30-day status is.",
]
sources = ["Site convention (docs/data/positioning.md OP3)"]
[[field.use]]
for = "near-term puts rich"
op = "gte"
value = 0.25
mode = "soft"
tolerance = 0.05
note = "with rollup.skew@v1.ne_dte gte 7 so a pinned weekly is not read as a view"

[[field]]
name = "rollup.skew@v1.ne_dte"
theme = "implied volatility"
reads = "Calendar days from the session to the next expiry, the one rollup.skew@v1.ne_skew reads: 1 to 7 on a name with weeklies, up to a month on a monthly-only chain."
caveats = [
  "Weekly and daily expiries make it small on liquid names; a screen on ne_skew should floor it.",
]
sources = ["Site convention (docs/data/positioning.md OP3)"]
[[field.use]]
for = "a next expiry far enough out to read"
op = "gte"
value = 7
mode = "soft"
tolerance = 2

[[field]]
name = "feature.skew_rr25"
theme = "implied volatility"
reads = "The raw 25-delta risk reversal at 30 days: put vol minus call vol in vol points as a fraction (0.06 is six points). Positive: puts richer than calls. What a collar or a put spread is quoted in; rollup.skew@v1.skew divides it by the ATM vol to compare names of different vol level."
caveats = [
  "A high-vol name has a large raw reversal at an ordinary skew: compare names through rollup.skew@v1.skew, one name over time through either.",
  "Null when the skew status is not OK or SINGLE_EXPIRY.",
]
sources = ["Risk reversal: https://www.investopedia.com/terms/r/risk-reversal.asp"]
[[field.use]]
for = "puts at least six vol points over calls"
op = "gte"
value = 0.06
mode = "soft"
tolerance = 0.01
note = "with rollup.skew@v1.skew gte 0.2 so a high-vol name is not read as skewed"

[[field]]
name = "rollup.skew_history@v1.skew_rank_252d"
theme = "implied volatility"
reads = "Skew rank, 0 to 1: where today's 30-day skew sits between the year's lowest and highest. Above 0.8 is a stretched put premium for the name (puts are as rich as they have been this year), below 0.2 the flattest. The year the rank needs is built from stored chains, which start on 2026-10-02: every name reads null until it has 60 sessions with a skew (about the end of 2026), and a full year around October 2027."
caveats = [
  "One spike sets the year's maximum and squashes later readings, as for IV rank; rollup.skew_history@v1.skew_percentile_252d is the steadier cross-check (one extreme day moves it less).",
  "A short window is a short sample: PROVISIONAL (rollup.skew_history@v1.skew_rank_status) means under a year of skews, so a rank near 1 can be an ordinary day.",
  "Null while skew_rank_status is UNKNOWN, with no skew today, or when every skew in the window is equal.",
]
sources = ["https://flashalpha.com/articles/iv-rank-vs-iv-percentile-difference-which-matters (the same rank construction)"]
[[field.use]]
for = "a stretched put premium for the name"
op = "gte"
value = 0.8
mode = "soft"
tolerance = 0.1
note = "with rollup.skew_history@v1.skew_rank_status in PROVISIONAL or FULL"

[[field]]
name = "rollup.skew_history@v1.skew_percentile_252d"
theme = "implied volatility"
reads = "The share of the last 252 sessions' skews below today's, 0 to 1. The steadier companion of rollup.skew_history@v1.skew_rank_252d: one extreme day does not distort it."
caveats = [
  "Null while the rank status is UNKNOWN (fewer than 60 sessions with a skew), with no skew today, or without an earlier skew.",
]
sources = ["https://flashalpha.com/articles/iv-rank-vs-iv-percentile-difference-which-matters"]
[[field.use]]
for = "puts richer than on most days of the year"
op = "gte"
value = 0.8
mode = "soft"
tolerance = 0.1

[[field]]
name = "rollup.skew_history@v1.history_days"
theme = "implied volatility"
reads = "Sessions of the 252-session window with a 30-day skew, today included: 60 is the floor for a rank, 252 a full year. Chains are stored from 2026-10-02, so counts are short for every name until a year has passed."
caveats = [
  "A session with no skew (no chain, or a chain with no 25-delta wing) is a gap, not filled.",
]
sources = ["Site convention (docs/data/positioning.md OP3)"]
[[field.use]]
for = "enough history for a skew rank"
op = "gte"
value = 60
mode = "hard"

[[field]]
name = "rollup.skew_history@v1.skew_rank_status"
theme = "implied volatility"
reads = "How complete the skew history is for the rank: UNKNOWN below 60 sessions with a skew (no rank), PROVISIONAL below 252, FULL from 252. Every name is UNKNOWN until about the end of 2026."
caveats = [
  "PROVISIONAL over a short window makes an ordinary skew rank near 1; read rollup.skew@v1.skew with it.",
]
sources = ["Site convention (docs/data/positioning.md OP3)"]
[[field.use]]
for = "a rank over a full year"
op = "eq"
value = "FULL"
mode = "soft"
tolerance = 0
note = "the near miss is PROVISIONAL"

[[field]]
name = "rollup.iv_term@v1.iv_term_status"
theme = "implied volatility"
reads = "Whether the term points have values: OK (both), or the first failing step: NO_SPOT, NO_CHAIN, NO_NEXT (no ATM vol at the next expiry) or NO_90D (no pair of expiries 30 to 180 days out around 90 days with ATM vols). The side that exists keeps its value."
caveats = [
  "A single listed expiry in the 30 to 180 day window is not a 90-day vol: NO_90D, where rollup.iv30@v1.iv30_status would say SINGLE_EXPIRY.",
]
sources = ["Site convention (features/rollups/positioning/iv_term.py)"]
[[field.use]]
for = "both term points priced"
op = "eq"
value = "OK"
mode = "hard"

[[field]]
name = "rollup.iv_term@v1.iv_next"
theme = "implied volatility"
reads = "The at-the-money vol at the next expiry (the first listed one at least one day out, weeklies included), as a fraction: iv30's method on that single expiry. Above rollup.iv30@v1.iv30 when an event sits in the nearest expiry; feature.term_ratio_next_30 is that comparison."
caveats = [
  "A few days to expiry make it noisy, and pin risk bids the at-the-money options; read rollup.skew@v1.ne_dte for how many days out it is.",
  "Null when the status is NO_SPOT, NO_CHAIN or NO_NEXT.",
]
sources = ["Site convention (docs/data/positioning.md)"]
[[field.use]]
for = "a high near-term vol"
op = "gte"
value = 0.60
mode = "soft"
tolerance = 0.1
note = "with feature.term_ratio_next_30 gte 1.3 to know it is an event, not the name's level"

[[field]]
name = "rollup.iv_term@v1.iv_90d"
theme = "implied volatility"
reads = "Our constant 90-day at-the-money vol as a fraction: the two expiries around 90 days among 30 to 180 days out (standard monthlies first), each priced as in rollup.iv30@v1.iv30, interpolated in total variance. The back of the term structure: the vol the market charges for a quarter."
caveats = [
  "Needs both expiries of the pair with ATM vols: a thin back month makes it null (NO_90D) and the term ratio with it.",
  "A name's back vol sits near its long-run level; a front vol far above it is stress or an event, far below it is calm.",
]
sources = ["Site convention (docs/data/positioning.md)"]
[[field.use]]
for = "a high long-dated vol"
op = "gte"
value = 0.40
mode = "soft"
tolerance = 0.05

[[field]]
name = "feature.term_ratio_30_90"
theme = "implied volatility"
reads = "The front of the vol term structure over the back: our 30-day ATM vol over the 90-day one. 1 is flat; above 1 is backwardation (the front richer than the back: an event or stress is priced near, calendars sell the front), above about 1.1 a clear one; below 1 is contango, the normal shape, below about 0.9 steep (calendars buy the front cheaply)."
caveats = [
  "An earnings date inside 30 days (rollup.earnings@v1.days_to_earnings) lifts the 30-day vol and the ratio with it, with no stress in the market; feature.term_ratio_next_30 isolates the front expiry.",
  "The two vols come from different expiries and spot rules (the 30-day one reads the feed's price, the 90-day one the close), a small error against a 0.1 threshold.",
  "Null when either vol is null; a single usable expiry is not a 90-day vol.",
]
sources = ["Term structure of implied volatility and calendar spreads: Natenberg, Option Volatility and Pricing"]
[[field.use]]
for = "backwardation (the front richer than the back)"
op = "gte"
value = 1.1
mode = "soft"
tolerance = 0.05
note = "with rollup.earnings@v1.days_to_earnings gt 30 to rule out a report"
[[field.use]]
for = "steep contango (the front cheap against the back)"
op = "lte"
value = 0.9
mode = "soft"
tolerance = 0.05

[[field]]
name = "feature.term_ratio_next_30"
theme = "implied volatility"
reads = "The front-expiry premium: the ATM vol at the next expiry over the 30-day vol. 1 is no premium; above 1.2 an event (earnings, a ruling) is priced into the nearest expiry, above about 1.3 clearly so. After the event the premium drops out."
caveats = [
  "A next expiry a few days out is noisy and pin-bid: read rollup.skew@v1.ne_dte and floor it near 7 days.",
  "A name with weeklies has a different next expiry from one with monthlies only, so ratios of the two are not like for like.",
  "Null when either vol is null.",
]
sources = ["Event vol in the front expiry: https://www.tastylive.com/concepts-strategies/implied-volatility-earnings"]
[[field.use]]
for = "an event priced into the nearest expiry"
op = "gte"
value = 1.3
mode = "soft"
tolerance = 0.1
note = "with rollup.skew@v1.ne_dte gte 7"

# The session's bar shape and the named candles (candle@v1, and the inside_day_breakout and
# strong_close expressions in config/site/features/technical/swing.toml): what the day's open, high, low
# and close say on their own. A single candle means little without where it formed. Filed under
# "volume" because the momentum and price-level pages are at their 1000-line cap.

# Fund NAV and flows (cef_nav@v1, etf_flows@v1, edge build E4). Filed under this theme because the
# fundamentals page is at its length cap.

[[field]]
name = "rollup.cef_nav@v1.cef_discount_to_nav"
theme = "instrument gates"
reads = "How far a closed-end fund's price sits from the value of the assets behind it. It is the close on the NAV's own date over that NAV, minus 1. -0.10 is a 10% discount, 0 is level, 0.10 a 10% premium."
caveats = [
  "Part of a discount is fair: fees, leverage and a high payout all widen it. A fund that is always 10% down is not cheap against itself; read rollup.cef_nav@v1.cef_discount_zscore.",
  "The NAV is the issuer's own, struck once a day. A fund holding foreign or thinly traded assets is priced against a stale NAV, and its discount moves with the next day's gap.",
  "Null when the latest NAV is more than five sessions old, so a fund whose NAV stopped is not read as current. A hard 'lte' drops it.",
  "The NAV is put in the closes' split terms from the stored splits, the same table the bars are adjusted with. A split the issuer made but the vendor never reported shifts both alike, so the discount holds.",
]
sources = ["Lee, Shleifer and Thaler (1991), Investor Sentiment and the Closed-End Fund Puzzle, Journal of Finance"]
[[field.use]]
for = "a wide discount"
op = "lte"
value = -0.10
mode = "hard"
note = "the closed-end fund discount edge reads the widest first"
[[field.use]]
for = "a premium"
op = "gte"
value = 0.10
mode = "hard"
note = "the distribution trap filter asks a premium of at least 10%"

[[field]]
name = "rollup.cef_nav@v1.cef_discount_zscore"
theme = "instrument gates"
reads = "How unusual a closed-end fund's discount is against its own year. It is today's discount minus its mean over the last 252 sessions, over their standard deviation. -2 is a discount two standard deviations wider than the fund's norm."
caveats = [
  "A wide z-score on a fund that cut its payout or changed manager is a new level, not a stretch that will close. Read the fund's distribution history before acting.",
  "Null with fewer than 120 discounts in the year, so a young fund drops out. A hard 'lte' drops it.",
  "It shares the NAV caveats of rollup.cef_nav@v1.cef_discount_to_nav: stale NAVs and splits both move it.",
]
sources = ["Patro, Piccotti and Wu, Closed-end fund discounts (Quantpedia summary of the strategy)"]
[[field.use]]
for = "a discount wider than the fund's own year"
op = "lte"
value = -1.5
mode = "hard"

[[field]]
name = "rollup.etf_flows@v1.etf_shares_chg_21d"
theme = "instrument gates"
reads = "How many more or fewer shares an iShares fund has than 21 sessions ago. It is the latest count over the earlier one, minus 1. 0.10 means 10% net creation, money coming in. -0.10 means 10% net redemption."
caveats = [
  "It holds for iShares funds only. SPDR, Vanguard and other issuers' funds have no count, so a screen on it silently leaves them out.",
  "Null until the fund has a count from a month earlier, and when the latest count is more than seven days old. The history starts on 2026-10-17.",
  "A share change is not a price effect: a fund can create shares because its price rose. Read it beside the fund's own return.",
]
sources = ["Brown, Davies and Ringgenberg (2021), ETF Arbitrage, Non-Fundamental Demand, and Return Predictability, Review of Finance"]
[[field.use]]
for = "heavy net creation"
op = "gte"
value = 0.05
mode = "hard"
note = "the edge shorts the heaviest creations, ranked by this field"
[[field.use]]
for = "heavy net redemption"
op = "lte"
value = -0.05
mode = "hard"

[[situation]]
name = "pending takeover"
signs = "One day up 15% to 40% (rollup.price_moves@v1.one_day_move), then a dead tape: feature.atr_pct under 0.005, rollup.price_stats@v2.hv20 under 0.10, feature.range_20d_pct tiny, rollup.iv_history@v2.iv30 collapsed and feature.iv_rank near 0, the close a few percent under a round number (the offer) for weeks. The merger-arbitrage spread of 2% to 3% that then shrinks toward 0 is all the price will do until the deal closes or breaks."
affects = ["rollup.momentum@v1.rsi_14", "rollup.price_stats@v2.ret_20d", "rollup.price_stats@v2.ret_60d", "feature.pct_from_high_52w", "feature.near_52w", "feature.trend_state", "feature.breakout_20d", "feature.pullback_to_sma20", "feature.iv_rank", "feature.iv_percentile", "feature.iv_hv_ratio", "feature.atr_pct", "feature.range_20d_pct", "rollup.price_stats@v2.hv20"]
do = "The catalogue has no deal flag yet (a planned feature). Until then every momentum, breakout, calm-name and cheap-options screen should carry feature.atr_pct gte 0.005 (soft) and treat a name whose one_day_move is most of its ret_20d as an event, not a trend."

[[situation]]
name = "earnings gap inside the window"
signs = "rollup.earnings@v1.last_earnings_date within the last 20 to 30 sessions and rollup.price_moves@v1.one_day_move of 0.05 or more."
affects = ["rollup.price_stats@v2.hv20", "rollup.price_stats@v2.hv30", "feature.iv_hv_spread", "feature.iv_hv_ratio", "rollup.price_stats@v2.ret_20d", "rollup.momentum@v1.rel_volume", "feature.breakout_20d", "feature.atr_pct", "rollup.momentum@v1.rsi_14"]
do = "Realised volatility and the ATR are inflated by one day for the length of their window, so IV-over-HV premiums look thin and 'volatile' flags fire. After earnings a large move tends to continue (the post-earnings drift), which makes a post-earnings breakout more trustworthy than one on no news; a large move with no report behind it more often partly reverses. Prefer rollup.price_stats@v2.hv20_yz when comparing volatility across names."

[[situation]]
name = "recent listing, spin-off or long halt"
signs = "instrument.listed_on or instrument.first_seen within the last year; rollup.price_stats@v2.history_days under 240; rollup.iv_history@v2.history_days under 60."
affects = ["feature.pct_from_high_52w", "feature.pct_from_low_52w", "feature.near_52w", "feature.pct_vs_sma_200", "feature.trend_state", "feature.iv_rank", "feature.iv_percentile", "feature.revenue_growth_yoy", "feature.pe_ratio"]
do = "These fields are null, and a null never passes a hard criterion (missing data never passes), so a screen with hard long-window criteria silently excludes every new name. Use soft or score for those criteria when new listings are wanted, or state instrument.listed_on explicitly."

[[situation]]
name = "leveraged or inverse fund"
signs = "instrument.is_leveraged eq true or instrument.is_inverse eq true (instrument.leverage gives the multiple)."
affects = ["feature.pct_vs_sma_20", "feature.pct_vs_sma_50", "feature.pct_vs_sma_200", "feature.trend_state", "rollup.price_stats@v2.ret_20d", "rollup.price_stats@v2.ret_60d", "feature.atr_pct", "rollup.price_stats@v2.hv20", "feature.pct_from_high_52w", "feature.pct_from_low_52w"]
do = "Daily resetting funds drift from their index (volatility decay), so trend and momentum readings describe the fund's path, not the market, and an inverse fund in a 'downtrend' is a rising market. Exclude them from stock screens with instrument.is_leveraged eq false and instrument.is_inverse eq false; screen them deliberately or not at all."

[[situation]]
name = "low-priced or thin name"
signs = "rollup.price_stats@v2.close under 5 or rollup.price_stats@v2.adv_usd_20d under 1000000."
affects = ["feature.atr_pct", "rollup.momentum@v1.rsi_14", "rollup.momentum@v1.rel_volume", "rollup.price_moves@v1.one_day_move", "feature.breakout_20d", "rollup.price_stats@v2.hv20"]
do = "Every volatility and momentum reading is inflated by the tick size, wide spreads and single orders: a 10% day, a 5x volume day and an RSI of 100 are noise here. Put a price floor and a dollar-volume gate first in every screen; the drafting examples do."

[[situation]]
name = "index and expiry days"
signs = "A quarterly expiry Friday (third Friday of March, June, September, December), the Russell reconstitution (the last Friday of June), an S&P index change, a large ETF rebalance."
affects = ["rollup.momentum@v1.rel_volume", "feature.breakout_20d", "feature.option_chain_volume"]
do = "Volume is several times normal across the market with no information in it; a volume rule fires everywhere. Read a breakout or an unusual-volume screen from such a session with that in mind, or require the price condition on its own (the close above the prior high, rollup.momentum@v1.ret_5d) before trusting the volume."

[[situation]]
name = "a null is not a value"
signs = "The field is often null by construction: feature.pe_ratio (loss makers, ADRs), feature.iv_rank (under 60 sessions of IV), the 52-week fields (under 240 bars), rollup.earnings@v1.days_to_earnings (no announced date, every ETF), feature.option_tier (a failed chain run)."
affects = ["feature.pe_ratio", "feature.revenue_growth_yoy", "feature.iv_rank", "feature.iv_percentile", "feature.pct_from_high_52w", "feature.pct_from_low_52w", "rollup.earnings@v1.days_to_earnings", "feature.earnings_before_expiry", "feature.option_tier", "feature.market_cap"]
do = "A null never passes a hard criterion and a soft one lists it as a near miss; so a hard 'pe_ratio lt 15' drops every unprofitable company and 'days_to_earnings gt 10' drops every ETF. Choose hard only when excluding the unknown is the intent; otherwise soft (listed with the reason) or score (ranked lower). 'not_null' is the explicit way to require the fact."

[[field]]
name = "rollup.ibkr_iv_history@v1.ibkr_iv_chg_21d"
theme = "implied volatility"
reads = "IBKR's 30-day implied vol now minus 21 sessions ago (about a month), as a fraction (0.03 is three vol points). IBKR's IV30 blends calls and puts, so it tests the overall IV-change effect, not the call-minus-put split (rollup.cp_iv_history@v1.atm_call_iv_chg_21d and atm_put_iv_chg_21d). Unlike the chain-derived changes it has history: IBKR's IV reaches back about 502 sessions. Personal-use data: it carries the personal licence."
caveats = [
  "It moves with the market: when every name's IV rises in a sell-off the change says little; judge it as a rank across names on the session.",
  "An earnings date inside the window lifts IV and drops it after; read the earnings fields before reading a change across one.",
  "Null if IBKR had no IV today or 21 sessions ago (a gap is not filled), or IB Gateway was down for the session's pull.",
]
sources = ["An, Ang, Bali and Cakici, The Joint Cross Section of Stocks and Options, JF 2014: https://onlinelibrary.wiley.com/doi/10.1111/jofi.12181"]
[[field.use]]
for = "IBKR IV up three vol points in a month"
op = "gte"
value = 0.03
mode = "soft"
tolerance = 0.01
note = "overall IV change, calls and puts blended; compare across names"

[[field]]
name = "rollup.ibkr_iv_history@v1.ibkr_iv_chg_5d"
theme = "implied volatility"
reads = "IBKR's 30-day implied vol now minus 5 sessions ago, as a fraction: option buyers paying up (positive) or backing off (negative) over a week. IBKR's IV30 blends calls and puts, so it tests the overall IV-change effect, not the call-minus-put split. Personal-use data: it carries the personal licence."
caveats = [
  "Same caveats and nulls as rollup.ibkr_iv_history@v1.ibkr_iv_chg_21d; a week is noisier than a month.",
]
sources = ["Site convention (docs/edge-ideas/options-volatility.md c03)"]
[[field.use]]
for = "IBKR IV up three vol points in a week"
op = "gte"
value = 0.03
mode = "soft"
tolerance = 0.01
note = "overall IV change, calls and puts blended; compare across names"

[[field]]
name = "rollup.share_classes@v1.spread_z_252d"
theme = "instrument gates"
reads = "How far today's price ratio to the issuer's other share class is from its own last year, in standard deviations. Negative means this class is cheap against its sibling; positive means rich. -2 is two standard deviations cheaper than usual. The sibling's value is the exact mirror."
caveats = [
  "A class with different voting rights or dividend can keep a gap for years; a year's z-score then only measures drift inside that gap. Check rollup.share_classes@v1.sibling_status is PAIRED first.",
  "Sessions before the first stored reference snapshot use the earliest snapshot's pairs, so history carries today's pairs (survivorship bias). The result shows the count of such sessions.",
  "Null with fewer than 200 sessions of both classes, a flat ratio, or a sibling that is not PAIRED. A hard criterion then rejects the name.",
  "Few issuers qualify, about 15 to 25, so one rule shows a handful of names per session. Judge it over many independent windows.",
]
sources = ["Site convention (docs/edge-ideas/harness-design.md section 5, pair spread)"]
[[field.use]]
for = "the cheap class of a share class pair"
op = "lt"
value = -2
mode = "soft"
tolerance = 0.5
note = "rank on it ascending; the pair_spread outcome shorts the sibling"

[[field]]
name = "rollup.share_classes@v1.sibling_status"
theme = "instrument gates"
reads = "PAIRED means the issuer has exactly two share classes with one listed id each, so the sibling is named. AMBIGUOUS means three or more classes, or a class listed under several ids, so no sibling is named."
caveats = [
  "Only operating companies count; a fund or a preferred share is not a class. Check rollup.share_classes@v1.sibling_id before reading a pair.",
  "Sessions before the first stored reference snapshot use the earliest snapshot's status, so history carries today's classes. The result shows the count of such sessions.",
]
sources = ["Site convention (ADR 0053 amendment, EB H9)"]
[[field.use]]
for = "only names whose share class pair is unambiguous"
op = "eq"
value = "PAIRED"
mode = "hard"
note = "a pair_spread outcome excludes the other statuses anyway; this keeps the screen honest"

[[field]]
name = "rollup.share_classes@v1.sibling_id"
theme = "instrument gates"
reads = "The instrument id of the issuer's other listed share class, read from the reference snapshot the session sees. The pair_spread outcome reads it on the decision session, so a later reclassification never changes a past result."
caveats = [
  "Null when the issuer has one class or the status is AMBIGUOUS; a pair pick is then excluded with the reason no_sibling, never counted as zero. Check rollup.share_classes@v1.sibling_status.",
  "Sessions before the first stored reference snapshot use the earliest snapshot's sibling, so history carries today's pairs. The result shows the count of such sessions.",
]
sources = ["Site convention (ADR 0018, ADR 0053 amendment, EB H9)"]
[[field.use]]
for = "names that have a named sibling class"
op = "not_null"
mode = "hard"
note = "the pair_spread outcome needs it; a name without one is excluded with the reason"
