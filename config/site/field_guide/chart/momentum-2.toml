# Continues momentum.toml: the same keys, the same theme; see its header.

[[field]]
name = "feature.dist_52w"
theme = "momentum and trend"
reads = "The distance to the nearer 52-week extreme as a fraction of it: 0 at the high or the low, 0.10 when the close is 10% from whichever is closer. It is the one-number form of 'near a 52-week extreme' (the VRP scanner's gate); feature.near_52w says which side (HIGH, LOW, BOTH)."
caveats = [
  "It does not say which extreme: a name 5% under its high and one 5% above its low both read 0.05, and they are opposite setups. Read feature.near_52w, or feature.pct_from_high_52w and feature.pct_from_low_52w, before acting on it.",
  "A pinned takeover target sits at its high with a distance near 0 for months (the 'pending takeover' situation).",
  "Null under 240 bars in the last 252 sessions (recent listings).",
]
sources = ["George and Hwang (2004) for the high; the VRP scanner's spec (docs/screeners/vrp-scanner.md) for the 10% gate"]
[[field.use]]
for = "within 10% of a 52-week extreme (the VRP gate)"
op = "lte"
value = 0.10
mode = "hard"
note = "read feature.near_52w for the side"
[[field.use]]
for = "near an extreme, listing near misses"
op = "lte"
value = 0.10
mode = "soft"
tolerance = 0.05

# ---------------------------------------------------------------------- episode behaviour

[[field]]
name = "rollup.episode_behaviour@v1.beta_252d"
theme = "volatility"
reads = "The slope of the name's daily returns on SPY's over the trailing 252 sessions: 1 moves with the market, 1.5 moves half again as much (a 5% market fall is a 7.5% fall here), 0.5 half as much, below 0 against it. Under 0.8 is defensive (utilities, staples, health care), 0.8 to 1.2 average, above 1.2 high beta (technology, discretionary, financials, small caps). A position's market risk is its weight times its beta."
caveats = [
  "Beta is average co-movement, not downside behaviour: a low-beta name can fall as much as the market in a panic when correlations go to one. The episode drawdowns (dd_covid_2020 and the others) are the direct measure of that.",
  "Trailing a year: a name that changed character (a merger, a new business) carries the old beta for months.",
  "Null for young listings (under 200 overlapping returns) and when SPY's bars are missing.",
]
sources = ["Sharpe (1964) and the CAPM; beta bands as practitioners use them: https://www.tastylive.com/concepts-strategies/beta"]
[[field.use]]
for = "defensive (low beta)"
op = "lte"
value = 0.8
mode = "soft"
tolerance = 0.1
note = "with rollup.episode_behaviour@v1.corr_252d gte 0.3 so the low beta is a steady name, not noise"
[[field.use]]
for = "high beta (a market play with leverage)"
op = "gte"
value = 1.3
mode = "soft"
tolerance = 0.1
[[field.use]]
for = "market-like"
op = "between"
value = [0.8, 1.2]
mode = "soft"
tolerance = 0.1

[[field]]
name = "rollup.episode_behaviour@v1.corr_252d"
theme = "volatility"
reads = "The correlation of the name's daily returns with SPY's over the trailing 252 sessions, -1 to 1: above 0.7 the name is mostly a market bet, 0.3 to 0.7 ordinary, under 0.3 it has a life of its own (gold miners, biotech, special situations), negative is rare and usually an inverse fund. Beta says how much, correlation says how reliably."
caveats = [
  "A low beta with a low correlation is noise, not defence: the regression explains little. Defensive names have a low beta with a decent correlation.",
  "Correlations rise toward 1 in a crash, whatever the trailing year said; diversification by low correlation is weakest when it is needed.",
  "Null for young listings and when SPY's bars are missing.",
]
sources = ["Standard portfolio theory (Markowitz); the correlation-in-crashes observation (Longin and Solnik 2001)"]
[[field.use]]
for = "moves with the market"
op = "gte"
value = 0.7
mode = "soft"
tolerance = 0.1
[[field.use]]
for = "its own story (low correlation)"
op = "lte"
value = 0.3
mode = "soft"
tolerance = 0.1
note = "exclude inverse funds with instrument.is_inverse eq false"

[[field]]
name = "rollup.episode_behaviour@v1.dd_covid_2020"
theme = "volatility"
reads = "The worst fall of the name's close from its own running high during the Covid crash (2020-02-19 to 2020-03-23), as a negative fraction: -0.35 means it lost 35% peak to trough. SPY lost about a third; a reading better than -0.25 held up well, worse than -0.50 was hit hard (travel, energy, small caps). The name's realised behaviour in a fast, liquidity-driven crash."
caveats = [
  "Five years old: the company and its shareholders may have changed; it is evidence of the kind of name it was, not a forecast.",
  "Null for names listed after the episode or with under 80% of its sessions on file, which a hard criterion rejects: most IPOs since 2020 and every young fund.",
]
sources = ["docs/market-regime-plan.md (the episode scorecard, ADR 0047)"]
[[field.use]]
for = "held up in a fast crash"
op = "gte"
value = -0.30
mode = "soft"
tolerance = 0.05
[[field.use]]
for = "was hit hard (a high-beta or cyclical name)"
op = "lte"
value = -0.45
mode = "soft"
tolerance = 0.05

[[field]]
name = "rollup.episode_behaviour@v1.dd_hikes_2022"
theme = "volatility"
reads = "The worst fall of the name's close from its own running high during the 2022 rate-hike bear market (2022-01-03 to 2022-10-12), as a negative fraction. SPY lost about a quarter; long-duration growth and unprofitable technology lost 50% to 80%, energy and value held or rose. A slow, valuation-driven decline, the opposite kind of episode to Covid."
caveats = [
  "A name that did well in 2022 and badly in 2020 (or the reverse) is telling you which kind of drawdown it is exposed to; read the three episodes together.",
  "Null for names listed after 2022 or thinly traded through it.",
]
sources = ["docs/market-regime-plan.md (the episode scorecard)"]
[[field.use]]
for = "held up in a slow bear market"
op = "gte"
value = -0.25
mode = "soft"
tolerance = 0.05
[[field.use]]
for = "was hit hard by rates (long duration)"
op = "lte"
value = -0.50
mode = "soft"
tolerance = 0.05

[[field]]
name = "rollup.episode_behaviour@v1.dd_tariffs_2025"
theme = "volatility"
reads = "The worst fall of the name's close from its own running high during the 2025 tariff shock (2025-02-19 to 2025-04-08), as a negative fraction. SPY lost about a fifth in seven weeks; importers, semiconductors and small caps lost more, domestic defensives less. The most recent episode, so the most representative of today's holders."
caveats = [
  "Short and sharp, and recovered fast: a deep drawdown here with a quick recovery (rollup.episode_behaviour@v1.recovery_sessions_tariffs_2025) is a liquid high-beta name, not a broken one.",
  "Null for names listed after early 2025 or thinly traded through it.",
]
sources = ["docs/market-regime-plan.md (the episode scorecard)"]
[[field.use]]
for = "held up in the tariff shock"
op = "gte"
value = -0.20
mode = "soft"
tolerance = 0.05
[[field.use]]
for = "was hit hard by the tariff shock"
op = "lte"
value = -0.35
mode = "soft"
tolerance = 0.05

[[field]]
name = "rollup.episode_behaviour@v1.recovery_sessions_covid_2020"
theme = "volatility"
reads = "Sessions from the Covid trough (2020-03-23) until the close first regained the pre-episode high: 0 means the trough itself was at or above it, about 100 is the index's own recovery (SPY regained its high in August 2020), 250 is a year. Resilience in one number: how long holders waited to be whole."
caveats = [
  "Null means not recovered within 400 sessions of the trough, or the session is before the trough: 'never came back' and 'too early to say' look the same, and a hard criterion rejects both.",
  "A fast recovery of a shallow drawdown is unremarkable; read with rollup.episode_behaviour@v1.dd_covid_2020.",
]
sources = ["docs/market-regime-plan.md; S&P 500 recovery times after bear markets (StockCharts, Bear markets and drawdowns)"]
[[field.use]]
for = "recovered as fast as the index or faster"
op = "lte"
value = 120
mode = "soft"
tolerance = 30
[[field.use]]
for = "recovered at all within the horizon"
op = "not_null"
mode = "soft"
tolerance = 0

[[field]]
name = "rollup.episode_behaviour@v1.recovery_sessions_hikes_2022"
theme = "volatility"
reads = "Sessions from the 2022 trough (2022-10-12) until the close first regained the pre-episode high (the early-2022 peak). SPY took about 300 sessions (January 2024); many growth names took longer or have not, which is what a null here means."
caveats = [
  "Null is 'not within 400 sessions' as much as 'not yet': for this episode the horizon has passed, so null reads as 'did not recover within about 19 months'.",
]
sources = ["docs/market-regime-plan.md"]
[[field.use]]
for = "recovered faster than the index"
op = "lte"
value = 250
mode = "soft"
tolerance = 50
[[field.use]]
for = "recovered within the horizon"
op = "not_null"
mode = "soft"
tolerance = 0

[[field]]
name = "rollup.episode_behaviour@v1.recovery_sessions_tariffs_2025"
theme = "volatility"
reads = "Sessions from the tariff-shock trough (2025-04-08) until the close first regained the pre-episode high. SPY needed about 30 sessions; a liquid high-beta name often recovered in a similar time, a name that had something else wrong took much longer."
caveats = [
  "The horizon (400 sessions after the trough) runs into late 2026: a null can still be 'not yet'.",
]
sources = ["docs/market-regime-plan.md"]
[[field.use]]
for = "recovered with the index"
op = "lte"
value = 45
mode = "soft"
tolerance = 15
[[field.use]]
for = "recovered within the horizon so far"
op = "not_null"
mode = "soft"
tolerance = 0

[[field]]
name = "rollup.momentum_variants@v1.resid_mom_12_1"
theme = "momentum and trend"
reads = "The 12-1 momentum with the market taken out: the log return from 252 to 21 sessions back minus the name's beta times SPY's log return over the same window. 0.15 means the name gained 15 points beyond what its market exposure explains; near 0 means the year was the market's move. Blitz, Huij and Martens (2011) rank on residual returns to take the market leg out. This is a simpler, market-only version: one SPY beta over the window, no intercept, unscaled. It is not their 36-month Fama-French residual scaled by its standard deviation."
caveats = [
  "Only the market is removed, not the sector or style: a name that rode a hot sector still reads as a winner. Compare rollup.momentum_variants@v1.sector_ret_252d to see how much of the year was its sector.",
  "The beta is estimated on the same window it is applied to. It is noisy for a young listing or a name with thin bars, and needs 200 daily returns that overlap SPY's. Check rollup.price_history@v1.range_status.",
  "It is a log return, not the simple 12-1 of rollup.trend_stats@v2.mom_12_1: a big winner reads lower than its simple return.",
  "Null after any gap in the window (252 to 21 sessions back), a shorter history, or without SPY in the symbol map; a hard criterion then rejects the name.",
]
sources = [
  "Blitz, Huij and Martens (2011), Residual Momentum, Journal of Empirical Finance",
  "Jegadeesh and Titman (1993), Returns to Buying Winners and Selling Losers",
]
[[field.use]]
for = "residual momentum long"
op = "gte"
value = 0.10
mode = "soft"
tolerance = 0.10
note = "a score over the universe; gate rollup.trend_stats@v2.mom_12_1 gt 0 as well so a name is a winner in both senses"

[[field]]
name = "feature.mom_12_1_vol_scaled"
theme = "momentum and trend"
reads = "The 12-1 momentum divided by the 60-session realised volatility: the return per unit of risk. 1.0 means the 12-1 return equals one year of one-stdev moves; a calm name up 20% reads higher than a wild one up 20%. This is a stock-level scaling (12-1 over the name's own hv60), not Barroso and Santa-Clara's, who scale the long-short momentum portfolio by its own 126-day volatility."
caveats = [
  "Low volatility inflates the ratio: a near-flat utility with a 5% return and 8% volatility outranks a real winner. Gate on rollup.trend_stats@v2.mom_12_1 above 0.15 as well.",
  "hv60 is the last quarter's volatility, not the window's: a name that was wild during the year and is calm now scores high. Check rollup.vol_stats@v1.hv60 against rollup.price_stats@v2.hv20.",
  "Null after a gap in the last 253 sessions, when hv60 is 0 (a name that barely trades), or on a shorter history.",
]
sources = [
  "Barroso and Santa-Clara (2015), Momentum has its moments, Journal of Financial Economics",
  "Moreira and Muir (2017), Volatility-Managed Portfolios",
]
[[field.use]]
for = "risk-adjusted momentum"
op = "gte"
value = 0.6
mode = "soft"
tolerance = 0.3
note = "a score; gate rollup.trend_stats@v2.mom_12_1 gt 0 as well"

[[field]]
name = "rollup.momentum_variants@v1.fip_12_1"
theme = "momentum and trend"
reads = "Information discreteness of the 12-1 path: the sign of the 12-1 return times the share of down days minus the share of up days in that window. Below 0 the winner climbed on many small up days (continuous information, 'frog in the pan'). Above 0 it got there on a few big jumps. -0.2 is 20 points more up days than down days in an up move. Da, Gurun and Warachka find continuous winners keep going, jumpy ones reverse, so the better winners have the lower value."
caveats = [
  "It counts days, not size: five big up days and a hundred tiny down days read as discrete however the size shakes out. Read it with rollup.trend_stats@v2.mom_12_1 for the amount.",
  "A flat day counts for neither side, so a name that barely trades shows a value near 0 whatever its path; gate on rollup.price_stats@v2.adv_usd_20d.",
  "For a loser the sign flips, so a steady decline also reads negative: use it only for winners (rollup.trend_stats@v2.mom_12_1 above 0).",
  "Null after any gap in the window (252 to 21 sessions back) or a shorter history.",
]
sources = [
  "Da, Gurun and Warachka (2014), Frog in the Pan: Continuous Information and Momentum, Review of Financial Studies",
]
[[field.use]]
for = "continuous winners"
op = "lte"
value = -0.05
mode = "soft"
tolerance = 0.05
note = "with rollup.trend_stats@v2.mom_12_1 gt 0.2 as the gate; alone it also picks smooth losers"

[[field]]
name = "rollup.momentum_variants@v1.resid_ret_20d"
theme = "momentum and trend"
reads = "The last month's return with the market taken out: the log return over 20 sessions minus beta_252d times SPY's over the same sessions. 0.10 means the name beat its market exposure by 10 points this month. The one-month return reverses (Jegadeesh 1990). Blitz, Huij, Lansdorp and Verbeek find the residual version reverses more cleanly, because a market rally does not make every high-beta name a short. The high values are the reversal candidates, the low ones the buys."
caveats = [
  "News moves the name as well as noise: an earnings gap or a takeover in the month does not reverse. Check rollup.price_moves@v1.one_day_move and the earnings dates before shorting a high value.",
  "It reverses against low liquidity worst: small, thinly traded names have the largest values and the highest costs. Gate on rollup.price_stats@v2.adv_usd_20d.",
  "Beta is a year's estimate, so a name whose exposure changed (a merger, a new business) is mis-adjusted; compare rollup.price_stats@v2.ret_20d.",
  "Null after a gap in the last 21 sessions, without SPY in the symbol map or a beta (under 200 overlapping returns in the year).",
]
sources = [
  "Jegadeesh (1990), Evidence of Predictable Behavior of Security Returns",
  "Blitz, Huij, Lansdorp and Verbeek (2013), Short-term residual reversal, Journal of Financial Markets",
]
[[field.use]]
for = "one-month residual reversal (long the losers)"
op = "lte"
value = -0.08
mode = "soft"
tolerance = 0.05
note = "with rollup.price_stats@v2.adv_usd_20d as a liquidity gate; the buys are the lowest values"

[[field]]
name = "rollup.momentum_variants@v1.sector_ret_252d"
theme = "momentum and trend"
reads = "The 252-session return of the instrument's sector ETF: how the whole sector did over a year (0.20 up 20%). Moskowitz and Grinblatt find industry momentum explains much of single-stock momentum. Sectors that did well keep doing well for months, so a name in a strong sector has a tailwind of its own."
caveats = [
  "The sector is the SEC SIC code's eleven coarse groups, not an industry: a biotech and a hospital chain share Health Care. rollup.relative_strength@v1.sector_etf names the ETF used.",
  "An ETF's year is dominated by its largest holdings (XLK by a few mega-caps), so it can differ from the median name's sector; compare rollup.relative_strength@v1.rs_sector_63d.",
  "Null for an instrument without a sector (an ETF, no company snapshot yet) or when the ETF has a gap in its 253 closes.",
]
sources = [
  "Moskowitz and Grinblatt (1999), Do Industries Explain Momentum?, Journal of Finance",
]
[[field.use]]
for = "a strong sector tailwind"
op = "gte"
value = 0.15
mode = "soft"
tolerance = 0.10
note = "a score beside the name's own momentum, never alone"

[[field]]
name = "rollup.momentum_variants@v1.rs_sector_20d"
theme = "momentum and trend"
reads = "The last month's return against the sector ETF's: (1 + the name's 20-session return) / (1 + the ETF's) - 1. 0.05 beat its sector by 5 points; -0.05 lagged by 5. It is the one-month return with the industry move taken out (Hou and Moskowitz style), the sector standing in for the industry. The extremes reverse more than the raw return does."
caveats = [
  "The sector is coarse (eleven ETFs), so a name in a small industry that moved on its own news reads as large; check rollup.price_moves@v1.one_day_move for a single big day.",
  "A name that is a large part of its sector ETF (a mega-cap in XLK) is compared partly with itself, so its value is shrunk toward 0.",
  "Null without a sector or sector ETF, with a gap in the last 21 closes of the name or the ETF.",
]
sources = [
  "Moskowitz and Grinblatt (1999), Do Industries Explain Momentum?, Journal of Finance",
  "Blitz, Huij, Lansdorp and Verbeek (2013), Short-term residual reversal",
]
[[field.use]]
for = "a one-month sector-adjusted laggard"
op = "lte"
value = -0.05
mode = "soft"
tolerance = 0.03
note = "reversal candidate; gate rollup.price_stats@v2.adv_usd_20d for liquidity"

[[field]]
name = "rollup.factor_betas@v1.ivol_252d"
theme = "volatility"
reads = "The volatility a name has left after the market, size, momentum and value are taken out, annualised, over the last 252 sessions. 0.2 is 20% a year of move nothing in the five factors explains; 0.8 is a name that jumps on its own news. The factors are ETF returns (SPY, IWM, MTUM and VLUE, the last three less SPY), so it is free and known at the session. High idiosyncratic volatility has gone with lower returns afterwards (Ang, Hodrick, Xing and Zhang 2006), which is why the decoy battery ranks by it."
caveats = [
  "It is the Ang et al. idea, not their number: they remove the Fama-French three factors from a month of daily returns, this removes four ETF proxies over a year.",
  "High idiosyncratic volatility also marks small, illiquid and distressed names; compare rollup.price_stats@v2.adv_usd_20d and feature.market_cap before reading it as a signal of its own.",
  "Null while rollup.factor_betas@v1.factor_status is NO_FACTOR_HISTORY or SHORT_HISTORY. That means a factor ETF without 200 returns in the window, or fewer than 200 joint sessions. MTUM and VLUE start in 2013, so older windows are unknown, never a market-only fit.",
]
sources = ["Ang, Hodrick, Xing and Zhang (2006), The Cross-Section of Volatility and Expected Returns, Journal of Finance"]
[[field.use]]
for = "calm, low idiosyncratic risk"
op = "lte"
value = 0.25
mode = "soft"
tolerance = 0.05
note = "a score over the universe; the decoy battery's ivol_high ranks the other end"

[[field]]
name = "rollup.factor_betas@v1.beta_mkt"
theme = "volatility"
reads = "The market loading in the four-factor regression over 252 sessions. It is the slope of the name's daily log returns on SPY's, with size, momentum and value held in the same fit. 1 moves with the market, 0.6 is defensive, 1.5 moves half again as much. It differs from rollup.episode_behaviour@v1.beta_252d, which uses SPY alone, whenever the name leans on a style or a sector. The decoy battery's beta_low ranks the lowest first. See Frazzini and Pedersen (2014) and Black, Jensen and Scholes (1972)."
caveats = [
  "A low beta is not low risk: it is average co-movement, and a low-beta name can fall as much as the market in a panic. The low-beta anomaly is partly a utilities and staples tilt.",
  "Estimated on the window it is applied to: noisy for a young listing; null while rollup.factor_betas@v1.factor_status is NO_FACTOR_HISTORY or SHORT_HISTORY.",
]
sources = [
  "Frazzini and Pedersen (2014), Betting Against Beta, Journal of Financial Economics",
  "Black, Jensen and Scholes (1972), The Capital Asset Pricing Model: Some Empirical Tests",
]
[[field.use]]
for = "defensive (low beta)"
op = "lte"
value = 0.8
mode = "soft"
tolerance = 0.1
note = "a score over the universe; compare rollup.episode_behaviour@v1.beta_252d (market only)"

[[field]]
name = "rollup.illiquidity@v1.amihud_63d"
theme = "volume and liquidity"
reads = "Amihud illiquidity: the mean over 63 sessions of the day's absolute return per million dollars traded. 0.01 is a 1% move per $1M, a liquid name; 1 is 100% per $1M, so thin a small order moves it. High is illiquid. Illiquid stocks have earned a premium over liquid ones (Amihud 2002), which the decoy battery ranks by; it is also the cost you pay to trade them."
caveats = [
  "A premium you may not collect: the stocks it ranks first are the ones with the widest spreads and the least volume. Compare rollup.price_stats@v2.adv_usd_20d with the size you would trade.",
  "A quarter of daily ratios: one thin day with a large move raises it for months.",
  "Null after any gap among the last 64 closes, a shorter history or a session with no volume.",
]
sources = ["Amihud (2002), Illiquidity and Stock Returns: Cross-Section and Time-Series Effects, Journal of Financial Markets"]
[[field.use]]
for = "liquid names only"
op = "lte"
value = 0.05
mode = "soft"
tolerance = 0.02
note = "a score over the universe; the decoy battery's amihud_illiquid ranks the other end"

[[field]]
name = "feature.stock_tsmom_sign"
theme = "volatility"
reads = "The name's own trend as a sign. 1 means the 252-session return is above 0 and the close is above the 200-day average. -1 means both are below. 0 means they disagree. Moskowitz, Ooi and Pedersen hold names with a positive past year, whatever their rank among peers."
caveats = [
  "The return is raw, not in excess of cash, so in a high-rate year a sign of 1 is a weaker claim. Compare trend_stats ret_252d with rollup.trend_stats@v2.ret_252d.",
  "Part of its payoff is market timing: most names read 1 after a rising market. Read it beside feature.trend_state and the market's own trend.",
  "Null after a gap in the last 253 sessions or a shorter history. It is never 0 for a missing value.",
]
sources = ["Moskowitz, Ooi and Pedersen (2012), Time Series Momentum, Journal of Financial Economics", "Goyal and Jegadeesh (2018), Cross-Sectional and Time-Series Tests of Return Predictability, Review of Financial Studies"]
[[field.use]]
for = "a name whose own trend is up"
op = "eq"
value = 1
mode = "hard"
note = "as a filter on a momentum rank; names with no value drop out"

[[field]]
name = "rollup.session_returns@v1.overnight_ret_20d"
theme = "volatility"
reads = "The month's return earned overnight, from each close to the next open, compounded over 20 sessions. 0.04 is up 4% overnight in total. Lou, Polk and Skouras found momentum profits arrive overnight and reversal profits arrive during the day."
caveats = [
  "A dividend or an earnings gap sits in the overnight part. Check rollup.earnings@v1.last_earnings_date before reading a high value as a trend.",
  "Opening prices of thin names are noisy. Gate on rollup.price_stats@v2.adv_usd_20d before ranking by it.",
  "Null after a gap, a non-positive price, or a missing open among the last 21 sessions.",
]
sources = ["Lou, Polk and Skouras (2019), A Tug of War: Overnight Versus Intraday Expected Returns, Journal of Financial Economics: https://personal.lse.ac.uk/polk/research/TugOfWar.pdf"]
[[field.use]]
for = "a month that gained overnight"
op = "gt"
value = 0
mode = "hard"
note = "a decomposition: read with rollup.session_returns@v1.intraday_ret_20d, not as a signal alone"

[[field]]
name = "rollup.session_returns@v1.intraday_ret_20d"
theme = "volatility"
reads = "The month's return earned while the market was open, from each open to the same day's close, compounded over 20 sessions. With rollup.session_returns@v1.overnight_ret_20d it makes the 20-session return: one plus each, multiplied, minus one."
caveats = [
  "A name that gained overnight and lost in the day nets close to the old 20-session return. Read both parts before judging the move.",
  "Null after a gap, a non-positive price, or a missing open among the last 21 sessions.",
]
sources = ["Lou, Polk and Skouras (2019), A Tug of War: Overnight Versus Intraday Expected Returns, Journal of Financial Economics"]
[[field.use]]
for = "a month that gained during the day"
op = "gt"
value = 0
mode = "hard"
note = "a decomposition: the part of the move a market-on-close entry would have missed"

[[field]]
name = "rollup.signed_volume@v1.obv_trend_20d"
theme = "volume and liquidity"
reads = "On-balance volume's change over 20 sessions as a share of the volume traded, -1 to 1. Volume on a higher close counts for, on a lower close against. 0.3 is net buying on a third of the volume; below -0.3 is net selling."
caveats = [
  "It reads only the direction of the close, not the size of the move or where the close sat in the range. Compare rollup.volume@v1.cmf_20d.",
  "One heavy day dominates a quiet month. Check rollup.volume@v1.volume_z_20d before reading a high value as steady buying.",
  "Null after a gap in the last 21 sessions or with no volume. Granville's OBV has no academic test of its own.",
]
sources = ["Granville (1963), Granville's New Key to Stock Market Profits", "Lee and Swaminathan (2000), Price Momentum and Trading Volume, Journal of Finance"]
[[field.use]]
for = "net buying over the month"
op = "gt"
value = 0
mode = "soft"
tolerance = 0.05
note = "pair with rollup.volume@v1.cmf_20d gt 0 as a confirmation of a price trend"

[[field]]
name = "feature.capital_gains_overhang"
theme = "price levels"
reads = "How far the close sits above the volume-weighted average price since the last earnings report, as a share of the close. 0.05 is 5% above, -0.05 is 5% below. Above 0, holders since the report are in profit. Grinblatt and Han link that to higher later returns."
caveats = [
  "This is a proxy. Grinblatt and Han weight by turnover over years; this average starts at the last report, at most 126 sessions back. Read rollup.anchored_vwap@v2.avwap_anchor_date for its age.",
  "A fresh anchor sits near the price, so the value is near 0 and says little. It means more after two to four weeks.",
  "Null without a report in the last 126 sessions, fewer than 2 sessions since it, a gap, or no volume.",
]
sources = ["Grinblatt and Han (2005), Prospect Theory, Mental Accounting, and Momentum, Journal of Financial Economics: https://doi.org/10.1016/j.jfineco.2004.06.007"]
[[field.use]]
for = "holders since the report are in profit"
op = "gt"
value = 0
mode = "hard"
note = "rank by it descending for the overhang long leg"

[[field]]
name = "rollup.ipo_lockups@v1.sessions_to_lockup_expiry"
theme = "instrument gates"
reads = "Exchange sessions from the session to the lock-up expiry of a recent IPO. 5 means the lock-up ends in five sessions. 0 means today. -3 means it ended three sessions ago; the earliest read is -20."
caveats = [
  "The date comes from the prospectus text. A prospectus that states no term has no value, so the name is unknown, not free of a lock-up. An early-release lock-up can end for part of the shares sooner.",
]
sources = ["Field and Hanke (2001), The Effect of Lockup Provisions on the Pricing of IPOs; Brav and Gompers (2003), The Role of Lockups in Initial Public Offerings, Review of Financial Studies"]
[[field.use]]
for = "a lock-up ending within the next ten sessions"
op = "lte"
value = 10
mode = "hard"
note = "illustrative screen for an avoid list; names with no lock-up date drop out, and a negative value is a lock-up already over"

[[field]]
name = "rollup.ipo_lockups@v1.lockup_expiry_date"
theme = "instrument gates"
reads = "The first session on which the lock-up of a recent IPO has ended: the first exchange session after the prospectus date plus the stated term. Insiders and early holders may sell from then."
caveats = [
  "Null when the prospectus states no term, when the expiry is more than 20 sessions past, or when the company has no record as of the session.",
]
sources = ["Site convention over the 424B4 final prospectuses (ADR 0050, ADR 0075)"]
[[field.use]]
for = "names with a known lock-up date"
op = "not_null"
mode = "hard"
note = "null means no stated lock-up, an expiry long past, or no company record"

[[field]]
name = "rollup.ipo_lockups@v1.lockup_release_terms"
theme = "instrument gates"
reads = "How the prospectus ends the lock-up. The value standard means one expiry date. The value early_release means it lets part of the lock-up end early, for example after an earnings report or at a price level."
caveats = [
  "The label comes from phrases in the prospectus. A release clause worded in an unusual way reads as standard. Null when the name has no lock-up in the window.",
]
sources = ["Site convention over the 424B4 final prospectuses (ADR 0050, ADR 0075)"]
[[field.use]]
for = "lock-ups with a single expiry date"
op = "eq"
value = "standard"
mode = "hard"
note = "names with no lock-up in the window drop out"

[[field]]
name = "feature.year_loser_flag"
theme = "momentum and trend"
reads = "True when the name fell 30% or more over the last 252 sessions: the stock that year-end tax-loss selling falls on. It is a fixed level standing in for the bottom decile, so in a mild year it flags fewer names than a decile would and in a crash more."
caveats = [
  "It is a rolling year, not the calendar year. A name that fell early and has rebounded can read False, and one that fell last month reads True. Check rollup.price_stats@v2.ret_60d.",
  "Most deep losers are thin and distressed, and some will never rebound. Gate on rollup.price_stats@v2.adv_usd_20d and read rollup.trend_stats@v2.ret_252d for how far each fell.",
  "Null after a gap in the last 253 sessions or a shorter history. It is never False for a missing value.",
]
sources = [
  "Grinblatt and Keloharju, NBER working paper 8745, on year-end selling of the year's losers: https://www.nber.org/papers/w8745.pdf",
]
[[field.use]]
for = "a name that fell 30% or more over the year"
op = "eq"
value = true
mode = "hard"
note = "a yes or no, so names with no value drop out; rank the flagged names with rollup.trend_stats@v2.ret_252d lowest first"
