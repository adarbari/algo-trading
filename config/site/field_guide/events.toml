# L3 site setting: the field guide (ADR 0041, amended 2026-10-06), one <theme>.toml per theme
# plus situations.toml; loaded together by config/site/settings.py load_field_guide. Every
# [[field]] says how to read one catalogue field, which criterion means what, and when the
# reading lies; a [[situation]] is one state of the world that fools several thresholds at once.
# The keys are documented in momentum.toml. Edit by PR; `make features-doc` renders the page.

[[field]]
name = "rollup.earnings@v1.days_to_earnings"
theme = "events"
reads = "Exchange sessions until the next report: 0 reports today, 1 tomorrow, 10 is two weeks out. Options price the report from about ten sessions before (the IV ramp accelerates in the last two or three) and lose that premium within a session after it. 'Avoid earnings' for a short option held a month is days_to_earnings above the holding period; 'play earnings' is under 5."
caveats = [
  "Null means no report date is known for the name, not 'no report soon': ETFs have none, and a company's next date is often unknown until it announces it (two to four weeks before). A hard 'gt 10' therefore rejects every ETF and every company that has not announced; use soft with EVENT_RISK.",
  "Unconfirmed dates move: rollup.earnings@v1.date_confirmed false (the Nasdaq calendar never confirms) means the date is an estimate from last year's pattern and can shift by days.",
  "rollup.earnings@v1.earnings_time says before the open (pre) or after the close (post): 'reports tomorrow, pre' means the move happens before you can act.",
]
sources = [
  "IV ramp and crush around earnings: https://flashalpha.com/articles/iv-crush-explained-earnings-volatility-collapse and https://optionalpha.com/learn/iv-crush",
]
[[field.use]]
for = "no earnings in the next N sessions (short options)"
op = "gt"
value = 10
mode = "soft"
tolerance = 2
on_miss = "EVENT_RISK"
note = "N is the holding period; 25 for a 30-day short option held to expiry; or feature.earnings_before_expiry eq false"
[[field.use]]
for = "earnings this week (an event play)"
op = "lte"
value = 5
mode = "hard"
note = "add rollup.earnings@v1.date_confirmed eq true when the date must be right"

[[field]]
name = "feature.earnings_before_expiry"
theme = "events"
reads = "True when the next report falls on or before the nearest listed expiry: a short option held to that expiry carries the earnings move. False is the clean case for premium selling at the nearest expiry; for a later expiry read rollup.earnings@v1.days_to_earnings against its days."
caveats = [
  "Null when the report date or the nearest expiry is unknown (no date announced, no stored chain): a hard 'eq false' rejects those names; soft with EVENT_RISK keeps them listed.",
  "The nearest expiry can be a weekly a few days out; a 30-day short option needs days_to_earnings against its own expiry, not this flag.",
]
sources = ["Site convention over the earnings calendar and the stored chains"]
[[field.use]]
for = "no earnings before the nearest expiry"
op = "eq"
value = false
mode = "soft"
tolerance = 0
on_miss = "EVENT_RISK"

[[field]]
name = "rollup.fund_reference@v1.reference_instrument_id"
theme = "events"
reads = "For a leveraged or inverse fund, the one stock it tracks (TSLL: Tesla), as an instrument id. The fund has no events of its own: its earnings, ex-dividends and big moves are its reference's, scaled by its leverage (instrument.leverage, negative for an inverse fund). Null for a fund that tracks a basket, and for every instrument that is not a leveraged or inverse fund."
caveats = [
  "Null does not mean 'no events': a basket fund (rollup.fund_reference@v1.reference_kind index, sector or commodity) inherits macro and market-structure events and, for an index or sector, the earnings of its largest holdings; read the kind before the id.",
  "The link comes from the fund's stored holdings when they name exactly one stock, else from its name (rollup.fund_reference@v1.reference_source says which). A name rule is a parse of text: check a surprising link against the fund's own page, and rollup.fund_reference@v1.reference_status UNLISTED means the stock is named but not in the reference snapshot.",
  "A fund whose holdings are not stored yet (etf-holdings has not read it) is linked by its name only; a NO_REFERENCE status is a gap in our data, not a fact about the fund.",
]
sources = ["Site convention (ADR 0050 decision 2: the holdings table, ADR 0035, with a name rule as the fallback)"]
[[field.use]]
for = "funds that track one stock (their events are the stock's)"
op = "not_null"
mode = "hard"
note = "pair with rollup.fund_reference@v1.reference_kind eq single_stock"

[[field]]
name = "rollup.fund_reference@v1.reference_kind"
theme = "events"
reads = "What a leveraged or inverse fund tracks: single_stock (TSLL), index (TQQQ, SPXL), sector (SOXL, NAIL), commodity (UCO, gold and bitcoin funds) or none (a volatility fund, or a fund nothing is known of). It decides which events the fund inherits: a single stock's own calendar, the macro and market-structure events plus the top holdings' earnings, or macro events only."
caveats = [
  "'none' covers two different things: a fund that tracks no stock, index or commodity (a volatility fund) and a fund we know nothing about; rollup.fund_reference@v1.reference_status says which (BASKET with kind none is volatility, NO_REFERENCE is unknown).",
  "index versus sector is read from the name's keywords first and the holdings' sectors second; a fund with neither is an index by default, so a thematic fund can read as an index until its holdings are stored.",
]
sources = ["Site convention (ADR 0050)"]
[[field.use]]
for = "single-stock leveraged funds"
op = "eq"
value = "single_stock"
mode = "hard"
note = "then rollup.fund_reference@v1.reference_instrument_id is the stock"

[[field]]
name = "rollup.fund_reference@v1.reference_source"
theme = "events"
reads = "What settled a leveraged or inverse fund's link: holdings (its stored holdings name one stock, or show the basket) or name_rule (its name states the ticker or the kind). Null when nothing did. Holdings are the stronger evidence: they are what the fund owns today, while the name is a parse of text."
caveats = [
  "name_rule is the only source for a fund whose holdings are not stored; after etf-holdings reads it the same fund can move to holdings and, rarely, to a different reference.",
]
sources = ["Site convention (ADR 0050)"]
[[field.use]]
for = "links settled by the holdings, not a parse of the name"
op = "eq"
value = "holdings"
mode = "hard"

[[field]]
name = "rollup.fund_reference@v1.reference_status"
theme = "events"
reads = "Why a leveraged or inverse fund's reference is what it is: LINKED (one stock found), BASKET (an index, sector or commodity fund: no one stock by design), UNLISTED (a stock is named but is not in the reference snapshot, so no id) or NO_REFERENCE (neither holdings nor the name say what it tracks)."
caveats = [
  "Only BASKET with rollup.fund_reference@v1.reference_kind none is a settled 'tracks nothing' (a volatility fund); NO_REFERENCE is a gap to close by reading the fund's holdings.",
]
sources = ["Site convention (ADR 0050)"]
[[field.use]]
for = "funds whose single-stock link is found"
op = "eq"
value = "LINKED"
mode = "hard"
