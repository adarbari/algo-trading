# L3 site setting: the field guide (ADR 0041), the volume theme: volume@v1 and the expression
# features over it (config/site/features/volume.toml). The keys and the rules each entry
# follows are in the header of momentum.toml. Values are in the field's unit: shares take
# 1000000 for a million shares, a ratio 1.3 for 30% busier, a decimal 0.6 for 60%.


[[field]]
name = "rollup.volume@v1.session_volume"
theme = "volume"
reads = "The shares traded on the session, split-adjusted as of the session. 0 means no trades (known, not missing). Its size has no universal scale: a typical S&P 500 stock trades 1 to 10 million shares a day, a mega cap 20 to 100 million, a small Nasdaq name 100,000 to 1 million, and under about 100,000 shares a day a name is thin. Read it against the name's own normal: today over rollup.volume@v1.adv_shares_20d near 1 is an ordinary day, 1.5 a busy one, 3 or more an event (rollup.momentum@v1.rel_volume and rollup.volume@v1.volume_z_20d do that comparison for you). For dollars traded use rollup.volume@v1.dollar_volume."
caveats = [
  "Earnings days trade 3 to 10 times the normal volume by nature; check rollup.earnings@v1.last_earnings_date before reading a big number as unusual.",
  "Quarterly expiry Fridays, index rebalances and the Russell reconstitution (late June) inflate volume with no news behind it; a big number with a flat close (rollup.momentum@v1.ret_5d near 0) is usually one of these.",
  "A split multiplies the share count: the stored value is adjusted as of the session, but a share threshold set before a split means half as much after a 2-for-1. Prefer rollup.volume@v1.dollar_volume or rollup.price_stats@v2.adv_usd_20d for liquidity gates.",
]
sources = [
  "Volume (finance), Wikipedia: https://en.wikipedia.org/wiki/Volume_(finance)",
]
[[field.use]]
for = "traded today (not a stale quote)"
op = "gt"
value = 0
mode = "hard"
note = "a name with no trades today has volume 0, which is known, not null"

[[field]]
name = "rollup.volume@v1.dollar_volume"
theme = "volume"
reads = "Close x shares traded on the session, in dollars: one day of rollup.price_stats@v2.adv_usd_20d. Low to high: under about $1M a day a name is illiquid (a few orders move the price); $1M to $5M is thin, fine only for small orders; $5M to $50M is tradable for most individual positions; $50M and above is liquid; large caps trade $500M to several billion and the largest names $10B or more. A normal day sits within about 0.7 to 1.5 times the name's 20-session average; outside that band something happened."
caveats = [
  "One day is noisy: an index event or an earnings day can be 5 times normal. Gate liquidity on rollup.price_stats@v2.adv_usd_20d, the 20-session average, and use this for 'today'.",
  "Low-priced names can show a large share count and still a small dollar figure; gate on rollup.price_stats@v2.close as well.",
]
sources = [
  "Market liquidity and average daily dollar volume: https://en.wikipedia.org/wiki/Market_liquidity",
]
[[field.use]]
for = "traded a lot of dollars today"
op = "gte"
value = 50000000
mode = "soft"
tolerance = 10000000
note = "for a liquidity gate use rollup.price_stats@v2.adv_usd_20d gte the same value"

[[field]]
name = "rollup.volume@v1.adv_shares_20d"
theme = "volume"
reads = "The average shares traded per session over the last 20 sessions (about a month), the session included. Low to high: under 100,000 shares a day is thin, 100,000 to 1 million moderate, 1 to 10 million typical for an S&P 500 stock, above 10 million heavily traded. It is a share count, so it is a position-sizing figure (an order under 1% of it moves the price little) more than a liquidity grade: 500,000 shares a day is liquid for a $100 stock ($50M) and thin for a $2 one ($1M). For a dollar grade use rollup.price_stats@v2.adv_usd_20d."
caveats = [
  "An earnings day or an index event inside the window lifts the average for 20 sessions; check rollup.earnings@v1.last_earnings_date.",
  "Share counts change at a split: the value is adjusted as of the session, but a threshold in shares means a different dollar amount before and after; prefer rollup.price_stats@v2.adv_usd_20d for a gate that survives splits.",
  "Null after a gap in the last 20 sessions or a shorter history (a new listing); a hard criterion then rejects the name.",
]
sources = [
  "Average daily trading volume, Investopedia: https://www.investopedia.com/terms/a/averagedailytradingvolume.asp",
]
[[field.use]]
for = "liquid in shares"
op = "gte"
value = 500000
mode = "hard"
note = "pair with rollup.price_stats@v2.close; a dollar gate is rollup.price_stats@v2.adv_usd_20d"

[[field]]
name = "rollup.volume@v1.volume_ratio_5d_20d"
theme = "volume"
reads = "The average volume of the last 5 sessions over the average of the last 20 (both including the session): 1 is a normal week, below 0.7 a quiet one, below 0.6 volume is drying up (the contraction that often precedes a breakout in a base), above 1.3 volume is expanding and above 2 the week held an event."
caveats = [
  "Holiday weeks (Thanksgiving, the last week of December) are quiet across the market; a low ratio then is the calendar, not the stock. Compare with the market or wait a week.",
  "An earnings day 6 to 20 sessions ago inflates the 20-session base, so the ratio reads 'drying up' when the week is merely normal; check rollup.earnings@v1.last_earnings_date.",
  "An earnings day or an index event in the last 5 sessions lifts the ratio with no trend behind it; a high ratio with a flat close (rollup.momentum@v1.ret_5d near 0) is usually one of these.",
  "Null after a gap in the last 20 sessions, a shorter history, or no volume at all over the 20.",
]
sources = [
  "Volume contraction before breakouts (O'Neil, How to Make Money in Stocks: volume drying up in a base)",
  "Reading volume against its average: https://www.investopedia.com/articles/technical/02/010702.asp",
]
[[field.use]]
for = "volume drying up"
op = "lte"
value = 0.6
mode = "soft"
tolerance = 0.1
note = "the contraction of a base; pair with feature.range_20d_pct low and feature.trend_state eq UPTREND"
[[field.use]]
for = "volume expanding"
op = "gte"
value = 1.3
mode = "soft"
tolerance = 0.2
note = "participation is rising; check rollup.earnings@v1.last_earnings_date for an event inside the week"

[[field]]
name = "rollup.volume@v1.volume_z_20d"
theme = "volume"
reads = "How unusual the session's volume is, in standard deviations of the 20 sessions before it: 0 is an average day, 1 to 2 a busy one, 3 and above an event-sized day (earnings, news, an index event or a capitulation), negative a quiet one. Same base as rollup.momentum@v1.rel_volume, but scaled by how much the volume usually varies, so a steady name's spike scores higher than an erratic name's."
caveats = [
  "Earnings days are routinely 3 or more; check rollup.earnings@v1.last_earnings_date before reading a high z-score as news.",
  "Expiry Fridays and index rebalances print high z-scores with no news; a high value with a flat close (rollup.momentum@v1.ret_5d near 0) is usually one of these.",
  "Volume is skewed (big days are far bigger than quiet days are small), so z-scores above 3 are commoner than a normal curve suggests; rank by it rather than read it as a probability.",
  "On thin names a single block trade is a 5-sigma day; gate on rollup.price_stats@v2.adv_usd_20d.",
  "Null after a gap in the last 21 sessions, a shorter history, or when the 20 sessions before all had the same volume (no spread to scale by).",
]
sources = [
  "Standard score, Wikipedia: https://en.wikipedia.org/wiki/Standard_score",
  "Abnormal trading volume around events: Campbell, Grossman and Wang (1993), Trading volume and serial correlation in stock returns",
]
[[field.use]]
for = "volume climax"
op = "gte"
value = 3
mode = "soft"
tolerance = 0.5
note = "or feature.volume_climax eq true; check rollup.earnings@v1.last_earnings_date"
[[field.use]]
for = "a quiet session"
op = "lte"
value = -1
mode = "soft"
tolerance = 0.3

[[field]]
name = "rollup.volume@v1.up_volume_share_20d"
theme = "volume"
reads = "The share of the last 20 sessions' volume that traded on up days (a close above the previous close), 0 to 1: 0.5 is balanced, 0.6 and above is accumulation (buyers did the heavy trading), 0.4 and below distribution. A session closing unchanged counts in the total only. It is the 20-session form of on-balance volume's idea: volume follows the side in control."
caveats = [
  "One heavy day can be most of the window: an earnings gap up on 10 times normal volume pushes the share above 0.6 on its own. Check rollup.earnings@v1.last_earnings_date and rollup.price_moves@v1.one_day_move.",
  "It counts closes, not how far they moved: nineteen small up days and one large down day read as accumulation. Pair with rollup.price_stats@v2.ret_20d.",
  "Null after a gap in the last 21 sessions (the first session needs the close before it), a shorter history, or no volume at all.",
]
sources = [
  "On-balance volume (Granville), Wikipedia: https://en.wikipedia.org/wiki/On-balance_volume",
  "Accumulation / distribution, StockCharts ChartSchool: https://chartschool.stockcharts.com/table-of-contents/technical-indicators-and-overlays/technical-indicators/accumulation-distribution-line",
]
[[field.use]]
for = "accumulation"
op = "gte"
value = 0.6
mode = "soft"
tolerance = 0.05
note = "or feature.volume_bias eq ACCUMULATION; pair with feature.trend_state eq UPTREND"
[[field.use]]
for = "distribution"
op = "lte"
value = 0.4
mode = "soft"
tolerance = 0.05

[[field]]
name = "rollup.volume@v1.cmf_20d"
theme = "volume"
reads = "Chaikin money flow over 20 sessions, -1 to 1: where each close sat in its day's range (+1 at the high, -1 at the low), weighted by volume. Above 0 buyers closed the heavy days near the highs; above 0.1 is a usual 'money flowing in' reading, above 0.25 strong; below -0.1 money flowing out. Read with rollup.volume@v1.up_volume_share_20d: the share counts up and down closes, CMF where in the range they landed."
caveats = [
  "CMF ignores gaps: a stock gapping down 10% and closing at the day's high scores +1 for that day. On a gap day (rollup.price_moves@v1.one_day_move large, rollup.earnings@v1.last_earnings_date recent) read rollup.volume@v1.up_volume_share_20d instead.",
  "A day with high equal to low (a halt, a thin name with one print) counts as 0; thin names need a gate on rollup.price_stats@v2.adv_usd_20d.",
  "Null after a gap in the last 20 sessions, a shorter history, or no volume at all.",
]
sources = [
  "Chaikin money flow, StockCharts ChartSchool: https://chartschool.stockcharts.com/table-of-contents/technical-indicators-and-overlays/technical-indicators/chaikin-money-flow-cmf",
  "Chaikin Analytics, money flow: https://www.chaikinanalytics.com/",
]
[[field.use]]
for = "money flowing in"
op = "gte"
value = 0.1
mode = "soft"
tolerance = 0.05
note = "pair with rollup.volume@v1.up_volume_share_20d gte 0.5"
[[field.use]]
for = "money flowing out"
op = "lte"
value = -0.1
mode = "soft"
tolerance = 0.05

[[field]]
name = "feature.volume_dry_up"
theme = "volume"
reads = "True when the last 5 sessions traded under 60% of the 20-session average volume (rollup.volume@v1.volume_ratio_5d_20d below 0.6): the quiet before a breakout in a base, when sellers have stopped. False is a normal or busy week (most names, most weeks: the ratio usually sits between 0.8 and 1.2); null when the ratio is unknown. The threshold is params.max_ratio; 0.5 is a stricter dry-up, 0.7 a looser one, and the ratio itself (rollup.volume@v1.volume_ratio_5d_20d) ranks how dry."
caveats = [
  "Holiday weeks are quiet for everyone; a dry-up then says nothing about the stock.",
  "A heavy earnings day 6 to 20 sessions ago inflates the base and fakes a dry-up; check rollup.earnings@v1.last_earnings_date.",
  "A dry-up in a downtrend is a stock nobody wants, not a base; gate on feature.trend_state eq UPTREND.",
]
sources = [
  "O'Neil, How to Make Money in Stocks: volume drying up near the lows of a base",
]
[[field.use]]
for = "volume drying up"
op = "eq"
value = true
mode = "hard"
note = "with feature.trend_state eq UPTREND; the breakout is then feature.breakout_20d"

[[field]]
name = "feature.volume_climax"
theme = "volume"
reads = "True when the session's volume is 3 or more standard deviations above the 20 sessions before it (rollup.volume@v1.volume_z_20d at least 3): an event-sized day. False is everything from a quiet day to a busy one (a z-score under 3; 1 to 2 is a busy but ordinary day); null when the z-score is unknown. After a long decline a climax with a close off the lows can mark capitulation; after a long rise, exhaustion. Most climaxes are simply news, and a typical name has a few a year (earnings alone gives four)."
caveats = [
  "Earnings days are climaxes by nature; check rollup.earnings@v1.last_earnings_date before reading one as capitulation.",
  "Expiry Fridays and index rebalances print climaxes with no news; a flat close (rollup.momentum@v1.ret_5d near 0) points to one.",
  "On thin names a single block trade is a climax; gate on rollup.price_stats@v2.adv_usd_20d.",
]
sources = [
  "Selling climax and buying climax (Wyckoff method): https://chartschool.stockcharts.com/table-of-contents/market-analysis/wyckoff-analysis-articles/the-wyckoff-method-a-tutorial",
]
[[field.use]]
for = "volume climax"
op = "eq"
value = true
mode = "hard"
note = "pair with the sign of rollup.momentum@v1.ret_5d to tell capitulation from a blow-off"

[[field]]
name = "feature.volume_bias"
theme = "volume"
reads = "Which side did the heavy trading over the last 20 sessions, from rollup.volume@v1.up_volume_share_20d (the share of volume on up days, 0 to 1): ACCUMULATION when 60% or more of the volume traded on up days (buyers in control), DISTRIBUTION at 40% or less (sellers in control), NEUTRAL between, which is the usual state (most names most months sit between 0.4 and 0.6). Null when the share is unknown. The bounds are params.accumulation_at and params.distribution_at; the share itself ranks how strong the bias is."
caveats = [
  "One earnings gap on heavy volume can decide the label on its own; check rollup.earnings@v1.last_earnings_date and rollup.price_moves@v1.one_day_move.",
  "It counts up and down closes, not how far they moved; confirm with rollup.volume@v1.cmf_20d and rollup.price_stats@v2.ret_20d.",
]
sources = [
  "Accumulation / distribution, StockCharts ChartSchool: https://chartschool.stockcharts.com/table-of-contents/technical-indicators-and-overlays/technical-indicators/accumulation-distribution-line",
]
[[field.use]]
for = "accumulation"
op = "eq"
value = "ACCUMULATION"
mode = "hard"
note = "with feature.trend_state eq UPTREND"
[[field.use]]
for = "distribution"
op = "eq"
value = "DISTRIBUTION"
mode = "hard"

# Longer volume averages, the volume rank against the year, turnover and the volume near the
# close (vol_stats@v1, volume_profile@v1, volume.toml expressions).

[[field]]
name = "rollup.vol_stats@v1.adv_shares_60d"
theme = "volume"
reads = "The average shares traded per session over the last 60 sessions (a quarter), the session included: the slow base rollup.volume@v1.adv_shares_20d is compared with (feature.volume_trend_20_60). Read it as the other averages: under 100,000 shares a day is thin, 1 to 10 million typical for an S&P 500 stock; for dollars use rollup.price_stats@v2.adv_usd_20d."
caveats = [
  "An earnings day or an index event inside the quarter lifts it for 60 sessions.",
  "Null after a gap in the last 60 sessions or a shorter history.",
]
sources = ["Average daily trading volume, Investopedia: https://www.investopedia.com/terms/a/averagedailytradingvolume.asp"]
[[field.use]]
for = "has a quarterly volume average"
op = "not_null"
mode = "hard"
note = "threshold feature.volume_trend_20_60 for the trend, rollup.price_stats@v2.adv_usd_20d for liquidity"

[[field]]
name = "rollup.vol_stats@v1.volume_pctile_252d"
theme = "volume"
reads = "Where today's share volume sits against the name's own last year, 0 to 1: the share of the 252 sessions before today that traded less. 0.98 means only about five sessions in the year traded more (an event day); 0.50 an ordinary day; below 0.10 one of the quietest days of the year. It is rollup.momentum@v1.rel_volume ranked against the whole year instead of divided by the last month, so a busy month does not hide a busy day."
caveats = [
  "Quarterly expiry Fridays, index rebalances and earnings days are the top of every name's year; check rollup.earnings@v1.last_earnings_date before reading 0.98 as news.",
  "The day after a split the share count doubles; the stored volume is adjusted as of the session, so the rank is right, but a threshold a user set in shares is not.",
  "Null when fewer than 240 of the 252 sessions before today have a bar.",
]
sources = ["Volume (finance), Wikipedia: https://en.wikipedia.org/wiki/Volume_(finance)"]
[[field.use]]
for = "a top-of-the-year volume day"
op = "gte"
value = 0.95
mode = "soft"
tolerance = 0.03
note = "with rollup.trend_stats@v2.close_range_pos gte 0.7 for a strong close on it; rollup.volume@v1.volume_z_20d is the sigma version"
[[field.use]]
for = "a quiet day (volume drying up)"
op = "lte"
value = 0.15
mode = "soft"
tolerance = 0.05
note = "for the week use rollup.volume@v1.volume_ratio_5d_20d or feature.volume_dry_up"

[[field]]
name = "feature.volume_trend_20_60"
theme = "volume"
reads = "The 20-session average volume over the 60-session average: above 1 activity has been building over the quarter, below 1 fading. 1.3 and above is a clear pick-up (a story is spreading, or a base is ending); 0.7 and below a name going quiet. Where rollup.volume@v1.volume_ratio_5d_20d reads the week against the month, this reads the month against the quarter."
caveats = [
  "An earnings day in the last 20 sessions lifts the numerator by a few percent for a month; check rollup.earnings@v1.last_earnings_date.",
  "Null after a gap in the last 60 sessions or a shorter history, or a 60-session average of 0.",
]
sources = ["O'Neil (2009), How to Make Money in Stocks: volume building before a breakout"]
[[field.use]]
for = "volume building"
op = "gte"
value = 1.2
mode = "soft"
tolerance = 0.1
note = "with feature.volume_bias eq ACCUMULATION for the direction of the volume"

[[field]]
name = "feature.turnover_20d"
theme = "volume"
reads = "Daily turnover: the 20-session average share volume as a share of the shares outstanding, 0.01 meaning 1% of the company changes hands each day (the whole float roughly every five months). Low to high: under 0.002 is a closely held or dull name; 0.005 to 0.015 is typical for an S&P 500 stock; above 0.03 is a heavily traded name (a meme stock, a fresh IPO, a takeover target). Turnover is comparable across names of every size, where share volume is not."
caveats = [
  "Shares outstanding are the company's last filed count (every quarter for a 10-Q filer, once a year for a 20-F filer), so turnover is stale by up to a year after a buyback or an offering; rollup.fundamentals@v2.market_cap_status says STALE when too old.",
  "ETFs and ADRs have no filed share count here, so turnover is null for them; use rollup.price_stats@v2.adv_usd_20d.",
  "Null when the 20-session average is unknown or no share count is filed.",
]
sources = ["Turnover ratio (share turnover), Investopedia: https://www.investopedia.com/terms/s/shareturnover.asp"]
[[field.use]]
for = "actively traded relative to its float"
op = "gte"
value = 0.01
mode = "soft"
tolerance = 0.003
note = "a liquidity score comparable across sizes; the dollar gate is rollup.price_stats@v2.adv_usd_20d"

[[field]]
name = "rollup.volume_profile@v1.volume_near_close_share"
theme = "volume"
reads = "The share of the last year's volume that traded in price bins within one ATR of today's close: how much the market has already transacted around here. 0.05 is a thinly traded level (price moves through it easily); 0.15 to 0.25 is a well-traded zone where the name has spent weeks (a level that holds); above 0.30 the close sits in the year's main value area. It is the daily-bar profile's answer to 'is this price a level or a gap'."
caveats = [
  "The profile spreads each day's volume evenly over its range (no intraday data), so a bin's volume is an estimate within a day's range; read the share as a zone, not a price.",
  "A collapsed ATR (a pending takeover) makes the band a few cents wide and the share tiny; see the 'pending takeover' situation.",
  "Null when atr_14 is unknown or the profile is not OK (fewer than 240 bars in the year, or no range).",
]
sources = ["Market Profile and volume profile: Steidlmayer and Hawkins (2003), Steidlmayer on Markets; Dalton (2007), Markets in Profile"]
[[field.use]]
for = "at a well-traded level (support or resistance by volume)"
op = "gte"
value = 0.15
mode = "soft"
tolerance = 0.05
note = "with feature.dist_to_support or feature.dist_to_resistance for the pivot the volume agrees with"
[[field.use]]
for = "in thin air (little volume at this price)"
op = "lte"
value = 0.05
mode = "soft"
tolerance = 0.02
note = "a breakout through a thin zone runs fast: pair with feature.breakout_magnitude_20d gt 0"

[[field]]
name = "rollup.vol_stats@v1.pocket_pivot"
theme = "volume"
reads = "True on a pocket pivot: the close rose and the session's volume exceeded the volume of every down-close session among the ten before it. Morales and Kacher's buy point inside a base: institutions are accumulating before the breakout, visible as an up day on more volume than any recent selling day. It fires on a few percent of sessions; the classic version also wants the close above the 10-day average and a constructive base (rollup.trend_stats@v2.tight_range_sessions, feature.pct_vs_ema_20 gt 0)."
caveats = [
  "An earnings day or an index event is a pocket pivot by arithmetic; check rollup.earnings@v1.last_earnings_date and rollup.momentum@v1.rel_volume (a genuine one is usually 1.2 to 2 times average, not 5).",
  "False when the ten sessions before had no down close at all (nothing to beat), which is rare and not a signal either way.",
  "Null after a gap in the last 12 sessions.",
]
sources = ["Morales and Kacher (2010), Trade Like an O'Neil Disciple: the pocket pivot"]
[[field.use]]
for = "a pocket pivot buy point"
op = "eq"
value = true
mode = "hard"
note = "with feature.pct_vs_ema_20 gt 0 and rollup.trend_stats@v2.tight_range_sessions gte 10 for the base; feature.stretch_sma20_atr lte 2 against an extended one"

[[field]]
name = "rollup.volume_profile@v1.profile_status"
theme = "volume"
reads = "Whether the volume profile is computed: OK; FEW_BARS when fewer than 240 of the last 252 sessions have a bar (a young listing or a gappy name: every profile value is null); NO_RANGE when the name traded at one price all year (a halted or pinned name)."
caveats = [
  "OK says the profile exists, not that it is sharp: each day's volume is spread over its whole range, so the bins are a day's range wide in effect. Read the levels as zones.",
]
sources = ["Steidlmayer and Hawkins (2003), Steidlmayer on Markets"]
[[field.use]]
for = "has a volume profile"
op = "eq"
value = "OK"
mode = "hard"
note = "the gate for every profile level; the levels themselves are compared with rollup.price_stats@v2.close"

[[field]]
name = "rollup.volume_profile@v1.poc_252d"
theme = "volume"
reads = "The point of control: the price bin (one fiftieth of the year's range) where the most volume traded over the last 252 sessions, in dollars per share. It is the year's 'fair price' by participation: the level price returns to and lingers at, support when the close is above it and resistance when below. feature.dist_to_poc is the distance as a fraction."
caveats = [
  "A daily-bar estimate: each day's volume is spread evenly over its range, so the point of control is a zone a bin or two wide, and a tie goes to the bin nearest the close.",
  "A trending name has its point of control far behind the price (where it spent the most time): a 20% distance is normal after a strong year. Read with feature.in_value_area.",
  "Null unless profile_status is OK.",
]
sources = ["Steidlmayer and Hawkins (2003), Steidlmayer on Markets; Dalton (2007), Markets in Profile"]
[[field.use]]
for = "has a point of control"
op = "not_null"
mode = "hard"
note = "threshold feature.dist_to_poc"

[[field]]
name = "rollup.volume_profile@v1.value_area_high"
theme = "volume"
reads = "The top of the value area: the smallest band of price bins around the point of control that held 70% of the last year's volume, in dollars per share. Above it the price is at a level the market has traded little (an extreme by volume, where a trend either continues into thin air or returns to value); feature.in_value_area is the flag."
caveats = [
  "The band is built from daily ranges, not intraday prints: a zone, not a price.",
  "Null unless profile_status is OK.",
]
sources = ["Dalton (2007), Markets in Profile: the value area"]
[[field.use]]
for = "has a value area"
op = "not_null"
mode = "hard"
note = "use feature.in_value_area for the close's position"

[[field]]
name = "rollup.volume_profile@v1.value_area_low"
theme = "volume"
reads = "The bottom of the value area (the band around the point of control holding 70% of the year's volume), in dollars per share: below it the price is at a volume extreme on the downside, a cheap level by participation that either holds or breaks into thin air."
caveats = [
  "A zone, not a price (daily-bar profile).",
  "Null unless profile_status is OK.",
]
sources = ["Dalton (2007), Markets in Profile: the value area"]
[[field.use]]
for = "has a value area"
op = "not_null"
mode = "hard"
note = "use feature.in_value_area for the close's position"

[[field]]
name = "rollup.volume_profile@v1.hvn_above"
theme = "volume"
reads = "The nearest high-volume node above the close: the centre of the closest price bin above the close's bin whose volume over the year was at least 1.5 times the average bin, in dollars per share. A level where the name has traded heavily, so price tends to slow and pause there: resistance by volume, and a target for a move up."
caveats = [
  "A zone a bin or two wide (daily-bar profile), not a price.",
  "Null when no such bin lies between the close and the year's high (the close is near the top of the profile), or unless profile_status is OK.",
]
sources = ["Dalton (2007), Markets in Profile: high-volume nodes"]
[[field.use]]
for = "has a volume node above"
op = "not_null"
mode = "hard"
note = "compare with rollup.price_stats@v2.close in a rule; the pivot version is feature.dist_to_resistance"

[[field]]
name = "rollup.volume_profile@v1.hvn_below"
theme = "volume"
reads = "The nearest high-volume node below the close (a bin with at least 1.5 times the average bin volume), in dollars per share: support by volume, where buyers have shown up before, and the level a pullback tends to stop at."
caveats = [
  "A zone, not a price (daily-bar profile).",
  "Null when no such bin lies between the close and the year's low, or unless profile_status is OK.",
]
sources = ["Dalton (2007), Markets in Profile: high-volume nodes"]
[[field.use]]
for = "has a volume node below"
op = "not_null"
mode = "hard"
note = "compare with rollup.price_stats@v2.close in a rule; the pivot version is feature.dist_to_support"

[[field]]
name = "rollup.volume_profile@v1.lvn_above"
theme = "volume"
reads = "The nearest low-volume node above the close: the closest bin above with at most half the average bin volume, in dollars per share. A price the market rejected quickly, so a move into it tends to continue through it (thin air): the breakout screens like a close just under a low-volume node with a high-volume node further up as the target."
caveats = [
  "A zone, not a price (daily-bar profile).",
  "Null when no such bin lies between the close and the year's high, or unless profile_status is OK.",
]
sources = ["Dalton (2007), Markets in Profile: low-volume nodes"]
[[field.use]]
for = "has a low-volume node above"
op = "not_null"
mode = "hard"
note = "compare with rollup.price_stats@v2.close in a rule"

[[field]]
name = "rollup.volume_profile@v1.lvn_below"
theme = "volume"
reads = "The nearest low-volume node below the close (a bin with at most half the average bin volume), in dollars per share: thin air on the downside, where a breakdown accelerates until the next high-volume node."
caveats = [
  "A zone, not a price (daily-bar profile).",
  "Null when no such bin lies between the close and the year's low, or unless profile_status is OK.",
]
sources = ["Dalton (2007), Markets in Profile: low-volume nodes"]
[[field.use]]
for = "has a low-volume node below"
op = "not_null"
mode = "hard"
note = "compare with rollup.price_stats@v2.close in a rule"

[[field]]
name = "feature.in_value_area"
theme = "volume"
reads = "True when the close sits inside the last year's value area, the price band that held 70% of the volume: fair value by participation, where price tends to rotate. False means the close is at a volume extreme: above the value area a trend is being accepted at new prices (or will return to value), below it the name is cheap by the year's participation (or breaking down). Dalton's rule of thumb: an open outside value that fails to hold returns to the point of control."
caveats = [
  "The value area is built from daily ranges (no intraday data) and is a year wide, so a trending name leaves it for months; pair with feature.trend_state before reading 'outside value' as a reversal.",
  "Null when the value area is unknown (profile_status not OK) and the known side does not already say false.",
]
sources = ["Dalton (2007), Markets in Profile"]
[[field.use]]
for = "trading at a volume extreme (outside value)"
op = "eq"
value = false
mode = "hard"
note = "with feature.dist_to_poc gt 0 for above value, lt 0 for below"

[[field]]
name = "feature.dist_to_poc"
theme = "volume"
reads = "Close over the year's point of control minus one: 0.05 means the price sits 5% above the most-traded level of the year, -0.10 ten percent below it. Near 0 the name is at its volume magnet (expect rotation); far above after a strong year the point of control is the support a deep pullback would find; far below it is the overhead supply."
caveats = [
  "A daily-bar estimate of the level, a bin or two wide.",
  "Null unless profile_status is OK.",
]
sources = ["Dalton (2007), Markets in Profile"]
[[field.use]]
for = "near the point of control"
op = "between"
value = [-0.03, 0.03]
mode = "soft"
tolerance = 0.02
note = "with feature.in_value_area eq true; a mean-reversion zone"

# The session's bar shape and the named candles (candle@v1, and the inside_day_breakout and
# strong_close expressions in config/site/features/swing.toml): what the day's open, high, low
# and close say on their own. A single candle means little without where it formed. Filed under
# "volume" because the momentum and price-level pages are at their 1000-line cap.

[[field]]
name = "rollup.candle@v1.body_share"
theme = "volume"
reads = "The candle body (open to close) over the day's whole range, 0 to 1. Near 0 (under 0.1) the session closed where it opened: a doji, indecision. Around 0.5 an ordinary day. Above 0.7 a long body with short wicks: one side controlled the session from open to close (a marubozu at 1)."
caveats = [
  "A big body is only meaningful against the name's usual body: rollup.candle@v1.body_vs_avg_20d says whether 0.8 is a large move or a normal one for it.",
  "An earnings day or a gap open makes the open far from the prior close, so the body hides most of the move; check rollup.earnings@v1.last_earnings_date and rollup.gaps@v1.gap_open_pct.",
  "Null when the bar has no range (high equals low: a halted or untraded session).",
]
sources = ["Nison (1991), Japanese Candlestick Charting Techniques: the real body", "Bulkowski (2008), Encyclopedia of Candlestick Charts"]
[[field.use]]
for = "a decisive session (a long body)"
op = "gte"
value = 0.6
mode = "soft"
tolerance = 0.1
note = "with rollup.trend_stats@v2.close_range_pos gte 0.7 for a strong close; feature.strong_close is that pair"
[[field.use]]
for = "an indecisive session (a doji-like body)"
op = "lte"
value = 0.1
mode = "soft"
tolerance = 0.05
note = "rollup.candle@v1.candle eq DOJI is the same cut with its range check"

[[field]]
name = "rollup.candle@v1.upper_wick_share"
theme = "volume"
reads = "The share of the day's range above the body: how much of the session's high was given back by the close, 0 to 1. Under 0.1 the close was at or near the high; above 0.5 half the day's range was sold off from the high (the shape of a shooting star when the body is small and the lower wick short)."
caveats = [
  "One session: a long upper wick after a run (feature.stretch_sma20_atr above 2) is the warning Nison describes; the same wick in a base means little. Read it with where the name is.",
  "A wick on a day with an earnings report or a gap open (rollup.earnings@v1.last_earnings_date) reflects the event, not supply at that price.",
  "Null when the bar has no range (high equals low).",
]
sources = ["Nison (1991), Japanese Candlestick Charting Techniques: the upper shadow", "Bulkowski (2008), Encyclopedia of Candlestick Charts"]
[[field.use]]
for = "a long upper wick (sold off from the high)"
op = "gte"
value = 0.5
mode = "soft"
tolerance = 0.1
note = "with feature.stretch_sma20_atr gte 2 for a reversal warning after a run"

[[field]]
name = "rollup.candle@v1.lower_wick_share"
theme = "volume"
reads = "The share of the day's range below the body: how much of the session's low was bought back by the close, 0 to 1. Under 0.1 the close was at or near the low; above 0.5 half the range was recovered from the low (the shape of a hammer when the body is small and the upper wick short)."
caveats = [
  "A long lower wick means little in the middle of a range: it matters at a level where buyers are expected, so pair it with feature.dist_to_support.",
  "An earnings day or a gap open (rollup.earnings@v1.last_earnings_date) makes long wicks by nature.",
  "Null when the bar has no range (high equals low).",
]
sources = ["Nison (1991), Japanese Candlestick Charting Techniques: the lower shadow", "Bulkowski (2008), Encyclopedia of Candlestick Charts"]
[[field.use]]
for = "a long lower wick (bought back from the low)"
op = "gte"
value = 0.5
mode = "soft"
tolerance = 0.1
note = "with feature.dist_to_support lte 0.02 for the support reversal shape"

[[field]]
name = "rollup.candle@v1.body_vs_avg_20d"
theme = "volume"
reads = "Today's body (open to close) over the mean body of the 20 sessions before it: 1 is a body of the usual size, 2 twice the usual, 0.3 a much smaller one. Above 1.5 the day's move was unusual for this name; under 0.5 the day was quiet."
caveats = [
  "Bodies measure open to close, not the range: a large gap with a small body reads small here. rollup.trend_stats@v2.ret_z_20d is the close-to-close surprise.",
  "After a volatile month the base is inflated and a normal day reads small; after a quiet one a normal day reads large.",
  "Null when a session among the 20 before has no bar (a gap), the history is shorter, or those bodies were all zero.",
]
sources = ["Nison (1991), Japanese Candlestick Charting Techniques: the engulfing pattern's size", "Bulkowski (2008), Encyclopedia of Candlestick Charts"]
[[field.use]]
for = "a larger body than usual"
op = "gte"
value = 1.5
mode = "soft"
tolerance = 0.25
note = "with rollup.candle@v1.body_share gte 0.5 so the body is also most of the range"

[[field]]
name = "rollup.candle@v1.bar_relation"
theme = "volume"
reads = "How the day's high-low range sits against the previous day's. INSIDE: the range lies within the day before's (a pause, compression, the setup before a break). OUTSIDE: it covers the whole previous range (a wider swing, a shake-out or an expansion). UP_GAP: the whole day traded above yesterday's high; DOWN_GAP: the whole day below yesterday's low. OVERLAP: any other partial overlap, the ordinary case."
caveats = [
  "Inside days are common and inside days alone are not a signal: the direction comes from the day after (feature.inside_day_breakout) and from the trend (feature.trend_state).",
  "An earnings day or a news gap is an UP_GAP or DOWN_GAP by nature: check rollup.earnings@v1.last_earnings_date before reading a gap as a trend change; rollup.gaps@v1.gap_above tracks the gaps that stay open.",
  "Compares ranges with the previous session only: a name that traded no session yesterday has no relation (null).",
]
sources = ["Nison (1991), Japanese Candlestick Charting Techniques (the harami and the engulfing as inside and outside days)", "Crabel (1990), Day Trading with Short Term Price Patterns and Opening Range Breakout"]
[[field.use]]
for = "an inside day (a pause in the range)"
op = "eq"
value = "INSIDE"
mode = "hard"
note = "the day after is the breakout test; feature.inside_day_breakout is the confirmed form"
[[field.use]]
for = "not a gap day"
op = "in"
value = ["INSIDE", "OUTSIDE", "OVERLAP"]
mode = "hard"
note = "to keep the earnings and news gap days out of a pattern screen"

[[field]]
name = "rollup.candle@v1.prev_bar_relation"
theme = "volume"
reads = "The bar_relation of the previous session: how yesterday's range sat against the day before's (INSIDE, OUTSIDE, UP_GAP, DOWN_GAP, OVERLAP). It lets a screen ask what yesterday was while reading today: an INSIDE here and a close above yesterday's close today is the inside day breakout."
caveats = [
  "A label of yesterday, not today: for the shape of today's bar use rollup.candle@v1.bar_relation.",
  "Null when the previous session or the one before it has no bar.",
]
sources = ["Crabel (1990), Day Trading with Short Term Price Patterns and Opening Range Breakout", "Nison (1991), Japanese Candlestick Charting Techniques"]
[[field.use]]
for = "yesterday was an inside day"
op = "eq"
value = "INSIDE"
mode = "hard"
note = "with rollup.trend_stats@v2.ret_1d gt 0 for the break up; feature.inside_day_breakout is that pair"

[[field]]
name = "rollup.candle@v1.candle"
theme = "volume"
reads = "The named candle of the session: HAMMER (a long lower wick, a small upper wick, a body above a doji: sellers pushed the price down and buyers took it back), SHOOTING_STAR (the mirror: buyers pushed it up and sellers took it back), DOJI (open and close nearly equal: indecision), BULLISH_ENGULFING (a rising body that covers the previous falling body and is at least half an average body), BEARISH_ENGULFING (the mirror), else NONE. The first match wins, in that order: engulfing, hammer, shooting star, doji."
caveats = [
  "A single candle means little without its location: a hammer at support (feature.dist_to_support small) or after a run down means something; in the middle of a range it is noise. Bulkowski's tests put the reliability of most candles near a coin flip, a hammer or an engulfing in the right place a little better; use it as a filter on a setup, never as the setup.",
  "A shooting star or a bearish engulfing matters after a run up: check feature.stretch_sma20_atr (above 2) before reading it as a top.",
  "An earnings day makes gaps and engulfing bars by nature: check rollup.earnings@v1.last_earnings_date and drop the report day from a pattern screen.",
  "Null when the bar has no range (high equals low) or the previous session has no bar. An unknown 20-session average body never matches an engulfing candle: the bar then reads on as a hammer, a shooting star, a doji or NONE.",
]
sources = ["Nison (1991), Japanese Candlestick Charting Techniques", "Bulkowski (2008), Encyclopedia of Candlestick Charts: the reliability and the performance rank of each candle"]
[[field.use]]
for = "a hammer (at support or after a decline)"
op = "eq"
value = "HAMMER"
mode = "hard"
note = "with feature.dist_to_support lte 0.02, or feature.stretch_sma20_atr lte -2 after a run down"
[[field.use]]
for = "a shooting star (after a run up)"
op = "eq"
value = "SHOOTING_STAR"
mode = "hard"
note = "with feature.stretch_sma20_atr gte 2"
[[field.use]]
for = "a doji (indecision)"
op = "eq"
value = "DOJI"
mode = "hard"
[[field.use]]
for = "a bullish engulfing day"
op = "eq"
value = "BULLISH_ENGULFING"
mode = "hard"
note = "with rollup.momentum@v1.rel_volume gte 1.25 for the volume to confirm it"
[[field.use]]
for = "a bearish engulfing day"
op = "eq"
value = "BEARISH_ENGULFING"
mode = "hard"
note = "with feature.stretch_sma20_atr gte 2 for a reversal after a run up"

[[field]]
name = "feature.inside_day_breakout"
theme = "volume"
reads = "True when the session closed above the previous close and the previous session was an inside day (its range within the day before's): the squeeze of the quiet day resolved upward the day after. False for every other session; null when the return or the relation is unknown."
caveats = [
  "Closing above the previous close is a weak test of a breakout: it is not above the inside day's high or the mother bar's high. Gate on rollup.trend_stats@v2.close_range_pos gte 0.7 or feature.breakout_20d to ask for a real break.",
  "Direction only: an inside day inside a downtrend is a rest, not a base; gate on feature.trend_state eq UPTREND.",
  "An earnings day or a news gap the day after is the event, not the pattern: check rollup.earnings@v1.last_earnings_date.",
  "Null when yesterday or the day before has no bar, or the return is unknown.",
]
sources = ["Crabel (1990), Day Trading with Short Term Price Patterns and Opening Range Breakout", "Bulkowski (2008), Encyclopedia of Candlestick Charts"]
[[field.use]]
for = "an inside day broke up"
op = "eq"
value = true
mode = "hard"
note = "with feature.trend_state eq UPTREND and rollup.momentum@v1.rel_volume gte 1.25"

[[field]]
name = "feature.strong_close"
theme = "volume"
reads = "True when the session closed in the top 30% of its range (rollup.trend_stats@v2.close_range_pos at least 0.7) with a body of at least half the range (rollup.candle@v1.body_share at least 0.5): buyers held into the close and the day was not a doji or a long-wick spike. False otherwise; null for a bar with no range."
caveats = [
  "One day: a strong close on a quiet day means little. Pair with rollup.momentum@v1.rel_volume gte 1.25 or rollup.candle@v1.body_vs_avg_20d gte 1.",
  "The close can be strong because the day opened far below it (a gap up, an earnings day): check rollup.earnings@v1.last_earnings_date and rollup.gaps@v1.gap_open_pct.",
  "The 0.7 and 0.5 are fixed; for other cuts use the two fields directly.",
]
sources = ["Nison (1991), Japanese Candlestick Charting Techniques", "O'Neil (2009), How to Make Money in Stocks: the close in the upper part of the day's range on a breakout"]
[[field.use]]
for = "closed strong with conviction"
op = "eq"
value = true
mode = "hard"
note = "with rollup.momentum@v1.rel_volume gte 1.25 on a breakout day"
