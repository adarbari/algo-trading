# L3 site setting: the field guide (ADR 0041, amended 2026-10-06), one <theme>.toml per theme
# plus situations.toml; loaded together by config/site/settings.py load_field_guide. Every
# [[field]] says how to read one catalogue field, which criterion means what, and when the
# reading lies; a [[situation]] is one state of the world that fools several thresholds at once.
# The keys are documented in momentum.toml. Edit by PR; `make features-doc` renders the page.

[[field]]
name = "rollup.price_stats@v2.adv_usd_20d"
theme = "liquidity"
reads = "Average dollars traded a day over 20 sessions (close times volume). The usual sizing rule is to hold no more than 1% to 2% of a day's volume, so the threshold follows from the position: a $50,000 position wants about $5M a day, $500,000 wants $50M. $5M is 'some volume', $50M is liquid, $100M and above is very liquid; under $1M a day is where spreads and slippage dominate any edge."
caveats = [
  "An ETF's on-screen volume understates its liquidity: market makers create and redeem shares, so a fund with thin volume can still absorb a large order if its holdings are liquid. For funds (instrument.is_etf eq true) a low ADV is not disqualifying by itself.",
  "One event day (earnings, an index inclusion) lifts a 20-day average for 20 sessions; a name just over a threshold may be thinner than it looks. Check rollup.momentum@v1.rel_volume history through rollup.price_moves@v1.one_day_move.",
  "Dollar volume, not shares: a $2 stock trading 10M shares is $20M a day, the same as a $200 stock trading 100k shares, and the $2 one has a far wider spread. Pair with rollup.price_stats@v2.close.",
]
sources = [
  "The 1% to 2% of ADV sizing rule: https://daytradingtoolkit.com/dictionary/liquidity",
  "Position-level liquidity (days to exit, share of daily volume): https://www.alphatheory.com/blog/managing-portfolio-liquidity-position-level-calculation",
]
[[field.use]]
for = "liquid (a $500k position)"
op = "gte"
value = 50000000
mode = "soft"
tolerance = { relative = 0.2 }
on_miss = "LIQUIDITY_RISK"
note = "'very liquid' 100000000; 'some volume' 5000000; or feature.liquidity_class in [HIGH, MEDIUM]"
[[field.use]]
for = "tradable at all (a small account)"
op = "gte"
value = 5000000
mode = "soft"
tolerance = { relative = 0.2 }
on_miss = "LIQUIDITY_RISK"

[[field]]
name = "rollup.price_stats@v2.close"
theme = "liquidity"
reads = "The session's closing price in dollars. Under $5 is 'penny' territory (many brokers and funds exclude it; the tick is a large share of the price); under $10 spreads and ATR as a share of price are elevated; a price floor is almost always a hard gate."
caveats = [
  "A high price is not 'expensive' and a low price is not 'cheap'; valuation is feature.pe_ratio and size is feature.market_cap.",
  "Split-adjusted history: a stock that reverse-split 1:10 last month shows a continuous series and a 'high' price with the same thin market it had before.",
]
sources = ["Broker and index conventions (the $5 penny-stock line)"]
[[field.use]]
for = "a price floor"
op = "gt"
value = 10
mode = "hard"
note = "5 for a looser floor; 'penny stocks' is close lt 5"

[[field]]
name = "feature.liquidity_class"
theme = "liquidity"
reads = "HIGH when every HIGH threshold holds ($100M a day, close at least $10, option tier A, chain open interest 50k and volume 5k), MEDIUM when every MEDIUM one does ($10M, $5, tier A or B, open interest 5k), else LOW; UNKNOWN when an input is missing. A composite for stock plus options liquidity in one word."
caveats = [
  "It bundles option liquidity: a very liquid stock with no options is LOW. For a stock-only screen use rollup.price_stats@v2.adv_usd_20d instead.",
  "UNKNOWN, not LOW, when the chain run did not cover the session; a hard 'in [HIGH, MEDIUM]' rejects those names on a day the chains failed.",
]
sources = ["Site thresholds (config/site/features/company/liquidity.toml)"]
[[field.use]]
for = "liquid stock and options"
op = "in"
value = ["HIGH", "MEDIUM"]
mode = "hard"

[[field]]
name = "feature.option_tier"
theme = "liquidity"
reads = "The worse of the put and call liquidity tiers at the target expiry, A (tight, deep) to D (no usable options). A and B are tradable for a retail account; C fills badly; D has no usable series. The tiers come from the near-the-money spread as a share of the mid, open interest and volume."
caveats = [
  "Graded at the target expiry (30 to 45 days); a weekly or a far LEAPS series can be worse. For a specific expiry read rollup.option_liquidity@v1.put_spread_pct and call_spread_pct.",
  "Null when the session's chain run failed for the name (STALE_DATA, FETCH_ERROR), which is not the same as D; a hard criterion rejects it that day.",
]
sources = [
  "Options liquidity checklist (volume, open interest, spread, size): https://www.tastylive.com/concepts-strategies/options-liquidity",
  "Spread as a share of the premium (a $0.20 spread on a $2 option is 10% round trip): https://www.thetaedge.ai/blog/assess-liquidity-trading-options",
]
[[field.use]]
for = "tradable options"
op = "in"
value = ["A", "B"]
mode = "hard"
note = "add instrument.optionable eq true; A alone for 'tight spreads'"

[[field]]
name = "feature.option_chain_oi"
theme = "liquidity"
reads = "Open interest summed over the chain: contracts outstanding. Thousands is a thin chain, tens of thousands is tradable, hundreds of thousands and above is an index-like chain. It measures depth for exiting a position; a strike you trade can still be empty, so it is a gate, not a guarantee."
caveats = [
  "0 when the session's chain run did not list the name (no options), null when the run failed; the two differ.",
  "Open interest piles up at a few strikes and expiries; the chain total says little about the strike you want. Check rollup.option_liquidity@v1.put_strike_oi for the target strike.",
]
sources = ["https://www.tastylive.com/concepts-strategies/options-liquidity"]
[[field.use]]
for = "a chain with depth"
op = "gte"
value = 10000
mode = "soft"
tolerance = { relative = 0.3 }
on_miss = "LIQUIDITY_RISK"
note = "50000 for 'deep'; the site's HIGH class uses 50000, MEDIUM 5000"

[[field]]
name = "feature.option_chain_volume"
theme = "liquidity"
reads = "Contracts traded across the chain on the session. Hundreds is quiet, a few thousand is active, tens of thousands is heavy. Volume is one day's activity, open interest the standing depth; both low means fills at the market maker's price."
caveats = [
  "An earnings week or an expiry Friday multiplies option volume; check rollup.earnings@v1.days_to_earnings before reading a spike as unusual activity.",
  "0 when the run did not list the name, null when it failed.",
]
sources = ["https://www.tastylive.com/concepts-strategies/options-liquidity"]
[[field.use]]
for = "active options"
op = "gte"
value = 1000
mode = "soft"
tolerance = { relative = 0.3 }
on_miss = "LIQUIDITY_RISK"

[[field]]
name = "rollup.option_liquidity@v1.put_spread_pct"
theme = "liquidity"
reads = "The bid-ask spread of the short put at the target expiry as a share of its mid, on the stored after-close quote: 0.10 means a $0.20 spread on a $2.00 option, the round-trip cost of being wrong by nothing. Under 0.10 is tight, 0.10 to 0.20 is tradable with limit orders, above 0.30 the spread eats the premium."
caveats = [
  "Stored after the close, when market makers widen quotes: a wide reading can be a quiet print, a tight one can be stale. Judge a trade on a live quote (the chain's live read) and keep this one as a score, as the VRP scanner does.",
  "The strike is the group's own short strike, not necessarily the one you would trade; rollup.put_wing@v1.best_put_spread_pct is the spread at the best put.",
  "Null without a two-sided quote at the target expiry (rollup.option_liquidity@v1.liq_status says why).",
]
sources = ["Spread as a share of the premium: https://www.thetaedge.ai/blog/assess-liquidity-trading-options"]
[[field.use]]
for = "a tradable spread (scored)"
op = "lt"
value = 0.15
mode = "score"
tolerance = 0.15
note = "full points under 15% of mid, none at 30%"
[[field.use]]
for = "tight spreads"
op = "lte"
value = 0.10
mode = "soft"
tolerance = 0.05
on_miss = "LIQUIDITY_RISK"

[[field]]
name = "rollup.option_liquidity@v1.put_zone_oi"
theme = "liquidity"
reads = "Open interest of the target expiry's puts with a delta between 0.15 and 0.40: the standing depth where a short put would be sold. Hundreds is thin, a few thousand is tradable, tens of thousands is deep. A chain can carry a large total (feature.option_chain_oi) with nothing in this zone."
caveats = [
  "Open interest is yesterday's standing book, not today's activity; pair with rollup.put_wing@v1.best_put_volume for whether anyone trades it.",
  "Null without a target expiry or a standard series (rollup.option_liquidity@v1.liq_status).",
]
sources = ["https://www.tastylive.com/concepts-strategies/options-liquidity"]
[[field.use]]
for = "depth where a put would be sold"
op = "gte"
value = 2000
mode = "soft"
tolerance = { relative = 0.5 }
on_miss = "LIQUIDITY_RISK"

[[field]]
name = "rollup.put_wing@v1.best_put_oi"
theme = "liquidity"
reads = "Open interest of the best put: the put at the target expiry nearest the 8 to 15 delta band (rollup.put_wing@v1.best_put_strike and best_put_delta name it). Above 1,000 contracts is the VRP scanner's full-score level; under 100 the exit depends on one market maker."
caveats = [
  "A single strike's open interest moves with one institutional position; a round 5,000 at one strike with 50 at its neighbours is one trade, not a liquid wing. Check rollup.put_wing@v1.wing_oi for the band's total.",
  "Null when no put at the target expiry has our delta in 0.05 to 0.35 (rollup.put_wing@v1.wing_status NO_STRIKE).",
]
sources = ["docs/screeners/vrp-scanner.md (owner decision 2026-10-04: liquidity scored, not gated)"]
[[field.use]]
for = "a put with standing depth (scored)"
op = "gt"
value = 1000
mode = "score"
tolerance = { relative = 1.0 }
note = "full points above 1,000 contracts, none at 0"

[[field]]
name = "rollup.put_wing@v1.best_put_volume"
theme = "liquidity"
reads = "Contracts of the best put traded on the session. Volume is today's activity where open interest is the standing book; a few hundred is active for a single strike, above 1,000 is the VRP scanner's full-score level, 0 on a quiet day is common even on liquid names."
caveats = [
  "One day's volume is noisy: an expiry Friday or an earnings week multiplies it, a holiday week halves it. Read it with rollup.put_wing@v1.best_put_oi, which does not reset each day.",
  "Null without a best put (rollup.put_wing@v1.wing_status).",
]
sources = ["https://www.tastylive.com/concepts-strategies/options-liquidity"]
[[field.use]]
for = "a put that trades (scored)"
op = "gt"
value = 1000
mode = "score"
tolerance = { relative = 1.0 }
note = "full points above 1,000 contracts, none at 0"

[[field]]
name = "rollup.put_wing@v1.best_put_spread_pct"
theme = "liquidity"
reads = "The best put's bid-ask spread as a share of its mid on the stored after-close quote: 0.15 means the spread is 15% of the premium. Under 0.15 is the VRP scanner's full-score level, 0.30 and above scores nothing; the trade itself is judged on a live quote."
caveats = [
  "After-close quotes are wide by nature; the live spread during the session is what a fill costs. Score it, never gate on it (owner decision 2026-10-04).",
  "A cheap far-out-of-the-money put has a wide spread in percent of a tiny mid even when the dollar spread is a nickel; read rollup.put_wing@v1.best_put_mid with it.",
  "Null without a best put (rollup.put_wing@v1.wing_status).",
]
sources = ["docs/screeners/vrp-scanner.md; https://www.thetaedge.ai/blog/assess-liquidity-trading-options"]
[[field.use]]
for = "a fillable spread (scored)"
op = "lt"
value = 0.15
mode = "score"
tolerance = 0.15
note = "full points under 15% of mid, none at 30%"

[[field]]
name = "rollup.put_wing@v1.delta_band_distance"
theme = "liquidity"
reads = "How far the best put's delta is from the 8 to 15 delta band: 0 inside it, else the distance to the nearer edge (a 20 delta put reads 0.05, a 5 delta put 0.03). The VRP scanner scores it rather than gating: a 20 delta put still scores, a 25 delta one less, and nothing is filtered on delta."
caveats = [
  "The best put is chosen among our 0.05 to 0.35 delta puts, so the field never exceeds 0.20; a name whose only puts are nearer the money has no best put at all (null, rollup.put_wing@v1.wing_status NO_STRIKE).",
  "Delta is ours (ADR 0021), from the stored chain: on a name whose price moved after the close the band has moved too; confirm on a live quote.",
]
sources = ["docs/screeners/vrp-scanner.md (owner decision 2026-10-04: strike choice scored)"]
[[field.use]]
for = "a put in the 8 to 15 delta band (scored)"
op = "lte"
value = 0
mode = "score"
tolerance = 0.20
note = "full points inside the band, none at 0.20 away"

[[field]]
name = "feature.option_chain_known"
theme = "liquidity"
reads = "True when the session's chain run says what the name's options are: its fetch succeeded, or it did not list the name at all (no options). False when the fetch failed for the name (STALE_DATA, FETCH_ERROR, NOT_ATTEMPTED). It separates 'no options' (known, true with a tier of D) from 'we do not know today'."
caveats = [
  "Null when the chains step did not run for the session at all; the option fields are then null for every name, and a hard option criterion empties the screen. A soft criterion lists the names instead.",
]
sources = ["ADR 0043 (the chains step's acceptance); config/site/features/company/liquidity.toml"]
[[field.use]]
for = "the options are known today"
op = "eq"
value = true
mode = "soft"
tolerance = 0
on_miss = "LIQUIDITY_RISK"

[[field]]
name = "feature.liquidity_high"
theme = "liquidity"
reads = "True when every HIGH threshold holds: $100M a day of stock volume, a close of at least $10, option tier A on both sides, 50,000 of chain open interest and 5,000 of chain volume. The flag behind feature.liquidity_class HIGH: a name that absorbs a large position in stock and options alike."
caveats = [
  "Null (not false) when a threshold cannot be checked because an input is unknown, usually the options on a day the chain fetch failed; feature.liquidity_class says UNKNOWN then.",
  "Stock-only screens do not need the option conditions: use rollup.price_stats@v2.adv_usd_20d.",
]
sources = ["config/site/features/company/liquidity.toml (the HIGH params)"]
[[field.use]]
for = "the most liquid names"
op = "eq"
value = true
mode = "hard"
note = "or feature.liquidity_class eq HIGH"

[[field]]
name = "feature.liquidity_medium"
theme = "liquidity"
reads = "True when every MEDIUM threshold holds: $10M a day, a close of at least $5, option tier A or B, 5,000 of chain open interest. The flag behind feature.liquidity_class MEDIUM: tradable for a retail account in both stock and options."
caveats = [
  "A name that is HIGH is MEDIUM too (the thresholds nest); 'MEDIUM but not HIGH' needs both flags.",
  "Null when an input is unknown.",
]
sources = ["config/site/features/company/liquidity.toml (the MEDIUM params)"]
[[field.use]]
for = "tradable in stock and options"
op = "eq"
value = true
mode = "hard"
note = "or feature.liquidity_class in [HIGH, MEDIUM]"

# Skew, skew rank and the IV term structure (skew@v1, skew_history@v1, iv_term@v1, positioning.toml):
# theme "implied volatility"; filed here because the volume and option-chain guide files reached their line cap.

[[field]]
name = "rollup.skew@v1.skew_status"
theme = "implied volatility"
reads = "Whether the 30-day skew has a value: OK (two expiries around 30 days), SINGLE_EXPIRY (one usable expiry, its vols unchanged, still a value), or the first failing step: NO_SPOT, NO_CHAIN, NO_EXPIRY (none 7 to 90 days out), NO_ATM (no ATM vol from the two-sided, tight quotes) or NO_WING (an ATM vol, but the 25-delta strikes are not bracketed on a side)."
caveats = [
  "NO_ATM and NO_WING are thin chains: skew is computed only from quotes within 35% spread, never guessed, so a name with a sparse chain reads null rather than wrong.",
]
sources = ["Site convention (features/rollups/positioning/skew.py)"]
[[field.use]]
for = "a priced skew"
op = "eq"
value = "OK"
mode = "soft"
tolerance = 0
note = "the near miss is SINGLE_EXPIRY, one expiry's skew rather than the 30-day one"

[[field]]
name = "rollup.skew@v1.skew"
theme = "implied volatility"
reads = "The normalised 25-delta skew at 30 days: (put vol at delta -0.25 minus call vol at +0.25) over the ATM vol. Positive means puts are richer than calls, the normal shape for stocks: about 0.10 to 0.20 is ordinary, above about 0.25 puts are rich (downside protection is expensive: collar and put-spread sellers like it, a put buyer pays up), near 0 flat, negative call-rich (a takeover, a squeeze, a meme name where the upside is what is bid). Dividing by ATM vol makes a 20-vol and an 80-vol name comparable."
caveats = [
  "The level of a skew is partly structural: index ETFs sit high, single names lower, and a name's own history matters more than the cross-section; rollup.skew_history@v1.skew_rank_252d says where it is for the name, but is null for the first 60 sessions of stored chains.",
  "Our delta at each contract's own IV, from after-close mids of tight quotes; one stale wing quote moves it. Read rollup.skew@v1.skew_status and compare rollup.skew@v1.ne_skew, which should agree in sign.",
  "An earnings report inside 30 days lifts the ATM vol and the wings differently, so the ratio can move with no change in sentiment; check rollup.earnings@v1.days_to_earnings.",
  "Null when the status is not OK or SINGLE_EXPIRY.",
]
sources = [
  "Risk reversal and skew: https://www.investopedia.com/terms/r/risk-reversal.asp",
  "Normalising the risk reversal by ATM vol: Sinclair (2013), Volatility Trading",
]
[[field.use]]
for = "puts rich (a steep put skew)"
op = "gte"
value = 0.25
mode = "soft"
tolerance = 0.05
note = "with rollup.skew@v1.skew_status eq OK; prefer rollup.skew_history@v1.skew_rank_252d gte 0.8 once a rank exists"
[[field.use]]
for = "call-rich skew (calls priced above puts)"
op = "lte"
value = -0.05
mode = "soft"
tolerance = 0.05
note = "rare; check for a pending takeover or a squeeze (rollup.price_moves@v1.one_day_move)"

[[field]]
name = "rollup.skew@v1.iv_25p"
theme = "implied volatility"
reads = "The put vol at our delta -0.25 interpolated to 30 days, as a fraction: 0.34 is 34%. The price of downside protection one quarter of the way out of the money, in vol terms; compared with rollup.skew@v1.iv_atm it is the put wing's premium."
caveats = [
  "Linear in delta between the two quotes around -0.25, in total variance across expiries; no extrapolation, so a chain that does not reach a 25-delta put is null (NO_WING), not clipped.",
  "Null when the skew status is not OK or SINGLE_EXPIRY.",
]
sources = ["Site convention (docs/data/positioning.md OP3)"]
[[field.use]]
for = "expensive downside puts"
op = "gte"
value = 0.40
mode = "soft"
tolerance = 0.05
note = "an absolute level; prefer feature.skew_rr25 or rollup.skew@v1.skew for the shape"

[[field]]
name = "rollup.skew@v1.iv_25c"
theme = "implied volatility"
reads = "The call vol at our delta +0.25 interpolated to 30 days, as a fraction. The price of upside, one quarter of the way out of the money; below rollup.skew@v1.iv_25p on a normal stock, above it when calls are bid."
caveats = [
  "Same construction and nulls as rollup.skew@v1.iv_25p.",
]
sources = ["Site convention (docs/data/positioning.md OP3)"]
[[field.use]]
for = "calls bid above the ATM vol"
op = "gte"
value = 0.40
mode = "soft"
tolerance = 0.05
note = "with rollup.skew@v1.skew lte 0 for a call-rich skew"

[[field]]
name = "rollup.skew@v1.iv_atm"
theme = "implied volatility"
reads = "The at-the-money vol the skew is measured against: the mean of the call vol at delta +0.50 and the put vol at -0.50, interpolated to 30 days, as a fraction. Close to rollup.iv30@v1.iv30 (another method, the forward-strike average) and within a few points of it on a liquid name."
caveats = [
  "Both a +0.50 call and a -0.50 put must bracket, otherwise the status is NO_ATM and the vol is null; prefer rollup.iv30@v1.iv30 for a plain 30-day ATM vol.",
]
sources = ["Site convention (docs/data/positioning.md OP3)"]
[[field.use]]
for = "a name that is volatile at the money"
op = "gte"
value = 0.40
mode = "soft"
tolerance = 0.05

[[field]]
name = "rollup.skew@v1.ne_skew"
theme = "implied volatility"
reads = "The same normalised 25-delta skew at the next expiry (the first listed one at least one day out, weeklies included), with no interpolation. The skew of the nearest event or weekly pin rather than of the month; compare it with rollup.skew@v1.skew: a next-expiry skew far above the 30-day one means the near-term downside is what is bid."
caveats = [
  "Very short expiries have 25-delta strikes close to the money and noisy vols: read rollup.skew@v1.ne_dte and ignore it under about 7 days.",
  "Null when the next expiry has no ATM vol or no 25-delta put and call among its tight quotes, whatever the 30-day status is.",
]
sources = ["Site convention (docs/data/positioning.md OP3)"]
[[field.use]]
for = "near-term puts rich"
op = "gte"
value = 0.25
mode = "soft"
tolerance = 0.05
note = "with rollup.skew@v1.ne_dte gte 7 so a pinned weekly is not read as a view"

[[field]]
name = "rollup.skew@v1.ne_dte"
theme = "implied volatility"
reads = "Calendar days from the session to the next expiry, the one rollup.skew@v1.ne_skew reads: 1 to 7 on a name with weeklies, up to a month on a monthly-only chain."
caveats = [
  "Weekly and daily expiries make it small on liquid names; a screen on ne_skew should floor it.",
]
sources = ["Site convention (docs/data/positioning.md OP3)"]
[[field.use]]
for = "a next expiry far enough out to read"
op = "gte"
value = 7
mode = "soft"
tolerance = 2

[[field]]
name = "feature.skew_rr25"
theme = "implied volatility"
reads = "The raw 25-delta risk reversal at 30 days: put vol minus call vol in vol points as a fraction (0.06 is six points). Positive: puts richer than calls. What a collar or a put spread is quoted in; rollup.skew@v1.skew divides it by the ATM vol to compare names of different vol level."
caveats = [
  "A high-vol name has a large raw reversal at an ordinary skew: compare names through rollup.skew@v1.skew, one name over time through either.",
  "Null when the skew status is not OK or SINGLE_EXPIRY.",
]
sources = ["Risk reversal: https://www.investopedia.com/terms/r/risk-reversal.asp"]
[[field.use]]
for = "puts at least six vol points over calls"
op = "gte"
value = 0.06
mode = "soft"
tolerance = 0.01
note = "with rollup.skew@v1.skew gte 0.2 so a high-vol name is not read as skewed"

[[field]]
name = "rollup.skew_history@v1.skew_rank_252d"
theme = "implied volatility"
reads = "Skew rank, 0 to 1: where today's 30-day skew sits between the year's lowest and highest. Above 0.8 is a stretched put premium for the name (puts are as rich as they have been this year), below 0.2 the flattest. The year the rank needs is built from stored chains, which start on 2026-10-02: every name reads null until it has 60 sessions with a skew (about the end of 2026), and a full year around October 2027."
caveats = [
  "One spike sets the year's maximum and squashes later readings, as for IV rank; rollup.skew_history@v1.skew_percentile_252d is the robust cross-check.",
  "A short window is a short sample: PROVISIONAL (rollup.skew_history@v1.skew_rank_status) means under a year of skews, so a rank near 1 can be an ordinary day.",
  "Null while skew_rank_status is UNKNOWN, with no skew today, or when every skew in the window is equal.",
]
sources = ["https://flashalpha.com/articles/iv-rank-vs-iv-percentile-difference-which-matters (the same rank construction)"]
[[field.use]]
for = "a stretched put premium for the name"
op = "gte"
value = 0.8
mode = "soft"
tolerance = 0.1
note = "with rollup.skew_history@v1.skew_rank_status in PROVISIONAL or FULL"

[[field]]
name = "rollup.skew_history@v1.skew_percentile_252d"
theme = "implied volatility"
reads = "The share of the last 252 sessions' skews below today's, 0 to 1. The robust companion of rollup.skew_history@v1.skew_rank_252d: one extreme day does not distort it."
caveats = [
  "Null while the rank status is UNKNOWN (fewer than 60 sessions with a skew), with no skew today, or without an earlier skew.",
]
sources = ["https://flashalpha.com/articles/iv-rank-vs-iv-percentile-difference-which-matters"]
[[field.use]]
for = "puts richer than on most days of the year"
op = "gte"
value = 0.8
mode = "soft"
tolerance = 0.1

[[field]]
name = "rollup.skew_history@v1.history_days"
theme = "implied volatility"
reads = "Sessions of the 252-session window with a 30-day skew, today included: 60 is the floor for a rank, 252 a full year. Chains are stored from 2026-10-02, so counts are short for every name until a year has passed."
caveats = [
  "A session with no skew (no chain, or a chain with no 25-delta wing) is a gap, not filled.",
]
sources = ["Site convention (docs/data/positioning.md OP3)"]
[[field.use]]
for = "enough history for a skew rank"
op = "gte"
value = 60
mode = "hard"

[[field]]
name = "rollup.skew_history@v1.skew_rank_status"
theme = "implied volatility"
reads = "How complete the skew history is for the rank: UNKNOWN below 60 sessions with a skew (no rank), PROVISIONAL below 252, FULL from 252. Every name is UNKNOWN until about the end of 2026."
caveats = [
  "PROVISIONAL over a short window makes an ordinary skew rank near 1; read rollup.skew@v1.skew with it.",
]
sources = ["Site convention (docs/data/positioning.md OP3)"]
[[field.use]]
for = "a rank over a full year"
op = "eq"
value = "FULL"
mode = "soft"
tolerance = 0
note = "the near miss is PROVISIONAL"

[[field]]
name = "rollup.iv_term@v1.iv_term_status"
theme = "implied volatility"
reads = "Whether the term points have values: OK (both), or the first failing step: NO_SPOT, NO_CHAIN, NO_NEXT (no ATM vol at the next expiry) or NO_90D (no pair of expiries 30 to 180 days out around 90 days with ATM vols). The side that exists keeps its value."
caveats = [
  "A single listed expiry in the 30 to 180 day window is not a 90-day vol: NO_90D, where rollup.iv30@v1.iv30_status would say SINGLE_EXPIRY.",
]
sources = ["Site convention (features/rollups/positioning/iv_term.py)"]
[[field.use]]
for = "both term points priced"
op = "eq"
value = "OK"
mode = "hard"

[[field]]
name = "rollup.iv_term@v1.iv_next"
theme = "implied volatility"
reads = "The at-the-money vol at the next expiry (the first listed one at least one day out, weeklies included), as a fraction: iv30's method on that single expiry. Above rollup.iv30@v1.iv30 when an event sits in the nearest expiry; feature.term_ratio_next_30 is that comparison."
caveats = [
  "A few days to expiry make it noisy, and pin risk bids the at-the-money options; read rollup.skew@v1.ne_dte for how many days out it is.",
  "Null when the status is NO_SPOT, NO_CHAIN or NO_NEXT.",
]
sources = ["Site convention (docs/data/positioning.md)"]
[[field.use]]
for = "a high near-term vol"
op = "gte"
value = 0.60
mode = "soft"
tolerance = 0.1
note = "with feature.term_ratio_next_30 gte 1.3 to know it is an event, not the name's level"

[[field]]
name = "rollup.iv_term@v1.iv_90d"
theme = "implied volatility"
reads = "Our constant 90-day at-the-money vol as a fraction: the two expiries around 90 days among 30 to 180 days out (standard monthlies first), each priced as in rollup.iv30@v1.iv30, interpolated in total variance. The back of the term structure: the vol the market charges for a quarter."
caveats = [
  "Needs both expiries of the pair with ATM vols: a thin back month makes it null (NO_90D) and the term ratio with it.",
  "A name's back vol sits near its long-run level; a front vol far above it is stress or an event, far below it is calm.",
]
sources = ["Site convention (docs/data/positioning.md)"]
[[field.use]]
for = "a high long-dated vol"
op = "gte"
value = 0.40
mode = "soft"
tolerance = 0.05

[[field]]
name = "feature.term_ratio_30_90"
theme = "implied volatility"
reads = "The front of the vol term structure over the back: our 30-day ATM vol over the 90-day one. 1 is flat; above 1 is backwardation (the front richer than the back: an event or stress is priced near, calendars sell the front), above about 1.1 a clear one; below 1 is contango, the normal shape, below about 0.9 steep (calendars buy the front cheaply)."
caveats = [
  "An earnings date inside 30 days (rollup.earnings@v1.days_to_earnings) lifts the 30-day vol and the ratio with it, with no stress in the market; feature.term_ratio_next_30 isolates the front expiry.",
  "The two vols come from different expiries and spot rules (the 30-day one reads the feed's price, the 90-day one the close), a small error against a 0.1 threshold.",
  "Null when either vol is null; a single usable expiry is not a 90-day vol.",
]
sources = ["Term structure of implied volatility and calendar spreads: Natenberg, Option Volatility and Pricing"]
[[field.use]]
for = "backwardation (the front richer than the back)"
op = "gte"
value = 1.1
mode = "soft"
tolerance = 0.05
note = "with rollup.earnings@v1.days_to_earnings gt 30 to rule out a report"
[[field.use]]
for = "steep contango (the front cheap against the back)"
op = "lte"
value = 0.9
mode = "soft"
tolerance = 0.05

[[field]]
name = "feature.term_ratio_next_30"
theme = "implied volatility"
reads = "The front-expiry premium: the ATM vol at the next expiry over the 30-day vol. 1 is no premium; above 1.2 an event (earnings, a ruling) is priced into the nearest expiry, above about 1.3 clearly so. After the event the premium drops out."
caveats = [
  "A next expiry a few days out is noisy and pin-bid: read rollup.skew@v1.ne_dte and floor it near 7 days.",
  "A name with weeklies has a different next expiry from one with monthlies only, so ratios of the two are not like for like.",
  "Null when either vol is null.",
]
sources = ["Event vol in the front expiry: https://www.tastylive.com/concepts-strategies/implied-volatility-earnings"]
[[field.use]]
for = "an event priced into the nearest expiry"
op = "gte"
value = 1.3
mode = "soft"
tolerance = 0.1
note = "with rollup.skew@v1.ne_dte gte 7"

# The session's bar shape and the named candles (candle@v1, and the inside_day_breakout and
# strong_close expressions in config/site/features/technical/swing.toml): what the day's open, high, low
# and close say on their own. A single candle means little without where it formed. Filed under
# "volume" because the momentum and price-level pages are at their 1000-line cap.
