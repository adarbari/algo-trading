# L3 site setting: the field guide (ADR 0041, amended 2026-10-06), one <theme>.toml per theme
# plus situations.toml; loaded together by config/site/settings.py load_field_guide. Every
# [[field]] says how to read one catalogue field, which criterion means what, and when the
# reading lies; a [[situation]] is one state of the world that fools several thresholds at once.
# The keys are documented in momentum.toml. Edit by PR; `make features-doc` renders the page.

# The put wing (put_wing@v1): the short put to sell at the 30..60 day expiry nearest 45 days,
# aiming for 8..15 delta (ours, ADR 0021); the open-interest walls (oi_walls@v1); the nearest
# listed expiry (nearest_expiry@v1).

[[field]]
name = "rollup.put_wing@v1.wing_status"
theme = "put wing, walls and expiries"
reads = "Whether the best put was found: OK (its delta is inside 0.08 to 0.15), OUTSIDE_BAND (a best put exists between 0.05 and 0.35 delta but outside the band; rollup.put_wing@v1.delta_band_distance says how far), or the first failing step: NO_SPOT, NO_CHAIN (no puts), NO_EXPIRY (none 30 to 60 days out), NO_STRIKE (no put with our delta in 0.05 to 0.35)."
caveats = [
  "OUTSIDE_BAND is not a failure: the VRP scanner scores the distance rather than rejecting (owner, 2026-10-04). A hard 'eq OK' is stricter than the preset.",
  "NO_STRIKE on a liquid name usually means a high-priced stock whose strike ladder skips the band, or every far put lacked a two-sided quote (rollup.put_wing@v1.n_unpriced).",
]
sources = ["docs/screeners/vrp-scanner.md (owner decisions 2026-10-04)"]
[[field.use]]
for = "a best put in the 8 to 15 delta band"
op = "eq"
value = "OK"
mode = "soft"
tolerance = 0
note = "the near miss is OUTSIDE_BAND; score rollup.put_wing@v1.delta_band_distance instead of gating"

[[field]]
name = "rollup.put_wing@v1.target_expiry"
theme = "put wing, walls and expiries"
reads = "The expiry of the best put: the one nearest 45 calendar days among those 30 to 60 days out, standard monthlies first (open interest concentrates there; a weekly nearer 45 days is usually thin). A date to show with the strike; rollup.put_wing@v1.target_dte is the days."
caveats = [
  "Null when no expiry sits 30 to 60 days out (a name with monthlies only can have a gap right after an expiry).",
  "Different from rollup.option_liquidity@v1.target_expiry (near 35 days) and rollup.nearest_expiry@v1.expiry_date (the front one).",
]
sources = ["docs/screeners/vrp-scanner.md"]
[[field.use]]
for = "has a wing expiry"
op = "not_null"
mode = "hard"

[[field]]
name = "rollup.put_wing@v1.target_dte"
theme = "put wing, walls and expiries"
reads = "Calendar days to the best put's expiry, 30 to 60 by construction and near 45: the premium-selling sweet spot where time decay is fast and gamma still moderate. Nearer 30 the position decays faster but a move hurts more; nearer 60 it is slower and calmer."
caveats = [
  "The VRP scanner holds to expiry, so a report before it is the risk to check: feature.earnings_before_expiry is for the nearest expiry, not this one; compare rollup.earnings@v1.days_to_earnings (sessions) with this (calendar days, roughly 1.4 sessions per 2 days).",
]
sources = ["tastylive on 45 days to expiry; docs/screeners/vrp-scanner.md"]
[[field.use]]
for = "around 45 days to expiry"
op = "between"
value = [35, 55]
mode = "soft"
tolerance = 5

[[field]]
name = "rollup.put_wing@v1.n_unpriced"
theme = "put wing, walls and expiries"
reads = "Puts at the target expiry that have no delta of ours (no two-sided quote, or the implied-volatility inversion failed): they can never be the best put. A few far wings are normal; a large share of the expiry means the chain was quoted one-sided after the close and the wing columns rest on few strikes."
caveats = [
  "Compare with rollup.put_wing@v1.n_strikes: many unpriced and few band strikes says 'quote problem', not 'no market'.",
]
sources = ["Site convention (features/rollups/options/put_wing.py)"]
[[field.use]]
for = "the expiry's puts were priced"
op = "lte"
value = 10
mode = "soft"
tolerance = 10

[[field]]
name = "rollup.put_wing@v1.n_strikes"
theme = "put wing, walls and expiries"
reads = "How many strikes at the target expiry have a put with our delta inside 0.08 to 0.15: the choice available in the band. 0 means no put in the band (the best put is outside it), 1 or 2 is normal for a strike ladder in $5 steps, 4 or more is a finely struck, usually liquid, name."
caveats = [
  "0 with wing_status OUTSIDE_BAND is a ladder gap, common on high-priced stocks; the best put is then the nearest outside the band and its distance is scored.",
]
sources = ["Site convention"]
[[field.use]]
for = "a strike inside the band"
op = "gte"
value = 1
mode = "soft"
tolerance = 1

[[field]]
name = "rollup.put_wing@v1.wing_oi"
theme = "put wing, walls and expiries"
reads = "Open interest summed over the puts inside the 8 to 15 delta band at the target expiry: the standing depth of the wing a short put is sold into. Under 500 is thin, a few thousand is tradable, tens of thousands is a popular wing. 0 when no put is in the band."
caveats = [
  "A single strike can hold all of it (one institutional hedge); rollup.put_wing@v1.best_put_oi is the chosen strike alone, and the two together say whether the depth is spread across the band.",
  "Standing positions, not today's activity: rollup.put_wing@v1.wing_volume is the day's trades.",
]
sources = ["https://www.tastylive.com/concepts-strategies/options-liquidity"]
[[field.use]]
for = "a wing with depth"
op = "gte"
value = 2000
mode = "soft"
tolerance = { relative = 0.5 }
on_miss = "LIQUIDITY_RISK"

[[field]]
name = "rollup.put_wing@v1.wing_volume"
theme = "put wing, walls and expiries"
reads = "Contracts traded on the session across the puts in the 8 to 15 delta band at the target expiry: whether the wing trades today. A few hundred is active for one expiry's wing; 0 on a quiet day is common even on liquid names."
caveats = [
  "Daily and noisy; read with rollup.put_wing@v1.wing_oi.",
]
sources = ["https://www.tastylive.com/concepts-strategies/options-liquidity"]
[[field.use]]
for = "the wing trades"
op = "gte"
value = 200
mode = "soft"
tolerance = { relative = 0.5 }
on_miss = "LIQUIDITY_RISK"

[[field]]
name = "rollup.put_wing@v1.wing_spread_pct"
theme = "put wing, walls and expiries"
reads = "The median bid-ask spread as a share of mid across the puts in the 8 to 15 delta band, on the stored after-close quotes. Far wings quote wide in percent because their mids are small: 0.15 is good for a wing, 0.30 is usual on a mid-cap, above 0.50 the band is not really made."
caveats = [
  "A $0.05 spread on a $0.20 put is 25%: a wide percentage can be a nickel. Read rollup.put_wing@v1.best_put_mid with it.",
  "After-close quotes; judge live. Null when no put is in the band.",
]
sources = ["https://www.thetaedge.ai/blog/assess-liquidity-trading-options"]
[[field.use]]
for = "a wing that is made (scored)"
op = "lt"
value = 0.20
mode = "score"
tolerance = 0.20
note = "full points under 20% of mid, none at 40%"

[[field]]
name = "rollup.put_wing@v1.best_put_strike"
theme = "put wing, walls and expiries"
reads = "The strike of the best put: among puts with our delta between 0.05 and 0.35, the one nearest the 8 to 15 delta band, then the highest cash-secured return on capital, then the higher open interest, then the lower strike. With the expiry it identifies the contract to quote live; it is a level, shown next to the close and support (rollup.swing_levels@v1.swing_low, rollup.oi_walls@v1.put_wall)."
caveats = [
  "A strike above the put wall or above swing support is a wing that sits inside the zone where the stock has recently stopped falling; a strike below both has those levels as a cushion.",
  "Null with wing_status NO_STRIKE or no target expiry.",
]
sources = ["docs/screeners/vrp-scanner.md"]
[[field.use]]
for = "has a candidate put"
op = "not_null"
mode = "hard"

[[field]]
name = "rollup.put_wing@v1.best_put_delta"
theme = "put wing, walls and expiries"
reads = "Our delta of the best put, negative, between -0.35 and -0.05: -0.10 is a put with roughly a 10% chance of finishing in the money, the VRP scanner's 8 to 15 delta target (-0.08 to -0.15). Nearer -0.05 the premium is tiny; nearer -0.35 the put is a stock position in waiting."
caveats = [
  "Ours (ADR 0021), from the stored mid with the Treasury curve and the dividend yield; the feed's delta can differ by a few hundredths. rollup.put_wing@v1.delta_band_distance is the band check in one number.",
  "A delta computed on an after-close quote on a name that moved after the close is already stale by that move; confirm live.",
]
sources = ["docs/screeners/vrp-scanner.md; Hull on delta as a rough probability"]
[[field.use]]
for = "in the 8 to 15 delta band"
op = "between"
value = [-0.15, -0.08]
mode = "soft"
tolerance = 0.05
note = "or score rollup.put_wing@v1.delta_band_distance lte 0 with tolerance 0.20, as the preset does"

[[field]]
name = "rollup.put_wing@v1.best_put_iv"
theme = "put wing, walls and expiries"
reads = "The implied volatility of the best put from its mid, as a fraction: 0.45 is 45% a year. A far put's IV is above the at-the-money IV (the skew: puts are bid for protection), so it reads higher than rollup.iv_history@v2.iv30 by 5 to 15 points on an ordinary stock. The premium the VRP scanner collects is this number against realised movement."
caveats = [
  "Skew is sector- and regime-dependent: a wing IV 20 points over the ATM IV says protection is expensive (a crowded or feared name), not that the stock will move that much.",
  "A report before expiry inflates it like every IV; check rollup.earnings@v1.days_to_earnings.",
]
sources = ["Carr and Wu (2009); practitioner notes on put skew"]
[[field.use]]
for = "a rich wing (sell premium)"
op = "gte"
value = 0.40
mode = "soft"
tolerance = 0.05

[[field]]
name = "rollup.put_wing@v1.best_put_mid"
theme = "put wing, walls and expiries"
reads = "The best put's mid price, (bid + ask) / 2, in dollars per share: the premium a seller can expect near the middle of the market; times 100 per contract. Under $0.20 the spread is most of it; $0.50 to $2.00 is the usual wing premium on a $50 to $200 stock."
caveats = [
  "The mid of an after-close quote; the live mid can be far from it. The return on capital (rollup.put_wing@v1.best_put_roc) is the comparable number across prices.",
]
sources = ["docs/screeners/vrp-scanner.md"]
[[field.use]]
for = "a premium worth the spread"
op = "gte"
value = 0.30
mode = "soft"
tolerance = 0.10
on_miss = "LIQUIDITY_RISK"

[[field]]
name = "rollup.put_wing@v1.best_put_roc"
theme = "put wing, walls and expiries"
reads = "The best put's cash-secured return on capital: premium over the strike (mid / strike), as a fraction for the expiry's term. 0.01 is 1% for about 45 days (roughly 8% a year); 0.02 is rich and usually means a high-volatility name; under 0.005 the trade does not pay for its risk."
caveats = [
  "A high ROC is a high IV: it is the compensation for the name's risk, not free money. Pair with feature.vrp_iv_hv_ratio so the IV is high against what the stock actually does.",
  "Per term, not annualised: compare only across similar rollup.put_wing@v1.target_dte.",
]
sources = ["docs/screeners/vrp-scanner.md (the put wing's ROC ordering)"]
[[field.use]]
for = "a worthwhile return on capital"
op = "gte"
value = 0.01
mode = "soft"
tolerance = 0.003
[[field.use]]
for = "rank by return on capital"
op = "gte"
value = 0.015
mode = "score"
tolerance = 0.01

[[field]]
name = "rollup.oi_walls@v1.wall_status"
theme = "put wing, walls and expiries"
reads = "Whether the open-interest walls were found: OK (a call wall at or above spot and a put wall at or below), PARTIAL (one side only), NO_OI (no open interest on either side within 60 days), or the first failing step (NO_SPOT, NO_CHAIN, NO_EXPIRY: nothing listed 1 to 60 days out)."
caveats = [
  "PARTIAL is common on a name at a 52-week extreme: at a high there is little call interest above spot, at a low little put interest below.",
]
sources = ["docs/data/swing.md (oi_walls@v1)"]
[[field.use]]
for = "both walls known"
op = "eq"
value = "OK"
mode = "soft"
tolerance = 0
note = "the near miss is PARTIAL"

[[field]]
name = "rollup.oi_walls@v1.call_wall"
theme = "put wing, walls and expiries"
reads = "The strike at or above spot with the most call open interest, summed over expiries 1 to 60 days out: where upside positioning is concentrated. Dealer hedging around a heavy call strike tends to lean against the price as it approaches, so the call wall reads as soft resistance and a common pinning level into expiry. Compare it with the close: a wall 3% above is near, 15% above is out of play."
caveats = [
  "Open interest does not say who holds it: a strike where customers face customers produces no hedging flow. Treat the wall as an estimate of a level, not a barrier (docs/data/positioning.md).",
  "Round strikes attract interest regardless of positioning; a wall exactly at a round number is partly a ladder artefact.",
  "After a large move the wall can sit well above or below spot until positions roll; rollup.oi_walls@v1.call_wall_oi says how much interest backs it.",
]
sources = ["SpotGamma, call wall and put wall explained: https://spotgamma.com/call-wall-put-wall-explained/; docs/data/positioning.md"]
[[field.use]]
for = "has a call wall"
op = "not_null"
mode = "hard"
note = "read it against the close and feature.dist_to_resistance"

[[field]]
name = "rollup.oi_walls@v1.call_wall_oi"
theme = "put wing, walls and expiries"
reads = "Call open interest at the call wall, summed over expiries 1 to 60 days out: how much positioning backs the level. A few thousand contracts is a modest wall on a mid-cap; tens of thousands is a level the market watches; against the chain total (feature.option_chain_oi) it says how concentrated the upside positioning is."
caveats = [
  "A large number with a chain total not much larger is one expiry's interest: the wall vanishes at that expiry.",
]
sources = ["https://spotgamma.com/call-wall-put-wall-explained/"]
[[field.use]]
for = "a wall with weight"
op = "gte"
value = 5000
mode = "soft"
tolerance = { relative = 0.5 }

[[field]]
name = "rollup.oi_walls@v1.put_wall"
theme = "put wing, walls and expiries"
reads = "The strike at or below spot with the most put open interest, summed over expiries 1 to 60 days out: where downside protection is concentrated. Hedging around a heavy put strike tends to cushion the price as it approaches, so the put wall reads as soft support. Compare it with the close and with swing support (rollup.swing_levels@v1.swing_low); a short put struck below the wall has it as a cushion."
caveats = [
  "An estimate of a level, not a barrier: nothing here says whose gamma it is (docs/data/positioning.md).",
  "Round strikes and monthlies attract interest by themselves; a wall at a round number is partly a ladder artefact.",
]
sources = ["https://spotgamma.com/call-wall-put-wall-explained/; docs/data/positioning.md"]
[[field.use]]
for = "has a put wall"
op = "not_null"
mode = "hard"
note = "read it against the close and feature.dist_to_support"

[[field]]
name = "rollup.oi_walls@v1.put_wall_oi"
theme = "put wing, walls and expiries"
reads = "Put open interest at the put wall, summed over expiries 1 to 60 days out: how much protection sits at the level. Tens of thousands is a watched level on a large cap; against feature.option_chain_oi it says how concentrated the downside positioning is."
caveats = [
  "Concentrated in one expiry, it disappears at that expiry; a rolled hedge moves the wall overnight.",
]
sources = ["https://spotgamma.com/call-wall-put-wall-explained/"]
[[field.use]]
for = "a wall with weight"
op = "gte"
value = 5000
mode = "soft"
tolerance = { relative = 0.5 }

[[field]]
name = "rollup.nearest_expiry@v1.expiry_date"
theme = "put wing, walls and expiries"
reads = "The nearest listed option expiry on or after the session, from the session's own stored chain (an expiry on the session counts: a 0-DTE trades until the close). The Ideas page's expiry column; a date to show, with rollup.nearest_expiry@v1.dte for the days."
caveats = [
  "Null when every stored expiry is before the session (a stale chain): the session's chain run says why (rollup.option_liquidity@v1.liq_status).",
  "The nearest expiry is rarely the one to trade: the short-strike groups use expiries near 35 and 45 days.",
]
sources = ["Site convention (features/rollups/options/nearest_expiry.py)"]
[[field.use]]
for = "has a listed expiry"
op = "not_null"
mode = "hard"

[[field]]
name = "rollup.nearest_expiry@v1.dte"
theme = "put wing, walls and expiries"
reads = "Calendar days to the nearest listed expiry: 0 expires today, 1 to 7 is a weekly, up to about 30 a monthly-only name. For an event play the front expiry is the one that prices the event; for everything else the number says how finely the name's expiries are spaced."
caveats = [
  "A front expiry with earnings before it (feature.earnings_before_expiry) carries the event; a short option there is an earnings trade whether or not it was meant as one.",
]
sources = ["Site convention"]
[[field.use]]
for = "a weekly expiry available"
op = "lte"
value = 7
mode = "soft"
tolerance = 3
[[field.use]]
for = "no expiry inside a week (avoid 0-DTE pinning days)"
op = "gt"
value = 7
mode = "soft"
tolerance = 3

[[field]]
name = "rollup.nearest_expiry@v1.sessions_to_expiry"
theme = "put wing, walls and expiries"
reads = "Exchange sessions after the session up to the nearest expiry (0: expires today), the same count as rollup.earnings@v1.days_to_earnings uses, so the two compare directly: earnings sessions below expiry sessions means the report lands before the front expiry (feature.earnings_before_expiry)."
caveats = [
  "Sessions, not calendar days: a holiday week makes 5 calendar days 3 sessions.",
]
sources = ["Site convention"]
[[field.use]]
for = "a front expiry at least a week out"
op = "gte"
value = 5
mode = "soft"
tolerance = 2

# The short put against the chart (config/site/features/swing.toml): how much technical room
# sits between the strike put_wing@v1 picked and the support swing_levels@v1 found.

[[field]]
name = "feature.put_support_cushion"
theme = "put wing, walls and expiries"
reads = "The short put's cushion: (support - the best put's strike) / close, where support is the most recent confirmed swing low below the close. 0.05 means the strike sits 5% of the price below support: the stock has to break support and fall another 5% before the put is in the money. Positive is what a put seller wants; 0 puts the strike on support; negative means the strike is above support, so a test of support alone puts the option in the money. feature.put_support_cushion_atr is the same room in ATRs."
caveats = [
  "Support is the most recent swing low, not the strongest one: a minor pivot a week old reads as support while the real floor is lower. Check rollup.swing_levels@v1.swing_low_date and feature.dist_to_support.",
  "The best put is the 8-15 delta strike nearest 45 days; a wider cushion usually means a lower delta and less premium. Read with rollup.put_wing@v1.best_put_delta and rollup.put_wing@v1.best_put_roc.",
  "An earnings date before the expiry makes the cushion a different question (the gap, not the chart). Check feature.earnings_before_expiry.",
  "Null when there is no confirmed swing low below the close (the name is at a one-year low), no best put, or no price_stats row.",
]
sources = ["Cash-secured puts below support (McMillan, Options as a Strategic Investment: strike selection)"]
[[field.use]]
for = "strike below support (put selling)"
op = "gte"
value = 0.03
mode = "soft"
tolerance = 0.02
note = "with feature.dist_to_support between 0.02 and 0.10 so support is near but holding; feature.put_support_cushion_atr gte 1 is the ATR-scaled version"

[[field]]
name = "feature.put_support_cushion_atr"
theme = "put wing, walls and expiries"
reads = "The short put's cushion in Wilder ATR(14): (support - the best put's strike) / atr_14, how many average days' range the stock has to fall below support before the put is in the money. 1 is one day's range of room, 2 to 3 is comfortable, 0 puts the strike on support, negative above it. The ATR scale makes it comparable across names and the natural companion to rollup.put_wing@v1.best_put_delta (a low delta at a small cushion means the market prices the support as weak)."
caveats = [
  "A pending takeover shrinks the ATR towards zero, so the cushion reads huge on a name that cannot move; see the 'pending takeover' situation.",
  "The cushion is measured today; a wider ATR after a shock shrinks it without the strike or support moving. Check rollup.price_moves@v1.one_day_move.",
  "Null when there is no confirmed swing low below the close, no best put, or atr_14 is unknown or 0.",
]
sources = ["Cash-secured puts below support (McMillan, Options as a Strategic Investment)"]
[[field.use]]
for = "at least one ATR of room below support"
op = "gte"
value = 1.0
mode = "soft"
tolerance = 0.5
note = "with rollup.put_wing@v1.wing_status eq OK and feature.earnings_before_expiry eq false"

# The covered-call wing (call_wing@v1): the call to sell against shares at the 30..60 day
# expiry nearest 45 days, aiming for 15..30 delta (ours, ADR 0021), ranked by premium yield
# (mid / spot). The mirror of the put wing above; the expression features over it follow.

[[field]]
name = "rollup.call_wing@v1.wing_status"
theme = "put wing, walls and expiries"
reads = "Whether the best covered call was found: OK (its delta is inside 0.15 to 0.30), OUTSIDE_BAND (a best call exists between 0.05 and 0.50 delta but outside the band; rollup.call_wing@v1.delta_band_distance says how far), or the first failing step: NO_SPOT, NO_CHAIN (no calls), NO_EXPIRY (none 30 to 60 days out), NO_STRIKE (no call with our delta in 0.05 to 0.50)."
caveats = [
  "OUTSIDE_BAND is not a failure: the wing scores the distance rather than rejecting, as the put wing does. A hard 'eq OK' is stricter than a screen that scores rollup.call_wing@v1.delta_band_distance.",
  "It is a statement about the chain, not about owning the shares: a covered call needs 100 shares per contract, so a high-priced stock is a large position whatever the wing says. Read rollup.price_stats@v2.close with it.",
  "NO_STRIKE on a liquid name usually means every far call lacked a two-sided quote (rollup.call_wing@v1.n_unpriced) or a strike ladder that skips the band.",
]
sources = ["Site convention (the covered-call mirror of the put wing); McMillan, Options as a Strategic Investment, on covered writing"]
[[field.use]]
for = "a best call in the 15 to 30 delta band"
op = "eq"
value = "OK"
mode = "soft"
tolerance = 0
note = "the near miss is OUTSIDE_BAND; score rollup.call_wing@v1.delta_band_distance instead of gating"

[[field]]
name = "rollup.call_wing@v1.target_expiry"
theme = "put wing, walls and expiries"
reads = "The expiry of the best call: the one nearest 45 calendar days among those 30 to 60 days out, standard monthlies first (open interest concentrates there). The same rule as the put wing, so on one name the two wings share their expiry unless one right has no quotes there. A date to show with the strike; rollup.call_wing@v1.target_dte is the days."
caveats = [
  "Null when no expiry sits 30 to 60 days out, or no calls are quoted for the name.",
  "A covered call held to this expiry carries every event before it: feature.ex_div_before_expiry for a dividend (early assignment), and rollup.earnings@v1.days_to_earnings for a report.",
]
sources = ["Site convention"]
[[field.use]]
for = "has a wing expiry"
op = "not_null"
mode = "hard"

[[field]]
name = "rollup.call_wing@v1.target_dte"
theme = "put wing, walls and expiries"
reads = "Calendar days to the best call's expiry, 30 to 60 by construction and near 45: where a short call's time decay is fast and gamma still moderate. Nearer 30 the premium decays faster but each period's yield is smaller; nearer 60 the yield per period is larger and the stock has longer to run through the strike."
caveats = [
  "Compare yields only across similar days: rollup.call_wing@v1.best_call_yield is per term, feature.cc_yield_annualised puts terms on one scale.",
]
sources = ["tastylive on 45 days to expiry"]
[[field.use]]
for = "around 45 days to expiry"
op = "between"
value = [35, 55]
mode = "soft"
tolerance = 5

[[field]]
name = "rollup.call_wing@v1.n_unpriced"
theme = "put wing, walls and expiries"
reads = "Calls at the target expiry that have no delta of ours (no two-sided quote, or the implied-volatility inversion failed): they can never be the best call. A few far wings are normal; a large share of the expiry means the chain was quoted one-sided after the close and the wing columns rest on few strikes."
caveats = [
  "Compare with rollup.call_wing@v1.n_strikes: many unpriced and few band strikes says 'quote problem', not 'no market'.",
  "Deep in-the-money calls price on their intrinsic value and can fail the inversion when the bid sits below it; they are not candidates in any case (their delta is above 0.50).",
]
sources = ["Site convention (features/rollups/options/wing_search.py)"]
[[field.use]]
for = "the expiry's calls were priced"
op = "lte"
value = 10
mode = "soft"
tolerance = 10

[[field]]
name = "rollup.call_wing@v1.n_strikes"
theme = "put wing, walls and expiries"
reads = "How many strikes at the target expiry have a call with our delta inside 0.15 to 0.30: the choice available in the band. 0 means no call in the band (the best call is outside it), 2 to 4 is normal for a strike ladder in $5 steps, 6 or more is a finely struck, usually liquid, name."
caveats = [
  "0 with wing_status OUTSIDE_BAND is a ladder gap, common on high-priced stocks; the best call is then the nearest outside the band and its distance is scored.",
]
sources = ["Site convention"]
[[field.use]]
for = "a strike inside the band"
op = "gte"
value = 1
mode = "soft"
tolerance = 1

[[field]]
name = "rollup.call_wing@v1.wing_oi"
theme = "put wing, walls and expiries"
reads = "Open interest summed over the calls inside the 15 to 30 delta band at the target expiry: the standing depth a covered call is sold into. Under 500 is thin, a few thousand is tradable, tens of thousands is a popular wing. 0 when no call is in the band."
caveats = [
  "A single strike can hold all of it; rollup.call_wing@v1.best_call_oi is the chosen strike alone.",
  "Standing positions, not today's activity: rollup.call_wing@v1.wing_volume is the day's trades. Heavy call open interest also marks where covered-call writers are already short: feature.call_strike_above_resistance and rollup.oi_walls@v1.call_wall say whether the chosen strike sits at the crowd's level.",
]
sources = ["https://www.tastylive.com/concepts-strategies/options-liquidity"]
[[field.use]]
for = "a wing with depth"
op = "gte"
value = 2000
mode = "soft"
tolerance = { relative = 0.5 }
on_miss = "LIQUIDITY_RISK"

[[field]]
name = "rollup.call_wing@v1.wing_volume"
theme = "put wing, walls and expiries"
reads = "Contracts traded on the session across the calls in the 15 to 30 delta band at the target expiry: whether the wing trades today. A few hundred is active for one expiry's wing; 0 on a quiet day is common even on liquid names."
caveats = [
  "Daily and noisy; read with rollup.call_wing@v1.wing_oi. A spike on a call wing can be one large buyer (a takeover bet or a speculative run), the opposite of a calm covered-call market: check feature.volume_climax.",
]
sources = ["https://www.tastylive.com/concepts-strategies/options-liquidity"]
[[field.use]]
for = "the wing trades"
op = "gte"
value = 200
mode = "soft"
tolerance = { relative = 0.5 }
on_miss = "LIQUIDITY_RISK"

[[field]]
name = "rollup.call_wing@v1.wing_spread_pct"
theme = "put wing, walls and expiries"
reads = "The median bid-ask spread as a share of mid across the calls in the 15 to 30 delta band, on the stored after-close quotes. 0.05 is a tight market for a wing, 0.10 to 0.20 is usual on a mid-cap, above 0.30 the band is not really made."
caveats = [
  "A $0.05 spread on a $0.30 call is 17%: a wide percentage can be a nickel. Read rollup.call_wing@v1.best_call_mid with it.",
  "After-close quotes; judge live. Null when no call is in the band.",
]
sources = ["https://www.thetaedge.ai/blog/assess-liquidity-trading-options"]
[[field.use]]
for = "a wing that is made (scored)"
op = "lt"
value = 0.15
mode = "score"
tolerance = 0.15
note = "full points under 15% of mid, none at 30%"

[[field]]
name = "rollup.call_wing@v1.delta_band_distance"
theme = "put wing, walls and expiries"
reads = "How far the best call's delta is from the 0.15 to 0.30 band: 0 inside it, else the distance to the nearer edge (a 0.35 delta call is 0.05 away, a 0.10 delta call is 0.05 away). Up to 0.20 by construction (a 0.50 delta call). A screen can score closeness instead of gating on OK."
caveats = [
  "Zero is a delta statement only: a 0.28 delta call can still be a poor trade (a thin quote, an ex-dividend date before expiry). Read rollup.call_wing@v1.wing_spread_pct and feature.ex_div_before_expiry with it.",
  "Null with wing_status NO_STRIKE or no target expiry.",
]
sources = ["Site convention (the put wing's closeness score, owner 2026-10-04)"]
[[field.use]]
for = "at or near the delta band (scored)"
op = "lte"
value = 0
mode = "score"
tolerance = 0.15
note = "full points inside the band, none at 0.15 away"

[[field]]
name = "rollup.call_wing@v1.best_call_strike"
theme = "put wing, walls and expiries"
reads = "The strike of the best call: among calls with our delta between 0.05 and 0.50, the one nearest the 15 to 30 delta band, then the highest premium yield, then the higher open interest, then the higher strike. With the expiry it identifies the contract to quote live; it is the price at which the shares are called away, to read next to the close and resistance (rollup.swing_levels@v1.swing_high, rollup.oi_walls@v1.call_wall)."
caveats = [
  "A strike below the close is an in-the-money call (it can only be picked as a nearest-the-band candidate on an unusual chain): the shares are called away at a loss to the market. feature.call_otm_pct says how far above the close the strike is.",
  "Null with wing_status NO_STRIKE or no target expiry.",
]
sources = ["McMillan, Options as a Strategic Investment, on covered writing and strike selection"]
[[field.use]]
for = "has a candidate call"
op = "not_null"
mode = "hard"

[[field]]
name = "rollup.call_wing@v1.best_call_delta"
theme = "put wing, walls and expiries"
reads = "Our delta of the best call, positive, between 0.05 and 0.50: 0.25 is a call with roughly a 25% chance of finishing in the money, so a 25% chance the shares are called away at the strike. The covered-call convention is 0.15 to 0.30: nearer 0.15 the premium is small and the stock is rarely called away, nearer 0.30 the premium is larger and assignment is likelier."
caveats = [
  "Ours (ADR 0021), from the stored mid with the Treasury curve and the dividend yield; the feed's delta can differ by a few hundredths. rollup.call_wing@v1.delta_band_distance is the band check in one number.",
  "Delta is a rough probability only: a stock with a known catalyst before expiry moves outside what the delta implies. Check rollup.earnings@v1.days_to_earnings.",
]
sources = ["Hull on delta as a rough probability; McMillan on covered writing"]
[[field.use]]
for = "in the 15 to 30 delta band"
op = "between"
value = [0.15, 0.30]
mode = "soft"
tolerance = 0.05
note = "or score rollup.call_wing@v1.delta_band_distance lte 0 with tolerance 0.15"

[[field]]
name = "rollup.call_wing@v1.best_call_iv"
theme = "put wing, walls and expiries"
reads = "The implied volatility of the best call from its mid, as a fraction: 0.35 is 35% a year. Call wings usually sit at or below the at-the-money IV (the skew puts the protection premium on the downside), so a rich call wing is a name where upside is also bid. The premium a covered call collects is this number against what the stock then does."
caveats = [
  "A high call IV is often an event (a report, a deal, a squeeze), not a bargain premium: feature.earnings_before_expiry and rollup.price_moves@v1.one_day_move say which.",
  "Selling a rich call on a stock that can gap up caps exactly the gain the shares were held for.",
]
sources = ["Practitioner notes on call skew and covered writing"]
[[field.use]]
for = "a rich wing (sell premium)"
op = "gte"
value = 0.35
mode = "soft"
tolerance = 0.05

[[field]]
name = "rollup.call_wing@v1.best_call_mid"
theme = "put wing, walls and expiries"
reads = "The best call's mid price, (bid + ask) / 2, in dollars per share: the premium a writer can expect near the middle of the market; times 100 per contract. Under $0.20 the spread is most of it; $0.50 to $3.00 is the usual wing premium on a $50 to $200 stock."
caveats = [
  "The mid of an after-close quote; the live mid can be far from it. The premium yield (rollup.call_wing@v1.best_call_yield) is the comparable number across prices.",
]
sources = ["Site convention"]
[[field.use]]
for = "a premium worth the spread"
op = "gte"
value = 0.30
mode = "soft"
tolerance = 0.10
on_miss = "LIQUIDITY_RISK"

[[field]]
name = "rollup.call_wing@v1.best_call_oi"
theme = "put wing, walls and expiries"
reads = "Open interest of the best call's strike at the target expiry: the standing book the covered call is written into. Under 100 is hard to exit, a few hundred is workable, thousands is a liquid strike."
caveats = [
  "Yesterday's standing book, not today's activity: pair with rollup.call_wing@v1.best_call_volume. rollup.call_wing@v1.wing_oi is the whole band.",
]
sources = ["https://www.tastylive.com/concepts-strategies/options-liquidity"]
[[field.use]]
for = "a strike with a book"
op = "gte"
value = 100
mode = "soft"
tolerance = { relative = 0.5 }
on_miss = "LIQUIDITY_RISK"

[[field]]
name = "rollup.call_wing@v1.best_call_volume"
theme = "put wing, walls and expiries"
reads = "Contracts traded on the session at the best call's strike and expiry: whether the strike you would write trades today. 0 on a quiet day is common even on liquid names; tens of contracts is active for one strike."
caveats = [
  "Daily and noisy: judge the strike on a live quote before trading, and read it with rollup.call_wing@v1.best_call_oi.",
]
sources = ["Site convention"]
[[field.use]]
for = "the strike trades"
op = "gte"
value = 10
mode = "soft"
tolerance = { relative = 0.5 }
on_miss = "LIQUIDITY_RISK"

[[field]]
name = "rollup.call_wing@v1.best_call_spread_pct"
theme = "put wing, walls and expiries"
reads = "The best call's bid-ask spread as a share of its mid, on the stored after-close quote: 0.05 is a tight market for a wing strike, 0.15 is usual on a mid-cap, above 0.30 the premium is mostly the spread. A seller gives up half of it to cross."
caveats = [
  "A $0.05 spread on a $0.30 call is 17%: a wide percentage can be a nickel. After-close quote: confirm live.",
]
sources = ["https://www.thetaedge.ai/blog/assess-liquidity-trading-options"]
[[field.use]]
for = "a tight market at the strike (scored)"
op = "lt"
value = 0.10
mode = "score"
tolerance = 0.10
note = "full points under 10% of mid, none at 20%"

[[field]]
name = "rollup.call_wing@v1.best_call_yield"
theme = "put wing, walls and expiries"
reads = "The best call's premium yield: premium over the stock price (mid / spot), as a fraction for the expiry's term. 0.01 is 1% for about 45 days (roughly 8% a year) collected against the shares; 0.02 is rich and usually a high-volatility name; under 0.005 the call pays little for the upside it gives away. feature.cc_yield_annualised puts terms on one scale."
caveats = [
  "It is income, not return: the shares can fall by more than the premium, and assignment caps the gain at the strike. A high yield is a high IV, the compensation for the name's risk.",
  "Per term, not annualised, and per dollar of stock held (the put wing's ROC is per dollar of strike): compare only across similar rollup.call_wing@v1.target_dte.",
]
sources = ["McMillan, Options as a Strategic Investment, on covered writing returns"]
[[field.use]]
for = "a worthwhile premium for the shares"
op = "gte"
value = 0.01
mode = "soft"
tolerance = 0.003
[[field.use]]
for = "rank by premium yield"
op = "gte"
value = 0.015
mode = "score"
tolerance = 0.01

# The covered call against the chart and the calendar (config/site/features/wings.toml, swing.toml).

[[field]]
name = "feature.call_otm_pct"
theme = "put wing, walls and expiries"
reads = "How far the best covered call's strike sits above the close: (strike - close) / close. 0.05 is a strike 5% above the price, the level the shares are called away at, so the most the position gains from the stock is that 5% plus the premium. Near 0.02 the upside is capped tight; 0.08 to 0.12 leaves room. Negative is an in-the-money call."
caveats = [
  "A far strike means a low delta and a small premium: the room is paid for in rollup.call_wing@v1.best_call_yield. Read both.",
  "A fixed delta puts the strike further out on a volatile stock than on a calm one, so the same pct is a different bet; feature.cc_resistance_cushion_atr scales it by the stock's range.",
  "Null with no best call (NO_STRIKE or worse) or no price_stats row.",
]
sources = ["McMillan, Options as a Strategic Investment, on covered writing and strike selection"]
[[field.use]]
for = "room to run before the shares are called away"
op = "gte"
value = 0.04
mode = "soft"
tolerance = 0.02
note = "with rollup.call_wing@v1.best_call_yield gte 0.01 so the room is paid for"

[[field]]
name = "feature.cc_yield_annualised"
theme = "put wing, walls and expiries"
reads = "The best covered call's premium yield annualised: best_call_yield x 365 / target_dte. 0.08 is 8% a year of the stock price collected if a call like this is sold every period and expires worthless; 0.15 to 0.25 is rich and usually a high-volatility name; under 0.05 it is not worth the capped upside."
caveats = [
  "A premium rate, not a return: assignment caps the gain at the strike and the stock can fall by more than the premium. A high rate on a stock with a report before expiry is the report's premium (feature.earnings_before_expiry).",
  "Annualising a 30 to 60 day term assumes the same yield every period; premium varies with the volatility regime. Read rollup.iv_history@v2.iv_rank_252d with it.",
  "Null with no best call: no yield or no target_dte.",
]
sources = ["Site convention; McMillan, Options as a Strategic Investment"]
[[field.use]]
for = "a covered call that pays a worthwhile annual rate"
op = "gte"
value = 0.10
mode = "soft"
tolerance = 0.03

[[field]]
name = "feature.call_strike_above_resistance"
theme = "put wing, walls and expiries"
reads = "True when the best covered call's strike is above the most recent confirmed swing high: resistance sits between the price and the strike, so the shares are called away only after the stock breaks above where it has recently stopped rising. False means the strike is at or below resistance, inside the zone the stock has recently turned back from: assignment is likelier than the delta alone suggests."
caveats = [
  "Resistance is the most recent confirmed swing high above the close, not the strongest level; a minor pivot reads as resistance. Check rollup.swing_levels@v1.swing_high_date and rollup.pivot_strength@v1.resistance_touches.",
  "Null when there is no confirmed swing high above the close (the stock is at a one-year high: no overhead supply to measure) or no best call; a hard 'eq true' rejects stocks at highs, soft keeps them listed.",
]
sources = ["McMillan, Options as a Strategic Investment; the covered-call strike-above-resistance rule of thumb"]
[[field.use]]
for = "a covered call strike above resistance"
op = "eq"
value = true
mode = "soft"
tolerance = 0

[[field]]
name = "feature.cc_resistance_cushion_atr"
theme = "put wing, walls and expiries"
reads = "The covered call's room above resistance in Wilder ATR(14): (the best call's strike - resistance) / atr_14, how many average days' range sit between the swing high and the strike. 1 is one day's range of room above resistance, 2 to 3 is comfortable, 0 puts the strike on resistance, negative below it. The ATR scale makes it comparable across names and the call-side mirror of feature.put_support_cushion_atr."
caveats = [
  "A pending takeover shrinks the ATR towards zero, so the cushion reads huge on a name that cannot move; see the 'pending takeover' situation.",
  "Measured today: a wider ATR after a shock shrinks it without the strike or resistance moving. Check rollup.price_moves@v1.one_day_move.",
  "Null when there is no confirmed swing high above the close, no best call, or atr_14 is unknown or 0.",
]
sources = ["McMillan, Options as a Strategic Investment"]
[[field.use]]
for = "at least one ATR of room above resistance"
op = "gte"
value = 1.0
mode = "soft"
tolerance = 0.5
note = "with rollup.call_wing@v1.wing_status eq OK and feature.ex_div_before_expiry eq false"

# The implied move (implied_move@v1; docs/data/positioning.md OP4): the move the at-the-money
# straddle prices to one expiry, as a share of the price, at the expiry covering the next earnings
# report when there is one, else the term expiry nearest 30 days; and the short put's reads over
# put_wing@v1 (distance, break-even, annualised return).

[[field]]
name = "rollup.implied_move@v1.move_status"
theme = "put wing, walls and expiries"
reads = "Whether the implied move has a value: OK, or the first failing step: NO_SPOT (no positive close or price), NO_CHAIN (no option quotes), NO_EXPIRY (no expiry to read), NO_QUOTES (no strike around the price with both legs two-sided) or WIDE_SPREADS (two-sided but every leg is wider than 35% of its mid)."
caveats = [
  "WIDE_SPREADS and NO_QUOTES are thin chains: a straddle at those quotes would be noise, so the move is null rather than wrong. rollup.option_liquidity@v1.liq_status and feature.option_tier say the same of the chain.",
  "The stored quotes are after the close; judge a live straddle before trading it.",
]
sources = ["Site convention (features/rollups/positioning/implied_move.py)"]
[[field.use]]
for = "a priced implied move"
op = "eq"
value = "OK"
mode = "hard"

[[field]]
name = "rollup.implied_move@v1.implied_move"
theme = "put wing, walls and expiries"
reads = "The expected absolute move to the move expiry that the at-the-money straddle prices, as a share of the price: 0.06 means the options price about a 6% move either way by that date. Single stocks over a month are often 0.05 to 0.12; into earnings 0.04 to 0.10; index ETFs 0.02 to 0.04. It is the average size of the move the market expects, not a range it promises: feature.implied_move_1sd is the one-standard-deviation version."
caveats = [
  "It prices the whole period to the move expiry, not a day. With rollup.implied_move@v1.move_basis EARNINGS it includes the report; with TERM it is a month of ordinary movement. Read move_basis and rollup.implied_move@v1.move_dte before comparing two names.",
  "The straddle also prices in the volatility premium, so options usually imply more than the stock then delivers. feature.implied_move_vs_hv is the comparison with recent realised movement.",
  "Interpolated in strike to the closing price from stored end-of-day mids; a wide-spread chain is null (rollup.implied_move@v1.move_status), never guessed. When only one of the two strikes around the price has usable quotes its straddle stands in, which is biased when the strikes are far apart relative to the move (a $20 stock with $2.50 strikes a week out).",
  "Null when the status is not OK.",
]
sources = [
  "Expected move from the at-the-money straddle (about 0.8 x sigma x sqrt(t) x S): https://www.tastylive.com/concepts-strategies/expected-move",
]
[[field.use]]
for = "a big move priced"
op = "gte"
value = 0.08
mode = "soft"
tolerance = 0.02
note = "with rollup.implied_move@v1.move_basis eq EARNINGS for an event play"
[[field.use]]
for = "a quiet name priced"
op = "lte"
value = 0.04
mode = "soft"
tolerance = 0.01

[[field]]
name = "rollup.implied_move@v1.straddle_mid"
theme = "put wing, walls and expiries"
reads = "The call plus put mid at the closing price, in dollars per share, interpolated in strike between the two listed strikes around it (a single usable strike: its straddle). One contract costs 100 times this. It is the number rollup.implied_move@v1.implied_move divides by the price."
caveats = [
  "A dollar amount: compare names through rollup.implied_move@v1.implied_move, not through the straddle.",
  "A mid of a stored end-of-day quote, not a fill: trading the straddle costs about half its spread more.",
]
sources = ["Site convention (features/rollups/positioning/implied_move.py)"]
[[field.use]]
for = "a straddle that costs at least a dollar"
op = "gte"
value = 1
mode = "soft"
tolerance = 0.5

[[field]]
name = "rollup.implied_move@v1.move_expiry"
theme = "put wing, walls and expiries"
reads = "The expiry the straddle is read at: the first one that covers the next earnings report, within 60 days (move_basis EARNINGS), else the listed expiry nearest 30 days among 7 to 60 days out (TERM). A date to show; rollup.implied_move@v1.move_dte is the days."
caveats = [
  "It is not the put wing's target (rollup.put_wing@v1.target_expiry, nearest 45 days) nor the nearest expiry: three groups, three expiries.",
  "An expiry covers a report after the close only when it is dated after the report day; the earnings date is as known on the session (rollup.earnings@v1.next_earnings_date) and can still move.",
  "Null when no expiry was selected (NO_SPOT, NO_CHAIN or NO_EXPIRY).",
]
sources = ["Site convention (features/rollups/positioning/implied_move.py)"]
[[field.use]]
for = "an expiry was selected"
op = "not_null"
mode = "hard"

[[field]]
name = "rollup.implied_move@v1.move_dte"
theme = "put wing, walls and expiries"
reads = "Calendar days from the session to the move expiry: 1 to 60. Small (a few days) is an earnings expiry right after the report, 25 to 35 a term read."
caveats = [
  "The implied move scales with the square root of time: compare names at similar days, or use feature.implied_move_vs_hv which scales the realised movement to the same expiry.",
  "Null when no expiry was selected.",
]
sources = ["Site convention (features/rollups/positioning/implied_move.py)"]
[[field.use]]
for = "a month or less to the expiry read"
op = "between"
value = [1, 35]
mode = "soft"
tolerance = 5

[[field]]
name = "rollup.implied_move@v1.move_basis"
theme = "put wing, walls and expiries"
reads = "What the move expiry was chosen for: EARNINGS (the first expiry covering the next report, so the straddle prices the report) or TERM (the expiry nearest 30 days: no report ahead, or none covered within 60 days). 'The move into earnings' means EARNINGS; a TERM move is a month of ordinary movement."
caveats = [
  "EARNINGS needs a known report date; a company that has not announced one reads TERM even when a report is near. Check rollup.earnings@v1.next_earnings_date.",
  "A report today before the open is already in the close, so it reads TERM; a report tonight reads EARNINGS.",
  "Null when no expiry was selected.",
]
sources = ["Site convention (features/rollups/positioning/implied_move.py)"]
[[field.use]]
for = "the move the options price into earnings"
op = "eq"
value = "EARNINGS"
mode = "hard"

[[field]]
name = "feature.implied_move_1sd"
theme = "put wing, walls and expiries"
reads = "The one-standard-deviation move the straddle implies: rollup.implied_move@v1.implied_move x 1.2533 (the square root of pi over 2), as a share of the price: 0.08 means the options price a standard deviation of 8%, so about two chances in three of finishing within 8% of today. The expected absolute move is the smaller number."
caveats = [
  "Assumes a bell-shaped (lognormal) distribution; real returns have fatter tails and, around earnings, two humps (a gap up or down). Treat it as a scale, not a probability.",
  "Same period as the straddle: read rollup.implied_move@v1.move_dte and move_basis.",
  "Null when the implied move is null.",
]
sources = ["Expected move and one standard deviation: https://www.tastylive.com/concepts-strategies/expected-move"]
[[field.use]]
for = "a standard deviation of at least 10%"
op = "gte"
value = 0.10
mode = "soft"
tolerance = 0.02

[[field]]
name = "feature.implied_move_vs_hv"
theme = "put wing, walls and expiries"
reads = "How much more the straddle prices than recent realised movement would: the one-standard-deviation implied move (feature.implied_move_1sd) over HV20 scaled to the move expiry (hv20 x sqrt(days / 365)), so 1 means the options price what the last 20 sessions delivered (implied volatility equal to HV20), 1.5 half again more, 0.7 less. Above 1.2 options are rich against realised, which favours selling premium; below 0.8 they are cheap."
caveats = [
  "An EARNINGS expiry prices the report, which the last 20 sessions usually did not contain, so a ratio above 1 into earnings is expected; compare with the name's own history, or read rollup.implied_move@v1.move_basis first.",
  "HV20 after a shock (a gap, a takeover) overstates or understates what comes next. Check rollup.price_moves@v1.one_day_move.",
  "Null when the implied move or HV20 is null, or HV20 is 0 (no floor).",
]
sources = ["Site convention; implied against realised volatility, the volatility risk premium"]
[[field.use]]
for = "options pricing more than realised"
op = "gte"
value = 1.2
mode = "soft"
tolerance = 0.2
note = "for selling premium, with rollup.implied_move@v1.move_basis eq TERM so the report is not what is priced"
[[field.use]]
for = "options pricing less than realised"
op = "lte"
value = 0.8
mode = "soft"
tolerance = 0.2

[[field]]
name = "feature.put_otm_pct"
theme = "put wing, walls and expiries"
reads = "How far below the close the best short put's strike sits: (close - strike) / close, 0.08 means the strike is 8% under the price. 0.05 to 0.15 is the usual range for an 8 to 15 delta put; negative means the strike is above the close."
caveats = [
  "The same percentage means different safety at different volatility: 8% is two weekly moves on a quiet name and under one on a wild one. Compare with feature.implied_move_1sd or feature.put_support_cushion_atr.",
  "The close is the bar's, the strike is chosen against the chain's own price (rollup.put_wing@v1.best_put_delta); they can differ by after-hours movement.",
  "Null with no best put (put_wing NO_STRIKE or worse).",
]
sources = ["Cash-secured puts below support (McMillan, Options as a Strategic Investment)"]
[[field.use]]
for = "a strike well below the price"
op = "gte"
value = 0.08
mode = "soft"
tolerance = 0.03

[[field]]
name = "feature.put_breakeven"
theme = "put wing, walls and expiries"
reads = "The short put's break-even at expiry in dollars per share: the best put's strike minus the premium collected (its mid). The stock must stay above it for the trade to win; between the break-even and the strike the premium is only partly kept."
caveats = [
  "An absolute price, so it is read against a level (support: rollup.swing_levels@v1.swing_low) or the close, not against a threshold alone; feature.put_otm_pct is the relative version for the strike.",
  "The mid is a stored end-of-day quote: a live fill is nearer the bid, which lowers the premium and lifts the break-even.",
  "Null with no best put (put_wing NO_STRIKE or worse).",
]
sources = ["Cash-secured puts below support (McMillan, Options as a Strategic Investment)"]
[[field.use]]
for = "a break-even below a level"
op = "lte"
value = 100
mode = "soft"
tolerance = { relative = 0.05 }
note = "100 is an example level; the usual comparison is the break-even against rollup.swing_levels@v1.swing_low"

[[field]]
name = "feature.put_roc_annualised"
theme = "put wing, walls and expiries"
reads = "The short put's cash-secured return annualised, simple: rollup.put_wing@v1.best_put_roc x 365 / target_dte, 0.3 means 30% a year if the put expires worthless and is sold again at the same terms. Roughly 0.10 to 0.30 is usual for an 8 to 15 delta put; more is paid for more risk, not for free."
caveats = [
  "An annualised yield is a rate, not an expectation: it assumes every put expires worthless, which the delta says happens about 85 to 92% of the time, and ignores the losses in the other cases. Read it with rollup.put_wing@v1.best_put_delta.",
  "High values on a name with a wide stored spread (rollup.put_wing@v1.best_put_spread_pct) rest on a mid you will not get.",
  "Null with no best put (put_wing NO_STRIKE or worse).",
]
sources = ["Cash-secured puts below support (McMillan, Options as a Strategic Investment)"]
[[field.use]]
for = "a worthwhile return on the cash"
op = "gte"
value = 0.15
mode = "soft"
tolerance = 0.05
