# L3 site setting: the names in the event-sensitivity scope (ADR 0050; docs/event-sensitivity-plan.md
# section 6), typed in src/algotrade/config/site/events/scope.py.
#
# The event study (reactions, peers, attribution, the deep dive) runs for the optionable names
# whose short-put side is tier A or B plus every name here, and for the reference instruments
# the funds here map to (a leveraged fund inherits its reference's events, ADR 0050). Symbols,
# never ids: SymbolResolver turns them into instrument ids on each run (ADR 0018). An unknown
# symbol is reported, never silently dropped. Until the Admin screen writes this file (EV8), it
# is edited by hand through a PR.
#
# symbol     the listed ticker as the vendors spell it (BRK.B, not BRK-B)
# added_on   the date it joined the list (the study's history starts in 2018 regardless)
# note       why it is here, optional

