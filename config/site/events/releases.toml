# FOMC meetings and conference calls that were not on the published schedule (an unscheduled
# decision or call; 2008-01-22 and 2020-03-03 are the statement days of the calls on the
# 21st and the 2nd). They are kept apart so no gate reads one as a scheduled meeting, and
# are known from their own day (no schedule to publish).

[[release]]
key = "FOMC_UNSCHEDULED"
name = "FOMC Unscheduled Meeting or Call"
source = "dates"
dates = [
  2003-03-25, 2003-04-01, 2003-04-08, 2003-04-16, 2003-09-15,
  2007-08-10, 2007-08-16, 2007-12-06,
  2008-01-09, 2008-01-22, 2008-03-10, 2008-07-24, 2008-09-29, 2008-10-07,
  2009-01-16, 2009-02-07, 2009-06-03,
  2010-05-09, 2010-10-15,
  2011-08-01, 2011-11-28,
  2020-03-03, 2020-03-15,
]
time_et = "14:00"
terms = "Federal Reserve FOMC historical materials (https://www.federalreserve.gov/monetarypolicy/fomc_historical.htm): unscheduled meetings and conference calls; the time is the usual 14:00 ET, not the call's"
