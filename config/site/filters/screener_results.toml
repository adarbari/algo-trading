# ------------------------------------------------------------------------------------ tradeable

[[filter]]
id = "option_tier"
label = "Option liquidity class"
group = "tradeable"
kind = "pick"
field = "feature.option_tier"
options = "static"
guide = "term:filter_option_tier"

[[filter.option]]
value = "A"
label = "A"

[[filter.option]]
value = "B"
label = "B"

[[filter.option]]
value = "C"
label = "C"

[[filter.option]]
value = "D"
label = "D"

[[filter]]
id = "spread"
label = "Option spread %"
group = "tradeable"
kind = "range"
field = "rollup.option_liquidity@v1.put_spread_pct"
bins = [0, 0.02, 0.05, 0.10, 0.20, 0.35, 0.50, 1, 2]
guide = "term:filter_spread"

[[filter]]
id = "dollar_volume"
label = "Dollar volume"
group = "tradeable"
kind = "range"
