# L3 site setting: the filters of a screener's results table (ADR 0082, docs/ui/filtering.md).
# Typed by src/algotrade/config/filters/definitions.py; fitness tests: tests/unit/config/filters/.
# A `field` is a catalogue name or `column:<id>` of a [[column]] below (a value of the row,
# services/read/screens/results.py ScreenResult). Every filter's `guide` entry is in
# config/site/guide/glossary/filters.toml. The tradeable and coming-up filters are Ideas' own:
# a result row is an instrument, so the same catalogue fields apply.
#
# Not here, because nothing fixed is stored to filter on (listed in the PR as "needs new data"):
#   setup:     score components / criterion outcomes (every screener has its own criteria, the
#              row stores them per screener, not as one field a list-wide filter could name),
#              the screen's display columns (the same: per screener)
#   tradeable: optionable (as in Ideas: no stored yes / no for a result row's chain)
# rank_moved_up (read-time: the previous run's rank, ADR 0082) and near_misses / gates_failing
# (the stored near_missed / failed gate lists) are built from the run's own rows.

label = "Screener results"

[[column]]
id = "decision"
dtype = "str"
source = "decision"

[[column]]
id = "change"
dtype = "str"
source = "change"

[[column]]
id = "rank"
dtype = "int"
source = "rank"

[[column]]
id = "score"
dtype = "float"
source = "score"

[[column]]
id = "rank_change"
dtype = "int"
source = "rank_change"

[[column]]
id = "near_misses"
dtype = "int"
source = "near_misses"

[[column]]
id = "gates_failing"
dtype = "int"
source = "gates_failing"

[[column]]
id = "days_picked"
dtype = "int"
source = "days_picked"

# ------------------------------------------------------------------------------------ setup

[[filter]]
id = "decision"
label = "Decision"
group = "setup"
kind = "pick"
field = "column:decision"
options = "enum"
enum = "algotrade.strategies.screeners.base:Decision"
guide = "term:filter_result_decision"

[[filter]]
id = "rank"
label = "Rank"
group = "setup"
kind = "range"
field = "column:rank"
bins = [1, 5, 10, 25, 50, 100, 250, 1000, 5000, 12000]
guide = "term:filter_rank"

[[filter]]
id = "score"
label = "Score"
group = "setup"
kind = "range"
field = "column:score"
bins = [0, 20, 40, 60, 80, 100]
guide = "term:filter_score"

[[filter]]
id = "near_misses"
label = "Near misses"
group = "setup"
kind = "range"
field = "column:near_misses"
bins = [0, 1, 2, 3, 5]
guide = "term:filter_near_misses"

[[filter]]
id = "gates_failing"
label = "Gates not passed"
group = "setup"
kind = "range"
field = "column:gates_failing"
bins = [0, 1, 2, 3, 5, 10]
guide = "term:filter_gates_failing"

# ------------------------------------------------------------------------------------ changed

[[filter]]
id = "change"
label = "Since the previous run"
group = "changed"
kind = "pick"
field = "column:change"
options = "static"
guide = "term:filter_change"

[[filter.option]]
value = "new"
label = "New"

[[filter.option]]
value = "dropped"
label = "Dropped"

[[filter]]
id = "rank_moved_up"
label = "Places moved up"
group = "changed"
kind = "range"
field = "column:rank_change"
bins = [1, 5, 20, 100]
guide = "term:filter_rank_moved_up"

[[filter]]
id = "days_picked"
label = "Days on the list"
group = "changed"
kind = "range"
field = "column:days_picked"
bins = [1, 2, 3, 5, 10, 20]
guide = "term:filter_days_picked"

