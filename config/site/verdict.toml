# The thresholds behind an edge's verdict (Works / Promising / Not working / Not enough data /
# Waiting on data), read by services/read/evaluation/verdict.py. A "trade" is an independent
# session of the official result. Out-of-sample (OOS) is the slice from the edge's split date.

min_oos_trades = 40      # fewer out-of-sample trades than this: Not enough data (owner, 2026-10-09)
works_trades = 100       # Works needs this many trades ...
works_oos_trades = 40    # ... of which this many out-of-sample

not_working_t = 1.0      # top-vs-bottom decile t below this: Not working
promising_t = 2.0        # Promising needs at least this t
works_t = 3.0            # Works needs at least this t
works_picks_t = 3.0      # ... and this t on the picks series (the t of its Sharpe ratio); owner 2026-10-17

not_working_dsr = 0.5    # deflated Sharpe below this: Not working
promising_dsr = 0.80
works_dsr = 0.95

max_pbo = 0.5            # probability of overfitting above this: Not working
works_max_pbo = 0.2

oos_lift_share = 0.5     # OOS lift must keep this share of the whole-history lift

random_beat_share = 0.95 # Works: the out-of-sample lift beats at least this share of the 1,000
                         # random-pick backtests the harness draws (random_picks.DEFAULT_DRAWS)

forward_sessions = 20    # a new version's forward test lasts this many sessions before it may replace
live_min_sessions = 10     # closed signal sessions (the picks of one night are correlated: the unit) before judging
live_low = 0.10          # the usual range of the live win rate: these quantiles of the wins ...
live_high = 0.90         # ... n signal sessions would show if the backtest's win rate held
capacity_adv_floor_usd = 5000000 # a pick trading less than this (20-day average dollar volume at the
                         # decision session) counts as low liquidity in an edge's capacity figures
capacity_position_usd = 100000 # the position the capacity page sizes against a pick's volume
                         # (read when served, not stored: a change needs no run)

[edge_costs]               # ADR 0064: the round-trip costs (bp) a return edge is also measured at,
levels_bps = [0, 15, 30, 50] # beside its own cost_bps; in the leg key (a change recomputes every leg)
borrow_bps_annual = 100       # the short leg's assumed borrow cost a year (bp; no borrow data
                              # is stored): only for an edge with side short / long_short, in
                              # the leg key of such edges only; names must clear the ADV floor

[published_haircut]        # ADR 0065: the share of a paper's figure to expect lost by the time it is
short = 0.5                # a short leg: as the spread (ADR 0065 amendment)
long_short = 0.5           # traded, by the paper's leg (`[published] leg`); shown beside the figure,
long = 0.333          # never a verdict input

[decoys]                   # ADR 0053 amendment 2026-10-18: what `baselines = ["@standard"]` expands to,
standard = [               # the decoy battery every edge is compared with on the same sessions: the
  "size_small",            # size and momentum yardsticks, then the idiosyncratic-volatility, lottery
  "momentum_12_1",         # (MAX), illiquidity and low-beta anomalies; each needs a screener preset and
  "ivol_high",             # a Guide playbook (a fitness test). composite_mispricing joins once filed.
  "max_ret_high",          # A decoy that is the edge's own screener is dropped for that edge. A changed
  "amihud_illiquid",       # list is a new run (baselines are in the run hash), never a new trial.
  "beta_low",
]
