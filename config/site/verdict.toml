# The thresholds behind an edge's verdict (Works / Promising / Not working / Not enough data /
# Waiting on data), read by services/read/evaluation/verdict.py. A "trade" is an independent
# session of the official result. Out-of-sample (OOS) is the slice from the edge's split date.

min_oos_trades = 40      # fewer out-of-sample trades than this: Not enough data (owner, 2026-10-09)
works_trades = 100       # Works needs this many trades ...
works_oos_trades = 40    # ... of which this many out-of-sample

not_working_t = 1.0      # top-vs-bottom decile t below this: Not working
promising_t = 2.0        # Promising needs at least this t
works_t = 3.0            # Works needs at least this t

not_working_dsr = 0.5    # deflated Sharpe below this: Not working
promising_dsr = 0.80
works_dsr = 0.95

max_pbo = 0.5            # probability of overfitting above this: Not working
works_max_pbo = 0.2

oos_lift_share = 0.5     # OOS lift must keep this share of the whole-history lift

forward_sessions = 20    # a new version's forward test lasts this many sessions before it may replace
live_min_trades = 10     # closed paper trades before the live record is judged against the backtest
live_low = 0.10          # the usual range of the live win rate: these quantiles of the wins ...
live_high = 0.90         # ... n trades would show if the backtest's win rate held
