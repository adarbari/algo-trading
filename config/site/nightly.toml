# L3 site setting: how the nightly workflow runs (apps/ingestion/workflows/nightly/nightly.py).

[sessions]                       # which exchange sessions a nightly run ingests (core/time/calendar.py)
settle_minutes = 30              # a session counts as closed this long after its close (16:00 / 13:00 New York);
                                 # the launchd agent (`algotrade-ingest schedule`) runs at 15:00 PT, at login and hourly,
                                 # so a start at or after close + settle may begin the nightly before 15:00
max_catch_up = 5                 # after missed nights, ingest at most this many sessions (the latest ones)

[schedule]                       # ADR 0043: a step whose source has not published the session yet WAITS
data_deadline = "23:00"          # (not FAILED) until this time on the session's date, America/Los_Angeles;
                                 # after it, FAILED. Override one step: [steps.<name>] deadline = "HH:MM"
                                 # [steps.chains] settle_minutes = N: the step WAITS (no fetch) until the
                                 # close + N minutes; unset = fetch at once. Each attempt records when the
                                 # data arrived (`algotrade-ingest arrivals`); set it from ~15 nights of those

[alerts]
max_duration_minutes = 150       # a nightly run (the market-daily path only) longer than this is recorded as a WARN (paced Cboe chains take ~75 min)

[post]                           # the post-session workflow (ADR 0070): descriptions, verify, edge-eval after the nightly
max_duration_minutes = 360       # a post-session run longer than this is recorded as a WARN (the weekly audit takes ~3 h)

[notify]                         # after every run (desktop: only when the status is not COMPLETE)
enabled = true                   # false: no desktop notification and no email (the summary file is still written)
desktop = true                   # macOS notification via osascript (darwin only; never in tests)
summary_path = "var/logs/nightly-latest.json"   # every run's summary, relative to the working directory

[notify.email]                   # the daily summary email (stats + failure deep dive), sent after every run
enabled = true                   # needs ALGOTRADE_NOTIFY_EMAIL_TO / ALGOTRADE_SMTP_USER / ALGOTRADE_SMTP_PASSWORD are set (.env)
smtp_host = "smtp.gmail.com"     # SMTP server (STARTTLS on 587; 465 uses implicit TLS)
smtp_port = 587
max_examples = 5                 # examples listed per failure group

[resources]                      # what a running ingest may take from the Mac that also serves the web (2026-10-19)
arrow_cpu_threads = 2            # Arrow's decode threads in the ingest process (the API caps itself at 2 / 4 too)
arrow_io_threads = 4
min_free_gb = 6                  # TEMPORARY 2026-10-20 (owner): lowered from 15 so the outcomes compaction (needs the floor + a partition free) can run beside the backfill; restore 15 once it is done. The nightly refuses to start with less free on the data volume (a full disk stops every agent); make doctor warns below it

[serving]                        # the served API's own limit (docs/perf/api-memory.md)
warm_ceiling_mb = 3000           # the cache warmer starts no new step while the API's footprint is above this (MB)

[backfilling]                    # ADR 0055 amendment 2026-10-20: a table still being backfilled. A screener short of coverage
                                 # only for want of these (HARD criteria on them) is a WARN `backfilling` while until >= today's UTC date
                                 # (wall clock: lapses even for catch-up; a 22:00 ET run is already the next UTC day), never a failed screens step; after `until` it fails again. The PR that confirms a backfill deletes its entry.
"rollups/instrument/filing_text_similarity@v1" = { until = "2026-11-03", reason = "filing text backfill (lazy_prices_similar, risk_factor_unchanged) takes days" }
"rollups/instrument/etf_launches@v1" = { until = "2026-11-03", reason = "etf_launches backfill (etf_launch_recent) in progress" }
"rollups/instrument/short_interest@v1" = { until = "2026-11-03", reason = "short-interest backfill stamped known_from 2026-10-20: no session before it reads it until restamped (ADR 0050 amendment)" }

[history_copy]                   # the history-copy step (ADR 0060): a read-optimised copy of long reads
enabled = true                   # false: the nightly skips the step (the copies already built still serve)
market_prefix = "rollups/market/"   # every table under it is copied, all years (a few MB each)
