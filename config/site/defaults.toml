# L3 site defaults. Every config inherits these; a config's own [screening]/[backtest]/[regime]
# tables override them. See docs/design/phase-0.md (Data Layers, L3).

[screening]
min_coverage = 0.98          # below this share of processed instruments a run is PARTIAL
max_universe_age_days = 45   # an older universe makes a COMPLETE run UNIVERSE_INCOMPLETE

[backtest]
initial_cash = 100000.0
cash_buffer = 0.01
lot_size = 1.0
periods_per_year = 252
price_adjustment = "splits"  # none | splits | total_return (applied at read time)

[backtest.costs]
commission_bps = 1.0
min_commission = 0.0
slippage_bps = 5.0

[backtest.limits]
max_position_weight = 1.0
max_gross_exposure = 1.0
allow_short = false

# The market regime overlay and screener gate (ADR 0049; docs/configuration.md#regime).
# Off until enabled here, in a user's config or for one run.
[regime]
enabled = false
label = "market.regime@v1.label"  # the session's regime: CALM, CAUTION, STRESS, CRISIS
unknown_multiplier = 0.0          # size when the label is unknown: fail closed
pause_in = []                     # labels in which screeners' picks are PAUSED

[regime.multipliers]              # position size per label, in [0, 1]
CALM = 1.0
CAUTION = 0.75
STRESS = 0.5
CRISIS = 0.25

[regime.screeners.vrp_scanner]    # short volatility pauses in Storm and Severe storm
pause_in = ["STRESS", "CRISIS"]
