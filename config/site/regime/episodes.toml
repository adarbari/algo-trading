# The NBER recessions since 1969 (the Business Cycle Dating Committee's chronology), for the
# regime page's recession bands (ADR 0047). Point in time: the committee dates a turning point
# months after it, so a page shows a recession only from `announced_start` (or `start` when
# that is null) and its end only from `announced_end` (or `end` when null).
# - start / end: the first day of the NBER peak month and of the trough month.
# - announced_start / announced_end: the day the committee announced that peak / trough
#   (nber.org, "Business Cycle Dating Committee Announcements"; 1980-1983 and 1991-2021
#   read there). Null (omitted) for 1969-70 and 1973-75: NBER's page lists no announcement
#   before June 1980, so we do not guess one; the page then shows them from `start` / `end`.

[[recession]]
start = 1969-12-01
end = 1970-11-01

[[recession]]
start = 1973-11-01
end = 1975-03-01

[[recession]]
start = 1980-01-01
end = 1980-07-01
announced_start = 1980-06-03
announced_end = 1981-07-08

[[recession]]
start = 1981-07-01
end = 1982-11-01
announced_start = 1982-01-06
announced_end = 1983-07-08

[[recession]]
start = 1990-07-01
end = 1991-03-01
announced_start = 1991-04-25
announced_end = 1992-12-22

[[recession]]
start = 2001-03-01
end = 2001-11-01
announced_start = 2001-11-26
announced_end = 2003-07-17

[[recession]]
start = 2007-12-01
end = 2009-06-01
announced_start = 2008-12-01
announced_end = 2010-09-20

[[recession]]
start = 2020-02-01
end = 2020-04-01
announced_start = 2020-06-08
announced_end = 2021-07-19

# The window of the per-episode signal timing read (services/read/regime/timeline.py):
# - lookback_sessions: sessions before the peak the read starts (260 = about a year: the
#   slow macro signals led by 6 to 18 months, and a year shows whether one was already on
#   when the fall began without reaching into an unrelated earlier regime).
# - clear_horizon_sessions: sessions after the trough the read still looks for a signal to
#   clear (never past the session asked for).
# - gate_labels: the regime labels at which the screener gate counts as shut.
[timeline]
lookback_sessions = 260
clear_horizon_sessions = 260
gate_labels = ["STRESS", "CRISIS"]
