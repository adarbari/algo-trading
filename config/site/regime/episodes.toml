nber_end = 2001-11-01
kind = "recession"
cause = "Dot-com valuations (CAPE 44), Fed funds to 6.5% and a capex bust, then 9/11 and the Enron and WorldCom frauds."
known_from = 2002-10-09
notes = "Extreme valuation, a hiking Fed, an inverted curve and breadth that broke a year before the index."

[[episode]]
