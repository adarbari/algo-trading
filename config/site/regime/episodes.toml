spx_drawdown = -0.34
nasdaq_drawdown = -0.30
recession = true
nber_start = 2020-02-01
nber_end = 2020-04-01
kind = "recession"
cause = "COVID shutdowns froze credit markets until the Fed cut to zero and began unlimited QE."
known_from = 2020-03-23
notes = "The curve had inverted in 2019 and manufacturing was weak for five months; the fast signs fired within days."

[[episode]]
key = "hikes_2022"
peak = 2022-01-03
trough = 2022-10-12
spx_drawdown = -0.25
nasdaq_drawdown = -0.36
recession = false
kind = "shock"
cause = "CPI near 9%, Fed funds from 0 to 4.5% in a year, QT and the war in Ukraine re-rated long-duration growth stocks."
known_from = 2022-10-12
notes = "Inflation, a fast-hiking Fed and narrow breadth in late 2021; two negative GDP quarters but no NBER recession; the Nasdaq fell from Nov 2021 to Dec 2022."

[[episode]]
key = "tariffs_2025"
peak = 2025-02-19
trough = 2025-04-08
spx_drawdown = -0.19
nasdaq_drawdown = -0.24
recession = false
kind = "shock"
cause = "The April 2 'Liberation Day' tariffs; the 90-day pause on April 9 began the recovery, with a new high by June 27."
