[[episode]]
key = "qt_2018"
peak = 2018-09-20
trough = 2018-12-24
spx_drawdown = -0.20
nasdaq_drawdown = -0.24
recession = false
kind = "shock"
cause = "Fed hikes with balance-sheet runoff on autopilot, the trade war and a growth scare; the Fed pivoted in January 2019."
known_from = 2018-12-24
notes = "A Fed tightening into a high market and narrowing breadth; VIX backwardation and wider HY spreads confirmed fast."

[[episode]]
key = "covid_2020"
