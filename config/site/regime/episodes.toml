# The twelve S&P 500 drawdowns of 19% or more (closing basis) since 1970: the regime track's
# reference episodes (docs/market-regime-plan.md section 2; ADR 0046).
#
# Dates are re-derived by the Pagan-Sossounov dating in RG3 (quant/turning_points.py) from
# index history; these are the reference values that dating is checked against.
# - peak / trough: closing-basis S&P 500 peak and trough sessions.
# - spx_drawdown / nasdaq_drawdown: peak-to-trough fractions (negative); Nasdaq values marked
#   "about" in the plan are approximate, and its own window can differ (see notes).
# - recession: an NBER recession overlaps the episode; nber_start / nber_end are the NBER
#   peak and trough months, written as the first day of the month.
# - kind: "recession" (a recession bear) or "shock" (a shock or re-rating, no recession).
# - known_from: the trough date, the earliest session a feature about the episode may be
#   non-null (no feature may know an episode's depth before it ended).
# - notes: the warnings that were visible before or during the fall.

[[episode]]
key = "oil_1973"
peak = 1973-01-11
trough = 1974-10-03
spx_drawdown = -0.48
nasdaq_drawdown = -0.60
recession = true
nber_start = 1973-11-01
nber_end = 1975-03-01
kind = "recession"
cause = "The oil embargo, high inflation and Fed funds rising from 3.5% to 13% hit stretched Nifty-Fifty valuations as Bretton Woods collapsed."
known_from = 1974-10-03
notes = "A hiking Fed and stretched valuations before the embargo; Nasdaq depth is approximate."

[[episode]]
key = "volcker_1980"
peak = 1980-11-28
trough = 1982-08-12
spx_drawdown = -0.27
nasdaq_drawdown = -0.25
recession = true
nber_start = 1981-07-01
nber_end = 1982-11-01
kind = "recession"
cause = "Volcker's hikes to 19-20% caused a double-dip recession with unemployment reaching 10.8%."
known_from = 1982-08-12
notes = "Policy rates near 20% and an inverted curve; the first dip (Jan - Jul 1980) came before this peak; Nasdaq depth is approximate."

[[episode]]
key = "crash_1987"
peak = 1987-08-25
trough = 1987-12-04
spx_drawdown = -0.34
nasdaq_drawdown = -0.36
recession = false
kind = "shock"
cause = "Rates up 300 bp in 1987, dollar tension after the Louvre accord and portfolio insurance turned stretched valuations into a one-day 20.5% fall."
known_from = 1987-12-04
notes = "No recession warning; stretched valuations and a Fed hiking into a high market."

[[episode]]
key = "gulf_1990"
peak = 1990-07-16
trough = 1990-10-11
spx_drawdown = -0.20
nasdaq_drawdown = -0.33
recession = true
nber_start = 1990-07-01
nber_end = 1991-03-01
kind = "recession"
cause = "Iraq's invasion of Kuwait doubled the oil price on top of the savings and loan crisis and a credit crunch."
known_from = 1990-10-11
notes = "Tightening bank lending standards and the S&L credit crunch before the oil shock."

[[episode]]
key = "ltcm_1998"
peak = 1998-07-17
trough = 1998-10-08
spx_drawdown = -0.19
nasdaq_drawdown = -0.30
recession = false
kind = "shock"
cause = "The Asian crisis, Russia's default on August 17 and the LTCM collapse; the Fed cut three times."
known_from = 1998-10-08
notes = "No recession signal; a brief curve inversion (a false alarm) and credit spreads gapping; -22% intraday."

[[episode]]
key = "dotcom_2000"
