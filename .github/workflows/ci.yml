name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # used by auto-merge.yml to re-test main after each merge

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HYPOTHESIS_PROFILE: ci

jobs:
  # Which side a pull request touches (docs/ci.md). main (push, post-merge re-test) runs all.
  changes:
    name: Changed areas
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.areas.outputs.python }}
      web: ${{ steps.areas.outputs.web }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 2 } # a PR checks out its merge commit: parent 1 is the base
      - id: areas
        env:
          EVENT: ${{ github.event_name }}
        run: |
          python=false web=false
          if [ "$EVENT" != pull_request ]; then python=true web=true; fi
          while IFS= read -r f; do
            case "$f" in
              "") ;;
              .github/workflows/ci.yml | apps/api/openapi.json | apps/api/schema.graphql) python=true web=true ;;
              apps/web/*) web=true ;;
              *) python=true ;;
            esac
          done < <(git diff --name-only HEAD^1 HEAD)
          echo "python=$python web=$web"
          echo "python=$python" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"

  quality:
    name: Lint, types, boundaries, ownership, duplicates, file length, strategy evaluation
    needs: [changes]
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with: { python-version: "3.12", enable-cache: true }
      - run: uv sync --all-packages --locked
      - run: make lock-check
      - run: make lint
      - run: make typecheck
      - run: make arch
      - run: make ownership
      - run: make dupes
      - run: make filelen
      - run: make numbering
      - run: make datasets-verify
      - name: Run every strategy on every golden dataset vs the baseline
        run: make evaluate
      - name: Publish scorecard
        if: always()
        run: test -f scorecard.md && cat scorecard.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: scorecard, path: scorecard.md, if-no-files-found: ignore }

  test:
    name: Tests (py${{ matrix.python }})
    needs: [changes]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # PRs test the primary version; every push to main (and the post-merge re-test) runs both.
        python: ${{ fromJSON(github.event_name == 'pull_request' && '["3.12"]' || '["3.12", "3.13"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with: { python-version: "${{ matrix.python }}", enable-cache: true }
      - uses: actions/cache@v6
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ matrix.python }}-${{ hashFiles('uv.lock') }}
      - run: uv sync --all-packages --locked
      # Hypothesis keeps failing examples here and replays them first on the next run.
      - uses: actions/cache@v6
        if: needs.changes.outputs.python == 'true'
        with:
          path: .hypothesis
          key: hypothesis-${{ runner.os }}-py${{ matrix.python }}-${{ github.run_id }}
          restore-keys: hypothesis-${{ runner.os }}-py${{ matrix.python }}-
      - name: Unit + architecture + property + integration + e2e (coverage gate 90%, one worker per CPU)
        if: needs.changes.outputs.python == 'true'
        run: make test
      # A web-only change still answers to the layout rules (architecture/web_layout.toml [[web_dir]]).
      - name: Architecture only (the change is web-only)
        if: needs.changes.outputs.python != 'true'
        run: .venv/bin/python -m pytest -q -n auto tests/architecture
      - uses: actions/upload-artifact@v7
        if: matrix.python == '3.12' && needs.changes.outputs.python == 'true'
        with: { name: coverage, path: coverage.xml }

  # The real app, not mocks: the Vite dev server against the real API on an EMPTY store and the
  # golden fixture store, every route in both workspaces (apps/web/real, docs/ui/architecture.md).
  # Fails on a console error, the Vite error overlay or a loading state that never resolves. It
  # needs both toolchains, so it is its own job and runs for a change on either side.
  real-app:
    name: Real app smoke (Vite dev + real API, empty and golden stores)
    needs: [changes]
    if: needs.changes.outputs.python == 'true' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with: { python-version: "3.12", enable-cache: true }
      - run: uv sync --all-packages --locked
      - uses: actions/setup-node@v6
        with: { node-version: "24" }
      - run: npm ci --no-fund --no-audit
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: make web-real
      - uses: actions/upload-artifact@v7
        if: failure()
        with: { name: real-app-report, path: "apps/web/playwright-report\napps/web/test-results", if-no-files-found: ignore }

  web:
    name: Web (lint, types, unit, design system, build, Storybook, e2e, screenshots)
    needs: [changes]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    # The official Playwright image: browsers and fonts identical to the screenshot baselines
    # (apps/web/scripts/in-playwright-docker.sh uses the same image locally). Its tag must
    # match @playwright/test in apps/web/package-lock.json (checked below).
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    defaults:
      run:
        working-directory: apps/web
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v7
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('apps/web/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - run: npm ci --no-fund --no-audit
      - name: No high or critical advisories in shipped dependencies (dev tooling is reported, not gated)
        run: npm audit --omit=dev --audit-level=high && { npm audit --audit-level=high || true; }
      - name: Playwright image matches the locked @playwright/test
        run: |
          locked=$(node -p "require('@playwright/test/package.json').version")
          test "$locked" = "1.63.0" || { echo "bump the web job's container image to v$locked-noble"; exit 1; }
      - name: Generated files fresh, ds:check, lint, types, unit, build, Storybook, e2e
        run: npm run check
      - name: Screenshots + axe (light and dark) over every design-system story
        run: npm run visual -- --fully-parallel  # one story per worker, not one file per worker
      - uses: actions/upload-artifact@v7
        if: failure()
        with: { name: playwright-report, path: "apps/web/playwright-report\napps/web/test-results", if-no-files-found: ignore }
