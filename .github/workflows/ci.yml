name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PY: python
  HYPOTHESIS_PROFILE: ci

jobs:
  quality:
    name: Lint, types, boundaries, file length
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - run: make lint PY=python BIN=
      - run: make typecheck PY=python BIN=
      - run: make arch PY=python BIN=
      - run: make filelen PY=python BIN=

  test:
    name: Tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}", cache: pip }
      - run: pip install -e ".[dev]"
      - name: Unit + architecture + property + integration + e2e (coverage gate 90%)
        run: make test PY=python BIN=
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with: { name: coverage, path: coverage.xml }

  evaluate:
    name: Strategy evaluation vs baseline
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - run: make datasets-verify PY=python BIN=
      - name: Run every strategy on every golden dataset
        id: eval
        run: make evaluate PY=python BIN=
      - name: Publish scorecard
        if: always()
        run: test -f scorecard.md && cat scorecard.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: scorecard, path: scorecard.md, if-no-files-found: ignore }
