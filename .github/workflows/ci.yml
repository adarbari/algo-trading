name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # used by auto-merge.yml to re-test main after each merge

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HYPOTHESIS_PROFILE: ci

jobs:
  quality:
    name: Lint, types, boundaries, file length
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with: { python-version: "3.12", enable-cache: true }
      - run: uv sync --all-packages --locked
      - run: make lock-check
      - run: make lint
      - run: make typecheck
      - run: make arch
      - run: make filelen

  test:
    name: Tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with: { python-version: "${{ matrix.python }}", enable-cache: true }
      - run: uv sync --all-packages --locked
      - name: Unit + architecture + property + integration + e2e (coverage gate 90%)
        run: make test
      - uses: actions/upload-artifact@v7
        if: matrix.python == '3.12'
        with: { name: coverage, path: coverage.xml }

  evaluate:
    name: Strategy evaluation vs baseline
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with: { python-version: "3.12", enable-cache: true }
      - run: uv sync --all-packages --locked
      - run: make datasets-verify
      - name: Run every strategy on every golden dataset
        id: eval
        run: make evaluate
      - name: Publish scorecard
        if: always()
        run: test -f scorecard.md && cat scorecard.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: scorecard, path: scorecard.md, if-no-files-found: ignore }
