name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # used by auto-merge.yml to re-test main after each merge

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HYPOTHESIS_PROFILE: ci
  ALGOTRADE_LLM: "off" # no real model call in CI (ADR 0041 amendment 2026-10-08; a fitness test pins it)
  # The official Playwright image: browsers and fonts identical to the screenshot baselines
  # (apps/web/scripts/in-playwright-docker.sh uses the same image locally). Its tag must match
  # @playwright/test in apps/web/package-lock.json (checked in the screenshots job).
  PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.64.1-noble

jobs:
  # Which side a pull request touches (docs/ci.md). main (push, post-merge re-test) runs all.
  # A docs-only change (docs/, *.md, .claude/) is neither: only the architecture tests run.
  changes:
    name: Changed areas
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.areas.outputs.python }}
      web: ${{ steps.areas.outputs.web }}
      web_deps: ${{ steps.areas.outputs.web_deps }}
      evaluate: ${{ steps.areas.outputs.evaluate }}
      visual: ${{ steps.areas.outputs.visual }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 2 } # a PR checks out its merge commit: parent 1 is the base
      - id: areas
        env:
          EVENT: ${{ github.event_name }}
        run: |
          python=false web=false web_deps=false evaluate=false visual=false
          if [ "$EVENT" != pull_request ]; then python=true web=true web_deps=true evaluate=true visual=true; fi
          while IFS= read -r f; do
            case "$f" in
              "") ;;
              .github/workflows/ci.yml) python=true web=true evaluate=true visual=true ;;
              apps/api/openapi.json | apps/api/schema.graphql) python=true web=true ;;
              apps/web/package-lock.json | apps/web/package.json | apps/web/design-system/package.json | apps/web/audit-allowlist.json) web=true web_deps=true visual=true ;;
              apps/web/src/* | apps/web/e2e/* | apps/web/real/*) web=true ;; # app code: no story, no screenshot (stories live in design-system only)
              apps/web/*) web=true visual=true ;;
              docs/* | .claude/* | *.md | LICENSE) ;; # docs only: the architecture tests cover them
              tests/* | apps/api/*) python=true ;; # the scorecard runs the backtest and ingestion apps over the golden store, not tests or the API
              *) python=true evaluate=true ;;
            esac
          done < <(git diff --name-only HEAD^1 HEAD)
          echo "python=$python web=$web web_deps=$web_deps"
          echo "python=$python" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "web_deps=$web_deps" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint, types, boundaries, ownership, duplicates, file length
    needs: [changes]
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with: { python-version: "3.12", enable-cache: true }
      - run: uv sync --all-packages --locked
      - run: make lock-check
      - run: make lint
      - run: make typecheck
      - run: make arch
      - run: make ownership
      - run: make dupes
      - run: make filelen
      - run: make numbering
      - run: make datasets-verify

  # The strategy scorecard (3 min) beside the lint job instead of after it.
  evaluate:
    name: Strategy evaluation vs the golden baseline
    needs: [changes]
    if: needs.changes.outputs.evaluate == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with: { python-version: "3.12", enable-cache: true }
      - run: uv sync --all-packages --locked
      - name: Run every strategy on every golden dataset vs the baseline
        run: make evaluate
      - name: Publish scorecard
        if: always()
        run: test -f scorecard.md && cat scorecard.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: scorecard, path: scorecard.md, if-no-files-found: ignore }

  # The protected check (its name is the branch-protection context; the two jobs above can change
  # without touching the repo settings). Passes when both passed or were skipped (a web-only or
  # docs-only change); fails on any failure.
  quality:
    name: Lint, types, boundaries, ownership, duplicates, file length, strategy evaluation
    needs: [lint, evaluate]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "quality jobs: $RESULTS"
          case " $RESULTS " in *" failure "* | *" cancelled "*) exit 1 ;; esac

  # The suite as parallel shards (Makefile TEST_SHARD_*), the big ones sliced by pytest-split
  # (`cell` = <shard>-<group>of<splits>), each with its coverage data;
  # the `tests` job below combines them under the protected name "Tests (py3.12)".
  test:
    name: Tests (py${{ matrix.python }}, ${{ matrix.cell }})
    needs: [changes]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true # a red shard frees its runners for the queue; the failing shard's log names the failure
      matrix:
        # Python 3.13 runs nightly (nightly.yml), not here.
        python: ["3.12"]
        cell:
          - unit-a-1of1
          - unit-b-1of1
          - unit-c-1of8
          - unit-c-2of8
          - unit-c-3of8
          - unit-c-4of8
          - unit-c-5of8
          - unit-c-6of8
          - unit-c-7of8
          - unit-c-8of8
          - apps-1of5
          - apps-2of5
          - apps-3of5
          - apps-4of5
          - apps-5of5
          - arch-1of1
          - rest-1of3
          - rest-2of3
          - rest-3of3
    steps:
      # Full history only on the `arch` shard, the one that runs tests/architecture:
      # tests/architecture/drafting/test_golden_unrecorded.py dates the adding commit of a golden
      # case and FAILS in a shallow clone in CI. The depth is a quoted string: a bare 0 is falsy
      # in an expression and would fall through to 1.
      - uses: actions/checkout@v7
        with: { fetch-depth: "${{ startsWith(matrix.cell, 'arch-') && '0' || '1' }}" }
      - uses: astral-sh/setup-uv@v7
        with: { python-version: "${{ matrix.python }}", enable-cache: true }
      - uses: actions/cache@v6
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ matrix.python }}-${{ hashFiles('uv.lock') }}
      - run: uv sync --all-packages --locked
      # Hypothesis keeps failing examples here and replays them first on the next run.
      - uses: actions/cache@v6
        if: needs.changes.outputs.python == 'true'
        with:
          path: .hypothesis
          key: hypothesis-${{ runner.os }}-py${{ matrix.python }}-${{ matrix.cell }}-${{ github.run_id }}
          restore-keys: hypothesis-${{ runner.os }}-py${{ matrix.python }}-${{ matrix.cell }}-
      # Per-test durations that balance the slices (pytest-split least_duration): the committed
      # .test_durations is the seed; the newest main run's merged file (saved by the `tests` job)
      # replaces it, so the slices follow the suite as it grows.
      - uses: actions/cache/restore@v6
        if: needs.changes.outputs.python == 'true'
        with:
          path: .test_durations
          key: test-durations-none
          restore-keys: test-durations-
      - name: Parse the cell (<shard>-<group>of<splits>)
        id: cell
        env:
          CELL: ${{ matrix.cell }}
        run: |
          part=${CELL##*-}
          echo "shard=${CELL%-*}" >> "$GITHUB_OUTPUT"
          echo "group=${part%of*}" >> "$GITHUB_OUTPUT"
          echo "splits=${part#*of}" >> "$GITHUB_OUTPUT"
      - name: Unit + architecture + property + integration + e2e, this shard (coverage data, no gate yet)
        if: needs.changes.outputs.python == 'true'
        run: make test-shard SHARD=${{ steps.cell.outputs.shard }} GROUP=${{ steps.cell.outputs.group }} SPLITS=${{ steps.cell.outputs.splits }}
      # A web-only or docs-only change still answers to the fitness tests: the web layout rules
      # (architecture/web_layout.toml [[web_dir]]), the ADR index, the roadmap cap, the links.
      - name: Architecture tests only (the change is web-only or docs-only)
        if: needs.changes.outputs.python != 'true' && steps.cell.outputs.shard == 'arch'
        run: .venv/bin/python -m pytest -q -n auto tests/architecture
      - uses: actions/upload-artifact@v7
        if: needs.changes.outputs.python == 'true'
        with:
          name: durations-${{ matrix.cell }}
          path: .durations-${{ matrix.cell }}.json
          include-hidden-files: true
          retention-days: 1
      - uses: actions/upload-artifact@v7
        if: needs.changes.outputs.python == 'true'
        with:
          name: coverage-py${{ matrix.python }}-${{ matrix.cell }}
          path: .coverage.${{ steps.cell.outputs.shard }}-${{ steps.cell.outputs.group }}
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  # The protected check "Tests (py3.12)": fails when any shard failed; on a Python change it
  # combines the shards' coverage and applies the 90% gate (Makefile coverage-combine).
  # No job-level `if` beyond !cancelled(): GitHub does not expand the matrix of a skipped
  # job, so the check would report under the unexpanded name and never satisfy protection.
  tests:
    name: Tests (py${{ matrix.python }})
    needs: [changes, test]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12"]
    steps:
      - env:
          RESULT: ${{ needs.test.result }}
        run: |
          echo "shards: $RESULT"
          case "$RESULT" in failure | cancelled) exit 1 ;; esac
      - uses: actions/checkout@v7
        if: needs.changes.outputs.python == 'true'
      - uses: astral-sh/setup-uv@v7
        if: needs.changes.outputs.python == 'true'
        with: { python-version: "${{ matrix.python }}", enable-cache: true }
      - uses: actions/cache@v6
        if: needs.changes.outputs.python == 'true'
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ matrix.python }}-${{ hashFiles('uv.lock') }}
      - if: needs.changes.outputs.python == 'true'
        run: uv sync --all-packages --locked
      - uses: actions/download-artifact@v8
        if: needs.changes.outputs.python == 'true'
        with: { pattern: "coverage-py${{ matrix.python }}-*", merge-multiple: true }
      # On main, merge the shards' durations into the cache the next run's shards restore. The
      # merged file keeps tests no shard ran this time, so a partial run never forgets them.
      - uses: actions/download-artifact@v8
        if: github.ref == 'refs/heads/main' && needs.changes.outputs.python == 'true'
        with: { pattern: "durations-*", path: durations }
      - name: Merge durations (main only)
        if: github.ref == 'refs/heads/main' && needs.changes.outputs.python == 'true'
        run: .venv/bin/python scripts/ops/merge_durations.py durations .test_durations
      - uses: actions/cache/save@v6
        if: github.ref == 'refs/heads/main' && needs.changes.outputs.python == 'true'
        with:
          path: .test_durations
          key: test-durations-${{ github.run_id }}
      # The balance guard: a shard over 5 minutes (setup included) means the durations are stale.
      - name: Warn when a shard is slower than 5 minutes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" --paginate \
            --jq '.jobs[] | select(.name | startswith("Tests (py")) | select(.completed_at != null) | [.name, ((.completed_at|fromdate) - (.started_at|fromdate))] | @tsv' |
            awk -F'\t' '$2 > 300 { printf "::warning::%s took %ss (> 300s): refresh the durations or add slices\n", $1, $2 }'
      - name: Coverage gate 90% over the shards
        if: needs.changes.outputs.python == 'true'
        run: make coverage-combine
      - uses: actions/upload-artifact@v7
        if: matrix.python == '3.12' && needs.changes.outputs.python == 'true'
        with: { name: coverage, path: coverage.xml }

  # The real app, not mocks: the Vite dev server against the real API on an EMPTY store and the
  # golden fixture store, every route in both workspaces (apps/web/real, docs/ui/architecture.md).
  # Fails on a console error, the Vite error overlay or a loading state that never resolves. It
  # needs both toolchains, so it is its own job and runs for a change on either side.
  real-app:
    name: Real app smoke (Vite dev + real API, empty and golden stores)
    needs: [changes]
    if: needs.changes.outputs.python == 'true' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with: { python-version: "3.12", enable-cache: true }
      - run: uv sync --all-packages --locked
      - uses: actions/setup-node@v7
        with: { node-version: "24" }
      - uses: actions/cache@v6
        id: node-modules
        with:
          path: apps/web/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('apps/web/package-lock.json') }}
      - if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci --no-fund --no-audit
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: make web-real
      - uses: actions/upload-artifact@v7
        if: failure()
        with: { name: real-app-report, path: "apps/web/playwright-report\napps/web/test-results", if-no-files-found: ignore }

  # ---------------------------------------------------------------------------------- web
  # Five jobs in parallel instead of one serial job (docs/ci.md "Pipeline"): the static checks
  # and unit tests; the production build with the e2e suite; the Storybook build, handed as an
  # artifact to the screenshot shards. They share one node_modules cache keyed on the lockfile.
  web-static:
    name: Web static (generated files, ds:check, lint, types, unit)
    needs: [changes]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "24" }
      - uses: actions/cache@v6
        id: node-modules
        with:
          path: apps/web/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('apps/web/package-lock.json') }}
      - if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci --no-fund --no-audit
      - name: No high or critical advisories in shipped dependencies
        if: needs.changes.outputs.web_deps == 'true' # 44 s; only a dependency change can alter the answer
        run: npm audit --omit=dev --audit-level=high
      - name: No high or critical advisories in any dependency, dev tools included, outside the reviewed allow-list
        if: needs.changes.outputs.web_deps == 'true'
        run: npm run audit:check # scripts/check-audit.ts over audit-allowlist.json (docs/ci.md "Dependency audit")
      - name: Registry signatures and provenance of every installed package
        if: needs.changes.outputs.web_deps == 'true'
        run: npm audit signatures
      - run: npm run generated:check
      - run: npm run ds:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test

  web-e2e:
    name: Web e2e (production build, Playwright)
    needs: [changes]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    defaults:
      run:
        working-directory: apps/web
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v7
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/cache@v6
        id: node-modules
        with:
          path: apps/web/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('apps/web/package-lock.json') }}
      - if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci --no-fund --no-audit
      # `npm run e2e` builds the production bundle itself (playwright.config.ts webServer):
      # the `tsc -b` half of `npm run build` is web-static's typecheck.
      - name: "Production build + e2e (quarantined specs skipped: apps/web/quarantine.json)"
        run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with: { name: playwright-report-e2e, path: "apps/web/playwright-report\napps/web/test-results", if-no-files-found: ignore }

  web-storybook:
    name: Web Storybook build
    needs: [changes]
    if: needs.changes.outputs.visual == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "24" }
      - uses: actions/cache@v6
        id: node-modules
        with:
          path: apps/web/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('apps/web/package-lock.json') }}
      - if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci --no-fund --no-audit
      - run: npm run storybook:build
      - uses: actions/upload-artifact@v7
        with: { name: storybook-static, path: apps/web/storybook-static, retention-days: 1, if-no-files-found: error }

  web-screenshots:
    name: Web screenshots + axe (shard ${{ matrix.shard }} of 4)
    needs: [changes, web-storybook]
    if: needs.changes.outputs.visual == 'true'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: apps/web
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v7
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/cache@v6
        id: node-modules
        with:
          path: apps/web/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('apps/web/package-lock.json') }}
      - if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci --no-fund --no-audit
      - name: Playwright image matches the locked @playwright/test
        run: |
          locked=$(node -p "require('@playwright/test/package.json').version")
          test "$PLAYWRIGHT_IMAGE" = "mcr.microsoft.com/playwright:v$locked-noble" || { echo "bump PLAYWRIGHT_IMAGE and the container images to v$locked-noble"; exit 1; }
      - uses: actions/download-artifact@v8
        with: { name: storybook-static, path: apps/web/storybook-static }
      - name: Screenshots + axe (light and dark) over every design-system story
        run: npm run visual -- --fully-parallel --shard=${{ matrix.shard }}/4 # one story per worker, not one file per worker
      - uses: actions/upload-artifact@v7
        if: failure()
        with: { name: "playwright-report-screenshots-${{ matrix.shard }}", path: "apps/web/playwright-report\napps/web/test-results", if-no-files-found: ignore }

  # Performance budgets (docs/ci.md "Web performance"): deterministic gates only. The bundle sizes
  # from the Vite manifest, then requests, script bytes and DOM nodes per main route on the phone;
  # LCP and blocking time are reported in the job summary, never gated (shared runners are noisy).
  web-perf:
    name: Web performance budgets (bundle, requests, DOM)
    needs: [changes]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    defaults:
      run:
        working-directory: apps/web
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v7
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/cache@v6
        id: node-modules
        with:
          path: apps/web/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('apps/web/package-lock.json') }}
      - if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci --no-fund --no-audit
      - name: Production build (the e2e's Supabase placeholders)
        run: npx vite build
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_ANON_KEY: e2e-anon-key
      - name: Bundle budgets (entry chunk, per-page chunks, chart engine stays lazy)
        run: npm run perf:bundle
      - name: Request, script and DOM budgets on the phone (LCP and blocking time reported only)
        run: npm run perf:e2e

  # The one web check branch protection requires (its name is the protected context; the four
  # jobs above can change without touching the repo settings). Passes when every web job
  # passed or was skipped (a python-only or docs-only change); fails on any failure. On a
  # failure it names each failed web step and the local command that reruns it, in its log (so
  # `gh run view --log-failed` shows it) and the job summary (docs/ci.md "Reading a red web run").
  web:
    name: Web (lint, types, unit, design system, build, Storybook, e2e, screenshots)
    needs: [web-static, web-e2e, web-storybook, web-screenshots, web-perf]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "web jobs: $RESULTS"
          case " $RESULTS " in *" failure "* | *" cancelled "*) ;; *) exit 0 ;; esac
          {
            echo "### Failed web steps"
            echo "| Job | Step | Rerun locally (in apps/web) |"
            echo "|---|---|---|"
            gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" --paginate \
              --jq '.jobs[] | select(.name | startswith("Web ")) | .name as $j | .steps[] | select(.conclusion == "failure") | [$j, .name] | @tsv' |
            while IFS=$'\t' read -r job step; do
              case "$step" in
                *generated:check*) fix="npm run generated:check (regenerate: npm run tokens / components:md / api:generate)" ;;
                *ds:check*) fix="npm run ds:check" ;;
                *"npm run lint"*) fix="npx prettier --write <files> && npx eslint --fix <files>" ;;
                *"npm run typecheck"*) fix="npm run typecheck" ;;
                *"npm run test"*) fix="npx vitest run <folder>" ;;
                *"Bundle budgets"*) fix="npm run perf:bundle (budgets: perf-budgets.json, docs/ci.md)" ;;
                *"DOM budgets"*) fix="npm run perf:e2e" ;;
                *Screenshots*) fix="npm run visual:docker -- --grep <Component>, or the update-screenshots label" ;;
                *e2e*) fix="npx playwright test e2e/<spec>.spec.ts" ;;
                *advisories* | *signatures*) fix="npm run audit:check" ;;
                *) fix="see the job log" ;;
              esac
              echo "| $job | $step | \`$fix\` |"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 1
