name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # used by auto-merge.yml to re-test main after each merge

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HYPOTHESIS_PROFILE: ci

jobs:
  # Which side a pull request touches (docs/ci.md). main (push, post-merge re-test) runs all.
  changes:
    name: Changed areas
    runs-on: [self-hosted, macOS, ARM64] # the owner's Mac (docs/ci.md): no Actions minutes
    outputs:
      python: ${{ steps.areas.outputs.python }}
      web: ${{ steps.areas.outputs.web }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 2 } # a PR checks out its merge commit: parent 1 is the base
      - id: areas
        env:
          EVENT: ${{ github.event_name }}
        run: |
          python=false web=false
          if [ "$EVENT" != pull_request ]; then python=true web=true; fi
          while IFS= read -r f; do
            case "$f" in
              "") ;;
              .github/workflows/ci.yml | apps/api/openapi.json) python=true web=true ;;
              apps/web/*) web=true ;;
              *) python=true ;;
            esac
          done < <(git diff --name-only HEAD^1 HEAD)
          echo "python=$python web=$web"
          echo "python=$python" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"

  quality:
    name: Lint, types, boundaries, ownership, duplicates, file length, strategy evaluation
    needs: [changes]
    if: needs.changes.outputs.python == 'true'
    runs-on: [self-hosted, macOS, ARM64] # the owner's Mac (docs/ci.md): no Actions minutes
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with: { python-version: "3.12", enable-cache: false } # uv's own cache persists on the Mac
      - run: uv sync --all-packages --locked
      - run: make lock-check
      - run: make lint
      - run: make typecheck
      - run: make arch
      - run: make ownership
      - run: make dupes
      - run: make filelen
      - run: make datasets-verify
      - name: Run every strategy on every golden dataset vs the baseline
        run: make evaluate
      - name: Publish scorecard
        if: always()
        run: test -f scorecard.md && cat scorecard.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: scorecard, path: scorecard.md, if-no-files-found: ignore }

  test:
    name: Tests (py${{ matrix.python }})
    needs: [changes]
    runs-on: [self-hosted, macOS, ARM64] # the owner's Mac (docs/ci.md): no Actions minutes
    strategy:
      fail-fast: false
      matrix:
        # PRs test the primary version; every push to main (and the post-merge re-test) runs both.
        python: ${{ fromJSON(github.event_name == 'pull_request' && '["3.12"]' || '["3.12", "3.13"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with: { python-version: "${{ matrix.python }}", enable-cache: false } # uv's own cache persists on the Mac
      - run: uv sync --all-packages --locked
      # Hypothesis keeps failing examples here and replays them first on the next run.
      - uses: actions/cache@v6
        if: needs.changes.outputs.python == 'true'
        with:
          path: .hypothesis
          key: hypothesis-${{ runner.os }}-py${{ matrix.python }}-${{ github.run_id }}
          restore-keys: hypothesis-${{ runner.os }}-py${{ matrix.python }}-
      - name: Unit + architecture + property + integration + e2e (coverage gate 90%, one worker per CPU)
        if: needs.changes.outputs.python == 'true'
        run: make test
      # A web-only change still answers to the layout rules (architecture/layout.toml [[web_dir]]).
      - name: Architecture only (the change is web-only)
        if: needs.changes.outputs.python != 'true'
        run: .venv/bin/python -m pytest -q -n auto tests/architecture
      - uses: actions/upload-artifact@v7
        if: matrix.python == '3.12' && needs.changes.outputs.python == 'true'
        with: { name: coverage, path: coverage.xml }

  web:
    name: Web (lint, types, unit, design system, build, Storybook, e2e, screenshots)
    needs: [changes]
    if: needs.changes.outputs.web == 'true'
    runs-on: [self-hosted, macOS, ARM64] # the owner's Mac (docs/ci.md): no Actions minutes
    steps:
      - uses: actions/checkout@v7
      # Everything runs in the official Playwright image (Linux, browsers and fonts identical
      # to the screenshot baselines; apps/web/scripts/in-playwright-docker.sh is the same
      # locally), tagged by the locked @playwright/test, so the two cannot drift. node_modules
      # and the npm cache live in Docker volumes per runner: fast, and concurrent jobs on the
      # same Mac never share them.
      - name: npm audit, generated files fresh, ds:check, lint, types, unit, build, Storybook, e2e, screenshots + axe
        env:
          VOLUMES: algotrade-web-${{ runner.name }}
        run: |
          version=$(jq -r '.packages["node_modules/@playwright/test"].version' apps/web/package-lock.json)
          docker run --rm --init --ipc=host -e CI=1 \
            -v "$PWD":/work -w /work/apps/web \
            -v "$VOLUMES-node-modules":/work/apps/web/node_modules \
            -v "$VOLUMES-npm-cache":/root/.npm \
            "mcr.microsoft.com/playwright:v$version-noble" \
            bash -euo pipefail -c '
              git config --global --add safe.directory /work
              npm ci --no-fund --no-audit
              # high/critical advisories in shipped dependencies fail; dev tooling is reported
              npm audit --omit=dev --audit-level=high && { npm audit --audit-level=high || true; }
              npm run check
              npm run visual -- --fully-parallel  # one story per worker, not one file per worker'
      - uses: actions/upload-artifact@v7
        if: failure()
        with: { name: playwright-report, path: "apps/web/playwright-report\napps/web/test-results", if-no-files-found: ignore }
