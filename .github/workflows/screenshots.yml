name: Screenshot baselines

# Regenerates the committed Linux screenshot baselines in the same Playwright image CI
# compares them in (docs/ci.md "Screenshot baselines from CI"), so nobody needs Docker:
# add the label `update-screenshots` to a pull request (or run this workflow by hand on a
# branch). It commits the changed PNGs to the branch as github-actions[bot], removes the
# label, starts CI on the new head (a commit pushed with GITHUB_TOKEN starts no run itself),
# and never runs for a fork.
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      branch:
        description: Branch whose screenshot baselines to regenerate
        required: true

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: screenshots-${{ github.event.pull_request.number || inputs.branch }}
  cancel-in-progress: false

env:
  PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.64.1-noble
  ALGOTRADE_LLM: "off" # no real model call (ADR 0041 amendment 2026-10-08)

jobs:
  update:
    name: Update screenshot baselines
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'update-screenshots' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    defaults:
      run:
        working-directory: apps/web
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref || inputs.branch }}
          fetch-depth: 0 # the push-retry rebase needs the history
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: npm ci --no-fund --no-audit
      - run: npm run storybook:build
      - name: Regenerate the baselines (one story per worker)
        run: npm run visual -- --update-snapshots --fully-parallel
      - name: Commit the changed PNGs to the branch
        id: commit
        env:
          BRANCH: ${{ github.event.pull_request.head.ref || inputs.branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- '*.png'
          if git diff --cached --quiet; then echo "baselines already match"; exit 0; fi
          git commit -m "Update screenshot baselines (CI)"
          # The branch may have moved while the baselines rendered: on a rejected push,
          # replay the PNG commit on the new head (a PNG clash keeps ours, the fresh render).
          for attempt in 1 2 3; do
            if git push origin "HEAD:$BRANCH"; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "push rejected (attempt $attempt); rebasing on the new head"
            git fetch origin "$BRANCH"
            git rebase -X theirs "origin/$BRANCH"
          done
          echo "::error::could not push the baselines after 3 attempts"
          exit 1
    outputs:
      pushed: ${{ steps.commit.outputs.pushed }}

  # Outside the Playwright container, which has no gh: the label comes off and CI starts on the
  # new head (a push with GITHUB_TOKEN starts no run of its own), whatever the update job did.
  finish:
    name: Remove the label and start CI
    needs: update
    if: always() && needs.update.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: ${{ github.event.pull_request.head.ref || inputs.branch }}
    steps:
      - name: Remove the label
        if: always() && github.event_name == 'pull_request'
        run: gh pr edit "${{ github.event.pull_request.number }}" --repo "$GITHUB_REPOSITORY" --remove-label update-screenshots
      - name: Start CI on the new head
        if: needs.update.outputs.pushed == 'true'
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
