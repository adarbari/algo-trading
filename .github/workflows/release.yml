name: Release

# Tag vX.Y.Z on main to cut a release. The full check suite must pass before anything ships.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.12", enable-cache: true }
      - run: uv sync --all-packages --locked
      - name: Full gate
        run: make check
      - name: Version must match tag
        run: |
          version=$(.venv/bin/python -c "import algotrade; print(algotrade.__version__)")
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v$version"; exit 1; }
      - run: uv build --all-packages
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
