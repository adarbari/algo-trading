name: Auto-merge

# Merges a pull request as soon as CI passes on its latest commit.
#
# GitHub's native auto-merge needs branch protection, which private repos only get on paid
# plans, so this workflow does it instead. It runs after the CI workflow completes.
# Rules:
#   - CI must have concluded "success", and every check run on that commit must have
#     passed (success / skipped / neutral), with none still running.
#   - The commit that passed must still be the PR's head (no newer, untested push).
#   - Not a draft, not from a fork, and not labelled "no-automerge".
# Merges use squash and delete the branch; stacked PRs are retargeted by GitHub.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

# Listing any permission sets every unlisted one to "none", so each API the job calls
# must appear here: checks (read check runs), pull-requests + contents (merge, delete
# branch), actions (re-run CI on the target branch).
permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: write

concurrency:
  group: auto-merge
  cancel-in-progress: false

jobs:
  merge:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Merge if every check passed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
        run: |
          set -euo pipefail
          if [ "$HEAD_REPO" != "$REPO" ]; then
            echo "PR is from a fork; not auto-merging."; exit 0
          fi
          pr=$(gh pr list --repo "$REPO" --head "$HEAD_BRANCH" --state open \
                 --json number,headRefOid,isDraft,labels \
                 --jq "[.[] | select(.headRefOid == \"$HEAD_SHA\")][0]")
          if [ -z "$pr" ] || [ "$pr" = "null" ]; then
            echo "No open PR whose head is $HEAD_SHA (newer push or already merged)."; exit 0
          fi
          number=$(jq -r .number <<<"$pr")
          echo "Candidate: #$number at $HEAD_SHA"
          if [ "$(jq -r .isDraft <<<"$pr")" = "true" ]; then
            echo "#$number is a draft; skipping."; exit 0
          fi
          if jq -e '.labels | map(.name) | index("no-automerge")' <<<"$pr" >/dev/null; then
            echo "#$number is labelled no-automerge; skipping."; exit 0
          fi
          echo "Checking every check run on $HEAD_SHA"
          bad=$(gh api "repos/$REPO/commits/$HEAD_SHA/check-runs?per_page=100" \
                  --jq '[.check_runs[] | select(.status != "completed" or
                         (.conclusion != "success" and .conclusion != "skipped" and .conclusion != "neutral"))
                         | .name] | join(", ")')
          if [ -n "$bad" ]; then
            echo "#$number has checks that did not pass: $bad"; exit 0
          fi
          echo "All checks passed; merging #$number"
          base=$(gh pr view "$number" --repo "$REPO" --json baseRefName --jq .baseRefName)
          gh pr merge "$number" --repo "$REPO" --squash --delete-branch --match-head-commit "$HEAD_SHA"
          echo "Merged #$number into $base."
          # Merges made with GITHUB_TOKEN do not trigger push workflows, so start CI on the
          # target branch explicitly; the combined result must stay green too.
          gh workflow run ci.yml --repo "$REPO" --ref "$base"
