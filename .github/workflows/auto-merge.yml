name: Auto-merge

# Merges pull requests once every CI check on their latest commit has passed.
# GitHub's native auto-merge needs branch protection (paid plan for private repos), so the
# rules live in scripts/auto_merge.sh. Each run sweeps ALL open PRs, so runs that GitHub
# cancels as duplicates (concurrency below) or misses are covered by the next one.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

# Listing any permission sets every unlisted one to "none", so each API the job calls
# must appear here: checks (read check runs), actions (read CI runs, re-run CI after a
# merge), pull-requests + contents (merge, delete branch).
permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: write

concurrency:
  group: auto-merge
  cancel-in-progress: false

jobs:
  sweep:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.event == 'pull_request'
    # A runner of its own on the owner's Mac (label `light`, no default labels), so a sweep
    # never waits behind a CI job; it only calls the GitHub API (docs/ci.md).
    runs-on: [light]
    steps:
      - uses: actions/checkout@v7 # default branch only; PR code is never checked out here
      - name: Merge every open PR that passed CI
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: scripts/auto_merge.sh
