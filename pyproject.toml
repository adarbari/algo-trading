[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

# The shared library. Apps and libs/sources are separate packages in the uv workspace below
# (ADR 0004, ADR 0027): each declares only the dependencies it needs, so vendor SDKs stay in
# libs/sources and web frameworks stay in apps/api.
[project]
name = "algotrade"
version = "0.1.0"
description = "Algorithmic trading research, backtesting and execution (shared library)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
    "pandas>=2.2",
    "pyarrow>=16",
]

[tool.hatch.build.targets.wheel]
packages = ["src/algotrade"]

[tool.uv.workspace]
members = ["libs/sources", "apps/ingestion", "apps/backtest", "apps/api"]

[tool.uv.sources]
algotrade-sources = { workspace = true }
algotrade-ingestion = { workspace = true }
algotrade-backtest = { workspace = true }
algotrade-api = { workspace = true }

[dependency-groups]
dev = [
    "algotrade-sources",
    "algotrade-ingestion",
    "algotrade-backtest",
    "algotrade-api",
    "httpx2>=2.13",  # the FastAPI / Starlette TestClient transport (tests only)
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
    "hypothesis>=6.168.3",
    "ruff>=0.6",
    "mypy>=2.3.1",
    "pandas-stubs>=2.2",
    "import-linter>=2.15",
    "pre-commit>=3.7",
    "pylint>=4.1.2",
    "pytest-xdist>=3.8",
]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "libs/sources", "apps/ingestion", "apps/backtest", "apps/api", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "N", "SIM", "C4", "PL", "RUF",
    "DTZ",  # no naive datetimes - everything is UTC
    "T20",  # no print() outside the CLI
    "PTH",  # pathlib over os.path
]
ignore = ["PLR0913", "PLR0917", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"apps/*/*/cli.py" = ["T20"]
"apps/*/*/commands.py" = ["T20"]
"apps/*/*/cli/*.py" = ["T20"]
"scripts/**" = ["T20"]
"tests/**" = ["PLR2004", "S101"]

[tool.ruff.lint.mccabe]
max-complexity = 10

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["src", "libs/sources", "apps/ingestion", "apps/backtest", "apps/api"]
packages = ["algotrade", "algotrade_sources", "algotrade_ingestion", "algotrade_backtest", "algotrade_api"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*", "openpyxl", "openpyxl.*"]  # no type stubs shipped
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
pythonpath = ["."]
markers = [
    "e2e: end-to-end tests that exercise the CLI against the golden datasets",
    "slow: tests that take more than a few seconds",
    "reconciliation: our features recomputed from recorded raw inputs vs another source's recorded values",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["algotrade", "algotrade_sources", "algotrade_ingestion", "algotrade_backtest", "algotrade_api"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@abstractmethod"]

# ---------------------------------------------------------------- import-linter
# These contracts ARE the architecture. See docs/architecture.md before changing them.
[tool.importlinter]
root_packages = ["algotrade", "algotrade_sources", "algotrade_ingestion", "algotrade_backtest", "algotrade_api"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layered library: higher layers may import lower layers, never the reverse"
type = "layers"
layers = [
    "algotrade.services",
    "algotrade.engines",
    "algotrade.strategies | algotrade.features | algotrade.analytics",
    "algotrade.data",
    "algotrade.storage | algotrade.config | algotrade.quant",
    "algotrade.core",
]

[[tool.importlinter.contracts]]
name = "Engines are independent of each other"
type = "independence"
modules = [
    "algotrade.engines.backtest",
    "algotrade.engines.screening",
    "algotrade.engines.selection",
]

[[tool.importlinter.contracts]]
name = "Backtest engine parts keep single responsibilities (risk, execution, accounting)"
type = "independence"
modules = [
    "algotrade.engines.backtest.limits",
    "algotrade.engines.backtest.sizing",
    "algotrade.engines.backtest.simulated",
    "algotrade.engines.backtest.portfolio",
]

[[tool.importlinter.contracts]]
name = "Strategies and screeners are pure: they only see core and quant"
type = "forbidden"
source_modules = ["algotrade.strategies"]
forbidden_modules = [
    "algotrade.storage",
    "algotrade.data",
    "algotrade.features",
    "algotrade.engines",
    "algotrade.services",
    "algotrade.analytics",
]

[[tool.importlinter.contracts]]
name = "Layout: quant is pure numeric code (numpy only: no pandas, pyarrow, storage, data, config or services)"
type = "forbidden"
source_modules = ["algotrade.quant"]
forbidden_modules = [
    "pandas",
    "pyarrow",
    "algotrade.storage",
    "algotrade.data",
    "algotrade.config",
    "algotrade.services",
    "algotrade.engines",
    "algotrade.strategies",
    "algotrade.features",
    "algotrade.analytics",
]

[[tool.importlinter.contracts]]
name = "Configs are pure: no storage I/O"
type = "forbidden"
source_modules = ["algotrade.config"]
forbidden_modules = ["algotrade.storage"]

[[tool.importlinter.contracts]]
name = "Rollup definitions are pure: core, quant, numpy and pandas only (no storage, data, config or services)"
type = "forbidden"
source_modules = [
    "algotrade.features.rollups",
    "algotrade.features.registry",
    "algotrade.features.framework.feature",
    "algotrade.features.framework.declaration",
    "algotrade.features.framework.columns",
]
forbidden_modules = [
    "algotrade.storage",
    "algotrade.data",
    "algotrade.config",
    "algotrade.services",
    "algotrade.engines",
    "algotrade.strategies",
    "algotrade.analytics",
    "algotrade.features.framework.runner",
]

[[tool.importlinter.contracts]]
name = "Expressions are pure: no storage, data, services or Python eval of config text"
type = "forbidden"
source_modules = [
    "algotrade.features.expressions.lexer",
    "algotrade.features.expressions.parser",
    "algotrade.features.expressions.nodes",
    "algotrade.features.expressions.checker",
    "algotrade.features.expressions.functions",
    "algotrade.features.expressions.evaluator",
    "algotrade.features.expressions.frame",
]
forbidden_modules = [
    "algotrade.storage",
    "algotrade.data",
    "algotrade.config",
    "algotrade.services",
    "algotrade.engines",
    "algotrade.strategies",
    "algotrade.features.framework.runner",
    "pyarrow",
]

[[tool.importlinter.contracts]]
name = "Features read market data only through algotrade.data (never storage)"
type = "forbidden"
source_modules = ["algotrade.features"]
forbidden_modules = ["algotrade.storage", "algotrade.services", "algotrade.engines"]
allow_indirect_imports = true  # algotrade.data hands the generic reader on

[[tool.importlinter.contracts]]
name = "Features ask algotrade.data for inputs by table name (data.feature_inputs), never a domain reader"
type = "forbidden"
source_modules = ["algotrade.features"]
forbidden_modules = [
    "algotrade.data.prices",
    "algotrade.data.events",
    "algotrade.data.chains",
    "algotrade.data.rates",
    "algotrade.data.shares",
    "algotrade.data.rollups",
    "algotrade.data.reference",
    "algotrade.data.resolver",
]
allow_indirect_imports = true  # data.feature_inputs calls the owners

[[tool.importlinter.contracts]]
name = "Only the ingestion app writes market and feature data (ADR 0005)"
type = "forbidden"
source_modules = ["algotrade", "algotrade_backtest", "algotrade_api"]
forbidden_modules = ["algotrade.storage.tables.writers"]

[[tool.importlinter.contracts]]
name = "Shared libraries never import apps (ADR 0004)"
type = "forbidden"
source_modules = ["algotrade"]
forbidden_modules = ["algotrade_ingestion", "algotrade_backtest", "algotrade_api"]

[[tool.importlinter.contracts]]
name = "Apps never import each other (ADR 0004)"
type = "independence"
modules = ["algotrade_ingestion", "algotrade_backtest", "algotrade_api"]

[[tool.importlinter.contracts]]
name = "Core is dependency-free domain code (no pandas, no I/O)"
type = "forbidden"
source_modules = ["algotrade.core"]
forbidden_modules = ["pandas"]
allow_indirect_imports = true

# ---- ADR 0024: the API is a thin, read-only HTTP layer over services.explore.

[[tool.importlinter.contracts]]
name = "API: routes reach the library only through services.explore, config and core (ADR 0024)"
type = "forbidden"
source_modules = ["algotrade_api"]
forbidden_modules = [
    "algotrade.storage",
    "algotrade.data",
    "algotrade.engines",
    "algotrade.features",
    "algotrade.strategies",
    "algotrade.quant",
    "algotrade.analytics",
    "algotrade.services.jobs",
    "algotrade.services.backtests",
    "algotrade.services.screening",
    "algotrade.services.evaluation",
    "pandas",
    "numpy",
]
allow_indirect_imports = true  # services.explore reads the stores on the API's behalf

[[tool.importlinter.contracts]]
name = "Explore queries are read-only: no writers, no jobs (ADR 0024)"
type = "forbidden"
source_modules = ["algotrade.services.explore"]
forbidden_modules = [
    "algotrade.storage.tables.writers",
    "algotrade.storage.tables.result_writer",
    "algotrade.storage.configs.writer",
    "algotrade.services.jobs",
    "algotrade.services.authoring",
]
allow_indirect_imports = true  # the backtest / screen use cases' naming helpers sit beside their writers

# ---- ADR 0019: ownership and boundaries. Every contract the restructure planned is enabled
# (no `pending_contract` remains in architecture/ownership.toml; a fitness test keeps it so).

[[tool.importlinter.contracts]]
name = "R4: vendor sources never import storage or data (standard frames carry their own schema)"
type = "forbidden"
source_modules = ["algotrade_sources"]
forbidden_modules = ["algotrade.storage", "algotrade.data"]

# ---- ADR 0027: vendor sources are a shared package (libs/sources, `algotrade_sources`).
# Ingestion uses it for batch pulls; the API may use it later for live, read-only reads (no
# contract forbids algotrade_api -> algotrade_sources.framework.registry); backtests never.

[[tool.importlinter.contracts]]
name = "Vendor sources are leaf adapters: they see only core, quant and config.env (ADR 0027)"
type = "forbidden"
source_modules = ["algotrade_sources"]
forbidden_modules = [
    "algotrade.storage",
    "algotrade.data",
    "algotrade.features",
    "algotrade.services",
    "algotrade.engines",
    "algotrade.strategies",
    "algotrade.analytics",
    "algotrade.config.site",
    "algotrade.config.strategy",
    "algotrade.config.user",
    "algotrade_ingestion",
    "algotrade_backtest",
    "algotrade_api",
]

[[tool.importlinter.contracts]]
name = "The shared library never imports vendor sources (ADR 0027)"
type = "forbidden"
source_modules = ["algotrade"]
forbidden_modules = ["algotrade_sources"]

[[tool.importlinter.contracts]]
name = "Backtests can never reach vendors (ADR 0008, ADR 0027)"
type = "forbidden"
source_modules = ["algotrade_backtest"]
forbidden_modules = ["algotrade_sources"]

# ---- Directory layout (architecture/layout.toml, tests/architecture/test_layout.py).

[[tool.importlinter.contracts]]
name = "Layout: vendors never import each other (one folder per vendor)"
type = "independence"
modules = [
    "algotrade_sources.vendors.cboe",
    "algotrade_sources.vendors.ibkr",
    "algotrade_sources.vendors.massive",
    "algotrade_sources.vendors.nasdaq",
    "algotrade_sources.vendors.sec",
    "algotrade_sources.vendors.ssga",
    "algotrade_sources.vendors.treasury",
]

[[tool.importlinter.contracts]]
name = "Broker API: only the read-only IBKR facade imports ib_async (ADR 0026)"
type = "forbidden"
source_modules = [
    "algotrade",
    "algotrade_sources",
    "algotrade_ingestion",
    "algotrade_backtest",
    "algotrade_api",
]
forbidden_modules = ["ib_async"]
ignore_imports = ["algotrade_sources.vendors.ibkr.gateway -> ib_async"]
allow_indirect_imports = true  # the registry builds the facade; nothing else touches ib_async

[[tool.importlinter.contracts]]
name = "Layout: only the source registry imports vendor folders"
type = "forbidden"
source_modules = [
    "algotrade_ingestion",
    "algotrade_api",
    "algotrade_sources.fixtures",
    "algotrade_sources.framework.base",
    "algotrade_sources.framework.http",
    "algotrade_sources.framework.limiter",
]
forbidden_modules = ["algotrade_sources.vendors"]
allow_indirect_imports = true  # cli -> sources.framework.registry -> vendors is the design

[[tool.importlinter.contracts]]
name = "Ingestion steps never import their entry points (CLI, nightly workflow, ops)"
type = "forbidden"
source_modules = ["algotrade_ingestion.tasks"]
forbidden_modules = [
    "algotrade_ingestion.cli",
    "algotrade_ingestion.workflows",
    "algotrade_ingestion.ops",
]

[[tool.importlinter.contracts]]
name = "R5: apps never build a job runner (they run jobs through the services.jobs API)"
type = "forbidden"
source_modules = [
    "algotrade_ingestion.cli",
    "algotrade_ingestion.workflows",
    "algotrade_ingestion.tasks",
    "algotrade_backtest",
]
forbidden_modules = ["algotrade.services.jobs.runner"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "R3: ingestion tasks never import vendor modules (sources come from the registry)"
type = "forbidden"
source_modules = ["algotrade_ingestion.tasks"]
forbidden_modules = [
    "algotrade_sources.vendors",
    "algotrade_sources.fixtures",
    "algotrade_sources.framework.registry",
    "algotrade_sources.framework.http",
    "algotrade_sources.framework.limiter",
]

[[tool.importlinter.contracts]]
name = "Vendor HTTP lives only in algotrade_sources (urllib.request: check_ownership.py)"
type = "forbidden"
source_modules = ["algotrade", "algotrade_backtest", "algotrade_ingestion.tasks"]
forbidden_modules = ["http", "requests"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Parquet / Arrow I/O lives only in storage backends"
type = "forbidden"
source_modules = [
    "algotrade.core",
    "algotrade.config",
    "algotrade.quant",
    "algotrade.storage.tables",
    "algotrade.storage.configs",
    "algotrade.storage.factory",
    "algotrade.storage.runs",
    "algotrade.storage.locks",
    "algotrade.data",
    "algotrade.features",
    "algotrade.strategies",
    "algotrade.analytics",
    "algotrade.engines",
    "algotrade.services",
    "algotrade_backtest",
    "algotrade_sources",
    "algotrade_ingestion",
]
forbidden_modules = ["pyarrow"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "The job runner is generic: it knows no use case, engine or market-data reader"
type = "forbidden"
source_modules = ["algotrade.services.jobs.runner", "algotrade.services.jobs.models"]
forbidden_modules = [
    "algotrade.services.backtests",
    "algotrade.services.screening",
    "algotrade.engines",
    "algotrade.data",
    "algotrade.storage.tables.readers",
    "algotrade.storage.tables.writers",
]

[[tool.importlinter.contracts]]
name = "R1: only algotrade.data reads market data (consumers never import storage readers)"
type = "forbidden"
source_modules = ["algotrade.services", "algotrade.engines", "algotrade_backtest", "algotrade_ingestion"]
forbidden_modules = ["algotrade.storage.tables.readers"]
allow_indirect_imports = true  # through algotrade.data, which hands the reader on

[[tool.importlinter.contracts]]
name = "R2: storage is generic (no domain read helpers: readers move to algotrade.data)"
type = "forbidden"
source_modules = ["algotrade.storage"]
forbidden_modules = [
    "algotrade.core.model.fields",
    "algotrade.core.views.feature_view",
    "algotrade.data",
]

# ---- Library layout (Layout PR B: core/, config/, storage/, services/ folders by kind).

[[tool.importlinter.contracts]]
name = "Layout: core subpackages are pure (no pandas, pyarrow, storage or config) at every path"
type = "forbidden"
source_modules = [
    "algotrade.core.model",
    "algotrade.core.time",
    "algotrade.core.views",
    "algotrade.core.validation",
]
forbidden_modules = ["pandas", "pyarrow", "algotrade.storage", "algotrade.config", "algotrade.data"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Layout: core model and time are the base of core (they never import views or validation)"
type = "forbidden"
source_modules = ["algotrade.core.model", "algotrade.core.time"]
forbidden_modules = ["algotrade.core.views", "algotrade.core.validation"]

[[tool.importlinter.contracts]]
name = "Layout: config documents and market tables stay separate (storage.configs never imports them)"
type = "forbidden"
source_modules = ["algotrade.storage.configs"]
forbidden_modules = ["algotrade.storage.tables", "algotrade.storage.backends"]

[[tool.importlinter.contracts]]
name = "Layout: market tables never import config documents"
type = "forbidden"
source_modules = ["algotrade.storage.tables", "algotrade.storage.backends"]
forbidden_modules = ["algotrade.storage.configs"]

[[tool.importlinter.contracts]]
name = "Layout: site settings never import strategy configs (resolve layers site defaults in)"
type = "forbidden"
source_modules = ["algotrade.config.site"]
forbidden_modules = ["algotrade.config.strategy"]

[[tool.importlinter.contracts]]
name = "Layout: use-case packages are independent (backtests, screening, authoring)"
type = "independence"
modules = ["algotrade.services.backtests", "algotrade.services.screening", "algotrade.services.authoring"]

# ---- ADR 0029: user configs are written only through services.authoring (the API calls it).
[[tool.importlinter.contracts]]
name = "Config writes go only through services.authoring (ADR 0029)"
type = "forbidden"
source_modules = [
    "algotrade_api",
    "algotrade_ingestion",
    "algotrade_backtest",
    "algotrade.analytics",
    "algotrade.config",
    "algotrade.core",
    "algotrade.data",
    "algotrade.engines",
    "algotrade.features",
    "algotrade.quant",
    "algotrade.strategies",
    "algotrade.services.backtests",
    "algotrade.services.configs",
    "algotrade.services.evaluation",
    "algotrade.services.explore",
    "algotrade.services.features",
    "algotrade.services.jobs",
    "algotrade.services.screening",
    "algotrade.storage.tables",
    "algotrade.storage.backends",
]
forbidden_modules = ["algotrade.storage.configs.writer"]
allow_indirect_imports = true  # the API reaches the writer only through services.authoring
