[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

# The shared library. Apps and libs/sources are separate packages in the uv workspace below
# (ADR 0004, ADR 0027): each declares only the dependencies it needs, so vendor SDKs stay in
# libs/sources and web frameworks stay in apps/api.
[project]
name = "algotrade"
version = "0.1.0"
description = "Algorithmic trading research, backtesting and execution (shared library)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
    "pandas>=2.2",
    "pyarrow>=16",
]

[tool.hatch.build.targets.wheel]
packages = ["src/algotrade"]

[tool.uv.workspace]
members = ["libs/sources", "apps/ingestion", "apps/backtest", "apps/api"]

[tool.uv.sources]
algotrade-sources = { workspace = true }
algotrade-ingestion = { workspace = true }
algotrade-backtest = { workspace = true }
algotrade-api = { workspace = true }

[dependency-groups]
dev = [
    "algotrade-sources",
    "algotrade-ingestion",
    "algotrade-backtest",
    "algotrade-api",
    "httpx2>=2.13",  # the FastAPI / Starlette TestClient transport (tests only)
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
    "hypothesis>=6.168.3",
    "ruff>=0.6",
    "mypy>=2.3.1",
    "pandas-stubs>=2.2",
    "import-linter>=2.15",
    "pre-commit>=3.7",
    "pylint>=4.1.2",
    "pytest-xdist>=3.8",
]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "libs/sources", "apps/ingestion", "apps/backtest", "apps/api", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "N", "SIM", "C4", "PL", "RUF",
    "DTZ",  # no naive datetimes - everything is UTC
    "T20",  # no print() outside the CLI
    "PTH",  # pathlib over os.path
]
ignore = ["PLR0913", "PLR0917", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"apps/*/*/cli.py" = ["T20"]
"apps/*/*/commands.py" = ["T20"]
"apps/*/*/cli/*.py" = ["T20"]
"scripts/**" = ["T20"]
"tests/**" = ["PLR2004", "S101"]

[tool.ruff.lint.mccabe]
max-complexity = 10

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["src", "libs/sources", "apps/ingestion", "apps/backtest", "apps/api"]
packages = ["algotrade", "algotrade_sources", "algotrade_ingestion", "algotrade_backtest", "algotrade_api"]
warn_unreachable = true
# Strawberry's types are dataclasses mypy cannot see without it (read-model PR 4).
plugins = ["strawberry.ext.mypy_plugin"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*", "openpyxl", "openpyxl.*"]  # no type stubs shipped
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not perf' --strict-markers --strict-config --import-mode=importlib"
pythonpath = ["."]
markers = [
    "e2e: end-to-end tests that exercise the CLI against the golden datasets",
    "perf: strict timing budgets that fail on a loaded machine; excluded by default, run with `make perf` (or `-m perf`) on an idle machine",
    "slow: tests that take more than a few seconds",
    "allow_localhost: the test may connect to a loopback server it starts itself (tests/conftest.py blocks all other sockets)",
    "allow_network: the test may open real network connections (tests/conftest.py)",
    "reconciliation: our features recomputed from recorded raw inputs vs another source's recorded values",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["algotrade", "algotrade_sources", "algotrade_ingestion", "algotrade_backtest", "algotrade_api"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@abstractmethod"]

# ---------------------------------------------------------------- import-linter
# These contracts ARE the architecture. See docs/architecture.md before changing them.
[tool.importlinter]
root_packages = ["algotrade", "algotrade_sources", "algotrade_ingestion", "algotrade_backtest", "algotrade_api"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layered library: higher layers may import lower layers, never the reverse"
type = "layers"
layers = [
    "algotrade.services",
    "algotrade.engines",
    "algotrade.strategies | algotrade.features | algotrade.analytics",
    "algotrade.data",
    "algotrade.storage | algotrade.config | algotrade.quant",
    "algotrade.core",
]

[[tool.importlinter.contracts]]
name = "Engines are independent of each other"
type = "independence"
modules = [
    "algotrade.engines.backtest",
    "algotrade.engines.screening",
    "algotrade.engines.selection",
]

[[tool.importlinter.contracts]]
name = "Backtest engine parts keep single responsibilities (risk, execution, accounting)"
type = "independence"
modules = [
    "algotrade.engines.backtest.limits",
    "algotrade.engines.backtest.sizing",
    "algotrade.engines.backtest.simulated",
    "algotrade.engines.backtest.portfolio",
]

[[tool.importlinter.contracts]]
name = "Strategies and screeners are pure: they only see core and quant"
type = "forbidden"
source_modules = ["algotrade.strategies"]
forbidden_modules = [
    "algotrade.storage",
    "algotrade.data",
    "algotrade.features",
    "algotrade.engines",
    "algotrade.services",
    "algotrade.analytics",
]

[[tool.importlinter.contracts]]
name = "Layout: quant is pure numeric code (numpy only: no pandas, pyarrow, storage, data, config or services)"
type = "forbidden"
source_modules = ["algotrade.quant"]
forbidden_modules = [
    "pandas",
    "pyarrow",
    "algotrade.storage",
    "algotrade.data",
    "algotrade.config",
    "algotrade.services",
    "algotrade.engines",
    "algotrade.strategies",
    "algotrade.features",
    "algotrade.analytics",
]

[[tool.importlinter.contracts]]
name = "Outcomes are quarantined: only services.evaluation reads them (ADR 0053)"
type = "protected"
protected_modules = ["algotrade.data.outcomes"]
allowed_importers = ["algotrade.services.evaluation"]

[[tool.importlinter.contracts]]
name = "Configs are pure: no storage I/O"
type = "forbidden"
source_modules = ["algotrade.config"]
forbidden_modules = ["algotrade.storage"]

[[tool.importlinter.contracts]]
name = "Rollup definitions are pure: core, quant, numpy and pandas only (no storage, data, config or services)"
type = "forbidden"
source_modules = [
    "algotrade.features.rollups",
    "algotrade.features.registry",
    "algotrade.features.framework.feature",
    "algotrade.features.framework.declaration",
    "algotrade.features.framework.columns",
]
forbidden_modules = [
    "algotrade.storage",
    "algotrade.data",
    "algotrade.config",
    "algotrade.services",
    "algotrade.engines",
    "algotrade.strategies",
    "algotrade.analytics",
    "algotrade.features.framework.runner",
]

[[tool.importlinter.contracts]]
name = "Expressions are pure: no storage, data, services or Python eval of config text"
type = "forbidden"
source_modules = [
    "algotrade.features.expressions.lexer",
    "algotrade.features.expressions.parser",
    "algotrade.features.expressions.nodes",
    "algotrade.features.expressions.checker",
    "algotrade.features.expressions.functions",
    "algotrade.features.expressions.evaluator",
    "algotrade.features.expressions.frame",
]
forbidden_modules = [
    "algotrade.storage",
    "algotrade.data",
    "algotrade.config",
    "algotrade.services",
    "algotrade.engines",
    "algotrade.strategies",
    "algotrade.features.framework.runner",
    "pyarrow",
]

[[tool.importlinter.contracts]]
name = "Features read market data only through algotrade.data (never storage)"
type = "forbidden"
source_modules = ["algotrade.features"]
forbidden_modules = ["algotrade.storage", "algotrade.services", "algotrade.engines"]
allow_indirect_imports = true  # algotrade.data hands the generic reader on

[[tool.importlinter.contracts]]
name = "Features ask algotrade.data for inputs by table name (data.feature_inputs), never a domain reader"
type = "forbidden"
source_modules = ["algotrade.features"]
forbidden_modules = [
    "algotrade.data.prices",
    "algotrade.data.events",
    "algotrade.data.chains",
    "algotrade.data.rates",
    "algotrade.data.shares",
    "algotrade.data.rollups",
    "algotrade.data.reference",
    "algotrade.data.resolver",
]
allow_indirect_imports = true  # data.feature_inputs calls the owners

[[tool.importlinter.contracts]]
name = "Only the ingestion app writes market and feature data (ADR 0005)"
type = "forbidden"
source_modules = ["algotrade", "algotrade_backtest", "algotrade_api"]
forbidden_modules = ["algotrade.storage.tables.writers"]

[[tool.importlinter.contracts]]
name = "Shared libraries never import apps (ADR 0004)"
type = "forbidden"
source_modules = ["algotrade"]
forbidden_modules = ["algotrade_ingestion", "algotrade_backtest", "algotrade_api"]

[[tool.importlinter.contracts]]
name = "Apps never import each other (ADR 0004)"
type = "independence"
modules = ["algotrade_ingestion", "algotrade_backtest", "algotrade_api"]

[[tool.importlinter.contracts]]
name = "Core is dependency-free domain code (no pandas, no I/O)"
type = "forbidden"
source_modules = ["algotrade.core"]
forbidden_modules = ["pandas"]
allow_indirect_imports = true

# ---- ADR 0024, ADR 0037: the API is a thin HTTP layer; page reads are GraphQL over services.read.

[[tool.importlinter.contracts]]
name = "API: routes reach the library only through services.read, services.preview, services.drafting, services.explaining, services.authoring, config and core (ADR 0024, ADR 0037, ADR 0041)"
type = "forbidden"
source_modules = ["algotrade_api"]
forbidden_modules = [
    "algotrade.storage",
    "algotrade.data",
    "algotrade.engines",
    "algotrade.features",
    "algotrade.strategies",
    "algotrade.quant",
    "algotrade.analytics",
    "algotrade.services.jobs",
    "algotrade.services.backtests",
    "algotrade.services.screening",
    "algotrade.services.evaluation",
    "pandas",
    "numpy",
]
allow_indirect_imports = true  # services.read and services.preview read the stores on the API's behalf
# services.live (ADR 0028) is the API's other library entry: live quotes, recorded to live/*.

[[tool.importlinter.contracts]]
name = "Drafting is read-only: no writers, no jobs, no vendors (ADR 0041)"
type = "forbidden"
source_modules = ["algotrade.services.drafting"]
forbidden_modules = [
    "algotrade.storage.tables.writers",
    "algotrade.storage.tables.result_writer",
    "algotrade.storage.configs.writer",
    "algotrade.services.jobs",
    "algotrade.services.authoring",
    "algotrade.services.ondemand",
    "algotrade.services.screening",
    "algotrade_sources",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Event scope is read-only: no writers, no jobs, no vendors (ADR 0050)"
type = "forbidden"
source_modules = ["algotrade.services.events"]
forbidden_modules = [
    "algotrade.storage.tables.writers",
    "algotrade.storage.tables.result_writer",
    "algotrade.storage.configs.writer",
    "algotrade.services.jobs",
    "algotrade.services.authoring",
    "algotrade.services.ondemand",
    "algotrade.services.screening",
    "algotrade_sources",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Explaining reads the regime and writes only its cache: no writers, no jobs, no vendors (ADR 0041)"
type = "forbidden"
source_modules = ["algotrade.services.explaining"]
forbidden_modules = [
    "algotrade.storage.tables.writers",
    "algotrade.storage.tables.result_writer",
    "algotrade.storage.configs.writer",
    "algotrade.services.jobs",
    "algotrade.services.authoring",
    "algotrade.services.ondemand",
    "algotrade.services.screening",
    "algotrade_sources",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Preview is read-only: no writers, no jobs (ADR 0029)"
type = "forbidden"
source_modules = ["algotrade.services.preview"]
forbidden_modules = [
    "algotrade.storage.tables.writers",
    "algotrade.storage.tables.result_writer",
    "algotrade.storage.configs.writer",
    "algotrade.services.jobs",
    "algotrade.services.authoring",
]
allow_indirect_imports = true  # the backtest / screen use cases' naming helpers sit beside their writers

# ---- ADR 0037: the read model (it replaced services.explore, read-model PRs 2-10b); same rule.

[[tool.importlinter.contracts]]
name = "Read model is read-only: no writers, no jobs (ADR 0037)"
type = "forbidden"
source_modules = ["algotrade.services.read"]
forbidden_modules = [
    "algotrade.storage.tables.writers",
    "algotrade.storage.tables.result_writer",
    "algotrade.storage.configs.writer",
    "algotrade.services.jobs",
    "algotrade.services.authoring",
]
allow_indirect_imports = true  # as for preview: the use cases' naming helpers sit beside their writers

[[tool.importlinter.contracts]]
name = "The read model never reaches the edge harness or the outcomes, even indirectly (ADR 0053)"
type = "forbidden"
source_modules = ["algotrade.services.read"]
forbidden_modules = ["algotrade.services.evaluation", "algotrade.data.outcomes"]

[[tool.importlinter.contracts]]
name = "GraphQL types are thin: only services.read, config, core (ADR 0037)"
type = "forbidden"
source_modules = ["algotrade_api.graphql"]
forbidden_modules = [
    "pandas",
    "numpy",
    "algotrade.data",
    "algotrade.storage",
    "algotrade.features",
    "algotrade.engines",
    "algotrade.services.preview",
    "algotrade.services.features",
    "algotrade.services.views",
    "algotrade.services.selection",
]
allow_indirect_imports = true  # services.read reads the stores (pandas) on the schema's behalf

# ---- ADR 0028: the API's live quotes write only live/* tables, only through the live writer.

[[tool.importlinter.contracts]]
name = "Live quotes write only live/* tables: no market-data writer, no jobs (ADR 0028)"
type = "forbidden"
source_modules = ["algotrade.services.live"]
forbidden_modules = ["algotrade.storage.tables.writers", "algotrade.services.jobs"]

[[tool.importlinter.contracts]]
name = "Only the live-quotes recorder imports the live writer (ADR 0028)"
type = "forbidden"
source_modules = ["algotrade", "algotrade_api", "algotrade_ingestion", "algotrade_backtest"]
forbidden_modules = ["algotrade.storage.tables.live_writer"]
ignore_imports = ["algotrade.services.live.recorder -> algotrade.storage.tables.live_writer"]
allow_indirect_imports = true  # the API reaches it only through services.live

# ---- ADR 0058: the text model's usage log writes only usage/* tables, only through the usage writer.

[[tool.importlinter.contracts]]
name = "Text-model usage writes only usage/* tables: no market-data writer, no jobs (ADR 0058)"
type = "forbidden"
source_modules = ["algotrade.services.text_model"]
forbidden_modules = ["algotrade.storage.tables.writers", "algotrade.services.jobs"]

[[tool.importlinter.contracts]]
name = "Only the text-model usage recorder imports the usage writer (ADR 0058)"
type = "forbidden"
source_modules = ["algotrade", "algotrade_api", "algotrade_ingestion", "algotrade_backtest"]
forbidden_modules = ["algotrade.storage.tables.usage_writer"]
ignore_imports = ["algotrade.services.text_model.usage -> algotrade.storage.tables.usage_writer"]
allow_indirect_imports = true  # the API reaches it only through services.text_model

# ---- ADR 0019: ownership and boundaries. Every contract the restructure planned is enabled
# (no `pending_contract` remains in architecture/*_ownership.toml; a fitness test keeps it so).

[[tool.importlinter.contracts]]
name = "R4: vendor sources never import storage or data (standard frames carry their own schema)"
type = "forbidden"
source_modules = ["algotrade_sources"]
forbidden_modules = ["algotrade.storage", "algotrade.data"]

# ---- ADR 0027: vendor sources are a shared package (libs/sources, `algotrade_sources`).
# Ingestion uses it for batch pulls; the API may use it later for live, read-only reads (no
# contract forbids algotrade_api -> algotrade_sources.framework.registry); backtests never.

[[tool.importlinter.contracts]]
name = "Vendor sources are leaf adapters: they see only core, quant and config.env (ADR 0027)"
type = "forbidden"
source_modules = ["algotrade_sources"]
forbidden_modules = [
    "algotrade.storage",
    "algotrade.data",
    "algotrade.features",
    "algotrade.services",
    "algotrade.engines",
    "algotrade.strategies",
    "algotrade.analytics",
    "algotrade.config.site",
    "algotrade.config.strategy",
    "algotrade.config.user",
    "algotrade_ingestion",
    "algotrade_backtest",
    "algotrade_api",
]

[[tool.importlinter.contracts]]
name = "The shared library never imports vendor sources (ADR 0027)"
type = "forbidden"
source_modules = ["algotrade"]
forbidden_modules = ["algotrade_sources"]

[[tool.importlinter.contracts]]
name = "Backtests can never reach vendors (ADR 0008, ADR 0027)"
type = "forbidden"
source_modules = ["algotrade_backtest"]
forbidden_modules = ["algotrade_sources"]

