[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

# The shared library. Apps are separate packages in the uv workspace below (ADR 0004):
# each declares only the dependencies it needs, so vendor SDKs stay in apps/ingestion and
# web frameworks will stay in apps/api.
[project]
name = "algotrade"
version = "0.1.0"
description = "Algorithmic trading research, backtesting and execution (shared library)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
    "pandas>=2.2",
    "pyarrow>=16",
]

[tool.hatch.build.targets.wheel]
packages = ["src/algotrade"]

[tool.uv.workspace]
members = ["apps/ingestion", "apps/backtest"]

[tool.uv.sources]
algotrade-ingestion = { workspace = true }
algotrade-backtest = { workspace = true }

[dependency-groups]
dev = [
    "algotrade-ingestion",
    "algotrade-backtest",
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
    "hypothesis>=6.168.3",
    "ruff>=0.6",
    "mypy>=2.3.1",
    "pandas-stubs>=2.2",
    "import-linter>=2.15",
    "pre-commit>=3.7",
    "pylint>=4.1.2",
]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "apps/ingestion", "apps/backtest", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "N", "SIM", "C4", "PL", "RUF",
    "DTZ",  # no naive datetimes - everything is UTC
    "T20",  # no print() outside the CLI
    "PTH",  # pathlib over os.path
]
ignore = ["PLR0913", "PLR0917", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"apps/*/*/cli.py" = ["T20"]
"apps/*/*/commands.py" = ["T20"]
"scripts/**" = ["T20"]
"tests/**" = ["PLR2004", "S101"]

[tool.ruff.lint.mccabe]
max-complexity = 10

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["src", "apps/ingestion", "apps/backtest"]
packages = ["algotrade", "algotrade_ingestion", "algotrade_backtest"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*", "openpyxl", "openpyxl.*"]  # no type stubs shipped
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
pythonpath = ["."]
markers = [
    "e2e: end-to-end tests that exercise the CLI against the golden datasets",
    "slow: tests that take more than a few seconds",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["algotrade", "algotrade_ingestion", "algotrade_backtest"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@abstractmethod"]

# ---------------------------------------------------------------- import-linter
# These contracts ARE the architecture. See docs/architecture.md before changing them.
[tool.importlinter]
root_packages = ["algotrade", "algotrade_ingestion", "algotrade_backtest"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layered library: higher layers may import lower layers, never the reverse"
type = "layers"
layers = [
    "algotrade.services",
    "algotrade.engines",
    "algotrade.strategies | algotrade.features | algotrade.analytics | algotrade.data",
    "algotrade.storage | algotrade.config",
    "algotrade.core",
]

[[tool.importlinter.contracts]]
name = "Engines are independent of each other"
type = "independence"
modules = [
    "algotrade.engines.backtest",
    "algotrade.engines.screening",
    "algotrade.engines.selection",
]

[[tool.importlinter.contracts]]
name = "Backtest engine parts keep single responsibilities (risk, execution, accounting)"
type = "independence"
modules = [
    "algotrade.engines.backtest.limits",
    "algotrade.engines.backtest.sizing",
    "algotrade.engines.backtest.simulated",
    "algotrade.engines.backtest.portfolio",
]

[[tool.importlinter.contracts]]
name = "Strategies and screeners are pure: they only see core"
type = "forbidden"
source_modules = ["algotrade.strategies"]
forbidden_modules = [
    "algotrade.storage",
    "algotrade.data",
    "algotrade.features",
    "algotrade.engines",
    "algotrade.services",
    "algotrade.analytics",
]

[[tool.importlinter.contracts]]
name = "Feature definitions and configs are pure: no storage I/O"
type = "forbidden"
source_modules = ["algotrade.features", "algotrade.config"]
forbidden_modules = ["algotrade.storage"]

[[tool.importlinter.contracts]]
name = "Only the ingestion app writes market and feature data (ADR 0005)"
type = "forbidden"
source_modules = ["algotrade", "algotrade_backtest"]
forbidden_modules = ["algotrade.storage.writers"]

[[tool.importlinter.contracts]]
name = "Shared libraries never import apps (ADR 0004)"
type = "forbidden"
source_modules = ["algotrade"]
forbidden_modules = ["algotrade_ingestion", "algotrade_backtest"]

[[tool.importlinter.contracts]]
name = "Apps never import each other (ADR 0004)"
type = "independence"
modules = ["algotrade_ingestion", "algotrade_backtest"]

[[tool.importlinter.contracts]]
name = "Core is dependency-free domain code (no pandas, no I/O)"
type = "forbidden"
source_modules = ["algotrade.core"]
forbidden_modules = ["pandas"]
allow_indirect_imports = true

# ---- ADR 0019: ownership and boundaries. Contracts that hold today; the ones that need a
# restructure PR first are listed as `pending_contract` in architecture/ownership.toml.

[[tool.importlinter.contracts]]
name = "R4 (partial): vendor sources never touch storage I/O, run records or the resolver"
type = "forbidden"
source_modules = ["algotrade_ingestion.sources"]
forbidden_modules = [
    "algotrade.storage.writers",
    "algotrade.storage.readers",
    "algotrade.storage.backends",
    "algotrade.storage.factory",
    "algotrade.storage.runs",
    "algotrade.data",
    "algotrade.storage.result_writer",
    "algotrade.storage.config_store",
]

[[tool.importlinter.contracts]]
name = "Vendor sources are leaf adapters: no steps, pipeline, CLI, settings or use cases"
type = "forbidden"
source_modules = ["algotrade_ingestion.sources"]
forbidden_modules = [
    "algotrade_ingestion.tasks",
    "algotrade_ingestion.pipeline",
    "algotrade_ingestion.commands",
    "algotrade_ingestion.cli",
    "algotrade_ingestion.settings",
    "algotrade_ingestion.schedule",
    "algotrade.services",
    "algotrade.engines",
    "algotrade.strategies",
]

[[tool.importlinter.contracts]]
name = "Ingestion steps never import their entry points (CLI, commands, nightly pipeline)"
type = "forbidden"
source_modules = ["algotrade_ingestion.tasks"]
forbidden_modules = [
    "algotrade_ingestion.cli",
    "algotrade_ingestion.commands",
    "algotrade_ingestion.pipeline",
    "algotrade_ingestion.schedule",
]

[[tool.importlinter.contracts]]
name = "Vendor HTTP lives only in ingestion sources (urllib.request: check_ownership.py)"
type = "forbidden"
source_modules = ["algotrade", "algotrade_backtest", "algotrade_ingestion.tasks"]
forbidden_modules = ["http", "requests"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Parquet / Arrow I/O lives only in storage backends"
type = "forbidden"
source_modules = [
    "algotrade.core",
    "algotrade.config",
    "algotrade.features",
    "algotrade.strategies",
    "algotrade.analytics",
    "algotrade.engines",
    "algotrade.services",
    "algotrade_backtest",
    "algotrade_ingestion",
]
forbidden_modules = ["pyarrow"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "The job runner is generic: it knows no use case, engine or market-data reader"
type = "forbidden"
source_modules = ["algotrade.services.jobs.runner", "algotrade.services.jobs.models"]
forbidden_modules = [
    "algotrade.services.backtests",
    "algotrade.services.screening",
    "algotrade.engines",
    "algotrade.data",
    "algotrade.storage.readers",
    "algotrade.storage.writers",
]

[[tool.importlinter.contracts]]
name = "R1: only algotrade.data reads market data (consumers never import storage.readers)"
type = "forbidden"
source_modules = ["algotrade.services", "algotrade.engines", "algotrade_backtest", "algotrade_ingestion"]
forbidden_modules = ["algotrade.storage.readers"]
allow_indirect_imports = true  # through algotrade.data, which hands the reader on

[[tool.importlinter.contracts]]
name = "R2: storage is generic (no domain read helpers: readers move to algotrade.data)"
type = "forbidden"
source_modules = ["algotrade.storage"]
forbidden_modules = ["algotrade.core.fields", "algotrade.core.feature_view", "algotrade.data"]
